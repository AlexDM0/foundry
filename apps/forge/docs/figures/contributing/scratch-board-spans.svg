<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Hephaestus and its agents must end before the folder goes</title>
  <desc>Ten steps along a time axis, from mktemp to rm -rf. The scratch folder's bar spans all ten. The HOME export and the other exports sit inside it. Hephaestus runs from start to stop --now, and agent sessions run on to pkill, both ending before rm -rf. Skipping stop --now leaves Hephaestus running; skipping pkill leaves the agents running.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="464" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Hephaestus and its agents must end before the folder goes</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One tick per step of the scratch board. Each bar is what is live.</text>

  <g font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="150" y="98">mktemp</text>
    <text x="256" y="98">init</text>
    <text x="362" y="98">export ROOT</text>
    <text x="468" y="98">stop --now</text>
    <text x="574" y="98">unset</text>
    <text x="203" y="114">export HOME</text>
    <text x="309" y="114">commit</text>
    <text x="415" y="114">start</text>
    <text x="521" y="114">pkill</text>
    <text x="627" y="114">rm -rf</text>
  </g>
  <path d="M150,102 V125 M256,102 V125 M362,102 V125 M468,102 V125 M574,102 V125" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <path d="M150,125 V356 M203,118 V356 M256,125 V356 M309,118 V356 M362,125 V356 M415,118 V356 M468,125 V356 M521,118 V356 M574,125 V356 M627,118 V356" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="4 4"/>

  <g font-size="12" font-weight="500" fill="#73726c">
    <text x="40" y="155">Scratch folder</text>
    <text x="40" y="201">HOME export</text>
    <text x="40" y="247">Other exports</text>
    <text x="40" y="293">Agent sessions</text>
    <text x="40" y="339">Hephaestus</text>
  </g>

  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="150" y="134" width="477" height="34" rx="6"/>
    <rect x="203" y="180" width="371" height="34" rx="6"/>
    <rect x="362" y="226" width="212" height="34" rx="6"/>
  </g>
  <g font-size="12" fill="#444441" text-anchor="middle">
    <text x="388" y="155">$SCRATCH</text>
    <text x="388" y="201">scratch home</text>
    <text x="467" y="247">ROOT, FAKE_AGENT</text>
  </g>
  <rect x="415" y="272" width="106" height="34" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <rect x="415" y="318" width="53" height="34" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M345,396 V376 H468 V359"/>
    <path d="M521,396 V313"/>
  </g>

  <g fill="#FCEBEB" stroke="#F4CFCF">
    <rect x="250" y="396" width="190" height="56" rx="8"/>
    <rect x="450" y="396" width="190" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="345" y="421" font-size="14" font-weight="500" fill="#791F1F">No stop before rm -rf</text>
    <text x="345" y="439" font-size="12" fill="#A32D2D">Hephaestus keeps running</text>
    <text x="545" y="421" font-size="14" font-weight="500" fill="#791F1F">No pkill before rm -rf</text>
    <text x="545" y="439" font-size="12" fill="#A32D2D">the agents keep running</text>
  </g>
</svg>
