<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1052" viewBox="0 0 1000 1052" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>On the normal path, every status after ticket ready is Hephaestus's</title>
  <desc>A swimlane of one ticket from ticket ready to merge-landed: User readies it, setting pending, and Hephaestus then moves it to in-progress after the build job launches, to in-review after Customs and the gates pass and code writes the Handoff, and through reviewed to delivered in the lock hold where the Airlock fast-forwards main. Builder and reviewer only commit and report, and their lines end at their reports, so no agent exists during the merge. The merge-queue mark changes no status.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="998" height="1050" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">On the normal path, every status after ticket ready is Hephaestus's</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Agents commit and report; code moves the ticket. A dark line runs only while that process lives.</text>

  <path d="M92,118 V1000 M208,118 V1000 M788,118 V1000" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
  <rect x="40" y="84" width="104" height="34" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/><text x="92" y="106" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">User</text><rect x="156" y="84" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="208" y="106" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Hephaestus</text><rect x="272" y="84" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="324" y="106" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Talos</text><rect x="388" y="84" width="104" height="34" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="440" y="106" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">builder</text><rect x="504" y="84" width="104" height="34" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="556" y="106" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">reviewer</text><rect x="620" y="84" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="672" y="106" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text><rect x="736" y="84" width="104" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="788" y="106" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">git</text>
  <rect x="852" y="84" width="108" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="906" y="106" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">ticket status</text>
  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="852" y="132" width="108" height="144" rx="8"/><rect x="852" y="280" width="108" height="294" rx="8"/>
    <rect x="852" y="578" width="108" height="394" rx="8"/><rect x="852" y="976" width="108" height="28" rx="8"/>
  </g>
  <g font-size="12.5" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="906" y="209">pending</text><text x="906" y="432">in-progress</text><text x="906" y="780">in-review</text><text x="906" y="995">delivered</text>
  </g>

  <rect x="216" y="186" width="266" height="46" rx="6" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="5 4"/>
  <path d="M324,326 V410 M440,326 V410 M324,502 V534 M324,622 V706 M556,622 V706 M672,832 V984" fill="none" stroke="#888780" stroke-width="1.4"/>
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"><path d="M214,284 H783"/><path d="M214,326 H318"/><path d="M330,326 H434"/><path d="M446,368 H783"/><path d="M324,410 H214"/><path d="M440,410 H330"/><path d="M214,502 H318"/><path d="M324,534 H214"/><path d="M214,622 H318"/><path d="M330,622 H550"/><path d="M562,664 H783"/><path d="M324,706 H214"/><path d="M556,706 H330"/><path d="M214,832 H666"/><path d="M678,874 H783"/><path d="M678,950 H783"/></g>
  <g font-size="12" fill="#5F5E5A"><text x="498" y="277" text-anchor="middle">next Pass: in-progress, adds worktree on ticket-003</text><text x="266" y="319" text-anchor="middle">spawns</text><text x="382" y="319" text-anchor="middle">runs session</text><text x="614" y="361" text-anchor="middle">commits on ticket-003</text><text x="266" y="403" text-anchor="middle">events</text><text x="382" y="403" text-anchor="middle">report</text><text x="266" y="495" text-anchor="middle">gates</text><text x="266" y="527" text-anchor="middle">passed</text><text x="336" y="506" text-anchor="start">each gate runs under Talos</text><text x="266" y="615" text-anchor="middle">spawns</text><text x="440" y="615" text-anchor="middle">runs session</text><text x="671" y="657" text-anchor="middle">its fixes, if any</text><text x="266" y="699" text-anchor="middle">events</text><text x="440" y="699" text-anchor="middle">report</text><text x="450" y="825" text-anchor="middle">sweep claims the Airlock: merge job</text><text x="658" y="878" text-anchor="end">merges the target into ticket-003</text><text x="658" y="916" text-anchor="end">gates the merged tree, unless already passed</text><text x="658" y="954" text-anchor="end">fast-forwards main</text><text x="656" y="988" text-anchor="end">Hephaestus code, same lock hold: reviewed, delivered, log merge-landed</text><text x="104" y="162" text-anchor="start">ticket ready: writes pending</text><text x="220" y="580" text-anchor="start">moves in-review: writes Handoff, ends build; Playbook picks review</text><text x="220" y="794" text-anchor="start">marks the row mergeQueued: status does not change</text><text x="349" y="204" text-anchor="middle">a Pass reads it: Playbook picks #003,</text><text x="349" y="221" text-anchor="middle">Hephaestus launches the build job</text><text x="58" y="1030" text-anchor="start">status written by User</text><text x="248" y="1030" text-anchor="start">status written by Hephaestus code</text><text x="502" y="1030" text-anchor="start">a mark that is not a status</text><text x="734" y="1030" text-anchor="start">reads only</text></g>

  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="122" y="424" width="172" height="46" rx="8"/><rect x="122" y="720" width="172" height="46" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="208" y="444" font-size="13" font-weight="500" fill="#0C447C">Customs</text>
    <text x="208" y="461" font-size="11.5" fill="#185FA5">verifies, trusts nothing</text>
    <text x="208" y="740" font-size="13" font-weight="500" fill="#0C447C">Customs, then gates</text>
    <text x="208" y="757" font-size="11.5" fill="#185FA5">same two steps again</text>
  </g>

  <circle cx="92" cy="158" r="5" fill="#633806"/><circle cx="46" cy="1026" r="5" fill="#633806"/>
  <g fill="#0C447C"><circle cx="208" cy="284" r="5"/><circle cx="208" cy="576" r="5"/><circle cx="672" cy="984" r="5"/><circle cx="236" cy="1026" r="5"/></g>
  <g fill="#FAF9F5" stroke="#0C447C" stroke-width="1.6"><circle cx="208" cy="790" r="5"/><circle cx="490" cy="1026" r="5"/></g>
  <rect x="700" y="1018" width="26" height="16" rx="4" fill="none" stroke="#bfbdb0" stroke-dasharray="5 4"/>
</svg>
