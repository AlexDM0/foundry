<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agents working a ticket cannot write to it</title>
  <desc>Who writes a ticket's status and body. Hephaestus code writes every status on the normal path. User writes ready, abandon, reopen, status and deliver --by-hand. A product owner, for its own draft ticket, and the Assistant, for a move its incident allows, go through the Hatch and the Bouncer, and Hephaestus applies the request if it is admitted. A builder or reviewer, in the Airlock too, may file a new low finding through the Hatch, and confinement and Customs leave it no route to an existing ticket.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="492" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Agents working a ticket cannot write to it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Every write to a ticket comes from code or User, or passes the Bouncer.</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M201,116 H512"/><path d="M201,184 H512"/><path d="M401,283 H512"/>
    <path d="M201,251 L259,271"/><path d="M201,315 L259,295"/><path d="M201,393 L252,409"/>
    <path d="M201,370 H333 V327" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="356" y="106" text-anchor="middle">every status on the normal path</text>
    <text x="354" y="174" text-anchor="middle">ready, abandon, reopen, status, deliver --by-hand</text>
    <text x="456" y="273" text-anchor="middle">if admitted</text>
    <text x="343" y="350">may file a new low finding</text>
  </g>

  <rect x="40" y="92" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <rect x="40" y="160" width="160" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <g fill="#FAECE7" stroke="#F3D2C5">
    <rect x="40" y="226" width="160" height="50" rx="8"/><rect x="40" y="290" width="160" height="50" rx="8"/><rect x="40" y="358" width="160" height="48" rx="8"/>
  </g>
  <rect x="266" y="250" width="134" height="66" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <rect x="520" y="92" width="120" height="374" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <circle cx="271" cy="415" r="13" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <path d="M264,415 H278" fill="none" stroke="#A32D2D" stroke-width="2.5"/>

  <g text-anchor="middle">
    <text x="120" y="121" font-size="14" font-weight="500" fill="#0C447C">Hephaestus code</text>
    <text x="120" y="189" font-size="14" font-weight="500" fill="#633806">User</text>
    <g font-size="14" font-weight="500" fill="#712B13">
      <text x="120" y="246">product owner</text><text x="120" y="310">Assistant</text><text x="120" y="378">builder, reviewer</text>
    </g>
    <g font-size="12" fill="#993C1D">
      <text x="120" y="264">its own draft ticket</text><text x="120" y="328">a move its incident allows</text><text x="120" y="396">in the Airlock too</text>
    </g>
    <text x="333" y="278" font-size="14" font-weight="500" fill="#0C447C">Hatch, Bouncer</text>
    <text x="333" y="296" font-size="12" fill="#185FA5">Hephaestus applies it</text>
    <text x="580" y="250" font-size="14" font-weight="500" fill="#444441">Ticket</text>
    <text x="580" y="268" font-size="12" fill="#5F5E5A">status and body</text>
  </g>
  <text x="294" y="411" font-size="13" font-weight="500" fill="#791F1F">confinement, Customs</text>
  <text x="294" y="427" font-size="12" fill="#A32D2D">no route to an existing ticket</text>
</svg>
