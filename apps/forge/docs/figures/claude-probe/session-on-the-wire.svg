<svg xmlns="http://www.w3.org/2000/svg" width="680" height="808" viewBox="0 0 680 808" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A session is turns on one pipe pair, ended by closing stdin</title>
  <desc>Time runs down across Hephaestus, Watcher and claude -p: Hephaestus sends write frames, the Watcher turns each into one user line, and a line written mid-turn folds into the open turn, so one result ends both. A close-input frame closes stdin and the process exits 0. A later Watcher instance continues the same id with --resume.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="806" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A session is turns on one pipe pair, ended by closing stdin</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The same id continues it. Line shapes are in the fence below.</text>

  <path d="M110,124 V788 M340,124 V788 M570,124 V788 M40,568 H640" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <g fill="#E6F1FB" stroke="#CFE2F6"><rect x="40" y="88" width="140" height="36" rx="8"/><rect x="270" y="88" width="140" height="36" rx="8"/></g>
  <rect x="500" y="88" width="140" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <g font-size="13" font-weight="500" text-anchor="middle">
    <text x="110" y="111" fill="#0C447C">Hephaestus</text><text x="340" y="111" fill="#0C447C">Watcher</text>
    <text x="570" y="111" fill="#712B13" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">claude -p</text>
  </g>
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"><path d="M110,150 H335"/><path d="M340,186 H565"/><path d="M110,222 H335"/><path d="M340,258 H565"/><path d="M570,294 H345"/><path d="M570,330 H345"/><path d="M110,366 H335"/><path d="M340,402 H565"/><path d="M570,438 H345"/><path d="M110,474 H335"/><path d="M340,510 H565"/><path d="M570,546 H345"/><path d="M110,616 H335"/><path d="M340,652 H565"/><path d="M110,688 H335"/><path d="M340,724 H565"/><path d="M570,760 H345"/></g>
  <g font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"><text x="225" y="143">spawn, launch files</text><text x="455" y="179">--session-id &lt;id&gt;</text><text x="225" y="215">write frame</text><text x="455" y="251">first user line</text><text x="455" y="287">system init</text><text x="455" y="323">assistant lines</text><text x="225" y="359">write frame</text><text x="455" y="395">user line mid-turn, folds in</text><text x="455" y="431">one result</text><text x="225" y="467">close-input frame</text><text x="455" y="503">stdin closed</text><text x="455" y="539">exit 0</text><text x="225" y="609">spawn, launch files</text><text x="455" y="645">--resume &lt;id&gt;</text><text x="225" y="681">write frame</text><text x="455" y="717">user line: resume message</text><text x="455" y="753">system init</text></g>
  <text x="120" y="586" font-size="11.5" fill="#73726c">A later Watcher instance, same id</text>
</svg>
