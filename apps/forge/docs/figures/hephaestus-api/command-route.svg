<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Runtime commands leave before the install-hold check</title>
  <desc>A command passes six checks in order, and each lets it go on or answers at once. No valid bearer token answers 401 unauthorized. A body that is not JSON or names no known kind answers 400 malformed-body. A runtime command, hephaestus-stop or hephaestus-restart, answers 200 received, a restart only once its preflight passed and else 409, and the Hephaestus lock tells the result. An install hold answers 423, run update. A command applied in a lock hold by ControlService.apply that fails answers 409 or 400, refused or a field missing. Otherwise the answer is 200 applied, and a Pass is woken.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="522" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Runtime commands leave before the install-hold check</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each check lets the command go on or answers at once</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M160,130 V143"/><path d="M160,192 V205"/><path d="M160,254 V267"/><path d="M160,316 V329"/><path d="M160,378 V391"/><path d="M160,440 V453"/>
    <path d="M280,107 H417"/><path d="M280,169 H417"/><path d="M280,231 H417"/><path d="M280,293 H417"/><path d="M280,355 H417"/><path d="M280,417 H417"/>
  </g>
  <g font-size="11" fill="#73726c" text-anchor="middle">
    <text x="350" y="101">no</text><text x="350" y="163">no</text><text x="350" y="225">no</text>
    <text x="350" y="287">yes</text><text x="350" y="349">yes</text><text x="350" y="411">fails</text>
  </g>

  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="40" y="84" width="240" height="46" rx="8"/>
    <rect x="40" y="146" width="240" height="46" rx="8"/>
    <rect x="40" y="208" width="240" height="46" rx="8"/>
    <rect x="40" y="270" width="240" height="46" rx="8"/>
    <rect x="40" y="332" width="240" height="46" rx="8"/>
    <rect x="40" y="394" width="240" height="46" rx="8"/>
    <rect x="420" y="270" width="220" height="46" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="112" font-size="14" font-weight="500" fill="#0C447C">Bearer token valid?</text>
    <text x="160" y="174" font-size="14" font-weight="500" fill="#0C447C">Body is JSON?</text>
    <text x="160" y="236" font-size="14" font-weight="500" fill="#0C447C">Known kind?</text>
    <text x="160" y="290" font-size="14" font-weight="500" fill="#0C447C">Runtime command?</text>
    <text x="160" y="308" font-size="12" fill="#185FA5">hephaestus-stop, hephaestus-restart</text>
    <text x="160" y="352" font-size="14" font-weight="500" fill="#0C447C">Install hold?</text>
    <text x="160" y="370" font-size="12" fill="#185FA5">held-by-install-change</text>
    <text x="160" y="414" font-size="14" font-weight="500" fill="#0C447C">Applied in a lock hold</text>
    <text x="160" y="432" font-size="12" fill="#185FA5">by ControlService.apply</text>
    <text x="530" y="290" font-size="14" font-weight="500" fill="#0C447C">200: received</text>
    <text x="530" y="308" font-size="12" fill="#185FA5">the Hephaestus lock tells the result</text>
  </g>

  <g fill="#FCEBEB" stroke="#F4CFCF">
    <rect x="420" y="84" width="220" height="46" rx="8"/>
    <rect x="420" y="146" width="220" height="108" rx="8"/>
    <rect x="420" y="332" width="220" height="46" rx="8"/>
    <rect x="420" y="394" width="220" height="46" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="530" y="104" font-size="14" font-weight="500" fill="#791F1F">401</text>
    <text x="530" y="122" font-size="12" fill="#A32D2D">unauthorized</text>
    <text x="530" y="197" font-size="14" font-weight="500" fill="#791F1F">400</text>
    <text x="530" y="215" font-size="12" fill="#A32D2D">malformed-body</text>
    <text x="530" y="352" font-size="14" font-weight="500" fill="#791F1F">423</text>
    <text x="530" y="370" font-size="12" fill="#A32D2D">run update</text>
    <text x="530" y="414" font-size="14" font-weight="500" fill="#791F1F">409 or 400</text>
    <text x="530" y="432" font-size="12" fill="#A32D2D">refused, or a field missing</text>
  </g>

  <rect x="40" y="456" width="240" height="48" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="160" y="476" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">200: applied</text>
  <text x="160" y="494" font-size="12" fill="#3B6D11" text-anchor="middle">and a Pass is woken</text>
</svg>
