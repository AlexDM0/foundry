<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A verb records now and a Pass acts later</title>
  <desc>Two sequence diagrams, time running down. With Hephaestus up, the terminal records the fact on the board and nudges Hephaestus, whose Pass reads it and acts. With Hephaestus down, the terminal records the fact, nobody drives while the fact waits on the board, and when Hephaestus starts its Pass reads it and acts.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A verb records now and a Pass acts later</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Time runs down. The board is the only thing the two sides share.</text>

  <rect x="350" y="172" width="290" height="62" fill="#F1EFE8"/>
  <g fill="none" stroke="#E1DDD0" stroke-width="1.2">
    <rect x="40" y="82" width="290" height="270" rx="12"/>
    <rect x="350" y="82" width="290" height="270" rx="12"/>
    <path d="M88,138 V338 M185,138 V338 M282,138 V338 M398,138 V338 M495,138 V338 M592,272 V338"/>
  </g>
  <text x="185" y="103" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Hephaestus up</text>
  <text x="495" y="103" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Hephaestus down</text>

  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="46" y="112" width="84" height="26" rx="7"/>
    <rect x="240" y="112" width="84" height="26" rx="7"/>
    <rect x="240" y="304" width="84" height="30" rx="7"/>
    <rect x="356" y="112" width="84" height="26" rx="7"/>
    <rect x="550" y="242" width="84" height="30" rx="7"/>
    <rect x="550" y="304" width="84" height="30" rx="7"/>
  </g>
  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="143" y="112" width="84" height="26" rx="7"/>
    <rect x="453" y="112" width="84" height="26" rx="7"/>
    <rect x="550" y="112" width="84" height="26" rx="7"/>
  </g>
  <g font-size="12" font-weight="500" text-anchor="middle">
    <text x="88" y="129" fill="#0C447C">Terminal</text>
    <text x="185" y="129" fill="#444441">Board</text>
    <text x="282" y="129" fill="#0C447C">Hephaestus</text>
    <text x="282" y="323" fill="#0C447C">Pass acts</text>
    <text x="398" y="129" fill="#0C447C">Terminal</text>
    <text x="495" y="129" fill="#444441">Board</text>
    <text x="592" y="129" fill="#444441">Hephaestus</text>
    <text x="592" y="261" fill="#0C447C">Starts</text>
    <text x="592" y="323" fill="#0C447C">Pass acts</text>
    <text x="495" y="199" fill="#5F5E5A">nobody drives</text>
  </g>
  <text x="495" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">the fact waits on the board</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M88,158 H182"/>
    <path d="M88,196 H279"/>
    <path d="M398,158 H492"/>
    <path d="M185,292 H279" stroke-dasharray="6 4"/>
    <path d="M495,292 H589" stroke-dasharray="6 4"/>
  </g>
  <g font-size="11" fill="#73726c" text-anchor="middle">
    <text x="136" y="151">records the fact</text>
    <text x="136" y="189">nudges</text>
    <text x="446" y="151">records the fact</text>
    <text x="233" y="285">Pass reads it</text>
    <text x="543" y="285">Pass reads it</text>
  </g>
</svg>
