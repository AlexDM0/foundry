<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Trouble goes one of three ways, by who must act</title>
  <desc>Hephaestus finds trouble its code cannot settle alone, and it goes one of three ways. A decision is User's and waits: the first answer wins, however long it takes. An incident is the Assistant's and ends: with a move or its default, never hanging on an agent, and it can escalate to a decision. A notice is shown and nobody answers: it is never stored and is derived every Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="352" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">Trouble goes one of three ways, by who must act</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Only one arrow joins them, and it points at User.</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M290,136 V152 H120 V183"/>
    <path d="M350,136 V183"/>
    <path d="M410,136 V152 H560 V183"/>
    <path d="M270,217 H203"/>
    <path d="M120,248 V273"/><path d="M350,248 V273"/><path d="M560,248 V273"/>
  </g>
  <text x="236" y="210" font-size="11" fill="#73726c" text-anchor="middle">escalates</text>

  <rect x="250" y="86" width="200" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <rect x="40" y="186" width="160" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="270" y="186" width="160" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="480" y="186" width="160" height="62" rx="8"/>
    <rect x="40" y="276" width="160" height="54" rx="8"/>
    <rect x="270" y="276" width="160" height="54" rx="8"/>
    <rect x="480" y="276" width="160" height="54" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="350" y="108" font-size="14" font-weight="500" fill="#0C447C">Hephaestus finds trouble</text>
    <text x="350" y="126" font-size="12" fill="#185FA5">code cannot settle it alone</text>
    <text x="120" y="212" font-size="14" font-weight="500" fill="#633806">Decision</text>
    <text x="120" y="231" font-size="12" fill="#854F0B">User's, and it waits</text>
    <text x="350" y="212" font-size="14" font-weight="500" fill="#712B13">Incident</text>
    <text x="350" y="231" font-size="12" fill="#993C1D">the Assistant's, and it ends</text>
    <text x="560" y="212" font-size="14" font-weight="500" fill="#444441">Notice</text>
    <text x="560" y="231" font-size="12" fill="#5F5E5A">shown, nobody answers</text>
    <text x="120" y="302" font-size="13" font-weight="500" fill="#444441">First answer wins</text>
    <text x="120" y="321" font-size="12" fill="#5F5E5A">however long it takes</text>
    <text x="350" y="302" font-size="13" font-weight="500" fill="#444441">A move, or its default</text>
    <text x="350" y="321" font-size="12" fill="#5F5E5A">never hangs on an agent</text>
    <text x="560" y="302" font-size="13" font-weight="500" fill="#444441">Never stored</text>
    <text x="560" y="321" font-size="12" fill="#5F5E5A">derived every Pass</text>
  </g>
</svg>
