<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A dead Hephaestus costs time, never an agent</title>
  <desc>Five rows over time. Hephaestus generation 1 dies and generation 2 starts later; in the span between them nobody drives. Talos, the agent's session and the event log run unbroken through that span. The cursor stands still in it, and the first Pass of generation 2 catches up.</desc>

  <rect x="1" y="1" width="678" height="362" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A dead Hephaestus costs time, never an agent</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs to the right. In the shaded span nobody drives.</text>

  <rect x="310" y="82" width="130" height="262" fill="#F1EFE8"/>
  <text x="375" y="101" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">nobody drives</text>

  <text x="40" y="134" font-size="13" font-weight="500" fill="#0C447C">Hephaestus</text>
  <rect x="130" y="114" width="180" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220" y="134" font-size="12" fill="#185FA5" text-anchor="middle">generation 1</text>
  <rect x="440" y="114" width="200" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="540" y="134" font-size="12" fill="#185FA5" text-anchor="middle">generation 2</text>
  <text x="310" y="109" font-size="11" fill="#A32D2D" text-anchor="middle">dies</text>
  <path d="M304,121 L316,137 M316,121 L304,137" fill="none" stroke="#A32D2D" stroke-width="2"/>

  <text x="40" y="178" font-size="13" font-weight="500" fill="#0C447C">Talos</text>
  <rect x="130" y="158" width="510" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="385" y="178" font-size="12" fill="#185FA5" text-anchor="middle">one Talos, unbroken</text>

  <text x="40" y="222" font-size="13" font-weight="500" fill="#712B13">Agent</text>
  <rect x="130" y="202" width="510" height="30" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="385" y="222" font-size="12" fill="#993C1D" text-anchor="middle">the same session keeps working</text>

  <text x="40" y="266" font-size="13" font-weight="500" fill="#444441">Event log</text>
  <rect x="130" y="246" width="510" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <path d="M150,253 V269 M172,253 V269 M196,253 V269 M214,253 V269 M240,253 V269 M262,253 V269 M288,253 V269 M322,253 V269 M344,253 V269 M366,253 V269 M384,253 V269 M408,253 V269 M428,253 V269 M462,253 V269 M488,253 V269 M516,253 V269 M548,253 V269 M580,253 V269 M612,253 V269" fill="none" stroke="#5F5E5A" stroke-width="1.4"/>

  <text x="40" y="310" font-size="13" font-weight="500" fill="#444441">Cursor</text>
  <path d="M130,336 H172 V328 H214 V320 H262 V312 H447 V296 H516 V290 H580 V284 H640" fill="none" stroke="#444441" stroke-width="2"/>
  <text x="375" y="331" font-size="11" fill="#73726c" text-anchor="middle">stands still</text>
  <text x="458" y="317" font-size="11" fill="#73726c">first Pass catches up</text>
</svg>
