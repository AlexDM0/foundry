<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three stores carry the board across a restart</title>
  <desc>Three stores feed the Pass and Playbook. The board, progress.json and tickets, holds what is decided now and is written by verbs and Hephaestus. The log, log.jsonl, holds what happened, is read back for retry limits and is written in the same lock hold as the board: one lock hold, journaled, log written last. The job folder holds how far a step got, in event logs and markers written by Talos and Hephaestus outside the journal, and is read every Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="398" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">Three stores carry the board across a restart</text>
  <text x="40" y="66" font-size="13" fill="#73726c">The shaded band commits as one lock hold.</text>

  <rect x="40" y="84" width="410" height="212" rx="12" fill="#EFF4FA" stroke="#CFE2F6"/>
  <text x="244" y="284" font-size="12" font-weight="500" fill="#185FA5" text-anchor="middle">one lock hold, journaled, log written last</text>

  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="52" y="96" width="184" height="168" rx="8"/>
    <rect x="254" y="96" width="184" height="168" rx="8"/>
    <rect x="462" y="96" width="178" height="168" rx="8"/>
  </g>
  <g text-anchor="middle">
    <g font-size="14" font-weight="500" fill="#444441">
      <text x="144" y="124">Board</text><text x="346" y="124">Log</text><text x="551" y="124">Job folder</text>
    </g>
    <g font-size="12" fill="#5F5E5A">
      <text x="144" y="144">what is decided now</text><text x="346" y="144">what happened</text><text x="551" y="144">how far a step got</text>
      <text x="346" y="196">read back for retry limits</text><text x="551" y="196">event logs, markers</text>
      <text x="144" y="232">written by verbs and</text><text x="144" y="248">Hephaestus</text>
      <text x="346" y="232">written in the same</text><text x="346" y="248">lock hold as the board</text>
      <text x="551" y="232">written by Talos and</text><text x="551" y="248">Hephaestus, outside the journal</text>
    </g>
    <g font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">
      <text x="144" y="178">progress.json</text><text x="144" y="196">tickets/</text>
      <text x="346" y="178">log.jsonl</text><text x="551" y="178">jobs/&lt;job&gt;/</text>
    </g>
  </g>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)">
    <path d="M144,296 V329"/><path d="M346,296 V329"/><path d="M551,264 V329"/>
  </g>
  <text x="560" y="306" font-size="11" fill="#73726c">read every Pass</text>

  <rect x="40" y="332" width="600" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="360" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass and Playbook: same inputs in, same steps out</text>
</svg>
