<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>You file and ready; Hephaestus does the rest unless it asks</title>
  <desc>One ticket, left to right, under the header that shows state, counts and notices. You file in Intake and press Ready on the Kanban. Hephaestus, unasked, runs Build, Review and Merge, and the ticket is Done. Only when an answer is needed does the ticket go to Questions, where your answer resumes it.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="350" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">You file and ready; Hephaestus does the rest unless it asks</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Left to right, one ticket. Amber is you, blue is Hephaestus, coral the agents it launches.</text>

  <rect x="40" y="88" width="600" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="109" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="middle">The header: state, counts, notices</text>

  <rect x="232" y="150" width="296" height="96" rx="12" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="380" y="170" font-size="11.5" fill="#185FA5" text-anchor="middle">Hephaestus, unasked</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M120,198 H137"/><path d="M220,198 H229"/><path d="M328,206 H335"/><path d="M422,206 H429"/><path d="M528,198 H553"/>
    <path d="M350,246 V289" stroke-dasharray="5 4"/><path d="M410,290 V249" stroke-dasharray="5 4"/>
  </g>
  <text x="342" y="272" font-size="11" fill="#73726c" text-anchor="end">only when an answer is needed</text>
  <text x="418" y="272" font-size="11" fill="#73726c">answer resumes it</text>

  <g fill="#FAEEDA" stroke="#F2DDB0">
    <rect x="40" y="166" width="80" height="64" rx="8"/><rect x="140" y="166" width="80" height="64" rx="8"/><rect x="290" y="292" width="180" height="44" rx="8"/>
  </g>
  <g fill="#FAECE7" stroke="#F3D2C5">
    <rect x="244" y="184" width="84" height="44" rx="8"/><rect x="338" y="184" width="84" height="44" rx="8"/>
  </g>
  <rect x="432" y="184" width="84" height="44" rx="8" fill="#FAF9F5" stroke="#CFE2F6"/>
  <rect x="556" y="166" width="84" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <g text-anchor="middle" font-size="14" font-weight="500">
    <text x="80" y="195" fill="#633806">Intake</text><text x="180" y="195" fill="#633806">Kanban</text><text x="380" y="311" fill="#633806">Questions</text>
    <text x="286" y="211" fill="#712B13">Build</text><text x="380" y="211" fill="#712B13">Review</text><text x="474" y="211" fill="#0C447C">Merge</text>
    <text x="598" y="203" fill="#444441">Done</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#854F0B">
    <text x="80" y="212">file</text><text x="180" y="212">Ready</text><text x="380" y="328">answer</text>
  </g>
</svg>
