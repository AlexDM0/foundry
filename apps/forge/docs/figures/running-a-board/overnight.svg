<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agents outlive a stopped Hephaestus; the next start settles what ended</title>
  <desc>One night, left to right. Hephaestus drives the board until stop, and from start it settles what ended and drives again; in the span between, nobody drives. An agent under Talos runs, keeps running through that span and ends in it. At start the stored state decides: stored paused, no ticket starts; stored running, the board launches at the first Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="354" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Agents outlive a stopped Hephaestus; the next start settles what ended</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One night, left to right. In the shaded span nobody drives.</text>

  <rect x="230" y="92" width="200" height="136" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330" y="110" font-size="11" fill="#73726c" text-anchor="middle">nobody drives</text>
  <path d="M230,92 V250 M430,92 V250" fill="none" stroke="#888780" stroke-width="1"/>

  <text x="40" y="118" font-size="12" font-weight="500" fill="#0C447C">Hephaestus</text>
  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="40" y="124" width="190" height="26" rx="8"/>
    <rect x="430" y="124" width="210" height="26" rx="8"/>
    <rect x="430" y="298" width="210" height="44" rx="8"/>
  </g>
  <g font-size="12" fill="#185FA5" text-anchor="middle">
    <text x="135" y="141">drives the board</text>
    <text x="535" y="141">settles what ended, drives</text>
    <text x="535" y="334">launches at the first Pass</text>
  </g>

  <text x="40" y="180" font-size="12" font-weight="500" fill="#712B13">Agent, under Talos</text>
  <rect x="40" y="186" width="320" height="26" rx="8" fill="#FAECE7" fill-opacity="0.8" stroke="#F3D2C5"/>
  <g font-size="12" fill="#993C1D">
    <text x="135" y="203" text-anchor="middle">runs</text>
    <text x="295" y="203" text-anchor="middle">keeps running</text>
    <text x="366" y="203">ends</text>
  </g>

  <g font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="230" y="266">stop</text>
    <text x="430" y="266">start</text>
  </g>
  <text x="639" y="279" font-size="11" fill="#73726c" text-anchor="end">the stored state decides</text>
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M430,272 V284 H300 V295"/>
    <path d="M430,284 H535 V295"/>
  </g>

  <rect x="190" y="298" width="220" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="300" y="317" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">stored paused</text>
  <text x="300" y="334" font-size="12" fill="#854F0B" text-anchor="middle">no ticket starts</text>
  <text x="535" y="317" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">stored running</text>
</svg>
