  <circle cx="49" cy="482" r="9" fill="#3d3d3a"/><text x="49" y="485.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="66" y="478" font-size="13" font-weight="500" fill="#3d3d3a">Banners</text><text x="66" y="493" font-size="12" fill="#73726c">stream down, install held, session lost</text><circle cx="49" cy="518" r="9" fill="#3d3d3a"/><text x="49" y="521.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="66" y="514" font-size="13" font-weight="500" fill="#3d3d3a">Warnings and notices</text><text x="66" y="529" font-size="12" fill="#73726c">banners too, one each</text><circle cx="49" cy="554" r="9" fill="#3d3d3a"/><text x="49" y="557.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><text x="66" y="550" font-size="13" font-weight="500" fill="#3d3d3a">Incident line</text><text x="66" y="565" font-size="12" fill="#73726c">only once a default was applied</text><circle cx="49" cy="590" r="9" fill="#3d3d3a"/><text x="49" y="593.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text x="66" y="586" font-size="13" font-weight="500" fill="#3d3d3a">State</text><text x="66" y="601" font-size="12" fill="#73726c">over the board name, always</text><circle cx="49" cy="626" r="9" fill="#3d3d3a"/><text x="49" y="629.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><text x="66" y="622" font-size="13" font-weight="500" fill="#3d3d3a">Usage</text><text x="66" y="637" font-size="12" fill="#73726c">always; names the reset once hit</text><circle cx="49" cy="662" r="9" fill="#3d3d3a"/><text x="49" y="665.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><text x="66" y="658" font-size="13" font-weight="500" fill="#3d3d3a">new-code line</text><text x="66" y="673" font-size="12" fill="#73726c">only with a new-code notice</text><circle cx="49" cy="698" r="9" fill="#3d3d3a"/><text x="49" y="701.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text><text x="66" y="694" font-size="13" font-weight="500" fill="#3d3d3a">Pause or Resume</text><text x="66" y="709" font-size="12" fill="#73726c">unless handing over or down</text><circle cx="359" cy="482" r="9" fill="#3d3d3a"/><text x="359" y="485.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">8</text><text x="376" y="478" font-size="13" font-weight="500" fill="#3d3d3a">Restart</text><text x="376" y="493" font-size="12" fill="#73726c">only with line 6</text><circle cx="359" cy="518" r="9" fill="#3d3d3a"/><text x="359" y="521.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">9</text><text x="376" y="514" font-size="13" font-weight="500" fill="#3d3d3a">Stop Hephaestus</text><text x="376" y="529" font-size="12" fill="#73726c">as Pause; confirm first</text><circle cx="359" cy="554" r="9" fill="#3d3d3a"/><text x="359" y="557.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">10</text><text x="376" y="550" font-size="13" font-weight="500" fill="#3d3d3a">Statistics</text><text x="376" y="565" font-size="12" fill="#73726c">always</text><circle cx="359" cy="590" r="9" fill="#3d3d3a"/><text x="359" y="593.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">11</text><text x="376" y="586" font-size="13" font-weight="500" fill="#3d3d3a">Waiting on User</text><text x="376" y="601" font-size="12" fill="#73726c">always; neutral at zero</text><circle cx="359" cy="626" r="9" fill="#3d3d3a"/><text x="359" y="629.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">12</text><text x="376" y="622" font-size="13" font-weight="500" fill="#3d3d3a">Activity strip</text><text x="376" y="637" font-size="12" fill="#73726c">one chip per job in a launch slot</text><circle cx="359" cy="662" r="9" fill="#3d3d3a"/><text x="359" y="665.5" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">13</text><text x="376" y="658" font-size="13" font-weight="500" fill="#3d3d3a">Tabs and theme</text><text x="376" y="673" font-size="12" fill="#73726c">a tab counts what waits there</text>
