<svg xmlns="http://www.w3.org/2000/svg" width="680" height="732" viewBox="0 0 680 732" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A missing header control does not apply at this moment</title>
  <desc>The board's header unfolded, with thirteen numbered callouts. Above it sit the banners, one banner per warning or notice, and the incident line. The title row holds the state with usage and the new-code line over the board name, Pause or Resume, Restart and Stop Hephaestus, then the statistics and the Waiting on User pill. Below it come the activity strip, one chip per job in a launch slot, and the tabs with their counts and the theme. Pause, Resume and Stop are offered unless Hephaestus is handing over or down, Restart only with the new-code line.</desc>

  <rect x="1" y="1" width="678" height="730" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A missing header control does not apply at this moment</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Rows unfolded, not to scale. Dashed items come and go.</text>

