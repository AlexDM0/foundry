<svg xmlns="http://www.w3.org/2000/svg" width="680" height="712" viewBox="0 0 680 712" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A live Talos says nothing about the agent</title>
  <desc>A triage of a quiet job. Waiting on an answer: answer it, with decide or incident answer; a waiver also needs job fresh. State interrupted: wait for the resume at the next Pass, unless a board hold; crashes spend resumes. State not running: Hephaestus is moving it; launching, preparing, in-customs and stopping wait, and gating, merging and landing have recipes. Event log moved lately: wait, it is working. Otherwise the agent is silent under a live Talos, on a long tool call or hung; at the bound a quiet-job incident opens, which only asks. Send job message, which costs one turn and keeps the session and work; with no reply choose job fresh, a new job id, or job stop, which holds the ticket; both lose the session and keep the worktree.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>

  <rect x="1" y="1" width="678" height="710" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A live Talos says nothing about the agent</text>
  <text x="40" y="68" font-size="13" fill="#73726c">running means Talos is alive; a hung agent shows only as silence</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M310,114 H367"/><path d="M310,214 H367"/><path d="M310,314 H367"/><path d="M310,414 H367"/>
    <path d="M175,142 V183"/><path d="M175,242 V283"/><path d="M175,342 V383"/><path d="M175,442 V477"/><path d="M175,536 V571"/>
    <path d="M285,610 H340 V586 H367"/><path d="M340,610 V661 H367"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="340" y="108" text-anchor="middle">yes</text><text x="340" y="208" text-anchor="middle">yes</text>
    <text x="340" y="308" text-anchor="middle">no</text><text x="340" y="408" text-anchor="middle">yes</text>
    <text x="184" y="167">no</text><text x="184" y="267">no</text><text x="184" y="367">yes</text><text x="184" y="464">no</text>
    <text x="312" y="591" text-anchor="middle">no reply:</text><text x="312" y="604" text-anchor="middle">choose</text>
  </g>
  <g font-size="12" fill="#73726c">
    <text x="370" y="503">at the bound a quiet-job incident opens;</text>
    <text x="370" y="520">it only asks, it stops nothing</text>
  </g>

  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="40" y="86" width="270" height="56" rx="8"/>
    <rect x="40" y="186" width="270" height="56" rx="8"/>
    <rect x="40" y="286" width="270" height="56" rx="8"/>
    <rect x="40" y="386" width="270" height="56" rx="8"/>
  </g>
  <rect x="40" y="480" width="270" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <g fill="#FAEEDA" stroke="#F2DDB0">
    <rect x="65" y="574" width="220" height="72" rx="8"/>
    <rect x="370" y="78" width="270" height="72" rx="8"/>
    <rect x="370" y="556" width="270" height="62" rx="8"/>
    <rect x="370" y="630" width="270" height="62" rx="8"/>
  </g>
  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="370" y="182" width="270" height="64" rx="8"/>
    <rect x="370" y="266" width="270" height="96" rx="8"/>
    <rect x="370" y="386" width="270" height="56" rx="8"/>
  </g>

  <g text-anchor="middle">
    <g font-size="14" font-weight="500" fill="#0C447C">
      <text x="175" y="111">Waiting on an answer?</text><text x="175" y="211">State interrupted?</text>
      <text x="175" y="311">State running?</text><text x="175" y="411">Event log moved lately?</text>
    </g>
    <g font-size="12" fill="#185FA5">
      <text x="175" y="129">waiting-for-answer, awaiting-answer</text><text x="175" y="229">a lost Talos lands here next Pass</text>
      <text x="175" y="329">any other state: not the agent</text><text x="175" y="429">last .at; bound QUIET_JOB_SWEEPS</text>
    </g>
    <text x="175" y="505" font-size="14" font-weight="500" fill="#712B13">Silent under a live Talos</text>
    <text x="175" y="523" font-size="12" fill="#993C1D">long tool call, or hung</text>

    <g font-size="14" font-weight="500" fill="#633806">
      <text x="505" y="102">Answer it</text>
      <text x="175" y="599" font-family="ui-monospace,Menlo,Consolas,monospace">job message</text>
      <text x="505" y="576" font-family="ui-monospace,Menlo,Consolas,monospace">job fresh</text>
      <text x="505" y="650" font-family="ui-monospace,Menlo,Consolas,monospace">job stop</text>
    </g>
    <g font-size="12" fill="#854F0B">
      <text x="505" y="121">decide, or incident answer</text><text x="505" y="138">a waiver also needs job fresh</text>
      <text x="175" y="617">costs one turn</text><text x="175" y="634">session and work kept</text>
      <text x="505" y="594">try again: new job id</text><text x="505" y="611">session lost, worktree kept</text>
      <text x="505" y="668">give up for now: ticket held</text><text x="505" y="685">session lost, worktree kept</text>
    </g>

    <g font-size="14" font-weight="500" fill="#444441">
      <text x="505" y="202">Wait for the resume</text><text x="505" y="294">Hephaestus is moving it</text><text x="505" y="411">Wait</text>
    </g>
    <g font-size="12" fill="#5F5E5A">
      <text x="505" y="221">next Pass, unless a board hold</text><text x="505" y="238">crashes spend resumes</text>
      <text x="505" y="429">it is working, however slowly</text>
      <g font-family="ui-monospace,Menlo,Consolas,monospace">
        <text x="505" y="312">launching, preparing,</text><text x="505" y="329">in-customs, stopping: wait</text><text x="505" y="346">gating, merging, landing: recipes</text>
      </g>
    </g>
  </g>
</svg>
