<svg xmlns="http://www.w3.org/2000/svg" width="680" height="686" viewBox="0 0 680 686" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One Overseer drives; agents run outside it</title>
  <desc>User works through the Bridge, which sends commands to the one Overseer and shows its live state, and through terminal verbs, typed or run by an orchestrator session, which record a fact in the data folder. The Overseer reads and writes that folder, hands each ticket to the Airlock that lands it on main, and sends frames to the board's one detached Talos. Talos runs each child, an agent session or a gate, and reports each through an event log in the data folder. Talos and its children outlive the Overseer.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="684" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One Overseer drives; agents run outside it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Solid arrows act. Dashed arrows only report.</text>

  <rect x="40" y="462" width="600" height="206" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="482" font-size="12" font-weight="500" fill="#5F5E5A">Outlives the Overseer</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M300,132 L300,150 L170,150 L170,165"/>
    <path d="M380,132 L380,150 L550,150 L550,165"/>
    <path d="M170,224 L170,269"/>
    <path d="M550,224 L550,269"/>
    <path d="M400,300 L457,300"/>
    <path d="M115,328 L115,369"/>
    <path d="M190,400 L257,400"/>
    <path d="M380,328 L380,489"/>
    <path d="M123,544 L123,569"/>
    <path d="M267,544 L267,569"/>
    <path d="M411,544 L411,569"/>
    <path d="M556,544 L556,569"/>
  </g>
  <path d="M550,492 L550,331" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>

  <text x="180" y="252" font-size="11" fill="#73726c">commands, live state</text>
  <text x="560" y="252" font-size="11" fill="#73726c">records a fact</text>
  <text x="430" y="278" font-size="11" fill="#73726c" text-anchor="middle">reads,</text>
  <text x="430" y="291" font-size="11" fill="#73726c" text-anchor="middle">writes</text>
  <text x="223" y="392" font-size="11" fill="#73726c" text-anchor="middle">lands</text>
  <text x="390" y="400" font-size="11" fill="#73726c">one-shot frames</text>
  <text x="560" y="400" font-size="11" fill="#73726c">event log</text>
  <text x="131" y="561" font-size="11" fill="#73726c">runs</text>

  <rect x="270" y="88" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="340" y="115" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>

  <rect x="40" y="168" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="193" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bridge</text>
  <text x="170" y="211" font-size="12" fill="#185FA5" text-anchor="middle">the live page in a browser</text>
  <rect x="460" y="168" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="550" y="193" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Terminal verbs</text>
  <text x="550" y="211" font-size="12" fill="#185FA5" text-anchor="middle">User or orchestrator session</text>

  <rect x="40" y="272" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220" y="297" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="220" y="315" font-size="12" fill="#185FA5" text-anchor="middle">the one driver: launches, verifies, parks, merges</text>
  <rect x="460" y="272" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="550" y="297" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.forge/</text>
  <text x="550" y="315" font-size="12" fill="#5F5E5A" text-anchor="middle">board, log, job folders</text>

  <rect x="40" y="372" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="397" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
  <text x="115" y="415" font-size="12" fill="#185FA5" text-anchor="middle">gates each merge</text>
  <rect x="260" y="372" width="90" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="305" y="405" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>

  <rect x="56" y="492" width="568" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="514" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Detached Talos</text>
  <text x="340" y="532" font-size="12" fill="#185FA5" text-anchor="middle">every agent and line, under a lease</text>

  <rect x="56" y="572" width="134" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="123" y="597" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Product owner</text>
  <text x="123" y="615" font-size="12" fill="#993C1D" text-anchor="middle">files draft tickets</text>
  <rect x="200" y="572" width="134" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="267" y="597" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Builders</text>
  <text x="267" y="615" font-size="12" fill="#993C1D" text-anchor="middle">on a ticket worktree</text>
  <rect x="344" y="572" width="134" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="411" y="597" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Reviewers</text>
  <text x="411" y="615" font-size="12" fill="#993C1D" text-anchor="middle">fresh each round</text>
  <rect x="488" y="572" width="136" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="556" y="597" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Assistant</text>
  <text x="556" y="615" font-size="12" fill="#993C1D" text-anchor="middle">handles incidents</text>
  <text x="340" y="651" font-size="11" fill="#73726c" text-anchor="middle">examples of agent roles, not the whole set</text>
</svg>
