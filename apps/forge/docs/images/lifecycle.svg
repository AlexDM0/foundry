<svg xmlns="http://www.w3.org/2000/svg" width="680" height="842" viewBox="0 0 680 842" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agents report, code moves the ticket to merged</title>
  <desc>User describes the work, a product owner files a draft ticket, and once User readies it Hephaestus starts a builder on the ticket's worktree. Customs and the gates verify the builder's report on its final commit. A fresh reviewer follows when the pipeline sets a review; when it does not, the ticket goes straight to the Airlock. A red result or a review that does not hold sends the ticket back to the same builder. A reviewer's large rework can earn another review round. From the merge queue the Airlock merges one ticket at a time, gated, and the ticket is done only once merged. Findings outside scope become low-priority draft tickets.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="840" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Agents report, code moves the ticket to merged</text>
  <text x="40" y="68" font-size="13" fill="#73726c">one ticket, from report to landing</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M280,144 L280,173"/>
    <path d="M280,228 L280,257"/>
    <path d="M280,312 L280,341"/>
    <path d="M280,396 L280,425"/>
    <path d="M280,480 L280,509"/>
    <path d="M280,564 L280,593"/>
    <path d="M280,648 L280,677"/>
    <path d="M280,732 L280,761"/>
    <path d="M170,622 L140,622 L140,538 L167,538"/>
    <path d="M170,454 L50,454 L50,706 L167,706"/>
    <path d="M390,538 L414,538 L414,370 L393,370"/>
    <path d="M390,454 L414,454" marker-end="none"/>
  </g>
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)">
    <path d="M370,564 L370,581 L437,581"/>
  </g>

  <text x="424" y="450" font-size="11" fill="#73726c" text-anchor="start">red, or does not hold:</text>
  <text x="424" y="464" font-size="11" fill="#73726c" text-anchor="start">same builder resumes</text>
  <text x="290" y="248" font-size="11" fill="#73726c" text-anchor="start">User readies it</text>
  <text x="290" y="672" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <text x="155" y="614" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <text x="134" y="584" font-size="11" fill="#73726c" text-anchor="end">next round</text>
  <text x="115" y="446" font-size="11" fill="#73726c" text-anchor="middle">no review set</text>

  <rect x="170" y="92" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="280" y="115" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User describes the work</text>
  <text x="280" y="133" font-size="12" fill="#854F0B" text-anchor="middle">in Intake or a session</text>
  <rect x="170" y="176" width="220" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="280" y="199" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Product owner files it</text>
  <text x="280" y="217" font-size="12" fill="#993C1D" text-anchor="middle">a draft ticket, numbered Acceptance</text>
  <rect x="170" y="260" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280" y="283" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Hephaestus starts a builder</text>
  <text x="280" y="301" font-size="12" fill="#185FA5" text-anchor="middle">one per free launch slot</text>
  <rect x="170" y="344" width="220" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="280" y="367" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Builder works in a worktree</text>
  <text x="280" y="385" font-size="12" fill="#993C1D" text-anchor="middle">commits, then reports</text>
  <rect x="170" y="428" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280" y="451" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs and gates verify</text>
  <text x="280" y="469" font-size="12" fill="#185FA5" text-anchor="middle">on the final commit</text>
  <rect x="170" y="512" width="220" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="5 4"/>
  <text x="280" y="535" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">A fresh agent reviews it</text>
  <text x="280" y="553" font-size="12" fill="#993C1D" text-anchor="middle">optional, set by the pipeline</text>
  <rect x="170" y="596" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280" y="619" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Another round earned?</text>
  <text x="280" y="637" font-size="12" fill="#185FA5" text-anchor="middle">large rework, requested, converging</text>
  <rect x="170" y="680" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280" y="703" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock merges it</text>
  <text x="280" y="721" font-size="12" fill="#185FA5" text-anchor="middle">from the merge queue, one at a time</text>
  <rect x="170" y="764" width="220" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="280" y="787" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Done means merged</text>
  <text x="280" y="805" font-size="12" fill="#3B6D11" text-anchor="middle">delivered on landing</text>
  <rect x="440" y="555" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540" y="578" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Findings outside scope</text>
  <text x="540" y="596" font-size="12" fill="#5F5E5A" text-anchor="middle">filed as low draft tickets</text>
</svg>
