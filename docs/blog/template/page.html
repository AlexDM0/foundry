<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{deck}}">
<script>
  document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<!--STYLES-->
</head>
<body data-source-file="{{sourceFileName}}">
<div class="reading-progress" aria-hidden="true"><div class="reading-progress-bar" data-role="reading-progress"></div></div>

<header class="top-bar">
  <a class="brand" href="#top" aria-label="Back to the top">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="brand-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="brand-tile-from"/><stop offset="1" class="brand-tile-to"/></linearGradient>
        <mask id="brand-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><circle cx="48.02" cy="22.75" r="10.35" fill="#000"/></mask>
      </defs>
      <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#brand-tile)"/>
      <g transform="translate(32 32) scale(1.1) translate(-32 -32)">
        <g mask="url(#brand-gap)"><path class="brand-line" d="M30.75 14.22 A2.5 2.5 0 0 1 33.25 14.22 L46.77 22.03 A2.5 2.5 0 0 1 48.02 24.19 L48.02 39.81 A2.5 2.5 0 0 1 46.77 41.97 L33.25 49.78 A2.5 2.5 0 0 1 30.75 49.78 L17.23 41.97 A2.5 2.5 0 0 1 15.98 39.81 L15.98 24.19 A2.5 2.5 0 0 1 17.23 22.03 Z" fill="none" stroke-width="3"/></g>
        <path class="brand-core" d="M31.5 26.29 A1 1 0 0 1 32.5 26.29 L36.7 28.71 A1 1 0 0 1 37.2 29.58 L37.2 34.42 A1 1 0 0 1 36.7 35.29 L32.5 37.71 A1 1 0 0 1 31.5 37.71 L27.3 35.29 A1 1 0 0 1 26.8 34.42 L26.8 29.58 A1 1 0 0 1 27.3 28.71 Z"/>
        <circle cx="48.02" cy="22.75" r="7.4" fill="none" stroke="#ee5600" stroke-width="1.5"/>
        <circle cx="48.02" cy="22.75" r="3.6" fill="#ff8d42"/>
      </g>
      <rect class="brand-rim" x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none"/>
    </svg>
    <span class="brand-name">foundry</span>
  </a>
  <nav class="top-navigation" aria-label="Parts and chapters">
    <span class="part-links" data-role="part-links"></span>
    <details class="chapter-menu" data-role="chapter-menu">
      <summary><span class="chapter-menu-label" data-role="current-chapter">Chapters</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="chapter-menu-list" data-role="chapter-list"></div>
    </details>
  </nav>
  <button class="icon-button" type="button" data-action="toggle-theme" aria-label="Switch between light and dark">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 3.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
  </button>
</header>

<main id="top">
  <header class="hero full" data-line="2">
    <div class="hero-text">
      <p class="eyebrow">A concept, and the software behind it</p>
      <h1>{{title}}</h1>
      <p class="deck">{{deck}}</p>
      <p class="byline">{{author}} <span aria-hidden="true">·</span> {{date}}</p>
    </div>
    <svg class="hero-strip" viewBox="0 0 1000 170" role="img" aria-label="A ticket travels through six phases: spec, plan, build, agent review, human review and merge. Gates stand between the phases.">
      <path class="hero-rail" d="M40 80H960"/>
      <g class="hero-gates">
        <path d="M500 62v36"/><path d="M660 62v36"/><path d="M830 62v36"/>
        <text x="500" y="52">gates</text><text x="660" y="52">gates</text><text x="830" y="52">gates</text>
      </g>
      <g class="hero-station tone-ticket"><circle cx="100" cy="80" r="17"/><text class="hero-station-name" x="100" y="124">Spec</text><text class="hero-station-actor" x="100" y="142">person and agent</text></g>
      <g class="hero-station tone-ticket"><circle cx="260" cy="80" r="17"/><text class="hero-station-name" x="260" y="124">Plan</text><text class="hero-station-actor" x="260" y="142">person and agent</text></g>
      <g class="hero-station tone-build"><circle cx="420" cy="80" r="17"/><text class="hero-station-name" x="420" y="124">Build</text><text class="hero-station-actor" x="420" y="142">agents</text></g>
      <g class="hero-station tone-review"><circle cx="580" cy="80" r="17"/><text class="hero-station-name" x="580" y="124">Agent review</text><text class="hero-station-actor" x="580" y="142">a fresh agent</text></g>
      <g class="hero-station tone-review"><circle cx="740" cy="80" r="17"/><text class="hero-station-name" x="740" y="124">Human review</text><text class="hero-station-actor" x="740" y="142">a person</text></g>
      <g class="hero-station tone-merge"><circle cx="900" cy="80" r="17"/><text class="hero-station-name" x="900" y="124">Merge</text><text class="hero-station-actor" x="900" y="142">the loop</text></g>
      <path class="hero-ticket" d="M0 -10 10 0 0 10 -10 0Z">
        <animateMotion dur="16s" repeatCount="indefinite" path="M40 80H960" calcMode="linear"
          keyPoints="0;0.065;0.065;0.239;0.239;0.413;0.587;0.761;0.761;0.935;1"
          keyTimes="0;0.05;0.15;0.25;0.35;0.47;0.62;0.74;0.86;0.96;1"/>
      </path>
    </svg>
  </header>

<!--CONTENT-->

  <footer class="page-footer full">
    <p>{{author}} <span aria-hidden="true">·</span> {{date}} <span aria-hidden="true">·</span> <a href="https://github.com/AlexDM0/foundry" target="_blank" rel="noopener">github.com/AlexDM0/foundry</a></p>
  </footer>
</main>

<!--SCRIPTS-->
<!--REVIEW_LAYER-->
</body>
</html>
