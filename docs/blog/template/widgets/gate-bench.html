<div class="gate-bench">
  <div>
    <div class="gate-bench-actions">
      <button class="button" type="button" data-action="gate-pass">The gate passes</button>
      <button class="button" type="button" data-action="gate-fail">The gate fails</button>
      <button class="button" type="button" data-action="gate-cannot-run">The gate cannot run</button>
      <button class="button button-small" type="button" data-action="gate-reset">Start again</button>
    </div>
    <ol class="gate-ladder" data-role="gate-ladder"></ol>
  </div>
  <div class="gate-outcome" data-role="gate-outcome" aria-live="polite"></div>
</div>
