<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
  <title>agent-progress-v2 init in a terminal</title>
  <desc>A macOS terminal running agent-progress-v2 init in an example repository, listing the tracker, session instructions, dashboard stub, gitignore entry, CLAUDE.md, retired files, SessionStart hook, skills and worktrees folder it sets up, then agent-progress-v2 oversee --detach printing the Overseer's local URL and agent-progress-v2 oversee resume taking the new board out of its paused state.</desc>

  <rect x="0.5" y="0.5" width="719" height="379" rx="12" fill="#1C1C1E" stroke="#3A3A3C"/>
  <path d="M0.5,28.5 V12.5 A12,12 0 0 1 12.5,0.5 H707.5 A12,12 0 0 1 719.5,12.5 V28.5 Z" fill="#2A2A2C" stroke="#3A3A3C"/>
  <line x1="1" y1="28.5" x2="719" y2="28.5" stroke="#0E0E0F"/>
  <circle cx="20" cy="14.5" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="14.5" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="14.5" r="6" fill="#28C840"/>
  <text x="360" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9a9a9a">example-storefront — zsh</text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#E6E6E6">
    <text x="16" y="56" fill="#8E8E93">$</text><text x="30.4" y="56">cd ~/code/example-storefront</text>
    <text x="16" y="74" fill="#8E8E93">$</text><text x="30.4" y="74">agent-progress-v2 init --project &quot;Example Storefront&quot;</text>
    <text x="16" y="92">Initialised agent-progress-v2 for &quot;Example Storefront&quot; in ~/code/example-storefront</text>
    <text x="30.4" y="110" fill="#8E8E93">tracker:</text><text x="124" y="110">.agent-progress-v2/</text>
    <text x="30.4" y="128" fill="#8E8E93">brief:</text><text x="124" y="128">.agent-progress-v2/session-instructions.md</text>
    <text x="30.4" y="146" fill="#8E8E93">dashboard:</text><text x="124" y="146">.agent-progress-v2/progress.html</text>
    <text x="30.4" y="164" fill="#8E8E93">.gitignore:</text><text x="124" y="164">entry <tspan fill="#32D74B">added</tspan></text>
    <text x="30.4" y="182" fill="#8E8E93">CLAUDE.md:</text><text x="124" y="182">no managed block</text>
    <text x="30.4" y="200" fill="#8E8E93">retired:</text><text x="124" y="200">nothing to remove</text>
    <text x="30.4" y="218" fill="#8E8E93">hooks:</text><text x="124" y="218">.claude/settings.local.json (<tspan fill="#32D74B">installed</tspan>)</text>
    <text x="30.4" y="236" fill="#8E8E93">skills:</text><text x="124" y="236"><tspan fill="#32D74B">updated</tspan> (.claude/skills/agent-po-v2, .gitignore entry <tspan fill="#32D74B">added</tspan>);</text>
    <text x="124" y="254"><tspan fill="#32D74B">updated</tspan> (.claude/skills/agent-progress-orchestrate-v2, .gitignore entry <tspan fill="#32D74B">added</tspan>)</text>
    <text x="30.4" y="272" fill="#8E8E93">worktrees:</text><text x="124" y="272">.agent-progress-v2-worktrees already ignored, so nothing was added</text>
    <text x="16" y="290" fill="#8E8E93">$</text><text x="30.4" y="290">agent-progress-v2 oversee --detach</text>
    <text x="16" y="308">http://127.0.0.1:4943/</text>
    <text x="16" y="326" fill="#8E8E93">$</text><text x="30.4" y="326">agent-progress-v2 oversee resume</text>
    <text x="16" y="344">Overseer set to running (was paused).</text>
    <text x="16" y="362" fill="#8E8E93">$</text><rect x="30.4" y="351" width="7" height="14" fill="#E6E6E6" opacity="0.75"/>
  </g>
</svg>
