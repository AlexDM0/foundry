<svg xmlns="http://www.w3.org/2000/svg" width="680" height="438" viewBox="0 0 680 438" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Ports and adapters of the forge</title>
  <desc>The forge core calls three ports. The operating system port has a macOS adapter proven first and Linux and Windows adapters that exist today and are kept. The agent port has a Claude Code adapter and other vendors later. The store port is new, with a local files adapter first and a remote forge API adapter later.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="436" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Ports and adapters of the forge</text>
  <text x="40" y="68" font-size="13" fill="#73726c">solid: exists or built first · dashed: later</text>

  <path d="M340,148 L340,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,170 L140,170 L140,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,170 L540,170 L540,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M140,252 L140,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,252 L340,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M540,252 L540,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="140" y="92" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="116" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Forge core: Hephaestus and Talos</text>
  <text x="340" y="134" font-size="12" fill="#5F5E5A" text-anchor="middle">calls ports; names no platform, no vendor, no record path</text>

  <rect x="50" y="196" width="180" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="140" y="220" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Operating system port</text>
  <text x="140" y="238" font-size="12" fill="#993C1D" text-anchor="middle">processes, git, sandbox</text>

  <rect x="250" y="196" width="180" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340" y="220" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent port</text>
  <text x="340" y="238" font-size="12" fill="#993C1D" text-anchor="middle">launch, input, events</text>

  <rect x="450" y="196" width="180" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="540" y="220" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Store port (new)</text>
  <text x="540" y="238" font-size="12" fill="#993C1D" text-anchor="middle">commands, documents, watch</text>

  <rect x="50" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140" y="314" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">macOS</text>
  <text x="140" y="332" font-size="12" fill="#185FA5" text-anchor="middle">new work proven here first</text>

  <rect x="250" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="314" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Claude Code</text>
  <text x="340" y="332" font-size="12" fill="#185FA5" text-anchor="middle">the one adapter today</text>

  <rect x="450" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="540" y="314" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Local files</text>
  <text x="540" y="332" font-size="12" fill="#185FA5" text-anchor="middle">built first</text>

  <rect x="50" y="362" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140" y="384" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Linux, Windows</text>
  <text x="140" y="402" font-size="12" fill="#185FA5" text-anchor="middle">exist today, kept</text>

  <rect x="250" y="362" width="180" height="52" rx="8" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="340" y="384" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Other vendors</text>
  <text x="340" y="402" font-size="12" fill="#5F5E5A" text-anchor="middle">later</text>

  <rect x="450" y="362" width="180" height="52" rx="8" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="384" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Remote forge API</text>
  <text x="540" y="402" font-size="12" fill="#5F5E5A" text-anchor="middle">later</text>
</svg>
