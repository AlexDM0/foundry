<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The forge and its interface</title>
  <desc>Gaia sends commands to Hephaestus's API and reads documents and events from it, and runs the CLI to start, stop and set up a forge. Inside the forge, the CLI writes commands to the store, Hephaestus watches the store and writes state, and Hephaestus drives Talos, which commands every child process of the board.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="492" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The forge and its interface</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Gaia talks to one API: versioned reads and a command endpoint</text>

  <path d="M270,148 L270,176 L160,176 L160,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="215" y="170" font-size="11" fill="#73726c" text-anchor="middle">start, stop, set up</text>
  <path d="M350,148 L350,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="342" y="192" font-size="11" fill="#73726c" text-anchor="end">commands</text>
  <path d="M400,250 L400,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="408" y="180" font-size="11" fill="#73726c">documents, events</text>

  <path d="M135,306 L135,360" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="143" y="338" font-size="11" fill="#73726c">commands</text>
  <path d="M310,364 L310,310" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="302" y="338" font-size="11" fill="#73726c" text-anchor="end">watches</text>
  <path d="M370,306 L370,360" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="378" y="338" font-size="11" fill="#73726c">state</text>
  <path d="M432,278 L458,278" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="210" y="92" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="116" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Gaia</text>
  <text x="340" y="134" font-size="12" fill="#5F5E5A" text-anchor="middle">inventories, displays, forwards</text>

  <rect x="40" y="200" width="600" height="270" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="226" font-size="14" font-weight="500" fill="#3d3d3a">The forge</text>
  <text x="620" y="226" font-size="12" fill="#73726c" text-anchor="end">headless, versioned, runs alone</text>

  <rect x="60" y="250" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135" y="274" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">CLI</text>
  <text x="135" y="292" font-size="12" fill="#5F5E5A" text-anchor="middle">every state change</text>

  <rect x="242" y="250" width="190" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="337" y="274" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Hephaestus</text>
  <text x="337" y="292" font-size="12" fill="#993C1D" text-anchor="middle">runs the pipeline</text>

  <rect x="462" y="250" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="542" y="274" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Talos</text>
  <text x="542" y="292" font-size="12" fill="#185FA5" text-anchor="middle">commands every child</text>

  <rect x="60" y="364" width="372" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="246" y="388" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">The store, behind the store port</text>
  <text x="246" y="406" font-size="12" fill="#854F0B" text-anchor="middle">records on local files first</text>

  <text x="60" y="448" font-size="12" fill="#73726c">Agents under Talos change state through the same CLI. Machine-wide limits stay shared files.</text>
</svg>
