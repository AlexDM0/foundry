<svg xmlns="http://www.w3.org/2000/svg" width="680" height="606" viewBox="0 0 680 606" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Inside Talos</title>
  <desc>Hephaestus reaches Talos over one socket. Inside Talos, the protocol part does the handshake at one protocol version and the lease part counts one minute between renewals. A launcher starts each child in a process group of its own, an input relay passes messages and standing replies, and a stopper does the clean quit. An output reader writes every line to an event log and a child record persists each child's identity and status. Below Talos run its children: agent sessions, gate lines and install lines.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="604" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Inside Talos</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a lightweight commander: it starts, relays, records and stops, and knows no vendor</text>

  <path d="M340,140 L340,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="166" font-size="11" fill="#73726c">one socket: launch plans, input, state</text>
  <path d="M148,460 L148,496" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,460 L340,496" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M532,460 L532,496" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="215" y="92" width="250" height="48" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340" y="113" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Hephaestus</text>
  <text x="340" y="130" font-size="12" fill="#993C1D" text-anchor="middle">starts Talos, renews the lease</text>

  <rect x="40" y="188" width="600" height="272" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="214" font-size="14" font-weight="500" fill="#3d3d3a">Talos</text>
  <text x="620" y="214" font-size="12" fill="#73726c" text-anchor="end">one per board</text>

  <rect x="60" y="228" width="270" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="195" y="250" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Protocol</text>
  <text x="195" y="268" font-size="12" fill="#185FA5" text-anchor="middle">handshake at one protocol version</text>

  <rect x="350" y="228" width="270" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="485" y="250" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Lease</text>
  <text x="485" y="268" font-size="12" fill="#185FA5" text-anchor="middle">one minute, renewed every 15 seconds</text>

  <rect x="60" y="308" width="176" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="148" y="330" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Launcher</text>
  <text x="148" y="348" font-size="12" fill="#185FA5" text-anchor="middle">a process group per child</text>

  <rect x="252" y="308" width="176" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="330" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Input relay</text>
  <text x="340" y="348" font-size="12" fill="#185FA5" text-anchor="middle">messages, standing replies</text>

  <rect x="444" y="308" width="176" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="532" y="330" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Stopper</text>
  <text x="532" y="348" font-size="12" fill="#185FA5" text-anchor="middle">clean quit within 10 seconds</text>

  <rect x="60" y="388" width="270" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="195" y="410" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Output reader</text>
  <text x="195" y="428" font-size="12" fill="#854F0B" text-anchor="middle">every line to the child's event log</text>

  <rect x="350" y="388" width="270" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="485" y="410" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Child record</text>
  <text x="485" y="428" font-size="12" fill="#854F0B" text-anchor="middle">persisted: identity and status</text>

  <rect x="60" y="500" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="148" y="522" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">claude -p</text>
  <text x="148" y="540" font-size="12" fill="#5F5E5A" text-anchor="middle">agent session</text>

  <rect x="252" y="500" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="522" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">gate line</text>
  <text x="340" y="540" font-size="12" fill="#5F5E5A" text-anchor="middle">confined command</text>

  <rect x="444" y="500" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="532" y="522" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">install line</text>
  <text x="532" y="540" font-size="12" fill="#5F5E5A" text-anchor="middle">confined command</text>

  <text x="60" y="582" font-size="12" fill="#73726c">Amber is on disk. Hephaestus reads an agent's question out of that agent's event log.</text>
</svg>
