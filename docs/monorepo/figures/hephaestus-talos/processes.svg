<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Processes on a machine</title>
  <desc>One Gaia per machine and one Hephaestus per board; Gaia calls Hephaestus's API for reads and commands. Hephaestus starts one Talos per board at the required protocol version and renews its lease. Talos commands every child: claude sessions and gate lines. Talos and its children outlive a Hephaestus restart, and Talos stops its agents after one minute without contact.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="538" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Processes on a machine</text>
  <text x="40" y="68" font-size="13" fill="#73726c">what runs, and what a Hephaestus restart leaves running</text>

  <text x="340" y="176" font-size="11" fill="#73726c" text-anchor="middle">Gaia calls this API: reads and commands</text>

  <path d="M340,252 L340,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="280" font-size="11" fill="#73726c">starts it at the required version, renews the lease</text>

  <path d="M340,372 L340,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,390 L148,390 L148,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,390 L532,390 L532,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="235" y="92" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="116" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Gaia</text>
  <text x="340" y="134" font-size="12" fill="#5F5E5A" text-anchor="middle">one per machine</text>

  <rect x="235" y="196" width="210" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340" y="220" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Hephaestus</text>
  <text x="340" y="238" font-size="12" fill="#993C1D" text-anchor="middle">one per board, its API on loopback</text>

  <rect x="40" y="296" width="600" height="220" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>

  <rect x="190" y="316" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="340" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Talos</text>
  <text x="340" y="358" font-size="12" fill="#185FA5" text-anchor="middle">one per board, commands every child</text>

  <rect x="58" y="412" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="148" y="434" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">claude -p</text>
  <text x="148" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">builder session</text>

  <rect x="250" y="412" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="434" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">gate line</text>
  <text x="340" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">confined command</text>

  <rect x="442" y="412" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="532" y="434" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">claude -p</text>
  <text x="532" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">reviewer session</text>

  <text x="58" y="488" font-size="12" fill="#73726c">This frame outlives a Hephaestus restart, as long as the Talos protocol version stays the same.</text>
  <text x="58" y="504" font-size="12" fill="#73726c">Talos stops its agents after one minute without contact from Hephaestus.</text>
</svg>
