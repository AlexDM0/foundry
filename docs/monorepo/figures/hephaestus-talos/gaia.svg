<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Inside Gaia</title>
  <desc>A browser shows Gaia as one window in one design, and can show one forge maximized in a tab of its own. Inside Gaia, the interface has an inventory of forges, the board views that came from the Bridge, conversations with hosted agents and warnings. Gaia's server is the only client of a forge. It has a forge client that speaks one forge version, a registry reader and a CLI runner. Below Gaia are each forge's Hephaestus API, the registry file and the forge CLI.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="588" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Inside Gaia</text>
  <text x="40" y="68" font-size="13" fill="#73726c">one interface for every forge of the machine, in one design, with no embedded page</text>

  <path d="M195,140 L195,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M485,140 L485,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,264 L340,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,344 L340,368" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M148,444 L148,480" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,444 L340,480" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M532,444 L532,480" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="60" y="92" width="270" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="195" y="113" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Browser window</text>
  <text x="195" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">every forge, side by side</text>

  <rect x="350" y="92" width="270" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="485" y="113" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">A tab of its own</text>
  <text x="485" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">one forge, maximized</text>

  <rect x="40" y="172" width="600" height="272" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="198" font-size="14" font-weight="500" fill="#3d3d3a">Gaia</text>
  <text x="620" y="198" font-size="12" fill="#73726c" text-anchor="end">one per machine</text>

  <rect x="60" y="212" width="128" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="124" y="234" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Inventory</text>
  <text x="124" y="252" font-size="12" fill="#185FA5" text-anchor="middle">every local forge</text>

  <rect x="204" y="212" width="128" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="268" y="234" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Board views</text>
  <text x="268" y="252" font-size="12" fill="#185FA5" text-anchor="middle">from the Bridge</text>

  <rect x="348" y="212" width="128" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="412" y="234" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Conversations</text>
  <text x="412" y="252" font-size="12" fill="#185FA5" text-anchor="middle">hosted agents</text>

  <rect x="492" y="212" width="128" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="556" y="234" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Warnings</text>
  <text x="556" y="252" font-size="12" fill="#185FA5" text-anchor="middle">a forge is down</text>

  <rect x="60" y="292" width="560" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="314" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Gaia's server</text>
  <text x="340" y="332" font-size="12" fill="#5F5E5A" text-anchor="middle">serves the interface; the only client of a forge</text>

  <rect x="60" y="372" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="148" y="394" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Forge client</text>
  <text x="148" y="412" font-size="12" fill="#5F5E5A" text-anchor="middle">one forge version</text>

  <rect x="252" y="372" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="394" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Registry reader</text>
  <text x="340" y="412" font-size="12" fill="#5F5E5A" text-anchor="middle">which forges exist</text>

  <rect x="444" y="372" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="532" y="394" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">CLI runner</text>
  <text x="532" y="412" font-size="12" fill="#5F5E5A" text-anchor="middle">start, stop, set up</text>

  <rect x="60" y="484" width="176" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="148" y="506" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Hephaestus API</text>
  <text x="148" y="524" font-size="12" fill="#993C1D" text-anchor="middle">reads and commands</text>

  <rect x="252" y="484" width="176" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="340" y="506" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Registry file</text>
  <text x="340" y="524" font-size="12" fill="#854F0B" text-anchor="middle">forges register themselves</text>

  <rect x="444" y="484" width="176" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="532" y="506" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">forge CLI</text>
  <text x="532" y="524" font-size="12" fill="#993C1D" text-anchor="middle">the forge's own verbs</text>

  <text x="60" y="566" font-size="12" fill="#73726c">Gaia holds no pipeline state: with Gaia closed, every forge still does its full job.</text>
</svg>
