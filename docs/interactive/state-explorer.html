* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--text);
  font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
code, select.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; }
code { background: var(--code-bg); color: var(--code-text); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--link); }
h1, h2, h3 { font-weight: 500; line-height: 1.25; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 20px; overflow-wrap: anywhere; }
h3 { font-size: 13px; color: var(--muted); margin: 22px 0 8px; letter-spacing: .02em; }
p { margin: 0; }
button, select, input, summary { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 16px 16px 40px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; margin-bottom: 14px; }
.crumbs { color: var(--muted); }
.crumbs span { margin: 0 6px; }
.segmented { display: inline-flex; border: 1px solid var(--hairline); border-radius: 8px; background: var(--raised); }
.segmented button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.segmented button + button { border-left: 1px solid var(--hairline); }
.segmented button:first-child { border-radius: 7px 0 0 7px; }
.segmented button:last-child { border-radius: 0 7px 7px 0; }
.segmented button:focus-visible { outline-offset: -2px; }
.segmented button[aria-pressed="true"] { background: var(--code-fill); color: var(--code-title); font-weight: 500; }
.question { font-size: 17px; margin-top: 6px; }
.lede { color: var(--muted); margin-top: 4px; }
.commit { color: var(--muted); font-size: 13px; margin-top: 4px; }
.machine-bar { margin-top: 20px; }
.layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; margin-top: 16px; align-items: start; }
.panel { background: var(--raised); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; min-width: 0; }
.machines { display: flex; flex-wrap: wrap; gap: 6px; }
.machines button { border: 1px solid var(--hairline); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13.5px; }
.machines button[aria-pressed="true"] { background: var(--code-fill); border-color: var(--code-border); color: var(--code-title); font-weight: 500; }
.filter { font-size: 13.5px; }
.filter label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter select { max-width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.filter .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
.filter input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--code-sub); margin: 0; }
.ladder { position: relative; margin-top: 14px; }
.ladder svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.ladder ol { list-style: none; margin: 0; padding: 0; position: relative; }
.ladder li { display: flex; justify-content: center; }
.ladder li + li { margin-top: 12px; }
.ladder li.break { margin-top: 30px; position: relative; }
.ladder li.break::before { content: attr(data-caption); position: absolute; top: -21px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
.state {
  width: min(216px, calc(100% - 132px)); min-height: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 6px; padding: 5px 8px;
  border-radius: 8px; border: 1.5px solid; cursor: pointer; text-align: center; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; position: relative; z-index: 1;
}
.state small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; white-space: nowrap; }
.state[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--arc-code); font-weight: 500; }
.state:focus-visible { outline-offset: 6px; }
.state.unused { border-style: dashed; }
.state.synthetic { font-style: italic; }
.state.next { border-color: currentColor; }
.who-code { background: var(--code-fill); border-color: var(--code-border); color: var(--code-title); --faded-fill: var(--code-fill); }
.who-agent { background: var(--agent-fill); border-color: var(--agent-border); color: var(--agent-title); --faded-fill: var(--agent-fill); }
.who-person { background: var(--person-fill); border-color: var(--person-border); color: var(--person-title); --faded-fill: var(--person-fill); }
.who-store { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); --faded-fill: var(--store-fill); }
.who-refused { background: var(--refused-fill); border-color: var(--refused-border); color: var(--refused-title); --faded-fill: var(--refused-fill); }
.who-good { background: var(--good-fill); border-color: var(--good-border); color: var(--good-title); --faded-fill: var(--good-fill); }
.state.off { background: transparent; color: var(--muted); border-color: var(--line); border-style: dashed; }
.state.faint { background: color-mix(in srgb, var(--faded-fill) 45%, var(--raised)); border-color: var(--hairline); }
.arc { fill: none; stroke-width: 1.6; }
.arc.by-code { stroke: var(--arc-code); }
.arc.by-agent { stroke: var(--arc-agent); }
.arc.by-person { stroke: var(--arc-person); }
.arc.by-store { stroke: var(--arc-store); }
.arc.by-several { stroke: var(--arc-several); }
.arc.in { stroke: var(--arc-in); }
.arc.override { stroke-dasharray: 5 4; }
.arc.unused { stroke-dasharray: 3 4; }
.arc.lit, .arc.tried { stroke-width: 3; }
.arc.refused { stroke: var(--arc-refused); stroke-dasharray: 6 4; }
.arc.none { stroke: var(--arc-store); stroke-dasharray: 6 4; }
.arc-word { font-size: 11px; font-weight: 500; paint-order: stroke; stroke: var(--raised); stroke-width: 3px; stroke-linejoin: round; }
.arc-word.refused { fill: var(--refused-title); }
.arc-word.none { fill: var(--store-title); }
.spine { stroke: var(--line); stroke-width: 1.6; }
.legend-box { margin-top: 14px; }
.legend { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.legend div { display: flex; align-items: center; gap: 7px; }
.swatch { width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid; flex: none; }
.swatch.mark-text { border: 0; font-size: 12px; line-height: 12px; font-style: italic; text-align: center; }
.swatch.mark-dashed { border-style: dashed; }
.swatch.mark-off { border-style: dashed; border-color: var(--line); }
.swatch.mark-faint { border-color: var(--hairline); background: color-mix(in srgb, var(--code-fill) 45%, var(--raised)); }
.legend svg { width: 26px; height: 10px; flex: none; }
.state-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.gloss { margin-top: 8px; }
.intro { color: var(--muted); font-size: 14px; margin-top: 10px; }
.callout { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--store-border); background: var(--store-fill); color: var(--store-title); border-radius: 0 6px 6px 0; font-size: 14px; }
.callout a { color: inherit; }
.callout.info { border-left-color: var(--code-border); background: var(--code-fill); color: var(--code-title); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.none { color: var(--muted); font-size: 14px; }
.edge { border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
.edge > header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.arrow { color: var(--muted); }
dl.facts { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 3px 10px; margin: 8px 0 0; font-size: 14px; }
dl.facts dt { color: var(--muted); font-size: 13px; }
dl.facts dd { margin: 0; min-width: 0; }
dl.facts.inner { grid-template-columns: 78px minmax(0, 1fr); margin-top: 3px; font-size: 13px; }
ul.cases { list-style: none; margin: 0; padding: 0; }
ul.cases li + li { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); }
ul.cases .tag { margin-right: 4px; }
.for-kinds { color: var(--muted); font-size: 13px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
#result { scroll-margin-top: 8px; }
.try { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.try select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); max-width: 100%; }
ol.checks { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
ol.checks li { padding: 4px 0 4px 26px; position: relative; border-top: 1px solid var(--hairline); }
ol.checks li::before { position: absolute; left: 4px; top: 4px; width: 18px; text-align: center; }
ol.checks li.pass::before { content: "\2713"; color: var(--good-sub); }
ol.checks li.stop::before { content: "\2715"; color: var(--refused-sub); }
ol.checks li.maybe::before { content: "?"; color: var(--person-sub); }
ol.checks li.skip::before { content: "\2212"; color: var(--muted); }
ol.checks li.stop { color: var(--refused-title); }
.verdict { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 14px; border: 1px solid; }
.verdict.ok { background: var(--good-fill); border-color: var(--good-border); color: var(--good-title); }
.verdict.no { background: var(--refused-fill); border-color: var(--refused-border); color: var(--refused-title); }
.verdict.none { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; }
th, td { padding: 5px 8px 5px 0; border-top: 1px solid var(--hairline); vertical-align: top; overflow-wrap: break-word; }
td code { overflow-wrap: break-word; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
details.case-more { margin-top: 2px; }
details.case-more summary { font-size: 12.5px; }
.sources { margin-top: 16px; font-size: 13px; color: var(--muted); }
.key-hint { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.added-moves { color: var(--muted); font-size: 14px; }
.back-to-states { display: none; border: 0; background: none; padding: 0 0 10px; color: var(--link); text-decoration: underline; cursor: pointer; font-size: 13.5px; }
noscript p { margin: 16px; }
@media (min-width: 800px) {
  .controls { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: hidden auto; }
}
@media (max-width: 799px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .back-to-states { display: block; }
  dl.facts, dl.facts.inner { grid-template-columns: minmax(0, 1fr); }
  dl.facts dd { margin-bottom: 6px; }
  table.stacks thead { display: none; }
  table.stacks tr, table.stacks td { display: block; }
  table.stacks tr { border-top: 1px solid var(--hairline); padding: 6px 0; }
  table.stacks td { border: 0; padding: 1px 0; }
}
@media (pointer: coarse) { .key-hint { display: none; } }
@media (prefers-reduced-motion: no-preference) { .state, .chip, .machines button { transition: background-color .12s, border-color .12s; } }
</style>
</head>

   "intro": "A [[Watcher]] supervises one child for one [[Watcher instance]]. Two views exist: the Watcher file on disk, which survives everything, and the activity on its socket, which only a connected client sees. The Overseer derives the job state from them.",
   "views": [
    {
     "id": "file",
     "label": "Watcher file",
     "gloss": "`watcher-<instance>.json`, created exclusively as the Watcher's file claim, replaced atomically after. `unclaimed` and `lost` are what `livenessOf` reads; neither is stored in the file."
    },
    {
     "id": "activity",
     "label": "Socket activity",
     "gloss": "`WatcherActivity`, sent in `state` frames. Busy means a line arrived since the last `close-input`."
    }
   ],
   "mainPath": ["unclaimed", "claimed", "running", "ended"],
   "mainPathActivity": ["idle", "busy", "ended-activity"],
   "states": [
    {
     "id": "unclaimed",
     "view": "file",
     "who": "store",
     "synthetic": "Derived: no Watcher file exists.",
     "gloss": "The instance was never claimed. [[Regrouping]] names it, and the first [[Pass]] spawns that same instance; the exclusive Watcher file claim lets one run.",
     "gap": "gap-spawn-never-retried",
     "gapNote": "A spawn that never claims waits for the next Overseer."
    },
    {
     "id": "claimed",
     "view": "file",
     "who": "code",
     "gloss": "The file exists and holds the Watcher's own process identity. The launch file is read and the socket bound next."
    },
    {
     "id": "running",
     "view": "file",
     "who": "code",
     "gloss": "The child runs in a process group of its own. `childProcess` and `childProcessGroupId` are recorded."
    },
    {
     "id": "ended",
     "view": "file",
     "who": "store",
     "gloss": "The file records `end`: how the child ended, or why none ran. A Watcher whose child ran keeps its socket until the acknowledgement or `WATCHER_LINGER_FRAMES` client frames."
    },
    {
     "id": "lost",
     "view": "file",
     "who": "refused",
     "synthetic": "Derived: the file names a process that is gone, with no `end`.",
     "gloss": "The Watcher was killed or lost to a reboot. `livenessOf` decides by process identity, never by a clock."
    },
    {
     "id": "idle",
     "view": "activity",
     "who": "code",
     "gloss": "No line since the last `close-input`."
    },
    {
     "id": "busy",
     "view": "activity",
     "who": "agent",
     "gloss": "A child line arrived."
    },
    {
     "id": "ended-activity",
     "view": "activity",
     "who": "store",
     "label": "ended",
     "gloss": "The child exited. An acting frame is ignored, except the acknowledgement."
    },
    {
     "id": "stopping",
     "view": "activity",
     "who": "code",
     "gloss": "A `stop` frame arrived: stdin closes, then SIGTERM and SIGKILL to the group, each after the frame's `graceMilliseconds`: `SESSION_STOP_GRACE_MILLISECONDS` for a session, none for a process Watcher."
    }

    {

  "baton-pass": {
   "id": "baton-pass",
   "label": "Baton pass",
   "home": {
    "label": "Baton",
    "href": "../architecture/baton.md"
   },
   "sources": ["src/services/overseer/BatonPass.ts", "cli/overseer/OverseerForeground.ts", "src/shared/constants/OverseerLimits.ts"],
   "intro": "A [[Baton pass]] hands the board to an Overseer on the code on disk. The two write one file in turn, `<data>/overseer/baton-pass-<generation>.json`. The old Overseer keeps the [[Baton]] until the successor reports `ready`, and no Watcher is sent anything.",
   "mainPath": ["requested", "ready", "released", "serving"],
   "states": [
    {
     "id": "requested",
     "who": "code",
     "writer": "Old Overseer",
     "gloss": "Written before `overseer-restart` is answered, so the sender never reads an earlier outcome. The old Overseer keeps driving."
    },
    {
     "id": "ready",
     "who": "code",
     "writer": "Successor",
     "gloss": "Every preparation step passed: `build-bundles`, `read-board`, `read-jobs`, `read-watcher-files`, `install-version`. The successor holds no [[Baton]] and writes only its bundles.",
     "gap": "gap-baton-pass-builds-no-bridge",
     "gapNote": "`build-bundles` pins the Watcher bundle alone."
    },
    {
     "id": "released",
     "who": "code",
     "writer": "Old Overseer",
     "gloss": "The old Overseer finished a landing in progress, started no effect batch, logged `overseer-stopped` and closed its listener and its Watcher connections. Nobody drives the board from here until `serving`.",
     "undriven": true
    },
    {
     "id": "serving",
     "who": "store",
     "writer": "Successor",
     "gloss": "The successor bound the port, took the Baton and regrouped. The old Overseer reads this as `baton-passed` and exits."
    },
    {
     "id": "successor-failed",
     "who": "refused",
     "writer": "Successor",
     "gloss": "A step threw. Nothing after it runs. Only the old Overseer, once it has logged the failure, leaves the final `failed`."
    },
    {
     "id": "failed",
     "who": "refused",
     "writer": "Old Overseer",
     "gloss": "The final record of a failed Baton pass. `afterRelease` false reads as `kept-driving`, true as `taken-back`.",
     "outcomes": [
      {
       "outcome": "kept-driving",
       "when": "`afterRelease` false: the old Overseer never stopped and takes the next Pass."
      },
      {
       "outcome": "taken-back",
       "when": "`afterRelease` true: the old Overseer takes a generation above the failed one and rebinds its port, retrying `BATON_PASS_REBIND_TRIES` times."
      },
      {
       "outcome": "board undriven",
       "when": "The rebind fails: `baton-pass-failed` is logged, the process exits 1, and no Overseer is on the board."
      }
     ]
    }
   ],
   "entry": {
    "state": "requested",
    "moves": "`overseer-restart` reaches a serving Overseer. A second command while one runs is ignored.",
    "by": "onRuntimeCommand",
    "at": "cli/overseer/OverseerForeground.ts",
    "gap": "gap-stop-dropped-during-baton-pass"
   },
   "explicitEdges": [
    {
     "from": "requested",
     "to": "ready",
     "moves": "All five preparation steps pass.",
     "actor": "Successor",
     "by": "BatonPass.prepareAndAwaitRelease",
     "at": "src/services/overseer/BatonPass.ts"
    },
    {
     "from": "requested",
     "to": "successor-failed",
     "moves": "A preparation step throws.",
     "actor": "Successor",
     "by": "BatonPass.reportFailure",
     "at": "src/services/overseer/BatonPass.ts",
     "changes": ["`step`", "`error`", "`afterRelease` false"]
    },
    {
     "from": "requested",
     "to": "failed",
     "moves": "The successor could not start (`spawn`), or exits or stays silent past `BATON_PASS_READY_TRIES` (`report-ready`). A silent successor is killed.",
     "actor": "Old Overseer",
     "by": "BatonPass.handOver",
     "at": "src/services/overseer/BatonPass.ts",
     "log": ["baton-pass-failed"],
     "changes": ["`afterRelease` false"]
    },
    {
     "from": "ready",
     "to": "released",
     "moves": "The old Overseer reads `ready`, runs its release, then writes the file.",
     "actor": "Old Overseer",
     "by": "BatonPass.handOver",
     "at": "src/services/overseer/BatonPass.ts",
     "log": ["overseer-stopped"]
    },
    {
     "from": "ready",
     "to": "serving",
     "moves": "The old Overseer died: the successor starts as after a crash (`predecessor-gone`).",
     "actor": "Successor",
     "by": "BatonPass.reportServing",
     "at": "src/services/overseer/BatonPass.ts"
    },
    {
     "from": "ready",
     "to": "successor-failed",
     "moves": "No release within `BATON_PASS_RELEASE_TRIES` (`await-release`).",
     "actor": "Successor",
     "by": "BatonPass.prepareAndAwaitRelease",
     "at": "src/services/overseer/BatonPass.ts",
     "changes": ["`afterRelease` false"]
    },
    {
     "from": "released",
     "to": "serving",
     "moves": "The successor binds the port, takes the generation above and regroups.",
     "actor": "Successor",
     "by": "BatonPass.reportServing",
     "at": "src/services/overseer/BatonPass.ts"
    },
    {
     "from": "released",
     "to": "successor-failed",
     "moves": "A step throws: `bind-port`, `take-baton` or `regroup`.",
     "actor": "Successor",
     "by": "BatonPass.reportFailure",
     "at": "src/services/overseer/BatonPass.ts",
     "changes": ["`afterRelease` true"]
    },
    {
     "from": "released",
     "to": "failed",
     "moves": "The successor exits or stays silent past `BATON_PASS_RELEASE_TRIES` (`serve`). A silent successor is killed.",
     "actor": "Old Overseer",
     "by": "BatonPass.handOver",
     "at": "src/services/overseer/BatonPass.ts",
     "log": ["baton-pass-failed"],
     "changes": ["`afterRelease` true"]
    },
    {
     "from": "successor-failed",
     "to": "failed",
     "moves": "The old Overseer reads the report, logs it and raises the warning, then writes the file.",
     "actor": "Old Overseer",
     "by": "BatonPass.handOver",
     "at": "src/services/overseer/BatonPass.ts",
     "log": ["baton-pass-failed"],
     "changes": ["`afterRelease` from when it failed"]
    }
   ],
   "refusals": [
    {
     "reason": "baton-pass-failed",
     "when": "The successor process exits 1 with this refusal, or the old Overseer does when the port never came free.",
     "by": "lostPortRefusal",
     "at": "cli/overseer/OverseerForeground.ts"
    }
   ],
   "steps": {
    "source": "src/services/overseer/BatonPass.ts",
    "note": "A failure names one `BatonPassStep`.",
    "showOn": ["successor-failed", "failed"]
   }
  },
  "incident": {
   "id": "incident",
   "label": "Incident",
   "home": {
    "label": "Questions and incidents",
    "href": "../architecture/questions-and-incidents.md"
   },
   "sources": ["src/lib/tracker-model/Incidents.ts", "src/lib/tracker-model/IncidentMoves.ts", "src/services/control/constants/AllowedMovesByIncidentKind.ts", "src/services/overseer/AssistantSession.ts", "src/lib/tracker-model/Playbook.ts"],
   "intro": "An [[incident]] is trouble code cannot settle alone, addressed to the Assistant and never to User. It has no status field: `deliveredInTurn` says whether it went out, and a closed incident leaves the board in the same [[lock hold]] as its last move and lives on in the log.",
   "mainPath": ["undelivered", "delivered", "handled"],
   "states": [
    {
     "id": "undelivered",
     "who": "code",
     "gloss": "Open, `deliveredInTurn` null. It waits for an idle or booting Assistant."
    },
    {
     "id": "delivered",
     "who": "agent",
     "gloss": "Open, delivered in a numbered chat turn. Delivery is stored and never logged. `incident note` records a finding and leaves it here."
    },
    {
     "id": "handled",
     "who": "store",
     "synthetic": "Log only: `incident-handled` names the move.",
     "gloss": "A move the kind allows closed it."
    },
    {
     "id": "defaulted",
     "who": "store",
     "synthetic": "Log only: `incident-defaulted` names the move and cause.",
     "gloss": "Its fail-safe default was taken. `jobs` and the Overseer's state show it as a warning. `setup-failed`, `out-of-calls` and `gate-cannot-run` take their default once per ticket, then [[park]] (`DEFAULTS_TAKEN_ONCE`)."
    },
    {
     "id": "escalated",
     "who": "person",
     "synthetic": "Log only: `incident-escalated` names the decision.",
     "gloss": "It became an `agent-question` [[decision]] to User, with exactly the agent's questions."

     "log": ["incident-handled"],

  "filing-draft": {
   "id": "filing-draft",
   "label": "Filing draft",
   "home": {
    "label": "State machines",

   },
   "sources": ["src/lib/tracker-model/Drafts.ts", "src/lib/tracker-model/DraftContents.ts", "src/lib/tracker-model/@types/Draft.ts"],
   "intro": "A [[filing draft]] is a working record a filing session builds tickets from. It is not a [[draft ticket]]: it has no status, row or move. Its state is derived from two facts, an open question and a draft [[claim]], and no clock decides it.",
   "mainPath": ["researching", "closed"],
   "states": [
    {
     "id": "researching",
     "who": "agent",
     "gloss": "No question is open and an owner holds the draft claim. This is where `draft open` leaves it."

const STORAGE_KEY = 'state-explorer-theme';
const THEMES = ['auto', 'light', 'dark'];
const LADDER_GUTTER = 66;
const NARROWEST_BEND = 18;
const WIDEST_BEND = LADDER_GUTTER - 6;
const SINGLE_ARC_BASE_BEND = 26;
const SINGLE_ARC_BEND_PER_PIXEL = 0.28;
const NEAREST_ARC_FAN_OFFSET = 13;
const FARTHEST_ARC_FAN_OFFSET = 4;
const WORD_OFFSET_BELOW = 14;
const WORD_OFFSET_ABOVE = 8;
const WORD_LINE_HEIGHT = 12;
const HASH_DELAY_MILLISECONDS = 100;
const STACKED_LAYOUT_QUERY = '(max-width: 799px)';
const REDUCED_MOTION_QUERY = '(prefers-reduced-motion: reduce)';
const page = MODEL.page;
const state = { machine: 'ticket', selected: null, tryTarget: null, override: false, kind: 'all', view: 'file', rowKind: 'ticket', incidentKind: 'all' };
const element = (id) => document.getElementById(id);

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function anchorOf(term) {
  return term.toLowerCase().replace(/\s+/g, '-');
}

/* `code`, [[glossary term|shown words]] and [label](href). */
function format(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, term, shown) => `<a href="${page.glossary}#${anchorOf(term)}">${shown ?? term}</a>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => `<a href="${href}">${label}</a>`);
}

/* A MODEL sentence with its {name} places filled. */
function fill(text, values) {
  return text.replace(/\{(\w+)\}/g, (_, name) => values[name]);
}

function table(name) { return MODEL.tables[name].value; }
function machine() { return MODEL.machines[state.machine]; }
function stateOf(id) { return machine().states.find((candidate) => candidate.id === id); }
function labelOf(item) { return item.label ?? item.id; }

/* ---- Edges: the two legality tables are read, every other machine lists its own. ---- */

function tableEdges(tableName, annotations) {
  return Object.entries(table(tableName)).flatMap(([target, sources]) => sources.map((source) => {
    const annotation = annotations[`${source}>${target}`];
    return { ...annotation, from: source, to: target };
  }));
}

function ticketEffect(edge) {
  const effect = machine().targetEffects[edge.to];
  return {
    ...edge,
    stamps: edge.stampsInstead ?? effect.stamps,
    row: edge.rowInstead ?? effect.row,
    log: edge.logInstead ?? effect.log,
  };
}

function overrideEdges() {
  const current = machine();
  const statuses = table('TICKET_STATUSES');
  const legal = table('LEGAL_SOURCE_STATUSES_FOR_TICKET_STATUS');
  return statuses.flatMap((from) => statuses.flatMap((to) => {
    if (from === to || legal[to].includes(from) || !moveTicketPasses(from, to)) return [];
    return [{ from, to, overrideOnly: true, moves: fill(current.overrideNote.moves, { to }), actor: 'User', by: 'TicketMoves.moveTicket', at: current.checksBy.at }];
  }));
}

function moveTicketPasses(from, to) {
  return ticketWalk(from, to, true).every((step) => step.result !== 'stop');
}

function edgeIsForKind(edge) {
  return state.kind === 'all' || (edge.kinds ?? []).includes(state.kind);
}

function edgesOf() {
  const current = machine();
  if (current.id === 'ticket') {
    const legal = tableEdges('LEGAL_SOURCE_STATUSES_FOR_TICKET_STATUS', current.edges);
    return [...legal, ...(state.override ? overrideEdges() : [])].map(ticketEffect).concat(current.selfEdges);
  }
  if (current.id === 'job') return [...tableEdges('LEGAL_SOURCE_STATES_FOR_JOB_MOVE', current.edges), ...current.selfEdges].filter(edgeIsForKind);
  if (current.id === 'row') return [];
  const edges = current.explicitEdges;
  if (current.id === 'watcher') {
    const visible = new Set(visibleStates().map((candidate) => candidate.id));
    return edges.filter((edge) => visible.has(edge.from));
  }
  return edges;
}

function mainPathOf() {
  const current = machine();
  if (current.id === 'watcher' && state.view === 'activity') return current.mainPathActivity;
  if (current.id === 'job' && state.kind !== 'all') return current.kinds[state.kind].mainPath;
  return current.mainPath;
}

function stateIsOffForKind(id) {
  return machine().id === 'job' && state.kind !== 'all' && !machine().kinds[state.kind].states.includes(id);
}

/* The normal path first, so the spine is straight; then the states off it; then those the chosen kind never enters. */
function visibleStates() {
  const current = machine();
  const inView = current.id === 'watcher' ? current.states.filter((candidate) => candidate.view === state.view) : current.states;
  const path = mainPathOf();
  const onPath = path.map((id) => inView.find((candidate) => candidate.id === id));
  const offPath = inView.filter((candidate) => !path.includes(candidate.id));
  return [...onPath, ...offPath.filter((candidate) => !stateIsOffForKind(candidate.id)), ...offPath.filter((candidate) => stateIsOffForKind(candidate.id))];
}

function edgeKey(edge) { return `${edge.from}>${edge.to}`; }

/* A multi-case edge narrows to the chosen kind; a plain edge is its own single case. */
function visibleCases(edge) {
  if (edge.cases === undefined) return [edge];
  return edge.cases.filter((candidate) => state.machine !== 'job' || state.kind === 'all' || candidate.kinds === undefined || candidate.kinds.includes(state.kind));
}

function actorsOfCase(entry, edge) {
  return entry.actors ?? (entry.actor === undefined ? edge.actors ?? [edge.actor] : [entry.actor]);
}

function actorsOf(edge) {
  return [...new Set(visibleCases(edge).flatMap((entry) => actorsOfCase(entry, edge)))];
}

function whoOf(actor) {
  return MODEL.actors[actor] ?? 'store';
}

/* One who-colour for the arc, or `several` when actors of different colours move it. */
function arcWhoOf(edge) {
  const colours = new Set(actorsOf(edge).map(whoOf));
  return colours.size === 1 ? [...colours][0] : 'several';
}

function movesOfSelected() {
  const edges = edgesOf();
  return {
    out: orderedOut(edges.filter((edge) => edge.from === state.selected)),
    incoming: edges.filter((edge) => edge.to === state.selected && edge.from !== edge.to),
  };
}

function nextOnPath() {
  const path = mainPathOf();
  const index = path.indexOf(state.selected);
  return index === -1 ? undefined : path[index + 1];
}

/* What usually happens next first; then other moves, then what only a person does; unused moves last. */
function moveRank(edge) {
  if (edge.unused) return 3;
  if (edge.to === nextOnPath()) return 0;
  return actorsOf(edge).every((actor) => whoOf(actor) === 'person') ? 2 : 1;
}

function orderedOut(edges) {
  return edges.map((edge, index) => ({ edge, index, rank: moveRank(edge) }))
    .sort((a, b) => a.rank - b.rank || a.index - b.index)
    .map((entry) => entry.edge);
}

/* ---- moveTicket's checks, in code order. ---- */

function ticketWalk(from, to, override) {
  const current = MODEL.machines.ticket;
  const settled = table('SETTLED_TICKET_STATUSES');
  const legal = table('LEGAL_SOURCE_STATUSES_FOR_TICKET_STATUS')[to].includes(from);
  const tests = {
    same: from === to,
    toDraft: to === 'draft',
    ofDraft: from === 'draft' && to !== 'abandoned',
    toReadyForReview: to === 'ready-for-review',
    ofReadyForReview: from === 'ready-for-review' && to !== 'abandoned',
    illegal: !legal,
    toAbandoned: to === 'abandoned',
    unsettling: settled.includes(from) && !settled.includes(to),
  };
  const steps = [];
  for (const check of current.checks.filter((candidate) => !candidate.hiddenInTry)) {
    if (override && !check.holdsPastOverride) { steps.push({ check, result: 'skip' }); continue; }
    if (!tests[check.test]) { steps.push({ check, result: 'pass' }); continue; }
    if (check.conditional) { steps.push({ check, result: 'maybe' }); continue; }
    steps.push({ check, result: 'stop' });
    break;
  }
  return steps;
}

      + `<p class="hint">${format(current.filterHint)}</p>`;

function legendLine(mark, words) {
  return `<div>${mark}<span>${format(words)}</span></div>`;
}

function arcMark(classes) {
  return `<svg viewBox="0 0 26 10" aria-hidden="true"><path class="${classes}" d="M1 5H25"/></svg>`;
}

function renderLegend() {
  const words = page.legend;
  const current = machine();
  const visible = visibleStates();
  const hasEdges = current.id !== 'row';
  const swatches = Object.entries(MODEL.who).filter(([key]) => visible.some((candidate) => candidate.who === key)).map(([key, entry]) => (
    `<div><span class="swatch who-${key}"></span><span>${escapeHtml(entry.label)}${entry.note === '' ? '' : `: ${escapeHtml(entry.note)}`}</span></div>`));
  const lines = [];
  if (hasEdges) {
    lines.push(legendLine(arcMark('arc by-code'), words.outgoing), legendLine(arcMark('arc in'), words.incoming));
    if (edgesOf().some((edge) => arcWhoOf(edge) === 'several')) lines.push(legendLine(arcMark('arc by-several'), words.several));
    if (['ticket', 'job'].includes(current.id)) lines.push(legendLine(arcMark('arc by-store unused'), words.unused));
    if (current.id === 'ticket' && state.override) lines.push(legendLine(arcMark('arc by-person override'), words.override));
  }
  if (['ticket', 'job', 'row'].includes(current.id)) lines.push(legendLine(arcMark('arc tried refused'), words.tried));
  lines.push(legendLine('<svg viewBox="0 0 26 10" aria-hidden="true"><path class="spine" d="M13 0V10"/></svg>', words.spine));
  if (visible.some((candidate) => candidate.synthetic !== undefined)) lines.push(legendLine('<span class="swatch mark-text">Aa</span>', words.synthetic));
  if (visible.some((candidate) => candidate.unused)) lines.push(legendLine('<span class="swatch mark-dashed"></span>', words.unusedState));
  if (visible.some((candidate) => stateIsOffForKind(candidate.id))) lines.push(legendLine('<span class="swatch mark-off"></span>', words.offState));
  if (hasEdges) lines.push(legendLine('<span class="swatch mark-faint"></span>', words.faintState));
  element('legend').innerHTML = swatches.concat(lines).join('');
}

function renderLadder() {
  const current = machine();
  const main = new Set(mainPathOf());
  const { out, incoming } = movesOfSelected();
  const trial = trialOf();
  const targets = new Set([...out.map((edge) => edge.to), ...(trial === null ? [] : [state.tryTarget])]);
  const sources = new Set(incoming.map((edge) => edge.from));
  const hasEdges = current.id !== 'row';
  const items = visibleStates().map((candidate, index, all) => {
    const startsSide = index > 0 && main.has(all[index - 1].id) && !main.has(candidate.id);
    const off = stateIsOffForKind(candidate.id);
    const related = candidate.id === state.selected || targets.has(candidate.id) || sources.has(candidate.id);
    const tags = [
      candidate.processless ? '<small>no process</small>' : '',
      candidate.unused ? '<small>unused</small>' : '',
      off ? '<small>not this kind</small>' : '',
    ].join('');
    const classes = [
      'state', `who-${candidate.who}`,
      candidate.unused ? 'unused' : '',
      candidate.synthetic === undefined ? '' : 'synthetic',
      off ? 'off' : '',
      hasEdges && !related && !off ? 'faint' : '',
      targets.has(candidate.id) && candidate.id !== state.selected ? 'next' : '',
    ].filter(Boolean).join(' ');
    const name = `${labelOf(candidate)}${candidate.processless ? ', no process' : ''}${candidate.unused ? ', unused in production' : ''}${off ? ', not used by this kind' : ''}`;
    return `<li${startsSide ? ' class="break" data-caption="off the main path"' : ''}><button type="button" class="${classes}" data-state="${candidate.id}" aria-pressed="${candidate.id === state.selected}" tabindex="${candidate.id === state.selected ? 0 : -1}" aria-label="${escapeHtml(name)}">${escapeHtml(labelOf(candidate))}${tags}</button></li>`;
  }).join('');
  const markers = ['code', 'agent', 'person', 'store', 'several', 'in', 'refused'];
  element('ladder').innerHTML = `<svg aria-hidden="true"><defs>${markers.map((name) => (
    `<marker id="head-${name}" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="7.5" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="var(--arc-${name})"/></marker>`
  )).join('')}</defs><g id="arcs"></g></svg><ol aria-label="${escapeHtml(current.label)} states">${items}</ol>`;
  drawArcs();
}

function buttonBox(id) {
  const ladder = element('ladder');
  const button = ladder.querySelector(`[data-state="${id}"]`);
  if (button === null) return null;
  const origin = ladder.getBoundingClientRect();
  const box = button.getBoundingClientRect();
  const top = box.top - origin.top;
  const left = box.left - origin.left;
  return { left, right: left + box.width, top, bottom: top + box.height, middle: top + box.height / 2 };
}

/* Each side's arcs nest by distance: a wider bend and an outer anchor for each farther state, so no two share a line. */
function fanOf(edges) {
  const selected = buttonBox(state.selected);
  const fan = new Map();
  if (selected === null) return fan;
  const placed = edges.flatMap((edge) => {
    const other = buttonBox(edge.from === state.selected ? edge.to : edge.from);
    return other === null || edge.from === edge.to ? [] : [{ edge, distance: other.middle - selected.middle }];
  });
  for (const sign of [-1, 1]) {
    const group = placed.filter((entry) => Math.sign(entry.distance) === sign).sort((a, b) => Math.abs(a.distance) - Math.abs(b.distance));
    group.forEach((entry, i) => {
      const crowded = group.length > 1;
      const share = crowded ? i / (group.length - 1) : 0;
      const bend = crowded ? NARROWEST_BEND + share * (WIDEST_BEND - NARROWEST_BEND) : Math.min(WIDEST_BEND, SINGLE_ARC_BASE_BEND + Math.abs(entry.distance) * SINGLE_ARC_BEND_PER_PIXEL);
      const offset = crowded ? sign * (NEAREST_ARC_FAN_OFFSET - share * (NEAREST_ARC_FAN_OFFSET - FARTHEST_ARC_FAN_OFFSET)) : 0;
      fan.set(edgeKey(entry.edge), { bend, offset });
    });
  }
  return fan;
}

function arcPath(from, to, side, placing) {
  const outgoing = side === 'right';
  const start = { x: outgoing ? from.right : from.left, y: from.middle + (outgoing ? placing.offset : 0) };
  const end = { x: outgoing ? to.right + 3 : to.left - 3, y: to.middle + (outgoing ? 0 : placing.offset) };
  const bend = (outgoing ? 1 : -1) * placing.bend;
  return `M${start.x} ${start.y}C${start.x + bend} ${start.y} ${end.x + bend} ${end.y} ${end.x} ${end.y}`;
}

function selfArc(box) {
  const x = box.right;
  return `M${x} ${box.middle - 8}C${x + 34} ${box.middle - 24} ${x + 34} ${box.middle + 24} ${x + 3} ${box.middle + 8}`;
}

function arcPathOf(edge, side, fan) {
  const from = buttonBox(edge.from);
  const to = buttonBox(edge.to);
  if (from === null || to === null) return null;
  return edge.from === edge.to ? selfArc(from) : arcPath(from, to, side, fan.get(edgeKey(edge)) ?? { bend: SINGLE_ARC_BASE_BEND, offset: 0 });
}

function arcMarkup(edge, direction, fan) {
  const path = arcPathOf(edge, direction === 'out' ? 'right' : 'left', fan);
  if (path === null) return '';
  const who = direction === 'out' ? arcWhoOf(edge) : 'in';
  const classes = ['arc', direction === 'out' ? `by-${who}` : 'in', edge.overrideOnly ? 'override' : '', edge.unused ? 'unused' : ''].filter(Boolean);
  return `<path class="${classes.join(' ')}" data-edge="${edgeKey(edge)}" d="${path}" marker-end="url(#head-${who})"/>`;
}

function triedArcMarkup(trial, fan) {
  const edge = { from: state.selected, to: state.tryTarget };
  const path = arcPathOf(edge, 'right', fan);
  if (path === null) return '';
  const look = { ok: `by-${trial.who}`, refused: 'refused', none: 'none' }[trial.outcome];
  const head = { ok: trial.who, refused: 'refused', none: 'store' }[trial.outcome];
  const arc = `<path class="arc tried ${look}" data-edge="${edgeKey(edge)}" d="${path}" marker-end="url(#head-${head})"/>`;
  if (trial.outcome === 'ok') return arc;
  const from = buttonBox(edge.from);
  const to = buttonBox(edge.to);
  const y = to.middle + (to.middle >= from.middle ? WORD_OFFSET_BELOW : -WORD_OFFSET_ABOVE);
  const x = element('ladder').getBoundingClientRect().width;
  const lines = trial.word.split(' ').map((line, i) => `<tspan x="${x}" dy="${i === 0 ? 0 : WORD_LINE_HEIGHT}">${escapeHtml(line)}</tspan>`).join('');
  return `${arc}<text class="arc-word ${look}" y="${y}" text-anchor="end">${lines}</text>`;
}

function spineMarkup() {
  const path = mainPathOf();
  return path.slice(1).map((id, index) => {
    const upper = buttonBox(path[index]);
    const lower = buttonBox(id);
    if (upper === null || lower === null) return '';
    const x = (upper.left + upper.right) / 2;
    return `<line class="spine" x1="${x}" y1="${upper.bottom}" x2="${x}" y2="${lower.top}"/>`;
  }).join('');
}

function drawArcs() {
  const arcs = element('arcs');
  if (arcs === null) return;
  const { out, incoming } = movesOfSelected();
  const trial = trialOf();
  const triedKey = trial === null ? null : `${state.selected}>${state.tryTarget}`;
  const outFan = fanOf(trial === null || out.some((edge) => edgeKey(edge) === triedKey) ? out : [...out, { from: state.selected, to: state.tryTarget }]);
  const plainOut = out.filter((edge) => edgeKey(edge) !== triedKey);
  const incomingFan = fanOf(incoming);
  arcs.innerHTML = spineMarkup()
    + incoming.map((edge) => arcMarkup(edge, 'in', incomingFan)).join('')
    + plainOut.map((edge) => arcMarkup(edge, 'out', outFan)).join('')
    + (trial === null ? '' : triedArcMarkup(trial, outFan));
}

/* ---- Rendering: the result. ---- */

function actorTag(actor) {
  return `<span class="tag who-${whoOf(actor)}">${escapeHtml(actor)}</span>`;
}

function decidedBy(by, at) {
  return `<code>${escapeHtml(by)}</code> in <code>${escapeHtml(at)}</code>`;
}

function gapLink(anchor, words) {
  return `<a href="${page.knownGaps}#${anchor}">${escapeHtml(words)}</a>`;
}

function gapFact(anchor) {
  const note = Object.hasOwn(page.gapNotes, anchor) ? `${format(page.gapNotes[anchor])} ` : '';
  return `${note}${gapLink(anchor, 'Known gaps')}`;
}

function logList(log, note) {
  if (log === undefined || log.length === 0) return 'No log record.';
  return `${log.map((kind) => `<code>${escapeHtml(kind)}</code>`).join(' ')}${note === undefined ? '' : ` ${format(note)}`}`;
}

function logLabel() {
  return `<a href="${page.logKinds}">Log</a>`;
}

function changesList(edge, entry) {
  const parts = [];
  if (edge.stamps !== undefined) parts.push(format(edge.stamps));
  (edge.changes ?? []).forEach((change) => parts.push(format(change)));
  if (entry !== edge) (entry.changes ?? []).forEach((change) => parts.push(format(change)));
  return parts.join('; ');
}

function isResume(edge) {
  return machine().id === 'job' && edge.to === 'running' && table('PROCESSLESS_JOB_STATES').includes(edge.from);
}

function caseList(edge, cases) {
  const showKinds = state.machine === 'job' && state.kind === 'all';
  return `<ul class="cases">${cases.map((entry) => {
    const lines = [];
    if (entry.changes !== undefined) lines.push(['Changes', entry.changes.map(format).join('; ')]);
    lines.push(['Decided by', decidedBy(entry.by ?? edge.by, entry.at ?? edge.at)], [logLabel(), logList(entry.log)]);
    if (entry.gap !== undefined) lines.push(['As built', gapFact(entry.gap)]);
    const kinds = showKinds && entry.kinds !== undefined ? ` <span class="for-kinds">For ${entry.kinds.map(escapeHtml).join(', ')}.</span>` : '';
    return `<li><p>${actorsOfCase(entry, edge).map(actorTag).join('')} ${format(entry.moves)}${kinds}</p><details class="case-more"><summary>${escapeHtml(page.caseDetails)}</summary><dl class="facts inner">${lines.map(([term, value]) => `<dt>${term}</dt><dd>${value}</dd>`).join('')}</dl></details></li>`;
  }).join('')}</ul>`;
}

function stateChip(id) {
  const target = stateOf(id);
  const label = labelOf(target);
  return `<button type="button" class="chip who-${target.who}" data-state="${id}" aria-label="${escapeHtml(fill(page.goToState, { state: label }))}">${escapeHtml(label)}</button>`;
}

function stateName(id) {
  return `<code>${escapeHtml(labelOf(stateOf(id)))}</code>`;
}

function routeOf(edge, direction) {
  if (edge.from === edge.to) return stateName(edge.from);
  const arrow = '<span class="arrow" aria-hidden="true">&rarr;</span>';
  return direction === 'out' ? `${stateName(edge.from)}${arrow}${stateChip(edge.to)}` : `${stateChip(edge.from)}${arrow}${stateName(edge.to)}`;
}

function edgeCard(edge, direction) {
  const cases = visibleCases(edge);
  const only = cases.length === 1 ? cases[0] : null;
  const tags = [
    actorsOf(edge).map(actorTag).join(''),
    direction === 'out' && !edge.unused && edge.to === nextOnPath() ? '<span class="tag who-good">normal path</span>' : '',
    edge.unused ? '<span class="tag who-store">unused in production</span>' : '',
    edge.overrideOnly ? '<span class="tag who-person">only through ticket status</span>' : '',
    edge.outside ? '<span class="tag who-store">outside the table</span>' : '',
    isResume(edge) ? '<span class="tag who-code">resume: next Watcher instance</span>' : '',
  ].join('');
  const facts = only === null ? [['Moves it', caseList(edge, cases)]] : [
    ['Moves it', format(only.moves) + (edge.extraMoves === undefined ? '' : ` ${format(edge.extraMoves)}`)],
    ['Decided by', decidedBy(only.by ?? edge.by, only.at ?? edge.at)],
  ];
  const changes = changesList(edge, only ?? edge);
  if (changes !== '') facts.push(['Changes', changes]);
  if (edge.row !== undefined) facts.push(['Row', format(edge.row)]);
  if (edge.spawnedBy !== undefined) facts.push(['Spawned by', `<code>${escapeHtml(edge.spawnedBy)}</code>`]);
  if (edge.exits !== undefined) facts.push(['Ways out', edge.exits.map(format).join('<br>')]);
  if (!edge.unused && only !== null) facts.push([logLabel(), logList(only.log ?? edge.log, edge.logNote)]);
  if (only === null && edge.logNote !== undefined) facts.push([logLabel(), format(edge.logNote)]);
  if (edge.refusal !== undefined) facts.push(['Refused', `<code>${escapeHtml(edge.refusal)}</code>`]);
  if (edge.note !== undefined) facts.push(['Also', format(edge.note)]);
  const gap = edge.gap ?? only?.gap;
  if (gap !== undefined) facts.push(['As built', gapFact(gap)]);
  return `<article class="edge" data-edge="${edgeKey(edge)}"><header>${routeOf(edge, direction)}${tags}</header><dl class="facts">${facts.map(([term, value]) => `<dt>${term}</dt><dd>${value}</dd>`).join('')}</dl></article>`;
}

function chipsFor(ids) {
  if (ids.length === 0) return '<p class="none">Nothing moves into this state.</p>';
  return `<div class="chips">${ids.map(stateChip).join('')}</div>`;
}

function badgesOf(current) {
  const badges = [
    current.processless ? '<span class="tag who-person">no process</span>' : '',
    current.unused ? '<span class="tag who-store">unused in production</span>' : '',
    current.undriven ? '<span class="tag who-person">nobody drives</span>' : '',
    current.onlyRow ? '<span class="tag who-store">no ticket status matches</span>' : '',
    current.writer === undefined ? '' : `<span class="tag who-code">written by ${escapeHtml(current.writer)}</span>`,
  ];
  return badges.join('');
}

function bridgeWordOf(id) {
  const words = table('DisplayWords');
  return ['ticket', 'row'].includes(machine().id) && Object.hasOwn(words, id) ? words[id] : null;
}

function overridePanel() {
  const current = machine();
  const skipped = current.checks.filter((check) => !check.holdsPastOverride).map((check) => `<code>${check.reason}</code>`).join(', ');
  const held = current.checks.filter((check) => check.holdsPastOverride).map((check) => `<tr><td><code>${check.reason}</code></td><td>${format(check.when)}</td></tr>`).join('');
  return `<h3>Through ticket status</h3><div class="callout info">${format(current.overrideNote.sets)} It skips ${skipped}. ${format(current.overrideNote.effects)} Decided in ${decidedBy(current.overrideNote.by, current.overrideNote.at)}.</div>`
    + `<details><summary>What it still cannot do</summary><table><thead><tr><th>Refusal</th><th>When</th></tr></thead><tbody>${held}</tbody></table></details>`
    + `<p class="gloss">${format(current.byHand.moves)} Refused with ${current.byHand.refusals.map((reason) => `<code>${reason}</code>`).join(', ')}, in ${decidedBy(current.byHand.by, current.byHand.at)}.</p>`;
}

function overrideAddedMoves(out) {
  if (machine().id !== 'ticket' || !state.override) return '';
  const words = machine().overrideNote;
  const added = out.filter((edge) => edge.overrideOnly).length;
  const line = added === 0 ? words.addsNone : added === 1 ? words.addsOne : fill(words.addsMany, { count: added });
  return `<p class="added-moves">${format(line)}</p>`;
}

function lowerFirst(text) {
  return text.charAt(0).toLowerCase() + text.slice(1);
}

/* One tried move: its verdict, the arc's look and the panel's words all come from here. */
function tryTicket() {
  const current = machine();
  const from = state.selected;
  const to = state.tryTarget;
  const edge = edgesOf().find((candidate) => candidate.from === from && candidate.to === to);
  const sources = `<p class="sources">Decided by ${decidedBy(current.checksBy.by, current.checksBy.at)}. ${format(current.everyMove)}</p>`;
  const outside = state.override ? undefined : edge?.outsideMoveTicket;
  if (outside !== undefined) {
    const words = fill(current.try.outside, { to, verb: outside.verb, reason: outside.wouldRefuse });
    return { outcome: 'ok', word: 'moves', who: arcWhoOf(edge), html: `<div class="verdict ok">${format(words)}</div>${edgeCard(edge, 'out')}` };
  }
  const steps = ticketWalk(from, to, state.override);
  const stopped = steps.find((step) => step.result === 'stop');
  const wording = page.tryWording;
  const list = `<ol class="checks">${steps.map((step) => `<li class="${step.result}">${format(`\`${step.check.reason}\` ${fill(wording[step.result], { when: lowerFirst(step.check.when) })}`)}</li>`).join('')}</ol>`;
  if (stopped !== undefined) {
    return { outcome: 'refused', word: 'refused', html: `${list}<div class="verdict no">Refused <code>${stopped.check.reason}</code>.</div>${sources}` };
  }
  const maybes = steps.filter((step) => step.result === 'maybe').map((step) => `\`${step.check.reason}\``).join(', ');
  const words = `${fill(current.try.moves, { to })}${maybes === '' ? '' : ` ${fill(current.try.maybe, { reasons: maybes })}`}`;
  return { outcome: 'ok', word: 'moves', who: arcWhoOf(edge), html: `${list}<div class="verdict ok">${format(words)}</div>${edgeCard(edge, 'out')}${sources}` };
}

function tryJob() {
  const current = machine();
  const words = current.try;
  const from = state.selected;
  const to = state.tryTarget;
  const illegal = current.refusals.find((refusal) => refusal.reason === 'job-move-illegal');
  const finished = current.refusals.find((refusal) => refusal.reason === 'job-finished');
  if (from === 'ended') {
    const reopening = to === words.reopeningTarget && (state.kind === 'all' || state.kind === words.reopeningKind);
    return { outcome: 'refused', word: 'refused', html: `<div class="verdict no">Refused <code>${finished.reason}</code>${reopening ? `, ${format(words.reopening)}` : ''}. ${format(finished.when)}</div><p class="sources">Decided by ${decidedBy(finished.by, finished.at)}.</p>` };
  }
  if (to === 'launching' || !table('LEGAL_SOURCE_STATES_FOR_JOB_MOVE')[to].includes(from)) {
    return { outcome: 'refused', word: 'refused', html: `<div class="verdict no">Refused <code>${illegal.reason}</code>. ${format(illegal.when)}${to === 'launching' ? ` ${format(words.launching)}` : ''}</div><p class="sources">Decided by ${decidedBy(illegal.by, illegal.at)}.</p>` };
  }
  const edge = { ...current.edges[`${from}>${to}`], from, to };
  const sources = `<p class="sources">The table is enforced by ${decidedBy(words.by.by, words.by.at)}.</p>`;
  if (edge.unused) return { outcome: 'none', word: 'unused', html: `<div class="verdict none">${format(words.unused)}</div>${sources}` };
  if (!edgeIsForKind(edge)) return { outcome: 'none', word: 'other kind', html: `<div class="verdict none">${format(fill(words.notForKind, { kind: state.kind }))}</div>${sources}` };
  const resume = isResume(edge) ? ` ${words.resume}` : '';
  return { outcome: 'ok', word: 'legal', who: arcWhoOf(edge), html: `<div class="verdict ok">${format(`${words.legal}${resume}`)}</div>${edgeCard(edge, 'out')}${sources}` };
}

function rowEffects(from, to) {
  const current = machine();
  const words = current.try;
  const entry = current.entry[to];
  const notes = [];
  if (to === words.agentRemovedOn && !words.agentKeptFrom.includes(from)) notes.push(words.agentRemoved);
  if (to !== words.mergeQueuedKeptOn) notes.push(words.mergeQueuedRemoved);
  notes.push(from !== to || to === words.historyAlwaysOn ? words.historyGains : words.historyUnchanged);
  return `<dl class="facts"><dt><code>start</code></dt><dd>${format(entry.start)}</dd><dt><code>end</code></dt><dd>${format(entry.end)}</dd><dt>Also changes</dt><dd>${entry.other.concat(notes).map(format).join('<br>')}</dd></dl>`
    + `<p class="sources">Decided by ${decidedBy(current.by.by, current.by.at)}. ${format(current.correction)} ${format(current.logNote)}</p>`;
}

function ownedMoveIsExempt(from, to) {
  const { always, fromTo } = machine().try.ownedExempt;
  return always.includes(to) || (to === fromTo.to && from === fromTo.from);
}

function tryRow() {
  const current = machine();
  const words = current.try;
  const from = state.selected;
  const to = state.tryTarget;
  const kind = current.rowKinds.find((candidate) => candidate.id === state.rowKind);
  const verb = Object.entries(table('TRANSITION_SUBCOMMANDS')).find(([, status]) => status === to)?.[0];
  if (verb === undefined) {
    return { outcome: 'none', word: 'no verb', html: `<div class="verdict none">${format(kind.owned ? words.noVerbOwned : words.noVerbUnowned)}</div>${rowEffects(from, to)}` };
  }
  if (kind.owned && !ownedMoveIsExempt(from, to)) {
    const condition = fill(page.tryWording.refusedVerdict, { when: lowerFirst(current.refusal.when) });
    const verdict = `<div class="verdict no">Refused <code>${current.refusal.reason}</code>. ${format(condition)}</div>`;
    return { outcome: 'refused', word: 'refused', html: `${verdict}<p class="sources">Decided by ${decidedBy(current.refusal.by, current.refusal.at)}. ${format(words.refusedTail)}</p>${rowEffects(from, to)}` };
  }
  return { outcome: 'ok', word: 'moves', who: whoOf(words.actor), html: `<div class="verdict ok">${format(fill(words.moves, { to, verb }))}</div>${rowEffects(from, to)}` };
}

function trialOf() {
  if (state.tryTarget === null) return null;
  if (state.machine === 'ticket') return tryTicket();
  if (state.machine === 'job') return tryJob();
  return state.machine === 'row' ? tryRow() : null;
}

function targetIsLegalFromHere(target) {
  const from = state.selected;
  if (state.machine === 'ticket') {
    const edge = edgesOf().find((candidate) => candidate.from === from && candidate.to === target);
    return edge !== undefined;
  }
  if (state.machine === 'row') return Object.values(table('TRANSITION_SUBCOMMANDS')).includes(target);
  return from !== 'ended' && target !== 'launching' && table('LEGAL_SOURCE_STATES_FOR_JOB_MOVE')[target].includes(from);
}

function tryOptions() {
  const words = page.tryGroups;
  const targets = tryTargetsOf();
  const legal = targets.filter(targetIsLegalFromHere);
  const others = targets.filter((target) => !legal.includes(target));
  const option = (target) => `<option value="${target}"${target === state.tryTarget ? ' selected' : ''}>${target}</option>`;
  const group = (label, values) => (values.length === 0 ? '' : `<optgroup label="${escapeHtml(label)}">${values.map(option).join('')}</optgroup>`);
  const onRow = state.machine === 'row';
  return group(onRow ? words.taskVerb : words.legal, legal) + group(onRow ? words.noVerb : words.refused, others);
}

function tryPanel() {
  if (tryTargetsOf().length === 0) return '';
  const trial = trialOf();
  return `<h3>Try a move</h3><div class="try"><label for="tryTarget"><code>${escapeHtml(labelOf(stateOf(state.selected)))}</code> to</label>`
    + `<select class="mono" id="tryTarget"><option value="">pick a target</option>${tryOptions()}</select></div>`
    + `<div id="tryResult">${trial === null ? '<p class="none">Pick a target, legal or not, to see what the code does.</p>' : trial.html}</div>`;
}

function refusalsPanel() {
  const current = machine();
  const fromChecks = current.id === 'ticket' ? current.checks.map((check) => ({ ...check, ...current.checksBy })) : [];
  const refusals = [...fromChecks, ...(current.refusals ?? []), ...(current.refusal === undefined ? [] : [current.refusal])];
  if (refusals.length === 0) return '';
  const rows = refusals.map((refusal) => `<tr><td><code>${escapeHtml(refusal.reason)}</code></td><td>${format(refusal.when)}</td><td><code>${escapeHtml(refusal.by).replace(/\./g, '.<wbr>')}</code></td></tr>`).join('');
  return `<details><summary>Refusals anywhere in this machine (${refusals.length})</summary><table class="stacks"><thead><tr><th>Reason</th><th>When</th><th>Decided by</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

function outcomesPanel() {
  const current = machine();
  if (current.id !== 'job' || state.kind === 'all' || state.selected === 'ended') return '';
  return `<h3>A ${escapeHtml(state.kind)} job ends with</h3><div class="chips">${current.kinds[state.kind].outcomes.map((outcome) => `<code>${outcome}</code>`).join(' ')}</div>`;
}

function incidentKindPanel() {
  const current = machine();
  if (current.id !== 'incident' || state.incidentKind === 'all') return '';
  const opener = current.kindOpeners[state.incidentKind];
  const moves = table('ALLOWED_MOVES_BY_INCIDENT_KIND')[state.incidentKind];
  const openedBy = decidedBy(opener.openedBy, opener.at) + (opener.alsoOpenedBy === undefined ? '' : `; ${decidedBy(opener.alsoOpenedBy, opener.alsoAt)}`);
  return `<h3>A ${escapeHtml(state.incidentKind)} incident</h3><dl class="facts"><dt>Opens when</dt><dd>${format(opener.when)}</dd><dt>Opened by</dt><dd>${openedBy}</dd><dt>Default move</dt><dd><code>${opener.defaultMove}</code></dd><dt>Allowed moves</dt><dd>${moves.map((move) => `<code>${move}</code>`).join(' ')}</dd></dl>`;
}

function batonStepsPanel() {
  const { steps } = machine();
  if (steps === undefined || !steps.showOn.includes(state.selected)) return '';
  return `<h3>The steps a failure can name</h3><p class="gloss">${format(steps.note)}</p><div class="chips">${table('BatonPassStep').map((step) => `<code>${step}</code>`).join(' ')}</div>`;
}

function tablePanel() {
  const current = machine();
  const sourceTable = current.id === 'ticket' ? 'LEGAL_SOURCE_STATUSES_FOR_TICKET_STATUS' : current.id === 'job' ? 'LEGAL_SOURCE_STATES_FOR_JOB_MOVE' : current.id === 'incident' ? 'ALLOWED_MOVES_BY_INCIDENT_KIND' : null;
  if (sourceTable === null) return '';
  const entry = MODEL.tables[sourceTable];
  const left = current.id === 'incident' ? 'Kind' : 'To reach';
  const right = current.id === 'incident' ? 'Allowed moves' : 'Be in one of';
  const rows = Object.entries(entry.value).map(([key, values]) => `<tr><td><code>${key}</code></td><td>${values.length === 0 ? 'none' : values.map((value) => `<code>${value}</code>`).join(' ')}</td></tr>`).join('');
  return `<details><summary>The table as copied: ${sourceTable}</summary><table><thead><tr><th>${left}</th><th>${right}</th></tr></thead><tbody>${rows}</tbody></table><p class="sources">From <code>${entry.source}</code>.</p></details>`;
}

function statusText() {
  const selected = stateOf(state.selected);
  const { out, incoming } = movesOfSelected();
  const moves = machine().id === 'row' ? '' : `: ${out.length} moves out, ${incoming.length} in`;
  const word = bridgeWordOf(selected.id);
  const trial = trialOf();
  return `${labelOf(selected)}${moves}${word === null ? '' : `, Bridge shows ${word}`}${trial === null ? '' : `. Move to ${state.tryTarget}: ${trial.word}`}.`;
}

function renderResult() {
  const current = machine();
  const selected = stateOf(state.selected);
  const { out, incoming } = movesOfSelected();
  const parts = [`<button type="button" class="back-to-states" data-back-to-states>${escapeHtml(page.backToStates)}</button>`, `<div class="state-head"><h2 id="resultHeading" tabindex="-1"><code>${escapeHtml(labelOf(selected))}</code></h2>${badgesOf(selected)}</div>`, `<p class="gloss">${format(selected.gloss)}</p>`];
  const word = bridgeWordOf(selected.id);
  if (word !== null) parts.push(`<p class="gloss">${format(`The [[Bridge]] shows: ${word}.`)}</p>`);
  if (selected.synthetic !== undefined) parts.push(`<p class="gloss">${format(selected.synthetic)}</p>`);
  if (selected.gap !== undefined) parts.push(`<div class="callout">As built: ${selected.gapNote === undefined ? '' : `${format(selected.gapNote)} `}${gapLink(selected.gap, 'See known gaps.')}</div>`);
  if (stateIsOffForKind(selected.id)) parts.push(`<div class="callout info">${format(fill(current.neverEnters, { kind: state.kind }))}</div>`);
  if (current.id === 'job' && state.kind !== 'all' && selected.kindNotes?.[state.kind] !== undefined) parts.push(`<div class="callout">${format(selected.kindNotes[state.kind])}</div>`);
  if (current.anyPhase !== undefined) parts.push(`<div class="callout info">${format(current.anyPhase.text)}</div>`);
  parts.push(incidentKindPanel());

  if (current.entry?.state === selected.id) {
    const entry = current.entry;
    parts.push(`<h3>How it starts</h3><dl class="facts"><dt>Moves it</dt><dd>${format(entry.moves)}</dd><dt>Decided by</dt><dd>${decidedBy(entry.by, entry.at)}</dd>${entry.log === undefined ? '' : `<dt>${logLabel()}</dt><dd>${logList(entry.log)}</dd>`}${entry.gap === undefined ? '' : `<dt>As built</dt><dd>${gapLink(entry.gap, 'Known gaps')}</dd>`}</dl>`);
  }
  if (current.id === 'row') {
    parts.push(`<div class="callout info">${format(current.noEdges)}</div>`, tryPanel());
    parts.push(`<h3>Reached by</h3><ul>${selected.reachedBy.map((line) => `<li>${format(line)}</li>`).join('')}</ul>`);
  } else {
    parts.push(`<h3>Goes to (${out.length})</h3>${overrideAddedMoves(out)}${out.length === 0 ? '<p class="none">Nothing moves out of this state.</p>' : out.map((edge) => edgeCard(edge, 'out')).join('')}`);
    if (selected.outcomes !== undefined) parts.push(`<h3>What it means</h3><table><tbody>${selected.outcomes.map((row) => `<tr><td><code>${row.outcome}</code></td><td>${format(row.when)}</td></tr>`).join('')}</tbody></table>`);
    if (isProcesslessResume()) parts.push(resumePanel());
    parts.push(`<h3>Comes from</h3>${chipsFor([...new Set(incoming.map((edge) => edge.from))])}`);
    if (incoming.length > 0) parts.push(`<details><summary>What moves it here (${incoming.length})</summary>${incoming.map((edge) => edgeCard(edge, 'in')).join('')}</details>`);
    parts.push(tryPanel());
    if (current.id === 'ticket' && state.override) parts.push(overridePanel());
  }
  if (current.id === 'job' && selected.id === 'ended') parts.push(endedPanel());
  parts.push(batonStepsPanel(), outcomesPanel(), refusalsPanel(), tablePanel());
  parts.push(`<p class="sources">Sources at commit <code>${page.commit}</code>: ${current.sources.map((source) => `<code>${source}</code>`).join(' ')}. Printed refusals: <a href="${page.refusals}">Refusals</a>. Rules: <a href="${current.home.href}">${escapeHtml(current.home.label)}</a>.</p>`);
  element('result').innerHTML = parts.join('');
  element('status').textContent = statusText();
}

function isProcesslessResume() {
  return machine().id === 'job' && table('PROCESSLESS_JOB_STATES').includes(state.selected);
}

function resumePanel() {
  const resume = machine().resume;
  return `<h3>${escapeHtml(resume.title)}</h3><div class="callout info">${resume.lines.map(format).join('<br>')}<br>Decided by ${decidedBy(resume.by, resume.at)}.</div>`;
}

function endedPanel() {
  const current = machine();
  const kinds = state.kind === 'all' ? [] : current.kinds[state.kind].outcomes;
  const outcomes = table('JOB_OUTCOMES').filter((outcome) => state.kind === 'all' || kinds.includes(outcome));
  return `<h3>Outcomes</h3><div class="chips">${outcomes.map((outcome) => `<code>${outcome}</code>`).join(' ')}</div><p class="gloss">${format(current.outcomeNote)}</p>`;
}

/* ---- State changes, hash and events. ---- */

let hashTimer = null;
let legendWasToggled = false;

/* Coalesced, since browsers throttle a burst of history writes such as a held arrow key. */
function writeHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(writeHashNow, HASH_DELAY_MILLISECONDS);
}

function writeHashNow() {
  const values = new URLSearchParams();
  values.set('machine', state.machine);
  values.set('state', state.selected);
  if (state.tryTarget !== null) values.set('try', state.tryTarget);
  if (state.machine === 'ticket' && state.override) values.set('override', '1');
  if (state.machine === 'job' && state.kind !== 'all') values.set('kind', state.kind);
  if (state.machine === 'row') values.set('rowKind', state.rowKind);
  if (state.machine === 'watcher') values.set('view', state.view);
  if (state.machine === 'incident' && state.incidentKind !== 'all') values.set('incidentKind', state.incidentKind);
  const hash = `#${values.toString()}`;
  if (location.hash === hash) return;
  try { history.replaceState(null, '', hash); } catch { location.hash = hash; }
}

function readHash() {
  const values = new URLSearchParams(location.hash.slice(1));
  const machineId = values.get('machine');
  state.machine = machineId !== null && Object.hasOwn(MODEL.machines, machineId) ? machineId : 'ticket';
  state.override = values.get('override') === '1';
  const kind = values.get('kind');
  state.kind = kind !== null && table('JOB_KINDS').includes(kind) ? kind : 'all';
  const rowKind = values.get('rowKind');
  state.rowKind = MODEL.machines.row.rowKinds.some((candidate) => candidate.id === rowKind) ? rowKind : 'ticket';
  const view = values.get('view');
  state.view = MODEL.machines.watcher.views.some((candidate) => candidate.id === view) ? view : 'file';
  const incidentKind = values.get('incidentKind');
  state.incidentKind = incidentKind !== null && table('INCIDENT_KINDS').includes(incidentKind) ? incidentKind : 'all';
  const selected = values.get('state');
  state.selected = selected !== null && visibleStates().some((candidate) => candidate.id === selected) ? selected : visibleStates()[0].id;
  state.tryTarget = values.get('try');
  if (state.tryTarget !== null && !tryTargetsOf().includes(state.tryTarget)) state.tryTarget = null;
}

function tryTargetsOf() {
  if (state.machine === 'ticket') return table('TICKET_STATUSES');
  if (state.machine === 'row') return table('TASK_STATUSES');
  if (state.machine === 'job') return [...table('JOB_STATES'), 'ended'];
  return [];
}

/* A panel that fits keeps its Legend open, so the ladder is never cut off; a reader's own toggle stands. */
function fitLegend() {
  if (legendWasToggled) return;
  const legendBox = element('legendBox');
  legendBox.open = true;
  if (window.matchMedia(STACKED_LAYOUT_QUERY).matches) { legendBox.open = false; return; }
  const controls = legendBox.closest('.controls');
  legendBox.open = controls.scrollHeight <= controls.clientHeight;
}

function renderAll() {
  renderChrome();
  renderLadder();
  renderResult();
  renderTheme();
  fitLegend();
}

function scrollBehaviour() {
  return window.matchMedia(REDUCED_MOTION_QUERY).matches ? 'auto' : 'smooth';
}

function scrollResultToTop() {
  element('result').scrollIntoView({ block: 'start', behavior: scrollBehaviour() });
}

/* The ladder stays on screen while the panel beside it shrinks, so a reader scrolled past the new heading is brought back to it. */
function keepResultHeadingInView() {
  if (element('result').getBoundingClientRect().top < 0) scrollResultToTop();
}

function select(id, focusTarget) {
  state.selected = id;
  state.tryTarget = null;
  renderLadder();
  renderResult();
  writeHash();
  if (focusTarget === 'ladder') element('ladder').querySelector(`[data-state="${id}"]`)?.focus();
  if (focusTarget === 'result') element('resultHeading')?.focus({ preventScroll: true });
  if (focusTarget === 'result' || !window.matchMedia(STACKED_LAYOUT_QUERY).matches) keepResultHeadingInView();
}

function switchMachine(id) {
  state.machine = id;
  state.tryTarget = null;
  state.selected = visibleStates()[0].id;
  renderAll();
  writeHash();
}

function refilter() {
  state.tryTarget = null;
  if (!visibleStates().some((candidate) => candidate.id === state.selected)) state.selected = visibleStates()[0].id;
  renderAll();
  writeHash();
}

function chooseTryTarget(value) {
  state.tryTarget = value === '' ? null : value;
  const trial = trialOf();
  element('tryResult').innerHTML = trial === null ? '<p class="none">Pick a target, legal or not, to see what the code does.</p>' : trial.html;
  element('status').textContent = statusText();
  renderLadder();
  writeHash();
}

/* On the stacked layout the answer sits under the ladder, so a tap brings it up; a keyboard user keeps their place. */
function showResultAfterTap(event) {
  if (event.detail === 0 || !window.matchMedia(STACKED_LAYOUT_QUERY).matches) return;
  scrollResultToTop();
}

function backToStates() {
  element('ladder').closest('.controls').scrollIntoView({ block: 'start', behavior: scrollBehaviour() });
  element('ladder').querySelector(`[data-state="${state.selected}"]`)?.focus({ preventScroll: true });
}

function readTheme() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    return THEMES.includes(stored) ? stored : 'auto';
  } catch { return 'auto'; }
}

function applyTheme(theme) {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

let chosenTheme = readTheme();

function renderTheme() {
  element('theme').innerHTML = THEMES.map((theme) => `<button type="button" data-theme-choice="${theme}" aria-pressed="${theme === chosenTheme}">${theme}</button>`).join('');
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('button');
  if (target === null) return;
  if (target.dataset.backToStates !== undefined) { backToStates(); return; }
  if (target.dataset.machine !== undefined) { switchMachine(target.dataset.machine); element('machines').querySelector(`[data-machine="${target.dataset.machine}"]`)?.focus(); return; }
  if (target.dataset.state !== undefined) {
    if (target.classList.contains('state')) {
      select(target.dataset.state, 'ladder');
      showResultAfterTap(event);
    } else {
      select(target.dataset.state, 'result');
    }
    return;
  }
  if (target.dataset.view !== undefined) { state.view = target.dataset.view; refilter(); element('filter').querySelector(`[data-view="${state.view}"]`)?.focus(); return; }
  if (target.dataset.themeChoice !== undefined) {
    chosenTheme = target.dataset.themeChoice;
    applyTheme(chosenTheme);
    try { localStorage.setItem(STORAGE_KEY, chosenTheme); } catch { /* the page works without storage */ }
    renderTheme();
    element('theme').querySelector(`[data-theme-choice="${chosenTheme}"]`)?.focus();
  }
});

document.addEventListener('change', (event) => {
  const { id } = event.target;
  if (id === 'override') { state.override = event.target.checked; refilter(); element('override')?.focus(); }
  if (id === 'kind') { state.kind = event.target.value; refilter(); element('kind')?.focus(); }
  if (id === 'rowKind') { state.rowKind = event.target.value; refilter(); element('rowKind')?.focus(); }
  if (id === 'incidentKind') { state.incidentKind = event.target.value; refilter(); element('incidentKind')?.focus(); }
  if (id === 'tryTarget') chooseTryTarget(event.target.value);
});

element('ladder').addEventListener('keydown', (event) => {
  const button = event.target.closest('[data-state]');
  if (button === null || !['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const ids = visibleStates().map((candidate) => candidate.id);
  const index = ids.indexOf(button.dataset.state);
  const next = { ArrowDown: Math.min(index + 1, ids.length - 1), ArrowUp: Math.max(index - 1, 0), Home: 0, End: ids.length - 1 }[event.key];
  select(ids[next], 'ladder');
});

function lightEdge(event, lit) {
  const card = event.target.closest?.('.edge');
  if (card === null || card === undefined) return;
  element('ladder').querySelectorAll(`[data-edge="${card.dataset.edge}"]`).forEach((path) => path.classList.toggle('lit', lit));
}
element('result').addEventListener('mouseover', (event) => lightEdge(event, true));
element('result').addEventListener('mouseout', (event) => lightEdge(event, false));
element('result').addEventListener('focusin', (event) => lightEdge(event, true));
element('result').addEventListener('focusout', (event) => lightEdge(event, false));

window.addEventListener('hashchange', () => { readHash(); renderAll(); });
window.addEventListener('resize', () => { drawArcs(); fitLegend(); });
element('legendBox').querySelector('summary').addEventListener('click', () => { legendWasToggled = true; });

applyTheme(chosenTheme);
readHash();
renderAll();
writeHash();
</script>
</body>
</html>
