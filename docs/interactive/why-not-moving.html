/* The Playbook's rules, as data over MODEL. Everything down to the page wiring is pure, so a scratch script can compare it with the TypeScript. */

function jobOf(state) { return MODEL.jobs.find((job) => job.id === state.job); }
function decisionOf(state) { return MODEL.decisions.find((decision) => decision.id === state.decision); }
function incidentOf(state) { return MODEL.incidents.find((incident) => incident.id === state.incident); }
function holdFormOf(state) { return MODEL.holdForms.find((form) => form.id === state.hold); }
function dependencyOf(state) { return MODEL.dependencies.find((dependency) => dependency.id === state.dependencies); }

/* Playbook.nextStepsOf: the derived flags. */
function boardFlagsOf(state) {
  const pipelineIsSet = state.pipeline;
  const reviewIsSet = state.pipeline && state.review;
  const resumesAreHeld = state.usage || state.install || !pipelineIsSet || state.outage;
  const newWorkIsHeld = resumesAreHeld || state.overseerState === 'paused';
  return { pipelineIsSet, reviewIsSet, resumesAreHeld, newWorkIsHeld };
}

/* Playbook.targetOf ignores the release mark; Airlocks.targetOf sends a release ticket to the main line. */
function targetsOf(state) {
  const groupTarget = state.group === '' ? null : `${MODEL.targets.GROUP_TARGET_PREFIX}${state.group}`;
  return {
    groupTarget,
    playbookTarget: groupTarget ?? MODEL.targets.mainLine,
    airlockTarget: groupTarget === null || state.releaseTicket ? MODEL.targets.mainLine : groupTarget
  };
}

/* Playbook.ticketIsHeld, in its own order; `merge-mark` is the one that is no fault. */
function ticketHoldReasonsOf(state) {
  const decision = decisionOf(state);
  const incident = incidentOf(state);
  const reasons = [];
  if (state.hold !== 'none') reasons.push('hold');
  if (state.mergeMark) reasons.push('merge-mark');
  if (state.agentConfig) reasons.push('agent-config');
  if (decision.holdsLaunch === true) reasons.push('decision');
  if (incident.id !== 'none') reasons.push('incident');
  if (state.managedBlock) reasons.push('managed-block');
  return reasons;
}

/* Playbook.jobAwaitsAnAnswer, read from what names the job. */
function jobAwaitsAnAnswer(state) {
  return decisionOf(state).namesJob === true || MODEL.playbook.QUESTION_LIKE_INCIDENT_KINDS.includes(state.incident);
}

/* Playbook.jobResumeIsHeld and its neighbours, each reason named for the walk. */
function resumeHoldsOf(state) {
  const holds = [];
  if (state.managedBlock) holds.push('job-held-managed-block');
  if (state.agentConfig) holds.push('job-held-agent-config');
  if (jobAwaitsAnAnswer(state)) holds.push('job-held-answer');
  return holds;
}

/* Playbook.candidateOf: `null` when the ticket has no work to start. */
function candidateOf(state, flags) {
  if (state.status === 'in-review') return flags.reviewIsSet ? { phase: 'review', step: 'launch-review' } : null;
  if (state.status === 'in-progress') return state.earlierBuild ? { phase: 'rebuild', step: 'launch-build' } : null;
  if (state.status !== 'pending' || !dependencyOf(state).settled) return null;
  return { phase: 'build', step: 'launch-build' };
}

/* Playbook.freeSlotsOf. */
function freeSlotsOf(state) { return Math.max(0, state.concurrency - state.liveJobs); }

/* Playbook.crashBoundStepsOf and redHandoffStepsOf for this ticket's job. */
function jobStepsOf(state, flags) {
  const job = jobOf(state);
  if (job.state !== 'interrupted') return [];
  if (job.spent === true) return [job.interruption === 'handoff-red' ? { kind: 'park', cause: 'red-resumes-spent' } : { kind: 'replace-job' }];
  return flags.resumesAreHeld || resumeHoldsOf(state).length > 0 ? [] : [{ kind: 'resume-job' }];
}

/* Playbook.nextStepsOf, narrowed to the steps that name this ticket, in order. */
function stepsForThisTicket(state) {
  const flags = boardFlagsOf(state);
  const hasJob = state.job !== 'none';
  const steps = jobStepsOf(state, flags);
  const parkSteps = [];
  if (state.hold === 'none' && MODEL.playbook.parkableStatuses.includes(state.status) && !hasJob) {
    if (state.failedPasses >= MODEL.limits.FAILED_PASSES_BEFORE_PARKING) parkSteps.push({ kind: 'park', cause: 'failed-passes' });
    else if (state.status === 'in-progress' && state.reviewResumesSpent) parkSteps.push({ kind: 'park', cause: 'red-resumes-spent' });
  }
  if (state.incident !== 'job-lost' && !hasJob && state.replacedInARow >= MODEL.limits.REPLACED_JOBS_BEFORE_JOB_LOST) parkSteps.push({ kind: 'open-incident' });
  steps.push(...parkSteps);
  const settledThisPass = parkSteps.length > 0;
  if (flags.newWorkIsHeld || settledThisPass || hasJob) return steps;
  const held = ticketHoldReasonsOf(state).length > 0;
  if (held) return steps;
  if (!flags.reviewIsSet && state.status === 'in-review' && decisionOf(state).kind !== 'merge-refused') steps.push({ kind: 'queue-merge' });
  const candidate = candidateOf(state, flags);
  if (candidate !== null && state.ahead < freeSlotsOf(state)) steps.push({ kind: candidate.step, phase: candidate.phase });
  return steps;
}

/* AirlockClaims.mergeCandidatesOf, its filters in order. */
function mergeFiltersOf(state) {
  const decision = decisionOf(state);
  const bundleIsReady = !state.releaseTicket || (state.bundleIntegrated && !state.refreshHolds);
  return [
    { check: 'airlock-hold', cleared: state.hold === 'none' },
    { check: 'airlock-unmarked', cleared: state.mergeMark },
    { check: 'airlock-decision', cleared: !MODEL.airlockClaims.SLOT_HOLDING_DECISION_KINDS.includes(decision.kind) },
    { check: 'airlock-job', cleared: state.job === 'none' },
    { check: 'airlock-bundle', cleared: bundleIsReady }
  ];
}

/* One outcome per Airlock rule, read by the walk and the panel alike. */
function airlockOutcomeOf(check, cleared) {
  if (cleared) return 'clear';
  return MODEL.checks[check].waits === true ? 'wait' : 'stop';
}

/* Airlocks.allocate and the sweep gate in DrivePass.runOnePass, in order. A sweep runs only inside a Pass, so a down Overseer stops it first. */
function allocationGatesOf(state) {
  const flags = boardFlagsOf(state);
  return [
    { check: 'overseer-down', cleared: !state.overseerDown },
    { check: 'airlock-no-pipeline', cleared: flags.pipelineIsSet },
    { check: 'airlock-target-held', cleared: !state.targetHeld },
    { check: 'airlock-paused', cleared: state.overseerState !== 'paused' },
    state.job === 'merge' ? { check: 'airlock-held-by-own-job', cleared: false } : { check: 'airlock-held', cleared: !state.airlockHeld },
    { check: 'airlock-queue', cleared: state.queueAhead === 0 }
  ];
}

/* AirlockClaims.claimAirlock: the first refusal, in its order, or `null`. */
function claimRefusalOf(state, isCandidate) {
  if (state.airlockHeld || state.job === 'merge') return 'airlock-held';
  if (!isCandidate) return 'merge-candidate-not-queued';
  return state.higherQueued ? 'higher-priority-queued' : null;
}

/* `runOnePass` follows the Playbook before `airlocks.sweep`, so the Airlock meets a ticket parked this Pass as held. */
function parksThisPass(state) { return stepsForThisTicket(state).some((step) => step.kind === 'park'); }

function mergePanelOf(state) {
  if (state.status !== 'in-review') return null;
  const filters = mergeFiltersOf(state);
  const gates = allocationGatesOf(state);
  const isCandidate = filters.every((filter) => filter.cleared);
  const parksFirst = parksThisPass(state);
  const stopsThisTicket = (gate) => !gate.cleared && (isCandidate || gate.check !== 'airlock-queue');
  const stoppedGate = gates.find(stopsThisTicket)?.check ?? null;
  return { filters, gates, isCandidate, parksFirst, stoppedGate, claimRefusal: claimRefusalOf(state, isCandidate && !parksFirst) };
}

/* Which way this ticket can move at all. */
function pathOf(state) {
  if (MODEL.ticketStatuses.settled.includes(state.status)) return 'settled';
  if (state.job !== 'none') return 'job';
  return state.status === 'in-review' && state.mergeMark ? 'merge' : 'launch';
}

function candidateStopOf(state, flags) {
  if (state.status === 'draft') return { check: 'status-draft', outcome: 'stop' };
  if (state.status === 'reviewed') return { check: state.group === '' ? 'status-reviewed' : 'status-integrated', outcome: state.group === '' ? 'stop' : 'wait' };
  if (state.status === 'in-progress' && !state.earlierBuild) return { check: 'no-earlier-build', outcome: 'stop' };
  if (state.status === 'pending' && !dependencyOf(state).settled) return { check: 'dependencies', outcome: 'stop' };
  if (state.status === 'in-review' && !flags.reviewIsSet && decisionOf(state).kind === 'merge-refused') return { check: 'merge-refused-waits', outcome: 'stop' };
  return null;
}

/* The walk: one entry per rule in Playbook order, each saying whether it stopped this ticket. */
function walkOf(state) {
  const flags = boardFlagsOf(state);
  const path = pathOf(state);
  const job = jobOf(state);
  const steps = stepsForThisTicket(state);
  const settlesThisPass = steps.some((step) => step.kind === 'park' || step.kind === 'open-incident' || step.kind === 'replace-job');
  const jobIsResumable = job.state === 'interrupted' && job.spent !== true;
  const boardApplies = !settlesThisPass && (path === 'launch' || (path === 'job' && jobIsResumable));
  const walk = [];
  const add = (check, outcome, extra = {}) => walk.push({ check, outcome, ...extra });

  const nothingNamesASettledTicket = path === 'settled' && steps.length === 0;
  add('overseer-down', nothingNamesASettledTicket ? 'skip' : state.overseerDown ? 'stop' : 'clear');

  const boardHolds = [['usage-limit', state.usage], ['install-changed', state.install], ['pipeline-unset', !flags.pipelineIsSet], ['outage-open', state.outage]];
  for (const [check, active] of boardHolds) add(check, !boardApplies ? 'skip' : active ? 'stop' : 'clear');
  const pausedHoldsThis = state.overseerState === 'paused' && path === 'launch';
  add('paused', !boardApplies ? 'skip' : pausedHoldsThis ? 'stop' : 'clear', { resumeIsNotHeld: state.overseerState === 'paused' && path === 'job' });

  if (job.check !== undefined) add(job.check, job.check === 'job-at-work' || job.check === 'job-merge' ? 'clear' : 'stop');
  else if (job.state === 'interrupted') {
    const step = steps.find((candidate) => ['resume-job', 'replace-job', 'park'].includes(candidate.kind));
    if (job.spent === true) add(job.interruption === 'handoff-red' ? 'job-park' : 'job-replace', 'act');
    else {
      for (const hold of resumeHoldsOf(state)) add(hold, 'stop');
      add('job-resume', step === undefined ? 'skip' : 'act');
    }
  }

  const noJobPath = path === 'launch' || path === 'merge';
  const parksForFailures = steps.some((step) => step.kind === 'park' && step.cause === 'failed-passes');
  const parksForReview = steps.some((step) => step.kind === 'park' && step.cause === 'red-resumes-spent') && state.job === 'none';
  add('park-failed-passes', !noJobPath ? 'skip' : parksForFailures ? 'act' : 'clear');
  add('park-review-resumes', !noJobPath || state.status !== 'in-progress' ? 'skip' : parksForReview ? 'act' : 'clear');
  add('job-lost', !noJobPath ? 'skip' : steps.some((step) => step.kind === 'open-incident') ? 'act' : 'clear');

  const launchPathApplies = path === 'launch' && !settlesThisPass;
  const holdReasons = ticketHoldReasonsOf(state);
  for (const check of ['hold', 'agent-config', 'decision', 'incident', 'managed-block']) {
    add(check, !launchPathApplies ? 'skip' : holdReasons.includes(check) ? 'stop' : 'clear');
  }
  if (path === 'merge' && !parksThisPass(state)) add('merge-mark', 'clear');

  const candidate = candidateOf(state, flags);
  const candidateStop = candidateStopOf(state, flags);
  if (launchPathApplies && candidateStop !== null) add(candidateStop.check, candidateStop.outcome);
  if (launchPathApplies && candidate !== null) {
    add('candidate-found', 'clear', { phase: candidate.phase });
    add('launch-slot', state.ahead < freeSlotsOf(state) ? 'clear' : 'wait');
  }
  if (steps.some((step) => step.kind === 'queue-merge')) add('queue-merge', 'act');

  const panel = mergePanelOf(state);
  if (panel !== null) {
    const onMergePath = path === 'merge' && !panel.parksFirst;
    const mergeBlockerChecks = ['airlock-hold', 'airlock-decision', 'airlock-bundle'];
    for (const filter of panel.filters) {
      if (!mergeBlockerChecks.includes(filter.check)) continue;
      add(filter.check, onMergePath ? airlockOutcomeOf(filter.check, filter.cleared) : 'skip');
    }
    for (const gate of panel.gates) {
      if (gate.check === 'overseer-down') continue;
      const stopsAMergeJob = state.job === 'merge' && gate.check === 'airlock-no-pipeline';
      add(gate.check, onMergePath || stopsAMergeJob ? airlockOutcomeOf(gate.check, gate.cleared) : 'skip');
    }
    add('airlock-higher-priority', onMergePath ? airlockOutcomeOf('airlock-higher-priority', !state.higherQueued) : 'skip');
  }
  return walk;
}

function blockersOf(walk) { return walk.filter((entry) => entry.outcome === 'stop' || entry.outcome === 'wait'); }

/* The headline: a settled ticket no step names first, then the Overseer being down, what the next Pass does, and the first blocker. */
function verdictOf(state, walk) {
  const blockers = blockersOf(walk);
  const steps = stepsForThisTicket(state);
  const path = pathOf(state);
  if (path === 'settled' && steps.length === 0) return { fromStep: 'settled' };
  if (state.overseerDown) return { fromCheck: 'overseer-down' };
  if (steps.length > 0) return { fromStep: steps[0].kind, cause: steps[0].cause, phase: steps[0].phase };
  if (blockers.length > 0) return { fromCheck: blockers[0].check };
  if (path === 'merge') return { fromStep: 'airlock' };
  return { fromCheck: jobOf(state).check ?? 'job-at-work' };
}

function diagnose(state) {
  const walk = walkOf(state);
  return {
    steps: stepsForThisTicket(state), walk, blockers: blockersOf(walk), verdict: verdictOf(state, walk), panel: mergePanelOf(state),
    flags: boardFlagsOf(state), targets: targetsOf(state), path: pathOf(state)
  };
}

/* Page wiring. Nothing above this line touches the document. */

/** The fragment GitHub gives a runbook heading: lower case, punctuation dropped, spaces as hyphens. */
function headingFragmentOf(heading) {
  return heading.toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/ /g, '-');
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}

/* MODEL prose: backticks become code, `[label](href)` a relative link. Anything else stays text. */
function rich(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((\.\.?\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
}

function fill(text, values) {
  return text.replace(/\{([A-Za-z_]+)\}/g, (whole, name) => (Object.hasOwn(values, name) ? String(values[name]) : whole));
}

/* A control cannot hold a link, so the fixed verdict bar shows a link's words only. */
function withoutLinks(text) { return text.replace(/\[([^\]]+)\]\([^)\s]+\)/g, '$1'); }

/* A group name and a free hold text arrive from the hash, so they lose the marks `rich` reads. */
function plainValue(text) { return String(text).replace(/[`[\]()]/g, ''); }

function element(id) { return document.getElementById(id); }

function holdValuesOf(state) {
  const form = holdFormOf(state);
  const holdText = form.id === 'other-text' ? plainValue(state.holdText) : form.text ?? '';
  const quotedHold = holdText === '' ? '' : `: \`${holdText}\``;
  return {
    holdSuffix: form.id === 'no-reason' ? ': `held: yes`' : quotedHold,
    holdMeaning: fill(form.meaning ?? '', MODEL.limits),
    holdClears: form.clears ?? ''
  };
}

function valuesOf(state, result) {
  const incident = incidentOf(state);
  const dependency = dependencyOf(state);
  const target = result.panel !== null && result.path === 'merge' ? result.targets.airlockTarget : result.targets.playbookTarget;
  return {
    ...MODEL.limits,
    ...MODEL.concurrency,
    DEFAULT_OVERSEER_STATE: MODEL.overseerStates.DEFAULT_OVERSEER_STATE,
    ...holdValuesOf(state),
    target: `\`${plainValue(target)}\``,
    groupTarget: `\`${plainValue(result.targets.groupTarget ?? '')}\``,
    status: state.status,
    incidentKind: incident.id,
    incidentDefaultMove: incident.defaultMove ?? '',
    incidentDefaultNote: incident.defaultNote ?? '',
    dependencyTitle: dependency.title ?? '',
    dependencyClears: dependency.clears ?? '',
    free: freeSlotsOf(state),
    ahead: state.ahead,
    queueAhead: `${state.queueAhead} ${state.queueAhead === 1 ? 'candidate' : 'candidates'}`
  };
}

/* A check as this state words it: three checks take their words from the row they read. */
function checkFor(entry, state) {
  const check = MODEL.checks[entry.check];
  if (entry.check === 'decision') return { ...check, ...decisionOf(state), actor: 'User', stage: 'ticket' };
  if (entry.check === 'dependencies') return { ...check, refused: dependencyOf(state).neverSettles === true };
  if (entry.check !== 'airlock-decision') return check;
  const { title, rule, clears, runbook, gaps } = decisionOf(state);
  return { ...check, title, rule, clears, runbook, gaps };
}

function toneOfCheck(check) {
  return check.refused === true ? 'refused' : MODEL.toneOfActor[check.actor] ?? 'store';
}

function gapLinkOf(anchor) {
  return `<a href="${MODEL.page.knownGaps}#${anchor}">${rich(MODEL.gapTitles[anchor])}</a>`;
}

function gapLinesOf(check) {
  if (check.gaps === undefined || check.gaps.length === 0) return '';
  return `<p class="gap">${escapeHtml(MODEL.page.asBuilt)} ${check.gaps.map(gapLinkOf).join(', ')}</p>`;
}

function blockerCard(entry, position, state, values) {
  const check = checkFor(entry, state);
  const page = MODEL.page;
  const isFirst = position === 0;
  const tone = toneOfCheck(check);
  const confirm = (check.confirm ?? []).map((command) => (command.startsWith('forge') ? `<code>${escapeHtml(command)}</code>` : rich(command))).join(', ');
  const fact = (label, html) => `<dt>${escapeHtml(label)}</dt><dd>${html}</dd>`;
  return `<article class="blocker frame-${tone}${isFirst ? ' first' : ''}">
    <header>
      <span class="tag ${isFirst ? `tone-${tone}` : 'out-skip'}">${escapeHtml(isFirst ? page.firstBlockerTag : page.laterBlockerTag)}</span>
      <h4>${rich(fill(check.title, values))}</h4>
      <span class="tag tone-${tone}">${escapeHtml(MODEL.actorWords[check.actor])}</span>
    </header>
    <dl class="facts">
      ${fact(page.labelRule, rich(fill(check.rule, values)))}
      ${fact(page.labelCode, `<code>${escapeHtml(check.symbol)}</code> in <code>${escapeHtml(check.source)}</code>`)}
      ${confirm === '' ? '' : fact(page.labelConfirm, confirm)}
      ${check.shows === undefined ? '' : fact(page.labelShows, rich(fill(check.shows, values)))}
      ${check.clears === undefined ? '' : fact(page.labelClears, rich(fill(check.clears, values)))}
      ${check.runbook === undefined ? '' : fact(page.labelRunbook, `<a href="${page.home.href}#${headingFragmentOf(check.runbook)}">${escapeHtml(check.runbook)}</a>`)}
    </dl>
    ${gapLinesOf(check)}
  </article>`;
}

function verdictCard(state, result, values) {
  const page = MODEL.page;
  const { verdict, steps } = result;
  const stepValues = { ...values, cause: verdict.cause ?? '', phase: verdict.phase ?? '' };
  let tone; let title; let detail; let clears; let decidedBy;
  if (verdict.fromCheck === undefined) {
    const headline = MODEL.verdicts[verdict.fromStep];
    ({ tone } = headline);
    title = headline.title; decidedBy = headline.decidedBy;
    const landsOnAGroup = verdict.fromStep === 'airlock' && result.targets.airlockTarget !== MODEL.targets.mainLine;
    detail = landsOnAGroup ? `${headline.detail} ${headline.groupDetail}` : headline.detail;
  } else {
    const shown = checkFor({ check: verdict.fromCheck }, state);
    const isBlocker = result.blockers.some((blocker) => blocker.check === verdict.fromCheck);
    tone = toneOfCheck(shown);
    title = shown.title; decidedBy = shown.symbol;
    if (isBlocker && shown.clears !== undefined) clears = shown.clears;
    else detail = shown.rule;
  }
  const clearsLine = clears === undefined ? '' : `${page.labelClears}: ${fill(clears, stepValues)}`;
  const stepLine = steps.length === 0 ? '' : `<p class="decided">${escapeHtml(page.nextPassLabel)} ${steps.map((step) => `<code>${escapeHtml(step.kind)}</code>`).join(', ')}</p>`;
  const miniVerdict = element('mini-verdict');
  miniVerdict.className = `tone-${tone}`;
  const miniTitle = rich(withoutLinks(fill(title, stepValues)));
  const miniLine = clears === undefined ? escapeHtml(page.seeDiagnosis) : `${rich(withoutLinks(clearsLine))}<span class="visually-hidden"> ${escapeHtml(page.seeDiagnosis)}</span>`;
  miniVerdict.innerHTML = `<span class="mini-title">${miniTitle}</span><small>${miniLine}</small>`;
  return `<div class="verdict tone-${tone}">
    <div class="eyebrow">${escapeHtml(page.verdictEyebrow)}</div>
    <h2>${rich(fill(title, stepValues))}</h2>
    ${clears === undefined ? `<p>${rich(fill(detail, stepValues))}</p>` : `<p><span class="clears-label">${escapeHtml(page.labelClears)}:</span> ${rich(fill(clears, stepValues))}</p>`}
    ${stepLine}
    <p class="decided">${escapeHtml(page.decidedByLabel)} <code>${escapeHtml(decidedBy)}</code></p>
  </div>`;
}

/* The stage's strongest outcome; a stage that stops or waits takes the colour of who moves next. */
function stageChipOf(stageId, walk, state) {
  const entries = walk.filter((entry) => MODEL.checks[entry.check].stage === stageId);
  for (const outcome of ['stop', 'wait']) {
    const halting = entries.find((entry) => entry.outcome === outcome);
    if (halting !== undefined) return { outcome, className: `tone-${toneOfCheck(checkFor(halting, state))}` };
  }
  const outcome = ['act', 'clear'].find((candidate) => entries.some((entry) => entry.outcome === candidate)) ?? 'skip';
  return { outcome, className: `out-${outcome}` };
}

function stagesStrip(walk, state) {
  const page = MODEL.page;
  const items = MODEL.stages.map((stage) => {
    const { outcome, className } = stageChipOf(stage.id, walk, state);
    const word = MODEL.outcomes[outcome];
    return `<li class="${className}"><span class="mark" aria-hidden="true">${word.glyph}</span>${escapeHtml(stage.label)}<span class="visually-hidden"> ${escapeHtml(word.label)}</span></li>`;
  });
  const legend = Object.values(MODEL.outcomes).map((word) => `<li><span class="mark" aria-hidden="true">${word.glyph}</span>${escapeHtml(word.label)}</li>`).join('');
  return `<h3 class="section-title">${escapeHtml(page.stagesTitle)}</h3>
    <ol class="stages">${items.join('<li class="sep" aria-hidden="true">›</li>')}</ol>
    <ul class="legend" aria-label="${escapeHtml(page.legendTitle)}">${legend}</ul>
    <p class="legend-colours">${escapeHtml(page.legendColours)}</p>`;
}

function launchSlotsFigure(state, result) {
  const page = MODEL.page;
  const candidate = candidateOf(state, result.flags);
  const firstBlocker = result.blockers[0]?.check ?? 'launch-slot';
  if (candidate === null || firstBlocker !== 'launch-slot' || !result.walk.some((entry) => entry.check === 'launch-slot')) return '';
  const free = freeSlotsOf(state);
  const moreBox = (hidden) => (hidden > 0 ? `<div class="slot tone-store">${escapeHtml(fill(page.slotMore, { count: hidden }))}</div>` : '');
  const jobBox = (position) => `<div class="slot tone-agent">job ${position + 1}</div>`;
  const shownJobs = Math.min(state.liveJobs, SHOWN_JOB_BOXES);
  const jobsWithinLimit = Math.min(shownJobs, state.concurrency);
  const withinLimitBoxes = Array.from({ length: jobsWithinLimit }, (unused, i) => jobBox(i));
  const overLimitBoxes = Array.from({ length: shownJobs - jobsWithinLimit }, (unused, i) => jobBox(i + jobsWithinLimit));
  const freeBoxes = Array.from({ length: free }, () => '<div class="slot free tone-store">free</div>');
  const limitMark = `<span class="slot-limit">${escapeHtml(fill(page.slotLimit, { concurrency: state.concurrency }))}</span>`;
  const shownAhead = Math.min(state.ahead, SHOWN_QUEUE_BOXES);
  const aheadBoxes = Array.from({ length: shownAhead }, (unused, i) => `<div class="slot tone-store">${i < free ? 'takes a free one' : 'ahead'}</div>`);
  const gets = state.ahead < free;
  const thisTicket = `<div class="slot this ${gets ? 'tone-good' : 'tone-store waiting'}">this ticket</div>`;
  const keys = [
    ['priority', `\`${state.priority}\`, rank ${MODEL.playbook.PRIORITY_RANK[state.priority]}`],
    ['phase', `\`${candidate.phase}\`, rank ${MODEL.playbook.WORK_PHASE_RANK[candidate.phase]}`],
    ['readiness', 'log position of its newest `ticket-readied` or `ticket-reopened`'],
    ['id', 'by id']
  ];
  const rows = keys.map(([key, value]) => `<tr><td><code>${escapeHtml(key)}</code></td><td>${rich(value)}</td></tr>`).join('');
  return `<h3 class="section-title">${rich(page.slotsTitle)}: ${state.liveJobs} of ${state.concurrency} taken, ${free} free</h3>
    <div class="slots">${withinLimitBoxes.join('')}${freeBoxes.join('')}${limitMark}${overLimitBoxes.join('')}${moreBox(state.liveJobs - shownJobs)}<span class="slot-gap">${escapeHtml(page.slotQueue)}</span>${aheadBoxes.join('')}${moreBox(state.ahead - shownAhead)}${thisTicket}</div>
    <div class="keys"><h3 class="section-title">${rich(page.keysTitle)}</h3>
    <table><thead><tr><th>${escapeHtml(page.keyColumn)}</th><th>${escapeHtml(page.valueColumn)}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function checkRow(check, outcome, values, tone) {
  const word = MODEL.outcomes[outcome];
  const halts = outcome === 'stop' || outcome === 'wait';
  const text = halts ? check.title ?? check.walk : check.walk;
  const symbol = outcome === 'skip' || check.symbol === undefined ? '' : `<span class="symbol"><code>${escapeHtml(check.symbol)}</code></span>`;
  const rowClass = halts ? `halts tone-${tone}` : outcome === 'skip' ? 'skip' : '';
  const mark = halts
    ? `<span class="mark" aria-hidden="true">${word.glyph}</span>`
    : `<span class="mark glyph-${outcome}" role="img" aria-label="${escapeHtml(word.label)}">${word.glyph}</span>`;
  return `<li class="${rowClass}">${mark}<span class="what">${rich(fill(text, values))}${symbol}</span>${halts ? `<span class="halt-word">${escapeHtml(word.rowWord)}</span>` : ''}</li>`;
}

function claimLineOf(panel, values) {
  const page = MODEL.page;
  const refusal = panel.claimRefusal;
  const refusalValues = refusal === null ? values : { ...values, refusal, why: MODEL.airlockClaims.refusals[refusal] };
  const neutralLine = (text) => `<div class="claim tone-store">${rich(fill(text, refusalValues))}</div>`;
  const ifTried = refusal === null ? page.claimThenSucceeds : page.claimThenRefuses;
  if (panel.parksFirst) return neutralLine(panel.isCandidate ? page.claimParkedFirst : page.claimParkedOutsideCandidates);
  if (panel.stoppedGate !== null) return neutralLine(`${fill(page.claimNotTried, { gate: MODEL.checks[panel.stoppedGate].title })} ${ifTried}`);
  if (!panel.isCandidate) return neutralLine(`${page.claimNotACandidate} ${ifTried}`);
  if (refusal !== null) return `<div class="claim tone-refused">${rich(fill(page.claimRefuses, refusalValues))}</div>`;
  return `<div class="claim tone-good">${rich(page.claimSucceeds)}</div>`;
}

function mergePanel(state, result, values) {
  const page = MODEL.page;
  const { panel } = result;
  if (panel === null) return '';
  const panelValues = { ...values, target: `\`${plainValue(result.targets.airlockTarget)}\`` };
  const rowsOf = (entries) => entries.map((entry) => {
    const check = checkFor(entry, state);
    return checkRow(check, airlockOutcomeOf(entry.check, entry.cleared), panelValues, toneOfCheck(check));
  }).join('');
  const candidateLine = `<div class="claim ${panel.isCandidate && !panel.parksFirst && !state.overseerDown ? 'tone-good' : 'tone-store'}">${escapeHtml(panel.isCandidate ? page.isCandidate : page.isNotCandidate)}</div>`;
  const rules = `<p class="walk-stage">${rich(fill(page.mergeCandidateFilters, panelValues))}</p><ol class="checks">${rowsOf(panel.filters)}</ol>${candidateLine}
    <p class="walk-stage">${rich(page.mergeAllocation)}</p><ol class="checks">${rowsOf(panel.gates)}</ol>${claimLineOf(panel, panelValues)}`;
  const heading = `<h3 class="section-title">${escapeHtml(page.mergeTitle)}</h3>`;
  if (result.path === 'merge') return `${heading}${rules}`;
  const whyNot = state.job === 'none' ? page.mergeOutOfPath : page.mergeHasJob;
  return `${heading}<p class="none">${rich(whyNot)}</p>
    <details class="merge-more" id="merge-details"${mergeDetailsAreOpen ? ' open' : ''}><summary>${rich(page.mergeMore)}</summary>${rules}</details>`;
}

function walkDetails(state, result, values) {
  const page = MODEL.page;
  const sections = MODEL.stages.map((stage) => {
    const entries = result.walk.filter((entry) => MODEL.checks[entry.check].stage === stage.id);
    if (entries.length === 0) return '';
    const heading = `<p class="walk-stage">${escapeHtml(stage.label)}, <code>${escapeHtml(stage.symbol)}</code></p>`;
    if (stage.id === 'airlock') return `${heading}<p class="none">${escapeHtml(page.walkAirlockElsewhere)}</p>`;
    const rows = entries.map((entry) => {
      const check = checkFor(entry, state);
      const shown = { ...check, walk: entry.resumeIsNotHeld === true ? check.clearDetail : check.walk };
      return checkRow(shown, entry.outcome, { ...values, phase: entry.phase ?? '' }, toneOfCheck(check));
    }).join('');
    return `${heading}<ol class="checks">${rows}</ol>`;
  }).join('');
  return `<details class="walk" id="walk-details"${state.walk ? ' open' : ''}><summary><h3 class="section-title">${escapeHtml(page.walkTitle)}</h3></summary>${sections}</details>`;
}

function notesOf(state) {
  const notes = [];
  const decision = decisionOf(state);
  if (decision.note !== undefined) notes.push(`<p class="gap">${rich(`\`${decision.kind}\`: ${decision.note}`)}${decision.gaps === undefined ? '' : ` ${escapeHtml(MODEL.page.asBuilt)} ${decision.gaps.map(gapLinkOf).join(', ')}`}</p>`);
  if (state.group !== '') notes.push(`<p class="gap">${escapeHtml(MODEL.page.asBuilt)} ${gapLinkOf('gap-group-tickets-missing-from-ready-ids')}</p>`);
  return notes.join('');
}

function renderResult() {
  const result = diagnose(state);
  const values = valuesOf(state, result);
  const page = MODEL.page;
  element('verdict').innerHTML = verdictCard(state, result, values);
  const blockers = result.blockers.length === 0
    ? `<p class="none">${escapeHtml(page.noBlockers)}</p>`
    : result.blockers.map((entry, position) => blockerCard(entry, position, state, values)).join('');
  element('diagnosis').innerHTML = `${stagesStrip(result.walk, state)}
    <h3 class="section-title">${escapeHtml(page.blockersTitle)}</h3>${blockers}${notesOf(state)}
    ${launchSlotsFigure(state, result)}
    ${mergePanel(state, result, values)}
    ${walkDetails(state, result, values)}
    <p class="sources">${rich(page.sourcesLine)} ${escapeHtml(page.sourcesMore)} <a href="${page.thePass.href}">${escapeHtml(page.thePass.label)}</a>, <a href="${page.airlocks.href}">${escapeHtml(page.airlocks.label)}</a>.</p>`;
}

function optionsFor(name) {
  if (name === 'overseerStates') return MODEL.overseerStates.values.map((value) => ({ value, label: value }));
  if (name === 'ticketStatuses') return MODEL.ticketStatuses.values.map((value) => ({ value, label: `${value} (${MODEL.ticketStatuses.bridgeWords[value]})` }));
  if (name === 'priorities') return MODEL.playbook.priorities.map((value) => ({ value, label: value }));
  if (name === 'incidents') return MODEL.incidents.map((incident) => ({ value: incident.id, label: incident.label ?? incident.id }));
  return MODEL[name].map((entry) => ({ value: entry.id, label: entry.label.replace(/`/g, '') }));
}

function boundOf(bound) { return typeof bound === 'number' ? bound : MODEL.concurrency[bound]; }

function fieldMarkup(field) {
  const id = `control-${field.key}`;
  const hint = field.hint === undefined ? '' : `<span class="hint" id="${id}-hint">${rich(field.hint)}</span>`;
  const described = field.hint === undefined ? '' : ` aria-describedby="${id}-hint"`;
  if (field.type === 'check') return `<div class="field check" data-field="${field.key}"><label for="${id}"><input type="checkbox" id="${id}" data-key="${field.key}"><span>${rich(field.label)}</span></label></div>`;
  if (field.type === 'select') {
    const options = optionsFor(field.options).map((option) => `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`).join('');
    return `<div class="field" data-field="${field.key}"><label for="${id}">${rich(field.label)}</label><select id="${id}" data-key="${field.key}"${described}>${options}</select>${hint}</div>`;
  }
  if (field.type === 'number') return `<div class="field" data-field="${field.key}"><label for="${id}">${rich(field.label)}</label><input type="number" inputmode="numeric" id="${id}" data-key="${field.key}" min="${boundOf(field.minimum)}" max="${boundOf(field.maximum)}" step="1"></div>`;
  return `<div class="field" data-field="${field.key}"><label for="${id}">${rich(field.label)}</label><input type="text" id="${id}" data-key="${field.key}" spellcheck="false" maxlength="60"></div>`;
}

function allGroups() { return [...MODEL.controlGroups, MODEL.historyGroup]; }

function allFields() { return allGroups().flatMap((group) => group.fields); }

function conditionHolds(condition, values) {
  if (condition === undefined) return true;
  if (condition.all !== undefined) return condition.all.every((part) => conditionHolds(part, values));
  const value = values[condition.key];
  if (condition.equals !== undefined) return value === condition.equals;
  if (condition.notEquals !== undefined) return value !== condition.notEquals;
  return !condition.notIn.includes(value);
}

function renderControls() {
  const groups = MODEL.controlGroups.map((group) => {
    const fields = group.fields.map(fieldMarkup).join('');
    return `<fieldset data-group="${group.id}"><legend>${rich(group.title)}</legend><p class="fieldset-hint">${rich(group.hint)}</p>${group.columns === true ? `<div class="numbers">${fields}</div>` : fields}</fieldset>`;
  }).join('');
  const history = MODEL.historyGroup;
  element('controls').innerHTML = `${groups}<details class="history" id="history-details"><summary>${escapeHtml(history.title)}</summary><p class="fieldset-hint">${rich(history.hint)}</p>${history.fields.map(fieldMarkup).join('')}</details>`;
}

function syncHistoryDisclosure() {
  if (MODEL.historyGroup.fields.some((field) => state[field.key] !== MODEL.baseline[field.key])) element('history-details').open = true;
}

/* A field keeps what is being typed into it until focus leaves, when it takes the value the verdict uses. */
function syncControls(includingFocusedField = false) {
  for (const group of MODEL.controlGroups) document.querySelector(`[data-group="${group.id}"]`).hidden = !conditionHolds(group.showWhen, state);
  for (const field of allFields()) {
    const control = element(`control-${field.key}`);
    if (field.type === 'check') control.checked = state[field.key];
    else if (includingFocusedField || document.activeElement !== control || field.type === 'select') control.value = String(state[field.key]);
    control.closest('[data-field]').hidden = !conditionHolds(field.showWhen, state);
  }
  for (const option of element('control-job').options) option.disabled = !jobFitsStatus(option.value, state.status);
}

function presetOverrides(preset) { return { ...MODEL.baseline, ...preset.state }; }

function statesMatch(first, second) { return allFields().every((field) => first[field.key] === second[field.key]); }

function renderPresets() {
  element('presets').innerHTML = MODEL.presets.map((preset) => `<button type="button" data-preset="${preset.id}" aria-pressed="${statesMatch(state, presetOverrides(preset))}">${escapeHtml(preset.label)}</button>`).join('');
}

function refreshPresetMarks() {
  for (const preset of MODEL.presets) {
    element('presets').querySelector(`[data-preset="${preset.id}"]`).setAttribute('aria-pressed', String(statesMatch(state, presetOverrides(preset))));
  }
}

/* The hash holds only what differs from the clear board, so a link stays short. */
function writeHash() {
  const parts = Object.keys(MODEL.baseline).filter((key) => state[key] !== MODEL.baseline[key]).map((key) => {
    const value = state[key];
    return `${key}=${typeof value === 'boolean' ? Number(value) : encodeURIComponent(value)}`;
  });
  const hash = parts.length === 0 ? '' : `#${parts.join('&')}`;
  if (window.location.hash !== hash) history.replaceState(null, '', hash === '' ? window.location.pathname + window.location.search : hash);
}

function allowedValuesOf(field) {
  if (field.type !== 'select') return null;
  return optionsFor(field.options).map((option) => option.value);
}

function coerced(field, text, fallback) {
  if (field.type === 'check') return text === '1';
  if (field.type === 'number') {
    const number = Number(text);
    if (!Number.isInteger(number)) return fallback;
    return Math.min(boundOf(field.maximum), Math.max(boundOf(field.minimum), number));
  }
  if (field.type === 'select') return allowedValuesOf(field).includes(text) ? text : fallback;
  return plainValue(text).slice(0, 60);
}

function stateFromHash() {
  const next = { ...MODEL.baseline };
  const hash = window.location.hash.replace(/^#/, '');
  if (hash === '') return next;
  for (const part of hash.split('&')) {
    const separator = part.indexOf('=');
    const key = part.slice(0, separator);
    const encoded = part.slice(separator + 1);
    if (key === 'walk') next.walk = encoded === '1';
    const field = allFields().find((candidate) => candidate.key === key);
    if (field === undefined) continue;
    let text = encoded;
    try { text = decodeURIComponent(encoded); } catch { text = ''; }
    next[key] = coerced(field, text, MODEL.baseline[key]);
  }
  return normalised(next);
}

function jobFitsStatus(jobId, status) {
  const { onlyFor } = MODEL.jobs.find((job) => job.id === jobId);
  return onlyFor === undefined || onlyFor === status;
}

/* Combinations the board cannot hold are corrected, never shown, and a hidden control keeps nothing in the link. */
function normalised(next) {
  for (const group of allGroups()) {
    for (const field of group.fields) {
      if (!conditionHolds(group.showWhen, next) || !conditionHolds(field.showWhen, next)) next[field.key] = MODEL.baseline[field.key];
    }
  }
  if (!jobFitsStatus(next.job, next.status)) next.job = MODEL.baseline.job;
  if (next.reviewResumesSpent) next.earlierBuild = true;
  return next;
}

function changed() {
  normalised(state);
  syncControls();
  refreshPresetMarks();
  renderResult();
  writeHash();
}

function readTheme() {
  try {
    const stored = localStorage.getItem(MODEL.page.themeStorageKey);
    return MODEL.page.themes.includes(stored) ? stored : 'auto';
  } catch { return 'auto'; }
}

function applyTheme(theme) {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

function renderTheme() {
  element('theme').innerHTML = MODEL.page.themes.map((theme) => `<button type="button" data-theme-choice="${theme}" aria-pressed="${theme === chosenTheme}">${theme}</button>`).join('');
}

function renderHeader() {
  const { page } = MODEL;
  document.title = page.title;
  element('skip-link').textContent = page.skipLink;
  element('crumbs').innerHTML = `<a href="${page.documentation.href}">${escapeHtml(page.documentation.label)}</a><span>/</span><a href="${page.home.href}">${escapeHtml(page.home.label)}</a>`;
  element('title').textContent = page.title;
  element('question').textContent = page.question;
  element('lede').innerHTML = rich(page.lede);
  element('commit').innerHTML = rich(page.commitLine);
  element('presets-title').textContent = page.presetsTitle;
  element('presets').setAttribute('aria-label', page.presetsTitle);
  element('copy-link').textContent = page.copyLink;
  element('reset').textContent = page.reset;
}

const SHOWN_JOB_BOXES = 12;
const SHOWN_QUEUE_BOXES = 8;

let state = stateFromHash();
let mergeDetailsAreOpen = false;
let chosenTheme = readTheme();

applyTheme(chosenTheme);
renderHeader();
renderTheme();
renderControls();
renderPresets();
syncControls();
syncHistoryDisclosure();
renderResult();
writeHash();

element('controls').addEventListener('input', (event) => {
  const { key } = event.target.dataset;
  if (key === undefined) return;
  const field = allFields().find((candidate) => candidate.key === key);
  if (field.type === 'check') state[key] = event.target.checked;
  else if (field.type === 'number') state[key] = coerced(field, event.target.value, state[key]);
  else if (field.type === 'select') state[key] = event.target.value;
  else state[key] = plainValue(event.target.value).slice(0, 60);
  changed();
});

element('controls').addEventListener('submit', (event) => event.preventDefault());

element('controls').addEventListener('focusout', () => syncControls(true));

element('skip-link').addEventListener('click', (event) => {
  event.preventDefault();
  element('result').scrollIntoView();
  element('result').focus();
});

document.addEventListener('toggle', (event) => {
  if (event.target.id === 'merge-details') mergeDetailsAreOpen = event.target.open;
  if (event.target.id !== 'walk-details') return;
  state.walk = event.target.open;
  writeHash();
}, true);

document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (button === null) return;
  if (button.dataset.preset !== undefined) {
    state = { ...presetOverrides(MODEL.presets.find((preset) => preset.id === button.dataset.preset)), walk: state.walk };
    changed();
    syncHistoryDisclosure();
    element('tool-status').textContent = '';
    return;
  }
  if (button.dataset.themeChoice !== undefined) {
    chosenTheme = button.dataset.themeChoice;
    applyTheme(chosenTheme);
    try { localStorage.setItem(MODEL.page.themeStorageKey, chosenTheme); } catch { /* the page works without storage */ }
    renderTheme();
    element('theme').querySelector(`[data-theme-choice="${chosenTheme}"]`)?.focus();
    return;
  }
  if (button.id === 'mini-verdict') {
    element('result').scrollIntoView();
    element('result').focus();
    return;
  }
  if (button.id === 'reset') {
    state = { ...MODEL.baseline };
    changed();
    element('tool-status').textContent = MODEL.page.resetDone;
    return;
  }
  if (button.id === 'copy-link') {
    const copied = navigator.clipboard === undefined ? Promise.reject(new Error('no clipboard')) : navigator.clipboard.writeText(window.location.href);
    copied.then(() => { element('tool-status').textContent = MODEL.page.linkCopied; }, () => { element('tool-status').textContent = MODEL.page.linkNotCopied; });
  }
});

window.addEventListener('hashchange', () => {
  state = stateFromHash();
  syncControls();
  syncHistoryDisclosure();
  refreshPresetMarks();
  renderResult();
  writeHash();
});
</script>
</body>
</html>
