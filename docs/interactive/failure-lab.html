}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #262624; --raised: #30302E; --hairline: #3D3D3A; --line: #5A5952;
  --text: #E8E6DC; --muted: #A3A196; --link: #9CC8F2; --focus: #BBD7F2;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--text);
  font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--code-bg); color: var(--code-text); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--link); }
h1, h2, h3 { font-weight: 500; line-height: 1.25; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 19px; overflow-wrap: anywhere; }
h3 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; letter-spacing: .02em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; margin-bottom: 14px; }
.crumbs { color: var(--muted); }
.crumbs span { margin: 0 6px; }
.segmented { display: inline-flex; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; background: var(--raised); max-width: 100%; }
.segmented button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.segmented button + button { border-left: 1px solid var(--hairline); }
.segmented button:focus-visible { outline-offset: -2px; }
.segmented button[aria-pressed="true"] { background: var(--code-fill); color: var(--code-title); font-weight: 500; }
.question { font-size: 17px; margin-top: 6px; }
.lede, .terms { color: var(--muted); margin-top: 4px; }
.terms { font-size: 13px; }
.terms summary { cursor: pointer; width: fit-content; }
.terms p { margin-top: 4px; }
.tabs { display: flex; flex-wrap: wrap; gap: 0 4px; margin-top: 18px; border-bottom: 1px solid var(--hairline); }
.tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 14.5px; }
.tabs button[aria-selected="true"] { color: var(--code-title); border-bottom-color: var(--code-sub); font-weight: 500; }
.layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; margin-top: 16px; align-items: start; }
.layout.wide-left { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.panel { background: var(--raised); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; min-width: 0; }
.result-panel { container-type: inline-size; }
.swim-panel { container-type: inline-size; }
.intro { color: var(--muted); font-size: 14px; margin-top: 4px; }
.field { display: grid; gap: 4px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.field select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); color: var(--text); font-size: 14px; }
.field select:disabled { opacity: .55; }
.blurb { margin-top: 8px; font-size: 14px; }
.tree { margin-top: 12px; display: grid; gap: 8px; }
.branches { margin-left: 14px; padding-left: 12px; border-left: 1.6px solid var(--line); display: grid; gap: 8px; }
.branch { display: grid; gap: 6px; }
.branch .node + .node { margin-left: 22px; width: calc(100% - 22px); }
.node { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1.5px solid; cursor: pointer; min-height: 44px; }
.node .name { display: block; font-weight: 500; font-size: 14px; }
.node .detail { display: block; font-size: 12px; opacity: .9; }
.node .status { font-size: 12px; white-space: nowrap; flex: none; }
.who-code { background: var(--code-fill); border-color: var(--code-border); color: var(--code-title); }
.who-agent { background: var(--agent-fill); border-color: var(--agent-border); color: var(--agent-title); }
.who-store { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); }
.node.dead { background: var(--refused-fill); border-color: var(--refused-sub); color: var(--refused-title); }
.node.dead .name { text-decoration: line-through; }
.node.doomed { background: var(--refused-fill); border-color: var(--refused-sub); border-style: dashed; color: var(--refused-title); }
.node.absent { background: none; border-style: dashed; border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.caption { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.button { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; min-height: 36px; }
.button.primary { background: var(--code-fill); border-color: var(--code-border); color: var(--code-title); font-weight: 500; }
.button[aria-disabled="true"] { background: none; border-style: dashed; color: var(--muted); font-weight: 400; cursor: not-allowed; }
.headline { font-size: 17px; font-weight: 500; line-height: 1.3; padding: 9px 11px; border-radius: 8px; border: 1px solid; }
.tone-good { background: var(--good-fill); border-color: var(--good-border); color: var(--good-title); }
.tone-code { background: var(--code-fill); border-color: var(--code-border); color: var(--code-title); }
.tone-amber { background: var(--person-fill); border-color: var(--person-border); color: var(--person-title); }
.tone-bad { background: var(--refused-fill); border-color: var(--refused-border); color: var(--refused-title); }
.tone-none { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); }
.headline code, .tone-good code, .tone-code code, .tone-amber code, .tone-bad code { background: transparent; color: inherit; padding: 0; }
dl.facts { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 7px 12px; margin: 12px 0 0; font-size: 14px; }
#baton-result dl.facts { grid-template-columns: 92px minmax(0, 1fr); }
@container (max-width: 400px) {
  dl.facts, #baton-result dl.facts { grid-template-columns: minmax(0, 1fr); gap: 1px 0; }
  dl.facts dd { margin-bottom: 7px; }
}
dl.facts dt { color: var(--muted); font-size: 13px; }
dl.facts dd { margin: 0; min-width: 0; }
dl.facts dd ul { display: grid; gap: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-block; font-size: 12.5px; line-height: 1.5; padding: 0 8px; border-radius: 999px; border: 1px solid; }
.rungs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.rung { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--hairline); color: var(--muted); }
.rung.past { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); }
.rung.here { background: var(--code-fill); border-color: var(--code-sub); color: var(--code-title); font-weight: 500; }
.rung.terminal.here { background: var(--refused-fill); border-color: var(--refused-sub); color: var(--refused-title); }
.callout { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--store-border); background: var(--store-fill); color: var(--store-title); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.callout a { color: inherit; }
.callout code { background: transparent; color: inherit; padding: 0; }
.sources { margin-top: 12px; font-size: 13px; color: var(--muted); }
.strip { --stops: 10; margin-top: 12px; container-type: inline-size; }
.strip-row { display: grid; grid-template-columns: repeat(var(--stops), minmax(0, 1fr)); gap: 3px; }
.phase { font-size: 12px; color: var(--muted); padding-bottom: 3px; border-bottom: 1.6px solid var(--line); margin-bottom: 4px; white-space: nowrap; text-align: center; }
.phase.single { text-align: left; }
.phase-legend { display: none; font-size: 12px; color: var(--muted); margin-top: 6px; }
.stop { border: 1.5px solid var(--code-border); background: var(--code-fill); color: var(--code-title); border-radius: 6px; min-height: 36px; padding: 0; cursor: pointer; font-size: 13px; min-width: 0; }
.stop[aria-pressed="true"] { background: var(--code-title); border-color: var(--code-title); color: var(--raised); font-weight: 500; }
.band { font-size: 11.5px; line-height: 20px; padding: 0 4px; border-radius: 4px; margin-top: 4px; white-space: nowrap; overflow: hidden; min-width: 0; }
.band .short { display: none; }
.band.empty { background: none; }
.band.lock { background: var(--person-fill); border: 1px solid var(--person-border); color: var(--person-title); }
.band.journal { background: var(--store-fill); border: 1px solid var(--store-border); color: var(--store-title); }
.scrub { width: 100%; margin: 12px 0 0; accent-color: var(--code-sub); }
.stop-title { margin-top: 8px; font-size: 14.5px; font-weight: 500; }
.modes { margin-top: 12px; }
.mode-glosses { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: grid; gap: 1px; }
.mode-glosses strong { font-weight: 500; }
table.files { border-collapse: collapse; width: 100%; font-size: 13.5px; margin-top: 6px; }
table.files th { text-align: left; font-weight: 400; padding: 4px 8px 4px 0; border-top: 1px solid var(--hairline); }
table.files td { padding: 4px 0; border-top: 1px solid var(--hairline); text-align: right; }
.file-legend { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.state-old, .state-absent { background: var(--store-fill); border-color: var(--store-border); color: var(--store-title); }
.state-absent { border-style: dashed; }
.state-whole { background: var(--person-fill); border-color: var(--person-border); color: var(--person-title); }
.state-fresh { background: var(--good-fill); border-color: var(--good-border); color: var(--good-title); }
.lane-head, .lane-row { display: grid; grid-template-columns: 108px minmax(0, 1fr) 96px minmax(0, 1fr); gap: 8px; }
.lane-head { font-size: 12.5px; color: var(--muted); padding: 0 8px 6px 11px; }
.swim { border-left: 4px solid var(--good-sub); margin-top: 10px; }
.swim-rows { display: grid; gap: 3px; margin-top: 2px; }
.rail-caption { font-size: 12.5px; color: var(--good-sub); padding: 0 8px 6px 11px; }
.swim-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.swim-key li { display: flex; align-items: center; gap: 5px; }
.key-mark { display: inline-block; width: 16px; height: 12px; border-radius: 2px; flex: none; }
.key-mark.gap { background: var(--person-fill); border: 1px solid var(--person-border); }
.key-mark.tail { box-shadow: inset 3px 0 0 var(--code-sub); background: var(--surface); }
.key-mark.unreached { border: 1px dashed var(--line); }
.lane-group { border-radius: 0 8px 8px 0; padding: 7px 8px; font-size: 13.5px; }
.lane-group.drive-old, .lane-group.drive-successor { background: var(--surface); }
.lane-group.drive-gap { background: var(--person-fill); color: var(--person-title); }
.lane-group.drive-gap code { background: transparent; color: inherit; padding: 0; }
.lane-group.unreached { background: none; color: var(--muted); outline: 1px dashed var(--line); outline-offset: -1px; }
.lane-group.inject-here { display: grid; gap: 2px; }
.lane-group.tail { box-shadow: inset 3px 0 0 var(--code-sub); }
.driver { font-size: 12px; color: var(--muted); }
.drive-gap .driver { color: inherit; font-weight: 500; }
.lane-label { display: none; font-size: 12px; color: var(--muted); }
.drive-gap .lane-label { color: inherit; }
.injected { border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 13.5px; background: var(--refused-fill); color: var(--refused-title); }
.injected code { background: transparent; color: inherit; padding: 0; }
.failures { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.failure { border: 1px dashed var(--refused-sub); background: none; color: var(--refused-sub); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; cursor: pointer; min-height: 30px; }
.failure code { background: transparent; color: inherit; padding: 0; }
.failure[aria-pressed="true"] { background: var(--refused-fill); color: var(--refused-title); border-style: solid; font-weight: 500; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.outcome-strip { display: none; position: sticky; bottom: 8px; z-index: 2; width: 100%; margin-top: 12px; padding: 7px 10px; border: 1px solid; border-radius: 8px; text-align: left; font-size: 13.5px; line-height: 1.3; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
.outcome-strip.result-in-view { visibility: hidden; }
.outcome-jump { display: block; margin-top: 2px; font-size: 12px; text-decoration: underline; }
noscript p { margin: 16px; }
footer { margin-top: 18px; font-size: 13px; color: var(--muted); }
@container (max-width: 560px) {
  .lane-head { display: none; }
  .lane-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .lane-label { display: inline; margin-right: 5px; }
  .lane-cell:empty { display: none; }
}
@container (max-width: 469px) {
  .phase-legend { display: block; }
  .phase.single .phase-name { visibility: hidden; }
}
@container (max-width: 360px) {
  .band .long { display: none; }
  .band .short { display: inline; }
}
@media (min-width: 800px) {
  .result-panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
}
@media (max-width: 1100px) {
  .layout.wide-left { grid-template-columns: minmax(0, 1fr); }
  .layout.wide-left .result-panel { position: static; max-height: none; overflow: visible; }
  main[data-tab="baton"] .outcome-strip { display: block; }
}
@media (max-width: 799px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .outcome-strip { display: block; }
}
@media (prefers-reduced-motion: no-preference) { .node, .stop, .lane-group { transition: background-color .12s, border-color .12s; } }
</style>

const MODEL = {
 "page": {
  "title": "Failure lab",
  "commit": "70ce56de",

  "crash": "Yes. `crashResumes` moves on the resume, bounded by `JOB_RESUMES_BEFORE_FRESH`.",
  "notCrash": "No. Only `watcher-lost` and `agent-crashed` count."
 },
 "lockFacts": {
  "source": "src/services/tracker/TrackerLock.ts, cli/tracking/status/StatusCommand.ts, src/services/overseer/BoardState.ts",
  "held": "Held. A dead holder frees it at once, a live one only past `LOCK_STALE_MILLISECONDS`.",
  "free": "Not held.",
  "readers": "Readers such as `agent-progress-v2 status` and the Bridge take no lock."
 },
 "batonLanes": {
  "source": "src/services/overseer/BatonPass.ts, cli/overseer/OverseerForeground.ts",
  "intro": "A Baton pass restarts the Overseer on the code on disk without touching a Watcher. Old and successor Overseers talk through one file, `<data>/overseer/baton-pass-<generation>.json`. The rows run in order from generation {n}, and each red chip injects one failure at that step.",
  "columns": {
   "driver": "Who drives",
   "old": "Old Overseer",
   "file": "Hand-over file",
   "successor": "Successor"
  },
  "drivers": {
   "old": "Old Overseer",
   "gap": "Nobody drives",
   "successor": "Successor"
  },
  "unreached": "Not reached",
  "injectHere": "Inject here",
  "key": [
   {
    "className": "gap",
    "label": "Shaded: nobody drives"
   },
   {
    "className": "tail",
    "label": "Blue edge: after the failure"
   },
   {
    "className": "unreached",
    "label": "Dashed: not reached"
   }
  ]
 }
};

const ROOT = document.documentElement;
const STORAGE_KEY = 'failure-lab-theme';
const THEMES = ['light', 'dark', 'auto'];
const TABS = [
  { id: 'kill', label: 'Kill a process', alias: 'kill-the-overseer' },
  { id: 'hold', label: 'Cut a hold short', alias: 'cut-a-hold-short' },
  { id: 'baton', label: 'Fail a Baton pass', alias: 'fail-a-baton-pass' },
];
const DEFAULTS = {
  stage: 'running', killed: ['overseer'], death: 'signal', history: '', stop: 'mid-apply', mode: 'killed', failure: 'none',
};
const FIRST_GENERATION = 4;

const state = { tab: 'kill', ...DEFAULTS, killed: [...DEFAULTS.killed] };

const element = (id) => document.getElementById(id);

/** The fragment GitHub gives a runbook heading: lower case, punctuation dropped, spaces as hyphens. */
function headingFragmentOf(heading) {
  return heading.toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/ /g, '-');
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/** Fills `{name}` tokens from a view's facts, then turns backticks into code, a bare bound name into `NAME` (value) and `[[key]]` into a document link. */
function rich(text, tokens = {}) {
  const filled = String(text).replace(/\{(\w+)\}/g, (whole, name) => (Object.hasOwn(tokens, name) ? tokens[name] : whole));
  const coded = escapeHtml(filled).replace(/`([^`]+)`/g, (whole, code) => {
    const bound = Object.hasOwn(MODEL.bounds.values, code) ? ` (${MODEL.bounds.values[code]})` : '';
    return `<code>${code}</code>${bound}`;
  });
  return coded.replace(/\[\[(\w+)\]\]/g, (whole, key) => documentLink(key));
}

function glossaryLink(term) {
  const label = term.label ?? term;
  const anchor = term.anchor ?? label.toLowerCase().replace(/\s+/g, '-');
  return `<a href="../glossary.md#${anchor}">${escapeHtml(label)}</a>`;
}

function documentLink(key) {
  const entry = MODEL.documents.entries[key];
  return `<a href="${entry.href}">${escapeHtml(entry.label)}</a>`;
}

function functionList(keys) {
  return keys.map((key) => {
    const entry = MODEL.functions.entries[key];
    return `<code>${escapeHtml(entry.symbol)}</code> in <code>${escapeHtml(entry.path)}</code>`;
  }).map((item) => `<li>${item}</li>`).join('');
}

function specLine(key, step = '') {
  const entry = MODEL.specs.entries[key];
  return `<code>${escapeHtml(entry.path)}</code>: ${escapeHtml(entry.title.replace('%s', step))}`;
}

function specBlock(record, specKey = record.spec) {
  const lines = [];
  if (specKey) lines.push(`<li>${specLine(specKey, record.step ?? '')}</li>`);
  else if (record.specNote) lines.push(`<li>${rich(record.specNote)}</li>`);
  if (record.relatedSpec) lines.push(`<li>Related: ${specLine(record.relatedSpec)}</li>`);
  return `<ul>${lines.join('')}</ul>`;
}

function gapCallouts(keys) {
  if (keys.length === 0) return '';
  const links = keys.map((key) => `<a href="../reference/known-gaps.md#${key}">${rich(MODEL.gaps.entries[key])}</a>`);
  return `<p class="callout"><strong>As built.</strong> ${links.join('; ')}.</p>`;
}

function fact(term, value) {
  return `<dt>${term}</dt><dd>${value}</dd>`;
}

function focusKeyOfActiveElement() {
  return document.activeElement?.dataset?.focusKey ?? null;
}

function restoreFocus(key) {
  if (key !== null) document.querySelector(`[data-focus-key="${key}"]`)?.focus();
}

/* `aria-disabled` and not `disabled`: a disabled button drops the keyboard focus back to the top of the document. */
function setAvailable(button, available) {
  button.setAttribute('aria-disabled', String(!available));
}

function isAvailable(button) {
  return button.getAttribute('aria-disabled') !== 'true';
}

/** The one line a phone keeps in view, which is also what a screen reader hears, instead of the whole panel. */
function announceOutcome(tabId, headlineHtml, tone) {
  element('outcome-strip').className = `outcome-strip tone-${tone}`;
  element('outcome-text').innerHTML = headlineHtml;
  element(`announce-${tabId}`).textContent = element('outcome-text').textContent;
  element(`${tabId}-result`).scrollTop = 0;
}

let resultWatcher = null;

function watchResultPanel() {
  if (typeof IntersectionObserver === 'undefined') return;
  resultWatcher?.disconnect();
  resultWatcher = new IntersectionObserver(([entry]) => {
    element('outcome-strip').classList.toggle('result-in-view', entry.isIntersecting);
  }, { rootMargin: '0px 0px -96px 0px' });
  resultWatcher.observe(element(`${state.tab}-result`));
}

/* Kill a process */

function currentStage() {
  return MODEL.stages.entries.find((stage) => stage.id === state.stage);
}

function stageNodeIds(stage) {
  return stage.present;
}

function deadNodes(stage) {
  return state.killed.includes('machine') ? [...stageNodeIds(stage)] : state.killed.filter((id) => stage.present.includes(id));
}

function ruleMatches(rule, deadSet, machineDied) {
  if (rule.machine) return machineDied;
  if (machineDied) return false;
  if (!rule.dead.every((id) => deadSet.includes(id))) return false;
  return rule.death === undefined || rule.death === state.death;
}

function decidedRule(stage) {
  const deadSet = deadNodes(stage);
  const machineDied = state.killed.includes('machine');
  if (deadSet.length === 0 && !machineDied) return null;
  return stage.rules.find((rule) => ruleMatches(rule, deadSet, machineDied)) ?? null;
}

/** Walks every death of this run through the bound, in the order `crashBoundStepsOf`, `jobLostStepsOf` and `outageIsDue` decide it. */
function climb(stage, cause, repeatKind) {
  const bounds = MODEL.bounds.values;
  const counted = cause !== null && MODEL.interruptionCauses.crash.includes(cause);
  const walk = {
    attempt: 1, instance: 1, crashResumes: 0, replacedInARow: 0, generation: FIRST_GENERATION, kills: 0, step: 'resume', jobNumber: Number(stage.job.slice(1)), rung: 0,
  };
  const deaths = ['s', ...state.history];
  const instanceMoves = repeatKind === 'ladder' || repeatKind === 'reboot';
  for (let i = 0; i < deaths.length; i += 1) {
    if (deaths[i] === 'o' && repeatKind === 'ladder' && counted) {
      walk.step = 'outage';
      break;
    }
    if (i > 0) {
      if (repeatKind === 'overseer' || repeatKind === 'reboot') walk.generation += 1;
      if (walk.step === 'replace') {
        walk.attempt += 1;
        walk.jobNumber += 1;
        walk.instance = 1;
        walk.crashResumes = 0;
      } else if (instanceMoves) {
        walk.instance += 1;
        if (counted) walk.crashResumes += 1;
      }
    }
    walk.kills += 1;
    walk.step = 'resume';
    if (repeatKind !== 'ladder' || !counted) continue;
    if (walk.crashResumes >= bounds.JOB_RESUMES_BEFORE_FRESH) {
      walk.replacedInARow += 1;
      walk.step = walk.replacedInARow >= bounds.REPLACED_JOBS_BEFORE_JOB_LOST ? 'jobLost' : 'replace';
    }
  }
  return walk;
}

function rungLabels() {
  const bounds = MODEL.bounds.values;
  const rungs = [];
  for (let attempt = 1; attempt <= bounds.REPLACED_JOBS_BEFORE_JOB_LOST; attempt += 1) {
    rungs.push({ label: `Attempt ${attempt}, first death`, attempt, crashResumes: 0, step: 'resume' });
    for (let resume = 1; resume <= bounds.JOB_RESUMES_BEFORE_FRESH; resume += 1) {
      if (resume < bounds.JOB_RESUMES_BEFORE_FRESH) rungs.push({ label: `Death on resume ${resume}`, attempt, crashResumes: resume, step: 'resume' });
    }
    const lastAttempt = attempt === bounds.REPLACED_JOBS_BEFORE_JOB_LOST;
    rungs.push({ label: `Death on resume ${bounds.JOB_RESUMES_BEFORE_FRESH}: replaced`, attempt, crashResumes: bounds.JOB_RESUMES_BEFORE_FRESH, step: lastAttempt ? 'jobLost' : 'replace', terminal: lastAttempt });
  }
  return rungs;
}

function ladderHtml(walk) {
  const rungs = rungLabels();
  const hereIndex = rungs.findIndex((rung) => rung.attempt === walk.attempt && rung.crashResumes === walk.crashResumes);
  const chips = rungs.map((rung, index) => {
    const position = index < hereIndex ? 'past' : index === hereIndex ? 'here' : '';
    const label = rung.terminal ? `${rung.label}, job-lost` : rung.label;
    return `<li class="rung ${position} ${rung.terminal ? 'terminal' : ''}"${position === 'here' ? ' aria-current="step"' : ''}>${escapeHtml(label)}</li>`;
  }).join('');
  return `<ol class="rungs">${chips}</ol>`;
}

function viewTokens(stage, walk) {
  return {
    job:              `J${walk.jobNumber}`,
    instance:         walk.instance,
    nextInstance:     walk.instance + 1,
    crashResumes:     walk.crashResumes,
    nextCrashResumes: walk.crashResumes + 1,
    generation:       walk.generation,
    nextGeneration:   walk.generation + 1,
    nextAttempt:      walk.attempt + 1,
    processWatcher:   stage.processWatcher,
    processChild:     stage.processChild,
  };
}

function nodeState(node, stage, deadSet, alsoStops, overseerDead) {
  const words = MODEL.processNodes.status;
  if (node.id !== 'machine' && !stage.present.includes(node.id)) return { className: 'absent', status: words.notRunning, detail: stage.absentDetail[node.id] };
  if (node.id === 'machine') return state.killed.includes('machine') ? { className: 'dead', status: words.rebooted } : { className: `who-${node.who}`, status: words.up };
  if (deadSet.includes(node.id)) return { className: 'dead', status: state.killed.includes('machine') ? words.gone : words.killed };
  if (alsoStops.includes(node.id)) return { className: 'doomed', status: overseerDead ? words.orphaned : words.doomed };
  return { className: `who-${node.who}`, status: words.running };
}

function renderTree(stage, deadSet, alsoStops, tokens) {
  const overseerDead = deadSet.includes('overseer');
  const button = (node) => {
    const view = nodeState(node, stage, deadSet, alsoStops, overseerDead);
    const disabled = view.className === 'absent';
    const pressed = node.id === 'machine' ? state.killed.includes('machine') : deadSet.includes(node.id);
    const detail = view.detail ?? node.detail;
    return `<button type="button" class="node ${view.className}" data-node="${node.id}" data-focus-key="node-${node.id}" aria-pressed="${pressed}"${disabled ? ' disabled' : ''}>`
      + `<span><span class="name">${rich(node.label, tokens)}</span><span class="detail">${rich(detail, tokens)}</span></span>`
      + `<span class="status">${escapeHtml(view.status)}</span></button>`;
  };
  const { machine, branches } = MODEL.processNodes;
  element('tree').innerHTML = `${button(machine)}<div class="branches">${branches.map((branch) => `<div class="branch">${branch.map(button).join('')}</div>`).join('')}</div>`;
}

function countsText(decided, cause, override) {
  const note = override?.countsNote ?? decided.countsNote;
  if (note) return rich(note);
  if (cause === null) return rich(MODEL.counts.nothingInterrupted);
  return rich(MODEL.interruptionCauses.crash.includes(cause) ? MODEL.counts.crash : MODEL.counts.notCrash);
}

function repeatNoteOf(decided, repeatKind, terminal, resumeAwaitsOverseer) {
  if (decided === null) return MODEL.repeatNotes.idle;
  if (terminal) return MODEL.ladder.terminalNote;
  if (resumeAwaitsOverseer) return MODEL.repeatNotes.ladderAwaitsOverseer;
  return decided.repeatNote ?? MODEL.repeatNotes[repeatKind];
}

function keepsRunning(stage, deadSet, alsoStops, tokens) {
  const nodes = MODEL.processNodes.branches.flat().filter((node) => stage.present.includes(node.id) && !deadSet.includes(node.id) && !alsoStops.includes(node.id));
  if (nodes.length === 0) return `<span>${rich(MODEL.processNodes.nothingRuns)}</span>`;
  return `<span class="chips">${nodes.map((node) => `<span class="tag tone-good">${rich(node.label, tokens)}</span>`).join('')}</span>`;
}

function stopsList(stage, deadSet, alsoStops, tokens) {
  const nodes = MODEL.processNodes.branches.flat().filter((node) => stage.present.includes(node.id) && (deadSet.includes(node.id) || alsoStops.includes(node.id)));
  return `<span class="chips">${nodes.map((node) => `<span class="tag tone-bad">${rich(node.label, tokens)}</span>`).join('')}</span>`;
}

function renderKill() {
  const focusKey = focusKeyOfActiveElement();
  const stage = currentStage();
  const rule = decidedRule(stage);
  const decided = rule === null ? null : MODEL.cases.entries[rule.case];
  const cause = decided === null ? null : rule.cause ?? decided.cause;
  const repeatKind = decided?.repeat ?? 'none';
  const deadSet = deadNodes(stage);
  const overseerDead = deadSet.includes('overseer');
  const resumeAwaitsOverseer = repeatKind === 'ladder' && overseerDead;
  if (resumeAwaitsOverseer) state.history = state.history.replaceAll('s', '');
  const walk = climb(stage, cause, repeatKind);
  const tokens = viewTokens(stage, walk);
  const machineDied = state.killed.includes('machine');
  const alsoStops = machineDied ? [] : [...(decided?.alsoStops ?? []), ...(rule?.alsoStops ?? [])].filter((id) => !deadSet.includes(id));

  element('stage').value = state.stage;
  element('stage-blurb').innerHTML = rich(stage.blurb, tokens);
  element('death').value = state.death;
  renderTree(stage, deadSet, alsoStops, tokens);
  const agentCanChooseItsDeath = stage.id === 'running' && deadSet.includes('agent') && !deadSet.includes('watcher') && !machineDied;
  element('death').disabled = !agentCanChooseItsDeath;

  const terminal = walk.step === 'jobLost' || walk.step === 'outage';
  const canRepeat = decided !== null && repeatKind !== 'none' && !terminal;
  const counted = cause !== null && MODEL.interruptionCauses.crash.includes(cause);
  setAvailable(element('repeat-same'), canRepeat && !resumeAwaitsOverseer);
  setAvailable(element('repeat-other'), canRepeat && repeatKind === 'ladder' && counted);
  element('repeat-note').innerHTML = rich(repeatNoteOf(decided, repeatKind, terminal, resumeAwaitsOverseer), tokens);

  const result = element('kill-result');
  if (decided === null) {
    const idle = rich(MODEL.stages.idleHeadline);
    result.innerHTML = `<p class="headline tone-none">${idle}</p>`;
    announceOutcome('kill', idle, 'none');
    restoreFocus(focusKey);
    return;
  }
  const override = walk.step === 'replace' || walk.step === 'jobLost' || walk.step === 'outage' ? MODEL.ladder[walk.step] : null;
  const headline = rich(override?.headline ?? (overseerDead ? decided.overseerDownHeadline : null) ?? decided.headline, tokens);
  const tone = walk.step === 'jobLost' || walk.step === 'outage' ? 'bad' : decided.tone;
  const parts = [`<p class="headline tone-${tone}">${headline}</p>`];
  parts.push('<dl class="facts">');
  parts.push(fact('Keeps running', keepsRunning(stage, deadSet, alsoStops, tokens)));
  parts.push(fact('Stops', stopsList(stage, deadSet, alsoStops, tokens)));
  parts.push(fact('Next Pass', rich((overseerDead ? decided.whenOverseerDown : null) ?? decided.when, tokens)));
  parts.push(fact('It concludes', rich(override?.concludes ?? decided.concludes, tokens)));
  parts.push(fact('<code>InterruptionCause</code>', cause === null ? 'None' : `<code>${escapeHtml(cause)}</code>`));
  parts.push(fact('Counts as a crash?', countsText(decided, cause, override)));
  parts.push(fact('Playbook step', rich(override?.playbook ?? decided.playbook, tokens)));
  parts.push(fact('Files read', `<ul>${decided.files.map((file) => `<li>${rich(file, tokens)}</li>`).join('')}</ul>`));
  parts.push(fact('User sees', rich(override?.user ?? decided.user, tokens)));
  parts.push(fact('Decided by', `<ul>${functionList(override?.decidedBy ?? decided.decidedBy)}</ul>`));
  parts.push(fact('Proved by', specBlock(decided, override !== null ? (walk.step === 'outage' ? 'outage' : 'replacedLadder') : decided.spec)));
  parts.push(fact('Read next', `<a href="${MODEL.documents.entries.runbook.href}#${headingFragmentOf(decided.runbook)}">Runbook, ${escapeHtml(decided.runbook)}</a>; ${decided.read.map(documentLink).join(', ')}`));
  parts.push('</dl>');
  if (repeatKind === 'ladder' && counted) {
    parts.push(`<h3>${rich(MODEL.ladder.title)}</h3>`, ladderHtml(walk));
    if (walk.step === 'outage') parts.push(`<p class="sources">${rich(MODEL.ladder.outage.ended)}</p>`);
    parts.push(`<p class="sources">${rich(MODEL.ladder.held)}</p>`);
  } else if (repeatKind === 'reboot') {
    parts.push(`<p class="sources">${rich(MODEL.repeatNotes.counters.reboot, { ...tokens, kills: walk.kills })}</p>`);
  } else if (repeatKind === 'overseer') {
    parts.push(`<p class="sources">${rich(MODEL.repeatNotes.counters.overseer, { ...tokens, kills: walk.kills })}</p>`);
  } else if (repeatKind === 'assistant') {
    parts.push(`<p class="sources">${rich(MODEL.repeatNotes.counters.assistant, { ...tokens, kills: walk.kills })}</p>`);
    parts.push(`<p class="sources">${specLine('noAssistant')}</p>`);
  }
  parts.push(gapCallouts(decided.gaps));
  result.innerHTML = parts.join('');
  announceOutcome('kill', headline, tone);
  restoreFocus(focusKey);
}

function toggleNode(nodeId) {
  const killed = new Set(state.killed);
  if (nodeId === 'machine') {
    state.killed = killed.has('machine') ? [] : ['machine'];
  } else {
    killed.delete('machine');
    if (killed.has(nodeId)) killed.delete(nodeId);
    else killed.add(nodeId);
    state.killed = [...killed];
  }
  state.history = '';
}

/* Cut a hold short */

function currentStopIndex() {
  return MODEL.holdStops.entries.findIndex((stop) => stop.id === state.stop);
}

function renderStrip() {
  const stops = MODEL.holdStops.entries;
  const phases = MODEL.holdPhases.entries.map((phase) => {
    const members = stops.filter((stop) => stop.phase === phase.id).length;
    return `<div class="phase ${members > 1 ? '' : 'single'}" style="grid-column: span ${members}" title="${escapeHtml(phase.label)}"><span class="phase-name">${escapeHtml(members > 1 ? phase.label : phase.label.split(' ')[0])}</span></div>`;
  }).join('');
  const legend = MODEL.holdPhases.entries.map((phase) => {
    const numbers = stops.flatMap((stop, index) => (stop.phase === phase.id ? [index + 1] : []));
    const range = numbers.length > 1 ? `${numbers[0]}${MODEL.holdPhases.legendJoin}${numbers[numbers.length - 1]}` : `${numbers[0]}`;
    return `${range}: ${phase.label}`;
  }).join(', ');
  const buttons = stops.map((stop, index) => `<button type="button" class="stop" data-stop="${stop.id}" data-focus-key="stop-${stop.id}" aria-pressed="${stop.id === state.stop}" aria-label="Stop ${index + 1}: ${escapeHtml(stop.label.replace(/`/g, ''))}">${index + 1}</button>`).join('');
  const { bands } = MODEL.holdPhases;
  const bandRow = (test, className, label, shortLabel) => {
    const first = stops.findIndex(test);
    const span = stops.filter(test).length;
    const before = first > 0 ? `<div class="band empty" style="grid-column: span ${first}"></div>` : '';
    return `<div class="strip-row">${before}<div class="band ${className}" style="grid-column: span ${span}"><span class="long">${escapeHtml(label)}</span><span class="short">${escapeHtml(shortLabel)}</span></div></div>`;
  };
  element('strip').style.setProperty('--stops', stops.length);
  element('strip').innerHTML = `<div class="strip-row">${phases}</div><div class="strip-row">${buttons}</div>`
    + bandRow((stop) => stop.lock, 'lock', bands.lock.label, bands.lock.short)
    + bandRow((stop) => stop.files.journal === 'whole', 'journal', bands.journal.label, bands.journal.short)
    + `<p class="phase-legend">${escapeHtml(legend)}</p>`;
}

function renderHold() {
  const focusKey = focusKeyOfActiveElement();
  const stop = MODEL.holdStops.entries[currentStopIndex()];
  renderStrip();
  element('scrub').value = String(currentStopIndex() + 1);
  element('scrub').setAttribute('aria-valuetext', stop.label.replace(/`/g, ''));
  element('stop-title').innerHTML = `${currentStopIndex() + 1}. ${rich(stop.label)}`;
  element('modes').innerHTML = MODEL.holdModes.options.map((mode) => `<button type="button" data-mode="${mode.id}" data-focus-key="mode-${mode.id}" aria-pressed="${mode.id === state.mode}">${escapeHtml(mode.label)}</button>`).join('');
  element('mode-glosses').innerHTML = MODEL.holdModes.options.map((mode) => `<li><strong>${escapeHtml(mode.label)}:</strong> ${rich(MODEL.holdModes.glosses[mode.id])}</li>`).join('');
  element('files').innerHTML = `<tbody>${MODEL.holdFiles.rows.map((row) => {
    const fileState = stop.files[row.id];
    return `<tr><th scope="row">${rich(row.label)}</th><td><span class="tag state-${fileState}">${escapeHtml(MODEL.holdFiles.words[fileState])}</span></td></tr>`;
  }).join('')}</tbody>`;

  const modeRecord = stop[state.mode];
  const tone = modeRecord?.tone ?? 'none';
  const headline = rich(modeRecord?.title ?? (state.mode === 'damaged' ? MODEL.holdModes.noJournal : stop.stalledReason));
  const parts = [`<p class="headline tone-${tone}">${headline}</p>`];
  parts.push('<dl class="facts">');
  parts.push(fact('Lock', rich(stop.lock ? MODEL.lockFacts.held : MODEL.lockFacts.free)));
  parts.push(fact('A reader sees', rich(`${stop.reader} ${MODEL.lockFacts.readers}`)));
  if (modeRecord) parts.push(fact('What happens next', rich(modeRecord.next)));
  parts.push(fact('Decided by', `<ul>${functionList(stop.decidedBy)}</ul>`));
  if (modeRecord) {
    const specKey = { killed: stop.spec, stalled: stop.stalledSpec ?? null, damaged: stop.damagedSpec ?? null }[state.mode];
    parts.push(fact('Proved by', specBlock(state.mode === 'killed' ? stop : { specNote: stop.specNote }, specKey)));
  }
  parts.push(fact('Read next', `<a href="${MODEL.documents.entries.runbook.href}#${headingFragmentOf(MODEL.holdStops.runbook)}">Runbook, ${escapeHtml(MODEL.holdStops.runbook)}</a>; ${stop.read.map(documentLink).join(', ')}`));
  parts.push('</dl>');
  parts.push(gapCallouts(stop.gaps));
  element('hold-result').innerHTML = parts.join('');
  announceOutcome('hold', headline, tone);
  restoreFocus(focusKey);
}

/* Fail a Baton pass */

function batonTokens() {
  return { n: FIRST_GENERATION, n1: FIRST_GENERATION + 1, n2: FIRST_GENERATION + 2 };
}

function currentFailure() {
  return MODEL.batonFailures.entries[state.failure];
}

function failureChips(row) {
  return (row.failures ?? []).map((id) => {
    const failure = MODEL.batonFailures.entries[id];
    return `<button type="button" class="failure" data-failure="${id}" data-focus-key="failure-${id}" aria-pressed="${state.failure === id}">${rich(failure.label)}</button>`;
  }).join('');
}

function laneRow(row, classes, tokens, showChips = true) {
  const lanes = MODEL.batonLanes;
  const cell = (label, text) => (text ? `<div class="lane-cell"><span class="lane-label">${escapeHtml(label)}:</span>${rich(text, tokens)}</div>` : '<div class="lane-cell"></div>');
  const chips = showChips ? failureChips(row) : '';
  const unreached = classes.includes('unreached');
  return `<div class="lane-group drive-${unreached ? 'old' : row.phase} ${classes}">`
    + `<div class="lane-row"><div class="driver">${escapeHtml(unreached ? lanes.unreached : lanes.drivers[row.phase])}</div>${cell(lanes.columns.old, row.old)}${cell(lanes.columns.file, row.file)}${cell(lanes.columns.successor, row.successor)}</div>`
    + (chips === '' ? '' : `<div class="failures">${chips}</div>`)
    + '</div>';
}

function renderSwim() {
  const focusKey = focusKeyOfActiveElement();
  const failure = currentFailure();
  const tokens = batonTokens();
  const rows = MODEL.batonRows.entries;
  const failed = state.failure !== 'none';
  const atIndex = rows.findIndex((row) => row.id === failure.atRow);
  const lastReached = failed && failure.atRow === 'serving' ? atIndex - 1 : atIndex;
  const tailKey = failure.tail ?? failure.outcome;
  const tail = failed ? MODEL.batonTails.entries[tailKey] ?? [] : [];
  const reached = rows.slice(0, lastReached + 1).map((row) => laneRow(row, '', tokens));
  const outcome = MODEL.batonOutcomes.entries[failure.outcome];
  const injectedBeyondItsRow = failed && lastReached < atIndex;
  const injectRow = injectedBeyondItsRow ? [`<div class="lane-group inject-here"><div class="driver">${escapeHtml(MODEL.batonLanes.injectHere)}</div><div class="failures">${failureChips(rows[atIndex])}</div></div>`] : [];
  const injected = failed ? [`<div class="injected"><strong>Injected:</strong> ${rich(failure.label)} → ${rich(outcome.label)}. ${rich(failure.detected, tokens)}</div>`] : [];
  const tails = tail.map((row) => laneRow(row, 'tail', tokens));
  const rest = rows.slice(lastReached + 1).map((row) => laneRow(row, 'unreached', tokens, !(injectedBeyondItsRow && row.id === failure.atRow)));
  element('swim').innerHTML = [...reached, ...injectRow, ...injected, ...tails, ...rest].join('');
  setAvailable(element('reset-baton'), failed);
  restoreFocus(focusKey);
}

function renderBaton() {
  renderSwim();
  const failure = currentFailure();
  const tokens = { ...batonTokens(), step: failure.step ?? '' };
  const outcome = MODEL.batonOutcomes.entries[failure.outcome];
  const usesFailedWording = failure.outcome === 'kept-driving' || failure.outcome === 'taken-back';
  const headline = `${rich(outcome.label)}. ${rich(outcome.sentence, tokens)}`;
  const parts = [`<p class="headline tone-${outcome.tone}">${headline}</p>`];
  parts.push('<dl class="facts">');
  parts.push(fact('Failing step', failure.step === null ? 'None' : `<code>${escapeHtml(failure.step)}</code>`));
  parts.push(fact('Detected by', rich(failure.detected, tokens)));
  parts.push(fact('Drives after', rich(outcome.drives, tokens)));
  parts.push(fact('User sees', rich(failure.user ?? (usesFailedWording ? MODEL.batonFailures.failedUser : ''), tokens)));
  parts.push(fact('Decided by', `<ul>${functionList(failure.decidedBy)}</ul>`));
  parts.push(fact('Proved by', specBlock(failure)));
  parts.push(fact('Read next', `<a href="${MODEL.documents.entries.runbook.href}#${headingFragmentOf(MODEL.batonFailures.runbook)}">Runbook, ${escapeHtml(MODEL.batonFailures.runbook)}</a>; ${documentLink('baton')}`));
  parts.push('</dl>');
  parts.push(`<p class="sources">${rich(MODEL.batonFailures.careful)}</p>`);
  parts.push(gapCallouts(MODEL.batonFailures.asBuilt));
  element('baton-result').innerHTML = parts.join('');
  announceOutcome('baton', headline, outcome.tone);
}

/* The shell: tabs, hash, theme */

function renderTabs() {
  for (const tab of TABS) {
    const button = element(`tab-${tab.id}`);
    const selected = tab.id === state.tab;
    button.setAttribute('aria-selected', String(selected));
    button.tabIndex = selected ? 0 : -1;
    element(`panel-${tab.id}`).hidden = !selected;
  }
  document.querySelector('main').dataset.tab = state.tab;
}

function render() {
  renderTabs();
  if (state.tab === 'kill') renderKill();
  if (state.tab === 'hold') renderHold();
  if (state.tab === 'baton') renderBaton();
  watchResultPanel();
}

function hashOfState() {
  if (state.tab === 'kill') {
    const isDefault = state.stage === DEFAULTS.stage && state.killed.join() === DEFAULTS.killed.join() && state.death === DEFAULTS.death && state.history === '';
    if (isDefault) return 'kill-the-overseer';
    return `tab=kill&stage=${state.stage}&killed=${state.killed.join(',')}&death=${state.death}&history=${state.history}`;
  }
  if (state.tab === 'hold') {
    return state.stop === DEFAULTS.stop && state.mode === DEFAULTS.mode ? 'cut-a-hold-short' : `tab=hold&stop=${state.stop}&mode=${state.mode}`;
  }
  return state.failure === 'none' ? 'fail-a-baton-pass' : `tab=baton&failure=${state.failure}`;
}

function writeHash() {
  const hash = `#${hashOfState()}`;
  if (location.hash === hash) return;
  try {
    history.replaceState(null, '', hash);
  } catch {
    location.hash = hash;
  }
}

function update() {
  render();
  writeHash();
}

function decodedHash() {
  try {
    return decodeURIComponent(location.hash.slice(1));
  } catch {
    return '';
  }
}

function readHash() {
  const hash = decodedHash();
  const alias = TABS.find((tab) => tab.alias === hash);
  if (alias !== undefined) {
    Object.assign(state, { tab: alias.id, ...DEFAULTS, killed: [...DEFAULTS.killed] });
    return;
  }
  const parameters = new URLSearchParams(hash);
  const tab = parameters.get('tab');
  if (!TABS.some((known) => known.id === tab)) return;
  state.tab = tab;
  const stage = parameters.get('stage');
  if (MODEL.stages.entries.some((known) => known.id === stage)) state.stage = stage;
  const nodeIds = [MODEL.processNodes.machine, ...MODEL.processNodes.branches.flat()].map((node) => node.id);
  if (parameters.has('killed')) state.killed = (parameters.get('killed') ?? '').split(',').filter((id) => nodeIds.includes(id));
  const death = parameters.get('death');
  if (MODEL.agentDeaths.options.some((known) => known.id === death)) state.death = death;
  const repeats = parameters.get('history');
  if (repeats !== null && /^[so]*$/.test(repeats)) state.history = repeats;
  const stop = parameters.get('stop');
  if (MODEL.holdStops.entries.some((known) => known.id === stop)) state.stop = stop;
  const mode = parameters.get('mode');
  if (MODEL.holdModes.options.some((known) => known.id === mode)) state.mode = mode;
  const failure = parameters.get('failure');
  if (failure !== null && Object.hasOwn(MODEL.batonFailures.entries, failure)) state.failure = failure;
}

function storedTheme() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    return THEMES.includes(stored) ? stored : 'auto';
  } catch {
    return 'auto';
  }
}

let chosenTheme = storedTheme();

function applyTheme(theme) {
  if (theme === 'auto') ROOT.removeAttribute('data-theme');
  else ROOT.setAttribute('data-theme', theme);
}

function renderTheme() {
  element('theme').innerHTML = THEMES.map((theme) => `<button type="button" data-theme-choice="${theme}" data-focus-key="theme-${theme}" aria-pressed="${theme === chosenTheme}">${theme}</button>`).join('');
}

function renderHeader() {
  const { page, glossary } = MODEL;
  element('crumbs').innerHTML = `<a href="${page.docsIndex.href}">${escapeHtml(page.docsIndex.label)}</a><span>/</span><a href="${page.home.href}">${escapeHtml(page.home.label)}</a>`;
  element('title').textContent = page.title;
  element('question').textContent = page.question;
  element('lede').textContent = page.lede;
  element('terms').innerHTML = `${glossary.terms.map(glossaryLink).join(', ')}.`;
  element('tabs').innerHTML = TABS.map((tab) => `<button type="button" role="tab" id="tab-${tab.id}" data-tab="${tab.id}" aria-controls="panel-${tab.id}">${escapeHtml(tab.label)}</button>`).join('');
  element('tree-caption').textContent = MODEL.processNodes.caption;
  element('kill-hint').innerHTML = rich(page.killHint);
  element('hold-intro').innerHTML = rich(MODEL.holdStops.intro);
  element('file-legend').innerHTML = MODEL.holdFiles.legend.map((entry) => `<span><span class="tag state-${entry.state}">${escapeHtml(MODEL.holdFiles.words[entry.state])}</span> ${rich(entry.meaning)}</span>`).join('');
  const lanes = MODEL.batonLanes;
  element('baton-intro').innerHTML = rich(lanes.intro, batonTokens());
  element('swim-key').innerHTML = lanes.key.map((entry) => `<li><span class="key-mark ${entry.className}"></span>${rich(entry.label)}</li>`).join('');
  element('rail-caption').innerHTML = rich(MODEL.batonFailures.noWatcher);
  element('lane-head').innerHTML = [lanes.columns.driver, lanes.columns.old, lanes.columns.file, lanes.columns.successor].map((label) => `<span>${escapeHtml(label)}</span>`).join('');
  element('footer').innerHTML = `Facts at commit <code>${page.commit}</code>. Normal flow is in ${documentLink('ticketJourney')}. Bounds are in ${documentLink('bounds')}.`;
  element('stage').innerHTML = MODEL.stages.entries.map((stage) => `<option value="${stage.id}">${escapeHtml(stage.label)}</option>`).join('');
  element('death').innerHTML = MODEL.agentDeaths.options.map((option) => `<option value="${option.id}">${escapeHtml(option.label.replace(/`/g, ''))}</option>`).join('');
  element('scrub').max = String(MODEL.holdStops.entries.length);
}

function moveTab(offset) {
  const index = TABS.findIndex((tab) => tab.id === state.tab);
  state.tab = TABS[(index + offset + TABS.length) % TABS.length].id;
  update();
  element(`tab-${state.tab}`).focus();
}

/** Rows appear above the clicked chip, so the page scrolls by what they added and the chip stays under the pointer. */
function injectFailure(failure, chip) {
  const topBefore = chip.getBoundingClientRect().top;
  state.failure = state.failure === failure ? 'none' : failure;
  update();
  const moved = document.querySelector(`[data-failure="${failure}"]`);
  if (moved !== null) window.scrollBy(0, moved.getBoundingClientRect().top - topBefore);
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('button');
  if (target === null || target.disabled) return;
  const { tab, node, stop, mode, failure, themeChoice } = target.dataset;
  if (tab !== undefined) { state.tab = tab; update(); element(`tab-${tab}`).focus(); return; }
  if (node !== undefined) { toggleNode(node); update(); return; }
  if (stop !== undefined) { state.stop = stop; update(); return; }
  if (mode !== undefined) { state.mode = mode; update(); return; }
  if (failure !== undefined) { injectFailure(failure, target); return; }
  if (themeChoice !== undefined) {
    chosenTheme = themeChoice;
    applyTheme(chosenTheme);
    try { localStorage.setItem(STORAGE_KEY, chosenTheme); } catch { /* the page works without storage */ }
    renderTheme();
    element('theme').querySelector(`[data-theme-choice="${chosenTheme}"]`)?.focus();
  }
});

element('tabs').addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') { event.preventDefault(); moveTab(1); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); moveTab(-1); }
  if (event.key === 'Home') { event.preventDefault(); state.tab = TABS[0].id; update(); element(`tab-${state.tab}`).focus(); }
  if (event.key === 'End') { event.preventDefault(); state.tab = TABS[TABS.length - 1].id; update(); element(`tab-${state.tab}`).focus(); }
});

element('stage').addEventListener('change', (event) => {
  state.stage = event.target.value;
  state.killed = [];
  state.history = '';
  update();
});
element('death').addEventListener('change', (event) => { state.death = event.target.value; state.history = ''; update(); });
element('repeat-same').addEventListener('click', (event) => { if (isAvailable(event.currentTarget)) { state.history += 's'; update(); } });
element('repeat-other').addEventListener('click', (event) => { if (isAvailable(event.currentTarget)) { state.history += 'o'; update(); } });
element('reset-kill').addEventListener('click', () => { state.killed = []; state.history = ''; state.death = DEFAULTS.death; update(); });
element('reset-baton').addEventListener('click', (event) => { if (isAvailable(event.currentTarget)) { state.failure = 'none'; update(); } });
element('outcome-strip').addEventListener('click', () => {
  const panel = element(`${state.tab}-result`);
  panel.scrollIntoView({ block: 'start' });
  panel.focus({ preventScroll: true });
});
element('scrub').addEventListener('input', (event) => { state.stop = MODEL.holdStops.entries[Number(event.target.value) - 1].id; update(); });
window.addEventListener('hashchange', () => { readHash(); render(); });

applyTheme(chosenTheme);
renderTheme();
renderHeader();
readHash();
update();
</script>
</body>
</html>
