<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The bundle walk stops at the edge of the group</title>
  <desc>Dependency graph. The walk from release ticket 009 follows dependsOn inside the group to 007 and 006, and stops at 012 outside the group. So 008, reached only through 012, stays out of the bundle.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="410" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">The bundle walk stops at the edge of the group</text>
  <text x="40" y="68" font-size="13" fill="#73726c">only same-group dependsOn edges are followed from the release ticket</text>
  <rect x="40" y="84" width="420" height="308" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <text x="54" y="104" font-size="12" fill="#444441">group editing</text>
  <rect x="54" y="114" width="194" height="266" rx="10" fill="none" stroke="#185FA5" stroke-width="1.6"/>
  <text x="66" y="132" font-size="12" fill="#0C447C" font-weight="500">bundle</text>
  <path d="M151,196 L151,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="159" y="215" font-size="11" fill="#73726c">dependsOn</text>
  <path d="M151,284 L151,314" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="159" y="303" font-size="11" fill="#73726c">dependsOn</text>
  <path d="M236,168 L565,168 L565,226" fill="none" stroke="#dcd9cc" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="470" y="160" font-size="11" fill="#73726c">dependsOn: not followed</text>
  <path d="M460,158 L460,178" fill="none" stroke="#A32D2D" stroke-width="2.4"/>
  <text x="452" y="160" font-size="11" fill="#A32D2D" text-anchor="end">walk stops</text>
  <path d="M565,284 L565,344 L442,344" fill="none" stroke="#dcd9cc" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="474" y="362" font-size="11" fill="#73726c">not reached</text>
  <rect x="66" y="140" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="164.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">#009</text>
  <text x="151" y="182.0" font-size="12" fill="#185FA5" text-anchor="middle">release ticket</text>
  <rect x="66" y="228" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="252.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">#007</text>
  <text x="151" y="270.0" font-size="12" fill="#185FA5" text-anchor="middle">in the bundle</text>
  <rect x="66" y="316" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="340.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">#006</text>
  <text x="151" y="358.0" font-size="12" fill="#185FA5" text-anchor="middle">in the bundle</text>
  <rect x="270" y="316" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="355" y="340.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#008</text>
  <text x="355" y="358.0" font-size="12" fill="#5F5E5A" text-anchor="middle">group, outside the bundle</text>
  <rect x="270" y="228" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="355" y="252.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#010</text>
  <text x="355" y="270.0" font-size="12" fill="#5F5E5A" text-anchor="middle">group, no path</text>
  <rect x="490" y="228" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="565" y="252.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#012</text>
  <text x="565" y="270.0" font-size="12" fill="#5F5E5A" text-anchor="middle">outside the group</text>
</svg>
