<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The target fast-forwards only to a gated commit</title>
  <desc>Git graph. The target's recorded tip is merged into the ticket branch, the gate judges that merged commit, and a compare and swap fast-forwards the target to it. A red gate lands nothing, and a moved tip lands nothing and requeues the ticket.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="350" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">The target fast-forwards only to a gated commit</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the merge happens on the ticket branch; the target's ref moves last</text>
  <text x="40" y="124" font-size="12" fill="#444441">target</text>
  <text x="40" y="220" font-size="12" fill="#444441">branch</text>
  <path d="M100,120 L165,120" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M100,120 L130,216" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M130,216 L160,216" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M160,216 L230,216" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M174,120 L526,120" fill="none" stroke="#dcd9cc" stroke-width="1.2"/>
  <path d="M171,127 L222,205" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="100" cy="120" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="165" cy="120" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="160" cy="216" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="230" cy="216" r="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="230" y="220" font-size="11" fill="#444441" text-anchor="middle" font-weight="500">M</text>
  <circle cx="538" cy="120" r="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="538" y="124" font-size="11" fill="#27500A" text-anchor="middle" font-weight="500">M</text>
  <text x="165" y="102" font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">targetTip</text>
  <text x="140" y="244" font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">branchTip</text>
  <text x="212" y="146" font-size="11" fill="#73726c">1. merge the recorded</text>
  <text x="212" y="160" font-size="11" fill="#73726c">tip into the branch</text>
  <text x="232" y="262" font-size="12" fill="#444441" text-anchor="middle">M, the merged commit</text>
  <text x="538" y="98" font-size="11" fill="#27500A" text-anchor="middle">M again: now the target's tip</text>
  <rect x="578" y="111" width="56" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="606.0" y="124" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">target</text>
  <path d="M578,120 L553,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M242,216 L266,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="268" y="188" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="323" y="212.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">2. Gate</text>
  <text x="323" y="230.0" font-size="12" fill="#185FA5" text-anchor="middle">the merged tree</text>
  <path d="M378,216 L454,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="416" y="208" font-size="11" fill="#73726c" text-anchor="middle">gate passed</text>
  <rect x="456" y="188" width="164" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="538" y="212.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">3. Compare and swap</text>
  <text x="538" y="230.0" font-size="12" fill="#185FA5" text-anchor="middle">tip still targetTip?</text>
  <path d="M538,188 L538,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="546" y="165" font-size="11" fill="#73726c">same tip: fast-forward</text>
  <path d="M482,120 L482,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="474" y="165" font-size="11" fill="#73726c" text-anchor="end">reads the tip</text>
  <path d="M323,244 L323,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="331" y="263" font-size="11" fill="#73726c">red</text>
  <rect x="258" y="276" width="130" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="323" y="300.0" font-size="14" fill="#791F1F" text-anchor="middle" font-weight="500">Nothing lands</text>
  <text x="323" y="318.0" font-size="12" fill="#A32D2D" text-anchor="middle">an incident opens</text>
  <path d="M538,244 L538,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="546" y="263" font-size="11" fill="#73726c">tip moved</text>
  <rect x="456" y="276" width="164" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="538" y="300.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Nothing lands</text>
  <text x="538" y="318.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the ticket requeues</text>
</svg>
