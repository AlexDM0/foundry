<svg xmlns="http://www.w3.org/2000/svg" width="680" height="664" viewBox="0 0 680 664" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A landing refusal is decided by the first check that fails</title>
  <desc>Decision ladder in check order, each failure with its action. A failed Acceptance holds the ticket, a bad checkout or refused fast-forward holds the target, and an unchanged tip lands. A moved tip finishes the board side if it contains the merged commit, and otherwise requeues.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="662" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A landing refusal is decided by the first check that fails</text>
  <text x="40" y="68" font-size="13" fill="#73726c">checks run top to bottom; a git error at any rung is git-failed and holds the target</text>

  <path d="M180,148 L180,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M180,220 L180,242" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M180,292 L180,314" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M180,364 L180,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="188" y="164" font-size="11" fill="#73726c">yes</text>
  <text x="188" y="236" font-size="11" fill="#73726c">yes</text>
  <text x="188" y="308" font-size="11" fill="#73726c">tip moved</text>
  <text x="188" y="380" font-size="11" fill="#73726c">no</text>

  <path d="M300,122 L378,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="115" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M300,195 L378,195" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="188" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M300,339 L378,339" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="332" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M300,411 L378,411" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="404" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M240,436 L240,483 L378,483" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="310" y="476" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M60,267 L46,267 L46,551 L58,551" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="52" y="522" font-size="11" fill="#73726c">tip unchanged</text>
  <path d="M300,551 L378,551" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="544" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M180,576 L180,598" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="188" y="592" font-size="11" fill="#73726c">yes</text>

  <g fill="#E6F1FB" stroke="#CFE2F6">
    <rect x="60" y="96" width="240" height="52" rx="8"/>
    <rect x="60" y="170" width="240" height="50" rx="8"/>
    <rect x="60" y="242" width="240" height="50" rx="8"/>
    <rect x="60" y="314" width="240" height="50" rx="8"/>
    <rect x="60" y="386" width="240" height="50" rx="8"/>
    <rect x="60" y="526" width="240" height="50" rx="8"/>
  </g>
  <g font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">
    <text x="180" y="118">Acceptance accounted for?</text>
    <text x="180" y="200">On the target branch?</text>
    <text x="180" y="272">Tip equals targetTip?</text>
    <text x="180" y="344">Merged commit already in the tip?</text>
    <text x="180" y="416">Tip in a merge-landed record?</text>
    <text x="180" y="556">Fast-forward clean?</text>
  </g>
  <text x="180" y="136" font-size="12" fill="#185FA5" text-anchor="middle">when the pipeline sets review</text>

  <rect x="380" y="96" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="510" y="118" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Hold the ticket</text>
  <text x="510" y="136" font-size="12" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">acceptance-*</text>

  <rect x="380" y="169" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="510" y="191" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Hold the target</text>
  <text x="510" y="209" font-size="12" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">not-on-target-branch</text>

  <rect x="380" y="313" width="260" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="510" y="335" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Finish the board side</text>
  <text x="510" y="353" font-size="12" fill="#3B6D11" text-anchor="middle">already-landed, not a refusal</text>

  <rect x="380" y="385" width="260" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="510" y="407" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Requeue: a recorded landing beat it</text>
  <text x="510" y="425" font-size="11" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">target-moved-by-a-recorded-landing</text>

  <rect x="380" y="457" width="260" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="510" y="479" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Requeue and count</text>
  <text x="510" y="497" font-size="12" fill="#5F5E5A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">target-moved</tspan>, parks on repeats</text>

  <rect x="380" y="525" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="510" y="547" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Hold the target</text>
  <text x="510" y="565" font-size="12" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">dirty-checkout, git-failed</text>

  <rect x="60" y="600" width="240" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="180" y="627" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Landed</text>
</svg>
