<svg xmlns="http://www.w3.org/2000/svg" width="680" height="338" viewBox="0 0 680 338" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A refresh starts from the group and pulls main in</title>
  <desc>Two git graphs side by side. A ticket merge starts on the branch lane and merges the target's tip in; a refresh starts on the group, which is the target, and merges main's tip in on a detached head.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="336" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A refresh starts from the group and pulls main in</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the merge stays on a detached head, so only the landing moves the group's ref</text>
  <text x="40" y="104" font-size="14" fill="#3d3d3a" font-weight="500">Ticket merge</text>
  <text x="360" y="104" font-size="14" fill="#3d3d3a" font-weight="500">Refresh</text>
  <path d="M340,88 L340,316" fill="none" stroke="#ECE7DC" stroke-width="1.2"/>
  <text x="40" y="154" font-size="12" fill="#444441">target</text>
  <text x="40" y="254" font-size="12" fill="#444441">branch</text>
  <path d="M100,150 L169,150" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M100,250 L169,250" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M187,250 L259,250" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M185,157 L263,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="178" cy="150" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="178" cy="250" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="272" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="178" y="118" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mergedTip</text>
  <text x="178" y="134" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">targetTip</text>
  <text x="178" y="276" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">startTip</text>
  <text x="178" y="292" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">branchTip</text>
  <rect x="245" y="290" width="54" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="272.0" y="303" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">target</text>
  <path d="M272,290 L272,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="280" y="278" font-size="11" fill="#73726c">moves</text>
  <text x="360" y="154" font-size="12" fill="#444441">main</text>
  <text x="360" y="254" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">group-</text>
  <text x="360" y="268" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">editing</text>
  <path d="M420,150 L489,150" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M420,250 L489,250" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M507,250 L579,250" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M505,157 L583,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="498" cy="150" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="498" cy="250" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="592" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="498" y="118" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mergedTip</text>
  <text x="498" y="134" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">branchTip</text>
  <text x="498" y="276" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">startTip</text>
  <text x="498" y="292" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">targetTip</text>
  <text x="533" y="242" font-size="11" fill="#73726c" text-anchor="middle">detached</text>
  <rect x="540" y="290" width="100" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="590.0" y="303" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">group-editing</text>
  <path d="M592,290 L592,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="600" y="278" font-size="11" fill="#73726c">moves</text>
  <text x="592" y="322" font-size="11" fill="#73726c" text-anchor="middle">at landing</text>
</svg>
