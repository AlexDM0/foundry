<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A sweep drives every target until nothing moves</title>
  <desc>Strip of one sweep. recheckHeldTargets runs once, then a round takes each target in turn, advanceTheSlot and then allocate. Rounds repeat until nothing moved or ROUNDS_PER_SWEEP is reached, when the rest waits for the next Pass.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="550" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A sweep drives every target until nothing moves</text>
  <text x="40" y="68" font-size="13" fill="#73726c">at most ROUNDS_PER_SWEEP rounds per Pass; what still moves waits for the next Pass</text>
  <rect x="200" y="88" width="280" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="109.0" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">recheckHeldTargets</text>
  <text x="340" y="127.0" font-size="12" fill="#185FA5" text-anchor="middle">once, before the first round</text>
  <path d="M340,138 L340,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="60" y="166" width="580" height="222" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <text x="74" y="186" font-size="12" fill="#444441">one round: each live target in turn</text>
  <text x="160" y="210" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
  <rect x="72" y="218" width="176" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160" y="240" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">advanceTheSlot</text>
  <text x="160" y="257" font-size="12" fill="#185FA5" text-anchor="middle">one phase step</text>
  <path d="M160,290 L160,318" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="72" y="320" width="176" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160" y="344.0" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">allocate</text>
  <text x="160" y="362.0" font-size="12" fill="#185FA5" text-anchor="middle">claims if free</text>
  <text x="350" y="210" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">group-editing</text>
  <rect x="262" y="218" width="176" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350" y="240" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">advanceTheSlot</text>
  <text x="350" y="257" font-size="12" fill="#185FA5" text-anchor="middle">one phase step</text>
  <path d="M350,290 L350,318" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="262" y="320" width="176" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350" y="344.0" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">allocate</text>
  <text x="350" y="362.0" font-size="12" fill="#185FA5" text-anchor="middle">claims if free</text>
  <text x="540" y="210" font-size="12" fill="#444441" text-anchor="middle">a target a job holds</text>
  <rect x="452" y="218" width="176" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="540" y="240" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">advanceTheSlot</text>
  <text x="540" y="257" font-size="12" fill="#185FA5" text-anchor="middle">one phase step</text>
  <path d="M540,290 L540,318" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="452" y="320" width="176" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="540" y="344.0" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">allocate</text>
  <text x="540" y="362.0" font-size="12" fill="#185FA5" text-anchor="middle">claims if free</text>
  <text x="160" y="277" font-size="11" fill="#A32D2D" text-anchor="middle">an awaited gate stalls here</text>
  <path d="M340,388 L340,414" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="240" y="416" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="440.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Anything moved?</text>
  <text x="340" y="458.0" font-size="12" fill="#185FA5" text-anchor="middle">and rounds left?</text>
  <path d="M240,444 L44,444 L44,240 L58,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="142" y="437" font-size="11" fill="#73726c" text-anchor="middle">moved: next round</text>
  <path d="M440,444 L488,444" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="464" y="437" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <rect x="490" y="416" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="565" y="440.0" font-size="14" fill="#27500A" text-anchor="middle" font-weight="500">Sweep ends</text>
  <text x="565" y="458.0" font-size="12" fill="#3B6D11" text-anchor="middle">nothing moved</text>
  <path d="M340,472 L340,492" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="348" y="486" font-size="11" fill="#73726c">cap reached</text>
  <rect x="240" y="494" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="519.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500">Rest waits for the next Pass</text>
</svg>
