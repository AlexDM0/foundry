<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A group is a second integration line with one way out</title>
  <desc>Git graph. Tickets 003 and 004 land on group-editing as reviewed, and a refresh merges main in. Release ticket 005, which depends on them, forks from the group's tip; main fast-forwards to its merge, delivering the bundle, here all three.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A group is a second integration line with one way out</text>
  <text x="40" y="68" font-size="13" fill="#73726c">tickets land on the group as reviewed; only the release ticket reaches main</text>
  <text x="40" y="128" font-size="12" fill="#444441">main</text>
  <text x="40" y="248" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">group-editing</text>
  <text x="40" y="348" font-size="12" fill="#444441">ticket branches</text>
  <path d="M150,124 L470,124" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M150,124 L190,244" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M190,244 L270,244" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M360,244 L470,244" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M190,244 L300,344" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,344 L360,244" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M470,244 L540,344" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M540,344 L610,124" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M270,244 L360,244" fill="none" stroke="#dcd9cc" stroke-width="1.2"/>
  <path d="M380,124 L470,244" fill="none" stroke="#dcd9cc" stroke-width="1.2"/>
  <path d="M470,124 L610,124" fill="none" stroke="#dcd9cc" stroke-width="1.2"/>
  <circle cx="150" cy="124" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="380" cy="124" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="470" cy="124" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="610" cy="124" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <circle cx="190" cy="244" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="270" cy="244" r="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <circle cx="360" cy="244" r="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <circle cx="470" cy="244" r="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <circle cx="300" cy="344" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="540" cy="344" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="270" y="170" font-size="11" fill="#73726c" text-anchor="middle">#003 lands</text>
  <text x="270" y="183" font-size="11" fill="#73726c" text-anchor="middle">reviewed</text>
  <rect x="249" y="190" width="42" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="270.0" y="203" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">group</text>
  <path d="M270,208 L270,233" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="170" font-size="11" fill="#73726c" text-anchor="middle">#004 lands</text>
  <text x="360" y="183" font-size="11" fill="#73726c" text-anchor="middle">reviewed</text>
  <rect x="339" y="190" width="42" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="360.0" y="203" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">group</text>
  <path d="M360,208 L360,233" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="449" y="190" width="42" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="470.0" y="203" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">group</text>
  <path d="M470,208 L470,233" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="486" y="224" font-size="11" fill="#73726c">refresh: detached,</text>
  <text x="486" y="238" font-size="11" fill="#73726c">then fast-forward</text>
  <rect x="589" y="84" width="42" height="18" rx="5" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="610.0" y="97" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
  <path d="M610,102 L610,111" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="580" y="98" font-size="11" fill="#73726c" text-anchor="end">main moves here: the bundle is delivered</text>
  <text x="546" y="140" font-size="11" fill="#73726c" text-anchor="middle">2nd parent</text>
  <text x="586" y="256" font-size="11" fill="#73726c">1st parent</text>
  <text x="182" y="268" font-size="11" fill="#73726c" text-anchor="end">forks at first launch</text>
  <text x="270" y="268" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-003</text>
  <text x="300" y="368" font-size="11" fill="#73726c" text-anchor="middle">ticket-004, forked before #003 landed</text>
  <text x="540" y="368" font-size="11" fill="#73726c" text-anchor="middle">#005, the release ticket;</text>
  <text x="540" y="382" font-size="11" fill="#73726c" text-anchor="middle">#003 and #004 are its dependencies</text>
  <text x="40" y="416" font-size="11" fill="#73726c">A commit on a lane is one that branch fast-forwarded to, so it wears both names. Green: landed on a target.</text>
  <text x="40" y="432" font-size="11" fill="#73726c">A tag marks where a ref moves. Light lines: second parents. The release removes the group's worktree and branch.</text>
</svg>
