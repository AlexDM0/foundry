<svg xmlns="http://www.w3.org/2000/svg" width="680" height="522" viewBox="0 0 680 522" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The target and the board move in one lock hold</title>
  <desc>Swimlane. Outside the lock the Airlock prepares the target's directory; in one lock hold it checks the Acceptance, runs git merge --ff-only and writes the board. A crash between the fast-forward and the board write is found as already-landed.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="520" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The target and the board move in one lock hold</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the git write runs under the lock, which allocation never does</text>
  <text x="151" y="96" font-size="12" fill="#444441" text-anchor="middle">Airlock</text>
  <text x="365" y="96" font-size="12" fill="#444441" text-anchor="middle">git</text>
  <text x="552" y="96" font-size="12" fill="#444441" text-anchor="middle">Board</text>

  <rect x="40" y="176" width="600" height="250" rx="8" fill="#F1EFE8" fill-opacity="0.6" stroke="none"/>
  <text x="48" y="190" font-size="11" fill="#73726c">lock held</text>

  <rect x="56" y="104" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="128" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Prepare</text>
  <text x="151" y="146" font-size="12" fill="#185FA5" text-anchor="middle">merged commit, target directory</text>
  <rect x="280" y="104" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="365" y="128" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">HEAD, worktree</text>
  <text x="365" y="146" font-size="12" fill="#5F5E5A" text-anchor="middle">a group's created if missing</text>
  <path d="M248,132 L278,132" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M151,160 L151,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="56" y="198" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="222" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Acceptance</text>
  <text x="151" y="240" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticketRefusalOf</text>
  <rect x="470" y="198" width="164" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="552" y="222" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket</text>
  <text x="552" y="240" font-size="12" fill="#5F5E5A" text-anchor="middle">its Acceptance section</text>
  <path d="M468,226 L248,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <path d="M151,254 L151,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="56" y="272" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="296" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Compare and swap</text>
  <text x="151" y="314" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">landOnTarget</text>
  <rect x="280" y="272" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="365" y="296" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">merge --ff-only</text>
  <text x="365" y="314" font-size="12" fill="#5F5E5A" text-anchor="middle">the target moves</text>
  <path d="M248,300 L278,300" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="168" y="336" width="344" height="24" rx="5" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="340" y="353" font-size="12" fill="#791F1F" text-anchor="middle">crash here: the next run finds already-landed</text>

  <path d="M151,328 L151,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="56" y="368" width="190" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="398" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">landOnTheBoard</text>
  <rect x="470" y="368" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="552" y="389" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket, log, job</text>
  <text x="552" y="406" font-size="12" fill="#5F5E5A" text-anchor="middle">the landing is recorded</text>
  <path d="M248,393 L468,393" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M151,418 L151,444" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="56" y="446" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="151" y="470" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Clean up</text>
  <text x="151" y="488" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cleanUpAfterLanding</text>
  <rect x="280" y="446" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="365" y="470" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Worktree, branch</text>
  <text x="365" y="488" font-size="12" fill="#5F5E5A" text-anchor="middle">refresh or release only</text>
  <path d="M248,474 L278,474" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
