<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A release ticket is built on the group but lands on main</title>
  <desc>Grid of three tickets by three questions. Ungrouped tickets use main for all three and group tickets the group branch; a release ticket forks from the group and its record names the group, but its Airlock is main's.</desc>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A release ticket is built on the group but lands on main</text>
  <text x="40" y="68" font-size="13" fill="#73726c">two functions answer "which target?", and only the release row tells them apart</text>

  <g font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="middle">
    <text x="240" y="106">forks from</text>
    <text x="400" y="106">merge-queued names</text>
    <text x="560" y="106">Airlock</text>
  </g>
  <g font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="240" y="124">Playbook.targetOf</text>
    <text x="400" y="124">Playbook.targetOf</text>
    <text x="560" y="124">Airlocks.targetOf</text>
  </g>

  <g font-size="14" font-weight="500" fill="#3d3d3a">
    <text x="40" y="168">Ungrouped ticket</text>
    <text x="40" y="228">Group ticket</text>
    <text x="40" y="288">Release ticket</text>
  </g>

  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="170" y="138" width="140" height="50" rx="8"/>
    <rect x="330" y="138" width="140" height="50" rx="8"/>
    <rect x="490" y="138" width="140" height="50" rx="8"/>
    <rect x="170" y="198" width="140" height="50" rx="8"/>
    <rect x="330" y="198" width="140" height="50" rx="8"/>
    <rect x="490" y="198" width="140" height="50" rx="8"/>
    <rect x="170" y="258" width="140" height="50" rx="8"/>
    <rect x="330" y="258" width="140" height="50" rx="8"/>
  </g>
  <rect x="490" y="258" width="140" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>

  <g font-size="13" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="240" y="168">main</text>
    <text x="400" y="168">main</text>
    <text x="560" y="168">main</text>
    <text x="240" y="228">group-editing</text>
    <text x="400" y="228">group-editing</text>
    <text x="560" y="228">group-editing</text>
    <text x="240" y="288">group-editing</text>
    <text x="400" y="288">group-editing</text>
  </g>
  <text x="560" y="288" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
</svg>
