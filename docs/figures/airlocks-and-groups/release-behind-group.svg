<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A release branch must hold the group's tip</title>
  <desc>Git graph. The release branch forks from the group, and #008 lands on the group afterwards. The ancestry check finds the group's tip missing from the release branch's tip, so the merge is refused release-behind-group before merge-in.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A release branch must hold the group's tip</text>
  <text x="40" y="68" font-size="13" fill="#73726c">checked once, before merge-in; a later landing on the group fails it</text>
  <text x="40" y="134" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">group-editing</text>
  <text x="40" y="234" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-009</text>
  <path d="M170,130 L330,130" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M240,130 L300,230" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,230 L380,230" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="170" cy="130" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="240" cy="130" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="340" cy="130" r="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <circle cx="390" cy="230" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="240" y="112" font-size="11" fill="#73726c" text-anchor="middle">#007 lands</text>
  <text x="296" y="112" font-size="11" fill="#73726c">#008 lands after the fork: the group's tip</text>
  <text x="286" y="246" font-size="11" fill="#73726c" text-anchor="end">forks here</text>
  <text x="390" y="256" font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">branchTip</text>
  <path d="M352,130 L554,130 L554,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="562" y="165" font-size="11" fill="#73726c">reads</text>
  <path d="M400,230 L466,230" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="468" y="196" width="172" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="554" y="226.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">releaseGapOf</text>
  <text x="554" y="244.0" font-size="11" fill="#185FA5" text-anchor="middle">tip an ancestor of branchTip?</text>
  <path d="M554,264 L554,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="562" y="277" font-size="11" fill="#73726c">no</text>
  <rect x="468" y="284" width="172" height="28" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="554" y="303.0" font-size="12" fill="#791F1F" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">release-behind-group</text>
</svg>
