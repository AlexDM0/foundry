<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three phases land a merge; the Airlock agent is a detour</title>
  <desc>State diagram of seven phases. The normal path is merge-in, gating, landing, landed; a conflict detours through resolving, a large resolution through re-reviewing, and a red gate through fixing. The same Airlock agent works the resolving and fixing detours; a conflict re-reviewer works re-reviewing. Incident waits sit inside gating, and a red tree with its resumes spent parks the ticket. A constitution commit runs committing, then landing.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="614" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Three phases land a merge; the Airlock agent is a detour</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Blue: the Airlock acts. Coral: the Airlock agent acts. Amber: an incident waits inside its phase.</text>
  <path d="M250,120 L418,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="334" y="113" font-size="11" fill="#73726c" text-anchor="middle">conflict</text>
  <path d="M90,148 L90,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="98" y="170" font-size="11" fill="#73726c">clean merge</text>
  <path d="M470,148 L470,200 L252,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="193" font-size="11" fill="#73726c" text-anchor="middle">resolved, the resolution sound</text>
  <path d="M570,148 L570,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="578" y="188" font-size="11" fill="#73726c">large</text>
  <text x="578" y="201" font-size="11" fill="#73726c">resolution</text>
  <path d="M420,250 L252,250" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="243" font-size="11" fill="#73726c" text-anchor="middle">the claims hold</text>
  <path d="M420,474 L252,474" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="467" font-size="11" fill="#73726c" text-anchor="middle">committed</text>
  <path d="M250,336 L418,336" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="329" font-size="11" fill="#73726c" text-anchor="middle">red, resumes left: red handoff</text>
  <path d="M420,360 L252,360" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="353" font-size="11" fill="#73726c" text-anchor="middle">resolved, gate again</text>
  <path d="M90,410 L90,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="82" y="432" font-size="11" fill="#73726c" text-anchor="end">gate passed</text>
  <path d="M90,502 L90,534" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="98" y="522" font-size="11" fill="#73726c">target tip unchanged</text>
  <path d="M200,410 L200,418" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="200" cy="424" r="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="212" y="428" font-size="11" fill="#73726c">red, resumes spent: parks merge-gate-red</text>
  <rect x="40" y="92" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="116.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merge-in</text>
  <text x="145" y="134.0" font-size="12" fill="#185FA5" text-anchor="middle">merge the recorded tip</text>
  <rect x="40" y="186" width="210" height="224" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="145" y="246" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <text x="145" y="264" font-size="12" fill="#185FA5" text-anchor="middle">gate the merged tree</text>
  <rect x="52" y="304" width="186" height="76" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="145" y="330.0" font-size="12" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">gate-cannot-run,</text>
  <text x="145" y="348.0" font-size="12" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">setup-failed</text>
  <text x="145" y="366.0" font-size="12" fill="#854F0B" text-anchor="middle">default gate-retry</text>
  <rect x="40" y="446" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="470.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">landing</text>
  <text x="145" y="488.0" font-size="12" fill="#185FA5" text-anchor="middle">compare and swap</text>
  <rect x="40" y="536" width="210" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="145" y="560.0" font-size="14" fill="#27500A" text-anchor="middle" font-weight="500">Landed</text>
  <text x="145" y="578.0" font-size="12" fill="#3B6D11" text-anchor="middle">or integrated, or refreshed</text>
  <rect x="420" y="92" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="520" y="116.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">resolving</text>
  <text x="520" y="134.0" font-size="12" fill="#993C1D" text-anchor="middle">the Airlock agent resolves</text>
  <rect x="420" y="318" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="520" y="342.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">fixing</text>
  <text x="520" y="360.0" font-size="12" fill="#993C1D" text-anchor="middle">the Airlock agent fixes</text>
  <rect x="420" y="222" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="520" y="246.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">re-reviewing</text>
  <text x="520" y="264.0" font-size="12" fill="#993C1D" text-anchor="middle">a conflict re-reviewer judges</text>
  <rect x="420" y="446" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520" y="470.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">committing</text>
  <text x="520" y="488.0" font-size="12" fill="#185FA5" text-anchor="middle">a constitution commit only</text>
</svg>
