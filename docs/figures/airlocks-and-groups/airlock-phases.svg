<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three phases land a merge; agents and incidents are detours</title>
  <desc>State diagram of six phases. The normal path is merge-in, gating, landing, landed; a conflict detours through resolving and, over the threshold, reviewing-resolution, and a red gate through fixing. Incident waits sit inside gating and reviewing-resolution, and merge-abort leaves the Airlock from either.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="614" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Three phases land a merge; agents and incidents are detours</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Blue: the Airlock acts. Coral: a merge agent acts. Amber: an incident waits inside its phase.</text>
  <path d="M250,120 L418,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="334" y="113" font-size="11" fill="#73726c" text-anchor="middle">conflict</text>
  <path d="M90,148 L90,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="98" y="170" font-size="11" fill="#73726c">clean merge</text>
  <path d="M430,148 L430,166 L215,166 L215,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="322" y="160" font-size="11" fill="#73726c" text-anchor="middle">small resolution</text>
  <path d="M520,148 L520,178" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="528" y="168" font-size="11" fill="#73726c">over threshold</text>
  <path d="M420,212 L252,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="205" font-size="11" fill="#73726c" text-anchor="middle">claims hold</text>
  <path d="M250,336 L418,336" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="329" font-size="11" fill="#73726c" text-anchor="middle">red, fixer waiting: resume</text>
  <path d="M420,360 L252,360" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="353" font-size="11" fill="#73726c" text-anchor="middle">fix reported, gate again</text>
  <path d="M238,392 L470,392 L470,376" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="386" font-size="11" fill="#73726c" text-anchor="middle">merge-fixer</text>
  <path d="M90,410 L90,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="82" y="432" font-size="11" fill="#73726c" text-anchor="end">gate passed</text>
  <path d="M608,235 L636,235 L636,474 L252,474" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="444" y="467" font-size="11" fill="#73726c" text-anchor="middle">merge-land, only for a tree a gate passed</text>
  <path d="M90,502 L90,534" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="98" y="522" font-size="11" fill="#73726c">target tip unchanged</text>
  <path d="M200,400 L200,418" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="200" cy="424" r="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="212" y="428" font-size="11" fill="#73726c">merge-abort, the default: parks, then leaves</text>
  <path d="M590,260 L590,286" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="590" cy="292" r="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="580" y="296" font-size="11" fill="#73726c" text-anchor="end">merge-abort: parks, then leaves</text>
  <rect x="40" y="92" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="116.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merge-in</text>
  <text x="145" y="134.0" font-size="12" fill="#185FA5" text-anchor="middle">merge the recorded tip</text>
  <rect x="40" y="186" width="210" height="224" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="145" y="210" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <text x="145" y="228" font-size="12" fill="#185FA5" text-anchor="middle">gate the merged tree</text>
  <rect x="52" y="240" width="186" height="56" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="145" y="264.0" font-size="12" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">gate-cannot-run,</text>
  <text x="145" y="282.0" font-size="12" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">setup-failed</text>
  <rect x="52" y="304" width="186" height="96" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="145" y="337.0" font-size="12" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merge-gate-failed</text>
  <text x="145" y="355.0" font-size="12" fill="#854F0B" text-anchor="middle">red, no fixer</text>
  <text x="145" y="371.0" font-size="12" fill="#854F0B" text-anchor="middle">launched yet</text>
  <rect x="40" y="446" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="470.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">landing</text>
  <text x="145" y="488.0" font-size="12" fill="#185FA5" text-anchor="middle">compare and swap</text>
  <rect x="40" y="536" width="210" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="145" y="560.0" font-size="14" fill="#27500A" text-anchor="middle" font-weight="500">Landed</text>
  <text x="145" y="578.0" font-size="12" fill="#3B6D11" text-anchor="middle">or integrated, or refreshed</text>
  <rect x="420" y="92" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="520" y="116.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">resolving</text>
  <text x="520" y="134.0" font-size="12" fill="#993C1D" text-anchor="middle">resolver works</text>
  <rect x="420" y="180" width="200" height="90" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="520" y="200" font-size="13" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewing-resolution</text>
  <rect x="432" y="210" width="176" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="520" y="231.0" font-size="11" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">resolution-over-threshold</text>
  <text x="520" y="249.0" font-size="12" fill="#854F0B" text-anchor="middle">default merge-review</text>
  <rect x="420" y="318" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="520" y="342.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">fixing</text>
  <text x="520" y="360.0" font-size="12" fill="#993C1D" text-anchor="middle">merge-fix works</text>
</svg>
