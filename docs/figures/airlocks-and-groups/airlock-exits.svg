<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every Airlock run ends in a landing, a requeue or a question to a person</title>
  <desc>Grid of phases by exit, each cell naming the job's cause. Refused opens a merge-refused decision from every phase; parked opens a parked decision from gating and landing. Only landing holds the target or the ticket.</desc>
  <rect x="1" y="1" width="998" height="562" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every Airlock run ends in a landing, a requeue or a question to a person</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Monospace words are the job's cause. Gray keeps the ticket queued. Amber stops for a person: the ticket or, when held, the whole target.</text>

  <g font-size="14" font-weight="500" fill="#3d3d3a">
    <text x="190" y="100">Requeued</text>
    <text x="360" y="100">Refused</text>
    <text x="580" y="100">Parked</text>
    <text x="820" y="100">Held</text>
  </g>
  <g font-size="13" fill="#73726c">
    <text x="190" y="118">ticket stays queued</text>
    <text x="360" y="118">merge-refused decision</text>
    <text x="580" y="118">parked decision</text>
    <text x="820" y="118">waits on a person</text>
  </g>

  <g font-size="14" font-weight="500" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">
    <rect x="40" y="130" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="163">merge-in</text>
    <rect x="40" y="194" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="245">resolving</text>
    <rect x="40" y="294" width="140" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="319">gating</text>
    <rect x="40" y="342" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="375">fixing</text>
    <rect x="40" y="406" width="140" height="94" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="458">landing</text>
  </g>

  <g fill="#F1EFE8" stroke="#E1DDD0">
    <rect x="190" y="130" width="160" height="56" rx="6"/>
    <rect x="190" y="194" width="160" height="92" rx="6"/>
    <rect x="190" y="342" width="160" height="56" rx="6"/>
    <rect x="190" y="406" width="160" height="94" rx="6"/>
  </g>
  <g font-size="13" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="202" y="163">orphaned</text>
    <text x="202" y="245">orphaned</text>
    <text x="202" y="375">orphaned</text>
    <text x="202" y="431">target-moved</text>
    <text x="202" y="455">target-moved-by-…</text>
  </g>

  <g fill="#FAEEDA" stroke="#F2DDB0">
    <rect x="360" y="130" width="210" height="56" rx="6"/>
    <rect x="360" y="194" width="210" height="92" rx="6"/>
    <rect x="360" y="294" width="210" height="40" rx="6"/>
    <rect x="360" y="342" width="210" height="56" rx="6"/>
    <rect x="360" y="406" width="210" height="94" rx="6"/>
    <rect x="580" y="294" width="230" height="40" rx="6"/>
    <rect x="580" y="406" width="230" height="94" rx="6"/>
    <rect x="820" y="406" width="140" height="94" rx="6"/>
  </g>
  <g font-size="13" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="372" y="153">git-failed</text>
    <text x="372" y="173">release-behind-group</text>
    <text x="372" y="215">out-of-calls</text>
    <text x="372" y="233">cannot-resolve</text>
    <text x="372" y="251">no-report</text>
    <text x="372" y="269">merge-unresolved</text>
    <text x="372" y="319">git-failed</text>
    <text x="372" y="365">out-of-calls, no-report</text>
    <text x="372" y="385">cannot-resolve</text>
    <text x="372" y="448">git-failed</text>
    <text x="592" y="319">merge-gate-red</text>
    <text x="592" y="441">target-moved</text>
  </g>
  <text x="592" y="461" font-size="13" fill="#854F0B">after repeated moves</text>
  <text x="212" y="473" font-size="13" fill="#5F5E5A" transform="translate(-10,0)">a recorded landing</text>
  <text x="372" y="468" font-size="13" fill="#854F0B">before the lock hold</text>
  <text x="832" y="428" font-size="13" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">target-held</text>
  <text x="832" y="444" font-size="13" fill="#854F0B">the target waits</text>
  <text x="832" y="468" font-size="13" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">acceptance-*</text>
  <text x="832" y="484" font-size="13" fill="#854F0B">the ticket waits</text>
  <text x="40" y="526" font-size="13" fill="#73726c">In any phase, a parked ticket with no open incident ends the job <tspan font-family="ui-monospace,Menlo,Consolas,monospace">stopped</tspan>, cause <tspan font-family="ui-monospace,Menlo,Consolas,monospace">merge-aborted</tspan>.</text>
  <text x="40" y="546" font-size="13" fill="#73726c">On a refresh, a red merged tree with its resumes spent is refused instead of parked.</text>
</svg>
