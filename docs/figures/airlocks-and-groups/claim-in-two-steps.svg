<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The queue is predicted outside the lock and re-derived inside it</title>
  <desc>Swimlane. A first lock hold reads the candidates, git merge-tree predicts and orders them outside the lock, and a second hold rechecks both tips and claimAirlock. A moved tip or a refusal claims nothing and the next round derives again; otherwise a merge job holds the Airlock.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The queue is predicted outside the lock and re-derived inside it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the prediction takes no lock; the second hold rechecks the tips and the queue</text>
  <text x="181.0" y="96" font-size="12" fill="#444441" text-anchor="middle">Airlock</text>
  <text x="507.0" y="96" font-size="12" fill="#444441" text-anchor="middle">Reads and results</text>
  <rect x="40" y="100" width="600" height="80" rx="8" fill="#F1EFE8" fill-opacity="0.6" stroke="none"/>
  <text x="48" y="113" font-size="11" fill="#73726c" text-anchor="start">lock held</text>
  <rect x="40" y="282" width="600" height="168" rx="8" fill="#F1EFE8" fill-opacity="0.6" stroke="none"/>
  <text x="48" y="295" font-size="11" fill="#73726c" text-anchor="start">lock held</text>
  <rect x="56" y="120" width="250" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="181.0" y="141.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read the candidates</text>
  <text x="181.0" y="159.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mergeCandidatesOf</text>
  <rect x="390" y="120" width="234" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="507.0" y="141.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <text x="507.0" y="159.0" font-size="12" fill="#5F5E5A" text-anchor="middle">rows, tickets, log</text>
  <path d="M388,145 L308,145" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="56" y="198" width="250" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="181.0" y="230.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Predict and order</text>
  <text x="181.0" y="248.0" font-size="12" fill="#185FA5" text-anchor="middle">outside the lock</text>
  <rect x="390" y="212" width="234" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="507.0" y="233.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">git</text>
  <text x="507.0" y="251.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">merge-tree --write-tree</text>
  <path d="M388,237 L308,237" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M181.0,170 L181.0,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M181.0,270 L181.0,298" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="56" y="300" width="250" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="181.0" y="321.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Tips unchanged?</text>
  <text x="181.0" y="339.0" font-size="12" fill="#185FA5" text-anchor="middle">branch and target</text>
  <path d="M181.0,350 L181.0,376" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="189.0" y="367" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <rect x="56" y="378" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="181.0" y="402.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">claimAirlock</text>
  <text x="181.0" y="420.0" font-size="12" fill="#185FA5" text-anchor="middle">re-derives the queue</text>
  <rect x="390" y="300" width="234" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="507.0" y="321.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Next round</text>
  <text x="507.0" y="339.0" font-size="12" fill="#5F5E5A" text-anchor="middle">nothing claimed</text>
  <rect x="390" y="380" width="234" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="507.0" y="404.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Merge job holds the Airlock</text>
  <text x="507.0" y="422.0" font-size="12" fill="#3B6D11" text-anchor="middle">phase merge-in</text>
  <path d="M306,318 L388,318" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="348" y="311" font-size="11" fill="#73726c" text-anchor="middle">moved</text>
  <path d="M306,418 L388,418" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M306,390 L340,390 L340,338 L388,338" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="346" y="368" font-size="11" fill="#73726c" text-anchor="start">refused</text>
  <text x="348" y="411" font-size="11" fill="#73726c" text-anchor="middle">claimed</text>
</svg>
