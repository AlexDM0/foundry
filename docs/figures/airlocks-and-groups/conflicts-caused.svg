<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The branch that blocks the fewest others goes first</title>
  <desc>Four clean tickets with red lines between the pairs predicted to conflict. #007 conflicts with none, #003 and #006 with one each, #004 with two, so #007 goes first and #004 last. The tie between #003 and #006 falls to readiness.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">The branch that blocks the fewest others goes first</text>
  <text x="40" y="68" font-size="13" fill="#73726c">among clean candidates of equal priority, predicted pairwise between ticket branches</text>
  <path d="M170,130 L238,130" fill="none" stroke="#A32D2D" stroke-width="1.6"/>
  <path d="M290,158 L290,232" fill="none" stroke="#A32D2D" stroke-width="1.6"/>
  <text x="204" y="122" font-size="11" fill="#A32D2D" text-anchor="middle">conflict</text>
  <text x="298" y="198" font-size="11" fill="#A32D2D">conflict</text>
  <rect x="68" y="102" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="120" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#003</text>
  <text x="120" y="144.0" font-size="12" fill="#5F5E5A" text-anchor="middle">causes 1</text>
  <rect x="238" y="102" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="290" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#004</text>
  <text x="290" y="144.0" font-size="12" fill="#5F5E5A" text-anchor="middle">causes 2</text>
  <rect x="238" y="232" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="290" y="256.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#006</text>
  <text x="290" y="274.0" font-size="12" fill="#5F5E5A" text-anchor="middle">causes 1</text>
  <rect x="68" y="232" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="120" y="256.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">#007</text>
  <text x="120" y="274.0" font-size="12" fill="#5F5E5A" text-anchor="middle">causes 0</text>
  <path d="M370,195 L412,195" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="424" y="100" font-size="12" fill="#444441" font-weight="500">Order</text>
  <rect x="424" y="112" width="216" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="438" y="136" font-size="13" fill="#0C447C" font-weight="500">1. #007</text>
  <text x="504" y="136" font-size="12" fill="#185FA5">no conflict caused</text>
  <rect x="424" y="158" width="216" height="38" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="438" y="182" font-size="13" fill="#444441" font-weight="500">2. #003</text>
  <text x="504" y="182" font-size="12" fill="#5F5E5A">one, tie: readiness</text>
  <rect x="424" y="204" width="216" height="38" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="438" y="228" font-size="13" fill="#444441" font-weight="500">3. #006</text>
  <text x="504" y="228" font-size="12" fill="#5F5E5A">one, tie: readiness</text>
  <rect x="424" y="250" width="216" height="38" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="438" y="274" font-size="13" fill="#444441" font-weight="500">4. #004</text>
  <text x="504" y="274" font-size="12" fill="#5F5E5A">two, lands last</text>
</svg>
