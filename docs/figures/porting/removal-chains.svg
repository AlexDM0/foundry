<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Most residue lifts out alone; four pieces pull others with them</title>
  <desc>Four pieces of residue pull others with them. ORIGINAL_PRODUCT_NAMES has three independent readers, one arrow each: the older-program-present refusal, the preload with its two-program specs, and the cutover smoke. removeManagedBlock takes the markers, the committed-block notice and the Playbook launch refusal, which is live code. holdFirstRunLeftovers takes FIRST_RUN_REVIEW_HOLD, the readyFindings and Bridge branches, and the stored key overseerFirstStartedAt. Board.claimTickets takes TicketClaims.ts and OverseerTicketMoves.ts, which 18 tracked files use. Everything else lifts out alone.</desc>
