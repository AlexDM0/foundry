<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only the side-by-side build refuses, beside the released program</title>
  <desc>A two by two grid of program against repository. The released program installs in both repositories and is never refused. The side-by-side build installs in a repository without the released data folder and refuses older-program-present in one that holds it. Below the grid, a strip says each name set keeps its own data folder, worktrees folder, monitor folder and first TCP port.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="398" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Only the side-by-side build refuses, beside the released program</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">What init and update do, by program and by repository</text>
  <text x="342" y="104" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Released program</text>
  <text x="342" y="122" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-progress</text>
  <text x="547" y="104" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Side-by-side build</text>
  <text x="547" y="122" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">forge</text>
  <rect x="40" y="136" width="200" height="76" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="140.0" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Holds the released folder</text>
  <text x="140.0" y="188" font-size="13" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.agent-progress</text>
  <rect x="40" y="222" width="200" height="76" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="140.0" y="256" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Does not hold it</text>
  <text x="140.0" y="274" font-size="13" fill="#5F5E5A" text-anchor="middle">any other repository</text>
  <rect x="250" y="136" width="185" height="76" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="342.5" y="170" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Installs</text>
  <text x="342.5" y="188" font-size="13" fill="#3B6D11" text-anchor="middle">never refused</text>
  <rect x="455" y="136" width="185" height="76" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="547.5" y="170" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused</text>
  <text x="547.5" y="188" font-size="13" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">older-program-present</text>
  <rect x="250" y="222" width="185" height="76" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="342.5" y="265" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Installs</text>
  <rect x="455" y="222" width="185" height="76" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="547.5" y="265" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Installs</text>
  <rect x="40" y="316" width="600" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="342" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Each set keeps its own</text>
  <text x="340.0" y="362" font-size="13" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">DATA_FOLDER, WORKTREES_FOLDER, MONITOR_FOLDER, OVERSEER_PORT_FIRST</text>
</svg>
