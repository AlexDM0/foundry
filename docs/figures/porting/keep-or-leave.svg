<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The core travels, parameters take a value, history stays behind</title>
  <desc>Three unequal blocks. Core travels minus the residue on the right: the tracker model, Overseer, lifecycle, control, Watcher, stored format adapters, the Bridge and the building blocks, and LegacyWatcherReader and RETIRED_NAMES stay despite their names. Parameter travels with a changed value or name: the name set, the vendor adapter, prompts and skills, the install and frozen tables, which are retaken, and the live budgets. Coexistence and history stays behind in three groups: code beside the released program, its install on a board, and its stored words.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="644" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">The core travels, parameters take a value, history stays behind</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Each column sorts code by what a port does with it. The right column names items inside the folders on the left</text>
  <text x="40" y="104" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Core</text>
  <text x="40" y="123" font-size="13" fill="#185FA5" text-anchor="start">Travels, minus the residue on the right</text>
  <rect x="40" y="136" width="300" height="402" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="58" y="162" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Board and Playbook</text>
  <text x="58" y="180" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/lib/tracker-model/</text>
  <text x="58" y="209" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Overseer and Pass</text>
  <text x="58" y="227" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/services/overseer/</text>
  <text x="58" y="256" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Customs and gates</text>
  <text x="58" y="274" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/services/lifecycle/</text>
  <text x="58" y="303" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Control and Hatch</text>
  <text x="58" y="321" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/services/control/</text>
  <text x="58" y="350" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Watcher and protocol</text>
  <text x="58" y="368" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/lib/watcher/</text>
  <text x="58" y="397" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Stored format adapters</text>
  <text x="58" y="415" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/adapters/</text>
  <text x="58" y="444" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">The Bridge</text>
  <text x="58" y="462" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">bridge/</text>
  <text x="58" y="491" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Building blocks</text>
  <text x="58" y="509" font-size="13" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">src/lib/</text>
  <rect x="40" y="552" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190.0" y="573" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Stays, despite the name</text>
  <text x="190.0" y="592" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">LegacyWatcherReader</text>
  <text x="190.0" y="611" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">RETIRED_NAMES</text>
  <text x="360" y="104" font-size="14" font-weight="500" fill="#633806" text-anchor="start">Parameter</text>
  <text x="360" y="123" font-size="13" fill="#854F0B" text-anchor="start">Travels, value or name changes</text>
  <rect x="360" y="136" width="280" height="88" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="166" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Name set</text>
  <text x="500.0" y="185" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">PRODUCT_NAMES</text>
  <text x="500.0" y="204" font-size="13" fill="#854F0B" text-anchor="middle">plus the hand list</text>
  <rect x="360" y="235" width="280" height="88" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="265" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Vendor adapter</text>
  <text x="500.0" y="284" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">AgentAdapter</text>
  <text x="500.0" y="303" font-size="13" fill="#854F0B" text-anchor="middle">and what knows Claude</text>
  <rect x="360" y="334" width="280" height="66" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="362" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Prompts and skills</text>
  <text x="500.0" y="382" font-size="13" fill="#854F0B" text-anchor="middle">name Claude and its tools</text>
  <rect x="360" y="411" width="280" height="88" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="441" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Install and frozen tables</text>
  <text x="500.0" y="460" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cli/**/Frozen*.json</text>
  <text x="500.0" y="479" font-size="13" fill="#854F0B" text-anchor="middle">retaken, not dropped</text>
  <rect x="360" y="510" width="280" height="88" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="540" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Live budgets</text>
  <text x="500.0" y="559" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">DISPATCH_PROTOCOL</text>
  <text x="500.0" y="578" font-size="13" fill="#854F0B" text-anchor="middle">renamed, with dispatch names</text>
  <text x="660" y="104" font-size="14" font-weight="500" fill="#444441" text-anchor="start">Coexistence and history</text>
  <text x="660" y="123" font-size="13" fill="#5F5E5A" text-anchor="start">Stays behind</text>
  <rect x="660" y="136" width="300" height="140" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="810.0" y="182" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Beside the released program</text>
  <text x="810.0" y="202" font-size="13" fill="#5F5E5A" text-anchor="middle">released names, refusal</text>
  <text x="810.0" y="220" font-size="13" fill="#5F5E5A" text-anchor="middle">preload, two-program specs</text>
  <text x="810.0" y="240" font-size="13" fill="#5F5E5A" text-anchor="middle">cutover smoke</text>
  <rect x="660" y="289" width="300" height="140" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="810.0" y="336" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Its install on a board</text>
  <text x="810.0" y="354" font-size="13" fill="#5F5E5A" text-anchor="middle">retired install, dead brief paths</text>
  <text x="810.0" y="374" font-size="13" fill="#5F5E5A" text-anchor="middle">managed block removal</text>
  <text x="810.0" y="392" font-size="13" fill="#5F5E5A" text-anchor="middle">first-run hold, retired skills</text>
  <rect x="660" y="442" width="300" height="140" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="810.0" y="488" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Its stored words</text>
  <text x="810.0" y="508" font-size="13" fill="#5F5E5A" text-anchor="middle">retired log kinds</text>
  <text x="810.0" y="526" font-size="13" fill="#5F5E5A" text-anchor="middle">change and feature ticket types</text>
  <text x="810.0" y="546" font-size="13" fill="#5F5E5A" text-anchor="middle">retired browser values</text>
</svg>
