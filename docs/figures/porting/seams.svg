  <rect x="810" y="461" width="150" height="88" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="885.0" y="491" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">OS tools and Bun</text>
