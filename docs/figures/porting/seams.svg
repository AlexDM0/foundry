<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624" viewBox="0 0 1000 624" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Six seams carry most of what a port replaces</title>
  <desc>The core sits in the middle: Board, Playbook, Pass, Customs, Airlocks. Each seam is a piece of code between the core and something outside it. Left: PRODUCT_NAMES spells folders, skills, variables and the TCP port; MONITOR_FOLDER, one of its keys, stores the registry, Watcher sockets and gate slots; agent-dashboard reads the HTTP summary and frames the Bridge, and reads the registry in the monitor folder. Right: AgentAdapter spawns Claude Code; GitProcess.run spawns the git binary; the platform ports choose one adapter per OS, which calls the tools of macOS, Linux or Windows, on Bun. Two edges bypass the seams: other core files know Claude directly, and Bun is used everywhere. A vendor or platform port also reaches past its seam.</desc>
