  <rect x="760" y="222" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="249" font-size="13" fill="#5F5E5A" text-anchor="middle">Row marker in one refusal</text>
