  <text x="607.0" y="211" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">setup.ts, cli/setup/</text>
  <rect x="494" y="242" width="226" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="607.0" y="273" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">FrozenClaudeInstall.json</text>
  <rect x="494" y="304" width="226" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="607.0" y="335" font-size="13" fill="#854F0B" text-anchor="middle">Four specs naming it</text>
  <rect x="494" y="366" width="226" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="607.0" y="397" font-size="13" fill="#854F0B" text-anchor="middle">README, docs, demo scripts</text>
