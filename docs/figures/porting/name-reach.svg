  <rect x="760" y="378" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="405" font-size="13" fill="#5F5E5A" text-anchor="middle">Entry file name</text>
</svg>
