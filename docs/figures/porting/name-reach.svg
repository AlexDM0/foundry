<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One assignment renames the code; the rest needs a hand or stays literal</title>
  <desc>One assignment, PRODUCT_NAMES, is on the left. The first column derives with no edit: commands, hooks and markers, three folders, two skills, environment variables, browser keys and the port. The second column needs a hand edit because it cannot import the constant or spells the name: package.json, setup.ts and cli/setup/, the frozen install table, four specs and the prose. The third column stays literal, by contract or as residue: the dashboard server record, the theme and escape message types, the row marker, retired file names, retired skill names and the entry file name.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="440" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">One assignment renames the code; the rest needs a hand or stays literal</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">What a changed name set reaches, sorted by who changes it</text>
  <rect x="40" y="220" width="170" height="96" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="125.0" y="264" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">PRODUCT_NAMES</text>
  <text x="125.0" y="282" font-size="13" fill="#185FA5" text-anchor="middle">one assignment</text>
  <path d="M252,118 L246,118 L246,418 L252,418" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M210,268 L242,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="104" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Derives, no edit</text>
  <rect x="260" y="118" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="360.0" y="149" font-size="13" fill="#185FA5" text-anchor="middle">Commands, hooks, markers</text>
  <rect x="260" y="180" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="360.0" y="211" font-size="13" fill="#185FA5" text-anchor="middle">Three folders</text>
  <rect x="260" y="242" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="360.0" y="273" font-size="13" fill="#185FA5" text-anchor="middle">Two skills</text>
  <rect x="260" y="304" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="360.0" y="335" font-size="13" fill="#185FA5" text-anchor="middle">Environment variables</text>
  <rect x="260" y="366" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="360.0" y="397" font-size="13" fill="#185FA5" text-anchor="middle">Browser keys, Overseer port</text>
  <text x="494" y="104" font-size="14" font-weight="500" fill="#633806" text-anchor="start">Changes by hand</text>
  <rect x="494" y="118" width="226" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="607.0" y="149" font-size="13" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">package.json</text>
