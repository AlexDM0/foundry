<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="304" viewBox="0 0 1000 304" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The adapter covers the middle of an agent&#x27;s life; both ends know Claude directly</title>
  <desc>A horizontal strip of one agent&#x27;s life. Install, session start and confinement know Claude Code directly, through TrackerRefresh.ts, SessionStartHook.ts and WorkerProfiles.ts. Launch and the stream and chat sit behind AgentAdapter. Customs, then transcripts and usage, know Claude Code directly again.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="302" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">The adapter covers the middle of an agent&#x27;s life; both ends know Claude directly</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Blue is behind the AgentAdapter interface. Coral names a file that knows Claude Code</text>
  <rect x="40" y="150" width="148" height="88" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="114.0" y="190" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Install</text>
  <text x="114.0" y="208" font-size="13" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">TrackerRefresh.ts</text>
  <rect x="195" y="150" width="164" height="88" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="277.0" y="190" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Session start</text>
  <text x="277.0" y="208" font-size="13" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">SessionStartHook.ts</text>
  <rect x="366" y="150" width="148" height="88" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="440.0" y="190" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Confine</text>
  <text x="440.0" y="208" font-size="13" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">WorkerProfiles.ts</text>
  <rect x="521" y="150" width="70" height="88" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="556.0" y="199" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Launch</text>
  <rect x="598" y="150" width="78" height="88" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="637.0" y="190" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Stream</text>
  <text x="637.0" y="208" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">and chat</text>
  <rect x="683" y="150" width="96" height="88" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="731.0" y="190" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Customs</text>
  <text x="731.0" y="208" font-size="13" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Customs.ts</text>
  <rect x="786" y="150" width="174" height="88" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="873.0" y="190" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Transcripts, usage</text>
  <text x="873.0" y="208" font-size="13" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ClaudeTranscripts.ts</text>
  <path d="M521,140 L521,130 L676,130 L676,140" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="598" y="120" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">AgentAdapter</text>
  <path d="M40,258 L956,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="280" font-size="13" fill="#73726c" text-anchor="start">An agent&#x27;s life, left to right</text>
</svg>
