<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The product line leaves main at one commit and never returns</title>
  <desc>Git graph. main runs on to the released agent-progress. group-code-lifecycle leaves it at merge base 9a081774 and is 495 commits past it at 70ce56de, then continues. group-docs forks at 70ce56de for documentation only. A dashed arrow runs from the tip of group-code-lifecycle to a new project; nothing returns to main.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="352" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">The product line leaves main at one commit and never returns</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The count is at commit 70ce56de. main keeps moving on its own</text>
  <text x="40" y="108" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
  <text x="40" y="198" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">group-code-lifecycle</text>
  <text x="40" y="288" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">group-docs</text>
  <path d="M230,124 L490,124" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="494" y="96" width="146" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="567.0" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Released program</text>
  <text x="567.0" y="138" font-size="13" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-progress</text>
  <path d="M230,124 C260,174 290,214 320,214 L510,214" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M450,214 C480,264 500,304 530,304 L560,304" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M510,214 L550,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="554" y="186" width="86" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="597.0" y="210" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">New</text>
  <text x="597.0" y="228" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">project</text>
  <circle cx="230" cy="124" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="450" cy="214" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="510" cy="214" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="560" cy="304" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="230" y="108" font-size="13" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">9a081774</text>
  <text x="322" y="206" font-size="13" fill="#73726c" text-anchor="start">495 commits</text>
  <text x="450" y="246" font-size="13" fill="#73726c" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">70ce56de</text>
  <text x="510" y="198" font-size="13" fill="#73726c" text-anchor="middle">continues</text>
  <text x="560" y="334" font-size="13" fill="#73726c" text-anchor="end">documentation only</text>
</svg>
