<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every door ends in the same sentence</title>
  <desc>A terminal command, a Bridge control and a session under a job all reach the same rules. A rule refuses with a wordless code and facts, and one wording util turns that code into one sentence. The sentence goes to standard error at exit 1 or 2, to a 409 answer shown beside the Bridge control, or, for a session, through a Hatch reply that carries the code and is worded by the session's own command.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="398" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every door ends in the same sentence</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The rules hold a code and its facts; only one util holds the words</text>

  <text x="105" y="104" font-size="11" fill="#73726c" text-anchor="middle">who asks</text>
  <text x="238" y="104" font-size="11" fill="#73726c" text-anchor="middle">who refuses</text>
  <text x="416" y="104" font-size="11" fill="#73726c" text-anchor="middle">who words it</text>
  <text x="562" y="104" font-size="11" fill="#73726c" text-anchor="middle">where it lands</text>

  <!-- doors -->
  <rect x="40" y="116" width="130" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="105" y="143" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Terminal</text>
  <text x="105" y="161" font-size="12" fill="#854F0B" text-anchor="middle">a command</text>

  <rect x="40" y="208" width="130" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="105" y="235" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Bridge</text>
  <text x="105" y="253" font-size="12" fill="#854F0B" text-anchor="middle">a control</text>

  <rect x="40" y="300" width="130" height="64" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="105" y="327" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Session</text>
  <text x="105" y="345" font-size="12" fill="#993C1D" text-anchor="middle">under a job, by Hatch</text>

  <!-- rules -->
  <rect x="198" y="116" width="80" height="248" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="238" y="226" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Rules</text>
  <text x="238" y="244" font-size="12" fill="#185FA5" text-anchor="middle">code and</text>
  <text x="238" y="260" font-size="12" fill="#185FA5" text-anchor="middle">facts, no</text>
  <text x="238" y="276" font-size="12" fill="#185FA5" text-anchor="middle">words</text>

  <!-- wording -->
  <rect x="376" y="116" width="80" height="248" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="416" y="226" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Wording</text>
  <text x="416" y="244" font-size="12" fill="#185FA5" text-anchor="middle">one util,</text>
  <text x="416" y="260" font-size="12" fill="#185FA5" text-anchor="middle">one</text>
  <text x="416" y="276" font-size="12" fill="#185FA5" text-anchor="middle">sentence</text>

  <!-- outputs -->
  <rect x="484" y="116" width="156" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="562" y="143" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Standard error</text>
  <text x="562" y="161" font-size="12" fill="#A32D2D" text-anchor="middle">exit 1 or 2</text>

  <rect x="484" y="208" width="156" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="562" y="235" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">HTTP 409</text>
  <text x="562" y="253" font-size="12" fill="#A32D2D" text-anchor="middle">beside the Bridge control</text>

  <rect x="484" y="300" width="156" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="562" y="327" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Standard error</text>
  <text x="562" y="345" font-size="12" fill="#A32D2D" text-anchor="middle">of the session's command</text>

  <!-- arrows -->
  <path d="M170,148 L196,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,240 L196,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,332 L196,332" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M278,148 L374,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M278,240 L374,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M278,332 L374,332" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="327" y="322" font-size="11" fill="#73726c" text-anchor="middle">Hatch reply: code</text>
  <path d="M456,148 L482,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M456,240 L482,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M456,332 L482,332" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
