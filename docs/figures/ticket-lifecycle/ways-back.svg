<svg xmlns="http://www.w3.org/2000/svg" width="680" height="374" viewBox="0 0 680 374" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three ways back, and none of them is a failure</title>
  <desc>A strip of the main path: Build, Customs, Gates, Review, Queue, Airlock, Landed. Three loops return: a red gate or a fixable Customs fault goes back to Build in the same session and job, and a review job does the same with its reviewer; a review that finds an Acceptance item unmet goes back to Build in the same builder session under another job; a moved target goes from the Airlock back to the queue to merge again.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="372" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Three ways back, and none of them is a failure</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">Each loop keeps the work and returns to the nearest step that can put it right.</text>
<rect x="40" y="190" width="64" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="72.0" y="221.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Build</text>
<path d="M105,217 L122,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="127" y="190" width="64" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="159.0" y="221.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
<path d="M192,217 L209,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="214" y="190" width="64" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="246.0" y="221.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Gates</text>
<path d="M279,217 L296,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="301" y="190" width="64" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="333.0" y="221.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Review</text>
<path d="M366,217 L383,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="388" y="190" width="64" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="420.0" y="221.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Queue</text>
<path d="M453,217 L470,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="475" y="190" width="64" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="507.0" y="221.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
<path d="M540,217 L557,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="562" y="190" width="64" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
<text x="594.0" y="221.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Landed</text>
<path d="M127,186 L127,178 L278,178 L278,186" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M202.5,178 C202.5,142 72,142 72,185" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="150" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Red gate or fixable Customs fault</text>
<text x="150" y="118" font-size="12" font-weight="400" fill="#73726c" text-anchor="middle">same session, same job;</text>
<text x="150" y="134" font-size="12" font-weight="400" fill="#73726c" text-anchor="middle">a review job does the same</text>
<path d="M507,190 C507,142 420,142 420,185" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="463" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Target moved</text>
<text x="463" y="118" font-size="12" font-weight="400" fill="#73726c" text-anchor="middle">merged again from the queue</text>
<path d="M333,244 C333,326 72,326 72,249" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="202.5" y="340" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Review finds an Acceptance item unmet</text>
<text x="202.5" y="356" font-size="12" font-weight="400" fill="#73726c" text-anchor="middle">same builder session, another job</text>
</svg>
