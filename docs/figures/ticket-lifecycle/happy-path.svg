<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1052" viewBox="0 0 1000 1052" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>On the normal path, every status after ticket ready is the Overseer's</title>
  <desc>A swimlane of one ticket from ticket ready to merge-landed: User readies it, setting pending, and the Overseer then moves it to in-progress after the build job launches, to in-review after Customs and the gates pass and code writes the Handoff, and through reviewed to delivered in the lock hold where the Airlock fast-forwards main. Builder and reviewer only commit and report, and their lines end at their reports, so no agent exists during the merge. The merge-queue mark changes no status.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="1050" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">On the normal path, every status after ticket ready is the Overseer's</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">Agents commit and report; code moves the ticket. A dark line runs only while that process lives.</text>
<rect x="40" y="84" width="104" height="34" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="92.0" y="106.04" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
