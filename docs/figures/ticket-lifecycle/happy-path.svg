<rect x="122" y="720" width="172" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="208.0" y="740.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Customs, then gates</text>
<text x="208.0" y="757.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">same two steps again</text>
<circle cx="208" cy="790" r="5" fill="none" stroke="#0C447C" stroke-width="1.6"/>
<rect x="216" y="781" width="336" height="18" fill="#FAF9F5"/>
<text x="220" y="794" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">marks the row mergeQueued: status does not change</text>
<path d="M214,832 L663.6,832" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="329" y="812" width="242" height="18" fill="#FAF9F5"/>
