<rect x="272" y="84" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="324.0" y="106.04" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
<path d="M324,326 L324,410" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M318,410 L330,410" fill="none" stroke="#73726c" stroke-width="1.5"/>
