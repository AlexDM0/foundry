<rect x="100" y="149" width="196" height="18" fill="#FAF9F5"/>
<text x="104" y="162" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">ticket ready: writes pending</text>
<rect x="216" y="186" width="266" height="46" rx="6" fill="#FAF9F5" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="349" y="205" font-size="13" font-weight="400" fill="#73726c" text-anchor="middle">a Pass reads it: Playbook picks #003,</text>
<text x="349" y="222" font-size="13" font-weight="400" fill="#73726c" text-anchor="middle">Overseer launches the build job</text>
<circle cx="208" cy="284" r="5" fill="#0C447C"/>
