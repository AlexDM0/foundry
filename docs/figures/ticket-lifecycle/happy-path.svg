<rect x="358" y="390" width="48" height="18" fill="#FAF9F5"/>
<text x="382.0" y="403" font-size="13" font-weight="400" fill="#73726c" text-anchor="middle">report</text>
<path d="M318,410 L216.4,410" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="242" y="390" width="48" height="18" fill="#FAF9F5"/>
<text x="266.0" y="403" font-size="13" font-weight="400" fill="#73726c" text-anchor="middle">events</text>
<rect x="122" y="424" width="172" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="208.0" y="444.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
<text x="208.0" y="461.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">verifies, trusts nothing</text>
<path d="M214,502 L315.6,502" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="245" y="482" width="42" height="18" fill="#FAF9F5"/>
<text x="266.0" y="495" font-size="13" font-weight="400" fill="#73726c" text-anchor="middle">gates</text>
<rect x="332" y="493" width="209" height="18" fill="#FAF9F5"/>
<text x="336" y="506" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">each gate runs under a Watcher</text>
<path d="M318,534 L216.4,534" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="242" y="514" width="48" height="18" fill="#FAF9F5"/>
