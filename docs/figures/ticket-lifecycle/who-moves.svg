<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agents working a ticket cannot write to it</title>
  <desc>Every write to a ticket comes from code or User, or passes the Bouncer. Overseer code writes every status on the normal path, User runs its verbs, and a product owner or the Assistant may ask through the Hatch, where the Bouncer admits the request and the Overseer applies it. Builder and reviewer sessions, in the Airlock too, stop at confinement and Customs with no route to an existing ticket, and may only file a new low finding through the Hatch.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="492" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Agents working a ticket cannot write to it</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">Every write to a ticket comes from code or User, or passes the Bouncer.</text>
<rect x="520" y="92" width="120" height="374" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="580" y="250" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket</text>
<text x="580" y="268" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">status and body</text>
<rect x="40" y="92" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="120" y="121" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer code</text>
<path d="M201,116 L512,116" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="356" y="106" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">every status on the normal path</text>
<rect x="40" y="160" width="160" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="120" y="189" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
<path d="M201,184 L512,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="356" y="174" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">ready, abandon, reopen, status, deliver --by-hand</text>
<rect x="40" y="226" width="160" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="120" y="246" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">product owner</text>
<text x="120" y="264" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">its own draft ticket</text>
<rect x="40" y="290" width="160" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="120" y="310" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Assistant</text>
<text x="120" y="328" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">a move its incident allows</text>
<rect x="266" y="250" width="134" height="66" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="278" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Hatch, Bouncer</text>
<text x="333" y="296" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">Overseer applies it</text>
<path d="M201,251 L259,271" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M201,315 L259,295" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M401,283 L512,283" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="456" y="273" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">if admitted</text>
<rect x="40" y="358" width="160" height="48" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="120" y="378" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">builder, reviewer</text>
<text x="120" y="396" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">in the Airlock too</text>
<path d="M201,370 L333,370 L333,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="343" y="350" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">may file a new low finding</text>
<path d="M201,392 L252,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="271" cy="415" r="13" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.6"/>
<path d="M263,415 L279,415" fill="none" stroke="#A32D2D" stroke-width="2.4"/>
<text x="294" y="411" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start">confinement, Customs</text>
<text x="294" y="427" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">no route to an existing ticket</text>
</svg>
