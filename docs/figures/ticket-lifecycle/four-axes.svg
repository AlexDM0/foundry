<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Four tracks move independently</title>
  <desc>Four parallel tracks for one ticket on one time axis: status, hold, the row mergeQueued mark and jobs. The status stays in-review through a stopped review, a hold, a second review, the merge queue and the merge job. While the ticket is held or queued no job exists, and only the landing moves the status to delivered.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="354" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Four tracks move independently</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">One ticket, one time axis. No status says merging. Shaded: nobody is driving it.</text>
<rect x="316" y="90" width="98" height="214" fill="#F1EFE8" opacity="0.8"/>
<rect x="464" y="90" width="56" height="214" fill="#F1EFE8" opacity="0.8"/>
<text x="365" y="340" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">held</text>
<text x="492" y="340" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">in-review, queued, no job</text>
<text x="40" y="119" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">status</text>
<path d="M108,140 L640,140" fill="none" stroke="#ECE7DC" stroke-width="1"/>
<text x="40" y="173" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">hold</text>
