<text x="40" y="227" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">row mark</text>
<path d="M108,248 L640,248" fill="none" stroke="#ECE7DC" stroke-width="1"/>
<text x="40" y="281" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">jobs</text>
<path d="M108,302 L640,302" fill="none" stroke="#ECE7DC" stroke-width="1"/>
<rect x="109" y="97" width="58" height="34" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
