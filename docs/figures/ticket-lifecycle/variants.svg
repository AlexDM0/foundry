<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each variant is the main path with one part changed</title>
  <desc>Five strips of Build, Review, Queue, Airlock and an ending, the main path ending delivered. The four variants are no review phase, which skips Review; a group ticket, which lands on its group branch and rests on reviewed; a release ticket, built on the group branch, which delivers its whole bundle; and a question to User, which pauses the job in waiting-for-answer until the answer returns it. Each changes one part and keeps the rest.</desc>
