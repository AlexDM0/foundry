<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A handler cannot tell a real process from a spec</title>
  <desc>A real process feeds createProcessContext and a spec&#x27;s scratch folder feeds createCapturedCommandContext. Both produce a CommandContext, the only thing a handler takes. The environment sits outside this seam: handler code reads it through src/shared/Environment.ts.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="318" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A handler cannot tell a real process from a spec</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Two producers, one shape, one reader</text>
  <rect x="40" y="92" width="110" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="95.0" y="123.5" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Real process</text>
  <rect x="40" y="164" width="110" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="95.0" y="187.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Spec</text>
  <text x="95.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">scratch folder</text>
  <rect x="175" y="92" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280.0" y="114.0" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">createProcessContext</text>
  <text x="280.0" y="132.0" font-size="12" fill="#185FA5" text-anchor="middle">reads the real process</text>
  <rect x="175" y="164" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280.0" y="186.0" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">createCapturedCommandContext</text>
  <text x="280.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">captures the output</text>
  <path d="M150,118 L173,118" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M150,190 L173,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="415" y="92" width="110" height="124" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="470.0" y="159.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CommandContext</text>
  <path d="M385,118 L413,118" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,190 L413,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="550" y="122" width="90" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="595.0" y="160.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Handler</text>
  <path d="M525,154 L548,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M595,186 L595,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="587" y="232" font-size="11" fill="#73726c" text-anchor="end">the one thing outside the seam</text>
  <rect x="415" y="248" width="225" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="527.5" y="270.5" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">src/shared/Environment.ts</text>
  <text x="527.5" y="288.5" font-size="12" fill="#5F5E5A" text-anchor="middle">reads the environment</text>
</svg>
