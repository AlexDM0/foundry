<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>update rewrites the installed half and never touches the tracker</title>
  <desc>An adopted repository in two groups. update rewrites the installed group: seven role files, the reference, the session instructions, version.json and the progress.html stub in the data folder, the two skills, the hook entry and the ignore entries. The tracker group of progress.json, the log, tickets and epics is never touched, and CLAUDE.md is never written, only a managed block removed.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="416" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">update rewrites the installed half and never touches the tracker</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">An adopted repository root, by who owns each path</text>
  <rect x="40" y="92" width="260" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="113.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">update</text>
  <text x="170.0" y="131.0" font-size="12" fill="#185FA5" text-anchor="middle">rewrites on every run</text>
  <rect x="430" y="92" width="210" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="535.0" y="113.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md</text>
  <text x="535.0" y="131.0" font-size="12" fill="#5F5E5A" text-anchor="middle">only a managed block removed</text>
  <path d="M300,116 L428,116" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="364" y="109" font-size="11" fill="#73726c" text-anchor="middle">never written</text>
  <path d="M170,140 L170,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="168" width="370" height="232" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="56" y="192" font-size="13" font-weight="500" fill="#444441" text-anchor="start">Installed, rewritten by update</text>
  <text x="56" y="214" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/</text>
  <text x="56" y="232" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  briefs/defaults/</text>
  <text x="394" y="232" font-size="11" fill="#5F5E5A" text-anchor="end">7 role files</text>
  <text x="56" y="250" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  reference.md</text>
  <text x="56" y="268" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  session-instructions.md</text>
  <text x="56" y="286" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  version.json</text>
  <text x="56" y="304" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  progress.html</text>
  <text x="394" y="304" font-size="11" fill="#5F5E5A" text-anchor="end">stub</text>
  <text x="56" y="322" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/skills/forge-po/</text>
  <text x="56" y="340" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/skills/forge-orchestrate/</text>
  <text x="56" y="358" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/settings.local.json</text>
  <text x="394" y="358" font-size="11" fill="#5F5E5A" text-anchor="end">hook</text>
  <text x="56" y="376" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">.gitignore</text>
  <text x="394" y="376" font-size="11" fill="#5F5E5A" text-anchor="end">entries</text>
  <rect x="430" y="168" width="210" height="232" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="446" y="192" font-size="13" font-weight="500" fill="#444441" text-anchor="start">Tracker, never touched</text>
  <text x="446" y="214" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/</text>
  <text x="446" y="232" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  progress.json</text>
  <text x="446" y="250" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  log.jsonl</text>
  <text x="446" y="268" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  tickets/</text>
  <text x="446" y="286" font-size="11" fill="#444441" xml:space="preserve" font-family="ui-monospace,Menlo,Consolas,monospace">  epics/</text>
  <text x="624" y="286" font-size="11" fill="#5F5E5A" text-anchor="end">once an epic exists</text>
  <text x="446" y="322" font-size="12" fill="#5F5E5A" text-anchor="start">update leaves these</text>
  <text x="446" y="340" font-size="12" fill="#5F5E5A" text-anchor="start">byte for byte</text>
</svg>
