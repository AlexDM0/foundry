<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every route through init and update passes one refresh</title>
  <desc>init and update each refuse before writing and compute every text. update goes straight to refreshTrackedRepository; init goes there at once on an existing tracker or an already-exists answer from createTracker, and otherwise creates the tracker first. Every route then writes version.json, and only update goes on to the hand-over.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every route through init and update passes one refresh</text>
  <rect x="40" y="76" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="125.0" y="103.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">init</text>
  <rect x="470" y="76" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="103.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">update</text>
  <path d="M125,120 L125,142" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M555,120 L555,142" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="144" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="125.0" y="169.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Refuse before writing</text>
  <text x="125.0" y="187.0" font-size="12" fill="#185FA5" text-anchor="middle">then compute every text</text>
  <rect x="470" y="144" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="169.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Refuse before writing</text>
  <text x="555.0" y="187.0" font-size="12" fill="#185FA5" text-anchor="middle">then compute every text</text>
  <path d="M125,200 L125,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="224" width="170" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="125.0" y="256.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Tracker exists?</text>
  <path d="M125,276 L125,298" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="135" y="292" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="300" width="170" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="125.0" y="323.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">createTracker</text>
  <text x="125.0" y="341.0" font-size="12" fill="#185FA5" text-anchor="middle">under the lock</text>
  <path d="M210,250 L320,250 L320,418" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="255" y="244" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M210,326 L320,326" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="265" y="320" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">already-exists</text>
  <path d="M125,352 L125,418" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="135" y="378" font-size="11" fill="#73726c" text-anchor="start">created</text>
  <rect x="40" y="420" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125.0" y="451.5" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Registry, page stub</text>
  <path d="M555,200 L555,446 L442,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="240" y="420" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="442.5" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">refreshTrackedRepository</text>
  <text x="340.0" y="460.5" font-size="12" fill="#185FA5" text-anchor="middle">the one refresh</text>
  <path d="M210,446 L238,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,472 L340,490" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="240" y="492" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="513.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">version.json</text>
  <text x="340.0" y="531.0" font-size="12" fill="#5F5E5A" text-anchor="middle">last file written</text>
  <path d="M440,516 L468,516" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="470" y="492" width="170" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="513.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Hand-over</text>
  <text x="555.0" y="531.5" font-size="12" fill="#185FA5" text-anchor="middle">update only</text>
</svg>
