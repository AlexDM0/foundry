<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>An install change holds the board until matching code runs</title>
  <desc>A swimlane with lanes User, update, Overseer and files, time running down. The Overseer asks version --json after a landing: an equal install version and a matching manifest only show the new-code notice, and any other answer holds launches. Launches stay held through update&#x27;s writes and end only when a process runs the code on disk; not-taken and baton-pass-failed leave them held.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="674" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">An install change holds the board until matching code runs</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Time runs down; the amber band is the span with launches held</text>
  <path d="M36,332 H644 Q652,332 652,340 V554 Q652,562 644,562 H346 Q338,562 338,570 V648 Q338,656 330,656 H36 Q28,656 28,648 V340 Q28,332 36,332 Z" fill="#FAEEDA" fill-opacity="0.45" stroke="#F2DDB0"/>
  <text x="100" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">User</text>
  <path d="M100,108 L100,640" fill="none" stroke="#ECE7DC" stroke-width="1.4"/>
  <text x="260" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">update</text>
  <path d="M260,108 L260,640" fill="none" stroke="#ECE7DC" stroke-width="1.4"/>
  <text x="420" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer</text>
  <path d="M420,108 L420,636" fill="none" stroke="#ECE7DC" stroke-width="1.4"/>
  <text x="575" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Files</text>
  <path d="M575,108 L575,464" fill="none" stroke="#ECE7DC" stroke-width="1.4"/>
  <text x="106" y="350" font-size="11" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">held-by-install-change</text>
  <rect x="510" y="116" width="130" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="139.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">A landing</text>
  <text x="575.0" y="157.5" font-size="12" fill="#5F5E5A" text-anchor="middle">changes files on disk</text>
  <rect x="350" y="186" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="420.0" y="209.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Asks the disk</text>
  <text x="420.0" y="227.5" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">version --json</text>
  <path d="M492,212 L575,212 L575,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="342" y="200" font-size="11" fill="#73726c" text-anchor="end">at each sweep</text>
  <text x="342" y="214" font-size="11" fill="#73726c" text-anchor="end">and after</text>
  <text x="342" y="228" font-size="11" fill="#73726c" text-anchor="end">each landing</text>
  <path d="M420,238 L420,254" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="350" y="256" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="420.0" y="279.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Install changed?</text>
  <text x="420.0" y="297.5" font-size="12" fill="#185FA5" text-anchor="middle">version or manifest</text>
  <path d="M490,282 L508,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="499" y="275" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <rect x="510" y="256" width="130" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="279.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">New-code notice</text>
  <text x="575.0" y="297.5" font-size="12" fill="#5F5E5A" text-anchor="middle">no hold</text>
  <path d="M420,308 L420,340" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430" y="326" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <rect x="350" y="342" width="140" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="420.0" y="365.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Launches held</text>
  <text x="420.0" y="383.5" font-size="12" fill="#854F0B" text-anchor="middle">API answers 423</text>
  <rect x="40" y="412" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="100.0" y="444.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Runs update</text>
  <path d="M160,438 L188,438" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="412" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260.0" y="435.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Writes files</text>
  <text x="260.0" y="453.5" font-size="12" fill="#185FA5" text-anchor="middle">version.json last</text>
  <path d="M330,438 L508,438" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="412" y="418" font-size="11" fill="#73726c" text-anchor="end">writing lifts</text>
  <text x="412" y="431" font-size="11" fill="#73726c" text-anchor="end">nothing</text>
  <rect x="510" y="412" width="130" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="435.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">version.json</text>
  <text x="575.0" y="453.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the new number</text>
  <path d="M260,464 L260,478" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="480" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260.0" y="503.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Asks for a Baton pass</text>
  <text x="260.0" y="521.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">overseer-restart</text>
  <path d="M330,506 L348,506" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="350" y="480" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="420.0" y="503.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Baton pass</text>
  <text x="420.0" y="521.5" font-size="12" fill="#185FA5" text-anchor="middle">to the code on disk</text>
  <path d="M420,532 L420,590" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430" y="580" font-size="11" fill="#73726c" text-anchor="start">serving</text>
  <rect x="350" y="592" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="420.0" y="615.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Successor runs</text>
  <text x="420.0" y="633.5" font-size="12" fill="#185FA5" text-anchor="middle">the hold ends</text>
  <path d="M376,532 L376,548 L260,548 L260,578" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="268" y="566" font-size="11" fill="#73726c" text-anchor="start">failed</text>
  <rect x="184" y="580" width="150" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="259.0" y="599.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-pass-failed</text>
  <text x="259.0" y="616.0" font-size="11" fill="#A32D2D" text-anchor="middle">exit 1, no matching code</text>
  <text x="259.0" y="633.0" font-size="11" fill="#A32D2D" text-anchor="middle">launches stay held</text>
  <path d="M214,532 L214,548 L105,548 L105,578" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="160" y="542" font-size="11" fill="#73726c" text-anchor="middle">not taken</text>
  <rect x="40" y="580" width="134" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="107.0" y="599.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">not-taken</text>
  <text x="107.0" y="616.0" font-size="11" fill="#5F5E5A" text-anchor="middle">exit 0, advises</text>
  <text x="107.0" y="633.0" font-size="11" fill="#5F5E5A" text-anchor="middle">oversee restart</text>
</svg>
