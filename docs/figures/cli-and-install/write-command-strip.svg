<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Nothing after the lock can undo the write</title>
  <desc>A writing command runs six steps left to right: job guard, workspace, one lock hold in writeTracker, skip report, registry, nudge. The first three can refuse, and a refused lock hold writes nothing. The last three warn or stay silent, so they never change the outcome of the write.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="234" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Nothing after the lock can undo the write</text>
  <text x="40" y="68" font-size="13" fill="#73726c">writeTrackerForCommand, left to right</text>

  <!-- the lock band -->
  <rect x="236" y="92" width="104" height="126" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="288" y="207" font-size="11" fill="#5F5E5A" text-anchor="middle">lock held</text>

  <!-- arrows -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M128,142 L140,142"/>
    <path d="M230,142 L242,142"/>
    <path d="M332,142 L344,142"/>
    <path d="M434,142 L446,142"/>
    <path d="M536,142 L548,142"/>
  </g>

  <g text-anchor="middle">
    <rect x="40" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="84" y="137" font-size="13" font-weight="500" fill="#0C447C">Job guard</text>
    <text x="84" y="156" font-size="12" fill="#185FA5">can refuse</text>

    <rect x="142" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="186" y="137" font-size="13" font-weight="500" fill="#0C447C">Workspace</text>
    <text x="186" y="156" font-size="12" fill="#185FA5">can refuse</text>

    <rect x="244" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="288" y="132" font-size="13" font-weight="500" fill="#0C447C">Lock hold</text>
    <text x="288" y="152" font-size="12" fill="#185FA5">can refuse,</text>
    <text x="288" y="166" font-size="12" fill="#185FA5">writes all</text>

    <rect x="346" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="390" y="137" font-size="13" font-weight="500" fill="#0C447C">Skip report</text>
    <text x="390" y="156" font-size="12" fill="#185FA5">on stderr</text>

    <rect x="448" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="492" y="137" font-size="13" font-weight="500" fill="#0C447C">Registry</text>
    <text x="492" y="156" font-size="12" fill="#185FA5">warns only</text>

    <rect x="550" y="110" width="88" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="594" y="137" font-size="13" font-weight="500" fill="#0C447C">Nudge</text>
    <text x="594" y="156" font-size="12" fill="#185FA5">silent</text>
  </g>
</svg>
