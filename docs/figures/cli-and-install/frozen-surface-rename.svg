<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Dropping a frozen name forces a bump: old keys never lose names</title>
  <desc>A flag --example-old frozen under key n is renamed to --example-new. Dropping it turns the spec red, moving INSTALL_VERSION to n+1 turns it red again for a missing key, and a further key holding the printed surface turns it green with key n unchanged. Adding a name that an installed file uses only goes under the current key, with no bump.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="408" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Dropping a frozen name forces a bump: old keys never lose names</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">cli/FrozenInstalledSurface.json through a rename; only the current key is checked</text>
  <rect x="40" y="92" width="138" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="109.0" y="117.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Start</text>
  <text x="109.0" y="134.5" font-size="11" fill="#185FA5" text-anchor="middle">INSTALL_VERSION is n</text>
  <path d="M178,120 L192,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M109.0,148 L109.0,164" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="164" width="138" height="88" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="184" font-size="11" font-weight="500" fill="#444441" text-anchor="start">key n</text>
  <text x="52" y="200" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--example-old</text>
  <path d="M109.0,252 L109.0,266" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="266" width="138" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="109.0" y="293.5" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Green</text>
  <rect x="194" y="92" width="138" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="263.0" y="117.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">CLI renames</text>
  <text x="263.0" y="134.5" font-size="11" fill="#185FA5" text-anchor="middle">the flag is gone</text>
  <path d="M332,120 L346,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M263.0,148 L263.0,164" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="194" y="164" width="138" height="88" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="206" y="184" font-size="11" font-weight="500" fill="#444441" text-anchor="start">key n</text>
  <text x="206" y="200" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--example-old</text>
  <path d="M263.0,252 L263.0,266" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="194" y="266" width="138" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="263.0" y="285.5" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Red</text>
  <text x="263.0" y="302.5" font-size="11" fill="#A32D2D" text-anchor="middle">frozen name lost</text>
  <rect x="348" y="92" width="138" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="417.0" y="117.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Bump</text>
  <text x="417.0" y="134.5" font-size="11" fill="#185FA5" text-anchor="middle">INSTALL_VERSION is n+1</text>
  <path d="M486,120 L500,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M417.0,148 L417.0,164" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="348" y="164" width="138" height="88" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="360" y="184" font-size="11" font-weight="500" fill="#444441" text-anchor="start">key n</text>
  <text x="360" y="200" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--example-old</text>
  <path d="M417.0,252 L417.0,266" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="348" y="266" width="138" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="417.0" y="285.5" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Red</text>
  <text x="417.0" y="302.5" font-size="11" fill="#A32D2D" text-anchor="middle">no key for n+1</text>
  <rect x="502" y="92" width="138" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="571.0" y="117.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Freeze</text>
  <text x="571.0" y="134.5" font-size="11" fill="#185FA5" text-anchor="middle">add what the spec prints</text>
  <path d="M571.0,148 L571.0,164" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="502" y="164" width="138" height="88" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="514" y="184" font-size="11" font-weight="500" fill="#444441" text-anchor="start">key n</text>
  <text x="514" y="200" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--example-old</text>
  <text x="514" y="220" font-size="11" font-weight="500" fill="#444441" text-anchor="start">key n+1</text>
  <text x="514" y="236" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--example-new</text>
  <path d="M571.0,252 L571.0,266" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="502" y="266" width="138" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="571.0" y="285.5" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Green</text>
  <text x="571.0" y="302.5" font-size="11" fill="#3B6D11" text-anchor="middle">key n unchanged</text>
  <text x="40" y="340" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">Adding a name is smaller</text>
  <rect x="40" y="350" width="270" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="175.0" y="377.5" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">An installed file names a new flag</text>
  <path d="M310,372 L348,372" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="350" y="350" width="290" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="495.0" y="377.5" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Add it under key n: no bump</text>
</svg>
