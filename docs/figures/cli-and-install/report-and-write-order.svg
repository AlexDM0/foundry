<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The report keeps one order while the writes move the briefs</title>
  <desc>Three columns list the same six parts: the report order, the write order of a fresh init, and the write order of every other refresh. Lines join each part across the columns, and the brief&#x27;s line jumps from first in a fresh init to fourth elsewhere. The two retired parts are always written last, because they delete the older marker.</desc>
