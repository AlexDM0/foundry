  <text x="105.0" y="94" font-size="11" fill="#73726c" text-anchor="middle">one order, every run</text>
  <text x="340.0" y="76" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Fresh init writes</text>
  <text x="340.0" y="94" font-size="11" fill="#73726c" text-anchor="middle">briefs first: marker sooner</text>
  <text x="575.0" y="76" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Every other refresh writes</text>
  <text x="575.0" y="94" font-size="11" fill="#73726c" text-anchor="middle">briefs late: rerun says updated</text>
