<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>version.json comes last, but the marker comes after the tracker</title>
  <desc>A fresh init writes the tracker, then the briefs ending in session-instructions.md, then the other parts, and version.json last. A crash before progress.json leaves no tracker and a crash after session-instructions.md reads as unversioned, so commands refuse in both cases. A crash between those two reads as current, the one failure nothing refuses.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="648" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">version.json comes last, but the marker comes after the tracker</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A fresh init in write order, and what the next command reads after a crash</text>

  <text x="170" y="100" font-size="12" fill="#73726c" text-anchor="middle">Written, top to bottom</text>
  <text x="510" y="100" font-size="12" fill="#73726c" text-anchor="middle">A crash after these steps reads as</text>

  <!-- spine connectors -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M170,152 L170,162"/>
    <path d="M170,212 L170,222"/>
    <path d="M170,272 L170,282"/>
    <path d="M170,332 L170,342"/>
    <path d="M170,392 L170,402"/>
    <path d="M170,452 L170,462"/>
    <path d="M170,512 L170,522"/>
    <path d="M170,572 L170,582"/>
  </g>

  <!-- spine -->
  <g text-anchor="middle">
    <rect x="40" y="110" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="136" font-size="13" font-weight="500" fill="#444441">Ignore entries in .gitignore</text>

    <rect x="40" y="170" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="196" font-size="13" font-weight="500" fill="#444441">The tickets folder</text>

    <rect x="40" y="230" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="256" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">progress.json</text>

    <rect x="40" y="290" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="316" font-size="13" font-weight="500" fill="#444441">Log, page stub, registry</text>

    <rect x="40" y="350" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="376" font-size="13" font-weight="500" fill="#444441">Eight briefs, reference first</text>

    <rect x="40" y="410" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="436" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">session-instructions.md</text>

    <rect x="40" y="470" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="496" font-size="13" font-weight="500" fill="#444441">Hook, skills, worktrees entry</text>

    <rect x="40" y="530" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="556" font-size="13" font-weight="500" fill="#444441">Retired removals</text>

    <rect x="40" y="590" width="260" height="42" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="616" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">version.json</text>
  </g>

  <!-- zone brackets -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6">
    <path d="M308,114 L318,114 L318,208 L308,208"/>
    <path d="M308,234 L318,234 L318,388 L308,388"/>
    <path d="M308,414 L318,414 L318,568 L308,568"/>
    <path d="M308,611 L318,611"/>
    <path d="M318,161 L378,161" marker-end="url(#ah)"/>
    <path d="M318,311 L378,311" marker-end="url(#ah)"/>
    <path d="M318,491 L378,491" marker-end="url(#ah)"/>
    <path d="M318,611 L378,611" marker-end="url(#ah)"/>
  </g>

  <!-- outcomes -->
  <g text-anchor="middle">
    <rect x="380" y="130" width="260" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="510" y="154" font-size="14" font-weight="500" fill="#791F1F">No tracker: refused</text>
    <text x="510" y="174" font-size="12" fill="#A32D2D" font-family="ui-monospace,Menlo,Consolas,monospace">no-tracker-found</text>

    <rect x="380" y="272" width="260" height="78" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="510" y="296" font-size="14" font-weight="500" fill="#791F1F">Reads as current</text>
    <text x="510" y="315" font-size="12" fill="#A32D2D">commands run on a half install</text>
    <text x="510" y="333" font-size="12" fill="#A32D2D">the marker window, a known gap</text>

    <rect x="380" y="452" width="260" height="78" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="510" y="476" font-size="14" font-weight="500" fill="#791F1F">Unversioned: refused</text>
    <text x="510" y="495" font-size="12" fill="#A32D2D">marker present, manifest absent</text>
    <text x="510" y="513" font-size="12" fill="#A32D2D">init or update finishes the job</text>

    <rect x="380" y="585" width="260" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="510" y="607" font-size="14" font-weight="500" fill="#27500A">Current</text>
    <text x="510" y="625" font-size="12" fill="#3B6D11">the install is complete</text>
  </g>
</svg>
