<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Installed files reach a session by hook, launch or on demand</title>
  <desc>A template passes the install fill and lands as one of nine files in the data folder. hook session-start prints session-instructions.md into the session User opens, and the launch fill writes the remaining placeholders into a role's brief for a job. Any session reads reference.md on demand.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="320" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Installed files reach a session by hook, launch or on demand</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Nine templates land in &lt;data&gt;, then leave by one of three routes</text>
  <rect x="40" y="172" width="90" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="85.0" y="195.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Template</text>
  <text x="85.0" y="213.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">resources/</text>
  <path d="M130,200 L148,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="150" y="172" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="200.0" y="195.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Install fill</text>
  <text x="200.0" y="213.0" font-size="12" fill="#185FA5" text-anchor="middle">product names</text>
  <path d="M250,200 L268,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="270" y="100" width="100" height="200" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="320.0" y="195.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Nine files</text>
  <text x="320.0" y="213.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/</text>
  <path d="M370,126 L508,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="440" y="118" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hook session-start</text>
  <rect x="510" y="100" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="575.0" y="121.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User's session</text>
  <text x="575.0" y="139.0" font-size="12" fill="#854F0B" text-anchor="middle">arrives by itself</text>
  <path d="M370,200 L398,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="172" width="90" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="445.0" y="195.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Launch fill</text>
  <text x="445.0" y="213.0" font-size="12" fill="#185FA5" text-anchor="middle">the rest</text>
  <path d="M490,200 L508,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="510" y="174" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="575.0" y="195.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">A job</text>
  <text x="575.0" y="213.0" font-size="12" fill="#993C1D" text-anchor="middle">read at each launch</text>
  <path d="M508,274 L372,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="440" y="266" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reference.md</text>
  <text x="440" y="290" font-size="11" fill="#73726c" text-anchor="middle">read on demand</text>
  <rect x="510" y="248" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="575.0" y="269.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Any session</text>
  <text x="575.0" y="287.0" font-size="12" fill="#993C1D" text-anchor="middle">when it needs it</text>
</svg>
