<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A walk up finds nested folders; git finds sibling worktrees</title>
  <desc>If the root variable is set, it wins with no walk at all. Otherwise a walk up from a nested src folder reaches the main checkout&#x27;s progress.json, while a walk up from a sibling worktree reaches the filesystem root and misses. The sibling then jumps through git&#x27;s common directory to the main checkout.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="442" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A walk up finds nested folders; git finds sibling worktrees</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">findWorkspace, in order; the first hit wins</text>
  <rect x="40" y="88" width="600" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="113.5" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">1. &lt;PREFIX&gt;ROOT set: no walk at all</text>
  <rect x="40" y="146" width="600" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="169.5" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">/  the filesystem root, no tracker</text>
  <rect x="40" y="218" width="290" height="206" rx="8" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
  <rect x="400" y="218" width="240" height="206" rx="8" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
  <text x="56" y="240" font-size="13" font-weight="500" fill="#444441" text-anchor="start">Main checkout</text>
  <text x="416" y="240" font-size="13" font-weight="500" fill="#444441" text-anchor="start">Sibling worktree</text>
  <rect x="60" y="252" width="190" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="155.0" y="274.5" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/progress.json</text>
  <text x="155.0" y="292.5" font-size="12" fill="#3B6D11" text-anchor="middle">the tracker</text>
  <rect x="60" y="356" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="155.0" y="377.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">src/</text>
  <text x="155.0" y="395.0" font-size="12" fill="#5F5E5A" text-anchor="middle">start here</text>
  <path d="M155,356 L155,306" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="165" y="334" font-size="11" fill="#73726c" text-anchor="start">2. walk up: hit</text>
  <rect x="430" y="356" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="525.0" y="377.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">src/</text>
  <text x="525.0" y="395.0" font-size="12" fill="#5F5E5A" text-anchor="middle">or start here</text>
  <path d="M580,356 L580,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="572" y="300" font-size="11" fill="#73726c" text-anchor="end">2. walk up: miss</text>
  <path d="M430,380 L290,380 L290,278 L252,278" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="365" y="352" font-size="11" fill="#73726c" text-anchor="middle">3. git common</text>
  <text x="365" y="366" font-size="11" fill="#73726c" text-anchor="middle">directory</text>
</svg>
