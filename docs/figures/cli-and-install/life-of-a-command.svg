<svg xmlns="http://www.w3.org/2000/svg" width="680" height="716" viewBox="0 0 680 716" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One function decides every exit code</title>
  <desc>A command line passes the help check, the table lookup, the job route, the lazy import, the install check and the handler, and exits 0 when the handler returns. An ambiguous -h or an unknown command exits 1 early. A refused job route, an install mismatch or any throw from the handler reaches one catch: HatchConcluded exits with its own code, a refused OperationRefusal exits 1, an unrepaired one exits 2, and any other error exits 2.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="714" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One function decides every exit code</text>
  <text x="40" y="68" font-size="13" fill="#73726c">runCommandLine returns a number; agent-progress.ts exits with it</text>

  <!-- spine connectors -->
  <path d="M170,144 L170,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,222 L170,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,300 L170,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,378 L170,402" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,456 L170,480" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,534 L170,558" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,612 L170,636" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="180" y="238" font-size="11" fill="#73726c">a help request runs help</text>
  <text x="180" y="394" font-size="11" fill="#73726c">direct or relayed</text>
  <text x="180" y="628" font-size="11" fill="#73726c">returns</text>

  <!-- early exits -->
  <path d="M300,196 L408,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="354" y="190" font-size="11" fill="#73726c" text-anchor="middle">ambiguous</text>
  <path d="M300,274 L408,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="354" y="268" font-size="11" fill="#73726c" text-anchor="middle">unknown</text>

  <!-- collector into the catch -->
  <path d="M300,352 L368,352 L368,452" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,508 L368,508 L368,452" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,586 L368,586 L368,508" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M368,452 L390,452" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="306" y="346" font-size="11" fill="#73726c">refused</text>
  <text x="306" y="502" font-size="11" fill="#73726c">mismatch</text>
  <text x="306" y="580" font-size="11" fill="#73726c">any throw</text>

  <!-- spine -->
  <rect x="40" y="92" width="260" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="170" y="114" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Command line</text>
  <text x="170" y="132" font-size="12" fill="#5F5E5A" text-anchor="middle">arguments plus CommandContext</text>

  <rect x="40" y="170" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="192" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Help check</text>
  <text x="170" y="210" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">helpRequestOf</text>

  <rect x="40" y="248" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="270" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Table lookup</text>
  <text x="170" y="288" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">commandLoaderFor</text>

  <rect x="40" y="326" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="348" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Job route</text>
  <text x="170" y="366" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">jobRouteOf</text>

  <rect x="40" y="404" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="426" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Lazy import</text>
  <text x="170" y="444" font-size="12" fill="#185FA5" text-anchor="middle">only this command's module</text>

  <rect x="40" y="482" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="504" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Install check</text>
  <text x="170" y="522" font-size="12" fill="#185FA5" text-anchor="middle">skipped for spared or relayed verbs</text>

  <rect x="40" y="560" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170" y="582" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Handler runs</text>
  <text x="170" y="600" font-size="12" fill="#185FA5" text-anchor="middle">writes, prints or relays</text>

  <rect x="40" y="638" width="260" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="170" y="660" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Exit 0</text>
  <text x="170" y="678" font-size="12" fill="#3B6D11" text-anchor="middle">done or nothing to do</text>

  <!-- early exit boxes -->
  <rect x="410" y="170" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="525" y="192" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Exit 1</text>
  <text x="525" y="210" font-size="12" fill="#A32D2D" text-anchor="middle">a late -h may be text</text>

  <rect x="410" y="248" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="525" y="270" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Exit 1</text>
  <text x="525" y="288" font-size="12" fill="#A32D2D" text-anchor="middle">help on standard error</text>

  <!-- the catch -->
  <rect x="392" y="330" width="248" height="246" rx="10" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <text x="404" y="350" font-size="12" fill="#5F5E5A">The one catch</text>

  <rect x="404" y="360" width="224" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="516" y="379" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">HatchConcluded</text>
  <text x="516" y="396" font-size="12" fill="#3B6D11" text-anchor="middle">Exit 0, the Hatch printed</text>

  <rect x="404" y="412" width="224" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="516" y="431" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Refusal, <tspan font-family="ui-monospace,Menlo,Consolas,monospace">refused</tspan></text>
  <text x="516" y="448" font-size="12" fill="#A32D2D" text-anchor="middle">Exit 1, worded on stderr</text>

  <rect x="404" y="464" width="224" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="516" y="483" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Refusal, <tspan font-family="ui-monospace,Menlo,Consolas,monospace">unrepaired</tspan></text>
  <text x="516" y="500" font-size="12" fill="#A32D2D" text-anchor="middle">Exit 2, worded on stderr</text>

  <rect x="404" y="516" width="224" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="516" y="535" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Any other error</text>
  <text x="516" y="552" font-size="12" fill="#A32D2D" text-anchor="middle">Exit 2, its message on stderr</text>
</svg>
