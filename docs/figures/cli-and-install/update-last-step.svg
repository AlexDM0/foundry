<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A failed hand-over leaves the install standing</title>
  <desc>With no live Baton, or a Baton whose versions equal the disk, update stops at exit 0; otherwise it sends overseer-restart. An Overseer that does not take it is not-taken, exit 0 with advice, and a Baton pass file saying serving is baton-passed, exit 0. A failure or no outcome is baton-pass-failed, exit 1: the installed files stand and the old Overseer keeps or takes back the board.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="528" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A failed hand-over leaves the install standing</text>
  <text x="40" y="68" font-size="13" fill="#73726c">update's closing step, after its files and version.json are written</text>

  <!-- spine connectors -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M170,144 L170,174"/>
    <path d="M170,226 L170,256"/>
    <path d="M170,308 L170,338"/>
    <path d="M170,390 L170,444"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="180" y="246">yes</text>
    <text x="180" y="328">differ</text>
    <text x="180" y="422">the Baton pass file says serving</text>
  </g>

  <!-- right connectors -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M300,200 L398,200"/>
    <path d="M300,356 L398,356"/>
    <path d="M340,380 L340,466 L398,466"/>
  </g>
  <path d="M300,282 L340,282 L340,200" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,380 L340,380" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <g font-size="11" fill="#73726c">
    <text x="370" y="194" text-anchor="middle">no</text>
    <text x="306" y="276">equal</text>
    <text x="324" y="350">not taken</text>
    <text x="348" y="416">failed, or no outcome</text>
  </g>

  <!-- spine -->
  <g text-anchor="middle">
    <rect x="40" y="92" width="260" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="170" y="114" font-size="14" font-weight="500" fill="#444441">Install finished</text>
    <text x="170" y="132" font-size="12" fill="#5F5E5A">files and version.json stand</text>

    <rect x="40" y="174" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="170" y="196" font-size="14" font-weight="500" fill="#0C447C">Baton live?</text>
    <text x="170" y="214" font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">Baton.newestBatonOf</text>

    <rect x="40" y="256" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="170" y="278" font-size="14" font-weight="500" fill="#0C447C">Versions against disk?</text>
    <text x="170" y="296" font-size="12" fill="#185FA5">both Baton versions compared</text>

    <rect x="40" y="338" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="170" y="360" font-size="14" font-weight="500" fill="#0C447C">Hand over</text>
    <text x="170" y="378" font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">handOverTheLiveOverseer</text>

    <rect x="40" y="446" width="260" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="170" y="471" font-size="13" font-weight="500" fill="#27500A" font-family="ui-monospace,Menlo,Consolas,monospace">baton-passed</text>
    <text x="170" y="490" font-size="12" fill="#3B6D11">exit 0, the successor drives</text>
  </g>

  <!-- outcomes -->
  <g text-anchor="middle">
    <rect x="400" y="174" width="240" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="520" y="196" font-size="14" font-weight="500" fill="#444441">Stop, exit 0</text>
    <text x="520" y="214" font-size="12" fill="#5F5E5A">nothing to hand over</text>

    <rect x="400" y="326" width="240" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="520" y="350" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">not-taken</text>
    <text x="520" y="369" font-size="12" fill="#5F5E5A">exit 0, advises oversee restart</text>

    <rect x="400" y="426" width="240" height="80" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="520" y="447" font-size="13" font-weight="500" fill="#791F1F" font-family="ui-monospace,Menlo,Consolas,monospace">baton-pass-failed</text>
    <text x="520" y="465" font-size="12" fill="#A32D2D">exit 1, installed files stand</text>
    <text x="520" y="482" font-size="12" fill="#A32D2D">old Overseer keeps or takes</text>
    <text x="520" y="497" font-size="12" fill="#A32D2D">back the board</text>
  </g>
</svg>
