<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="768" viewBox="0 0 1000 768" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Go down a band only when the one above stops answering</title>
  <desc>Five stacked bands: L0 Front door, L1 Concepts, L2 Data model, L3 Architecture and L4 Change, each listing its documents and its promise. An operator leaves the stack after L1 for the Operate track, which runs beside L2 to L4. The Reference shelf stands on the other side and is looked up, never read through. The four labs are tabs: Walk a ticket on L1, State explorer on L2, Failure lab on L3, and Why not moving on the Operate track.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="766" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="20" font-weight="500" fill="#3d3d3a">Go down a band only when the one above stops answering</text>
  <text x="40" y="68" font-size="14" fill="#73726c">Blue is the stack, read downward; amber is the operator's track; gray is the lookup shelf; white tabs are the four labs</text>
  <rect x="240" y="92" width="720" height="84" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256" y="117" font-size="15" font-weight="500" fill="#0C447C" text-anchor="start">L0 Front door</text>
  <text x="256" y="137" font-size="13" font-weight="400" fill="#185FA5" text-anchor="start">Five minutes: what this is, and one click from the fix.</text>
  <text x="256" y="160" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">README  ·  this map</text>
  <rect x="240" y="204" width="720" height="84" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256" y="229" font-size="15" font-weight="500" fill="#0C447C" text-anchor="start">L1 Concepts</text>
  <text x="256" y="249" font-size="13" font-weight="400" fill="#185FA5" text-anchor="start">One hour, no code: who acts, and how a ticket reaches main.</text>
  <text x="256" y="272" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">overview  ·  ticket lifecycle  ·  glossary</text>
  <rect x="240" y="332" width="470" height="84" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256" y="357" font-size="15" font-weight="500" fill="#0C447C" text-anchor="start">L2 Data model</text>
  <text x="256" y="377" font-size="13" font-weight="400" fill="#185FA5" text-anchor="start">Read any stored file, status or write.</text>
  <text x="256" y="400" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">entities  ·  state machines  ·  storage  ·  on-disk atlas</text>
  <rect x="240" y="444" width="470" height="146" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256" y="469" font-size="15" font-weight="500" fill="#0C447C" text-anchor="start">L3 Architecture</text>
  <text x="256" y="489" font-size="13" font-weight="400" fill="#185FA5" text-anchor="start">One document per mechanism, down to the deciding code.</text>
  <text x="256" y="512" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Lifecycle</text>
  <text x="322" y="512" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">the Pass  ·  build and review  ·  Customs  ·  Airlocks  ·  incidents</text>
  <text x="256" y="532" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Runtime</text>
  <text x="322" y="532" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">Watchers  ·  Baton  ·  failure and recovery</text>
  <text x="256" y="552" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Agents</text>
  <text x="322" y="552" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">roles  ·  confinement  ·  control and Hatch  ·  Assistant</text>
  <text x="256" y="572" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Surfaces</text>
  <text x="322" y="572" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">code map  ·  CLI and install  ·  Bridge  ·  measurement</text>
  <rect x="240" y="618" width="470" height="106" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256" y="643" font-size="15" font-weight="500" fill="#0C447C" text-anchor="start">L4 Change</text>
  <text x="256" y="663" font-size="13" font-weight="400" fill="#185FA5" text-anchor="start">Get a change past every guard, or port the code.</text>
  <text x="256" y="686" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">changing the code  ·  guards and testing  ·  decisions</text>
  <text x="256" y="706" font-size="13" font-weight="400" fill="#0C447C" text-anchor="start">Claude Code contract  ·  end-to-end smoke  ·  porting</text>
  <rect x="750" y="332" width="210" height="392" rx="10" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="766" y="367" font-size="15" font-weight="500" fill="#633806" text-anchor="start">Operate track</text>
  <text x="766" y="387" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">Adopt, run and recover,</text>
  <text x="766" y="405" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">with commands to paste.</text>
  <text x="766" y="452" font-size="13" font-weight="500" fill="#633806" text-anchor="start">getting started</text>
  <text x="766" y="470" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">first repository to merge</text>
  <text x="766" y="506" font-size="13" font-weight="500" fill="#633806" text-anchor="start">running a board</text>
  <text x="766" y="524" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">the Bridge, day to day</text>
  <text x="766" y="560" font-size="13" font-weight="500" fill="#633806" text-anchor="start">runbook</text>
  <text x="766" y="578" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">recipes by symptom</text>
  <text x="766" y="688" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">Needs neither L2 nor L3,</text>
  <text x="766" y="706" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">and links into both.</text>
  <rect x="40" y="92" width="170" height="632" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="56" y="117" font-size="15" font-weight="500" fill="#444441" text-anchor="start">Reference shelf</text>
  <text x="56" y="137" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Looked up, never</text>
  <text x="56" y="155" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">read through.</text>
  <text x="56" y="192" font-size="13" font-weight="400" fill="#444441" text-anchor="start">CLI reference</text>
  <text x="56" y="216" font-size="13" font-weight="400" fill="#444441" text-anchor="start">Overseer API</text>
  <text x="56" y="240" font-size="13" font-weight="400" fill="#444441" text-anchor="start">deciders and bounds</text>
  <text x="56" y="264" font-size="13" font-weight="400" fill="#444441" text-anchor="start">refusals</text>
  <text x="56" y="288" font-size="13" font-weight="400" fill="#444441" text-anchor="start">known gaps</text>
  <text x="56" y="312" font-size="13" font-weight="400" fill="#444441" text-anchor="start">backlog</text>
  <text x="56" y="382" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Also a lookup, kept</text>
  <text x="56" y="400" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">in L4: Claude Code</text>
  <text x="56" y="418" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">contract.</text>
  <rect x="810" y="191" width="134" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5"/>
  <text x="877.0" y="209" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Walk a ticket</text>
  <rect x="560" y="319" width="134" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5"/>
  <text x="627.0" y="337" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">State explorer</text>
  <rect x="560" y="431" width="134" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5"/>
  <text x="627.0" y="449" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Failure lab</text>
  <rect x="782" y="319" width="162" height="26" rx="6" fill="#FFFFFF" stroke="#854F0B"/>
  <text x="863.0" y="337" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Why not moving?</text>
  <path d="M300,177 L300,201" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M300,289 L300,329" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M300,417 L300,441" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M300,591 L300,615" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M766,289 L766,329" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="778" y="306" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">an operator leaves here</text>
</svg>
