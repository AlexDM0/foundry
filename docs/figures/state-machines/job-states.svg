<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Interrupted is not ended: the job stays on the board</title>
  <desc>A build or review job moves launching, preparing, running, in-customs, gating, then ended on a passed gate. A crash, a usage limit, a red check or a red gate moves it to interrupted, and so does losing the session while waiting-for-answer. A resume returns it to running in the next Watcher instance. waiting-for-answer keeps its process. A review waiting on a waiver sits in awaiting-answer, which no answer moves on. stopping leads to ended.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Interrupted is not ended: the job stays on the board</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A build or review job; a resume spawns the next Watcher instance</text>
  <path d="M140,138 L140,158" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="148" y="152" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">observed</text>
  <path d="M140,208 L140,228" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="148" y="222" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">installed, or started</text>
  <path d="M140,278 L140,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="132" y="308" font-size="11" fill="#73726c" text-anchor="end" font-weight="400">closing result</text>
  <path d="M140,378 L140,418" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="132" y="402" font-size="11" fill="#73726c" text-anchor="end" font-weight="400">Customs verified</text>
  <rect x="60" y="90" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="119.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <rect x="60" y="160" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="189.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">preparing</text>
  <rect x="60" y="230" width="160" height="48" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="140.0" y="259.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <rect x="60" y="330" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="359.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs</text>
  <rect x="60" y="420" width="160" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="449.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <rect x="300" y="230" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="390.0" y="252.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">waiting-for-answer</text>
  <text x="390.0" y="269.0" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="400">process alive</text>
  <rect x="300" y="330" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="390.0" y="352.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">interrupted</text>
  <text x="390.0" y="369.0" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="400">no process</text>
  <rect x="300" y="420" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="390.0" y="442.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">awaiting-answer</text>
  <text x="390.0" y="459.0" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="400">no process</text>
  <path d="M220,243 L298,243" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="237" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">question</text>
  <path d="M300,265 L222,265" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="279" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">answered</text>
  <path d="M205,278 L205,296 L420,296 L420,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="335" y="291" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">crash, usage limit</text>
  <path d="M455,278 L455,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="462" y="308" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">session lost</text>
  <path d="M340,330 L340,314 L170,314 L170,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="178" y="309" font-size="11" fill="#73726c" text-anchor="start" font-weight="500">resume: +1 instance</text>
  <path d="M220,346 L298,346" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="259" y="340" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">red check</text>
  <path d="M220,431 L272,431 L272,362 L298,362" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="404" font-size="11" fill="#73726c" text-anchor="end" font-weight="400">red gate</text>
  <path d="M220,452 L298,452" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="280" y="466" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">waiver</text>
  <text x="390" y="483" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="400">no answer moves it on</text>
  <rect x="525" y="130" width="115" height="78" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="582.5" y="167.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopping</text>
  <text x="582.5" y="184.0" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="400">from any live state</text>
  <rect x="525" y="262" width="115" height="206" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="582.5" y="370.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ended</text>
  <text x="582" y="322" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">every state</text>
  <text x="582" y="338" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">may end</text>
  <text x="582" y="396" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">leaves the board</text>
  <text x="582" y="412" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">lives on in the log</text>
  <path d="M582,208 L582,260" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M140,468 L140,506 L582,506 L582,470" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="500" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">gate passed: built, or the review outcome</text>
</svg>
