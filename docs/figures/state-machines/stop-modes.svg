<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The job's state decides how fast a stop lands</title>
  <desc>A stop or fresh of a job in a state with no session, launching, preparing, interrupted or awaiting-answer, ends it at once, stopped or replaced; fresh needs a ticket. A build or review in any other state goes to stopping and ends once its Watcher is gone. A product owner in any state, and an Assistant or pipeline agent in any other, go to stopping on a stop and end closed, and they refuse fresh. wind-down changes no state. A merge or refresh moves to stopping and the merge carries on. A merge-agent stays stopping. A pipeline agent acts as an Assistant, and with no session a stop ends it closed at once.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="514" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The job's state decides how fast a stop lands</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each cell: what requestJobStop does to the state. A tag marks where it also writes the ticket hold</text>
  <text x="293" y="102" font-size="14" fill="#3d3d3a" text-anchor="middle" font-weight="500">no session</text>
  <text x="293" y="120" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">launching, preparing, interrupted,</text>
  <text x="293" y="137" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">awaiting-answer</text>
  <text x="555" y="102" font-size="14" fill="#3d3d3a" text-anchor="middle" font-weight="500">build or review, any other state</text>
  <text x="555" y="120" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">an agent session must stop first</text>
  <text x="817" y="102" font-size="14" fill="#3d3d3a" text-anchor="middle" font-weight="500">session job</text>
  <text x="817" y="120" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">product owner in any state,</text>
  <text x="817" y="137" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">Assistant, pipeline agent in any other</text>
  <text x="40" y="197" font-size="14" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stop</text>
  <text x="40" y="289" font-size="14" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">fresh</text>
  <text x="40" y="381" font-size="14" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">wind-down</text>
  <rect x="170" y="150" width="246" height="82" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="186" y="183" font-size="14" fill="#444441" text-anchor="start" font-weight="500">ended</text>
  <text x="236" y="183" font-size="14" fill="#444441" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopped</text>
  <text x="186" y="208" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">at once</text>
  <rect x="352" y="162" width="52" height="24" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="378" y="179" font-size="13" fill="#633806" text-anchor="middle" font-weight="500">hold</text>
  <rect x="432" y="150" width="246" height="82" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="448" y="183" font-size="14" fill="#0C447C" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopping</text>
  <text x="448" y="208" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">then ended stopped</text>
  <rect x="614" y="162" width="52" height="24" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="640" y="179" font-size="13" fill="#633806" text-anchor="middle" font-weight="500">hold</text>
  <rect x="694" y="150" width="246" height="82" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="710" y="183" font-size="14" fill="#0C447C" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopping</text>
  <text x="710" y="208" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">then ended closed</text>
  <rect x="170" y="242" width="246" height="82" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="186" y="275" font-size="14" fill="#444441" text-anchor="start" font-weight="500">ended</text>
  <text x="236" y="275" font-size="14" fill="#444441" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">replaced</text>
  <text x="186" y="300" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">at once; needs a ticket</text>
  <rect x="432" y="242" width="246" height="82" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="448" y="275" font-size="14" fill="#0C447C" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopping</text>
  <text x="448" y="300" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">then ended replaced</text>
  <rect x="694" y="242" width="246" height="82" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="710" y="275" font-size="14" fill="#791F1F" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">refused</text>
  <text x="710" y="300" font-size="13" fill="#A32D2D" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">job-has-no-ticket</text>
  <rect x="170" y="334" width="246" height="82" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="186" y="367" font-size="14" fill="#633806" text-anchor="start" font-weight="500">no state change</text>
  <text x="186" y="392" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">only the request is stored</text>
  <rect x="352" y="346" width="52" height="24" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="378" y="363" font-size="13" fill="#633806" text-anchor="middle" font-weight="500">hold</text>
  <rect x="432" y="334" width="246" height="82" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="448" y="367" font-size="14" fill="#633806" text-anchor="start" font-weight="500">no state change</text>
  <text x="448" y="392" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">the agent wraps up</text>
  <rect x="614" y="346" width="52" height="24" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="640" y="363" font-size="13" fill="#633806" text-anchor="middle" font-weight="500">hold</text>
  <rect x="694" y="334" width="246" height="82" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="710" y="367" font-size="14" fill="#633806" text-anchor="start" font-weight="500">no state change</text>
  <text x="710" y="392" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">the agent wraps up</text>
  <text x="40" y="438" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">hold: the ticket takes stopped by User (J&lt;n&gt;) or wound down by User (J&lt;n&gt;), unless it already has one.</text>
  <text x="40" y="456" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">fresh needs a ticket, so every ticketless job refuses it: product owner, Assistant, pipeline agent, refresh.</text>
  <text x="40" y="474" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">merge, refresh: past launching a stop moves it to stopping, the Airlock does not read that, and the merge carries on.</text>
  <text x="40" y="492" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">merge-agent: stays stopping and no stop frame goes out; it ends when its merge gives up the Airlock slot. A pipeline agent with no session ends closed at once.</text>
</svg>
