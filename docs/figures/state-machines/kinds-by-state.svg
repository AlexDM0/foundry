<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every kind shares launching, stopping and ended; the rest is per kind</title>
  <desc>Eight job kinds against eleven states. All use launching, stopping and ended. build and review use preparing, in-customs and gating; review adds awaiting-answer. merge and refresh use only merging between. merge-agent uses running, interrupted and in-customs, and gating only for a merge-fix role. assistant uses running and interrupted. product-owner adds both question states. onboarder adds in-customs.</desc>
