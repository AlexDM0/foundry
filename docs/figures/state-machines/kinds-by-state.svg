<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="626" viewBox="0 0 1058 626" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every kind shares launching, stopping and ended; the rest is per kind</title>
  <desc>Nine job kinds against twelve states. All use launching, stopping and ended. build and review use preparing, running, waiting-for-answer, interrupted, in-customs, gating and merging-main; review adds awaiting-answer. merge, refresh and constitution-commit use only merging between. merge-agent uses running, interrupted, in-customs and gating, where a resolved agent waits while the merged tree is gated. assistant and pipeline agent use running and interrupted. product-owner adds both question states.</desc>
  <rect x="1" y="1" width="1056" height="624" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every kind shares launching, stopping and ended; the rest is per kind</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Filled: the kind reaches that state in production. Colours match the job state figure. The state landing is never reached</text>
