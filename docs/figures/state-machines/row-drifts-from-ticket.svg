<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A row drifts from its ticket only by a verb, and the next ticket move pulls it back</title>
  <desc>One ticket over time, with its status in one lane and its row's status in the other. task pause makes the row paused while the ticket stays in-progress, and a ticket move realigns them at in-review. A second task pause, then task start, leaves the row in-progress while the ticket is in-review, and ticket rereview makes the row re-review. The next ticket move writes delivered on both.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A row drifts from its ticket only by a verb, and the next ticket move pulls it back</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One ticket over time. Amber marks the spans where the row differs from the ticket</text>
  <text x="40" y="124" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Ticket</text>
  <text x="40" y="140" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">status</text>
  <text x="40" y="186" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Own row</text>
  <text x="40" y="202" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">status</text>
  <rect x="172" y="104" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="282.0" y="131" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <rect x="396" y="104" width="444" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="618.0" y="131" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <rect x="844" y="104" width="108" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="898.0" y="131" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <rect x="172" y="166" width="108" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="226.0" y="193" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <rect x="284" y="166" width="108" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="338.0" y="193" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">paused</text>
  <rect x="396" y="166" width="108" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="450.0" y="193" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <rect x="508" y="166" width="108" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="562.0" y="193" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">paused</text>
  <rect x="620" y="166" width="108" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="674.0" y="193" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <rect x="732" y="166" width="108" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="786.0" y="193" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">re-review</text>
  <rect x="844" y="166" width="108" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="898.0" y="193" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <path d="M282,232 L282,214" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="282" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">task</text>
  <text x="282" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">pause</text>
  <path d="M394,232 L394,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="394" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket</text>
  <text x="394" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">move</text>
  <path d="M506,232 L506,214" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="506" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">task</text>
  <text x="506" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">pause</text>
  <path d="M618,232 L618,214" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="618" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">task</text>
  <text x="618" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">start</text>
  <path d="M730,232 L730,214" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="730" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket</text>
  <text x="730" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">rereview</text>
  <path d="M842,232 L842,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="842" y="246" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket</text>
  <text x="842" y="260" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">move</text>
  <path d="M170,280 L954,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="924" y="274" font-size="13" fill="#73726c" text-anchor="end" font-weight="400">time</text>
</svg>
