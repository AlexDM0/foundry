  <text x="135.0" y="309.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <rect x="265" y="286" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="309.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <text x="490" y="309" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Awaiting review</text>
  <path d="M135,322 L135,329" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path d="M345,322 L345,329" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="3 3"/>
