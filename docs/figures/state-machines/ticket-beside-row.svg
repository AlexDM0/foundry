  <text x="490" y="137" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Draft</text>
  <path d="M215,132 L265,132" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="3 3"/>
  <rect x="265" y="114" width="160" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="315" y="137" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">draft</text>
  <text x="375" y="136" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="400">no row exists</text>
  <path d="M215,175 L263,175 " fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="55" y="157" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pending</text>
  <rect x="265" y="157" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pending</text>
  <text x="490" y="180" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">To do</text>
  <path d="M215,218 L263,218 " fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="55" y="200" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="223.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <rect x="265" y="200" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="223.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <text x="490" y="223" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">In progress</text>
