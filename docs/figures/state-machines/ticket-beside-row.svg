<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Two records, one status</title>
  <desc>Ticket and row share pending, in-progress, in-review, reviewed, delivered and abandoned. draft is stored only on the ticket, and is the display state a draft ticket shows with no row. paused and re-review exist only on the row. reviewing is stored on neither: it is shown for a row and ticket both in-review while a review bar is open. Each line shows the word the Bridge prints.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="588" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Two records, one status</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The Board moves a ticket and its row together; three stored words stand alone</text>
  <text x="135" y="100" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">Ticket status</text>
  <text x="345" y="100" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">Row status</text>
  <text x="490" y="100" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Bridge shows</text>
  <rect x="55" y="114" width="160" height="36" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
