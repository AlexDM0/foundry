  <text x="130" y="352" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewing</text>
  <text x="196" y="351" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">shown while a review bar is open</text>
  <text x="490" y="352" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Reviewing</text>
  <rect x="265" y="372" width="160" height="36" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="345.0" y="395.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">re-review</text>
  <text x="490" y="395" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Reviewing (round n)</text>
  <path d="M215,433 L263,433 " fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="55" y="415" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="438.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewed</text>
  <rect x="265" y="415" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="438.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewed</text>
  <text x="490" y="438" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Awaiting merge</text>
  <path d="M215,476 L263,476 " fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="55" y="458" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="481.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <rect x="265" y="458" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="481.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <text x="490" y="481" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Done</text>
  <path d="M215,519 L263,519 " fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="55" y="501" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="524.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">abandoned</text>
  <rect x="265" y="501" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="524.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">abandoned</text>
  <text x="490" y="524" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Abandoned</text>
  <text x="40" y="556" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">Amber: waits on, or moved by, User. Blue dashed: shown, never stored on a row.</text>
</svg>
