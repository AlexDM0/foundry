  <text x="345.0" y="266.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">paused</text>
  <text x="490" y="266" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">Paused</text>
