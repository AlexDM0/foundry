<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A hold lies across statuses; it never changes one</title>
  <desc>Five hold forms laid across the statuses, shaded where code writes them. Free text and parked are written on any open status. landing-refused is written on in-review, awaiting answer on in-progress and in-review, stopped or wound down on pending, in-progress and in-review. A status move carries a hold with it, as a reopen carries landing-refused to pending. On settled tickets a hold can no longer be changed. Every form is lifted by ticket unhold; awaiting answer also by answering.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="450" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A hold lies across statuses; it never changes one</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each row is a hold text. Shaded cells are the statuses where code writes it; any later move carries it along</text>
  <text x="324.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">draft</text>
  <text x="412.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pending</text>
  <text x="500.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <text x="588.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <text x="676.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewed</text>
  <text x="764.0" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">settled</text>
  <text x="816" y="104" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Lifted by</text>
  <text x="40" y="142" font-size="13" fill="#633806" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">free text, or empty</text>
  <text x="40" y="160" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">ticket hold</text>
  <rect x="283" y="121" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="371" y="121" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="459" y="121" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="547" y="121" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="635" y="121" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="723" y="121" width="82" height="50" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="816" y="151" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">ticket unhold</text>
  <text x="40" y="200" font-size="13" fill="#633806" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">parked:&lt;cause&gt;</text>
  <text x="40" y="218" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">a park</text>
  <rect x="283" y="179" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="371" y="179" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="459" y="179" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="547" y="179" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="635" y="179" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="723" y="179" width="82" height="50" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="816" y="200" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">ticket unhold</text>
  <text x="816" y="218" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">not by an answer</text>
  <text x="40" y="258" font-size="13" fill="#633806" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">landing-refused:&lt;reason&gt;</text>
  <text x="40" y="276" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">a refused landing</text>
  <rect x="283" y="237" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="371" y="237" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="459" y="237" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="547" y="237" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="635" y="237" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="723" y="237" width="82" height="50" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="816" y="267" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">ticket unhold</text>
  <text x="40" y="316" font-size="13" fill="#633806" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">awaiting answer (E&lt;n&gt;)</text>
  <text x="40" y="334" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">a job ended, question open</text>
  <rect x="283" y="295" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="371" y="295" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="459" y="295" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="547" y="295" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="635" y="295" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="723" y="295" width="82" height="50" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="816" y="316" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">answering E&lt;n&gt;</text>
  <text x="816" y="334" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">or ticket unhold</text>
  <text x="40" y="374" font-size="13" fill="#633806" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopped by User (J&lt;n&gt;)</text>
  <text x="40" y="392" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">also: wound down by User</text>
  <rect x="283" y="353" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="371" y="353" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="459" y="353" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="547" y="353" width="82" height="50" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <rect x="635" y="353" width="82" height="50" rx="6" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="723" y="353" width="82" height="50" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="816" y="383" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="400">ticket unhold</text>
  <text x="764.0" y="426" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="400">frozen</text>
  <text x="40" y="426" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">Gray column: a hold left on delivered or abandoned stays, and cannot be changed.</text>
  <path d="M586,279 L416,279" fill="none" stroke="#C58B2E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahp)"/>
  <text x="500" y="247" font-size="13" fill="#854F0B" text-anchor="middle" font-weight="400">for example,</text>
  <text x="500" y="260" font-size="13" fill="#854F0B" text-anchor="middle" font-weight="400">a reopen</text>
  <text x="500" y="273" font-size="13" fill="#854F0B" text-anchor="middle" font-weight="400">carries it</text>
</svg>
