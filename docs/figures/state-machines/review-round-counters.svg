<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A bar and the row count different things</title>
  <desc>Timeline of ticket #003. Two review bars run while the own row stays in-review: reviewBarRound 1, then 2 after a granted round. Both bars end delivered and their verdicts, round-requested and released, sit in review-recorded log records. Later User runs ticket rereview twice: the row reads re-review with reviewRound 2 then 3, and no bar is filed unless --start-review is given.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A bar and the row count different things</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Ticket #003 over time: reviewBarRound moves with a granted round, reviewRound only with ticket rereview</text>
  <text x="40" y="132" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Own row</text>
  <text x="40" y="148" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">the ticket's bar</text>
  <rect x="130" y="106" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="275" y="135" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <rect x="424" y="106" width="106" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="126" font-size="13" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">re-review</text>
  <text x="477" y="144" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">reviewRound 2</text>
  <rect x="534" y="106" width="106" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="587" y="126" font-size="13" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">re-review</text>
  <text x="587" y="144" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">reviewRound 3</text>
  <text x="40" y="204" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Review bars</text>
  <text x="40" y="220" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">a row each</text>
  <rect x="130" y="180" width="142" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="201" y="201" font-size="12" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewBarRound 1</text>
  <text x="201" y="220" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="400">ends delivered</text>
  <path d="M201,242 L201,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="278" y="180" width="142" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="349" y="201" font-size="12" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewBarRound 2</text>
  <text x="349" y="220" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="400">ends delivered</text>
  <path d="M349,242 L349,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="40" y="306" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Log</text>
  <text x="40" y="322" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">the verdicts</text>
  <rect x="130" y="282" width="142" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="201" y="303" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">review-recorded</text>
  <text x="201" y="322" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">round-requested</text>
  <rect x="278" y="282" width="142" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="349" y="303" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">review-recorded</text>
  <text x="349" y="322" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">released</text>
  <path d="M477,196 L477,156" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <path d="M587,196 L587,156" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="532" y="214" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket rereview, twice</text>
  <text x="532" y="229" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">no bar unless --start-review</text>
  <path d="M130,366 L640,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="130" y="384" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">time</text>
  <text x="40" y="410" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">A bar says nothing about the result; only the log record says how it went.</text>
</svg>
