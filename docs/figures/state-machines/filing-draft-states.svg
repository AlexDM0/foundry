<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Two facts derive the state; only a question blocks closing</title>
  <desc>A filing draft's state derives from two facts, an open question and a claim. With no open question it is resumable with no claim and researching with one, and claim and release move between the two. An open question makes it waiting, whichever claim holds, and the last answer returns it. A filing draft opens claimed, in researching. Close works only with no open question; abandon works from every state; both delete the file and the log keeps what it became.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="418" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Two facts derive the state; only a question blocks closing</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A filing draft stores no state and reads no clock</text>
  <text x="190" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">no claim</text>
  <text x="370" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">claimed</text>
  <rect x="120" y="136" width="330" height="92" rx="10" fill="none" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="40" y="178" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">no open</text>
  <text x="40" y="195" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">question</text>
  <text x="40" y="298" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">question</text>
  <text x="40" y="315" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">open</text>
  <rect x="134" y="154" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="187" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">resumable</text>
  <rect x="322" y="154" width="116" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="380" y="187" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">researching</text>
  <path d="M246,172 L320,172" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="283" y="166" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">claim</text>
  <path d="M322,194 L248,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="285" y="208" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">release</text>
  <path d="M410,112 L410,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="418" y="128" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">opened, claimed</text>
  <rect x="134" y="272" width="304" height="60" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="286" y="297" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">waiting</text>
  <text x="286" y="316" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="400">claim and release still work</text>
  <path d="M262,228 L262,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="254" y="253" font-size="11" fill="#73726c" text-anchor="end" font-weight="400">a question opens</text>
  <path d="M310,272 L310,230" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="318" y="247" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">last answer:</text>
  <text x="318" y="260" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">back by the claim</text>
  <rect x="530" y="190" width="110" height="100" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585" y="234" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">file deleted</text>
  <text x="585" y="253" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">log keeps it</text>
  <path d="M450,212 L528,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="490" y="204" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">close</text>
  <text x="490" y="226" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">or abandon</text>
  <path d="M438,302 L500,302 L500,270 L528,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="318" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">abandon only</text>
  <text x="40" y="380" font-size="12" fill="#73726c" text-anchor="start" font-weight="400">Close is refused with draft-has-open-questions while any question is open; abandon checks nothing.</text>
</svg>
