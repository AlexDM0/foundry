<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A ticket walks one straight path; the rest are named exits</title>
  <desc>The main path runs draft, pending, in-progress, in-review, reviewed, delivered. User readies a draft ticket; from pending on, code moves the forward path. A merge on a group branch stops at reviewed; a main-line merge passes through reviewed to delivered in one lock hold. A review that finds a false claim returns in-review to in-progress. In amber, ticket reopen returns a ticket to pending from in-progress, in-review, reviewed, delivered or abandoned. ticket abandon leaves from every open status.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="638" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A ticket walks one straight path; the rest are named exits</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Gray edges name the code that moves them; amber edges are verbs User runs</text>
  <path d="M280.0,138 L280.0,168" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="294.0" y="152" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">readyDraftTickets</text>
  <text x="294.0" y="165" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">ticket ready or a decision</text>
  <path d="M280.0,218 L280.0,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294.0" y="232" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">applyObservation</text>
  <text x="294.0" y="245" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">a build job launches</text>
  <path d="M280.0,298 L280.0,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294.0" y="312" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">settleGate</text>
  <text x="294.0" y="325" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">the gate passed</text>
  <path d="M280.0,378 L280.0,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294.0" y="392" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">landOnTheBoard</text>
  <text x="294.0" y="405" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">a merge landed</text>
  <path d="M280.0,458 L280.0,488" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294.0" y="472" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">releaseTickets</text>
  <text x="294.0" y="485" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">the same merge on the main line, or a release</text>
  <rect x="190" y="90" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="280.0" y="112.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">draft</text>
  <text x="280.0" y="129.0" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="400">User readies it</text>
  <rect x="190" y="170" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280.0" y="192.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pending</text>
  <text x="280.0" y="209.0" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="400">waits for a launch</text>
  <rect x="190" y="250" width="180" height="48" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="280.0" y="272.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <text x="280.0" y="289.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="400">a builder works</text>
  <rect x="190" y="330" width="180" height="48" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="280.0" y="352.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <text x="280.0" y="369.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="400">a reviewer, then a queue</text>
  <rect x="190" y="410" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="280.0" y="432.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">reviewed</text>
  <text x="280.0" y="449.0" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="400">landed, not yet on main</text>
  <rect x="190" y="490" width="180" height="48" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="280.0" y="512.0" font-size="14" fill="#27500A" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <text x="280.0" y="529.0" font-size="12" fill="#3B6D11" text-anchor="middle" font-weight="400">on the main line</text>
  <path d="M370,342 L396,342 L396,286 L372,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="404" y="304" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">settleReviewPass</text>
  <text x="404" y="318" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">a claim proved false</text>
  <path d="M190,274 L118,274" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M190,354 L118,354" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M190,434 L118,434" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M190,514 L118,514" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M118,514 L118,194 L188,194" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="110" y="234" font-size="11" fill="#73726c" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket</text>
  <text x="110" y="247" font-size="11" fill="#73726c" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">reopen</text>
  <path d="M370,114 L565,114" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M370,194 L565,194" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M370,274 L565,274" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M370,354 L565,354" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M370,434 L565,434" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <path d="M565,114 L565,488" fill="none" stroke="#C58B2E" stroke-width="1.6" marker-end="url(#ahp)"/>
  <text x="573" y="134" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">ticket</text>
  <text x="573" y="147" font-size="11" fill="#73726c" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">abandon</text>
  <text x="573" y="162" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">needs a</text>
  <text x="573" y="175" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">reason</text>
  <rect x="490" y="490" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="565.0" y="512.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">abandoned</text>
  <text x="565.0" y="529.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">no more work</text>
  <path d="M565,538 L565,568 L118,568 L118,514" fill="none" stroke="#C58B2E" stroke-width="1.6"/>
  <text x="345" y="584" font-size="11" fill="#73726c" text-anchor="middle" font-weight="400">ticket reopen also leaves abandoned</text>
</svg>
