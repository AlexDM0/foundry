<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every status change goes through one of six doors; an override opens only legality</title>
  <desc>Six routes change a ticket's status. moveTicket's seven checks run for ticket reopen, ticket abandon and the Overseer's moves through moveTicket. ticket status drops only the legality check. ticket deliver --by-hand drops it too, takes no --tokens, and adds two refusals of its own. readyDraftTickets, releaseTickets and filing run none of the seven and have their own test.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every status change goes through one of six doors; an override opens only legality</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Filled: moveTicket runs that check on this route. The numbers follow the checks list above</text>
  <rect x="457" y="88" width="54" height="306" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="316.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">1</text>
