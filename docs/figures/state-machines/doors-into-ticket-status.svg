  <text x="40" y="239" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ticket deliver --by-hand</text>
  <text x="40" y="256" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">takes no --tokens</text>
  <rect x="296" y="230" width="42" height="26" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
