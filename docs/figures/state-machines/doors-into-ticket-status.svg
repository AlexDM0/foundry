  <text x="372.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">2</text>
  <text x="372.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">to draft</text>
  <text x="428.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">3</text>
  <text x="428.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">of draft</text>
  <text x="484.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">4</text>
  <text x="484.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">legal</text>
  <text x="540.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">5</text>
  <text x="540.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">reason</text>
  <text x="596.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">6</text>
  <text x="596.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">release</text>
  <text x="652.0" y="108" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500">7</text>
  <text x="652.0" y="125" font-size="13" fill="#73726c" text-anchor="middle" font-weight="400">tokens</text>
  <text x="696" y="108" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500">Its own check</text>
  <text x="40" y="155" font-size="13" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ticket reopen, ticket abandon</text>
