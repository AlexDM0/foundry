<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Runtime state and stored state are two independent facts</title>
  <desc>Four runtime states across, serving, held-by-install-change, passing-baton and down, against stored running and paused. Serving plus running launches, resumes, opens an Airlock slot and takes commands. Serving plus paused stops only new work and new Airlock slots. Held refuses control commands and stops new work and resumes whatever is stored, and the stored value decides only whether an Airlock slot opens. Passing-baton is a label over serving or held-by-install-change, so everything stays as before the Baton pass until the Overseer lets go, except that the 423 guard stops applying. Down has no Pass and no API whatever is stored, and CLI verbs still write the board.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#854F0B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="518" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Runtime state and stored state are two independent facts</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Across: what the process is doing. Down: what the board stores. Each cell: new work, resumes, Airlock slot, API commands</text>
  <text x="266" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">serving</text>
  <text x="466" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">held-by-install-change</text>
  <text x="666" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">passing-baton</text>
  <text x="866" y="104" font-size="13" fill="#3d3d3a" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">down</text>
  <text x="40" y="194" font-size="14" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <text x="40" y="214" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">stored</text>
  <rect x="170" y="118" width="192" height="168" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="184" y="158" font-size="13" fill="#27500A" text-anchor="start" font-weight="500">New work launches</text>
  <text x="184" y="190" font-size="13" fill="#3B6D11" text-anchor="start" font-weight="400">Resumes run</text>
  <text x="184" y="222" font-size="13" fill="#3B6D11" text-anchor="start" font-weight="400">Airlock slot opens</text>
  <text x="184" y="254" font-size="13" fill="#3B6D11" text-anchor="start" font-weight="400">API takes commands</text>
  <rect x="370" y="118" width="192" height="168" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="384" y="158" font-size="13" fill="#633806" text-anchor="start" font-weight="500">New work waits</text>
  <text x="384" y="190" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">Resumes wait</text>
  <text x="384" y="222" font-size="13" fill="#633806" text-anchor="start" font-weight="500">Airlock slot opens</text>
  <text x="384" y="254" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">Only stop and restart taken</text>
  <text x="40" y="372" font-size="14" fill="#3d3d3a" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">paused</text>
  <text x="40" y="392" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">stored</text>
  <rect x="170" y="296" width="192" height="168" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="184" y="336" font-size="13" fill="#633806" text-anchor="start" font-weight="500">New work waits</text>
  <text x="184" y="368" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">Resumes run</text>
  <text x="184" y="400" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">No new Airlock slot</text>
  <text x="184" y="432" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">API takes commands</text>
  <rect x="370" y="296" width="192" height="168" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="384" y="336" font-size="13" fill="#633806" text-anchor="start" font-weight="500">New work waits</text>
  <text x="384" y="368" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">Resumes wait</text>
  <text x="384" y="400" font-size="13" fill="#633806" text-anchor="start" font-weight="500">No new Airlock slot</text>
  <text x="384" y="432" font-size="13" fill="#854F0B" text-anchor="start" font-weight="400">Only stop and restart taken</text>
  <rect x="570" y="118" width="192" height="346" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="584" y="158" font-size="13" fill="#0C447C" text-anchor="start" font-weight="500">As before the Baton pass,</text>
  <text x="584" y="177" font-size="13" fill="#0C447C" text-anchor="start" font-weight="500">until the Overseer lets go</text>
  <text x="584" y="215" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">Launches, resumes and</text>
  <text x="584" y="234" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">Airlock slots follow the</text>
  <text x="584" y="253" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">state under the label.</text>
  <text x="584" y="291" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">The 423 guard stops</text>
  <text x="584" y="310" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">applying, so API</text>
  <text x="584" y="329" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">commands are taken</text>
  <text x="584" y="348" font-size="13" fill="#185FA5" text-anchor="start" font-weight="400">until the listener closes.</text>
  <rect x="770" y="118" width="192" height="346" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="784" y="158" font-size="13" fill="#444441" text-anchor="start" font-weight="500">Stored value has no effect</text>
  <text x="784" y="206" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">Nothing launches</text>
  <text x="784" y="230" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">Nothing resumes</text>
  <text x="784" y="254" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">No Airlock slot opens</text>
  <text x="784" y="278" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">No API; CLI verbs still write</text>
  <text x="40" y="482" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">passing-baton is a label over serving or held-by-install-change: an install change keeps stopping launches and resumes.</text>
  <text x="40" y="500" font-size="13" fill="#73726c" text-anchor="start" font-weight="400">A Baton pass that fails before the Overseer lets go keeps driving, and the label returns to the Pass's own state.</text>
</svg>
