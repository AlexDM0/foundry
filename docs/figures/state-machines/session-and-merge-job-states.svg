<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Neither a session job nor a merge job walks the build path</title>
  <desc>Left: an assistant or product-owner job stays running after a result and ends closed only once its input was closed and its Watcher is gone. Right: a merge job moves launching to merging and stays merging while airlock.phase moves, then ends landed, integrated, refreshed, failed or stopped.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="444" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Neither a session job nor a merge job walks the build path</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A session job survives its result; a merge job stays in one state</text>
  <text x="175" y="104" font-size="14" fill="#3d3d3a" text-anchor="middle" font-weight="500">Session job</text>
  <text x="490" y="104" font-size="14" fill="#3d3d3a" text-anchor="middle" font-weight="500">Merge job</text>
  <rect x="95" y="120" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175.0" y="147.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <path d="M175,164 L175,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="95" y="196" width="160" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="175.0" y="219.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <text x="175.0" y="236.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="400">a turn ends here</text>
  <path d="M255,212 L285,212 L285,232 L257,232" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="293" y="219" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">result:</text>
  <text x="293" y="232" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">stays</text>
  <path d="M175,246 L175,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="183" y="268" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">input closed</text>
  <rect x="95" y="284" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175.0" y="311.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">stopping</text>
  <path d="M175,328 L175,370" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="183" y="361" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">Watcher gone</text>
  <rect x="95" y="372" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="175.0" y="399.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ended: closed</text>
  <rect x="410" y="120" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="147.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <path d="M490,164 L490,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="498" y="183" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">claim of the Airlock</text>
  <rect x="370" y="196" width="240" height="148" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490" y="220" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merging</text>
  <text x="490" y="238" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="400">job state stays here</text>
  <text x="384" y="262" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">airlock.phase moves:</text>
  <rect x="384" y="268" width="100" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="434.0" y="282" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">merge-in</text>
  <rect x="492" y="268" width="104" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="544.0" y="282" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">resolving</text>
  <rect x="384" y="292" width="212" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="490.0" y="306" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">reviewing-resolution</text>
  <rect x="384" y="316" width="64" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="416.0" y="330" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <rect x="456" y="316" width="64" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="488.0" y="330" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fixing</text>
  <rect x="528" y="316" width="68" height="20" rx="4" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="562.0" y="330" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">landing</text>
  <path d="M490,344 L490,370" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="498" y="361" font-size="11" fill="#73726c" text-anchor="start" font-weight="400">the Airlock finishes</text>
  <rect x="410" y="372" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="490.0" y="399.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ended</text>
</svg>
