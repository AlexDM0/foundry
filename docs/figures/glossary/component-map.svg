<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Most of the twelve names sit on one ticket's path</title>
  <desc>Most of the twelve names sit on one path from User to the main line. User works through the Bridge. Inside the Overseer the Pass runs the Playbook and launches a Watcher holding a session, whose requests pass the Hatch and the Bouncer and whose result passes Customs and the Airlock. Beside that path the Assistant takes incidents, and the Baton and Regrouping act across Overseer restarts.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="674" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Most of the twelve names sit on one ticket's path</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Follow the arrows from User to the main line; the rest act beside it</text>

  <!-- containers -->
  <rect x="40" y="186" width="600" height="168" rx="10" fill="#F4F8FD" stroke="#CFE2F6"/>
  <rect x="205" y="412" width="215" height="118" rx="10" fill="#F4F8FD" stroke="#CFE2F6"/>

  <!-- connectors -->
  <path d="M175,118 L223,118" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M286,146 L286,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294" y="170" font-size="11" fill="#73726c">controls</text>
  <path d="M572,186 L572,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="564" y="170" font-size="11" fill="#73726c" text-anchor="end">incidents</text>

  <path d="M400,228 L428,228" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M400,312 L438,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M240,228 L214,228 L214,410" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="206" y="386" font-size="11" fill="#73726c" text-anchor="end">launches</text>
  <path d="M228,412 L228,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="236" y="386" font-size="11" fill="#73726c">events</text>
  <path d="M390,460 L390,342" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="398" y="386" font-size="11" fill="#73726c">session ends</text>

  <path d="M222,488 L182,488" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M130,460 L130,342" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="122" y="386" font-size="11" fill="#73726c" text-anchor="end">requests</text>
  <path d="M545,340 L545,458" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="553" y="386" font-size="11" fill="#73726c">lands</text>

  <!-- row 1 -->
  <rect x="40" y="90" width="135" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="107" y="114" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
  <text x="107" y="132" font-size="12" fill="#854F0B" text-anchor="middle">runs the board</text>

  <rect x="225" y="90" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="114" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bridge</text>
  <text x="335" y="132" font-size="12" fill="#185FA5" text-anchor="middle">the browser client</text>

  <rect x="495" y="90" width="145" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="567" y="114" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Assistant</text>
  <text x="567" y="132" font-size="12" fill="#993C1D" text-anchor="middle">a session taking incidents</text>

  <!-- inside the Overseer -->
  <text x="60" y="226" font-size="14" font-weight="500" fill="#0C447C">Overseer</text>
  <text x="60" y="244" font-size="12" fill="#185FA5">one process per board</text>

  <rect x="240" y="200" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="320" y="224" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass</text>
  <text x="320" y="242" font-size="12" fill="#185FA5" text-anchor="middle">its repeating loop</text>

  <rect x="430" y="200" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="525" y="224" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Playbook</text>
  <text x="525" y="242" font-size="12" fill="#185FA5" text-anchor="middle">picks each next step</text>

  <rect x="60" y="284" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130" y="308" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer</text>
  <text x="130" y="326" font-size="12" fill="#185FA5" text-anchor="middle">allows by job role</text>

  <rect x="240" y="284" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="320" y="308" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <text x="320" y="326" font-size="12" fill="#185FA5" text-anchor="middle">verifies what sessions left</text>

  <rect x="440" y="284" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="530" y="308" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
  <text x="530" y="326" font-size="12" fill="#185FA5" text-anchor="middle">one merge per target</text>

  <!-- outside the Overseer -->
  <rect x="60" y="460" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="120" y="484" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch</text>
  <text x="120" y="502" font-size="12" fill="#5F5E5A" text-anchor="middle">a folder of requests</text>

  <text x="312" y="433" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <text x="312" y="450" font-size="12" fill="#185FA5" text-anchor="middle">holds one session</text>
  <rect x="222" y="460" width="182" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="313" y="484" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">agent session</text>
  <text x="313" y="502" font-size="12" fill="#993C1D" text-anchor="middle">builds or reviews</text>

  <rect x="470" y="460" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="545" y="484" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">main line</text>
  <text x="545" y="502" font-size="12" fill="#3B6D11" text-anchor="middle">the work landed</text>

  <!-- across restarts -->
  <rect x="40" y="556" width="600" height="96" rx="10" fill="none" stroke="#E1DDD0"/>
  <text x="60" y="598" font-size="14" font-weight="500" fill="#444441">Across restarts</text>
  <text x="60" y="616" font-size="12" fill="#5F5E5A">of the Overseer</text>

  <rect x="197" y="576" width="196" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="295" y="600" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Baton</text>
  <text x="295" y="618" font-size="12" fill="#5F5E5A" text-anchor="middle">names the one live Overseer</text>

  <rect x="415" y="576" width="205" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="517" y="600" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Regrouping</text>
  <text x="517" y="618" font-size="12" fill="#185FA5" text-anchor="middle">reattaches the live Watchers</text>
</svg>
