<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The most imported package imports nothing</title>
  <desc>The twelve src/lib packages, each circle sized by the shipping imports reaching it from outside the package at commit 70ce56de. tracker-model, with 360, dwarfs the rest and has no arrow to any package. Only claude-code, git, watcher and versioned-registry import another package, eight pairs in all, the heaviest being claude-code to agent-launch at 7 imports; the other eight packages depend on no other package.</desc>
