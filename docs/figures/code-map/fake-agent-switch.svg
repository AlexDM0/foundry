<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A spawned process cannot be injected, so the binary chooses</title>
  <desc>A spec spawns the binary through CliProcess.ts with FAKE_AGENT_SWITCHES set, and in the child agentAdapterOfThisProcess forks on fakeAgentIsOn. Off, as in a real run, it takes CLAUDE_CODE_ADAPTER; on, it takes FakeAgentAdapter, which starts FakeAgentChild by path. A spawned binary cannot be injected, so it must choose its own adapter.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="422" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A spawned process cannot be injected, so the binary chooses</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The fork sits in shipping code, and the switch decides which side a spawned spec gets</text>
  <path d="M196,92 L196,404" fill="none" stroke="#E1DDD0" stroke-width="1"/>
  <text x="182" y="104" font-size="12" fill="#5F5E5A" text-anchor="end">test process</text>
  <text x="210" y="104" font-size="12" fill="#5F5E5A">spawned binary</text>
  <rect x="40" y="216" width="140" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="110.0" y="242.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CliProcess.ts</text>
  <text x="110.0" y="260.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">FAKE_AGENT_SWITCHES</text>
  <rect x="232" y="216" width="196" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="242.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agentAdapterOfThisProcess</text>
  <text x="330.0" y="260.0" font-size="12" fill="#185FA5" text-anchor="middle">forks on fakeAgentIsOn</text>
  <path d="M180,246 L230,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="205" y="238" font-size="11" fill="#73726c" text-anchor="middle">sets</text>
  <rect x="470" y="112" width="170" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="141.5" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE_CODE_ADAPTER</text>
  <rect x="470" y="190" width="170" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="555.0" y="211.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Vendor session</text>
  <text x="555.0" y="229.0" font-size="12" fill="#993C1D" text-anchor="middle">a real run</text>
  <rect x="470" y="262" width="170" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="283.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">FakeAgentAdapter</text>
  <text x="555.0" y="301.0" font-size="11" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">src/testing/</text>
  <rect x="470" y="340" width="170" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="555.0" y="361.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">FakeAgentChild</text>
  <text x="555.0" y="379.0" font-size="12" fill="#993C1D" text-anchor="middle">scripted session</text>
  <path d="M330,216 C330,160 400,137 468,137" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="335" y="150" font-size="11" fill="#73726c" text-anchor="end">switch off: spawned</text>
  <text x="335" y="164" font-size="11" fill="#73726c" text-anchor="end">specs never take this</text>
  <path d="M330,276 C330,300 400,287 468,287" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="342" y="312" font-size="11" fill="#73726c">switch on</text>
  <path d="M555,162 L555,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M555,312 L555,338" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="563" y="329" font-size="11" fill="#73726c">by path</text>
</svg>
