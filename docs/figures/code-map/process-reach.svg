<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>What a test must control enters through two files</title>
  <desc>Process facts enter through Environment.ts and CommandContext. Commands take the context, pass values to services and return or throw, and runCommandLine turns that into the exit code for agent-progress.ts. A spec swaps in a captured context, and watcher.ts stays outside the funnel with its own clock.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="518" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">What a test must control enters through two files</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A spec supplies its own context, so a whole command runs inside a test</text>
  <rect x="40" y="92" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="114" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">process.env</text>
  <rect x="40" y="140" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="162" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Date</text>
  <rect x="40" y="188" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="210" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">process.cwd</text>
  <rect x="40" y="236" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="258" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">homedir</text>
  <rect x="40" y="284" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="306" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">streams, stdin</text>
  <rect x="40" y="332" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="354" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">vendor adapter</text>
  <rect x="222" y="86" width="150" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="297.0" y="106.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Environment.ts</text>
  <text x="297.0" y="124.0" font-size="12" fill="#185FA5" text-anchor="middle">documented getters</text>
  <rect x="222" y="190" width="150" height="128" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="297.0" y="250.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CommandContext</text>
  <text x="297.0" y="268.0" font-size="12" fill="#185FA5" text-anchor="middle">one value per run</text>
  <rect x="440" y="86" width="192" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536.0" y="107.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-progress.ts</text>
  <text x="536.0" y="125.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">process.exit(code)</text>
  <rect x="440" y="166" width="192" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536.0" y="187.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">runCommandLine</text>
  <text x="536.0" y="205.0" font-size="12" fill="#185FA5" text-anchor="middle">cli/Main.ts decides the code</text>
  <rect x="428" y="241" width="212" height="145" rx="12" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="440" y="246" width="192" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536.0" y="267.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Commands</text>
  <text x="536.0" y="285.0" font-size="12" fill="#185FA5" text-anchor="middle">take the context, return nothing</text>
  <rect x="440" y="326" width="192" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536.0" y="347.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Services</text>
  <text x="536.0" y="365.0" font-size="12" fill="#185FA5" text-anchor="middle">receive values, not the context</text>
  <rect x="222" y="342" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="297.0" y="363.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Spec</text>
  <text x="297.0" y="381.0" font-size="12" fill="#5F5E5A" text-anchor="middle">captured context</text>
  <path d="M168,110 L220,110" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M297,134 L297,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M168,158 C196,158 196,210 220,210" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M168,206 C186,206 196,232 220,232" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M168,254 L220,254" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M168,302 C186,302 196,276 220,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M168,350 C196,350 196,298 220,298" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M297,342 L297,320" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="305" y="335" font-size="11" fill="#73726c">swaps</text>
  <path d="M372,284 L438,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="378" y="277" font-size="11" fill="#73726c">passed</text>
  <path d="M372,110 C404,110 414,126 414,150 L414,246 C414,252 418,254 426,254" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="380" y="102" font-size="11" fill="#73726c">reads</text>
  <path d="M536,246 L536,218" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="544" y="236" font-size="11" fill="#73726c">returns or throws</text>
  <path d="M536,166 L536,138" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="544" y="156" font-size="11" fill="#73726c">exit code</text>
  <path d="M536,296 L536,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="544" y="314" font-size="11" fill="#73726c">values</text>
  <path d="M40,412 L640,412" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="40" y="432" font-size="12" fill="#5F5E5A">Second binary, outside the funnel</text>
  <rect x="40" y="454" width="128" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="104" y="476" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Date</text>
  <rect x="440" y="444" width="192" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536.0" y="468.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">watcher.ts</text>
  <text x="536.0" y="486.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">process.exit(code)</text>
  <path d="M168,472 L438,472" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="299" y="464" font-size="11" fill="#73726c" text-anchor="middle">the only clock it uses, passed to runWatcher</text>
</svg>
