<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only two services compose the others</title>
  <desc>overseer imports control, tracker, lifecycle and render, and control imports tracker and lifecycle, with the edge count on each arrow at commit 70ce56de. render, tracker and lifecycle import no other service. Dashed arrows from lifecycle to tracker and from tracker to render are imports the layer order allows and nothing makes, so the order is a permission, not a call chain.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only two services compose the others</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Arrows are shipping imports, with their count; dashed ones are allowed and never made</text>
