  <path d="M348,148 L262,320" fill="none" stroke="#bfbdb0" stroke-width="3.6" marker-end="url(#ah)"/>
  <path d="M390,148 L390,204" fill="none" stroke="#bfbdb0" stroke-width="2.0" marker-end="url(#ah)"/>
  <path d="M432,148 L518,320" fill="none" stroke="#bfbdb0" stroke-width="4.0" marker-end="url(#ah)"/>
  <path d="M362,262 L302,320" fill="none" stroke="#bfbdb0" stroke-width="4.4" marker-end="url(#ah)"/>
  <path d="M418,262 L478,320" fill="none" stroke="#bfbdb0" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M440,348 L342,348" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M220,348 C190,348 180,310 180,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="330" y="92" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="390.0" y="116.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">overseer</text>
  <text x="390.0" y="134.0" font-size="12" fill="#185FA5" text-anchor="middle">calls four services</text>
  <rect x="330" y="206" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="390.0" y="230.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">control</text>
  <text x="390.0" y="248.0" font-size="12" fill="#185FA5" text-anchor="middle">calls two services</text>
  <rect x="120" y="206" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="180.0" y="230.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">render</text>
  <text x="180.0" y="248.0" font-size="12" fill="#185FA5" text-anchor="middle">imports no service</text>
