<svg xmlns="http://www.w3.org/2000/svg" width="680" height="454" viewBox="0 0 680 454" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Browser-safe code is proved by compiling it where Node does not exist</title>
  <desc>tsconfig.json holds the binaries, cli and src with Bun types. bridge/tsconfig.json holds the shipping Bridge with the DOM library and no ambient types, and bridge/tsconfig.spec.json contains it and adds 69 Bridge test files plus 306 src and cli files reached by imports, under Bun types. The tracker model and four named files sit in all three, so they compile with and without Bun types and depend on neither world.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="452" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Browser-safe code is proved by compiling it where Node does not exist</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three programs in <tspan font-family="ui-monospace,Menlo,Consolas,monospace">bun run typecheck</tspan>; the green overlap compiles under both worlds</text>
  <rect x="232" y="88" width="408" height="346" rx="12" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="628" y="110" font-size="12" font-weight="500" fill="#444441" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">bridge/tsconfig.spec.json</text>
  <text x="628" y="127" font-size="12" fill="#5F5E5A" text-anchor="end">Bun types</text>
  <text x="628" y="144" font-size="12" fill="#5F5E5A" text-anchor="end">243 files named, 549 compiled</text>
  <text x="436" y="398" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">*.spec.ts  *.dom.tsx  bridge/testing/</text>
  <text x="436" y="416" font-size="12" fill="#5F5E5A" text-anchor="middle">The Bridge&#x27;s 69 test files, in no other program</text>
  <rect x="246" y="226" width="380" height="136" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="614" y="248" font-size="12" font-weight="500" fill="#0C447C" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">bridge/tsconfig.json</text>
  <text x="614" y="265" font-size="12" fill="#185FA5" text-anchor="end">DOM library, types: [], 174 files</text>
  <text x="520" y="306" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">bridge/</text>
  <text x="520" y="326" font-size="12" fill="#185FA5" text-anchor="middle">84 shipping modules</text>
  <rect x="40" y="114" width="364" height="262" rx="12" fill="#F1EFE8" fill-opacity="0.45" stroke="#73726c" stroke-width="1.2"/>
  <text x="52" y="136" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">tsconfig.json</text>
  <text x="52" y="153" font-size="12" fill="#5F5E5A">Bun types, no DOM, 750 files</text>
  <text x="52" y="226" font-size="13" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">agent-progress.ts</text>
  <text x="52" y="246" font-size="13" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">watcher.ts</text>
  <text x="52" y="266" font-size="12" fill="#5F5E5A">the rest of cli/, src/</text>
  <text x="52" y="284" font-size="12" fill="#5F5E5A">and their specs</text>
  <text x="52" y="308" font-size="12" fill="#5F5E5A">354 files only here</text>
  <text x="318" y="180" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">306 src/ and cli/ files</text>
  <text x="318" y="198" font-size="12" fill="#5F5E5A" text-anchor="middle">reached by following imports</text>
  <rect x="256" y="238" width="140" height="112" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="326" y="262" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tracker-model</text>
  <text x="326" y="279" font-size="12" fill="#3B6D11" text-anchor="middle">86 modules</text>
  <text x="326" y="302" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">4 named files</text>
  <text x="326" y="322" font-size="12" fill="#3B6D11" text-anchor="middle">compile in both worlds</text>
</svg>
