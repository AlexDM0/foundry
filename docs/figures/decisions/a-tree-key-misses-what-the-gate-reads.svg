<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A tree key misses what the gate reads</title>
  <desc>Two inputs sit inside what a key sees: the tree and the gate line. Four sit outside it: installed dependencies, generated files ignored by git, a binary found on PATH and the toolchain version. A real gate run reads all six, and only the first two reach the stored result. When an outside input changes, the key stays the same, so the stored result passes, a false green, while a real run fails and catches it before landing.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="418" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A tree key misses what the gate reads</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The rejected cache, keyed on the tree and the gate line, after an outside input changed.</text>
  <rect x="40" y="90" width="200" height="136" rx="8" fill="none" stroke="#185FA5"/>
  <text x="52" y="107" font-size="11" fill="#73726c" text-anchor="start">The key sees</text>
  <rect x="52" y="114" width="176" height="46" rx="8" fill="#F1EFE8" stroke="#185FA5"/>
  <text x="140.0" y="134.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">tree</text>
  <text x="140.0" y="152.0" font-size="12" fill="#5F5E5A" text-anchor="middle">every tracked file</text>
  <rect x="52" y="168" width="176" height="46" rx="8" fill="#F1EFE8" stroke="#185FA5"/>
  <text x="140.0" y="188.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">gate line</text>
  <text x="140.0" y="206.0" font-size="12" fill="#5F5E5A" text-anchor="middle">its shell command</text>
  <rect x="256" y="90" width="384" height="136" rx="8" fill="none" stroke="#E1DDD0"/>
  <text x="268" y="107" font-size="11" fill="#73726c" text-anchor="start">The key does not see</text>
  <rect x="268" y="114" width="174" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="355.0" y="134.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">dependencies</text>
  <text x="355.0" y="152.0" font-size="12" fill="#5F5E5A" text-anchor="middle">as installed</text>
  <rect x="454" y="114" width="174" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="541.0" y="134.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">generated files</text>
  <text x="541.0" y="152.0" font-size="12" fill="#5F5E5A" text-anchor="middle">ignored by git</text>
  <rect x="268" y="168" width="174" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="355.0" y="188.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">binary</text>
  <text x="355.0" y="206.0" font-size="12" fill="#5F5E5A" text-anchor="middle">found on PATH</text>
  <rect x="454" y="168" width="174" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="541.0" y="188.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">toolchain</text>
  <text x="541.0" y="206.0" font-size="12" fill="#5F5E5A" text-anchor="middle">its version</text>
  <path d="M120,226 L120,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="128" y="250" font-size="11" fill="#73726c" text-anchor="start">same key</text>
  <path d="M214,226 L214,244 L392,244 L392,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M470,226 L470,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="264" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="140.0" y="287.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Stored result</text>
  <text x="140.0" y="305.0" font-size="12" fill="#5F5E5A" text-anchor="middle">found by the same key</text>
  <rect x="340" y="264" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="470.0" y="287.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Real gate run</text>
  <text x="470.0" y="305.0" font-size="12" fill="#185FA5" text-anchor="middle">reads all six</text>
  <path d="M140,316 L140,346" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M470,316 L470,346" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="348" width="200" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="140.0" y="371.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Stored result: passes</text>
  <text x="140.0" y="389.0" font-size="12" fill="#A32D2D" text-anchor="middle">a false green</text>
  <rect x="340" y="348" width="260" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="470.0" y="371.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Real run: fails</text>
  <text x="470.0" y="389.0" font-size="12" fill="#3B6D11" text-anchor="middle">caught before landing</text>
</svg>
