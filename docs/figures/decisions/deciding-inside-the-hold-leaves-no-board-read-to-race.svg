<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Deciding inside the lock hold leaves no Board read to race</title>
  <desc>An outside driver reads status --json with no lock and decides with no lock held. A verb of User's takes its own lock hold in the gap and moves the board, then the driver's verb runs in a later lock hold on the old read, so it acts on a stale read. The Overseer observes and runs effects with no lock, but reads the Board, steps the Playbook and writes every file inside one lock hold, so its decision is made on the Board as held.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="548" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Deciding inside the lock hold leaves no Board read to race</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs left to right. A shaded band means the lock is held.</text>
  <text x="40" y="96" font-size="11" fill="#73726c" text-anchor="start">The alternative: a separate driver over the CLI</text>
  <rect x="316" y="106" width="148" height="80" rx="8" fill="#ECE7DC"/>
  <text x="328" y="123" font-size="11" fill="#73726c" text-anchor="start">lock held</text>
  <rect x="328" y="130" width="124" height="46" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="390.0" y="150.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User verb</text>
  <text x="390.0" y="168.0" font-size="12" fill="#854F0B" text-anchor="middle">moves the board</text>
  <path d="M390,186 L390,227" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="40" y="208" width="136" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="108.0" y="231.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read, no lock</text>
  <text x="108.0" y="249.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">status --json</text>
  <path d="M176,234 L190,234" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="192" y="208" width="104" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="244.0" y="231.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Decide</text>
  <text x="244.0" y="249.0" font-size="12" fill="#185FA5" text-anchor="middle">no lock</text>
  <path d="M296,234 L474,234" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="385" y="251" font-size="11" fill="#73726c" text-anchor="middle">the gap</text>
  <rect x="476" y="186" width="164" height="86" rx="8" fill="#ECE7DC"/>
  <text x="488" y="203" font-size="11" fill="#73726c" text-anchor="start">lock held</text>
  <rect x="488" y="208" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="558.0" y="231.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Driver verb</text>
  <text x="558.0" y="249.0" font-size="12" fill="#185FA5" text-anchor="middle">on the old read</text>
  <path d="M558,272 L558,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="292" width="240" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="520.0" y="315.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Acts on a stale read</text>
  <text x="520.0" y="333.0" font-size="12" fill="#A32D2D" text-anchor="middle">the board moved</text>
  <text x="40" y="378" font-size="11" fill="#73726c" text-anchor="start">As built: the Overseer</text>
  <rect x="40" y="408" width="88" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="84.0" y="431.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Observe</text>
  <text x="84.0" y="449.0" font-size="12" fill="#185FA5" text-anchor="middle">no lock</text>
  <path d="M128,434 L142,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="144" y="388" width="392" height="84" rx="8" fill="#ECE7DC"/>
  <text x="156" y="405" font-size="11" fill="#73726c" text-anchor="start">lock held</text>
  <rect x="152" y="408" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="208.0" y="439.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read the Board</text>
  <rect x="284" y="408" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="439.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Playbook steps</text>
  <rect x="416" y="408" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="472.0" y="439.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Write every file</text>
  <path d="M264,434 L282,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M396,434 L414,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M536,434 L550,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="552" y="408" width="88" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="596.0" y="431.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Effects</text>
  <text x="596.0" y="449.0" font-size="12" fill="#185FA5" text-anchor="middle">no lock</text>
  <path d="M340,472 L340,490" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="220" y="492" width="240" height="38" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="340.0" y="516.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Decided on the Board as held</text>
</svg>
