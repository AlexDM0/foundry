<svg xmlns="http://www.w3.org/2000/svg" width="680" height="464" viewBox="0 0 680 464" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Four decisions make a lost Overseer cheap</title>
  <desc>Four design decisions each leave what they need on disk: storing current state plus typed history leaves the board and log, thin Watchers leave their job folders, fenced journaled lock holds leave the hold journal, and counting instead of timing leaves counts in the board and log. Together those files are what the next Overseer reads to regroup, and it derives the same steps.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="462" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Four decisions make a lost Overseer cheap</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Nothing the next Pass needs to stay correct lives only in a process.</text>
  <text x="40" y="102" font-size="11" fill="#73726c" text-anchor="start">The decision</text>
  <text x="278" y="102" font-size="11" fill="#73726c" text-anchor="start">What it leaves on disk</text>
  <text x="516" y="102" font-size="11" fill="#73726c" text-anchor="start">What reads it</text>
  <rect x="40" y="114" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="138.0" y="139.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Current state, typed history</text>
  <text x="138.0" y="157.0" font-size="12" fill="#185FA5" text-anchor="middle">one lock hold writes both</text>
  <path d="M236,142 L276,142" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="278" y="114" width="196" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="376.0" y="139.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board and log</text>
  <text x="376.0" y="157.0" font-size="12" fill="#5F5E5A" text-anchor="middle">progress, tickets, log.jsonl</text>
  <path d="M474,142 L514,142" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="186" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="138.0" y="211.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Thin Watchers</text>
  <text x="138.0" y="229.0" font-size="12" fill="#185FA5" text-anchor="middle">agents outlive the Overseer</text>
  <path d="M236,214 L276,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="278" y="186" width="196" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="376.0" y="211.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Watcher job folders</text>
  <text x="376.0" y="229.0" font-size="12" fill="#5F5E5A" text-anchor="middle">Watcher record, event log</text>
  <path d="M474,214 L514,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="258" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="138.0" y="283.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Fenced, journaled lock holds</text>
  <text x="138.0" y="301.0" font-size="12" fill="#185FA5" text-anchor="middle">a cut lock hold gets finished</text>
  <path d="M236,286 L276,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="278" y="258" width="196" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="376.0" y="283.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hold journal</text>
  <text x="376.0" y="301.0" font-size="12" fill="#5F5E5A" text-anchor="middle">every file of the lock hold</text>
  <path d="M474,286 L514,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="330" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="138.0" y="355.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Counts, never durations</text>
  <text x="138.0" y="373.0" font-size="12" fill="#185FA5" text-anchor="middle">a clock decides nothing</text>
  <path d="M236,358 L276,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="278" y="330" width="196" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="376.0" y="355.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Counts in the board and log</text>
  <text x="376.0" y="373.0" font-size="12" fill="#5F5E5A" text-anchor="middle">not stamps to compare</text>
  <path d="M474,358 L514,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="516" y="114" width="124" height="272" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="578" y="232" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Next Overseer</text>
  <text x="578" y="252" font-size="12" fill="#185FA5" text-anchor="middle">regroups, then derives</text>
  <text x="578" y="268" font-size="12" fill="#185FA5" text-anchor="middle">the next steps</text>
  <path d="M578,386 L578,404" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="516" y="406" width="124" height="38" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="578.0" y="430.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Same steps</text>
</svg>
