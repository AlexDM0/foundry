<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A session&#x27;s first line depends on why it started</title>
  <desc>One root question: is this instance past the first? If yes the session runs --resume and the first match wins: an answer waiting gives answerMessageOf, a reopened session gives User&#x27;s text, an interruption on a red handoff gives RedHandoffMessage.md, otherwise ResumeMessage.md. If no, a builder sent back from review gets reviewFindingsMessageOf, also over --resume; otherwise, when an earlier session of the same kind and ticket was replaced, EARLIER_SESSION_NOTE, plus RedHandoffMessage.md on a takeover, is prefixed to the role&#x27;s firstMessage; if not, the firstMessage goes out alone.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="518" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A session&#x27;s first line depends on why it started</text>
  <text x="40" y="68" font-size="13" fill="#73726c">First match wins, top to bottom. Blue decides; gray is the text sent.</text>
  <rect x="350" y="88" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="500.0" y="112.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Instance past the first?</text>
  <text x="500.0" y="130.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">isResumedInstance</text>
  <path d="M350,116 L140,116 L140,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="108" font-size="11" fill="#73726c" text-anchor="start">yes: --resume</text>
  <path d="M610,144 L610,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="620" y="164" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="178" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="202.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Answer waiting?</text>
  <text x="140.0" y="220.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">answerAwaitsDelivery</text>
  <path d="M240,206 L288,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="198" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="290" y="178" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="380.0" y="211.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">answerMessageOf</text>
  <path d="M140,234 L140,256" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="249" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="258" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="282.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Reopened by User?</text>
  <text x="140.0" y="300.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reopenTextOf</text>
  <path d="M240,286 L288,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="278" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="290" y="258" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="380.0" y="291.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">User&#x27;s reopening text</text>
  <path d="M140,314 L140,336" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="329" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="338" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="362.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Red handoff?</text>
  <text x="140.0" y="380.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job.interruption</text>
  <path d="M240,366 L288,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="358" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="290" y="338" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="380.0" y="371.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">RedHandoffMessage.md</text>
  <path d="M140,394 L140,416" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="409" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="418" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="140.0" y="451.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ResumeMessage.md</text>
  <rect x="510" y="178" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="610.0" y="202.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Sent back from review?</text>
  <text x="610.0" y="220.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">sessionOwnerJobIdOf</text>
  <path d="M710,206 L758,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="734" y="198" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="760" y="178" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="202.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reviewFindingsMessageOf</text>
  <text x="860.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">--resume on the owner&#x27;s session</text>
  <path d="M610,234 L610,256" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="620" y="250" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="510" y="258" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="610.0" y="282.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Earlier session replaced?</text>
  <text x="610.0" y="300.0" font-size="12" fill="#185FA5" text-anchor="middle">same kind, same ticket</text>
  <path d="M710,286 L758,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="734" y="278" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="760" y="258" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="282.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">EARLIER_SESSION_NOTE</text>
  <text x="860.0" y="300.0" font-size="12" fill="#5F5E5A" text-anchor="middle">RedHandoffMessage on a takeover</text>
  <path d="M610,314 L610,416" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="620" y="370" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M860,314 L860,446 L712,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="786" y="438" font-size="11" fill="#73726c" text-anchor="middle">prefixed</text>
  <rect x="510" y="418" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="610.0" y="451.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">The role&#x27;s firstMessage</text>
</svg>
