<svg xmlns="http://www.w3.org/2000/svg" width="680" height="482" viewBox="0 0 680 482" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Eight roles fall through five tests into fewer profiles</title>
  <desc>Eight roles on the left enter five tests in first-match order. Product owner stops at the first test and onboarder at the second, each taking the short profileOf plus its wrapper. Resolver, merge-fix and resolution-review all stop at the merge-agent test and share WorkerProfiles.profileOf resolver. The Assistant stops at the no-worktree test and takes the short profileOf. Builder and reviewer reach the last test and take WorkerProfiles.profileOf for their own role.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="480" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Eight roles fall through five tests into fewer profiles</text>
  <text x="40" y="68" font-size="13" fill="#73726c">launchProfileOf, first match wins, top to bottom.</text>
  <text x="115" y="100" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Role</text>
  <text x="325" y="100" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Test</text>
  <text x="540" y="100" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Profile</text>
  <rect x="235" y="112" width="180" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325.0" y="139.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Intake job?</text>
  <text x="325.0" y="157.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">isIntakeJob</text>
  <path d="M325,174 L325,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="333" y="185" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M415,143.0 L443,143.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="235" y="190" width="180" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325.0" y="217.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Onboarder job?</text>
  <text x="325.0" y="235.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">isOnboarderJob</text>
  <path d="M325,252 L325,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="333" y="263" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M415,221.0 L443,221.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="235" y="268" width="180" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325.0" y="295.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge agent?</text>
  <text x="325.0" y="313.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">kind merge-agent</text>
  <path d="M325,330 L325,344" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="333" y="341" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M415,299.0 L443,299.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="235" y="346" width="180" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325.0" y="373.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">No worktree?</text>
  <text x="325.0" y="391.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">isWorktreeJob false</text>
  <path d="M325,408 L325,422" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="333" y="419" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M415,377.0 L443,377.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="235" y="424" width="180" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325.0" y="449.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Otherwise</text>
  <path d="M415,444.0 L443,444.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="112" width="150" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="148.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">product-owner</text>
  <rect x="40" y="190" width="150" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="226.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">onboarder</text>
  <rect x="40" y="268" width="150" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="295.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">resolver, merge-fix,</text>
  <text x="115.0" y="313.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">resolution-review</text>
  <rect x="40" y="346" width="150" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="382.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">assistant</text>
  <rect x="40" y="424" width="150" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="449.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">builder, reviewer</text>
  <path d="M190,143.0 L233,143.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,221.0 L233,221.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,299.0 L233,299.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,377.0 L233,377.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,444.0 L233,444.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="445" y="112" width="195" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="542.5" y="139.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">short profileOf</text>
  <text x="542.5" y="157.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">productOwnerProfileOf</text>
  <rect x="445" y="190" width="195" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="542.5" y="217.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">short profileOf</text>
  <text x="542.5" y="235.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">onboarderProfileOf</text>
  <rect x="445" y="268" width="195" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="542.5" y="295.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">WorkerProfiles.profileOf</text>
  <text x="542.5" y="313.0" font-size="12" fill="#5F5E5A" text-anchor="middle">one resolver profile</text>
  <rect x="445" y="346" width="195" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="542.5" y="373.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">short profileOf</text>
  <text x="542.5" y="391.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no wrapper</text>
  <rect x="445" y="424" width="195" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="542.5" y="449.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">WorkerProfiles.profileOf</text>
</svg>
