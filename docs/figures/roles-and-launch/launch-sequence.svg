<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A launch writes everything to disk before anything runs</title>
  <desc>Seven lanes, time running down. In a lock hold a Playbook step, an Airlock or a command records the job on the board. After the hold, DrivePass reads the instruction files from the data folder or the main line, gets firstMessage and roleBrief from the wording, stores start.json once and the first message, gets a launch plan from the adapter, writes the plan files and launch file to the job folder, and spawns a detached Watcher. The Watcher claims the instance exclusively, opens its socket and spawns claude with no shell. On a later Pass DrivePass finds the Watcher live, sends the first message over the socket, and writes a .sent marker. An Overseer crash before the claim repeats the steps while start.json keeps its first write, a second Watcher exits at the claim, and an unsent message is retried on the next Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
