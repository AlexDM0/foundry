  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A launch writes everything to disk before anything runs</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One job, fresh instance. Each zone says what an Overseer crash there costs.</text>
