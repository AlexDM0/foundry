<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A merge agent&#x27;s task arrives two Passes after its job</title>
  <desc>Three columns for Passes N, N+1 and N+2, each with three effects in order: send first messages, launch Watchers, Airlock sweep. A build job&#x27;s Watcher is spawned in Pass N and its task sent in N+1. A merge agent&#x27;s job is recorded by the sweep at the end of N, its Watcher is spawned in N+1, which that new job forces, and its task is sent in N+2.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="362" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A merge agent&#x27;s task arrives two Passes after its job</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three effects of each Pass, top to bottom, in the earliest case.</text>
  <text x="246.0" y="102" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Pass N</text>
  <text x="408.0" y="102" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Pass N+1, forced</text>
  <text x="570.0" y="102" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">Pass N+2</text>
  <text x="40" y="140" font-size="13" fill="#5F5E5A" text-anchor="start">Send first</text>
  <text x="40" y="157" font-size="13" fill="#5F5E5A" text-anchor="start">messages</text>
  <rect x="176" y="114" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="338" y="114" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="500" y="114" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <text x="40" y="216" font-size="13" fill="#5F5E5A" text-anchor="start">Launch</text>
  <text x="40" y="233" font-size="13" fill="#5F5E5A" text-anchor="start">Watchers</text>
  <rect x="176" y="190" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="338" y="190" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="500" y="190" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <text x="40" y="292" font-size="13" fill="#5F5E5A" text-anchor="start">Airlock</text>
  <text x="40" y="309" font-size="13" fill="#5F5E5A" text-anchor="start">sweep</text>
  <rect x="176" y="266" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="338" y="266" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="500" y="266" width="140" height="60" rx="8" fill="#FAF9F5" stroke="#ECE7DC"/>
  <rect x="176" y="190" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="246.0" y="216.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Build job</text>
  <text x="246.0" y="234.0" font-size="12" fill="#185FA5" text-anchor="middle">Watcher spawned</text>
  <rect x="338" y="114" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="408.0" y="140.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Build job</text>
  <text x="408.0" y="158.0" font-size="12" fill="#185FA5" text-anchor="middle">task sent</text>
  <rect x="176" y="266" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="246.0" y="292.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge agent</text>
  <text x="246.0" y="310.0" font-size="12" fill="#185FA5" text-anchor="middle">job recorded</text>
  <rect x="338" y="190" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="408.0" y="216.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge agent</text>
  <text x="408.0" y="234.0" font-size="12" fill="#185FA5" text-anchor="middle">Watcher spawned</text>
  <rect x="500" y="114" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="570.0" y="140.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge agent</text>
  <text x="570.0" y="158.0" font-size="12" fill="#185FA5" text-anchor="middle">task sent</text>
  <path d="M316,210 L327,210 L327,144 L336,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M316,296 L327,296 L327,230 L336,230" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M478,210 L489,210 L489,144 L498,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
