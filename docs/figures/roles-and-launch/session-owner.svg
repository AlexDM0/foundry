<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A builder sent back is a second job on the first job&#x27;s session</title>
  <desc>A row of four evenly spaced jobs for ticket 003. J7, a build of attempt 1, ends built and starts session S. J8, a review, has a session of its own and sends the ticket back. J9, a build of the same attempt, is a separate job at instance 1 that runs with --resume on session S. J9 ends failed, so J10 is a build of attempt 2 with a session of its own, because no build of its attempt ended built before it.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A builder sent back is a second job on the first job&#x27;s session</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Ticket #003, jobs left to right. Coral is a session, gray a job record.</text>
  <rect x="40" y="160" width="126" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="103.0" y="187.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">J7 build</text>
  <text x="103.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">attempt 1, built</text>
  <rect x="198" y="160" width="126" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="261.0" y="187.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">J8 review</text>
  <text x="261.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">round 1, sent back</text>
  <rect x="356" y="160" width="126" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="419.0" y="187.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">J9 build</text>
  <text x="419.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">attempt 1, instance 1</text>
  <rect x="514" y="160" width="126" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="577.0" y="187.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">J10 build</text>
  <text x="577.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">attempt 2: J9 failed</text>
  <path d="M166,191 L196,191" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M324,191 L354,191" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M482,191 L512,191" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="270" width="442" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="261.0" y="295.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">session S = sessionIdOf(tracker, J7)</text>
  <path d="M103,222 L103,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="113" y="250" font-size="12" fill="#993C1D" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--session-id</text>
  <path d="M419,222 L419,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="429" y="250" font-size="12" fill="#993C1D" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">--resume</text>
  <rect x="198" y="92" width="126" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="261.0" y="115.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">own session</text>
  <path d="M261,160 L261,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="514" y="92" width="126" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="577.0" y="115.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">own session</text>
  <path d="M577,160 L577,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
