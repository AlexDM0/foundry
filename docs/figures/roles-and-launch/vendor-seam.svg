<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A second vendor&#x27;s launch replaces what sits below the port</title>
  <desc>Layers top to bottom. Launch and session code calls the AgentAdapter port, whose six operations are planOf, sessionIdOf, eventsOf, chatLineOf, answerLineOf and interruptLineOf. agentAdapterOfThisProcess in cli/CommandContext.ts chooses the implementation once: CLAUDE_CODE_ADAPTER, or a dashed adapter for another vendor. A band holds what a second vendor replaces: the adapter and its session. The Watcher sits outside the band: the adapter returns the plan to the launch code, which writes it to launch-&lt;n&gt;.json; the Watcher reads that file and exchanges stdin and stdout lines with claude, knowing no vendor.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A second vendor&#x27;s launch replaces what sits below the port</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One function chooses the adapter. Install, Customs and transcripts are separate seams.</text>
  <rect x="40" y="304" width="360" height="236" rx="6" fill="#E1DDD0" stroke="#E1DDD0" fill-opacity="0.4"/>
  <text x="84" y="322" font-size="12" fill="#5F5E5A" text-anchor="start">what a second vendor replaces</text>
  <rect x="40" y="90" width="600" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="117.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Launch and session code</text>
  <text x="340" y="135.0" font-size="12" fill="#185FA5" text-anchor="middle">DrivePass, JobLaunch, JobResumption</text>
  <path d="M190,152 L190,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="180" y="174" font-size="11" fill="#73726c" text-anchor="end">calls</text>
  <path d="M250,188 L250,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="174" font-size="11" fill="#73726c" text-anchor="start">returns plan</text>
  <rect x="40" y="188" width="360" height="84" rx="8" fill="#FAF9F5" stroke="#185FA5"/>
  <text x="220" y="212" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">AgentAdapter, the port</text>
  <text x="220" y="236" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">planOf   sessionIdOf   eventsOf</text>
  <text x="220" y="256" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">chatLineOf   answerLineOf   interruptLineOf</text>
  <rect x="412" y="188" width="194" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="509" y="215.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agentAdapterOfThisProcess</text>
  <text x="509" y="233.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cli/CommandContext.ts</text>
  <path d="M440,250 L440,288 L350,288 L350,334" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="448" y="270" font-size="11" fill="#73726c" text-anchor="start">chooses once</text>
  <path d="M622,152 L622,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="614" y="174" font-size="11" fill="#73726c" text-anchor="end">writes the plan</text>
  <rect x="500" y="292" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="570" y="319" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launch-&lt;n&gt;.json</text>
  <path d="M570,336 L570,372" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="580" y="358" font-size="11" fill="#73726c" text-anchor="start">reads</text>
  <path d="M70,272 L70,334" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="80" y="291" font-size="11" fill="#73726c" text-anchor="start">implements</text>
  <path d="M260,272 L260,334" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="270" y="291" font-size="11" fill="#73726c" text-anchor="start">implements</text>
  <rect x="52" y="336" width="165" height="62" rx="8" fill="#FAF9F5" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="134.5" y="363.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Another adapter</text>
  <text x="134.5" y="381.0" font-size="12" fill="#5F5E5A" text-anchor="middle">same six operations</text>
  <rect x="227" y="336" width="165" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="309.5" y="363.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE_CODE_ADAPTER</text>
  <text x="309.5" y="381.0" font-size="12" fill="#185FA5" text-anchor="middle">renders plan, maps stream</text>
  <rect x="52" y="458" width="165" height="62" rx="8" fill="#FAF9F5" stroke="#F3D2C5" stroke-dasharray="5 4"/>
  <text x="134.5" y="485.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Its session</text>
  <text x="134.5" y="503.0" font-size="12" fill="#993C1D" text-anchor="middle">its own wire format</text>
  <rect x="227" y="458" width="165" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="309.5" y="485.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">claude</text>
  <text x="309.5" y="503.0" font-size="12" fill="#993C1D" text-anchor="middle">stream-json lines</text>
  <rect x="500" y="374" width="140" height="146" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="570.0" y="440.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <text x="570.0" y="458.0" font-size="12" fill="#185FA5" text-anchor="middle">knows no vendor</text>
  <path d="M500,484 L394,484" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M394,502 L498,502" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="406" y="463" font-size="11" fill="#73726c" text-anchor="start">stdin and</text>
  <text x="406" y="476" font-size="11" fill="#73726c" text-anchor="start">stdout lines</text>
</svg>
