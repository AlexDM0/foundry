<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The API, storage and current time enter through one seam</title>
  <desc>Main.tsx supplies real browser services and a DOM spec supplies fakes of the same ten fields. Both reach BridgeApp through BridgeServices, so the app cannot tell them apart.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="348" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The API, storage and current time enter through one seam</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A DOM spec swaps each service for a fake</text>
  <rect x="60" y="90" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190.0" y="115.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">bridge/Main.tsx</text>
  <text x="190.0" y="132.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">real fetch, EventSource, storage</text>
  <rect x="360" y="90" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="490.0" y="115.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">*.dom.tsx</text>
  <text x="490.0" y="132.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">fakes of the same ten fields</text>
  <rect x="60" y="190" width="560" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="213.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BridgeServices</text>
  <text x="340.0" y="230.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">API clients, storage, current time, reload</text>
  <path d="M190,146 L190,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M490,146 L490,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="276" width="300" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="299.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BridgeApp</text>
  <text x="340.0" y="316.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">one state, one route, banners</text>
  <path d="M340,242 L340,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
