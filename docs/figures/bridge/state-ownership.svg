<svg xmlns="http://www.w3.org/2000/svg" width="680" height="428" viewBox="0 0 680 428" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Half-typed text survives a board update but not a tab change</title>
  <desc>Five owners of state against four events: a board update, a tab change, a reload and an Overseer restart on the same port. Server state survives everything, except that a restart loses the Overseer's in-memory facts. The URL is replaced by a tab change and survives the rest. Browser storage survives everything. Shell state and refs survive updates and tab changes and are lost on reload. Component state in a view survives a board update but is lost on a tab change or a reload. Both survive a restart unless new code forces a reload.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="426" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Half-typed text survives a board update but not a tab change</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Five owners against four events; a view unmounts with its tab</text>
  <text x="278" y="104" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">A board update</text>
  <text x="385" y="104" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">A tab change</text>
  <text x="492" y="104" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">A reload</text>
  <text x="599" y="92" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">Overseer restart,</text>
  <text x="599" y="107" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">same port</text>
  <rect x="40" y="116" width="180" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
