  <text x="598.5" y="268.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="40" y="296" width="180" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130.0" y="320.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Refs and shell state</text>
  <text x="130.0" y="337.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">held in BridgeApp</text>
