  <rect x="547" y="296" width="103" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="598.5" y="320.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <text x="598.5" y="337.0" font-size="11" font-weight="400" fill="#3B6D11" text-anchor="middle">unless new code</text>
