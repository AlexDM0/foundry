  <text x="130.0" y="157.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">tickets, log, runtime facts</text>
  <rect x="226" y="116" width="103" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="277.5" y="148.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="333" y="116" width="103" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="384.5" y="148.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="440" y="116" width="103" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="491.5" y="148.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="547" y="116" width="103" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="598.5" y="140.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives</text>
  <text x="598.5" y="157.0" font-size="11" font-weight="400" fill="#3B6D11" text-anchor="middle">all but memory</text>
  <rect x="40" y="176" width="180" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
