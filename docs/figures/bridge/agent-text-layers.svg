<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agent text is hostile: it renders, and it never runs</title>
  <desc>Agent Markdown goes through MarkdownRenderer, which escapes raw HTML and vets link schemes, and lands as bodyHtml or descriptionHtml in the srcdoc of a sandboxed iframe without allow-scripts, under the page CSP. Every other agent string becomes a React text node and is never parsed as markup.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="514" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Agent text is hostile: it renders, and it never runs</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Two strings reach the DOM as HTML, behind three layers; the rest stays text</text>
  <rect x="40" y="90" width="280" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="180.0" y="113.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent Markdown</text>
  <text x="180.0" y="130.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">ticket body, epic description</text>
  <rect x="360" y="90" width="280" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="500.0" y="113.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Every other agent string</text>
  <text x="500.0" y="130.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">titles, transcripts, chat</text>
  <rect x="40" y="168" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="180.0" y="191.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">MarkdownRenderer</text>
  <text x="180.0" y="208.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">escapes raw HTML, vets link schemes</text>
  <path d="M180,142 L180,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="252" width="600" height="244" rx="12" fill="none" stroke="#CFE2F6" stroke-width="1.6"/>
  <rect x="60" y="268" width="280" height="176" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <rect x="84" y="284" width="232" height="92" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="200.0" y="327.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">srcdoc</text>
  <text x="200.0" y="344.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">bodyHtml, descriptionHtml</text>
  <text x="200" y="404" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Sandboxed iframe</text>
  <text x="200" y="424" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">no allow-scripts</text>
  <path d="M180,220 L180,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="380" y="284" width="240" height="92" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="500.0" y="327.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">React text node</text>
  <text x="500.0" y="344.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">never parsed as markup</text>
  <path d="M500,142 L500,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="500" y="404" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">No raw-HTML path</text>
  <text x="500" y="422" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">the lint config bans it</text>
  <text x="60" y="476" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start">Page CSP</text>
  <text x="128" y="476" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">script-src 'self', img-src 'self' data:, object-src 'none'</text>
</svg>
