<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Among stream states, only down turns the controls off</title>
  <desc>Three connection states. connecting moves to live when the stream opens and to down on an error, live moves to down on an error, and down returns to live when the browser reconnects. A stream the browser closed is reopened after a delay, going through connecting. Among these states, controls are off and the banner shows only in down.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="354" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Among stream states, only down turns the controls off</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The three values of ConnectionState</text>
  <rect x="60" y="100" width="190" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="155.0" y="127.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">connecting</text>
  <text x="155.0" y="144.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">controls on, no banner</text>
  <rect x="430" y="100" width="190" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="525.0" y="127.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">live</text>
  <text x="525.0" y="144.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">controls on, no banner</text>
  <rect x="430" y="270" width="190" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="525.0" y="297.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">down</text>
  <text x="525.0" y="314.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">controls off, red banner</text>
  <path d="M250,130 L428,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="122" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">open</text>
  <path d="M490,160 L490,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="482" y="218" font-size="11" font-weight="400" fill="#73726c" text-anchor="end">error</text>
  <path d="M560,270 L560,162" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="568" y="212" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">open: browser</text>
  <text x="568" y="227" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">reconnected</text>
  <path d="M230,160 L428,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="206" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">error</text>
  <path d="M430,312 L155,312 L155,162" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="292" y="288" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">stream closed, reopened after</text>
  <text x="292" y="303" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">REOPEN_DELAY_MILLISECONDS</text>
</svg>
