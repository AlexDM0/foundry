<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The forecast plays the open tickets forward once per quantile</title>
  <desc>Two runs over synthetic tickets, median and pessimistic, each from a now line: running tickets hold a launch slot for their remainder, and a waiting ticket starts when its dependency settles and a launch slot frees. Each wave ends at its latest ticket: the Now wave at #006, Wave 2 at #005. On another board held #007 gets no bar, so its wave shows no ETA although #009 has a bar.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="442" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The forecast plays the open tickets forward once per quantile</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Synthetic tickets, two launch slots; every bar is an estimate, shown only</text>
  <path d="M132,98 L132,402" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="138" y="108" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">now</text>

  <text x="40" y="116" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">p50 run</text>
  <text x="40" y="142" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">launch slot 1</text>
  <text x="40" y="176" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">launch slot 2</text>
  <rect x="132" y="124" width="140" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="202" y="143" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#003 Now, running</text>
  <rect x="274" y="124" width="156" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="352" y="143" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#005 Wave 2, after #003</text>
  <rect x="132" y="158" width="120" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="192" y="177" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#004 Now, running</text>
  <rect x="254" y="158" width="162" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="177" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#006 Now, no dependency</text>
  <path d="M432,118 L432,156" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="440" y="143" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Wave 2 ends: #005</text>
  <path d="M418,154 L418,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="426" y="177" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Now wave ends: #006</text>

  <text x="40" y="218" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">p80 run</text>
  <text x="40" y="244" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">launch slot 1</text>
  <text x="40" y="278" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">launch slot 2</text>
  <rect x="132" y="226" width="172" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="218" y="245" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#003 Now, running</text>
  <rect x="306" y="226" width="218" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="415" y="245" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#005 Wave 2, after #003</text>
  <rect x="132" y="260" width="146" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="205" y="279" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#004 Now, running</text>
  <rect x="280" y="260" width="196" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="378" y="279" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#006 Now, no dependency</text>
  <path d="M526,220 L526,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="534" y="245" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Wave 2 ends: #005</text>
  <path d="M478,256 L478,294" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="486" y="279" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Now wave ends: #006</text>

  <text x="40" y="322" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">Another board</text>
  <text x="40" y="348" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">launch slot 1</text>
  <text x="40" y="382" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">no launch slot</text>
  <rect x="132" y="330" width="150" height="28" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="207" y="349" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">#009 Now</text>
  <rect x="132" y="364" width="150" height="28" rx="6" fill="none" stroke="#F2DDB0" stroke-dasharray="5 4"/>
  <text x="207" y="383" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">#007 Now, held: no bar</text>
  <path d="M292,328 L292,394" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="300" y="365" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Now wave: no ETA, #007 has none</text>

  <path d="M132,420 L638,420" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="630" y="412" font-size="11" font-weight="400" fill="#73726c" text-anchor="end">time</text>
</svg>
