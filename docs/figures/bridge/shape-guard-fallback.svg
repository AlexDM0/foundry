<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A missing slice degrades to counts and throws nothing</title>
  <desc>The board state passes a shape guard, then a pure view model, then the view component. A missing slice makes the guard return null, and the tab shows BoardCounts instead. Nothing throws.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="262" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A missing slice degrades to counts and throws nothing</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The Kanban, Tickets and Progress tabs, once per state change</text>
  <rect x="40" y="92" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="106" y="116" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board state</text>
  <text x="106" y="134" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">the page's copy</text>
  <rect x="196" y="92" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="262" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Shape guard</text>
  <text x="262" y="134" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">slices it needs?</text>
  <rect x="352" y="92" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="418" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">&lt;View&gt;Model</text>
  <text x="418" y="134" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">facts into rows</text>
  <rect x="508" y="92" width="132" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="574" y="116" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">View component</text>
  <text x="574" y="134" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">the full tab</text>
  <path d="M172,120 L194,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M328,120 L350,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M484,120 L506,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="196" y="188" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="262" y="212" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BoardCounts</text>
  <text x="262" y="230" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">plain counts</text>
  <path d="M262,148 L262,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="272" y="171" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">missing slice: null</text>
</svg>
