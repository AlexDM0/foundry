<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A bare URL opens the Kanban and clears the stored tab</title>
  <desc>At load HashRouter resolves a bare URL to kanban, because no preference store exists to read. BridgeApp then asks /api/identity, the answer creates the board's store, and the effect that writes the tab removes the stored key, since kanban is the default.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A bare URL opens the Kanban and clears the stored tab</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One load with no fragment and progress stored as the last tab; time runs down</text>

  <path d="M100,126 L100,352" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M270,126 L270,352" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M430,126 L430,352" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M580,126 L580,352" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>

  <rect x="40" y="88" width="120" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="100" y="112" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">HashRouter</text>
  <rect x="210" y="88" width="120" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="270" y="112" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BridgeApp</text>
  <rect x="362" y="88" width="136" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="430" y="112" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">/api/identity</text>
  <rect x="520" y="88" width="120" height="38" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580" y="112" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Browser storage</text>

  <rect x="40" y="142" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="100" y="163" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">route: kanban</text>
  <text x="100" y="180" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle">no store to read yet</text>

  <path d="M270,212 L428,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="349" y="205" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">asks who this board is</text>

  <path d="M430,248 L272,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="349" y="241" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">trackerId answers</text>

  <rect x="210" y="262" width="120" height="30" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="270" y="281" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">board store exists</text>

  <path d="M270,322 L578,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="424" y="314" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">writes kanban, the default: removes the key</text>
</svg>
