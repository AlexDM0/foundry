<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every ticket link lands on the Tickets tab, and the Kanban card has none</title>
  <desc>The Tickets table, the Progress chart, the dependency waves, epic cards, finished work, merge queue lines and the detail panel itself all link to the hash #tickets/id, which opens the Tickets tab with the DetailPanel above the table. A Kanban card has no link.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="474" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every ticket link lands on the Tickets tab, and the Kanban card has none</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The detail panel renders on the Tickets tab alone</text>
  <rect x="40" y="90" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="114.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Tickets table row</text>
  <path d="M230,109 L268,109" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="136" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="160.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Progress chart label</text>
  <path d="M230,155 L268,155" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="182" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="206.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Dependency wave</text>
  <path d="M230,201 L268,201" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="228" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="252.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Epic card</text>
  <path d="M230,247 L268,247" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="274" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="298.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Finished work</text>
  <path d="M230,293 L268,293" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="320" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="344.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Merge queue line</text>
  <path d="M230,339 L268,339" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="366" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="390.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Detail panel fact</text>
  <path d="M230,385 L268,385" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M268,109 L268,385" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M268,206 L302,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="304" y="176" width="136" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="372.0" y="203.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#tickets/&lt;id&gt;</text>
  <text x="372.0" y="220.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">a hash jump</text>
  <rect x="490" y="160" width="150" height="92" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="565.0" y="203.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Tickets tab</text>
  <text x="565.0" y="220.0" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle">DetailPanel above the table</text>
  <path d="M440,206 L488,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="418" width="190" height="38" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="135.0" y="434.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Kanban card</text>
  <text x="135.0" y="451.0" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle">no link</text>
</svg>
