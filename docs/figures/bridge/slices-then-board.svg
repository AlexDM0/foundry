<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Slice events patch the copy; only board makes it whole</title>
  <desc>One publish sends job, decision, then board. Ended job J12 leaves jobs at its own event, and opened decision E3 joins decisions at its event. Resolved decision E2 stays stale until board, which also brings the new page and everything else. Only board makes the copy whole.</desc>
  <rect x="1" y="1" width="678" height="342" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Slice events patch the copy; only board makes it whole</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The viewer's copy after each event of one publish, left to right</text>

  <text x="178" y="102" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">Before</text>
  <text x="307" y="102" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job</text>
  <text x="307" y="118" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">J12 ended</text>
  <text x="436" y="102" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">decision</text>
  <text x="436" y="118" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">E3 opened</text>
  <text x="565" y="102" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">board</text>
  <text x="565" y="118" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">closes the publish</text>

  <text x="40" y="162" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">jobs</text>
  <rect x="118" y="130" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="178" y="163" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">J11, J12</text>
  <rect x="247" y="130" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="307" y="154" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">J11</text>
  <text x="307" y="172" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">J12 leaves early</text>
  <rect x="376" y="130" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="436" y="163" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">J11</text>
  <rect x="505" y="130" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="565" y="163" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">J11</text>

  <text x="40" y="224" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">decisions</text>
  <rect x="118" y="192" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="178" y="216" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">E2</text>
  <text x="178" y="234" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">resolved on disk</text>
  <rect x="247" y="192" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="307" y="216" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">E2</text>
  <text x="307" y="234" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">stale</text>
  <rect x="376" y="192" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="436" y="216" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">E2, E3</text>
  <text x="436" y="234" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">E2 still stale</text>
  <rect x="505" y="192" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="565" y="216" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">E3</text>
  <text x="565" y="234" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">E2 gone</text>

  <text x="40" y="286" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">page</text>
  <text x="40" y="302" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">and the rest</text>
  <rect x="118" y="254" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="178" y="287" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">old</text>
  <rect x="247" y="254" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="307" y="287" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">old</text>
  <rect x="376" y="254" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="436" y="287" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">old</text>
  <rect x="505" y="254" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="565" y="287" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">new</text>
</svg>
