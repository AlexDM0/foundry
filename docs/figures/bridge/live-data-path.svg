<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The page is a projection the Overseer rebuilds per publish</title>
  <desc>Files on disk and the Overseer's memory are read together by readBoardState, then flow down through the EventBroker, the event stream, boardStateAfter and a pure view model to the DOM. Every Pass that does not throw publishes, whether a file change, a command-line nudge or an applied command woke it. Every sweep publishes and wakes a Pass, forced when something is due. The browser's only write is POST /api/commands, which returns as a wake.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="638" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The page is a projection the Overseer rebuilds per publish</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Triggers enter on the left; the browser's only write returns as a wake</text>
  <rect x="244" y="90" width="140" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="314.0" y="113.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Files on disk</text>
  <text x="314.0" y="130.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">tracker, job logs, git</text>
  <rect x="394" y="90" width="146" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="467.0" y="113.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Overseer memory</text>
  <text x="467.0" y="130.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">runtime state, notices</text>
  <rect x="270" y="168" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="375.0" y="191.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">readBoardState</text>
  <text x="375.0" y="208.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">reads with no lock</text>
  <rect x="270" y="246" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="375.0" y="269.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">EventBroker</text>
  <text x="375.0" y="286.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">drops an unchanged document</text>
  <rect x="270" y="324" width="210" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="375.0" y="347.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">/api/events</text>
  <text x="375.0" y="364.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">one server-sent stream</text>
  <rect x="270" y="402" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="375.0" y="425.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">boardStateAfter</text>
  <text x="375.0" y="442.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">a board replaces the document</text>
  <rect x="270" y="480" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="375.0" y="503.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pure view model</text>
  <text x="375.0" y="520.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">recomputed per state change</text>
  <rect x="270" y="558" width="210" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="375.0" y="581.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">DOM</text>
  <text x="375.0" y="598.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">React renders the model</text>
  <path d="M314,142 L314,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M440,142 L440,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M375,220 L375,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M375,298 L375,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M375,376 L375,400" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M375,454 L375,478" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M375,532 L375,556" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="90" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="120.0" y="113.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Sweep</text>
  <text x="120.0" y="130.0" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">OVERSEER_SWEEP_SECONDS</text>
  <rect x="40" y="168" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="120.0" y="191.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass</text>
  <text x="120.0" y="208.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">runs on any wake</text>
  <path d="M70,142 L70,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="78" y="158" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">always; forced when due</text>
  <path d="M200,116 L228,116 L228,182 L268,182" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="160" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">always</text>
  <path d="M200,212 L268,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="235" y="233" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">unless it throws</text>
  <rect x="40" y="256" width="160" height="186" rx="10" fill="none" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="120" y="274" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">What wakes a Pass</text>
  <rect x="50" y="284" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="120.0" y="303.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">File change</text>
  <text x="120.0" y="320.0" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">DataFolderWatch</text>
  <rect x="50" y="334" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="120.0" y="353.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Command-line nudge</text>
  <text x="120.0" y="370.0" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">POST /api/nudge</text>
  <rect x="50" y="384" width="140" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="120.0" y="405.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Applied command</text>
  <text x="120.0" y="422.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">from a control</text>
  <path d="M270,584 L120,584 L120,444" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="128" y="520" font-size="11" font-weight="400" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">POST /api/commands</text>
  <path d="M120,256 L120,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M498,168 L498,298" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="510" y="232" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">Overseer</text>
  <text x="510" y="248" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">one publish</text>
  <path d="M498,402 L498,610" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="510" y="500" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">Browser</text>
  <text x="510" y="516" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">judges no move</text>
  <text x="498" y="346" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">a changed document</text>
  <text x="498" y="361" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">ends with board</text>
</svg>
