<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The page field asks the Board, one query per fact</title>
  <desc>One read of the tracker files builds the Board, and boardFactsOf asks it one query per fact. forge status --json asks the same Board and shares three queries: epic roll-ups, open filing drafts and ready tickets. assemblePagePayload joins those facts with the ticket and epic text, which it renders through MarkdownRenderer, and the result is the page field of BoardState.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="512" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The page field asks the Board, one query per fact</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Facts and rendered text join in one assembly</text>
  <rect x="220" y="90" width="420" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="430.0" y="113.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Tracker files</text>
  <text x="430.0" y="130.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">progress, log, tickets, epics, filing drafts</text>
  <rect x="220" y="178" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="310.0" y="201.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Board</text>
  <text x="310.0" y="218.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">readingBoardOf</text>
  <rect x="220" y="266" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="310.0" y="289.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">boardFactsOf</text>
  <text x="310.0" y="306.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">one query per fact</text>
  <rect x="40" y="250" width="150" height="84" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="271.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">forge</text>
  <text x="115.0" y="288.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">status --json</text>
  <text x="115.0" y="306.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">epics, drafts, ready:</text>
  <text x="115.0" y="322.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">shared queries</text>
  <rect x="220" y="354" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="377.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">assemblePagePayload</text>
  <text x="330.0" y="394.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">one read, no clock</text>
  <rect x="480" y="354" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="560.0" y="377.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">MarkdownRenderer</text>
  <text x="560.0" y="394.0" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle">renderMarkdown, per body</text>
  <rect x="220" y="442" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330.0" y="465.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">page in BoardState</text>
  <text x="330.0" y="482.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">facts and rendered bodies</text>
  <path d="M310,142 L310,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M310,230 L310,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M310,318 L310,352" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,204 L115,204 L115,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M420,142 L420,352" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="428" y="250" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">ticket and epic text</text>
  <path d="M480,380 L442,380" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330,406 L330,440" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
