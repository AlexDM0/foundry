<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A down stream beats a hold, and only a marked button survives one</title>
  <desc>A grid of stream up or down against install held or not. A down stream gives stream-down whatever the hold, and every button is off. With the stream up and no hold every button is on. With the stream up and a hold, from overseer.state of held-by-install-change or a 423 answer, only a button marked answeredWhileInstallHeld stays on.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="394" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A down stream beats a hold, and only a marked button survives one</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Two inputs reduce to one availability, and each button reads it</text>
  <text x="277.5" y="104" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle">no install hold</text>
  <text x="522.5" y="104" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle">install held</text>
  <text x="522.5" y="120" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">held-by-install-change</text>
  <text x="522.5" y="136" font-size="11" font-weight="400" fill="#73726c" text-anchor="middle">or a 423 answer</text>
  <text x="40" y="194" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="start">stream up</text>
  <text x="40" y="211" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">connecting or live</text>
  <text x="40" y="306" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="start">stream down</text>
  <rect x="160" y="150" width="235" height="96" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="277.5" y="182" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">enabled</text>
  <text x="277.5" y="206" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">plain button on</text>
  <text x="277.5" y="224" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">marked button on</text>
  <rect x="405" y="150" width="235" height="96" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="522.5" y="182" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">install-held</text>
  <text x="522.5" y="206" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">plain button off</text>
  <text x="522.5" y="224" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">marked button on</text>
  <rect x="160" y="254" width="235" height="96" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="277.5" y="286" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stream-down</text>
  <text x="277.5" y="310" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle">plain button off</text>
  <text x="277.5" y="328" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle">marked button off</text>
  <rect x="405" y="254" width="235" height="96" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="522.5" y="286" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stream-down</text>
  <text x="522.5" y="310" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle">plain button off</text>
  <text x="522.5" y="328" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle">marked button off</text>
  <text x="160" y="376" font-size="11" font-weight="400" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">marked: answeredWhileInstallHeld</text>
</svg>
