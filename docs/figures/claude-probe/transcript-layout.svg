<svg xmlns="http://www.w3.org/2000/svg" width="680" height="614" viewBox="0 0 680 614" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>usage never reaches a job session's transcripts</title>
<desc>Under ~/.claude/projects/ sits one folder per slug: the usage command walks the slug of the repository root, where no job session lives, and subagentFactsOf reads one session under the slug of the job worktree. A session folder holds subagent transcripts, a .meta.json beside each and workflow runs, while the main transcript and each run's journal go unread. So usage never reaches a job session's transcripts.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="612" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">usage never reaches a job session's transcripts</text>
<text x="40" y="68" font-size="13" fill="#73726c">Claude Code owns the layout. Each reader builds the slug from a different path.</text>
<rect x="54" y="88" width="210" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="159.0" y="110.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">usage</text><text x="159.0" y="128.0" font-size="12" fill="#185FA5" text-anchor="middle">every session</text><rect x="280" y="88" width="346" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="453.0" y="110.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">subagentFactsOf</text><text x="453.0" y="128.0" font-size="12" fill="#185FA5" text-anchor="middle">one job session</text><rect x="40" y="160" width="600" height="434" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="54" y="180" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.claude/projects/</text><path d="M220,138 L220,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="228" y="154" font-size="11" fill="#73726c" text-anchor="start">reads</text><path d="M453,138 L453,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="461" y="154" font-size="11" fill="#73726c" text-anchor="start">reads</text><rect x="54" y="194" width="210" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="159.0" y="216.0" font-size="11" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;slug of repository root&gt;/</text><text x="159.0" y="234.0" font-size="12" fill="#5F5E5A" text-anchor="middle">sessions opened there</text><rect x="280" y="194" width="346" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="453.0" y="216.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;slug of job worktree&gt;/</text><text x="453.0" y="234.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the job session, unseen by usage</text><path d="M66,244 L66,297 L78,297" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><rect x="78" y="272" width="186" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="171.0" y="294.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;session&gt;/subagents/</text><text x="171.0" y="312.0" font-size="12" fill="#5F5E5A" text-anchor="middle">same layout, no job session</text><path d="M294,244 L294,271 L310,271" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M294,244 L294,309 L310,309" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M322,324 L322,347 L334,347" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M346,362 L346,385 L358,385" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M346,362 L346,423 L358,423" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M346,362 L346,461 L358,461" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M370,476 L370,499 L382,499" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><path d="M370,476 L370,537 L382,537" fill="none" stroke="#bfbdb0" stroke-width="1.6"/><rect x="310" y="256" width="316" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="320" y="276" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;session&gt;.jsonl</text><text x="616" y="276" font-size="11" fill="#5F5E5A" text-anchor="end">not read</text><rect x="310" y="294" width="316" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="320" y="314" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;session&gt;/</text><rect x="334" y="332" width="292" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="344" y="352" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">subagents/</text><rect x="358" y="370" width="268" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="368" y="390" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">agent-&lt;id&gt;.jsonl</text><rect x="358" y="408" width="268" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="368" y="428" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">agent-&lt;id&gt;.meta.json</text><text x="616" y="428" font-size="11" fill="#5F5E5A" text-anchor="end">toolUseId</text><rect x="358" y="446" width="268" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="368" y="466" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">workflows/&lt;run&gt;/</text><rect x="382" y="484" width="244" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="392" y="504" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">agent-&lt;id&gt;.jsonl</text><rect x="382" y="522" width="244" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/><text x="392" y="542" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">journal.jsonl</text><text x="616" y="542" font-size="11" fill="#5F5E5A" text-anchor="end">not read</text>
