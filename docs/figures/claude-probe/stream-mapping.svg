<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="984" viewBox="0 0 1000 984" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>The whole session protocol is six line types out and four shapes in</title>
<desc>Left column: the stream-json line types system, assistant, user, control_request, rate_limit_event and result. Right column: the eight AgentSessionEvent kinds started, assistant-turn, tool-call, tool-result, question, usage-window, permission-denied and result; assistant and result each give two kinds, and any other line gives no event. Below, four stdin lines, all written by the Watcher: chatLineOf renders a user line, answerLineOf a control_response allow, interruptLineOf a control_request interrupt, and the standing reply in planOf a control_response deny. Only src/lib/claude-code/ knows these shapes; the Watcher parses a line only to match the rule data the launch plan hands it.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="998" height="982" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The whole session protocol is six line types out and four shapes in</text>
<text x="40" y="68" font-size="13" fill="#73726c">Only the adapter knows these shapes. The Watcher writes all four stdin lines.</text>
<text x="40" y="108" font-size="14" font-weight="500" fill="#3d3d3a">stdout: what the session prints</text><text x="640" y="108" font-size="14" font-weight="500" fill="#3d3d3a">AgentSessionEvent kinds</text><rect x="40" y="124" width="320" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="146.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">system</text><text x="200.0" y="164.0" font-size="13" fill="#993C1D" text-anchor="middle">many subtypes, one read</text><rect x="40" y="186" width="320" height="112" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="239.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">assistant</text><text x="200.0" y="257.0" font-size="13" fill="#993C1D" text-anchor="middle">text, usage and tool_use blocks</text><rect x="40" y="310" width="320" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="332.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">user</text><text x="200.0" y="350.0" font-size="13" fill="#993C1D" text-anchor="middle">tool_result blocks</text><rect x="40" y="372" width="320" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="394.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">control_request</text><text x="200.0" y="412.0" font-size="13" fill="#993C1D" text-anchor="middle">subtype can_use_tool</text><rect x="40" y="434" width="320" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="456.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">rate_limit_event</text><text x="200.0" y="474.0" font-size="13" fill="#993C1D" text-anchor="middle">status, rateLimitType, resetsAt</text><rect x="40" y="496" width="320" height="112" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="200.0" y="549.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">result</text><text x="200.0" y="567.0" font-size="13" fill="#993C1D" text-anchor="middle">permission_denials, structured_output</text><rect x="40" y="620" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="200.0" y="642.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">any other line</text><text x="200.0" y="660.0" font-size="13" fill="#5F5E5A" text-anchor="middle">hooks, summaries, not JSON</text><path d="M366,149.0 L632,149.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="141.0" font-size="13" fill="#73726c" text-anchor="middle">subtype init</text><rect x="640" y="124" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="154.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">started</text><path d="M366,211.0 L632,211.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="203.0" font-size="13" fill="#73726c" text-anchor="middle">one per stdout line</text><rect x="640" y="186" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="216.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">assistant-turn</text><path d="M366,273.0 L632,273.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="265.0" font-size="13" fill="#73726c" text-anchor="middle">one per tool_use block</text><rect x="640" y="248" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="278.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tool-call</text><path d="M366,335.0 L632,335.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="327.0" font-size="13" fill="#73726c" text-anchor="middle">one per tool_result block</text><rect x="640" y="310" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="340.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tool-result</text><path d="M366,397.0 L632,397.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="389.0" font-size="13" fill="#73726c" text-anchor="middle">tool_name AskUserQuestion only</text><rect x="640" y="372" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="402.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">question</text><path d="M366,459.0 L632,459.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="451.0" font-size="13" fill="#73726c" text-anchor="middle">rate_limit_info read</text><rect x="640" y="434" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="464.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">usage-window</text><path d="M366,521.0 L632,521.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="513.0" font-size="13" fill="#73726c" text-anchor="middle">one per permission_denials entry</text><rect x="640" y="496" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="526.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">permission-denied</text><path d="M366,583.0 L632,583.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="575.0" font-size="13" fill="#73726c" text-anchor="middle">last, carries the report</text><rect x="640" y="558" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="588.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">result</text><path d="M366,645.0 L632,645.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="500" y="637.0" font-size="13" fill="#73726c" text-anchor="middle">mapped to nothing, still logged</text><rect x="640" y="620" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="800.0" y="650.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">no event</text><text x="40" y="710" font-size="14" font-weight="500" fill="#3d3d3a">stdin: what the session reads</text><text x="640" y="710" font-size="14" font-weight="500" fill="#3d3d3a">Rendered by</text><rect x="40" y="726" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="200.0" y="748.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">user</text><text x="200.0" y="766.0" font-size="13" fill="#5F5E5A" text-anchor="middle">one user message</text><rect x="640" y="726" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="800.0" y="756.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">chatLineOf</text><path d="M634,751.0 L368,751.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="500" y="743.0" font-size="13" fill="#73726c" text-anchor="middle">every plain message to the session</text><rect x="40" y="788" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="200.0" y="810.0" font-size="14" font-weight="500" fill="#444441" text-an