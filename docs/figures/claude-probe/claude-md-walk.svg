<svg xmlns="http://www.w3.org/2000/svg" width="680" height="502" viewBox="0 0 680 502" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Excludes stop the walk above the repository, not at the worktree</title>
<desc>Nested folders: the job worktree inside the repository root, inside the home folder. The upward walk loads the worktree's CLAUDE.md and the repository root's CLAUDE.md, which claudeMdExcludes does not name. From there up, every instruction file is excluded, the home folder's .claude/CLAUDE.md included.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="500" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Excludes stop the walk above the repository, not at the worktree</text>
<text x="40" y="68" font-size="13" fill="#73726c">Claude Code loads instruction files from every folder above a session.</text>
<rect x="40" y="92" width="600" height="390" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="54" y="112" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/ and every folder above the home folder</text><rect x="62" y="120" width="556" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/><text x="340.0" y="139.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md, CLAUDE.local.md, .claude/CLAUDE.md</text><text x="340.0" y="157.0" font-size="11" fill="#A32D2D" text-anchor="middle">excluded</text><rect x="62" y="182" width="556" height="286" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="76" y="202" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">home folder ~/</text><rect x="80" y="208" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/><text x="200.0" y="227.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/CLAUDE.md</text><text x="200.0" y="245.0" font-size="11" fill="#A32D2D" text-anchor="middle">excluded</text><rect x="340" y="208" width="260" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/><text x="470.0" y="227.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md</text><text x="470.0" y="245.0" font-size="11" fill="#A32D2D" text-anchor="middle">excluded</text><rect x="80" y="264" width="520" height="190" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="94" y="284" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">repository root, main checkout</text><rect x="100" y="290" width="240" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/><text x="220.0" y="309.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md</text><text x="220.0" y="327.0" font-size="11" fill="#3B6D11" text-anchor="middle">not excluded, loads</text><rect x="100" y="348" width="480" height="90" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="114" y="368" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;worktrees&gt;/ticket-&lt;id&gt;/: working directory</text><rect x="120" y="382" width="240" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/><text x="240.0" y="401.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md</text><text x="240.0" y="419.0" font-size="11" fill="#3B6D11" text-anchor="middle">the branch copy, loads</text><path d="M360,404 L520,404 L520,312 L346,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="528" y="332" font-size="11" fill="#73726c" text-anchor="start">walk climbs</text><path d="M330,290 L330,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="338" y="280" font-size="11" fill="#73726c" text-anchor="start">excluded from here up</text>
</svg>
