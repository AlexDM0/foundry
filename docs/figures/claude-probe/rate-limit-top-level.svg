<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Only the top-level status refuses requests</title>
<desc>Three rate limit cases from P10. With top-level status rejected, requestsRefused is true and the turn fails with a 429 result; with status allowed_warning over a rejected five_hour window, requestsRefused is false and the turn answers normally. An API key login gets no event at all, one retry and an error result.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="444" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only the top-level status refuses requests</text>
<text x="40" y="68" font-size="13" fill="#73726c">P10: a rejected window under an allowed top level changes nothing.</text>
<rect x="40" y="88" width="180" height="338" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="130" y="112" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Limit hit</text><rect x="50" y="124" width="160" height="58" rx="8" stroke-width="2.4" fill="#FCEBEB" stroke="#F3D2D2"/><text x="130.0" y="150.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">rejected</text><text x="130.0" y="168.0" font-size="12" fill="#A32D2D" text-anchor="middle">top-level status</text><path d="M130,182 L130,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="202" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="130.0" y="227.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">five_hour: rejected</text><text x="130.0" y="245.0" font-size="12" fill="#5F5E5A" text-anchor="middle">in unifiedWindows</text><path d="M130,258 L130,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="278" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="130.0" y="301.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">requestsRefused</text><text x="130.0" y="319.0" font-size="12" fill="#185FA5" text-anchor="middle">true</text><path d="M130,330 L130,348" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="350" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/><text x="130.0" y="375.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Turn fails</text><text x="130.0" y="393.0" font-size="12" fill="#A32D2D" text-anchor="middle">429 result</text><rect x="250" y="88" width="180" height="338" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="340" y="112" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Window over, overage on</text><rect x="260" y="124" width="160" height="58" rx="8" stroke-width="2.4" fill="#EAF3DE" stroke="#D3E6BC"/><text x="340.0" y="150.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">allowed_warning</text><text x="340.0" y="168.0" font-size="12" fill="#3B6D11" text-anchor="middle">top-level status</text><path d="M340,182 L340,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="202" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="340.0" y="227.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">five_hour: rejected</text><text x="340.0" y="245.0" font-size="12" fill="#5F5E5A" text-anchor="middle">overage allowed</text><path d="M340,258 L340,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="278" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="340.0" y="301.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">requestsRefused</text><text x="340.0" y="319.0" font-size="12" fill="#185FA5" text-anchor="middle">false</text><path d="M340,330 L340,348" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="350" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/><text x="340.0" y="375.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Turn answers</text><text x="340.0" y="393.0" font-size="12" fill="#3B6D11" text-anchor="middle">normally</text><rect x="460" y="88" width="180" height="338" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="550" y="112" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">API key login</text><rect x="470" y="124" width="160" height="58" rx="8" stroke-width="2.4" fill="#F1EFE8" stroke="#E1DDD0"/><text x="550.0" y="150.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">no event</text><text x="550.0" y="168.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no rate_limit_event</text><path d="M550,182 L550,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="470" y="202" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="550.0" y="227.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">one api_retry</text><text x="550.0" y="245.0" font-size="12" fill="#5F5E5A" text-anchor="middle">after the 429</text><path d="M550,258 L550,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="470" y="278" width="160" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="550.0" y="301.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">nothing mapped</text><text x="550.0" y="319.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no usage-window</text><path d="M550,330 L550,348" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="470" y="350" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="550.0" y="375.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Error result</text><text x="550.0" y="393.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no refusal seen</text>
</svg>
