<svg xmlns="http://www.w3.org/2000/svg" width="680" height="486" viewBox="0 0 680 486" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Signalling the recorded group misses the Bash command's own group</title>
<desc>A Watcher or Regrouping signals the recorded process group, which holds claude, so claude is killed. Claude Code started the Bash tool as the leader of a second group holding zsh, the command and its children. The signal never reaches that group, so the command survives, reparented to launchd.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="484" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Signalling the recorded group misses the Bash command's own group</text>
<text x="40" y="68" font-size="13" fill="#73726c">P7: a kill of the CLI group left the command running.</text>
<rect x="240" y="90" width="200" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="340.0" y="112.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher or Regrouping</text><text x="340.0" y="130.0" font-size="12" fill="#185FA5" text-anchor="middle">signals the recorded group</text><path d="M340,140 L340,180" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="350" y="164" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">signalProcessGroup</text><rect x="180" y="182" width="320" height="96" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="194" y="202" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">recorded group</text><rect x="240" y="212" width="200" height="54" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/><text x="340.0" y="236.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">claude</text><text x="340.0" y="254.0" font-size="12" fill="#A32D2D" text-anchor="middle">killed</text><path d="M340,266 L340,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="350" y="304" font-size="11" fill="#73726c" text-anchor="start">starts as a group leader</text><rect x="100" y="324" width="480" height="112" rx="10" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="114" y="344" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">the Bash tool's own group</text><rect x="120" y="358" width="136" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="188.0" y="385.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">zsh -c</text><text x="188.0" y="403.0" font-size="12" fill="#993C1D" text-anchor="middle">group leader</text><path d="M256,388 L286,388" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="288" y="358" width="136" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="356.0" y="385.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">command</text><text x="356.0" y="403.0" font-size="12" fill="#993C1D" text-anchor="middle">keeps running</text><path d="M424,388 L446,388" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="448" y="358" width="116" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="506.0" y="385.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">children</text><text x="506.0" y="403.0" font-size="12" fill="#993C1D" text-anchor="middle">same group</text><text x="340" y="462" font-size="12" fill="#73726c" text-anchor="middle">After the kill: the command is reparented to launchd and stays alive.</text>
</svg>
