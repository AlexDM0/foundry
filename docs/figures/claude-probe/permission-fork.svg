<svg xmlns="http://www.w3.org/2000/svg" width="680" height="596" viewBox="0 0 680 596" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Claude Code settles most calls itself; the Watcher sees the rest</title>
<desc>A tool call enters Claude Code, where the deny rules and the auto mode classifier settle it: allowed calls run, and refused ones appear in the result's permission_denials and map to permission-denied. Only what they leave open comes out as a can_use_tool control_request. The Watcher denies it at once unless the tool is AskUserQuestion, which waits as a question for the Overseer.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="594" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Claude Code settles most calls itself; the Watcher sees the rest</text>
<text x="40" y="68" font-size="13" fill="#73726c">P4, P5: these calls produced no control_request. No probe records an order inside Claude Code.</text>
<rect x="240" y="90" width="200" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="340.0" y="117.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Tool call</text><path d="M340,134 L340,158" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="160" width="600" height="104" rx="10" fill="none" stroke="#F3D2C5" stroke-width="1.2"/><text x="54" y="180" font-size="12" fill="#993C1D" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">inside Claude Code</text><rect x="70" y="190" width="250" height="58" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="195.0" y="216.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Deny rules</text><text x="195.0" y="234.0" font-size="12" fill="#993C1D" text-anchor="middle">permissions.deny</text><rect x="360" y="190" width="250" height="58" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="485.0" y="216.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Auto mode classifier</text><text x="485.0" y="234.0" font-size="12" fill="#993C1D" text-anchor="middle">decides alone</text><path d="M130,264 L130,306" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="138" y="290" font-size="11" fill="#73726c" text-anchor="start">allowed</text><path d="M340,264 L340,306" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="348" y="290" font-size="11" fill="#73726c" text-anchor="start">refused</text><path d="M550,264 L550,306" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="558" y="290" font-size="11" fill="#73726c" text-anchor="start">left open</text><rect x="40" y="308" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="130.0" y="333.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Tool runs</text><text x="130.0" y="351.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no request</text><rect x="250" y="308" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/><text x="340.0" y="333.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">permission_denials</text><text x="340.0" y="351.0" font-size="12" fill="#5F5E5A" text-anchor="middle">on the result</text><rect x="460" y="308" width="180" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="550.0" y="333.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">control_request</text><text x="550.0" y="351.0" font-size="12" fill="#993C1D" text-anchor="middle">can_use_tool on stdout</text><path d="M340,364 L340,406" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="348" y="390" font-size="11" fill="#73726c" text-anchor="start">mapped</text><path d="M550,364 L550,406" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><rect x="250" y="408" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="340.0" y="433.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">permission-denied</text><text x="340.0" y="451.0" font-size="12" fill="#185FA5" text-anchor="middle">one event per entry</text><rect x="460" y="408" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="550.0" y="433.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text><text x="550.0" y="451.0" font-size="12" fill="#185FA5" text-anchor="middle">matches the standing reply</text><path d="M490,464 L490,490 L340,490 L340,518" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="415" y="484" font-size="11" fill="#73726c" text-anchor="middle">other tool</text><path d="M590,464 L590,518" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="582" y="506" font-size="11" fill="#73726c" text-anchor="end">AskUserQuestion</text><rect x="250" y="520" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="340.0" y="545.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">control_response</text><text x="340.0" y="563.0" font-size="12" fill="#185FA5" text-anchor="middle">deny, at once</text><rect x="460" y="520" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/><text x="550.0" y="545.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">question</text><text x="550.0" y="563.0" font-size="12" fill="#854F0B" text-anchor="middle">goes to the Overseer</text>
</svg>
