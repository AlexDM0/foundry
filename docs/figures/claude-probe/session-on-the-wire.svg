<svg xmlns="http://www.w3.org/2000/svg" width="680" height="808" viewBox="0 0 680 808" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A session is turns on one pipe pair, ended by closing stdin</title>
<desc>Time runs down across Overseer, Watcher and claude -p: the Overseer sends write frames, the Watcher turns each into one user line, and a line written mid-turn folds into the open turn, so one result answers both. A close-input frame closes stdin and the session exits 0. A later Watcher instance starts claude with --resume and the same id, and its first user line carries the resume message.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="806" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A session is turns on one pipe pair, ended by closing stdin</text>
<text x="40" y="68" font-size="13" fill="#73726c">The same id continues it. Line shapes are in the fence below.</text>
<rect x="40" y="88" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="110" y="111" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text><path d="M110,124 L110,788" fill="none" stroke="#E1DDD0" stroke-width="1.2"/><rect x="270" y="88" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/><text x="340" y="111" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text><path d="M340,124 L340,788" fill="none" stroke="#E1DDD0" stroke-width="1.2"/><rect x="500" y="88" width="140" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/><text x="570" y="111" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">claude -p</text><path d="M570,124 L570,788" fill="none" stroke="#E1DDD0" stroke-width="1.2"/><path d="M110,150 L334,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="144" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">spawn, launch files</text><path d="M340,186 L564,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="180" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">--session-id &lt;id&gt;</text><path d="M110,222 L334,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="216" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">write frame</text><path d="M340,258 L564,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="252" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">first user line</text><path d="M570,294 L346,294" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="288" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">system init</text><path d="M570,330 L346,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="324" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">assistant lines</text><path d="M110,366 L334,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="360" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">write frame</text><path d="M340,402 L564,402" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="396" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">user line mid-turn, folds in</text><path d="M570,438 L346,438" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="432" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">one result</text><path d="M110,474 L334,474" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="468" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">close-input frame</text><path d="M340,510 L564,510" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="504" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stdin closed</text><path d="M570,546 L346,546" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="540" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">exit 0</text><path d="M40,568 L640,568" fill="none" stroke="#D5D1C4" stroke-width="1.2"/><text x="120" y="586" font-size="12" fill="#73726c" text-anchor="start">A later Watcher instance, same id</text><path d="M110,616 L334,616" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="610" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">spawn, launch files</text><path d="M340,652 L564,652" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="646" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">--resume &lt;id&gt;</text><path d="M110,688 L334,688" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="225.0" y="682" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">write frame</text><path d="M340,724 L564,724" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="718" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">user line: resume message</text><path d="M570,760 L346,760" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/><text x="455.0" y="754" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">system init</text>
</svg>
