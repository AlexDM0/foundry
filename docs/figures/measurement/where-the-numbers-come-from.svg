<svg xmlns="http://www.w3.org/2000/svg" width="680" height="492" viewBox="0 0 680 492" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three sources feed two printouts that steer nothing</title>
  <desc>Three sources. Log lines and ticket keys: the reviewer's report and the branch diff become a review-recorded line and filing commands set ticket cause links. Row tokens come from Watcher event logs, and vendor transcripts reach the usage lines through UsageAgents. The review-stats tables read the first two sources; a crossed-out arrow shows that neither printout reaches the Playbook, while the review-recorded line itself feeds the round verdict and the rounds-not-converging Overseer notice.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#A32D2D"/></marker></defs>
  <rect x="1" y="1" width="678" height="490" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Three sources feed two printouts that steer nothing</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Two read-only commands; only the log line beneath them reaches a decision</text>
  <text x="40" y="90" font-size="12" fill="#73726c" text-anchor="start">Log lines and ticket keys</text>
  <text x="40" y="308" font-size="12" fill="#73726c" text-anchor="start">Row tokens</text>
  <text x="40" y="410" font-size="12" fill="#73726c" text-anchor="start">Vendor transcripts</text>
  <line x1="40" y1="292" x2="380" y2="292" stroke="#E1DDD0" stroke-width="1"/>
  <line x1="40" y1="392" x2="590" y2="392" stroke="#E1DDD0" stroke-width="1"/>
  <path d="M190,125 L223,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,185 L223,172" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,247 L223,247" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,344 L223,344" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,446 L223,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,165 L428,165" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,178 L418,178 L418,231 L428,231" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,190 L408,190 L408,316 L428,316" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,258 L394,258 L394,330 L428,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,344 L428,344" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M385,446 L428,446" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M600,446 L620,446 L620,115 L602,115" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahr)"/>
  <path d="M600,328 L620,328" fill="none" stroke="#A32D2D" stroke-width="1.6"/>
  <path d="M612,222 L628,238 M628,222 L612,238" fill="none" stroke="#A32D2D" stroke-width="2.4"/>
  <text x="612" y="380" font-size="11" fill="#A32D2D" text-anchor="end">no decision reads these</text>
  <rect x="40" y="100" width="150" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="121.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Reviewer's report</text>
  <text x="115.0" y="139.0" font-size="12" fill="#993C1D" text-anchor="middle">findings and claims</text>
  <rect x="40" y="160" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="181.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Branch diff</text>
  <text x="115.0" y="199.0" font-size="12" fill="#5F5E5A" text-anchor="middle">size and rework lines</text>
  <rect x="40" y="222" width="150" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="243.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Filing commands</text>
  <text x="115.0" y="261.0" font-size="12" fill="#185FA5" text-anchor="middle">name a ticket's cause</text>
  <rect x="40" y="316" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="340.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Watcher event logs</text>
  <text x="115.0" y="358.0" font-size="12" fill="#5F5E5A" text-anchor="middle">every job instance</text>
  <rect x="40" y="418" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="442.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Vendor transcripts</text>
  <text x="115.0" y="460.0" font-size="12" fill="#5F5E5A" text-anchor="middle">one file per agent</text>
  <rect x="225" y="125" width="160" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="305.0" y="156.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">review-recorded</text>
  <text x="305.0" y="174.0" font-size="12" fill="#5F5E5A" text-anchor="middle">one line per review round</text>
  <rect x="225" y="222" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="305.0" y="243.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket cause links</text>
  <text x="305.0" y="261.0" font-size="12" fill="#5F5E5A" text-anchor="middle">two frontmatter keys</text>
  <rect x="225" y="316" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="305.0" y="340.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Row tokens</text>
  <text x="305.0" y="358.0" font-size="12" fill="#5F5E5A" text-anchor="middle">added when a job ends</text>
  <rect x="225" y="418" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="305.0" y="442.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">UsageAgents</text>
  <text x="305.0" y="460.0" font-size="12" fill="#185FA5" text-anchor="middle">one profile per subagent</text>
  <rect x="430" y="92" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="515.0" y="111.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Playbook</text>
  <text x="515.0" y="129.0" font-size="12" fill="#185FA5" text-anchor="middle">launches and moves</text>
  <rect x="430" y="150" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="515.0" y="169.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Round verdict</text>
  <text x="515.0" y="187.0" font-size="12" fill="#185FA5" text-anchor="middle">grants another round</text>
  <rect x="430" y="208" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="515.0" y="227.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer notice</text>
  <text x="515.0" y="245.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">rounds-not-converging</text>
  <rect x="430" y="300" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="515.0" y="324.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">review-stats</text>
  <text x="515.0" y="342.0" font-size="12" fill="#5F5E5A" text-anchor="middle">ReviewStatistics tables</text>
  <rect x="430" y="418" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="515.0" y="442.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">usage</text>
  <text x="515.0" y="460.0" font-size="12" fill="#5F5E5A" text-anchor="middle">agent rows, printed only</text>
</svg>
