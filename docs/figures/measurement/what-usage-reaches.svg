<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>usage reads subagents in one folder, so job sessions stay out</title>
  <desc>A grid of transcript kinds against where the session ran. At the repository root the session's subagents, workflow agents included, are read and its own transcript is not. A job session's own transcript is never read, and its subagents are read only when --transcripts names that worktree's folder.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="294" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">usage</tspan> reads subagents in one folder, so job sessions stay out</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each working directory has its own folder under ~/.claude/projects/</text>
  <text x="324" y="104" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="middle">Session at the repository root</text>
  <text x="324" y="122" font-size="12" fill="#73726c" text-anchor="middle">the folder usage resolves to</text>
  <text x="538" y="104" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="middle">Job session</text>
  <text x="538" y="122" font-size="12" fill="#73726c" text-anchor="middle">a folder for each worktree path</text>
  <text x="40" y="160" font-size="14" font-weight="500" fill="#3d3d3a">The session itself</text>
  <text x="40" y="178" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;session&gt;.jsonl</text>
  <text x="40" y="228" font-size="14" font-weight="500" fill="#3d3d3a">Its subagents</text>
  <text x="40" y="246" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">subagents/agent-*.jsonl</text>
  <text x="40" y="260" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">subagents/workflows/&lt;run&gt;/</text>
  <rect x="222" y="136" width="204" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="324.0" y="162.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Not read</text>
  <text x="324.0" y="180.0" font-size="12" fill="#5F5E5A" text-anchor="middle">even with --transcripts</text>
  <rect x="436" y="136" width="204" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="538.0" y="162.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Not read</text>
  <text x="538.0" y="180.0" font-size="12" fill="#5F5E5A" text-anchor="middle">even with --transcripts</text>
  <rect x="222" y="212" width="204" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="324.0" y="238.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Read</text>
  <text x="324.0" y="256.0" font-size="12" fill="#3B6D11" text-anchor="middle">one row per agent</text>
  <rect x="436" y="212" width="204" height="60" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="538.0" y="238.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Only with --transcripts</text>
  <text x="538.0" y="256.0" font-size="12" fill="#854F0B" text-anchor="middle">User names one worktree's folder</text>
</svg>
