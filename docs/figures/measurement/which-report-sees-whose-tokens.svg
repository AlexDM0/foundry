  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">By default no agent's tokens reach both commands</text>
  <text x="40" y="68" font-size="13" fill="#73726c">review-stats token columns against usage, by who spent the tokens</text>
  <text x="301.0" y="114" font-size="13" fill="#3d3d3a" text-anchor="middle">builder tokens</text>
  <text x="438.0" y="114" font-size="13" fill="#3d3d3a" text-anchor="middle">review tokens</text>
  <text x="575.0" y="114" font-size="13" fill="#3d3d3a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">usage</text>
