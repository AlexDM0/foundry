<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>By default no agent's tokens reach both commands</title>
  <desc>By default no agent's tokens reach both commands. Build jobs, merge agents and review jobs reach a token column and never usage, and their subagents count in the same column and reach usage only with --transcripts. A root session's subagent reaches usage and neither token column.</desc>
