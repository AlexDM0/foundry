<svg xmlns="http://www.w3.org/2000/svg" width="680" height="336" viewBox="0 0 680 336" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A link on a later ticket adds to a count on the ticket it names</title>
  <desc>Bug #021 names delivered ticket #003 in introducedBy and counts as escaped after a clean last round, because #003's last review round was clean; a dashed branch shows the serious case. Ticket #022 names #003 in foundInReview and counts as filed from reviews, whatever #003's status or last round.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="334" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A link on a later ticket adds to a count on the ticket it names</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Both counts are worked out at print time; ticket #003's file stays as it is</text>
  <path d="M190,192 L283,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="178" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">introducedBy</text>
  <path d="M190,288 L283,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="274" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">foundInReview</text>
  <path d="M395,124 L498,124" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="446" y="104" font-size="11" fill="#73726c" text-anchor="middle">if it had</text>
  <text x="446" y="117" font-size="11" fill="#73726c" text-anchor="middle">been serious</text>
  <path d="M395,192 L498,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="446" y="186" font-size="11" fill="#73726c" text-anchor="middle">last round clean</text>
  <path d="M395,288 L498,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="446" y="269" font-size="11" fill="#73726c" text-anchor="middle">any status,</text>
  <text x="446" y="282" font-size="11" fill="#73726c" text-anchor="middle">any round</text>
  <rect x="40" y="164" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="188.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Bug #021</text>
  <text x="115.0" y="206.0" font-size="12" fill="#5F5E5A" text-anchor="middle">Role editor loses focus</text>
  <rect x="40" y="260" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="284.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket #022</text>
  <text x="115.0" y="302.0" font-size="12" fill="#5F5E5A" text-anchor="middle">a filed finding</text>
  <rect x="285" y="96" width="110" height="220" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="202.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket #003</text>
  <text x="340.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">delivered</text>
  <rect x="500" y="96" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="570.0" y="120.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Serious last round</text>
  <text x="570.0" y="138.0" font-size="12" fill="#5F5E5A" text-anchor="middle">would count #021</text>
  <rect x="500" y="164" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="570.0" y="188.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Clean last round</text>
  <text x="570.0" y="206.0" font-size="12" fill="#5F5E5A" text-anchor="middle">escaped bugs: #021</text>
  <rect x="500" y="260" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="570.0" y="284.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Filed from reviews</text>
  <text x="570.0" y="302.0" font-size="12" fill="#5F5E5A" text-anchor="middle">counts #022</text>
</svg>
