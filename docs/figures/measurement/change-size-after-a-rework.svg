<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A re-review's builder change swallows the earlier rework</title>
  <desc>Git graph. The branch leaves the target at the merge base and runs through the builder's commits to the first start commit, the first reviewer's fixes, the builder's rework and the second start commit. The kept line's builder change runs from the merge base to the second start commit, so it covers the reviewer's fixes and the rework as well as the builder's original change.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="304" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A re-review's builder change swallows the earlier rework</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each review measures from the merge base to its own start commit</text>
  <text x="40" y="116" font-size="12" fill="#444441" text-anchor="start">target</text>
  <text x="40" y="196" font-size="12" fill="#444441" text-anchor="start">branch</text>
  <path d="M118,112 L640,112" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M118,112 L160,192 L600,192" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="118" cy="112" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="190" cy="192" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="300" cy="192" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="390" cy="192" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="480" cy="192" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="590" cy="192" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="118" y="96" font-size="12" fill="#73726c" text-anchor="middle">merge base</text>
  <text x="190" y="170" font-size="12" fill="#73726c" text-anchor="middle">builder</text>
  <text x="300" y="164" font-size="12" fill="#73726c" text-anchor="middle">first</text>
  <text x="300" y="178" font-size="12" fill="#73726c" text-anchor="middle">start commit</text>
  <text x="390" y="170" font-size="12" fill="#73726c" text-anchor="middle">reviewer fixes</text>
  <text x="480" y="170" font-size="12" fill="#73726c" text-anchor="middle">builder's rework</text>
  <text x="590" y="164" font-size="12" fill="#73726c" text-anchor="middle">second</text>
  <text x="590" y="178" font-size="12" fill="#73726c" text-anchor="middle">start commit</text>
  <path d="M118,216 L118,222 L300,222 L300,216" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="209" y="238" font-size="12" fill="#444441" text-anchor="middle">builder's original change</text>
  <path d="M118,250 L118,256 L590,256 L590,250" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="354" y="272" font-size="12" fill="#444441" text-anchor="middle">builder change on the kept line</text>
</svg>
