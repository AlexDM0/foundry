<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>In one review, the start commit divides builder change from rework</title>
  <desc>Git graph. The target runs on past the merge base to commits no diff counts, and the branch leaves at the merge base for the review start commit, then HEAD. Merge base to start commit is the builder change, every line, from a three-dot diff, and start commit to HEAD is the rework, code lines only.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="304" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">In one review, the start commit divides builder change from rework</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Two measured diffs meet at reviewStartCommit</text>
  <text x="40" y="124" font-size="12" fill="#444441" text-anchor="start">target</text>
  <text x="40" y="204" font-size="12" fill="#444441" text-anchor="start">branch</text>
  <path d="M128,120 L470,120" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M128,120 L180,200" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M180,200 L560,200" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <circle cx="128" cy="120" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="300" cy="120" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="470" cy="120" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="186" cy="200" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="370" cy="200" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="560" cy="200" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="128" y="102" font-size="12" fill="#73726c" text-anchor="middle">merge base</text>
  <text x="486" y="124" font-size="12" fill="#73726c" text-anchor="start">target tip</text>
  <path d="M300,104 L300,98 L470,98 L470,104" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="385" y="90" font-size="11" fill="#73726c" text-anchor="middle">not counted</text>
  <text x="370" y="178" font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reviewStartCommit</text>
  <text x="560" y="178" font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">HEAD</text>
  <path d="M128,226 L128,232 L364,232 L364,226" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="246.0" y="250" font-size="12" fill="#444441" text-anchor="middle">builder change, every line</text>
  <text x="246.0" y="266" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">target...start</text>
  <path d="M376,226 L376,232 L560,232 L560,226" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="468.0" y="250" font-size="12" fill="#444441" text-anchor="middle">rework, code lines only</text>
  <text x="468.0" y="266" font-size="11" fill="#73726c" text-anchor="middle">start to HEAD</text>
</svg>
