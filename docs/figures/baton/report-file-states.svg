<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only the old Overseer writes failed</title>
  <desc>State diagram of the Baton pass file. The normal path runs requested, written by the old Overseer; ready, by the successor; released, by the old Overseer; serving, by the successor. successor-failed peels off before released, from a proof step or a release that came too late, and after released from a start-up failure. Both lead to failed, which the old Overseer writes after it has logged the failure. A dashed edge shows a late release overwriting a successor-failed report written at step await-release.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="448" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only the old Overseer writes failed</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The normal path runs straight. Each box names who writes that state.</text>

  <!-- normal path -->
  <g text-anchor="middle">
    <rect x="40" y="100" width="108" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="94" y="124" font-size="13" font-weight="500" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">requested</text>
    <text x="94" y="142" font-size="12" fill="#185FA5">old Overseer</text>
    <rect x="204" y="100" width="108" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="258" y="124" font-size="13" font-weight="500" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">ready</text>
    <text x="258" y="142" font-size="12" fill="#185FA5">successor</text>
    <rect x="368" y="100" width="108" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="422" y="124" font-size="13" font-weight="500" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">released</text>
    <text x="422" y="142" font-size="12" fill="#185FA5">old Overseer</text>
    <rect x="532" y="100" width="108" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="586" y="124" font-size="13" font-weight="500" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">serving</text>
    <text x="586" y="142" font-size="12" fill="#185FA5">successor</text>
  </g>
  <path d="M148,128 L200,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M312,128 L364,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M476,128 L528,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="174" y="120" font-size="11" fill="#73726c" text-anchor="middle">proved</text>
  <text x="338" y="120" font-size="11" fill="#73726c" text-anchor="middle">let go</text>
  <text x="502" y="120" font-size="11" fill="#73726c" text-anchor="middle">first Pass</text>

  <!-- successor-failed before released -->
  <rect x="104" y="220" width="156" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="182" y="244" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">successor-failed</text>
  <text x="182" y="262" font-size="12" fill="#185FA5" text-anchor="middle">successor, before release</text>
  <path d="M74,156 L74,248 L100,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="82" y="196" font-size="11" fill="#73726c">proof step fails</text>
  <path d="M228,156 L228,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="196" font-size="11" fill="#73726c">no release in time</text>

  <!-- late release -->
  <path d="M260,248 L412,248 L412,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="404" y="240" font-size="11" fill="#73726c" text-anchor="end">overwritten by a late release</text>

  <!-- successor-failed after released -->
  <rect x="440" y="220" width="156" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="518" y="244" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">successor-failed</text>
  <text x="518" y="262" font-size="12" fill="#185FA5" text-anchor="middle">successor, after release</text>
  <path d="M452,156 L452,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="460" y="196" font-size="11" fill="#73726c">start-up fails</text>

  <!-- failed -->
  <rect x="264" y="330" width="156" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="342" y="354" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">failed</text>
  <text x="342" y="372" font-size="12" fill="#185FA5" text-anchor="middle">old Overseer</text>
  <path d="M182,276 L182,358 L260,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M518,276 L518,358 L424,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="314" font-size="11" fill="#73726c">logged first, then written</text>
  <text x="510" y="314" font-size="11" fill="#73726c" text-anchor="end">logged first, then written</text>

  <text x="40" y="420" font-size="12" fill="#73726c">A successor that never reports gets failed straight from the old Overseer. Dashed: the rare path.</text>
</svg>
