<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A failed start gives back only what it holds</title>
  <desc>Three spans run left to right. Holding nothing, a start runs its checks, reads its identity and pins the bundle; a failure is a refusal with nothing to give back. Holding the port, the API answers while commands get 401 and the event stream 404; a failed claim stops the listener and refuses. Holding port and Baton, it writes the token, the tracker write and runs the forced Pass; a failure stops everything and calls release.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A failed start gives back only what it holds</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs right. Each failure lets go of that span's holdings and nothing else.</text>

  <!-- spans -->
  <g text-anchor="middle">
    <rect x="40" y="92" width="168" height="84" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="124" y="118" font-size="14" font-weight="500" fill="#444441">Holds nothing</text>
    <text x="124" y="138" font-size="12" fill="#5F5E5A">checks, identity,</text>
    <text x="124" y="155" font-size="12" fill="#5F5E5A">Watcher bundle</text>

    <rect x="256" y="92" width="168" height="84" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="340" y="118" font-size="14" font-weight="500" fill="#0C447C">Holds the port</text>
    <text x="340" y="138" font-size="12" fill="#185FA5">API answers, commands 401,</text>
    <text x="340" y="155" font-size="12" fill="#185FA5">event stream 404</text>

    <rect x="472" y="92" width="168" height="84" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="556" y="118" font-size="14" font-weight="500" fill="#0C447C">Holds port and Baton</text>
    <text x="556" y="138" font-size="12" fill="#185FA5">token, tracker write,</text>
    <text x="556" y="155" font-size="12" fill="#185FA5">forced Pass</text>
  </g>
  <path d="M208,134 L252,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M424,134 L468,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="446" y="126" font-size="11" fill="#73726c" text-anchor="middle">claims</text>
  <text x="230" y="126" font-size="11" fill="#73726c" text-anchor="middle">binds</text>

  <!-- failure exits -->
  <path d="M124,176 L124,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,176 L340,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M556,176 L556,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="132" y="195" font-size="11" fill="#73726c">on failure</text>
  <text x="348" y="195" font-size="11" fill="#73726c">on failure</text>
  <text x="564" y="195" font-size="11" fill="#73726c">on failure</text>
  <g text-anchor="middle">
    <rect x="40" y="208" width="168" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="124" y="233" font-size="14" font-weight="500" fill="#791F1F">Refused</text>
    <text x="124" y="252" font-size="12" fill="#A32D2D">nothing to give back</text>
    <rect x="256" y="208" width="168" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="340" y="233" font-size="14" font-weight="500" fill="#791F1F">Listener stops</text>
    <text x="340" y="252" font-size="12" fill="#A32D2D">then refused</text>
    <rect x="472" y="208" width="168" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="556" y="233" font-size="14" font-weight="500" fill="#791F1F">Everything stops</text>
    <text x="556" y="252" font-size="12" fill="#A32D2D">then its Baton goes</text>
  </g>
</svg>
