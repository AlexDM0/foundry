<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Planned failures fall back to a driver, except a lost port</title>
  <desc>A decision ladder from the taken restart command. A successor that does not spawn, or does not report ready in time, ends kept-driving with the old Overseer in charge. An old Overseer that dies while the successor waits ends predecessor-gone, and the successor, the only driver left, starts as after a crash; if that start fails too, nobody drives until the next oversee. If the successor then serves in time the outcome is baton-passed. If it does not, the old Overseer tries to start again on the port: success is taken-back under generation n+2, and failure exits with no Overseer returning. Watchers keep running on every path.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="638" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Planned failures fall back to a driver, except a lost port</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Green hands the board to an Overseer; red hands it to none.</text>

  <!-- spine -->
  <path d="M145,132 L145,156" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M145,216 L145,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M145,300 L145,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M145,384 L145,424" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M145,484 L145,512" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="154" y="232" font-size="11" fill="#73726c">yes</text>
  <text x="154" y="316" font-size="11" fill="#73726c">yes</text>
  <text x="154" y="408" font-size="11" fill="#73726c">yes, old Overseer lets go</text>
  <text x="154" y="502" font-size="11" fill="#73726c">yes</text>

  <rect x="40" y="88" width="210" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="115" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Restart command taken</text>

  <rect x="40" y="160" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="193" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Successor spawned?</text>

  <rect x="40" y="244" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="267" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Proved and ready in time?</text>
  <text x="145" y="285" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_READY_TRIES</text>

  <rect x="40" y="328" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="351" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Old Overseer still live?</text>
  <text x="145" y="369" font-size="12" fill="#185FA5" text-anchor="middle">asked by the waiting successor</text>

  <rect x="40" y="428" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145" y="451" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Serving in time?</text>
  <text x="145" y="469" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_RELEASE_TRIES</text>

  <!-- peels -->
  <path d="M250,188 L406,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="326" y="182" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M250,272 L406,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="326" y="266" font-size="11" fill="#73726c" text-anchor="middle">no: failed, exited or silent</text>
  <path d="M250,356 L406,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="326" y="350" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M250,456 L406,456" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="326" y="450" font-size="11" fill="#73726c" text-anchor="middle">no: failed, exited or silent</text>

  <rect x="410" y="160" width="230" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="525" y="183" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">kept-driving</text>
  <text x="525" y="201" font-size="12" fill="#3B6D11" text-anchor="middle">old Overseer never stopped</text>

  <rect x="410" y="244" width="230" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="525" y="267" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">kept-driving</text>
  <text x="525" y="285" font-size="12" fill="#3B6D11" text-anchor="middle">old Overseer never stopped</text>

  <rect x="410" y="328" width="230" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="525" y="351" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">predecessor-gone</text>
  <text x="525" y="369" font-size="12" fill="#3B6D11" text-anchor="middle">successor is the only driver left</text>

  <rect x="410" y="428" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="525" y="451" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Started again in time?</text>
  <text x="525" y="469" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_REBIND_TRIES</text>

  <path d="M440,484 L440,498 L382,498 L382,512" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="411" y="492" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M557,484 L557,512" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="566" y="502" font-size="11" fill="#73726c">no</text>

  <rect x="40" y="516" width="210" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="145" y="539" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-passed</text>
  <text x="145" y="557" font-size="12" fill="#3B6D11" text-anchor="middle">successor drives</text>

  <rect x="300" y="516" width="165" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="382.5" y="539" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">taken-back</text>
  <text x="382" y="557" font-size="12" fill="#3B6D11" text-anchor="middle">old drives under n+2</text>

  <rect x="475" y="516" width="165" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="557" y="539" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Port lost, exit 1</text>
  <text x="557" y="557" font-size="12" fill="#A32D2D" text-anchor="middle">no Overseer returns</text>
  <text x="40" y="600" font-size="12" fill="#73726c">If a predecessor-gone start fails too, nobody drives until the next oversee.</text>
  <text x="40" y="618" font-size="12" fill="#73726c">Watchers keep running on every path.</text>
</svg>
