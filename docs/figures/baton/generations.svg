<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The newest generation wins; nothing is rewritten</title>
  <desc>Six moments of the overseer folder, one per row. A takes baton-1 and crashes; B and C race for baton-2, B wins and removes baton-1, and C is refused overseer-contended. D takes baton-3 with acquireAbove while B still lives, removing baton-2. E takes baton-4 the same way, removing baton-3, and fails; D claims above the failed generation, so baton-5, n+2, and baton-4 is gone. No file is edited. The highest number decides, and it is the Overseer only while it names a live process.</desc>
  <rect x="1" y="1" width="678" height="598" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The newest generation wins; nothing is rewritten</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The overseer folder, one row per moment, time running down. A file is never edited.</text>

  <text x="40" y="100" font-size="12" fill="#73726c">generation</text>
  <g font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="249" y="100">1</text><text x="335" y="100">2</text><text x="421" y="100">3</text><text x="507" y="100">4</text><text x="593" y="100">5</text>
  </g>

  <!-- row labels -->
  <g font-size="14" font-weight="500" fill="#3d3d3a">
    <text x="40" y="128">First start</text>
    <text x="40" y="202">Holder crashes</text>
    <text x="40" y="276">Two starters race</text>
    <text x="40" y="350">Baton pass</text>
    <text x="40" y="424">Second Baton pass</text>
    <text x="40" y="498">Take-back</text>
  </g>
  <g font-size="12" fill="#73726c">
    <text x="40" y="146">empty folder gives 1</text>
    <text x="40" y="220">file stays, process dead</text>
    <text x="40" y="294">both judge baton-1 dead</text>
    <text x="40" y="368">successor D beside live B</text>
    <text x="40" y="442">successor E beside live D</text>
    <text x="40" y="516">D (was 3) claims above the failure, n+2</text>
  </g>
  <g font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="40" y="310" fill="#A32D2D">C: overseer-contended</text>
    <text x="40" y="384" fill="#73726c">acquireAbove(2)</text>
    <text x="40" y="458" fill="#73726c">acquireAbove(3)</text>
    <text x="40" y="532" fill="#73726c">acquireAbove(4) takes 5</text>
  </g>

  <!-- row 1 -->
  <rect x="210" y="112" width="78" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="249" y="135" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-1</text>
  <text x="249" y="153" font-size="12" fill="#185FA5" text-anchor="middle">A live</text>

  <!-- row 2 -->
  <rect x="210" y="186" width="78" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="249" y="209" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-1</text>
  <text x="249" y="227" font-size="12" fill="#5F5E5A" text-anchor="middle">A dead</text>

  <!-- row 3 -->
  <rect x="210" y="260" width="78" height="54" rx="8" fill="none" stroke="#bfbdb0" stroke-dasharray="4 4"/>
  <text x="249" y="292" font-size="12" fill="#73726c" text-anchor="middle">removed</text>
  <rect x="296" y="260" width="78" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="283" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-2</text>
  <text x="335" y="301" font-size="12" fill="#185FA5" text-anchor="middle">B live</text>

  <!-- row 4 -->
  <rect x="296" y="334" width="78" height="54" rx="8" fill="none" stroke="#bfbdb0" stroke-dasharray="4 4"/>
  <text x="335" y="366" font-size="12" fill="#73726c" text-anchor="middle">removed</text>
  <rect x="382" y="334" width="78" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="421" y="357" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-3</text>
  <text x="421" y="375" font-size="12" fill="#185FA5" text-anchor="middle">D live</text>

  <!-- row 5 -->
  <rect x="382" y="408" width="78" height="54" rx="8" fill="none" stroke="#bfbdb0" stroke-dasharray="4 4"/>
  <text x="421" y="440" font-size="12" fill="#73726c" text-anchor="middle">removed</text>
  <rect x="468" y="408" width="78" height="54" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="507" y="431" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-4</text>
  <text x="507" y="449" font-size="12" fill="#A32D2D" text-anchor="middle">E fails</text>

  <!-- row 6 -->
  <rect x="468" y="482" width="78" height="54" rx="8" fill="none" stroke="#bfbdb0" stroke-dasharray="4 4"/>
  <text x="507" y="514" font-size="12" fill="#73726c" text-anchor="middle">removed</text>
  <rect x="554" y="482" width="78" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="593" y="505" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-5</text>
  <text x="593" y="523" font-size="12" fill="#185FA5" text-anchor="middle">D live</text>

  <text x="40" y="566" font-size="12" fill="#73726c">Dashed outline: a removed file. A failing E removes its own; D's claim removes a killed E's.</text>
  <text x="40" y="582" font-size="12" fill="#73726c">A skipped number is harmless.</text>
</svg>
