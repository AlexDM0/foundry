<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The port leaves before the Baton does</title>
  <desc>Time runs right through the reports requested, ready, released and serving. The old Overseer drives until it lets go between ready and released; nobody drives until the successor has claimed; then the successor drives. The port stays with the old Overseer until it lets go, is free until the successor binds it after released, then is the successor's. The Baton file is n, naming the live old process, until the successor claims n+1. The API is up, then down, then up with a fresh token. An ordinary oversee is refused overseer-already-running throughout, because a live process stays named, so only the Baton pass can claim in the gap.</desc>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The port leaves before the Baton does</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs right. The shaded span has no driver, so only the Baton pass can claim in it.</text>

  <!-- gap band -->
  <rect x="282" y="86" width="210" height="222" rx="8" fill="#FAEEDA" fill-opacity="0.55"/>

  <!-- report ticks -->
  <g font-size="12" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="150" y="104">requested</text>
    <text x="250" y="104">ready</text>
    <text x="370" y="104">released</text>
    <text x="580" y="104">serving</text>
  </g>
  <g stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 3">
    <path d="M150,110 L150,300"/><path d="M250,110 L250,300"/><path d="M370,110 L370,300"/><path d="M580,110 L580,300"/>
  </g>

  <!-- labels -->
  <g font-size="14" font-weight="500" fill="#3d3d3a">
    <text x="40" y="141">Driver</text>
    <text x="40" y="189">Port</text>
    <text x="40" y="237">Baton file</text>
    <text x="40" y="285">API</text>
  </g>

  <!-- Driver -->
  <rect x="130" y="118" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="205" y="141" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Old Overseer</text>
  <rect x="284" y="118" width="206" height="36" rx="8" fill="#FCF4E8" stroke="#854F0B" stroke-dasharray="4 4"/>
  <text x="387" y="141" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Nobody</text>
  <rect x="494" y="118" width="146" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="567" y="141" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Successor</text>

  <!-- Port -->
  <rect x="130" y="166" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="205" y="189" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Old Overseer</text>
  <rect x="284" y="166" width="124" height="36" rx="8" fill="#FCF4E8" stroke="#854F0B" stroke-dasharray="4 4"/>
  <text x="346" y="189" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Free</text>
  <rect x="412" y="166" width="228" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="526" y="189" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Successor</text>

  <!-- Baton -->
  <rect x="130" y="214" width="316" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="288" y="237" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">n, naming the live old process</text>
  <rect x="450" y="214" width="190" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="545" y="237" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">n+1</text>

  <!-- API -->
  <rect x="130" y="262" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="205" y="285" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Up</text>
  <rect x="284" y="262" width="124" height="36" rx="8" fill="#FCF4E8" stroke="#854F0B" stroke-dasharray="4 4"/>
  <text x="346" y="285" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Down</text>
  <rect x="412" y="262" width="228" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="526" y="285" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Up, fresh token</text>

  <text x="40" y="340" font-size="12" fill="#A32D2D" font-family="ui-monospace,Menlo,Consolas,monospace">oversee</text>
  <text x="96" y="340" font-size="12" fill="#73726c">refused</text>
  <text x="142" y="340" font-size="12" fill="#A32D2D" font-family="ui-monospace,Menlo,Consolas,monospace">overseer-already-running</text>
  <text x="326" y="340" font-size="12" fill="#73726c">throughout: a live process stays named.</text>
</svg>
