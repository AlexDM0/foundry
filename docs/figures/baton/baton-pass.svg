<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Baton pass proves the code before the old Overseer lets go</title>
  <desc>Time runs down across four lanes. The old Overseer takes overseer-restart, writes requested, spawns the successor and keeps driving. The successor proves the code holding no Baton and writes ready. Only then does the old Overseer stop starting Passes, finish the running one, close its listener and write released. The successor binds the port, takes generation n+1, regroups and starts its first forced Pass; the span from letting go to that Pass is the undriven gap. It writes serving and the old Overseer exits. Watchers and agents run throughout and are not stopped; the successor's Regrouping says hello to them from each stored cursor.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="658" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A Baton pass proves the code before the old Overseer lets go</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs down. After the spawn, the two Overseers talk only through one file; dashed arrows read it.</text>

  <!-- undriven gap -->
  <rect x="40" y="338" width="760" height="152" rx="8" fill="#FAEEDA" opacity="0.65"/>
  <text x="460" y="378" font-size="15" font-weight="500" fill="#633806" text-anchor="middle">Undriven gap</text>
  <text x="460" y="397" font-size="13" fill="#854F0B" text-anchor="middle">nobody runs a Pass</text>

  <!-- lane headers -->
  <rect x="60" y="88" width="260" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="111" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Old Overseer, generation n</text>
  <rect x="370" y="88" width="180" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460" y="111" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">baton-pass-&lt;n&gt;.json</text>
  <rect x="590" y="88" width="200" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="690" y="111" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Successor</text>

  <!-- watchers -->
  <rect x="830" y="88" width="130" height="536" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="895" y="111" font-size="15" font-weight="500" fill="#27500A" text-anchor="middle">Watchers</text>
  <text x="895" y="340" font-size="15" font-weight="500" fill="#27500A" text-anchor="middle">Keep running</text>
  <text x="895" y="360" font-size="13" fill="#3B6D11" text-anchor="middle">agents too</text>
  <text x="895" y="378" font-size="13" fill="#3B6D11" text-anchor="middle">not stopped</text>

  <!-- row 1 -->
  <rect x="60" y="142" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="164" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Takes the restart command</text>
  <text x="190" y="183" font-size="13" fill="#185FA5" text-anchor="middle">state passing-baton</text>
  <path d="M320,168 L396,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="150" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460" y="173" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">requested</text>

  <!-- row 2 -->
  <rect x="60" y="210" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="232" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Spawns the successor</text>
  <text x="190" y="251" font-size="13" fill="#185FA5" text-anchor="middle">keeps running Passes</text>
  <path d="M320,236 L586,236" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="460" y="229" font-size="13" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">--successor-of n</text>
  <rect x="590" y="210" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="690" y="232" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Proves the code</text>
  <text x="690" y="251" font-size="13" fill="#185FA5" text-anchor="middle">holds no Baton</text>

  <!-- row 3 -->
  <path d="M690,262 L690,298 L524,298" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="280" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460" y="303" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ready</text>
  <path d="M400,298 L324,298" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="60" y="278" width="260" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="303" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Sees ready</text>
  <path d="M190,318 L190,344" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- row 4 -->
  <rect x="60" y="348" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="370" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Lets go</text>
  <text x="190" y="389" font-size="13" fill="#185FA5" text-anchor="middle">Pass ends, listener closes</text>
  <path d="M190,400 L190,424" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- row 5 -->
  <rect x="60" y="428" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190" y="456" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Reports the release</text>
  <path d="M320,451 L396,451" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="433" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460" y="456" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">released</text>
  <path d="M520,451 L586,451" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="590" y="425" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="690" y="447" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Binds the port</text>
  <text x="690" y="466" font-size="13" fill="#185FA5" text-anchor="middle">takes generation n+1</text>
  <path d="M690,477 L690,504" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- row 6 -->
  <rect x="590" y="508" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="690" y="530" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Regroups, then forced Pass</text>
  <text x="690" y="549" font-size="13" fill="#185FA5" text-anchor="middle">catches up from each cursor</text>

  <!-- row 7 -->
  <path d="M690,560 L690,590 L524,590" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="400" y="572" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460" y="595" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">serving</text>
  <path d="M400,590 L324,590" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="60" y="568" width="260" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="190" y="595" font-size="15" font-weight="500" fill="#27500A" text-anchor="middle">Exits 0</text>
</svg>
