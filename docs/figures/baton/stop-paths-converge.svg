<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every stop path meets one closing sequence</title>
  <desc>oversee stop, the Bridge Stop button and a signal all enter one chain: stop watching, wait for the running Pass and any landing, acknowledge ended Watchers, close the listener, record the stop, remove the Baton. SIGKILL or a crash skips the chain and leaves the Baton reading dead. Agent sessions and their Watchers keep running on every path. Process Watchers are left running too, unless --now stops them, with no grace, after the wait for the Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every stop path meets one closing sequence</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Left to right is the order the Overseer runs them.</text>

  <!-- entries -->
  <rect x="40" y="92" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="119" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee stop</text>
  <rect x="40" y="148" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="175" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Bridge Stop button</text>
  <rect x="40" y="204" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="231" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">SIGTERM, SIGINT</text>

  <path d="M190,114 L204,114 L204,170" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M190,226 L204,226 L204,170" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M190,170 L216,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- chain -->
  <g text-anchor="middle">
    <rect x="220" y="136" width="100" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="270" y="164" font-size="14" font-weight="500" fill="#0C447C">Stop watching</text>
    <text x="270" y="184" font-size="13" fill="#185FA5">file watches</text>
    <rect x="340" y="136" width="128" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="404" y="158" font-size="14" font-weight="500" fill="#0C447C">Wait for the Pass</text>
    <text x="404" y="176" font-size="13" fill="#185FA5">running Pass</text>
    <text x="404" y="193" font-size="13" fill="#185FA5">and any landing</text>
    <rect x="488" y="136" width="100" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="538" y="164" font-size="14" font-weight="500" fill="#0C447C">Acknowledge</text>
    <text x="538" y="184" font-size="13" fill="#185FA5">ended Watchers</text>
    <rect x="608" y="136" width="100" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="658" y="164" font-size="14" font-weight="500" fill="#0C447C">Close listener</text>
    <text x="658" y="184" font-size="13" fill="#185FA5">API goes down</text>
    <rect x="728" y="136" width="112" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="784" y="164" font-size="14" font-weight="500" fill="#0C447C">Record the stop</text>
    <text x="784" y="184" font-size="13" fill="#185FA5">log, registry, stub</text>
    <rect x="860" y="136" width="100" height="68" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="910" y="164" font-size="14" font-weight="500" fill="#444441">Baton gone</text>
    <text x="910" y="184" font-size="13" fill="#5F5E5A">the last act</text>
  </g>
  <path d="M320,170 L336,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M468,170 L484,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M588,170 L604,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M708,170 L724,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M840,170 L856,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- crash -->
  <rect x="40" y="280" width="150" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="115" y="314" font-size="15" font-weight="500" fill="#791F1F" text-anchor="middle">SIGKILL or crash</text>
  <path d="M190,308 L216,308" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="220" y="280" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="320" y="303" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">No closing sequence</text>
  <text x="320" y="322" font-size="13" fill="#A32D2D" text-anchor="middle">Baton stays and reads dead</text>

  <!-- what survives -->
  <rect x="40" y="356" width="600" height="88" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="60" y="394" font-size="15" font-weight="500" fill="#27500A">Agent sessions and their Watchers</text>
  <text x="60" y="414" font-size="13" fill="#3B6D11">keep running on every path, even under --now</text>
  <rect x="660" y="356" width="300" height="88" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="810" y="394" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle">Process Watchers</text>
  <text x="810" y="414" font-size="13" fill="#185FA5" text-anchor="middle">installs and job gates</text>

  <!-- now edge -->
  <path d="M404,204 L404,244 L700,244 L700,352" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="710" y="300" font-size="13" fill="#73726c">--now only: stopped, no grace</text>
  <text x="710" y="319" font-size="13" fill="#73726c">otherwise left running</text>
</svg>
