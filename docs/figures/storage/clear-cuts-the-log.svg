<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Clear cuts the log, not the jobs that lean on it</title>
  <desc>Before and after forge clear, side by side. Before, progress.json holds rows, jobs, decisions and incidents, a job's crashResumes and overseerFirstStartedAt, and log.jsonl holds job-launched, job-ended and every other record. After, rows are reseeded from surviving tickets, jobs, decisions and incidents survive, crashResumes and overseerFirstStartedAt survive, and the log holds only tracker-cleared. A kept live job has a broken link to its missing job-launched record.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="454" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Clear cuts the log, not the jobs that lean on it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">What forge clear leaves in each store</text>
  <text x="190.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Before</text>
  <text x="500.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">After</text>
  <text x="40" y="124" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">progress.json</text>
  <rect x="70" y="134" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="190.0" y="154" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Rows</text>
  <text x="190.0" y="171" font-size="12" fill="#5F5E5A" text-anchor="middle">the chart</text>
  <rect x="380" y="134" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="500.0" y="154" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Rows</text>
  <text x="500.0" y="171" font-size="12" fill="#5F5E5A" text-anchor="middle">reseeded from surviving tickets</text>
  <rect x="70" y="190" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="190.0" y="210" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">crashResumes</text>
  <text x="190.0" y="227" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">overseerFirstStartedAt</text>
  <rect x="380" y="190" width="240" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="500.0" y="210" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">crashResumes</text>
  <text x="500.0" y="227" font-size="12" fill="#3B6D11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">overseerFirstStartedAt</text>
  <rect x="70" y="246" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="190.0" y="266" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Jobs, decisions, incidents</text>
  <text x="190.0" y="283" font-size="12" fill="#5F5E5A" text-anchor="middle">open ones, a live job among them</text>
  <rect x="380" y="246" width="240" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="500.0" y="266" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Jobs, decisions, incidents</text>
  <text x="500.0" y="283" font-size="12" fill="#3B6D11" text-anchor="middle">survive, a live job among them</text>
  <path d="M310,157 L377,157" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345.0" y="151" font-size="11" fill="#73726c" text-anchor="middle">reset</text>
  <path d="M310,213 L377,213" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345.0" y="207" font-size="11" fill="#73726c" text-anchor="middle">kept</text>
  <path d="M310,269 L377,269" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345.0" y="263" font-size="11" fill="#73726c" text-anchor="middle">kept</text>
  <text x="40" y="322" font-size="12" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">log.jsonl</text>
  <rect x="70" y="332" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="190.0" y="352" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-launched</text>
  <text x="190.0" y="369" font-size="12" fill="#5F5E5A" text-anchor="middle">the launch record</text>
  <rect x="70" y="388" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="190.0" y="408" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">job-ended and the rest</text>
  <text x="190.0" y="425" font-size="12" fill="#5F5E5A" text-anchor="middle">every other record</text>
  <rect x="380" y="332" width="240" height="46" rx="8" fill="none" stroke="#A32D2D" stroke-dasharray="5 4"/>
  <text x="500.0" y="352" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-launched</text>
  <text x="500.0" y="369" font-size="12" fill="#A32D2D" text-anchor="middle">gone</text>
  <rect x="380" y="388" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="500.0" y="408" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tracker-cleared</text>
  <text x="500.0" y="425" font-size="12" fill="#5F5E5A" text-anchor="middle">the only record left</text>
  <path d="M310,355 L377,355" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345.0" y="349" font-size="11" fill="#73726c" text-anchor="middle">cut</text>
  <path d="M310,411 L377,411" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345.0" y="405" font-size="11" fill="#73726c" text-anchor="middle">cut</text>
  <path d="M500.0,292 L500.0,329" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M493.0,303 L507.0,317 M507.0,303 L493.0,317" stroke="#A32D2D" stroke-width="2" fill="none"/>
  <text x="514.0" y="314" font-size="11" fill="#A32D2D">its counts read this</text>
</svg>
