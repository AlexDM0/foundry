<svg xmlns="http://www.w3.org/2000/svg" width="680" height="828" viewBox="0 0 680 828" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Once the journal exists, the lock hold finishes</title>
  <desc>One lock hold in order. Take the lock, read into a Board, mutate, write the journal to a temporary file, then the commit point: the rename that lands hold-journal.json whole. After it come progress.json, then pipeline.json and constitution-sources.json, tickets, epics, filing drafts and gate-profiles.json, log.jsonl and last pipeline-setup.json, each when the lock hold changed it, then the journal is removed and the lock released. A fence stops the holder if a higher generation exists, before the journal and before each write after it. A crash above the line leaves every tracker file unchanged; a crash below it is finished by the next lock holder; a refusal in mutate writes nothing.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="826" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Once the journal exists, the lock hold finishes</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The rename of hold-journal.json is the commit point of one lock hold</text>
  <rect x="44" y="92" width="16" height="684" rx="4" fill="#E1DDD0"/>
  <text transform="translate(56 412) rotate(-90)" font-size="11" fill="#444441" text-anchor="middle">lock held</text>
  <rect x="230" y="92" width="200" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="112.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Take the lock</text>
  <text x="330.0" y="129.0" font-size="12" fill="#185FA5" text-anchor="middle">replay any journal first</text>
  <rect x="230" y="150" width="200" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="170.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Read into a Board</text>
  <text x="330.0" y="187.0" font-size="12" fill="#185FA5" text-anchor="middle">board files and log</text>
  <rect x="230" y="208" width="200" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="228.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mutate</text>
  <text x="330.0" y="245.0" font-size="12" fill="#185FA5" text-anchor="middle">Board changes in memory</text>
  <rect x="230" y="266" width="200" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="286.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Journal, temporary file</text>
  <text x="330.0" y="303.0" font-size="12" fill="#185FA5" text-anchor="middle">every file&#x27;s next text</text>
  <path d="M330.0,138 L330.0,146" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330.0,196 L330.0,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330.0,254 L330.0,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="222" y="293" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,312 L330.0,323" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="66" y="326" width="574" height="38" rx="8" fill="#E6F1FB" stroke="#0C447C" stroke-width="1.2"/>
  <text x="80" y="350" font-size="11" fill="#185FA5">commit point</text>
  <text x="330" y="350" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Rename: hold-journal.json lands whole</text>
  <path d="M330.0,364 L330.0,381" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="384" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330.0" y="405" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">progress.json</text>
  <text x="222" y="404" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,416 L330.0,424" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="428" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="449" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json, sources</text>
  <text x="222" y="448" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,460 L330.0,468" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="472" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="493" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">tickets</text>
  <text x="222" y="492" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,504 L330.0,512" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="516" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="537" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">epics</text>
  <text x="222" y="536" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,548 L330.0,556" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="560" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="581" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">filing drafts, gate profiles</text>
  <text x="222" y="580" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,592 L330.0,600" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="604" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="625" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">log.jsonl</text>
  <text x="222" y="624" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,636 L330.0,644" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="648" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#A3A196" stroke-dasharray="5 4"/>
  <text x="330.0" y="669" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-setup.json</text>
  <text x="222" y="668" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,680 L330.0,688" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="692" width="200" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="715" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Remove the journal</text>
  <text x="222" y="714" font-size="11" fill="#185FA5" text-anchor="end">fence</text>
  <path d="M330.0,728 L330.0,736" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="740" width="200" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="763" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Release the lock</text>
  <rect x="70" y="208" width="120" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="130.0" y="228.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Refusal</text>
  <text x="130.0" y="245.0" font-size="12" fill="#A32D2D" text-anchor="middle">writes no tracker file</text>
  <path d="M230,231 L193,231" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M438,92 L450,92 L450,312 L438,312" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M450,202 L467,202" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <rect x="470" y="168" width="170" height="68" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="555.0" y="199.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Crash above the line</text>
  <text x="555.0" y="216.0" font-size="12" fill="#5F5E5A" text-anchor="middle">tracker files unchanged</text>
  <path d="M438,402 L450,402 L450,728 L438,728" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M450,543 L467,543" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <rect x="470" y="497" width="170" height="92" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="555" y="527" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Crash below the line</text>
  <text x="555" y="549" font-size="12" fill="#3B6D11" text-anchor="middle">the next lock holder</text>
  <text x="555" y="566" font-size="12" fill="#3B6D11" text-anchor="middle">rewrites every listed file</text>
  <text x="40" y="804" font-size="11" fill="#73726c">fence: stop if a higher generation exists. Dashed outline: written only when the lock hold changed that file.</text>
</svg>
