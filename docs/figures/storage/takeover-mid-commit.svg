<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The old holder must not touch a journal its successor replayed</title>
  <desc>Three lanes, holder D, holder E and tracker files, with time running down. D writes its journal and its files, then stalls past LOCK_STALE_MILLISECONDS. E creates generation 13, replays D's journal, which removes it, then writes its own journal at the same path. D wakes and its fence refuses lock-taken-over before the removal, so the unlink that would have removed E's journal never runs. D's release create fails, or lands below the newest record.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="522" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The old holder must not touch a journal its successor replayed</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One takeover during a commit, with time running down</text>
  <text x="135" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Holder D</text>
  <text x="325" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Holder E</text>
  <text x="530" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Tracker files</text>
  <path d="M232,90 L232,520" stroke="#ECE7DC" stroke-width="1.2" fill="none"/>
  <path d="M418,90 L418,520" stroke="#ECE7DC" stroke-width="1.2" fill="none"/>
  <rect x="44" y="116" width="16" height="290" rx="4" fill="#E1DDD0"/>
  <text transform="translate(56 261) rotate(-90)" font-size="11" fill="#444441" text-anchor="middle">D believes it holds</text>
  <rect x="238" y="184" width="16" height="182" rx="4" fill="#E1DDD0"/>
  <text transform="translate(250 275) rotate(-90)" font-size="11" fill="#444441" text-anchor="middle">E holds the lock</text>
  <rect x="70" y="116" width="130" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="136" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">D commits</text>
  <text x="135.0" y="153" font-size="12" fill="#185FA5" text-anchor="middle">journal, then files</text>
  <rect x="430" y="116" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="530.0" y="136" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hold-journal.json</text>
  <text x="530.0" y="153" font-size="12" fill="#5F5E5A" text-anchor="middle">D's journal, then D's files</text>
  <path d="M200,139 L427,139" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="184" width="130" height="150" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="135" y="250" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">D stalls</text>
  <text x="135" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">past the stale</text>
  <text x="135" y="284" font-size="12" fill="#5F5E5A" text-anchor="middle">bound</text>
  <path d="M135,162 L135,181" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="262" y="184" width="130" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="327.0" y="204" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-13</text>
  <text x="327.0" y="221" font-size="12" fill="#185FA5" text-anchor="middle">E takes the lock</text>
  <rect x="262" y="252" width="130" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="327.0" y="272" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Replays</text>
  <text x="327.0" y="289" font-size="12" fill="#185FA5" text-anchor="middle">D's journal, whole</text>
  <rect x="262" y="320" width="130" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="327.0" y="340" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Commits</text>
  <text x="327.0" y="357" font-size="12" fill="#185FA5" text-anchor="middle">its own work</text>
  <path d="M327,230 L327,249" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M327,298 L327,317" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="430" y="252" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="530.0" y="272" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Journal removed</text>
  <text x="530.0" y="289" font-size="12" fill="#5F5E5A" text-anchor="middle">D's files all landed</text>
  <path d="M392,275 L427,275" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="430" y="320" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="530.0" y="340" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hold-journal.json</text>
  <text x="530.0" y="357" font-size="12" fill="#5F5E5A" text-anchor="middle">E's, at the same path</text>
  <path d="M392,343 L427,343" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M135,334 L135,357" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="360" width="130" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="135.0" y="380" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Fence refuses</text>
  <text x="135.0" y="397" font-size="12" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">lock-taken-over</text>
  <rect x="430" y="388" width="200" height="46" rx="8" fill="none" stroke="#A32D2D" stroke-dasharray="5 4"/>
  <text x="530.0" y="408" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">unlink never runs</text>
  <text x="530.0" y="425" font-size="12" fill="#A32D2D" text-anchor="middle">would remove E's journal</text>
  <path d="M200,411 L427,411" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <path d="M308,403 L324,419 M324,403 L308,419" stroke="#A32D2D" stroke-width="2" fill="none"/>
  <path d="M135,406 L135,441" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="444" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135.0" y="464" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">D's release</text>
  <text x="135.0" y="481" font-size="12" fill="#5F5E5A" text-anchor="middle">create fails, or</text>
  <text x="135" y="492" font-size="12" fill="#5F5E5A" text-anchor="middle">lands below newest</text>
</svg>
