<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Readers see a staircase until the log lands</title>
  <desc>A matrix with one row per crash point and one column per file: hold-journal.json, progress.json, pipeline.json, tickets, epics, filing drafts, log.jsonl. Before the journal lands every file is old and no journal exists. Once it lands the journal is present and the files turn new one at a time from left to right, in a staircase, until log.jsonl is new. After the journal goes every file is new and no journal exists. In the five rows between them the files disagree. In all seven rows with the journal present, the next lock holder replays it and finishes the change.</desc>
