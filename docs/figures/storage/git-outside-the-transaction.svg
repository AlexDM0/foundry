<svg xmlns="http://www.w3.org/2000/svg" width="680" height="544" viewBox="0 0 680 544" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The journal covers tracker files; git has already moved</title>
  <desc>Three lanes: the holder, tracker files, git. Inside a lock hold, mutate runs a git command and the commit lands on the target at once, while the Board changes stay in memory. A crash or a tripped fence before the journal loses the Board changes and leaves tracker files unchanged, and the git commit stays. A later lock hold repeats the step, landOnTarget answers already-landed because the target holds the commit, and the journal then records the landing in the tracker files.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="542" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The journal covers tracker files; git has already moved</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A landing inside a lock hold, cut short and repeated</text>
  <text x="153" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Holder</text>
  <text x="349" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Tracker files</text>
  <text x="547.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">git</text>
  <path d="M250,90 L250,524" stroke="#ECE7DC" stroke-width="1.2" fill="none"/>
  <path d="M448,90 L448,524" stroke="#ECE7DC" stroke-width="1.2" fill="none"/>
  <rect x="44" y="116" width="16" height="224" rx="4" fill="#E1DDD0"/>
  <text transform="translate(56 228) rotate(-90)" font-size="11" fill="#444441" text-anchor="middle">first lock hold</text>
  <rect x="44" y="372" width="16" height="150" rx="4" fill="#E1DDD0"/>
  <text transform="translate(56 447) rotate(-90)" font-size="11" fill="#444441" text-anchor="middle">later lock hold</text>
  <rect x="70" y="116" width="166" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="153" y="136.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mutate</text>
  <text x="153" y="153.0" font-size="12" fill="#185FA5" text-anchor="middle">runs a git command</text>
  <rect x="454" y="116" width="186" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="547.0" y="136.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Commit on target</text>
  <text x="547.0" y="153.0" font-size="12" fill="#5F5E5A" text-anchor="middle">lands at once</text>
  <path d="M236,139 L451,139" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="133" font-size="11" fill="#73726c" text-anchor="middle">git moves now</text>
  <rect x="70" y="196" width="166" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="153" y="216.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Board changes</text>
  <text x="153" y="233.0" font-size="12" fill="#185FA5" text-anchor="middle">in memory only</text>
  <path d="M153,162 L153,193" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="294" width="166" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="153" y="314.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Crash or tripped fence</text>
  <text x="153" y="331.0" font-size="12" fill="#A32D2D" text-anchor="middle">before the journal</text>
  <path d="M153,242 L153,291" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="279" y="294" width="140" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="349" y="314.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Board changes lost</text>
  <text x="349" y="331.0" font-size="12" fill="#5F5E5A" text-anchor="middle">files unchanged</text>
  <path d="M236,317 L276,317" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="454" y="294" width="186" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="547.0" y="314.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Commit stays</text>
  <text x="547.0" y="331.0" font-size="12" fill="#3B6D11" text-anchor="middle">git does not roll back</text>
  <path d="M547,162 L547,291" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="372" width="166" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="153" y="392.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Repeat the step</text>
  <text x="153" y="409.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">landOnTarget</text>
  <rect x="454" y="372" width="186" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="547.0" y="392.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Target holds the commit</text>
  <text x="547.0" y="409.0" font-size="12" fill="#5F5E5A" text-anchor="middle">asked first</text>
  <path d="M236,388 L451,388" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M451,404 L239,404" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="382" font-size="11" fill="#73726c" text-anchor="middle">an ancestor of the target?</text>
  <text x="344" y="420" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">already-landed</text>
  <path d="M153,418 L153,473" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="476" width="166" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="153" y="496.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Commit the lock hold</text>
  <text x="153" y="513.0" font-size="12" fill="#185FA5" text-anchor="middle">the board side</text>
  <rect x="279" y="476" width="140" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="349" y="496.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Landing recorded</text>
  <text x="349" y="513.0" font-size="12" fill="#3B6D11" text-anchor="middle">through the journal</text>
  <path d="M236,499 L276,499" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
