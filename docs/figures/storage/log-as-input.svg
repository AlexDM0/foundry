<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The log decides what happens next</title>
  <desc>Log record kinds on the left feed three clusters of derived facts. ticket-readied, ticket-reopened and merge-queued give ready order and merge order, which decide which ticket launches or lands first. job-launched, job-ended, job-resumed and incident-opened give attempts and review rounds, failed passes, red-handoff resumes, consecutive replacements and Assistant boots, which decide when a retry stops. incident-defaulted, hatch-applied and agent-stopped give an incident's default action taken once, request applied once and tokens already credited, so nothing applies twice. tracker-cleared, from a User clear, keeps only the records from the clearing on, drawn as a dashed line labelled restarts, so all three clusters start again.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="588" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The log decides what happens next</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each fact below is read back from log.jsonl, and each drives a move</text>
  <text x="40" y="102" font-size="12" fill="#5F5E5A">log records</text>
  <text x="280" y="102" font-size="12" fill="#5F5E5A">derived facts, and what they drive</text>
  <rect x="280" y="112" width="312" height="104" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="296" y="135" font-size="14" font-weight="500" fill="#0C447C">Order</text>
  <text x="296" y="155" font-size="12" fill="#185FA5">Ready order</text>
  <text x="296" y="173" font-size="12" fill="#185FA5">Merge order</text>
  <path d="M296,186 L576,186" stroke="#CFE2F6" stroke-width="1" fill="none"/>
  <text x="296" y="205" font-size="12" font-weight="500" fill="#0C447C">Decides: which ticket launches or lands first</text>
  <rect x="40" y="113.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="133.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-readied</text>
  <path d="M216,128.0 C245,128.0 250,164.0 277,164.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="149.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="169.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-reopened</text>
  <path d="M216,164.0 C245,164.0 250,164.0 277,164.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="185.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="205.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">merge-queued</text>
  <path d="M216,200.0 C245,200.0 250,164.0 277,164.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="280" y="228" width="312" height="158" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="296" y="251" font-size="14" font-weight="500" fill="#0C447C">Counts</text>
  <text x="296" y="271" font-size="12" fill="#185FA5">Attempts, review round</text>
  <text x="296" y="289" font-size="12" fill="#185FA5">Failed passes</text>
  <text x="296" y="307" font-size="12" fill="#185FA5">Red-handoff resumes</text>
  <text x="296" y="325" font-size="12" fill="#185FA5">Consecutive replacements of a ticket's job</text>
  <text x="296" y="343" font-size="12" fill="#185FA5">Assistant boots</text>
  <path d="M296,356 L576,356" stroke="#CFE2F6" stroke-width="1" fill="none"/>
  <text x="296" y="375" font-size="12" font-weight="500" fill="#0C447C">Decides: when a retry stops</text>
  <rect x="40" y="238.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="258.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-launched</text>
  <path d="M216,253.0 C245,253.0 250,307.0 277,307.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="274.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
