  <path d="M216,289.0 C245,289.0 250,307.0 277,307.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="310.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="330.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-resumed</text>
  <path d="M216,325.0 C245,325.0 250,307.0 277,307.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="346.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="366.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incident-opened</text>
  <path d="M216,361.0 C245,361.0 250,307.0 277,307.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="280" y="398" width="312" height="122" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="296" y="421" font-size="14" font-weight="500" fill="#0C447C">Once-only guards</text>
  <text x="296" y="441" font-size="12" fill="#185FA5">An incident's default action, taken once</text>
  <text x="296" y="459" font-size="12" fill="#185FA5">Request applied once</text>
  <text x="296" y="477" font-size="12" fill="#185FA5">Tokens already credited</text>
  <path d="M296,490 L576,490" stroke="#CFE2F6" stroke-width="1" fill="none"/>
  <text x="296" y="509" font-size="12" font-weight="500" fill="#0C447C">Decides: nothing applies twice</text>
  <rect x="40" y="408.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="428.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incident-defaulted</text>
  <path d="M216,423.0 C245,423.0 250,459.0 277,459.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="444.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="464.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch-applied</text>
  <path d="M216,459.0 C245,459.0 250,459.0 277,459.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="480.0" width="176" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="500.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-stopped</text>
  <path d="M216,495.0 C245,495.0 250,459.0 277,459.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M624,538 L624,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M624,164 L595,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M624,307 L595,307" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M624,459 L595,459" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text transform="translate(638 384) rotate(-90)" font-size="11" fill="#73726c" text-anchor="middle">restarts</text>
  <rect x="40" y="538" width="600" height="34" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="56" y="560" font-size="13" font-weight="500" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">tracker-cleared</text>
  <text x="186" y="560" font-size="12" fill="#854F0B">A User clearing keeps only the records from it on, so all three restart</text>
</svg>
