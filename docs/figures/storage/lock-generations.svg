<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Taking over is creating the next number</title>
  <desc>Three timelines of lock generation records. Normal: process A creates generation 7 held, then releases by creating generation 8 released. Dead holder: process B holds generation 9 and dies with its record left in place; process C sees the process gone and creates generation 10. Live stale holder: process D holds generation 12 past LOCK_STALE_MILLISECONDS; process E creates generation 13. D keeps running, so for a while both believe they hold, until the next fence after generation 13 exists refuses D with lock-taken-over and D writes no further tracker file.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="514" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Taking over is creating the next number</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Records are never renamed or rewritten</text>
  <text x="40" y="102" font-size="13" font-weight="500" fill="#3d3d3a">Normal release</text>
  <rect x="50" y="116" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125.0" y="136.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-7</text>
  <text x="125.0" y="153.0" font-size="12" fill="#5F5E5A" text-anchor="middle">held by A</text>
  <rect x="430" y="116" width="150" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="505.0" y="136.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-8</text>
  <text x="505.0" y="153.0" font-size="12" fill="#3B6D11" text-anchor="middle">released by A</text>
  <path d="M200,139 L427,139" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="315" y="133" font-size="11" fill="#73726c" text-anchor="middle">A commits, then creates the next</text>
  <rect x="50" y="170" width="380" height="16" rx="4" fill="#E1DDD0"/>
  <text x="240" y="182" font-size="11" fill="#444441" text-anchor="middle">lock held</text>
  <text x="40" y="212" font-size="13" font-weight="500" fill="#3d3d3a">The holder dies</text>
  <rect x="50" y="226" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125.0" y="246.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-9</text>
  <text x="125.0" y="263.0" font-size="12" fill="#5F5E5A" text-anchor="middle">held by B</text>
  <rect x="232" y="226" width="166" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="315.0" y="246.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">B dies</text>
  <text x="315.0" y="263.0" font-size="12" fill="#A32D2D" text-anchor="middle">process gone, record stays</text>
  <rect x="430" y="226" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="505.0" y="246.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-10</text>
  <text x="505.0" y="263.0" font-size="12" fill="#5F5E5A" text-anchor="middle">held by C</text>
  <path d="M200,249 L229,249" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M398,249 L427,249" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="50" y="280" width="182" height="16" rx="4" fill="#E1DDD0"/>
  <text x="141" y="292" font-size="11" fill="#444441" text-anchor="middle">lock held</text>
  <rect x="430" y="280" width="210" height="16" rx="4" fill="#E1DDD0"/>
  <text x="535" y="292" font-size="11" fill="#444441" text-anchor="middle">lock held by C, after replay</text>
  <text x="40" y="322" font-size="13" font-weight="500" fill="#3d3d3a">A live holder goes stale</text>
  <rect x="50" y="336" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125.0" y="356.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-12</text>
  <text x="125.0" y="373.0" font-size="12" fill="#5F5E5A" text-anchor="middle">held by D</text>
  <rect x="250" y="336" width="130" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="315.0" y="356.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">E takes over</text>
  <text x="315.0" y="373.0" font-size="12" fill="#185FA5" text-anchor="middle">past stale bound</text>
  <rect x="430" y="336" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="505.0" y="356.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">generation-13</text>
  <text x="505.0" y="373.0" font-size="12" fill="#5F5E5A" text-anchor="middle">held by E</text>
  <path d="M200,359 L247,359" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M380,359 L427,359" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="430" y="390" width="210" height="16" rx="4" fill="#E1DDD0"/>
  <text x="535" y="402" font-size="11" fill="#444441" text-anchor="middle">lock held by E</text>
  <rect x="50" y="410" width="520" height="16" rx="4" fill="#E1DDD0"/>
  <rect x="430" y="410" width="140" height="16" rx="4" fill="#F3D2D2"/>
  <text x="500" y="422" font-size="11" fill="#791F1F" text-anchor="middle">both believe they hold</text>
  <text x="240" y="422" font-size="11" fill="#444441" text-anchor="middle">D believes it holds</text>
  <path d="M570,418 L580,418 L580,445" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="590" y="436" font-size="11" fill="#73726c">next fence</text>
  <rect x="430" y="448" width="210" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="446" y="468" font-size="13" font-weight="500" fill="#791F1F">D stops:</text>
  <text x="500" y="468" font-size="13" font-weight="500" fill="#791F1F" font-family="ui-monospace,Menlo,Consolas,monospace">lock-taken-over</text>
  <text x="535" y="486" font-size="12" fill="#A32D2D" text-anchor="middle">writes no further tracker file</text>
</svg>
