<svg xmlns="http://www.w3.org/2000/svg" width="680" height="704" viewBox="0 0 680 704" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A control is recorded first and reaches the session later</title>
  <desc>A job control is recorded in a hold, whichever door it used. If no Overseer is up it waits in the stored log and job record. After a later Pass hold, deliverJobControls walks the frames of each job. A frame with a marker is skipped and the next frame is tried. If the Watcher is not live, or did not take the frame, the job's remaining frames wait for a later Pass. Otherwise the Watcher takes the frame and the marker is written; the Watcher hands it to the session and nothing acknowledges that. A crash before the marker sends the frame again. When no frames are left, delivery moves to the next job. A build or review stop goes through deliverBuildJobFrames, under the same marker rule.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="702" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">A control is recorded first and reaches the session later</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">job message, wind-down and stop write the board; a Pass delivers the frame.</text>
  <rect x="170" y="86" width="320" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="330.0" y="108.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">job message, wind-down, session job stop</text>
  <text x="330.0" y="126.0" font-size="12" fill="#854F0B" text-anchor="middle">any door that may run it</text>
  <path d="M330,138 L330,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="170" y="162" width="320" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330.0" y="184.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Log record and job record</text>
  <text x="330.0" y="202.0" font-size="12" fill="#5F5E5A" text-anchor="middle">written in the hold; nothing signalled</text>
  <rect x="40" y="232" width="600" height="48" rx="10" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="56" y="261" font-size="13" fill="#854F0B" text-anchor="start">Overseer down or busy: it waits on disk</text>
  <path d="M330,214 L330,292" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="170" y="294" width="320" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="316.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">After a Pass hold</text>
  <text x="330.0" y="334.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">deliverJobControls, job by job</text>
  <text x="496" y="306" font-size="11" fill="#73726c" text-anchor="start">A build or review stop:</text>
  <text x="496" y="321" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">deliverBuildJobFrames</text>
  <text x="496" y="336" font-size="11" fill="#73726c" text-anchor="start">same marker rule</text>
  <path d="M330,346 L330,382" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="170" y="384" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="408.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Marker present for this frame?</text>
  <text x="330.0" y="426.0" font-size="12" fill="#185FA5" text-anchor="middle">a marker file in the job folder</text>
  <path d="M490,412 L528,412" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="500" y="404" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <rect x="530" y="384" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585.0" y="408.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Skip it</text>
  <text x="585.0" y="426.0" font-size="12" fill="#5F5E5A" text-anchor="middle">sent already</text>
  <path d="M585,384 L585,366 L440,366 L440,382" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="500" y="361" font-size="11" fill="#73726c" text-anchor="start">next frame</text>
  <path d="M330,440 L330,464" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="456" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="170" y="466" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="490.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher live and took it?</text>
  <text x="330.0" y="508.0" font-size="12" fill="#185FA5" text-anchor="middle">connected, frames written</text>
  <path d="M490,494 L528,494" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="500" y="486" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="530" y="466" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="585.0" y="490.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Frames wait</text>
  <text x="585.0" y="508.0" font-size="12" fill="#854F0B" text-anchor="middle">until a later Pass</text>
  <path d="M330,522 L330,624" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="321" y="538" font-size="11" fill="#73726c" text-anchor="end">yes</text>
  <path d="M330,562 L492,562" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="339" y="555" font-size="11" fill="#73726c" text-anchor="start">hands it on, unacknowledged</text>
  <rect x="494" y="536" width="146" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="567.0" y="558.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Session gets it</text>
  <text x="567.0" y="576.0" font-size="12" fill="#993C1D" text-anchor="middle">line, closed input or stop</text>
  <path d="M170,600 L640,600" fill="none" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="342" y="594" font-size="11" fill="#A32D2D" text-anchor="start">crash here: sent again</text>
  <rect x="170" y="626" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330.0" y="650.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Marker written</text>
  <text x="330.0" y="668.0" font-size="12" fill="#5F5E5A" text-anchor="middle">once the Watcher took it</text>
  <path d="M150,600 L134,600" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="577" width="92" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="86" y="597" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">No frames left</text>
  <text x="86" y="613" font-size="12" fill="#5F5E5A" text-anchor="middle">next job</text>
  <path d="M170,654 L150,654 L150,412 L168,412" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="144" y="526" font-size="11" fill="#73726c" text-anchor="end">next frame</text>
  <text x="144" y="541" font-size="11" fill="#73726c" text-anchor="end">of this job</text>
</svg>
