<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three doors end in one ControlService.apply</title>
  <desc>A verb typed at a terminal takes the lock itself, Overseer up or down. A session under a job writes a Hatch request, which a live Overseer reads in a Pass and passes through the Bouncer inside its hold. The Bridge posts to the Overseer's API. All three reach ControlService.apply inside one writeTracker hold, which writes the board and the log. Only the Hatch door has the Bouncer's role check.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="638" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Three doors end in one ControlService.apply</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Only the terminal door works with no Overseer; a Hatch request waits for one.</text>
  <rect x="40" y="88" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="130.0" y="112.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User at a terminal</text>
  <text x="130.0" y="130.0" font-size="12" fill="#854F0B" text-anchor="middle">a verb, no job</text>
  <rect x="250" y="88" width="180" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340.0" y="112.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent session</text>
  <text x="340.0" y="130.0" font-size="12" fill="#993C1D" text-anchor="middle">same verb, under a job</text>
  <rect x="460" y="88" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="550.0" y="112.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User in the Bridge</text>
  <text x="550.0" y="130.0" font-size="12" fill="#854F0B" text-anchor="middle">a button</text>
  <path d="M340,144 L340,174" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="176" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="198.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch request file</text>
  <text x="340.0" y="216.0" font-size="12" fill="#5F5E5A" text-anchor="middle">waits if nobody reads</text>
  <path d="M340,228 L340,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="244" y="250" width="396" height="104" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="352" y="268" font-size="11" fill="#73726c" text-anchor="start">Needs a live Overseer</text>
  <rect x="250" y="276" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="304.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass reads it</text>
  <text x="340.0" y="322.0" font-size="12" fill="#185FA5" text-anchor="middle">pendingRequestsOf</text>
  <path d="M545,144 L545,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="553" y="196" font-size="11" fill="#73726c" text-anchor="start">HTTP, with</text>
  <text x="553" y="212" font-size="11" fill="#73726c" text-anchor="start">the API token</text>
  <rect x="460" y="276" width="170" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="545.0" y="304.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">API route</text>
  <text x="545.0" y="322.0" font-size="12" fill="#185FA5" text-anchor="middle">POST /api/commands</text>
  <rect x="40" y="376" width="600" height="170" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="352" y="396" font-size="12" fill="#5F5E5A" text-anchor="start">One writeTracker hold</text>
  <path d="M340,340 L340,402" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="404" width="180" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="425.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer</text>
  <text x="340.0" y="443.0" font-size="12" fill="#185FA5" text-anchor="middle">role check, Hatch only</text>
  <path d="M340,454 L340,476" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="220" y="478" width="240" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="508.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ControlService.apply</text>
  <path d="M130,144 L130,503 L218,503" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="196" font-size="11" fill="#73726c" text-anchor="start">takes the lock itself</text>
  <text x="138" y="212" font-size="11" fill="#73726c" text-anchor="start">Overseer up or down</text>
  <path d="M545,340 L545,503 L462,503" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,528 L340,566" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="568" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="590.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board and log</text>
  <text x="340.0" y="608.0" font-size="12" fill="#5F5E5A" text-anchor="middle">what the Overseer acts on</text>
</svg>
