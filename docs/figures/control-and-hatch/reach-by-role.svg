  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">User reaches every family; each role holds a narrow stripe</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">Kinds each caller may run, by applier family, at commit 9c686e6f. The count under a family is its kinds.</text>
