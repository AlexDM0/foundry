<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="546" viewBox="0 0 1072 546" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>User reaches every family; each role holds a narrow stripe</title>
  <desc>A matrix of six callers against the twelve applier families, with the number of kinds each may run. User at a terminal reaches all 71. Worker roles reach one Ticket kind and one Job kind. The product owner reaches 7 Ticket kinds, all 10 Filing kinds and 3 Job kinds. The Assistant reaches all 4 Incident kinds and 1 Repair kind; its table also allows 2 Job kinds and 1 Repair kind, which the second rung refuses at the Hatch. The pipeline agent reaches 1 Job kind and all 5 Pipeline agent kinds. A job with no role reaches nothing.</desc>
