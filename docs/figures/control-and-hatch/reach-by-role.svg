<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>User reaches every family; each role holds one narrow stripe</title>
  <desc>A matrix of five callers against the nine applier families, with the number of kinds each may run. User at a terminal reaches all 48. Worker roles reach one Ticket kind. The product owner reaches 7 Ticket kinds, all 10 Filing kinds and 1 Job kind. The Assistant reaches all 4 Incident kinds and 1 Repair kind; its table also allows 2 Job kinds, 1 Repair kind and 4 Airlock kinds, which the second rung refuses at the Hatch. Every other role reaches nothing.</desc>
