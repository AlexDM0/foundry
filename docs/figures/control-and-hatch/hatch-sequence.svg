<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="0 0 1000 724" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>queued is a promise: the request stays and is decided once</title>
  <desc>A session writes a request file and looks for a reply up to HATCH_REPLY_TRIES times. The Overseer reads the request outside the lock, then in its hold runs the request checks, the Bouncer and ControlService, and recordHatchApplied logs hatch-applied whether a rung refused or the command applied. After the hold commits it writes the reply. Two alternative endings follow. If the tries run out first, the session prints queued at exit 0 and goes on; a later Pass decides the request and nobody reads the reply. If the session is still looking when the reply lands, it prints done or nothing-to-do at exit 0, or a refusal at exit 1 or 2. A crash after the commit and before the reply leaves the request applied, so the next Pass skips it, no reply is written and the session sees queued.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="722" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">queued is a promise: the request stays and is decided once</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">One relayed verb with two alternative endings. Time runs down. The shaded band is the Overseer's lock hold.</text>
  <rect x="225" y="88" width="150" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="300.0" y="113.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent session</text>
  <rect x="445" y="88" width="150" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="113.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <rect x="645" y="88" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="720.0" y="113.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board and log</text>
  <rect x="805" y="88" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="880.0" y="113.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch folder</text>
  <rect x="335" y="258" width="430" height="232" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="357" y="278" font-size="13" fill="#5F5E5A" text-anchor="start">writeTracker hold, before any Watcher event</text>
  <path d="M300,128 L300,166" fill="none" stroke="#E1DDD0" stroke-width="1.2" stroke-dasharray="2 4"/>
  <path d="M520,128 L520,258" fill="none" stroke="#E1DDD0" stroke-width="1.2" stroke-dasharray="2 4"/>
  <path d="M720,128 L720,490" fill="none" stroke="#E1DDD0" stroke-width="1.2" stroke-dasharray="2 4"/>
  <path d="M880,128 L880,630" fill="none" stroke="#E1DDD0" stroke-width="1.2" stroke-dasharray="2 4"/>
  <path d="M300,166 L878,166" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="316" y="158" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">writes requests/&lt;id&gt;.json</text>
  <text x="868" y="158" font-size="13" fill="#73726c" text-anchor="end">atomic</text>
  <rect x="294" y="166" width="12" height="460" rx="3" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="284" y="186" font-size="13" fill="#993C1D" text-anchor="end">waits, looks up to</text>
  <text x="284" y="204" font-size="13" fill="#993C1D" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">HATCH_REPLY_TRIES times</text>
  <path d="M880,214 L522,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="532" y="206" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">pendingRequestsOf</text>
  <text x="868" y="206" font-size="13" fill="#73726c" text-anchor="end">outside the lock</text>
  <text x="145" y="232" font-size="13" font-weight="500" fill="#993C1D" text-anchor="middle">If the tries run out first</text>
  <path d="M294,266 L252,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="240" width="210" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="145.0" y="261.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">queued &lt;id&gt;, exit 0</text>
  <text x="145.0" y="279.0" font-size="13" fill="#993C1D" text-anchor="middle">no answer yet; never repeat it</text>
  <path d="M145,292 L145,326" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="145" y="346" font-size="13" fill="#73726c" text-anchor="middle">a later Pass decides it, and</text>
  <text x="145" y="364" font-size="13" fill="#73726c" text-anchor="middle">nobody reads the reply</text>
  <rect x="425" y="290" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="308.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">request checks</text>
  <text x="520.0" y="326.0" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Bouncer.verdictOf</text>
  <path d="M520,336 L520,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="425" y="356" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="384.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ControlService.apply</text>
  <path d="M615,379 L718,379" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="625" y="371" font-size="13" fill="#73726c" text-anchor="start">changes</text>
  <path d="M520,402 L520,420" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="425" y="422" width="190" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="443.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">recordHatchApplied</text>
  <text x="520.0" y="461.0" font-size="13" fill="#185FA5" text-anchor="middle">logs hatch-applied, always</text>
  <path d="M615,448 L718,448" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="625" y="440" font-size="13" fill="#73726c" text-anchor="start">logged</text>
  <path d="M425,313 L403,313 L403,448 L423,448" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M425,379 L403,379" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="397" y="340" font-size="13" fill="#A32D2D" text-anchor="end">refused,</text>
  <text x="397" y="358" font-size="13" fill="#A32D2D" text-anchor="end">any rung</text>
  <path d="M520,490 L520,576 L878,576" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M316,520 L950,520" fill="none" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="532" y="512" font-size="13" fill="#A32D2D" text-anchor="start">crash here: applied, no reply; the next Pass skips it</text>
  <text x="532" y="538" font-size="13" fill="#A32D2D" text-anchor="start">the session sees queued</text>
  <text x="532" y="568" font-size="13" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">writes replies/&lt;id&gt;.json</text>
  <text x="868" y="568" font-size="13" fill="#73726c" text-anchor="end">after the commit</text>
  <path d="M880,604 L308,604" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="868" y="596" font-size="13" fill="#73726c" text-anchor="end">next look finds the reply</text>
  <text x="284" y="596" font-size="13" font-weight="500" fill="#993C1D" text-anchor="end">If still looking when the reply lands</text>
  <path d="M300,626 L300,648" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="650" width="220" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="300.0" y="671.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">done, nothing-to-do</text>
  <text x="300.0" y="689.0" font-size="13" fill="#993C1D" text-anchor="middle">exit 0</text>
  <path d="M306,618 L540,618 L540,648" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="420" y="650" width="240" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="540.0" y="671.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">refused</text>
  <text x="540.0" y="689.0" font-size="13" fill="#A32D2D" text-anchor="middle">exit 1 or 2</text>
</svg>
