<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every kind needs a verb, and every mutating verb exactly one home</title>
  <desc>Three columns: ControlCommand kinds, the mutating verbs the command table answers, and NOT_RELAYABLE_MUTATING_VERBS. A kind links to its verb, and a list entry links to its verb. contractViolationsOf fails in four cases: a kind whose verb the table does not answer, a list entry the table does not answer, a verb with neither a kind nor a list entry, and a verb placed twice.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Every kind needs a verb, and every mutating verb exactly one home</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">cli/ControlContract.spec.ts checks both directions.</text>
  <text x="130.0" y="98" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Control kinds</text>
  <text x="340.0" y="98" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Command table verbs</text>
  <text x="640" y="98" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">NOT_RELAYABLE_MUTATING_VERBS</text>
