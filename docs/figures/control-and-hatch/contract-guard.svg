  <text x="340.0" y="132.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket add</text>
  <rect x="40" y="152" width="180" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
