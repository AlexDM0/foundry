<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One frame not taken holds back every frame behind it</title>
  <desc>Pass 1 of a session job being stopped: message-1 is taken and marked, message-2 is not taken, so message-3, close-input and stop wait. In Pass 2 message-1 is skipped by its marker, and delivery resumes at message-2 and takes the rest. A build job's stop goes out earlier in the Pass through deliverBuildJobFrames, so a message not yet taken does not hold it back.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="390" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">One frame not taken holds back every frame behind it</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">A session job being stopped, its frames in deliverJobControls send order.</text>
  <text x="40" y="96" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Pass 1</text>
  <rect x="40" y="104" width="112" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="96.0" y="124.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-1</text>
  <text x="96.0" y="142.0" font-size="11" fill="#3B6D11" text-anchor="middle">taken, marked</text>
  <path d="M152,129 L160,129" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="162" y="104" width="112" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="218.0" y="124.0" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-2</text>
  <text x="218.0" y="142.0" font-size="11" fill="#854F0B" text-anchor="middle">not taken</text>
  <path d="M274,129 L282,129" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="284" y="104" width="112" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="340.0" y="124.0" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-3</text>
  <text x="340.0" y="142.0" font-size="11" fill="#854F0B" text-anchor="middle">waits</text>
  <path d="M396,129 L404,129" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="406" y="104" width="112" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="462.0" y="124.0" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">close-input</text>
  <text x="462.0" y="142.0" font-size="11" fill="#854F0B" text-anchor="middle">waits</text>
  <path d="M518,129 L526,129" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="528" y="104" width="112" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="584.0" y="124.0" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop</text>
  <text x="584.0" y="142.0" font-size="11" fill="#854F0B" text-anchor="middle">waits</text>
  <text x="40" y="182" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Pass 2</text>
  <rect x="40" y="190" width="112" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="96.0" y="210.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-1</text>
  <text x="96.0" y="228.0" font-size="11" fill="#5F5E5A" text-anchor="middle">marker: skipped</text>
  <path d="M152,215 L160,215" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="162" y="190" width="112" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="218.0" y="210.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-2</text>
  <text x="218.0" y="228.0" font-size="11" fill="#3B6D11" text-anchor="middle">taken, marked</text>
  <path d="M274,215 L282,215" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="284" y="190" width="112" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="340.0" y="210.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-3</text>
  <text x="340.0" y="228.0" font-size="11" fill="#3B6D11" text-anchor="middle">taken, marked</text>
  <path d="M396,215 L404,215" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="406" y="190" width="112" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="462.0" y="210.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">close-input</text>
  <text x="462.0" y="228.0" font-size="11" fill="#3B6D11" text-anchor="middle">taken, marked</text>
  <path d="M518,215 L526,215" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="528" y="190" width="112" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="584.0" y="210.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop</text>
  <text x="584.0" y="228.0" font-size="11" fill="#3B6D11" text-anchor="middle">taken, marked</text>
  <text x="40" y="268" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">A build job in one Pass: its stop has its own path</text>
  <rect x="40" y="276" width="234" height="50" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="157.0" y="296.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop</text>
  <text x="157.0" y="314.0" font-size="11" fill="#3B6D11" text-anchor="middle">deliverBuildJobFrames, first</text>
  <rect x="286" y="276" width="112" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="342.0" y="296.0" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message-1</text>
  <text x="342.0" y="314.0" font-size="11" fill="#854F0B" text-anchor="middle">not taken</text>
  <text x="410" y="298" font-size="11" fill="#73726c" text-anchor="start">deliverJobControls, later:</text>
  <text x="410" y="313" font-size="11" fill="#73726c" text-anchor="start">it holds nothing back</text>
  <text x="40" y="352" font-size="12" fill="#5F5E5A" text-anchor="start">Green: the Watcher took it. Amber: it waits for a later Pass. Gray: sent already.</text>
</svg>
