<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A request's job and role come from its folder, never its contents</title>
  <desc>Session J7 writes a request into its own folder hatch/J7/requests/. Its Bash is stopped at another job's Hatch folder by the sandbox, but its Edit and Write tools get through, because no deny rule names that folder, and a request planted there acts as that job. Bash is stopped at the data folder by the sandbox, and Edit and Write by a deny rule. The Overseer reads the request from the folder, maps folder J7 to the job record, which gives the role builder, and writes the reply to hatch/J7/replies/. A request claiming role reviewer is refused hatch-identity-mismatch.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker><marker id="ah-coral" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#993C1D"/></marker></defs>
  <rect x="1" y="1" width="678" height="410" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">A request's job and role come from its folder, never its contents</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The sandbox limits what a session's Bash can write; the Overseer trusts only the folder.</text>
  <rect x="40" y="92" width="150" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115.0" y="115.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Session J7</text>
  <text x="115.0" y="133.0" font-size="12" fill="#993C1D" text-anchor="middle">a builder job</text>
  <rect x="250" y="92" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="115.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch/J7/requests/</text>
  <text x="345.0" y="133.0" font-size="12" fill="#5F5E5A" text-anchor="middle">its own folder</text>
  <rect x="250" y="164" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="187.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch/J7/replies/</text>
  <text x="345.0" y="205.0" font-size="12" fill="#5F5E5A" text-anchor="middle">it reads the reply</text>
  <rect x="250" y="260" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="283.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch/J8/requests/</text>
  <text x="345.0" y="301.0" font-size="12" fill="#5F5E5A" text-anchor="middle">a request here acts as J8</text>
  <rect x="250" y="332" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="345.0" y="355.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;</text>
  <text x="345.0" y="373.0" font-size="12" fill="#5F5E5A" text-anchor="middle">board, log, lock</text>
  <path d="M190,120 L248,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="219" y="112" font-size="11" fill="#73726c" text-anchor="middle">writes</text>
  <path d="M130,148 L130,274 L248,274" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#ah-coral)"/>
  <text x="138" y="254" font-size="11" fill="#993C1D" text-anchor="start">Edit, Write: no deny rule,</text>
  <text x="138" y="268" font-size="11" fill="#993C1D" text-anchor="start">gets through</text>
  <path d="M90,148 L90,302 L222,302" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M90,302 L90,360 L222,360" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M222,293 L222,311" fill="none" stroke="#A32D2D" stroke-width="2.4"/>
  <path d="M222,351 L222,369" fill="none" stroke="#A32D2D" stroke-width="2.4"/>
  <text x="98" y="295" font-size="11" fill="#A32D2D" text-anchor="start">sandbox denies Bash</text>
  <text x="98" y="352" font-size="11" fill="#A32D2D" text-anchor="start">sandbox and deny rule</text>
  <rect x="500" y="92" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="570.0" y="115.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="570.0" y="133.0" font-size="12" fill="#185FA5" text-anchor="middle">reads the folder</text>
  <path d="M440,120 L498,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="469" y="112" font-size="11" fill="#73726c" text-anchor="middle">reads</text>
  <path d="M570,148 L570,192 L442,192" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="500" y="184" font-size="11" fill="#73726c" text-anchor="middle">writes the reply</text>
  <path d="M615,148 L615,238" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="480" y="240" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="560.0" y="263.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Folder J7, job record</text>
  <text x="560.0" y="281.0" font-size="12" fill="#185FA5" text-anchor="middle">gives role builder</text>
  <path d="M560,296 L560,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="568" y="318" font-size="11" fill="#73726c" text-anchor="start">claimed field</text>
  <rect x="460" y="332" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="550.0" y="355.0" font-size="11.5" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch-identity-mismatch</text>
  <text x="550.0" y="373.0" font-size="12" fill="#A32D2D" text-anchor="middle">if it claims role: reviewer</text>
</svg>
