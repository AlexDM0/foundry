<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A branch cannot change its judge, except where nobody named the file</title>
  <desc>Three zones. Out of reach: pipeline.json, which lives in the data folder outside every branch. Refused by V11 unless the ticket body names the path: files a gate names in definedBy and tracked instruction files. Reachable, as the repository's choice: the script of a gate with no definedBy.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="290" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A branch cannot change its judge, except where nobody named the file</text>
  <text x="40" y="68" font-size="13" fill="#73726c">What judges a branch, by how far the branch reaches it</text>
  <rect x="40" y="92" width="190" height="178" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="135" y="118" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Out of reach</text>
  <text x="135" y="136" font-size="12" fill="#5F5E5A" text-anchor="middle">outside every branch</text>
  <rect x="52" y="178" width="166" height="48" rx="6" fill="#FAF9F5" stroke="#E1DDD0"/>
  <text x="135" y="198" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json</text>
  <text x="135" y="215" font-size="12" fill="#5F5E5A" text-anchor="middle">in &lt;data&gt;</text>
  <rect x="245" y="92" width="190" height="178" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="118" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Refused by V11</text>
  <text x="340" y="136" font-size="12" fill="#185FA5" text-anchor="middle">unless the ticket names it</text>
  <rect x="257" y="150" width="166" height="48" rx="6" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="340" y="179" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">definedBy files</text>
  <rect x="257" y="206" width="166" height="48" rx="6" fill="#FAF9F5" stroke="#CFE2F6"/>
  <text x="340" y="235" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Tracked instruction files</text>
  <rect x="450" y="92" width="190" height="178" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="545" y="118" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Reachable</text>
  <text x="545" y="136" font-size="12" fill="#854F0B" text-anchor="middle">the repository's choice</text>
  <rect x="462" y="178" width="166" height="48" rx="6" fill="#FAF9F5" stroke="#F2DDB0"/>
  <text x="545" y="198" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">A gate's script</text>
  <text x="545" y="215" font-size="12" fill="#854F0B" text-anchor="middle">no definedBy named</text>
</svg>
