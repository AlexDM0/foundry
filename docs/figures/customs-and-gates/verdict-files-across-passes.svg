<svg xmlns="http://www.w3.org/2000/svg" width="680" height="376" viewBox="0 0 680 376" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A gate is judged once per tree, so a later gate cannot repaint it</title>
  <desc>Over four Passes, gate-1 ends and is judged passed, and the verdict goes into gate-1-verdict.json keyed by tree id. gate-2 then runs and changes a tracked file. On later Passes the Overseer reads gate-1's kept verdict on that tree. Judging gate-1 again would see gate-2's diff and turn it red.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="374" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A gate is judged once per tree, so a later gate cannot repaint it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The Overseer walks the steps every Pass; a kept verdict answers for its gate on the same tree</text>
  <text x="196.0" y="100" font-size="12" fill="#73726c" text-anchor="middle">Pass n</text>
  <text x="322.0" y="100" font-size="12" fill="#73726c" text-anchor="middle">Pass n+1</text>
  <text x="448.0" y="100" font-size="12" fill="#73726c" text-anchor="middle">Pass n+2</text>
  <text x="574.0" y="100" font-size="12" fill="#73726c" text-anchor="middle">Pass n+3</text>
  <text x="40" y="143" font-size="12" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1</text>
  <text x="40" y="209" font-size="12" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-2</text>
  <text x="40" y="275" font-size="12" fill="#444441" text-anchor="start">job folder</text>
  <rect x="136" y="110" width="120" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="196.0" y="142.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher runs</text>
  <rect x="262" y="110" width="120" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="322.0" y="134.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Judged</text>
  <text x="322.0" y="152.0" font-size="12" fill="#3B6D11" text-anchor="middle">passed, tree T</text>
  <rect x="388" y="110" width="120" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="448.0" y="134.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Reads verdict</text>
  <text x="448.0" y="152.0" font-size="12" fill="#3B6D11" text-anchor="middle">tree T: passed</text>
  <rect x="514" y="110" width="120" height="54" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="574.0" y="134.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Reads verdict</text>
  <text x="574.0" y="152.0" font-size="12" fill="#3B6D11" text-anchor="middle">tree T: passed</text>
  <rect x="262" y="176" width="120" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="322.0" y="208.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher runs</text>
  <rect x="388" y="176" width="120" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="448.0" y="200.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Changes a file</text>
  <text x="448.0" y="218.0" font-size="11" fill="#185FA5" text-anchor="middle">a tracked file, exit 0</text>
  <rect x="514" y="176" width="120" height="54" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="574.0" y="200.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Judged</text>
  <text x="574.0" y="218.0" font-size="12" fill="#A32D2D" text-anchor="middle">failed, with the diff</text>
  <rect x="262" y="242" width="372" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="278" y="271" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1-verdict.json</text>
  <text x="620" y="271" font-size="12" fill="#5F5E5A" text-anchor="end">keyed by tree id</text>
  <rect x="514" y="306" width="120" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2" stroke-dasharray="5 4"/>
  <text x="574.0" y="328.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Judging again</text>
  <text x="574.0" y="346.0" font-size="12" fill="#A32D2D" text-anchor="middle">would say failed</text>
  <path d="M522,331 L626,331" stroke="#A32D2D" stroke-width="1.6"/>
  <text x="504" y="327" font-size="11" fill="#73726c" text-anchor="end">what the file prevents</text>
  <text x="504" y="342" font-size="11" fill="#73726c" text-anchor="end">git diff HEAD would show gate-2's change</text>
</svg>
