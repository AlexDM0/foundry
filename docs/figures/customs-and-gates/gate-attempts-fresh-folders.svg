<svg xmlns="http://www.w3.org/2000/svg" width="680" height="302" viewBox="0 0 680 302" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A resumed session gates again in fresh folders</title>
  <desc>The first attempt gates in gate-prepare, gate-1 and gate-2; the first two pass and gate-2 is red. After the red handoff the session commits tree U and goes back to the first step: its second Watcher instance runs gate-prepare-2, gate-1-2 and gate-2-2 in order, each in a fresh folder with a verdict file that follows the folder name.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="300" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A resumed session gates again in fresh folders</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A Watcher folder runs once, so every step runs again, from the first</text>
  <text x="40" y="121" font-size="12" fill="#444441">instance 1</text>
  <text x="40" y="245" font-size="12" fill="#444441">instance 2</text>
  <rect x="130" y="92" width="158" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="209.0" y="116.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-prepare</text>
  <text x="209.0" y="134.0" font-size="12" fill="#3B6D11" text-anchor="middle">passed, tree T</text>
  <rect x="306" y="92" width="158" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="385.0" y="116.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1</text>
  <text x="385.0" y="134.0" font-size="12" fill="#3B6D11" text-anchor="middle">passed, tree T</text>
  <rect x="482" y="92" width="158" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="561.0" y="116.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-2</text>
  <text x="561.0" y="134.0" font-size="12" fill="#A32D2D" text-anchor="middle">failed, tree T</text>
  <rect x="130" y="216" width="158" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="209.0" y="240.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-prepare-2</text>
  <text x="209.0" y="258.0" font-size="12" fill="#5F5E5A" text-anchor="middle">tree U</text>
  <rect x="306" y="216" width="158" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="385.0" y="240.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1-2</text>
  <text x="385.0" y="258.0" font-size="12" fill="#5F5E5A" text-anchor="middle">tree U</text>
  <rect x="482" y="216" width="158" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="561.0" y="240.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-2-2</text>
  <text x="561.0" y="258.0" font-size="12" fill="#5F5E5A" text-anchor="middle">tree U</text>
  <path d="M288,120 L304,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M464,120 L480,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M288,244 L304,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M464,244 L480,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M561,148 L561,182 L209,182 L209,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="385" y="175" font-size="11" fill="#73726c" text-anchor="middle">red handoff; the session commits tree U</text>
</svg>
