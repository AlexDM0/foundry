<svg xmlns="http://www.w3.org/2000/svg" width="680" height="526" viewBox="0 0 680 526" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Watcher's gate slot is freed by the next taker, never by release</title>
  <desc>Overseer A creates a gate slot file exclusively, naming the gate's Watcher folder and its own process, then records the spawned Watcher. The Watcher claims and runs the gate, then ends and writes nothing. The file stays, but its holder is no longer live. The next taker, Overseer B, renames the file aside and removes it, and creates its own file exclusively. When two takers race, the rename lets only one remove the file, and the exclusive create decides who holds the gate slot.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="524" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A Watcher's gate slot is freed by the next taker, never by release</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The file outlives the Watcher; the next taker reads staleness and renames it aside</text>
  <text x="105.0" y="106" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer A</text>
  <path d="M105.0,114 L105.0,500" stroke="#ECE7DC" stroke-width="1.5" fill="none"/>
  <text x="245.0" y="106" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Gate Watcher</text>
  <path d="M245.0,114 L245.0,500" stroke="#ECE7DC" stroke-width="1.5" fill="none"/>
  <text x="385.0" y="106" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer B</text>
  <path d="M385.0,114 L385.0,500" stroke="#ECE7DC" stroke-width="1.5" fill="none"/>
  <text x="563" y="106" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-slots/slot-1</text>
  <path d="M563,114 L563,500" stroke="#ECE7DC" stroke-width="1.5" fill="none"/>
  <rect x="40" y="124" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="105.0" y="148.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Creates the file</text>
  <text x="105.0" y="166.0" font-size="12" fill="#185FA5" text-anchor="middle">exclusively</text>
  <rect x="486" y="124" width="154" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="563.0" y="148.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Watcher folder</text>
  <text x="563.0" y="166.0" font-size="12" fill="#5F5E5A" text-anchor="middle">process: Overseer A</text>
  <path d="M170,151 L484,151" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="188" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="105.0" y="212.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Records the spawn</text>
  <text x="105.0" y="230.0" font-size="11" fill="#185FA5" text-anchor="middle">recordSpawnedProcess</text>
  <rect x="486" y="188" width="154" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="563.0" y="212.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Watcher folder</text>
  <text x="563.0" y="230.0" font-size="12" fill="#5F5E5A" text-anchor="middle">process: the Watcher</text>
  <path d="M170,215 L484,215" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="180" y="252" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="245.0" y="276.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Claims, runs the gate</text>
  <text x="245.0" y="294.0" font-size="12" fill="#185FA5" text-anchor="middle">the holder is live</text>
  <rect x="486" y="252" width="154" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="563.0" y="276.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Watcher folder</text>
  <text x="563.0" y="294.0" font-size="12" fill="#5F5E5A" text-anchor="middle">process: the Watcher</text>
  <rect x="180" y="316" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="245.0" y="340.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Ends</text>
  <text x="245.0" y="358.0" font-size="12" fill="#185FA5" text-anchor="middle">releases nothing</text>
  <rect x="486" y="316" width="154" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="563.0" y="340.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Watcher folder</text>
  <text x="563.0" y="358.0" font-size="12" fill="#5F5E5A" text-anchor="middle">holder not live</text>
  <rect x="320" y="380" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="385.0" y="404.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Renames it aside</text>
  <text x="385.0" y="422.0" font-size="11" fill="#185FA5" text-anchor="middle">freedIfStale, then removes</text>
  <rect x="486" y="380" width="154" height="54" rx="8" fill="#FAF9F5" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="563" y="411" font-size="12" fill="#5F5E5A" text-anchor="middle">no file</text>
  <path d="M450,407 L484,407" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="320" y="444" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="385.0" y="468.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Creates its own</text>
  <text x="385.0" y="486.0" font-size="12" fill="#185FA5" text-anchor="middle">exclusively</text>
  <rect x="486" y="444" width="154" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="563.0" y="468.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Overseer B's holder</text>
  <text x="563.0" y="486.0" font-size="12" fill="#5F5E5A" text-anchor="middle">process: Overseer B</text>
  <path d="M450,471 L484,471" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
