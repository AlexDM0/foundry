<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Exit 0 can still be red</title>
  <desc>A prepare step that does not exit 0 is setup-failed, an incident. A gate killed by a signal, never started, or exiting 126 or 127 is cannot-run, an incident. Any other non-zero exit is failed, a red handoff. Exit 0 with a tracked diff is also failed, with the diff as output. Exit 0 with no tracked diff is passed and the next gate runs. Only failed goes back to the agent; the two incidents are no verdict on the work.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="474" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Exit 0 can still be red</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A gate passes only when it exits 0 and git diff HEAD shows no tracked change</text>

  <g font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">
    <rect x="40" y="90" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="165" y="114">Prepare steps exit 0?</text>
    <rect x="40" y="172" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="165" y="196">Gate ran to its own exit?</text>
    <rect x="40" y="254" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="165" y="278">Exit code 0?</text>
    <rect x="40" y="336" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="165" y="360">Tracked files unchanged?</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#185FA5">
    <text x="165" y="132">run before the first gate</text>
    <text x="165" y="214">not a signal, not 126 or 127</text>
    <text x="165" y="296">the gate's own judgement</text>
    <text x="165" y="378">git diff HEAD is empty</text>
  </g>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M165,146 L165,170"/><path d="M165,228 L165,252"/><path d="M165,310 L165,334"/><path d="M165,392 L165,410"/>
    <path d="M290,118 L388,118"/><path d="M290,200 L388,200"/><path d="M290,282 L388,282"/><path d="M290,364 L388,364"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="174" y="162">yes</text><text x="174" y="244">yes</text><text x="174" y="326">yes</text><text x="174" y="406">yes</text>
    <text x="338" y="112" text-anchor="middle">no</text><text x="338" y="194" text-anchor="middle">no</text><text x="338" y="276" text-anchor="middle">no</text><text x="338" y="358" text-anchor="middle">no</text>
  </g>

  <g fill="#FCEBEB" stroke="#F3D2D2">
    <rect x="390" y="254" width="250" height="56" rx="8"/><rect x="390" y="336" width="250" height="56" rx="8"/>
  </g>
  <g font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="515" y="278">failed</text><text x="515" y="360">failed</text>
  </g>
  <g font-size="12" fill="#A32D2D" text-anchor="middle">
    <text x="515" y="296">the same agent, handed the output</text>
    <text x="515" y="378">the same agent, handed the diff</text>
  </g>

  <g fill="#FCEBEB" stroke="#F3D2D2">
    <rect x="390" y="90" width="250" height="56" rx="8"/><rect x="390" y="172" width="250" height="56" rx="8"/>
  </g>
  <g font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="515" y="114">setup-failed</text><text x="515" y="196">cannot-run</text>
  </g>
  <g font-size="12" fill="#A32D2D" text-anchor="middle">
    <text x="515" y="132">incident; the job stops</text>
    <text x="515" y="214">incident; the job stops</text>
  </g>

  <rect x="40" y="412" width="250" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="165" y="439" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">passed</text>
  <text x="302" y="439" font-size="12" fill="#3B6D11">the next gate runs; after the last, the work moves on</text>
</svg>
