<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every gate runs alone in both runs, so each earns its own verdict</title>
  <desc>Three proposed gates each run in run 1 and run 2, with no early stop. gate-a passes twice and is green. gate-b rewrites a tracked file and fails twice; the change is undone each time, and it is red. gate-c passes in run 1 and fails in run 2 on a file run 1 left behind, so it is disagreeing.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every gate runs alone in both runs, so each earns its own verdict</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A red gate stops nothing, so one never hides the next</text>
  <text x="256.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Run 1</text>
  <text x="256.0" y="116" font-size="11" fill="#73726c" text-anchor="middle">prepare, then every gate</text>
  <text x="412.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Run 2</text>
  <text x="412.0" y="116" font-size="11" fill="#73726c" text-anchor="middle">prepare, then every gate</text>
  <text x="569.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Verdict</text>
  <rect x="40" y="128" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="105.0" y="161.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-a</text>
  <rect x="186" y="128" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256.0" y="152.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">passed</text>
  <text x="256.0" y="170.0" font-size="12" fill="#185FA5" text-anchor="middle">tree unchanged</text>
  <rect x="342" y="128" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="412.0" y="152.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">passed</text>
  <text x="412.0" y="170.0" font-size="12" fill="#185FA5" text-anchor="middle">tree unchanged</text>
  <rect x="498" y="128" width="142" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="569.0" y="152.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">green</text>
  <text x="569.0" y="170.0" font-size="12" fill="#3B6D11" text-anchor="middle">passed both times</text>
  <rect x="40" y="196" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="105.0" y="229.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-b</text>
  <rect x="186" y="196" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256.0" y="220.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">failed</text>
  <text x="256.0" y="238.0" font-size="12" fill="#185FA5" text-anchor="middle">tracked file undone</text>
  <rect x="342" y="196" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="412.0" y="220.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">failed</text>
  <text x="412.0" y="238.0" font-size="12" fill="#185FA5" text-anchor="middle">tracked file undone</text>
  <rect x="498" y="196" width="142" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="569.0" y="220.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">red</text>
  <text x="569.0" y="238.0" font-size="12" fill="#A32D2D" text-anchor="middle">failed both times</text>
  <rect x="40" y="264" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="105.0" y="297.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-c</text>
  <rect x="186" y="264" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="256.0" y="288.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">passed</text>
  <text x="256.0" y="306.0" font-size="12" fill="#185FA5" text-anchor="middle">leaves a new file</text>
  <rect x="342" y="264" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="412.0" y="288.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">failed</text>
  <text x="412.0" y="306.0" font-size="12" fill="#185FA5" text-anchor="middle">trips on that file</text>
  <rect x="498" y="264" width="142" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="569.0" y="288.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">disagreeing</text>
  <text x="569.0" y="306.0" font-size="12" fill="#A32D2D" text-anchor="middle">the two runs differ</text>
  <text x="40" y="350" font-size="12" fill="#5F5E5A">Tracked changes are undone after each gate; untracked files stay for later gates and run 2</text>
</svg>
