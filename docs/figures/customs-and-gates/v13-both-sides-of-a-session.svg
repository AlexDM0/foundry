<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>V13 guards a job on every Pass and again at its end</title>
  <desc>A launch records a digest of the hooks folder. On every Pass, V13 compares the branch past its target and the worktree as it stands; a hit opens the branch-touches-agent-config decision, which keeps launches and resumes off the ticket and spawns no Watcher. When the report arrives, V13 runs in Customs over the job's range and the worktree and compares the hooks digest; a hit does both: it ends the job failed and opens the same decision.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="314" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">V13 guards a job on every Pass and again at its end</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A hit at either end opens one decision, unless one is open or answered</text>
  <rect x="40" y="96" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="125.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">First launch</text>
  <text x="130.0" y="143.0" font-size="12" fill="#185FA5" text-anchor="middle">hooks digest recorded</text>
  <rect x="250" y="96" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="125.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Every Pass</text>
  <text x="340.0" y="143.0" font-size="12" fill="#185FA5" text-anchor="middle">branch past target, worktree</text>
  <rect x="460" y="96" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="550.0" y="125.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Report in Customs</text>
  <text x="550.0" y="143.0" font-size="12" fill="#185FA5" text-anchor="middle">range, worktree, hooks digest</text>
  <path d="M220,128 L248,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,128 L458,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="226" width="242" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="311.0" y="255.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">branch-touches-agent-config</text>
  <text x="311.0" y="273.0" font-size="12" fill="#854F0B" text-anchor="middle">no launch, no resume, no Watcher</text>
  <rect x="506" y="226" width="134" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="573.0" y="255.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Job ends failed</text>
  <text x="573.0" y="273.0" font-size="12" fill="#A32D2D" text-anchor="middle">a Customs refusal</text>
  <path d="M340,160 L340,224" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="349" y="196" font-size="11" fill="#73726c" text-anchor="start">hit</text>
  <path d="M550,160 L550,194" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M550,194 L573,194 L573,224" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M550,194 L470,194 L470,258 L434,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="559" y="180" font-size="11" fill="#73726c" text-anchor="start">hit: both</text>
</svg>
