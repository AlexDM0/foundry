<svg xmlns="http://www.w3.org/2000/svg" width="680" height="742" viewBox="0 0 680 742" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only User's Apply turns the setup record into a pipeline</title>
  <desc>User's pipeline setup opens the setup record and launches the pipeline agent, which reads a snapshot of the main line. The agent's relayed verbs write findings, questions, the constitution and draft edits into the record, and Customs checks the snapshot at each turn end with V16, V4, V5, V13 and V14. A refusal opens the setup-snapshot-touched incident, and Apply then refuses. User answers, edits, continues each step and may press a check or a profile. When User presses Apply, the main line's Airlock commits CONSTITUTION.md in an ungated constitution-commit job, skipped when main already holds the text. In the hold of that landing pipeline.json is written, checks-not-set is withdrawn and the record is removed.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="740" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only User's Apply turns the setup record into a pipeline</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The agent's moves stop at the record; Apply commits the constitution first</text>
  <path d="M290,119 L387,119" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="338" y="111" font-size="11" fill="#73726c" text-anchor="middle">launches</text>
  <path d="M165,146 L165,207" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="157" y="182" font-size="11" fill="#73726c" text-anchor="end">opens</text>
  <path d="M390,138 L345,138 L345,237 L293,237" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="352" y="172" font-size="11" fill="#73726c" text-anchor="start">relayed</text>
  <text x="352" y="186" font-size="11" fill="#73726c" text-anchor="start">verbs</text>
  <path d="M515,146 L515,207" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="523" y="182" font-size="11" fill="#73726c" text-anchor="start">each turn end</text>
  <path d="M515,264 L515,317" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="523" y="295" font-size="11" fill="#73726c" text-anchor="start">refused</text>
  <path d="M165,320 L165,267" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="173" y="297" font-size="11" fill="#73726c" text-anchor="start">answers, edits, Continue</text>
  <path d="M165,374 L165,427" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M515,374 L515,457 L293,457" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="404" y="449" font-size="11" fill="#73726c" text-anchor="middle">Apply refuses</text>
  <path d="M165,484 L165,537" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="173" y="515" font-size="11" fill="#73726c" text-anchor="start">main lacks the text</text>
  <path d="M290,567 L387,567" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="338" y="559" font-size="11" fill="#73726c" text-anchor="middle">lands</text>
  <path d="M165,594 L165,647" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="173" y="625" font-size="11" fill="#73726c" text-anchor="start">in the landing's hold</text>
  <rect x="40" y="92" width="250" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="165" y="116" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline setup</text>
  <text x="165" y="134" font-size="12" fill="#854F0B" text-anchor="middle">User starts a setup</text>
  <rect x="390" y="92" width="250" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="515" y="116" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Pipeline agent</text>
  <text x="515" y="134" font-size="12" fill="#993C1D" text-anchor="middle">reads a snapshot of main</text>
  <rect x="40" y="210" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="165" y="234" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Setup record</text>
  <text x="165" y="252" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-setup.json</text>
  <rect x="390" y="210" width="250" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="515" y="234" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs on the snapshot</text>
  <text x="515" y="252" font-size="12" fill="#185FA5" text-anchor="middle">V16, V4, V5, V13, V14</text>
  <rect x="40" y="320" width="250" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="165" y="344" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User steers each step</text>
  <text x="165" y="362" font-size="12" fill="#854F0B" text-anchor="middle">checks and profiles on press</text>
  <rect x="390" y="320" width="250" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="515" y="344" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">setup-snapshot-touched</text>
  <text x="515" y="362" font-size="12" fill="#854F0B" text-anchor="middle">incident; the record is held</text>
  <rect x="40" y="430" width="250" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="165" y="454" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Apply</text>
  <text x="165" y="472" font-size="12" fill="#854F0B" text-anchor="middle">no open question, no recheck</text>
  <rect x="40" y="540" width="250" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="165" y="564" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Constitution commit</text>
  <text x="165" y="582" font-size="12" fill="#185FA5" text-anchor="middle">an Airlock job, no gates</text>
  <rect x="390" y="540" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="515" y="564" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CONSTITUTION.md</text>
  <text x="515" y="582" font-size="12" fill="#5F5E5A" text-anchor="middle">tracked, on the main line</text>
  <rect x="40" y="650" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="165" y="674" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json</text>
  <text x="165" y="692" font-size="12" fill="#5F5E5A" text-anchor="middle">written; the record removed</text>
</svg>
