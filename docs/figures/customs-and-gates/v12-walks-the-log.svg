<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A queued filing is proved only inside its request's log window</title>
  <desc>V12 starts at the hatch-applied record of the reported request and walks back through the log. It skips a ticket-filed record by another job and stops at the first ticket-filed by this job, whose status must be draft, priority low and finding route assistant or user. An earlier hatch-applied ends the walk with no proof, because what lies before it belongs to another request.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="314" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A queued filing is proved only inside its request's log window</text>
  <text x="40" y="68" font-size="13" fill="#73726c">V12 walks back from the hatch-applied record the report names</text>
  <path d="M196,100 L640,100" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M196,100 L196,106" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M640,100 L640,106" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="418" y="94" font-size="11" fill="#73726c" text-anchor="middle">this request's log window</text>
  <text x="40" y="94" font-size="11" fill="#73726c" text-anchor="start">log, oldest first</text>
  <rect x="40" y="110" width="132" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="106.0" y="137.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch-applied</text>
  <text x="106.0" y="155.0" font-size="12" fill="#A32D2D" text-anchor="middle">an earlier request</text>
  <rect x="196" y="110" width="132" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="262.0" y="137.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-filed</text>
  <text x="262.0" y="155.0" font-size="12" fill="#3B6D11" text-anchor="middle">by this job</text>
  <rect x="352" y="110" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="418.0" y="137.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-filed</text>
  <text x="418.0" y="155.0" font-size="11" fill="#5F5E5A" text-anchor="middle">by another job: skipped</text>
  <rect x="508" y="110" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="574.0" y="137.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hatch-applied</text>
  <text x="574.0" y="155.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the reported request</text>
  <path d="M574,170 L574,196 L300,196 L300,172" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="181" y="104" width="6" height="72" rx="2" fill="#A32D2D"/>
  <text x="437" y="190" font-size="11" fill="#73726c" text-anchor="middle">walks back to the nearest match</text>
  <text x="40" y="192" font-size="11" fill="#A32D2D" text-anchor="start">no match: the walk stops here,</text>
  <text x="40" y="206" font-size="11" fill="#A32D2D" text-anchor="start">no proof</text>
  <rect x="196" y="232" width="444" height="64" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="212" y="250" font-size="13" font-weight="500" fill="#27500A">The filing record must say</text>
  <text x="212" y="269" font-size="12" fill="#3B6D11" font-family="ui-monospace,Menlo,Consolas,monospace">draft, low, filedByJob this job,</text>
  <text x="212" y="285" font-size="12" fill="#3B6D11" font-family="ui-monospace,Menlo,Consolas,monospace">findingRoute assistant or user</text>
  <path d="M262,172 L262,230" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
