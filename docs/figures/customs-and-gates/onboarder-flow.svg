<svg xmlns="http://www.w3.org/2000/svg" width="680" height="672" viewBox="0 0 680 672" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A proposal is run twice before it is offered</title>
  <desc>The checks-not-set decision or the advise command starts an onboarder in a detached snapshot of the main line. Its report goes through Customs; a refusal ends the job failed. The report's own mode picks the route. An advise report ends closed with nothing shown. A setup proposal runs twice on the snapshot, gets caching suggestions, and opens a pipeline-proposal decision. Accept writes prepare steps and gates; review, constitution and agents stay shown only. Decline leaves the pipeline as it was.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="670" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A proposal is run twice before it is offered</text>
  <text x="40" y="68" font-size="13" fill="#73726c">User sees a pipeline only with what its gates did, twice, on the main line</text>
  <path d="M125,140 L125,152 L222,152 L222,174" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M345,140 L345,152 L262,152 L262,174" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M240,230 L240,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M240,308 L240,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M240,386 L240,432" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M240,488 L240,510" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M360,358 L438,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330,386 L330,410 L540,410 L540,432" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M360,538 L438,538" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M240,566 L240,594" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="399" y="352" font-size="11" fill="#73726c" text-anchor="middle">refused</text>
  <text x="450" y="403" font-size="11" fill="#73726c" text-anchor="middle">report says advise</text>
  <text x="232" y="414" font-size="11" fill="#73726c" text-anchor="end">report says setup</text>
  <text x="399" y="532" font-size="11" fill="#73726c" text-anchor="middle">Decline</text>
  <text x="249" y="584" font-size="11" fill="#73726c" text-anchor="start">Accept</text>
  <rect x="40" y="88" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="125.0" y="111.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</text>
  <text x="125.0" y="129.0" font-size="12" fill="#854F0B" text-anchor="middle">no pipeline stored</text>
  <rect x="260" y="88" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="345.0" y="111.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">advise</text>
  <text x="345.0" y="129.0" font-size="12" fill="#854F0B" text-anchor="middle">User asks</text>
  <rect x="120" y="176" width="240" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="240.0" y="200.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Detached snapshot</text>
  <text x="240.0" y="218.0" font-size="12" fill="#185FA5" text-anchor="middle">main line tip, refs recorded</text>
  <rect x="120" y="254" width="240" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="240.0" y="278.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Onboarder report</text>
  <text x="240.0" y="296.0" font-size="12" fill="#993C1D" text-anchor="middle">a session proposes a pipeline</text>
  <rect x="120" y="332" width="240" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="240.0" y="356.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <text x="240.0" y="374.0" font-size="12" fill="#185FA5" text-anchor="middle">V1, V16, V4, V5, V12, V13, V14</text>
  <rect x="120" y="434" width="240" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="240.0" y="458.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Twice-run, caching checks</text>
  <text x="240.0" y="476.0" font-size="12" fill="#185FA5" text-anchor="middle">every gate on its own, twice</text>
  <rect x="120" y="512" width="240" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="240.0" y="536.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-proposal</text>
  <text x="240.0" y="554.0" font-size="12" fill="#854F0B" text-anchor="middle">User reads the record</text>
    <text x="446" y="356.0" font-size="14" font-weight="500" fill="#791F1F">Job ends failed</text>
  <text x="446" y="374.0" font-size="12" fill="#A32D2D">cause is the refusal</text>
  <rect x="440" y="434" width="200" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540.0" y="458.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job ends closed</text>
  <text x="540.0" y="476.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no decision opens</text>
  <rect x="440" y="512" width="200" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540.0" y="536.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Nothing changes</text>
  <text x="540.0" y="554.0" font-size="12" fill="#5F5E5A" text-anchor="middle">pipeline as it was</text>
  <rect x="120" y="596" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="240.0" y="620.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Written: prepare steps, gates</text>
  <text x="240.0" y="638.0" font-size="12" fill="#5F5E5A" text-anchor="middle">review, constitution, agents only shown</text>
</svg>
