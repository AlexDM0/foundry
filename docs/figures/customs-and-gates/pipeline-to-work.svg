  <text x="101" y="308.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gates</text>
  <path d="M170,335 L638,335" stroke="#ECE7DC" stroke-width="1"/>
  <rect x="329" y="274" width="72" height="58" rx="6" fill="#BBD6F0" stroke="#7FB0E0"/>
  <text x="365.0" y="293.0" font-size="11" fill="#0C447C" text-anchor="middle">commands,</text>
  <text x="365.0" y="307.0" font-size="11" fill="#0C447C" text-anchor="middle">network,</text>
  <text x="365.0" y="321.0" font-size="11" fill="#0C447C" text-anchor="middle">writes</text>
  <rect x="407" y="274" width="72" height="58" rx="6" fill="#BBD6F0" stroke="#7FB0E0"/>
