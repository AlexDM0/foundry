  <rect x="251" y="98" width="72" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="287.0" y="118" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Instruction</text>
  <text x="287.0" y="134" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">files</text>
  <rect x="329" y="98" width="72" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="365.0" y="118" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Session</text>
  <text x="365.0" y="134" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">permissions</text>
