  <rect x="485" y="98" width="72" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="521.0" y="126" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Gate runs</text>
