<svg xmlns="http://www.w3.org/2000/svg" width="680" height="428" viewBox="0 0 680 428" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Five keys reach every stage of a ticket's life</title>
  <desc>Stages in first-reached order, with gate runs repeating after review and at landing: worktree setup, instruction files, session permissions, Customs, gate runs, review and landing. prepare reaches worktree setup, session permissions and gate runs. constitution and agents reach instruction files and Customs. gates reaches session permissions, Customs and gate runs. review reaches review and landing.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="426" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Five keys reach every stage of a ticket's life</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Stages in first-reached order; gates run again after review and at landing</text>
  <text x="40" y="85" font-size="13" fill="#73726c">A filled cell means that stage reads the key</text>
  <g transform="translate(0,18)">
  <path d="M174,90 L632,90" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="174" y="84" font-size="11" fill="#73726c" text-anchor="start">first reached</text>
