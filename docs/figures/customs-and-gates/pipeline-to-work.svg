  <rect x="40" y="338" width="122" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="101" y="369.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">review</text>
  <path d="M170,393 L638,393" stroke="#ECE7DC" stroke-width="1"/>
  <rect x="563" y="338" width="72" height="52" rx="6" fill="#BBD6F0" stroke="#7FB0E0"/>
  <text x="599.0" y="361.0" font-size="11" fill="#0C447C" text-anchor="middle">review job,</text>
  <text x="599.0" y="375.0" font-size="11" fill="#0C447C" text-anchor="middle">Acceptance</text>
