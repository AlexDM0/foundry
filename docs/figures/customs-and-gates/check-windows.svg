<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each check reads its own window of the same branch</title>
  <desc>A branch leaves the target at the merge base. Going left to right it has the retried attempt's start, the job's start and HEAD, then the worktree. V3 on a retry reads from the retried attempt's start to HEAD. V5, V7, V9 and V11 read from the job's start to HEAD. V13 at report time reads that range plus the worktree. V13 on a Pass reads from the merge base through the worktree.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="418" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Each check reads its own window of the same branch</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The range starts at the job's start; a retry and a Pass look further back</text>
  <path d="M140,120 L140,396" stroke="#ECE7DC" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M220,170 L220,396" stroke="#ECE7DC" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M340,170 L340,396" stroke="#ECE7DC" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M520,170 L520,396" stroke="#ECE7DC" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M640,186 L640,396" stroke="#ECE7DC" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M90,120 L560,120" stroke="#bfbdb0" stroke-width="2" fill="none"/>
  <path d="M140,120 C160,120 170,170 200,170 L520,170" stroke="#bfbdb0" stroke-width="2" fill="none"/>
  <path d="M526,170 L544,170" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <text x="40" y="124" font-size="12" fill="#444441">target</text>
  <text x="40" y="174" font-size="12" fill="#444441">branch</text>
  <circle cx="140" cy="120" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="420" cy="120" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="220" cy="170" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="280" cy="170" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="340" cy="170" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="430" cy="170" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <circle cx="520" cy="170" r="6" fill="#F1EFE8" stroke="#73726c" stroke-width="1.4"/>
  <text x="140" y="104" font-size="11" fill="#5F5E5A" text-anchor="middle">merge base</text>
  <text x="420" y="104" font-size="11" fill="#5F5E5A" text-anchor="middle">target tip</text>
  <text x="220" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">retried attempt's start</text>
  <text x="340" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">start</text>
  <text x="520" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">HEAD</text>
  <rect x="546" y="154" width="94" height="32" rx="8" fill="#FAF9F5" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="593" y="175" font-size="12" fill="#5F5E5A" text-anchor="middle">worktree</text>
  <rect x="220" y="216" width="300" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="370.0" y="239.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">V3 on a retry</text>
  <rect x="340" y="260" width="180" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="430.0" y="283.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">V5, V7, V9, V11</text>
  <rect x="340" y="304" width="300" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="327.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">V13 at report: the range, the worktree</text>
  <rect x="140" y="348" width="500" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="390.0" y="371.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">V13 on a Pass: from the merge base, through the worktree</text>
</svg>
