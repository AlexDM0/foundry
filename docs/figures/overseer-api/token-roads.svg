<svg xmlns="http://www.w3.org/2000/svg" width="680" height="632" viewBox="0 0 680 632" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each start's token reaches the page and the CLI, never a session</title>
  <desc>Each Overseer start writes a fresh token to its owner-only file. A CLI verb reads the file for each request and posts with it. The Bridge gets the token from the same-origin route. A session's profile denies the file. After a restart the Bridge's old token answers 401, so it fetches another and posts once more.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="630" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Each start's token reaches the page and the CLI, never a session</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The Bridge asks the server; a CLI verb reads the file; a session gets neither</text>
  <rect x="40" y="84" width="100" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="90.0" y="109.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Bridge</text>
  <rect x="155" y="84" width="100" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="205.0" y="109.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">CLI verb</text>
  <rect x="280" y="84" width="100" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="109.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Overseer</text>
  <rect x="410" y="84" width="100" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460.0" y="109.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Token file</text>
  <rect x="535" y="84" width="105" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="587.5" y="109.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">Session</text>
  <path d="M90,124 L90,612" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M205,124 L205,612" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M330,124 L330,612" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M460,124 L460,612" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M585,124 L585,612" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <path d="M330,156 L458,156" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="395" y="150" font-size="11" fill="#73726c" text-anchor="middle">writes a fresh token</text>
  <path d="M205,200 L458,200" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="267" y="194" font-size="11" fill="#73726c" text-anchor="middle">reads it, per request</text>
  <path d="M205,244 L328,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="267.5" y="238" font-size="11" fill="#73726c" text-anchor="middle">POST with bearer</text>
  <path d="M585,244 L476,244" fill="none" stroke="#D9A0A0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M462,237 L476,251 M476,237 L462,251" fill="none" stroke="#A32D2D" stroke-width="2"/>
  <text x="530" y="238" font-size="11" fill="#A32D2D" text-anchor="middle">denied by its profile</text>
  <path d="M90,288 L328,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="282" font-size="11" fill="#73726c" text-anchor="middle">same-origin GET</text>
  <path d="M330,322 L92,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="316" font-size="11" fill="#73726c" text-anchor="middle">{token}</text>
  <path d="M40,346 L640,346" fill="none" stroke="#E1DDD0" stroke-width="1.6"/>
  <text x="395" y="364" font-size="11" fill="#73726c" text-anchor="middle">the Overseer restarts</text>
  <path d="M330,396 L458,396" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="395" y="390" font-size="11" fill="#73726c" text-anchor="middle">writes another token</text>
  <path d="M90,440 L328,440" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="434" font-size="11" fill="#73726c" text-anchor="middle">POST, old token</text>
  <path d="M330,472 L92,472" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="466" font-size="11" fill="#73726c" text-anchor="middle">401</text>
  <path d="M90,504 L328,504" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="498" font-size="11" fill="#73726c" text-anchor="middle">GET again</text>
  <path d="M330,536 L92,536" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="530" font-size="11" fill="#73726c" text-anchor="middle">{token}</text>
  <path d="M90,568 L328,568" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="147" y="562" font-size="11" fill="#73726c" text-anchor="middle">POST once more</text>
</svg>
