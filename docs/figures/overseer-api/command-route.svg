<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Runtime commands leave before the install-hold check</title>
  <desc>The route checks the token, answering 401, then the JSON and the kind, either failure answering 400. A runtime command leaves here and answers 200, meaning received, and the Baton files tell the result. Any other command answers 423 during the install hold. Otherwise it is applied in a lock hold of its own: 409 or 400 on failure, or 200 with a Pass woken.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="522" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Runtime commands leave before the install-hold check</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each check lets the command go on or answers at once</text>
  <rect x="40" y="84" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="112" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Bearer token valid?</text>
  <rect x="420" y="84" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="104" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">401</text>
  <text x="530.0" y="122" font-size="12" fill="#A32D2D" text-anchor="middle">unauthorized</text>
  <path d="M280,107 L418,107" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="101" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M160,130 L160,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="146" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="174" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Body is JSON?</text>
  <rect x="420" y="146" width="220" height="108" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="197" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">400</text>
  <text x="530.0" y="215" font-size="12" fill="#A32D2D" text-anchor="middle">malformed-body</text>
  <path d="M280,169 L418,169" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="163" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M160,192 L160,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="208" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="236" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Known kind?</text>
  <path d="M280,231 L418,231" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="225" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M160,254 L160,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="270" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="290" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Runtime command?</text>
  <text x="160.0" y="308" font-size="12" fill="#185FA5" text-anchor="middle">overseer-stop, overseer-restart</text>
  <rect x="420" y="270" width="220" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="530.0" y="290" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">200: received</text>
  <text x="530.0" y="308" font-size="12" fill="#185FA5" text-anchor="middle">Baton files tell the result</text>
  <path d="M280,293 L418,293" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="287" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M160,316 L160,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="332" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="352" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Install hold?</text>
  <text x="160.0" y="370" font-size="12" fill="#185FA5" text-anchor="middle">held-by-install-change</text>
  <rect x="420" y="332" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="352" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">423</text>
  <text x="530.0" y="370" font-size="12" fill="#A32D2D" text-anchor="middle">run update</text>
  <path d="M280,355 L418,355" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="349" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M160,378 L160,392" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="394" width="240" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="414" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Applied in a lock hold</text>
  <text x="160.0" y="432" font-size="12" fill="#185FA5" text-anchor="middle">by ControlService.apply</text>
  <rect x="420" y="394" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="414" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">409 or 400</text>
  <text x="530.0" y="432" font-size="12" fill="#A32D2D" text-anchor="middle">refused, or a field missing</text>
  <path d="M280,417 L418,417" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="411" font-size="11" fill="#73726c" text-anchor="middle">fails</text>
  <path d="M160,440 L160,454" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="456" width="240" height="48" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="160.0" y="476" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">200: applied</text>
  <text x="160.0" y="494" font-size="12" fill="#3B6D11" text-anchor="middle">and a Pass is woken</text>
</svg>
