<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>calls stops at the job's own turns; tokens spans everything</title>
  <desc>Three regions: the job's own turns, subagents in the event log grouped by parentToolUseId, and subagents rebuilt from transcripts. calls and toolCalls cover only the first. subagents covers the second and third. toolCallsWithSubagents and tokens cover all three.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="394" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">calls stops at the job's own turns; tokens spans everything</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each bar covers the regions its counter sums</text>
  <rect x="40" y="88" width="180" height="76" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="130.0" y="122.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">The job's own turns</text>
  <text x="130.0" y="140.0" font-size="12" fill="#993C1D" text-anchor="middle">parentToolUseId null</text>
  <rect x="235" y="88" width="190" height="76" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="330.0" y="122.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">Subagents in the log</text>
  <text x="330.0" y="140.0" font-size="12" fill="#993C1D" text-anchor="middle">by parentToolUseId</text>
  <rect x="440" y="88" width="200" height="76" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="540.0" y="122.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Subagents rebuilt</text>
  <text x="540.0" y="140.0" font-size="12" fill="#5F5E5A" text-anchor="middle">from transcripts</text>
  <rect x="40" y="184" width="180" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130.0" y="204" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">calls</text>
  <rect x="40" y="222" width="180" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130.0" y="242" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">toolCalls</text>
  <rect x="235" y="260" width="405" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="437.5" y="280" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">subagents[]</text>
  <rect x="40" y="298" width="600" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="318" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">toolCallsWithSubagents</text>
  <rect x="40" y="336" width="600" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="356" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tokens</text>
</svg>
