<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A job no publish saw still reaches the stream as launching, then ended</title>
  <desc>State N shows job J13 in neither list; state N+1 shows it only in endedJobs, because it launched and ended between two publishes. publishState finds it absent before and sends a synthetic launching job event with zeroed live, then the ended job event, then board.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="320" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A job no publish saw still reaches the stream as launching, then ended</text>
  <text x="40" y="68" font-size="13" fill="#73726c">J13 launched and ended between two publishes; ids as on Baton generation 7</text>
  <rect x="40" y="88" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="111.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">State N</text>
  <text x="185.0" y="129.0" font-size="12" fill="#5F5E5A" text-anchor="middle">J13 in neither list</text>
  <rect x="350" y="88" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="495.0" y="111.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">State N+1</text>
  <text x="495.0" y="129.0" font-size="12" fill="#5F5E5A" text-anchor="middle">J13 only in endedJobs</text>
  <path d="M185,144 L185,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M495,144 L495,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="166" width="600" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="184.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">publishState</text>
  <text x="340.0" y="202.0" font-size="12" fill="#185FA5" text-anchor="middle">absent before, ended now</text>
  <path d="M107,212 L107,232" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="234" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130.0" y="259.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">job</text>
  <text x="130.0" y="277.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-50 launching</text>
  <path d="M220,264 L248,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="234" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="259.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">job</text>
  <text x="340.0" y="277.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-51 ended</text>
  <path d="M430,264 L458,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="460" y="234" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="550.0" y="259.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">board</text>
  <text x="550.0" y="277.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-52</text>
  <text x="40" y="310" font-size="11" fill="#73726c">synthetic, zeroed live</text>
  <text x="640" y="310" font-size="11" fill="#73726c" text-anchor="end">closes the publish</text>
</svg>
