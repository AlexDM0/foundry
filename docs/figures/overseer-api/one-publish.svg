<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Slice events come first, board always last</title>
  <desc>A publish that shows job J12 for the first time past launching sends a synthetic launching job event, the real job event, a decision event and then board, which closes the publish. When the decision is answered and leaves, only a board event is sent. When only the page's render stamp moved, generatedAtEpochMilliseconds, nothing is sent and no id is spent.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="366" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Slice events come first, board always last</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three publishes on Baton generation 7; each id is the generation and a running count</text>
  <text x="40" y="102" font-size="13" fill="#3d3d3a" font-weight="500">Job J12 first shown running, one decision opened</text>
  <rect x="40" y="114" width="135" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="107.5" y="140" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">job</text>
  <text x="107.5" y="158" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-41 launching</text>
  <path d="M175,144 L193,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="195" y="114" width="135" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="262.5" y="140" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">job</text>
  <text x="262.5" y="158" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-42 running</text>
  <path d="M330,144 L348,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="350" y="114" width="135" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="417.5" y="140" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">decision</text>
  <text x="417.5" y="158" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-43</text>
  <path d="M485,144 L503,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="505" y="114" width="135" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="572.5" y="140" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">board</text>
  <text x="572.5" y="158" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-44</text>
  <text x="40" y="192" font-size="11" fill="#73726c">synthetic: first shown past launching</text>
  <text x="640" y="192" font-size="11" fill="#73726c" text-anchor="end">closes the publish</text>
  <text x="40" y="222" font-size="13" fill="#3d3d3a" font-weight="500">That decision is answered and leaves the board</text>
  <rect x="40" y="234" width="135" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="107.5" y="260" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">board</text>
  <text x="107.5" y="278" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">7-45</text>
  <text x="195" y="268" font-size="12" fill="#5F5E5A">no decision event: only this board removes it</text>
  <text x="40" y="324" font-size="13" fill="#3d3d3a" font-weight="500">Only the page's render stamp moved</text>
  <text x="40" y="348" font-size="12" fill="#5F5E5A" font-family="ui-monospace,Menlo,Consolas,monospace">generatedAtEpochMilliseconds</text>
  <text x="250" y="348" font-size="12" fill="#5F5E5A">differs: nothing sent, no id spent</text>
</svg>
