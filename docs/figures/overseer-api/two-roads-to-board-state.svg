<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Routes read per request; the stream reads on a trigger</title>
  <desc>A GET of /api/state or /api/summary calls readBoardState for that request and answers the BoardState, or its summary. A Pass end, a sweep or the start also calls readBoardState, and EventBroker.publishState compares the result with the last state and sends events. Both read the board files with no lock. A malformed file gives a route Bun's plain 500, and leaves the stream logging the failure and keeping its last board.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="498" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Routes read per request; the stream reads on a trigger</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Both roads read the same files; a bad read ends them differently</text>
  <text x="40" y="148" font-size="11" fill="#73726c">Route road</text>
  <text x="40" y="328" font-size="11" fill="#73726c">Stream road</text>
  <rect x="240" y="84" width="180" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="330.0" y="104" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">Bun's plain 500</text>
  <text x="330.0" y="122" font-size="12" fill="#A32D2D" text-anchor="middle">no JSON, no CSP</text>
  <rect x="40" y="160" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="184.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">A GET request</text>
  <text x="115.0" y="202.0" font-size="12" fill="#185FA5" text-anchor="middle">/api/state, /api/summary</text>
  <rect x="240" y="160" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="184.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">readBoardState</text>
  <text x="330.0" y="202.0" font-size="12" fill="#185FA5" text-anchor="middle">fresh for this request</text>
  <rect x="470" y="160" width="170" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="555.0" y="184.0" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">JSON answer</text>
  <text x="555.0" y="202.0" font-size="12" fill="#3B6D11" text-anchor="middle">BoardState, or its summary</text>
  <rect x="240" y="250" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="330.0" y="274.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Board files</text>
  <text x="330.0" y="292.0" font-size="12" fill="#5F5E5A" text-anchor="middle">read with no lock</text>
  <rect x="40" y="340" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="364.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">A trigger</text>
  <text x="115.0" y="382.0" font-size="12" fill="#185FA5" text-anchor="middle">Pass end, sweep, start</text>
  <rect x="240" y="340" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="364.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">readBoardState</text>
  <text x="330.0" y="382.0" font-size="12" fill="#185FA5" text-anchor="middle">fresh for this publish</text>
  <rect x="470" y="340" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="555.0" y="364.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">publishState</text>
  <text x="555.0" y="382.0" font-size="12" fill="#185FA5" text-anchor="middle">diff against the last</text>
  <rect x="240" y="432" width="180" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="330.0" y="452" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">Logged and skipped</text>
  <text x="330.0" y="470" font-size="12" fill="#A32D2D" text-anchor="middle">stream keeps its last board</text>
  <rect x="470" y="432" width="170" height="48" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="555.0" y="452" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">Events</text>
  <text x="555.0" y="470" font-size="12" fill="#3B6D11" text-anchor="middle">board last</text>
  <path d="M190,188 L238,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M420,188 L468,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,368 L238,368" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M420,368 L468,368" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330,216 L330,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M330,340 L330,308" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M330,160 L330,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="338" y="151" font-size="11" fill="#73726c">malformed</text>
  <path d="M330,396 L330,430" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="338" y="417" font-size="11" fill="#73726c">malformed</text>
  <path d="M555,396 L555,430" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
