<svg xmlns="http://www.w3.org/2000/svg" width="680" height="388" viewBox="0 0 680 388" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Generation and code version are separate signals</title>
  <desc>On reconnect the server replays the events after the Last-Event-ID when the id is of this generation and still buffered, and otherwise sends a fresh board. Independently, once the stream is live after being down, the Bridge fetches its identity and reloads only when the code version moved.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="386" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Generation and code version are separate signals</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A Baton pass moves the generation; only new code reloads the page</text>
  <text x="190" y="96" font-size="11" fill="#73726c" text-anchor="middle">Which events: the server decides</text>
  <text x="510" y="96" font-size="11" fill="#73726c" text-anchor="middle">Which code: the Bridge decides</text>
  <rect x="40" y="108" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190.0" y="132.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Reconnect reaches /api/events</text>
  <text x="190.0" y="150.0" font-size="12" fill="#185FA5" text-anchor="middle">with Last-Event-ID, or none</text>
  <rect x="40" y="200" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="190.0" y="224.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">This generation and buffered?</text>
  <text x="190.0" y="242.0" font-size="12" fill="#185FA5" text-anchor="middle">the id names an event still buffered</text>
  <rect x="40" y="312" width="140" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="110.0" y="336.0" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">Replay</text>
  <text x="110.0" y="354.0" font-size="12" fill="#3B6D11" text-anchor="middle">events after the id</text>
  <rect x="200" y="312" width="140" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="270.0" y="336.0" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">Fresh board</text>
  <text x="270.0" y="354.0" font-size="12" fill="#3B6D11" text-anchor="middle">the newest whole state</text>
  <path d="M190,164 L190,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M110,256 L110,310" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M270,256 L270,310" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="118" y="288" font-size="11" fill="#73726c">yes</text>
  <text x="278" y="288" font-size="11" fill="#73726c">no</text>
  <rect x="380" y="108" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="510.0" y="132.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Stream live after being down</text>
  <text x="510.0" y="150.0" font-size="12" fill="#185FA5" text-anchor="middle">GET /api/identity</text>
  <rect x="380" y="200" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="510.0" y="224.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">codeVersion moved?</text>
  <text x="510.0" y="242.0" font-size="12" fill="#185FA5" text-anchor="middle">against the one the page loaded with</text>
  <rect x="380" y="312" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="440.0" y="336.0" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">Keep the page</text>
  <text x="440.0" y="354.0" font-size="12" fill="#3B6D11" text-anchor="middle">same bundle</text>
  <rect x="520" y="312" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="580.0" y="336.0" font-size="14" fill="#27500A" font-weight="500" text-anchor="middle">Reload</text>
  <text x="580.0" y="354.0" font-size="12" fill="#3B6D11" text-anchor="middle">the new bundle</text>
  <path d="M510,164 L510,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M440,256 L440,310" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M580,256 L580,310" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="448" y="288" font-size="11" fill="#73726c">no</text>
  <text x="588" y="288" font-size="11" fill="#73726c">yes</text>
  <path d="M360,96 L360,368" fill="none" stroke="#E1DDD0" stroke-width="1.6" stroke-dasharray="5 4"/>
</svg>
