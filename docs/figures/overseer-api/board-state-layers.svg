<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One reading lays live facts over the status document</title>
  <desc>BoardState stacks three layers. The bottom layer is the status keys, read from board files. Over it, jobs, decisions and incidents replace the status keys of those names, reading board files, event logs, transcripts and Overseer memory. On top, page, notices, mergeQueue, overseer, usage, questionHistory, endedJobs, ticketForecasts and launchSlots are added, reading board files, git forecasts and Overseer memory.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="340" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">One reading lays live facts over the status document</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each layer overrides or adds to the one below; dots show what it reads</text>
  <text x="432" y="96" font-size="11" fill="#73726c" text-anchor="middle">Board</text>
  <text x="432" y="110" font-size="11" fill="#73726c" text-anchor="middle">files</text>
  <text x="496" y="96" font-size="11" fill="#73726c" text-anchor="middle">Event logs,</text>
  <text x="496" y="110" font-size="11" fill="#73726c" text-anchor="middle">transcripts</text>
  <text x="558" y="96" font-size="11" fill="#73726c" text-anchor="middle">git</text>
  <text x="558" y="110" font-size="11" fill="#73726c" text-anchor="middle">forecasts</text>
  <text x="612" y="96" font-size="11" fill="#73726c" text-anchor="middle">Overseer</text>
  <text x="612" y="110" font-size="11" fill="#73726c" text-anchor="middle">memory</text>
  <rect x="40" y="122" width="360" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="58" y="163.0" font-size="14" fill="#0C447C" font-weight="500">Added</text>
  <text x="150" y="143.0" font-size="11" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">page, notices, mergeQueue, overseer</text>
  <text x="150" y="161.0" font-size="11" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">usage, questionHistory, endedJobs</text>
  <text x="150" y="179.0" font-size="11" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">ticketForecasts, launchSlots</text>
  <path d="M410,158.0 L640,158.0" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <circle cx="432" cy="158.0" r="6" fill="#73726c"/>
  <circle cx="558" cy="158.0" r="6" fill="#73726c"/>
  <circle cx="612" cy="158.0" r="6" fill="#73726c"/>
  <rect x="40" y="204" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="58" y="234.0" font-size="14" fill="#0C447C" font-weight="500">Replaced</text>
  <text x="150" y="233.0" font-size="11" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">jobs, decisions, incidents</text>
  <path d="M410,229.0 L640,229.0" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <circle cx="432" cy="229.0" r="6" fill="#73726c"/>
  <circle cx="496" cy="229.0" r="6" fill="#73726c"/>
  <circle cx="612" cy="229.0" r="6" fill="#73726c"/>
  <rect x="40" y="264" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="58" y="294.0" font-size="14" fill="#444441" font-weight="500">Status keys</text>
  <text x="150" y="293.0" font-size="12" fill="#5F5E5A">the status --json --full document</text>
  <path d="M410,289.0 L640,289.0" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <circle cx="432" cy="289.0" r="6" fill="#73726c"/>
</svg>
