<svg xmlns="http://www.w3.org/2000/svg" width="680" height="238" viewBox="0 0 680 238" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A cursor spans Watcher instances, because each log counts from 1</title>
  <desc>Two event logs, events-1.ndjson and events-2.ndjson, each numbered from 1. A cursor at 1.5, from Last-Event-ID or else ?after=, gets entries 1.6 to 2.2 in one history event, because they already existed, and 2.3, written later, as a message event.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="236" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A cursor spans Watcher instances, because each log counts from 1</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A reader at 1.5 gets one history event, then a message event per later entry</text>
  <rect x="40" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="65.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.1</text>
  <rect x="40" y="150" width="50" height="40" rx="8" fill="#FAF9F5" fill-opacity="0.6"/>
  <rect x="94" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="119.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.2</text>
  <rect x="94" y="150" width="50" height="40" rx="8" fill="#FAF9F5" fill-opacity="0.6"/>
  <rect x="148" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="173.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.3</text>
  <rect x="148" y="150" width="50" height="40" rx="8" fill="#FAF9F5" fill-opacity="0.6"/>
  <rect x="202" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="227.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.4</text>
  <rect x="202" y="150" width="50" height="40" rx="8" fill="#FAF9F5" fill-opacity="0.6"/>
  <rect x="256" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="281.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.5</text>
  <rect x="256" y="150" width="50" height="40" rx="8" fill="#FAF9F5" fill-opacity="0.6"/>
  <rect x="310" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="335.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.6</text>
  <rect x="364" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="389.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.7</text>
  <rect x="456" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="481.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2.1</text>
  <rect x="510" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="535.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2.2</text>
  <rect x="564" y="150" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="589.0" y="175" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2.3</text>
  <text x="40" y="210" font-size="12" fill="#5F5E5A" font-family="ui-monospace,Menlo,Consolas,monospace">events-1.ndjson</text>
  <text x="456" y="210" font-size="12" fill="#5F5E5A" font-family="ui-monospace,Menlo,Consolas,monospace">events-2.ndjson</text>
  <text x="265" y="102" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cursor 1.5</text>
  <text x="265" y="118" font-size="11" fill="#73726c" text-anchor="middle">Last-Event-ID, else ?after=</text>
  <path d="M281,124 L281,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M312,144 L312,136 L560,136 L560,144" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="436" y="128" font-size="11" fill="#73726c" text-anchor="middle">one history event</text>
  <path d="M566,144 L566,136 L614,136 L614,144" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="590" y="128" font-size="11" fill="#73726c" text-anchor="middle">message</text>
</svg>
