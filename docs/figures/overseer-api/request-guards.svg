<svg xmlns="http://www.w3.org/2000/svg" width="680" height="644" viewBox="0 0 680 644" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Guards stop a browser page; confinement stops a session</title>
  <desc>A request reaches the socket bound to 127.0.0.1, then the Host, Origin and not-OPTIONS checks, each failing with 403. It then forks: /api/session-token needs a same-origin fetch or answers 403, also before a token exists, /api/commands needs a bearer token or answers 401, and every other route asks for no token. Every returned answer carries the page CSP, the 403s too, or sandbox on a job file. A session is confined another way, because a process can forge these headers.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="642" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Guards stop a browser page; confinement stops a session</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three guards run before any route; two more sit inside their routes</text>
  <rect x="40" y="84" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="102.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Bound to 127.0.0.1</text>
  <text x="170.0" y="120.0" font-size="12" fill="#185FA5" text-anchor="middle">at the socket; no other machine</text>
  <path d="M170,130 L170,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="146" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="164.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Host is loopback:port</text>
  <text x="170.0" y="182.0" font-size="12" fill="#185FA5" text-anchor="middle">before routing</text>
  <rect x="420" y="146" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="164.0" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">DNS rebinding</text>
  <text x="530.0" y="182.0" font-size="12" fill="#A32D2D" text-anchor="middle">403 forbidden</text>
  <path d="M300,169 L418,169" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="163" font-size="11" fill="#73726c" text-anchor="middle">fails</text>
  <path d="M170,192 L170,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="208" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="226.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Origin absent or the API's own</text>
  <text x="170.0" y="244.0" font-size="12" fill="#185FA5" text-anchor="middle">before routing</text>
  <rect x="420" y="208" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="226.0" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">A page of another origin</text>
  <text x="530.0" y="244.0" font-size="12" fill="#A32D2D" text-anchor="middle">403 forbidden</text>
  <path d="M300,231 L418,231" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="225" font-size="11" fill="#73726c" text-anchor="middle">fails</text>
  <path d="M170,254 L170,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="270" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="288.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Method is not OPTIONS</text>
  <text x="170.0" y="306.0" font-size="12" fill="#185FA5" text-anchor="middle">before routing</text>
  <rect x="420" y="270" width="220" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="288.0" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">A preflight</text>
  <text x="530.0" y="306.0" font-size="12" fill="#A32D2D" text-anchor="middle">403 forbidden</text>
  <path d="M300,293 L418,293" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="287" font-size="11" fill="#73726c" text-anchor="middle">fails</text>
  <path d="M170,316 L170,334" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M170,334 L590,334" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M170,334 L170,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M415,334 L415,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M590,334 L590,498" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="356" width="260" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="170.0" y="375.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">/api/session-token</text>
  <text x="170.0" y="393.0" font-size="12" fill="#185FA5" text-anchor="middle">Sec-Fetch-Site: same-origin</text>
  <rect x="320" y="356" width="190" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="415.0" y="375.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">/api/commands</text>
  <text x="415.0" y="393.0" font-size="12" fill="#185FA5" text-anchor="middle">bearer, timingSafeEqual</text>
  <text x="582" y="420" font-size="11" fill="#73726c" text-anchor="end">every other route</text>
  <text x="582" y="434" font-size="11" fill="#73726c" text-anchor="end">no token</text>
  <path d="M147,404 L147,426" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="155" y="419" font-size="11" fill="#73726c">fails</text>
  <rect x="40" y="428" width="215" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="147.5" y="447.0" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">Not same-origin</text>
  <text x="147.5" y="465.0" font-size="12" fill="#A32D2D" text-anchor="middle">403 forbidden, also before a token</text>
  <path d="M390,404 L390,426" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="398" y="419" font-size="11" fill="#73726c">fails</text>
  <rect x="320" y="428" width="140" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="390.0" y="447.0" font-size="14" fill="#791F1F" font-weight="500" text-anchor="middle">No or bad token</text>
  <text x="390.0" y="465.0" font-size="12" fill="#A32D2D" text-anchor="middle">401 unauthorized</text>
  <path d="M278,404 L278,498" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="284" y="456" font-size="11" fill="#73726c">passes</text>
  <path d="M485,404 L485,498" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="491" y="456" font-size="11" fill="#73726c">passes</text>
  <rect x="40" y="500" width="600" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="519.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Page CSP on every returned answer, 403s too</text>
  <text x="340.0" y="537.0" font-size="12" fill="#185FA5" text-anchor="middle">frame-ancestors stops framing; job files sandboxed</text>
  <rect x="40" y="572" width="600" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340.0" y="593.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">A session is confined elsewhere</text>
  <text x="340.0" y="611.0" font-size="12" fill="#993C1D" text-anchor="middle">profile denies the token file</text>
</svg>
