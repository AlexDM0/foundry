<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One loopback server answers every client</title>
  <desc>The User works in the Bridge, which posts commands to the Overseer server and receives server-sent events. Most CLI verbs write the board files themselves and then nudge the server; stop, restart and update post a command with the token, and oversee verbs read the state and identity routes. The agent-dashboard server reads with GET. The server reads board files, job event logs and agent transcripts with no lock, and its one write is a command applied to the board files in a hold of its own.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="454" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">One loopback server answers every client</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One write route in this API, behind a token; every read takes no lock</text>
  <text x="122" y="96" font-size="11" fill="#73726c" text-anchor="middle">Clients</text>
  <text x="320" y="96" font-size="11" fill="#73726c" text-anchor="middle">Overseer</text>
  <text x="565" y="96" font-size="11" fill="#73726c" text-anchor="middle">Stores</text>
  <rect x="40" y="106" width="165" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="122.5" y="130.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">CLI verbs</text>
  <text x="122.5" y="148.0" font-size="12" fill="#185FA5" text-anchor="middle">most write, then nudge</text>
  <rect x="40" y="184" width="165" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="122.5" y="208.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">User</text>
  <text x="122.5" y="226.0" font-size="12" fill="#854F0B" text-anchor="middle">in a browser</text>
  <rect x="40" y="272" width="165" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="122.5" y="296.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Bridge</text>
  <text x="122.5" y="314.0" font-size="12" fill="#185FA5" text-anchor="middle">served by this Overseer</text>
  <rect x="40" y="380" width="165" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="122.5" y="404.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">agent-dashboard</text>
  <text x="122.5" y="422.0" font-size="12" fill="#185FA5" text-anchor="middle">a server process</text>
  <rect x="255" y="184" width="130" height="252" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="320.0" y="306.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">OverseerServer</text>
  <text x="320.0" y="324.0" font-size="12" fill="#185FA5" text-anchor="middle">127.0.0.1 only</text>
  <text x="320" y="340" font-size="12" fill="#185FA5" text-anchor="middle">one per board</text>
  <rect x="490" y="106" width="150" height="130" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="565.0" y="167.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Board files</text>
  <text x="565.0" y="185.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the tracker</text>
  <rect x="490" y="268" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="565.0" y="292.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Job event logs</text>
  <text x="565.0" y="310.0" font-size="12" fill="#5F5E5A" text-anchor="middle">read past a cursor</text>
  <rect x="490" y="380" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="565.0" y="404.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Agent transcripts</text>
  <text x="565.0" y="422.0" font-size="12" fill="#5F5E5A" text-anchor="middle">subagents a log lost</text>
  <path d="M207,122 L488,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="346" y="116" font-size="11" fill="#73726c" text-anchor="middle">writes the store itself, under the lock</text>
  <path d="M207,146 L320,146 L320,182" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="212" y="140" font-size="11" fill="#73726c">nudge; commands with the token; status reads</text>
  <path d="M122,240 L122,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M207,290 L253,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M253,312 L209,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="230" y="284" font-size="11" fill="#73726c" text-anchor="middle">POST</text>
  <text x="230" y="326" font-size="11" fill="#73726c" text-anchor="middle">SSE</text>
  <path d="M207,408 L253,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="230" y="402" font-size="11" fill="#73726c" text-anchor="middle">GET</text>
  <path d="M385,204 L488,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="437" y="198" font-size="11" fill="#73726c" text-anchor="middle">command, in a hold</text>
  <path d="M385,222 L488,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="437" y="236" font-size="11" fill="#73726c" text-anchor="middle">reads, no lock</text>
  <path d="M385,296 L488,296" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M385,408 L488,408" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
