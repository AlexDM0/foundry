<svg xmlns="http://www.w3.org/2000/svg" width="680" height="678" viewBox="0 0 680 678" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Hooks catch mistakes early; verify, Customs and gates decide</title>
  <desc>Two lanes over time. A person's change meets the edit hook, then pre-commit running lint and typecheck, then bun run verify with its four stages. An agent's change meets the same hooks where the repository has them, then Customs, then gates, then a review job when the pipeline has one, and the Airlock gates the merged tree and merges the branch with hooks off. Hooks can stop a commit, but only the later steps decide.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="676" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Hooks catch mistakes early; verify, Customs and gates decide</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs down. Hooks only catch early; the lower steps give the verdict.</text>
  <rect x="150" y="88" width="235" height="36" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="267.5" y="111.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Your change</text>
  <rect x="405" y="88" width="235" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="522.5" y="111.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">An agent's change</text>
  <text x="40" y="176" font-size="12" font-weight="500" fill="#73726c">Each edit</text>
  <text x="40" y="192" font-size="11" fill="#73726c" text-anchor="start">never blocks</text>
  <rect x="150" y="146" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="267.5" y="171.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Edit hook</text>
  <text x="267.5" y="189.0" font-size="12" fill="#185FA5" text-anchor="middle">eslint --fix on one .ts</text>
  <rect x="405" y="146" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="522.5" y="171.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Edit hook</text>
  <text x="522.5" y="189.0" font-size="12" fill="#185FA5" text-anchor="middle">if the repository has one</text>
  <text x="40" y="266" font-size="12" font-weight="500" fill="#73726c">Each commit</text>
  <text x="40" y="282" font-size="11" fill="#73726c" text-anchor="start">refuses the commit</text>
  <rect x="150" y="236" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="267.5" y="261.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">pre-commit</text>
  <text x="267.5" y="279.0" font-size="12" fill="#185FA5" text-anchor="middle">lint and typecheck</text>
  <rect x="405" y="236" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="522.5" y="261.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">pre-commit</text>
  <text x="522.5" y="279.0" font-size="12" fill="#185FA5" text-anchor="middle">core.hooksPath set per session</text>
  <text x="40" y="484" font-size="12" font-weight="500" fill="#73726c">After the work</text>
  <text x="40" y="500" font-size="11" fill="#73726c" text-anchor="start">the verdict</text>
  <path d="M142,326 L134,326 L134,656 L142,656" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <rect x="150" y="326" width="235" height="134" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="267.5" y="350" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">bun run verify</text>
  <text x="267.5" y="368" font-size="12" fill="#185FA5" text-anchor="middle">you run it, four stages</text>
  <text x="172" y="392" font-size="12" fill="#185FA5">1  typecheck: three projects</text>
  <text x="172" y="411" font-size="12" fill="#185FA5">2  bun test</text>
  <text x="172" y="430" font-size="12" fill="#185FA5">3  RunDomSpecs: .dom.tsx</text>
  <text x="172" y="449" font-size="12" fill="#185FA5">4  lint</text>
  <text x="267.5" y="490" font-size="12" fill="#73726c" text-anchor="middle">Your change ends here</text>
  <rect x="405" y="326" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="522.5" y="351.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <text x="522.5" y="369.0" font-size="12" fill="#185FA5" text-anchor="middle">report against git and log</text>
  <rect x="405" y="416" width="235" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="522.5" y="441.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Gates</text>
  <text x="522.5" y="459.0" font-size="12" fill="#185FA5" text-anchor="middle">the repository's commands</text>
  <rect x="405" y="506" width="235" height="60" rx="8" fill="#FAECE7" stroke="#712B13" stroke-dasharray="6 4"/>
  <text x="522.5" y="531.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Review job</text>
  <text x="522.5" y="549.0" font-size="12" fill="#993C1D" text-anchor="middle">optional, on the same worktree</text>
  <rect x="405" y="596" width="235" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="522.5" y="622.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock merges the branch</text>
  <text x="522.5" y="640.0" font-size="12" fill="#185FA5" text-anchor="middle">gates the merged tree, hooks off</text>
  <path d="M267.5,124 L267.5,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M267.5,206 L267.5,234" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M267.5,296 L267.5,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522.5,124 L522.5,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522.5,206 L522.5,234" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522.5,296 L522.5,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522.5,386 L522.5,414" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522.5,476 L522.5,504" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <path d="M522.5,566 L522.5,594" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</svg>
