<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The Overseer and its agents must end before the folder goes</title>
  <desc>Ten steps along a time axis, from mktemp to rm -rf. The scratch folder's bar spans all ten. The HOME export and the other exports sit inside it. The Overseer runs from oversee to stop --now, and agent sessions run on to pkill, both ending before rm -rf. Skipping stop --now leaves the Overseer running; skipping pkill leaves the agents running.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="464" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The Overseer and its agents must end before the folder goes</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One tick per step of the scratch board. Each bar is what is live.</text>
  <path d="M150,122 L150,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M150,100 L150,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="150" y="98" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mktemp</text>
  <path d="M203,122 L203,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M203,116 L203,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="203" y="114" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">export HOME</text>
  <path d="M256,122 L256,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M256,100 L256,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="256" y="98" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">init</text>
  <path d="M309,122 L309,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M309,116 L309,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="309" y="114" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">commit</text>
  <path d="M362,122 L362,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M362,100 L362,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="362" y="98" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">export ROOT</text>
  <path d="M415,122 L415,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M415,116 L415,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="415" y="114" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee</text>
  <path d="M468,122 L468,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M468,100 L468,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="468" y="98" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop --now</text>
  <path d="M521,122 L521,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M521,116 L521,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="521" y="114" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pkill</text>
  <path d="M574,122 L574,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M574,100 L574,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="574" y="98" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">unset</text>
  <path d="M627,122 L627,358" fill="none" stroke="#bfbdb0" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M627,116 L627,122" fill="none" stroke="#bfbdb0" stroke-width="1"/>
  <text x="640" y="114" font-size="11" fill="#73726c" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">rm -rf</text>
  <text x="40" y="155.0" font-size="12" font-weight="500" fill="#73726c">Scratch folder</text>
  <rect x="150" y="134" width="477" height="34" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="388.5" y="155.0" font-size="12" fill="#444441" text-anchor="middle">$SCRATCH</text>
  <text x="40" y="201.0" font-size="12" font-weight="500" fill="#73726c">HOME export</text>
  <rect x="203" y="180" width="371" height="34" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="388.5" y="201.0" font-size="12" fill="#444441" text-anchor="middle">scratch home</text>
  <text x="40" y="247.0" font-size="12" font-weight="500" fill="#73726c">Other exports</text>
  <rect x="362" y="226" width="212" height="34" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="468.0" y="247.0" font-size="12" fill="#444441" text-anchor="middle">ROOT, FAKE_AGENT</text>
  <text x="40" y="293.0" font-size="12" font-weight="500" fill="#73726c">Agent sessions</text>
  <rect x="415" y="272" width="106" height="34" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="40" y="339.0" font-size="12" font-weight="500" fill="#73726c">Overseer</text>
  <rect x="415" y="318" width="53" height="34" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <path d="M345,396 L345,376 L468,376 L468,355" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="396" width="190" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="345.0" y="420" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">No stop before rm -rf</text>
  <text x="345.0" y="438" font-size="12" fill="#A32D2D" text-anchor="middle">the Overseer keeps running</text>
  <path d="M521,396 L521,309" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="450" y="396" width="190" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="545.0" y="420" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">No pkill before rm -rf</text>
  <text x="545.0" y="438" font-size="12" fill="#A32D2D" text-anchor="middle">the agents keep running</text>
</svg>
