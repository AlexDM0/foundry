<svg xmlns="http://www.w3.org/2000/svg" width="680" height="498" viewBox="0 0 680 498" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A scratch board keeps every effect off your real files and subscription</title>
  <desc>The program runs from this checkout. HOME sends the monitor folder, with its Watcher sockets, and the transcripts to a scratch home. FORGE_ROOT sends tracker writes to the scratch repository. FORGE_FAKE_AGENT swaps every session for a scripted fake that spends no subscription. No arrow reaches a real tracker, the real monitor folder or the real transcripts.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="496" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A scratch board keeps every effect off your real files and subscription</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three settings move three things. KEEPS_WORKING only shapes the fake.</text>
  <rect x="40" y="104" width="150" height="228" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="213.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">bun agent-progress.ts</text>
  <text x="115.0" y="231.0" font-size="12" fill="#185FA5" text-anchor="middle">this checkout's code</text>
  <rect x="390" y="92" width="250" height="170" rx="10" fill="none" stroke="#bfbdb0" stroke-dasharray="6 4"/>
  <text x="404" y="112" font-size="12" font-weight="500" fill="#73726c" font-family="ui-monospace,Menlo,Consolas,monospace">$SCRATCH</text>
  <rect x="404" y="122" width="222" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="515.0" y="145.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">home/</text>
  <text x="515.0" y="163.0" font-size="12" fill="#5F5E5A" text-anchor="middle">&lt;monitor&gt; with sockets, transcripts</text>
  <rect x="404" y="192" width="222" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="515.0" y="215.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">example-agency/&lt;data&gt;/</text>
  <text x="515.0" y="233.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the scratch tracker</text>
  <rect x="404" y="276" width="222" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="515.0" y="299.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Fake session</text>
  <text x="515.0" y="317.0" font-size="12" fill="#993C1D" text-anchor="middle">no subscription spent</text>
  <path d="M190,150 L402,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="198" y="143" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">HOME</text>
  <path d="M190,220 L402,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="198" y="213" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">FORGE_ROOT</text>
  <path d="M190,304 L402,304" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="198" y="297" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">FORGE_FAKE_AGENT</text>
  <rect x="40" y="366" width="600" height="112" rx="10" fill="none" stroke="#bfbdb0"/>
  <text x="56" y="388" font-size="12" font-weight="500" fill="#73726c">Your real files: no arrow reaches them</text>
  <rect x="56" y="402" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="146.0" y="427.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">A real tracker</text>
  <text x="146.0" y="445.0" font-size="12" fill="#5F5E5A" text-anchor="middle">any live board</text>
  <rect x="250" y="402" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="427.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">~/&lt;monitor&gt;</text>
  <text x="340.0" y="445.0" font-size="12" fill="#5F5E5A" text-anchor="middle">registry and sockets</text>
  <rect x="444" y="402" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="534.0" y="427.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Your transcripts</text>
  <text x="534.0" y="445.0" font-size="12" fill="#5F5E5A" text-anchor="middle">under your real HOME</text>
</svg>
