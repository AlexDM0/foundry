  <text x="40" y="450.0" font-size="14" fill="#3d3d3a">Word a refusal</text>
  <circle cx="452" cy="445.0" r="7" fill="#FAF9F5" stroke="#185FA5" stroke-width="2"/>
  <circle cx="532" cy="445.0" r="8" fill="#185FA5"/>
