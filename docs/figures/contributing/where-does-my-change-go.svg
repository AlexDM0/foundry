<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="652" viewBox="0 0 1000 652" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Most changes touch one code layer and at most one document</title>
  <desc>A grid of eleven kinds of change against eight parts of the repository, columns in import order. Seven rows have one filled dot in one code layer and at most one document, forming a staircase from src/lib to bridge. Word a refusal, change an installed file and add a board change reach two or three parts, and a rename fills its whole row.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="650" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Most changes touch one code layer and at most one document</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Columns run in import order, then what is not code. Filled is where the change goes; hollow is what else it touches.</text>
  <path d="M812.0,104 L812.0,578" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="6 4"/>
