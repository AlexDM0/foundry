  <circle cx="946" cy="559.0" r="8" fill="#185FA5"/>
  <circle cx="48" cy="607" r="8" fill="#185FA5"/>
  <text x="64" y="612" font-size="13" fill="#73726c">The Go to column: the code goes here</text>
  <circle cx="350" cy="607" r="7" fill="#FAF9F5" stroke="#185FA5" stroke-width="2"/>
  <text x="366" y="612" font-size="13" fill="#73726c">The Also touch column, outside the same folder</text>
</svg>
