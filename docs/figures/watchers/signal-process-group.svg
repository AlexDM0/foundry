<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A group that shows signs of reuse is never signalled</title>
  <desc>If the leader runs, the group is signalled only when its identity matches, otherwise the outcome is identity-mismatch. If the leader is gone, the group needs members, the recorded boot and a readable, non-empty member list with no member older than the leader; failing gives group-gone, group-recycled or refused. A group that shows no sign of reuse is signalled, which proves nothing about the id.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="498" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A group that shows signs of reuse is never signalled</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A member older than the leader proves reuse; no older member proves nothing</text>
  <rect x="40" y="92" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="115.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Leader still runs?</text>
  <text x="160.0" y="132.0" font-size="12" fill="#185FA5" text-anchor="middle">identityOf(leader) answers</text>
  <rect x="40" y="178" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="201.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Group has members?</text>
  <text x="160.0" y="218.0" font-size="12" fill="#185FA5" text-anchor="middle">kill 0 to the group</text>
  <rect x="40" y="248" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="271.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">This is the recorded boot?</text>
  <text x="160.0" y="288.0" font-size="12" fill="#185FA5" text-anchor="middle">boot identity compared</text>
  <rect x="40" y="318" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="341.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Member list readable?</text>
  <text x="160.0" y="358.0" font-size="12" fill="#185FA5" text-anchor="middle">ps -A, start stamps</text>
  <rect x="40" y="388" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="160.0" y="411.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Any member predates leader?</text>
  <text x="160.0" y="428.0" font-size="12" fill="#185FA5" text-anchor="middle">older means id reused</text>
  <path d="M160,144 L160,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="168" y="165.0" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M160,230 L160,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="168" y="243.0" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <path d="M160,300 L160,316" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="168" y="313.0" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <path d="M160,370 L160,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="168" y="383.0" font-size="11" fill="#73726c" text-anchor="start">yes</text>
  <path d="M280,118 L318,118" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="298" y="112" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="320" y="92" width="110" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="375.0" y="123.04" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Same identity?</text>
  <path d="M430,105 L478,105" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="455" y="99" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M430,131 L478,131" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="480" y="84" width="160" height="34" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="560.0" y="105.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#27500A" text-anchor="middle">signalled</text>
  <rect x="480" y="122" width="160" height="34" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="560.0" y="143.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#791F1F" text-anchor="middle">identity-mismatch</text>
  <text x="455" y="148" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <path d="M280,204 L478,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="198" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <rect x="480" y="187" width="160" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560.0" y="208.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">group-gone</text>
  <path d="M280,274 L478,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="268" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <rect x="480" y="257" width="160" height="34" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="560.0" y="278.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#791F1F" text-anchor="middle">group-recycled</text>
  <path d="M280,333 L478,333" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="327" font-size="11" fill="#73726c" text-anchor="middle">unreadable</text>
  <rect x="480" y="318" width="160" height="28" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="560.0" y="336.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#791F1F" text-anchor="middle">refused</text>
  <path d="M280,358 L478,358" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="352" font-size="11" fill="#73726c" text-anchor="middle">empty</text>
  <rect x="480" y="350" width="160" height="28" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560.0" y="368.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">group-gone</text>
  <path d="M280,414 L478,414" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="408" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="480" y="397" width="160" height="34" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="560.0" y="418.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#791F1F" text-anchor="middle">group-recycled</text>
  <path d="M160,440 L160,456" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="168" y="452" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="458" width="240" height="30" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="160.0" y="477.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#27500A" text-anchor="middle">signalled</text>
</svg>
