<svg xmlns="http://www.w3.org/2000/svg" width="680" height="622" viewBox="0 0 680 622" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every Watcher and child leads its own session</title>
  <desc>A login item or shell starts the Overseer, which spawns an agent Watcher running the agent, whose Bash tool commands lead a process group of their own, a process Watcher running an install or gate child, an Airlock or pipeline agent gate child with no Watcher, and during a Baton pass a successor Overseer. Each outlined group is an operating-system session and process group of its own, which the first Overseer has only under --detach. Everything with a survives badge outlives the Overseer; the gate child with no Watcher has its output pipe close and its result is lost.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="620" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every Watcher and child leads its own session</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A death stops at that boundary, so a Watcher and its child outlive the Overseer</text>
  <rect x="40" y="104" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="127.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Login item or shell</text>
  <text x="115.0" y="144.0" font-size="12" fill="#5F5E5A" text-anchor="middle">oversee</text>
  <path d="M115,156 L115,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="123" y="196" font-size="11" fill="#73726c" text-anchor="start">starts</text>
  <rect x="30" y="228" width="170" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="40" y="238" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="263.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="115.0" y="280.0" font-size="12" fill="#185FA5" text-anchor="middle">holds the Baton</text>
  <text x="30" y="320" font-size="11" fill="#73726c" text-anchor="start">own session only under --detach</text>
  <rect x="254" y="96" width="166" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="264" y="106" width="146" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="337.0" y="131.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Agent Watcher</text>
  <text x="337.0" y="148.0" font-size="12" fill="#185FA5" text-anchor="middle">one per job instance</text>
  <rect x="254" y="266" width="166" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="264" y="276" width="146" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="337.0" y="301.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Process Watcher</text>
  <text x="337.0" y="318.0" font-size="12" fill="#185FA5" text-anchor="middle">install or gate</text>
  <rect x="254" y="496" width="166" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="264" y="506" width="146" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="337.0" y="531.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Successor Overseer</text>
  <text x="337.0" y="548.0" font-size="12" fill="#185FA5" text-anchor="middle">only in a Baton pass</text>
  <path d="M190,266 L226,266" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M226,134 L226,534" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M226,134 L262,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M226,304 L262,304" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M226,534 L262,534" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M226,424 L472,424" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="464" y="96" width="186" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="474" y="106" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="557.0" y="131.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent</text>
  <text x="557.0" y="148.0" font-size="12" fill="#993C1D" text-anchor="middle">the vendor CLI</text>
  <rect x="474" y="190" width="166" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="557.0" y="213.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Bash tool command</text>
  <text x="557.0" y="230.0" font-size="12" fill="#993C1D" text-anchor="middle">leads its own group</text>
  <path d="M410,134 L472,134" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M557,172 L557,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="464" y="266" width="186" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="474" y="276" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="557.0" y="301.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Install or gate child</text>
  <text x="557.0" y="318.0" font-size="12" fill="#993C1D" text-anchor="middle">sandbox if usable, no stdin</text>
  <path d="M410,304 L472,304" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="464" y="386" width="186" height="76" rx="12" fill="none" stroke="#a3a196" stroke-width="1"/>
  <rect x="474" y="396" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="557.0" y="421.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Airlock or pipeline agent gate</text>
  <text x="557.0" y="438.0" font-size="12" fill="#993C1D" text-anchor="middle">no Watcher, output piped</text>
  <text x="350" y="417" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">runGate</text>
  <rect x="342" y="88" width="70" height="18" rx="9" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="377.0" y="101" font-size="11" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="342" y="258" width="70" height="18" rx="9" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="377.0" y="271" font-size="11" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="342" y="488" width="70" height="18" rx="9" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="377.0" y="501" font-size="11" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="572" y="88" width="70" height="18" rx="9" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="607.0" y="101" font-size="11" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="572" y="258" width="70" height="18" rx="9" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="607.0" y="271" font-size="11" fill="#27500A" text-anchor="middle">survives</text>
  <rect x="558" y="378" width="84" height="18" rx="9" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="600.0" y="391" font-size="11" fill="#444441" text-anchor="middle">result lost</text>
  <text x="40" y="592" font-size="12" fill="#73726c" text-anchor="start">Outlined group: an operating-system session and process group of its own.</text>
  <text x="40" y="610" font-size="12" fill="#73726c" text-anchor="start">Survives: outlives the Overseer. Result lost: its output pipe closes and its result died with the Overseer.</text>
</svg>
