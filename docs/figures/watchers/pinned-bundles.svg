<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Watcher keeps the code that spawned it</title>
  <desc>An Overseer on code A pins watcher-A.js and spawns instance 1, which runs that file across a landing and past a Baton pass or restart to an Overseer on code B. The later Overseer reads the older Watcher through its record and event log. A resumed instance 2 starts from watcher-B.js, so one session can run two code versions.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A Watcher keeps the code that spawned it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A landing changes no running Watcher; a resumed instance can run later code</text>

  <path d="M300,108 L300,286" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="300" y="100" font-size="11" fill="#3B6D11" text-anchor="middle">a landing</text>

  <text x="40" y="133" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">Overseer</text>
  <rect x="130" y="112" width="210" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="235" y="133" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer on code A</text>
  <text x="375" y="126" font-size="11" fill="#73726c" text-anchor="middle">Baton pass</text>
  <text x="375" y="140" font-size="11" fill="#73726c" text-anchor="middle">or restart</text>
  <rect x="410" y="112" width="230" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="525" y="133" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer on code B</text>

  <text x="40" y="193" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">Bundle file</text>
  <path d="M150,146 L150,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="158" y="162" font-size="11" fill="#73726c" text-anchor="start">pins</text>
  <rect x="130" y="172" width="140" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="200" y="193" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">watcher-A.js</text>
  <path d="M440,146 L440,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="448" y="162" font-size="11" fill="#73726c" text-anchor="start">pins</text>
  <rect x="430" y="172" width="140" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="500" y="193" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">watcher-B.js</text>

  <path d="M418,146 L418,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="410" y="186" font-size="11" fill="#73726c" text-anchor="end">reads its record</text>
  <text x="410" y="201" font-size="11" fill="#73726c" text-anchor="end">and event log</text>

  <text x="40" y="272" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">One session</text>
  <path d="M200,206 L200,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="208" y="232" font-size="11" fill="#73726c" text-anchor="start">runs</text>
  <rect x="190" y="250" width="290" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="272" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">instance 1, on code A</text>
  <path d="M510,206 L510,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="518" y="232" font-size="11" fill="#73726c" text-anchor="start">runs</text>
  <rect x="500" y="250" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="570" y="272" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">instance 2, on code B</text>

  <path d="M130,308 L638,308" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="130" y="326" font-size="11" fill="#73726c" text-anchor="start">time</text>
  <text x="40" y="350" font-size="12" fill="#73726c" text-anchor="start">A and B stand for code versions; the file is <tspan font-family="ui-monospace,Menlo,Consolas,monospace">watcher-&lt;codeVersion&gt;.js</tspan>.</text>
</svg>
