<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A stop runs to SIGKILL even if the child already left</title>
  <desc>After a stop frame the Watcher closes stdin at once, signals the group with SIGTERM after one grace and SIGKILL after a second grace. In case 1 a child that ignores everything dies at SIGKILL. In case 2 a child exits on closed stdin; one member dies at SIGTERM and one that ignores it dies at SIGKILL. The Watcher stays through both timers and exits once its end is acknowledged.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A stop runs to SIGKILL even if the child already left</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Once started, both timers run, so a surviving member is still killed</text>
  <text x="170" y="100" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">stop received</text>
  <text x="170" y="116" font-size="11" fill="#73726c" text-anchor="middle">stdin closed</text>
  <path d="M170,124 L170,352" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="330" y="100" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">SIGTERM</text>
  <text x="330" y="116" font-size="11" fill="#73726c" text-anchor="middle">to the group</text>
  <path d="M330,124 L330,352" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="490" y="100" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">SIGKILL</text>
  <text x="490" y="116" font-size="11" fill="#73726c" text-anchor="middle">to the group</text>
  <path d="M490,124 L490,352" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M174,140 L324,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="250.0" y="134" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#73726c" text-anchor="middle">graceMilliseconds</text>
  <path d="M334,140 L484,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="410.0" y="134" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#73726c" text-anchor="middle">graceMilliseconds</text>
  <text x="40" y="164" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">Case 1</text>
  <text x="40" y="179" font-size="11" fill="#73726c" text-anchor="start">child ignores</text>
  <text x="40" y="193" font-size="11" fill="#73726c" text-anchor="start">everything</text>
  <rect x="170" y="158" width="320" height="26" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="330.0" y="176" font-size="12" fill="#712B13" text-anchor="middle">child and its members</text>
  <text x="40" y="226" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="start">Case 2</text>
  <text x="40" y="241" font-size="11" fill="#73726c" text-anchor="start">child exits on</text>
  <text x="40" y="255" font-size="11" fill="#73726c" text-anchor="start">closed stdin</text>
  <path d="M162,212 L156,212 L156,300 L162,300" fill="none" stroke="#a3a196" stroke-width="1.2"/>
  <rect x="170" y="210" width="70" height="26" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="205.0" y="228" font-size="12" fill="#712B13" text-anchor="middle">child</text>
  <rect x="170" y="242" width="160" height="26" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="250.0" y="260" font-size="12" fill="#712B13" text-anchor="middle">member, dies at SIGTERM</text>
  <rect x="170" y="274" width="320" height="26" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="330.0" y="292" font-size="12" fill="#712B13" text-anchor="middle">member, ignores TERM, dies at SIGKILL</text>
  <text x="40" y="335" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start">Watcher</text>
  <rect x="170" y="318" width="320" height="26" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="330.0" y="336" font-size="12" fill="#0C447C" text-anchor="middle">stays through both timers</text>
  <text x="500" y="335" font-size="12" fill="#73726c" text-anchor="start">exit once acknowledged</text>
  <text x="40" y="378" font-size="12" fill="#73726c" text-anchor="start">Without a stop frame nothing is signalled: a child that exits by itself leaves its members alone.</text>
  <text x="40" y="398" font-size="12" fill="#73726c" text-anchor="start">The signals span twice the grace; the Overseer sends SESSION_STOP_GRACE_MILLISECONDS for a job.</text>
</svg>
