<svg xmlns="http://www.w3.org/2000/svg" width="680" height="538" viewBox="0 0 680 538" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every production client hangs up before the broadcast</title>
  <desc>One shared opening: the client says hello, the Watcher syncs and reads its log, then in one event-loop turn sends welcome and history and joins the client to the broadcast. WatcherFleet.sendFrames writes its frames with hello, half-closes and reads no answer. Regrouping.helloHistoryOf hangs up at history. Only the test client stays for message and state.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="536" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every production client hangs up before the broadcast</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Where a client hangs up decides which frames it ever sees</text>
  <rect x="40" y="84" width="200" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="107.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Client</text>
  <rect x="390" y="84" width="160" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="470.0" y="107.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <path d="M140,120 L140,326" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M470,120 L470,508" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M140,146 L468,146" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="305" y="140" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello</text>
  <rect x="390" y="160" width="160" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="470.0" y="182.3" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Syncs and reads the log</text>
  <path d="M468,226 L142,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="305" y="220" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">welcome</text>
  <path d="M468,258 L142,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="305" y="252" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">history</text>
  <rect x="390" y="272" width="160" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="470.0" y="294.3" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Joins the broadcast</text>
  <path d="M556,212 L562,212 L562,308 L556,308" fill="none" stroke="#a3a196" stroke-width="1.2"/>
  <text x="570" y="254" font-size="12" fill="#5F5E5A" text-anchor="start">one event-</text>
  <text x="570" y="270" font-size="12" fill="#5F5E5A" text-anchor="start">loop turn</text>
  <text x="40" y="348" font-size="12" fill="#5F5E5A" text-anchor="start">Then one of three clients:</text>
  <rect x="40" y="358" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="377.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0C447C" text-anchor="middle">WatcherFleet.sendFrames</text>
  <text x="140.0" y="394.0" font-size="12" fill="#185FA5" text-anchor="middle">reads no answer</text>
  <path d="M240,380 L468,380" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="355" y="374" font-size="11" fill="#73726c" text-anchor="middle">frames with hello, then half-close</text>
  <rect x="40" y="410" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="140.0" y="429.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0C447C" text-anchor="middle">Regrouping.helloHistoryOf</text>
  <text x="140.0" y="446.0" font-size="12" fill="#185FA5" text-anchor="middle">hangs up at history</text>
  <text x="255" y="436" font-size="11" fill="#73726c" text-anchor="start">sees no message</text>
  <rect x="40" y="462" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="140.0" y="481.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">WatcherProtocolClient</text>
  <text x="140.0" y="498.0" font-size="12" fill="#5F5E5A" text-anchor="middle">tests only</text>
  <path d="M468,484 L242,484" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="355" y="478" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">message, state</text>
</svg>
