<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A socket path leaves 45 bytes for the home folder</title>
  <desc>A ruler of 104 bytes holds the home folder, 27 bytes of monitor folder, 10 of /watchers/, 16 hex digits, 5 of .sock and one terminating zero. Only the home varies, so it may take 45 bytes. A 46-byte home overflows the limit and the launch file reads as unreadable.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A socket path leaves 45 bytes for the home folder</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Every other part of the path is fixed, and the limit counts a terminating zero</text>

  <text x="170" y="112" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">home folder</text>
  <text x="377" y="112" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">monitor folder</text>
  <text x="484" y="112" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">/watchers/</text>
  <text x="559" y="112" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">16 hex digits</text>
  <text x="620" y="112" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">.sock</text>

  <rect x="40" y="122" width="259.6" height="48" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="170" y="151" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">45</text>
  <rect x="299.6" y="122" width="155.8" height="48" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="377.5" y="151" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">27</text>
  <rect x="455.4" y="122" width="57.7" height="48" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="484.2" y="151" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">10</text>
  <rect x="513.1" y="122" width="92.3" height="48" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="559.2" y="151" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">16</text>
  <rect x="605.4" y="122" width="28.8" height="48" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="619.8" y="151" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">5</text>
  <rect x="634.2" y="122" width="5.8" height="48" fill="#A32D2D" stroke="#A32D2D"/>

  <path d="M40,170 L40,180" fill="none" stroke="#a3a196" stroke-width="1.2"/>
  <text x="40" y="194" font-size="11" fill="#73726c" text-anchor="start">byte 0</text>
  <path d="M637,170 L637,180" fill="none" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="640" y="194" font-size="11" fill="#A32D2D" text-anchor="end">terminating zero, 1 byte, reaching 104</text>

  <path d="M302,114 L302,222" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="290" y="216" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="end">A 46-byte home crosses here:</text>
  <text x="290" y="233" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#A32D2D" text-anchor="end">launch-unreadable</text>

  <text x="40" y="272" font-size="12" fill="#73726c" text-anchor="start">The limit is <tspan font-family="ui-monospace,Menlo,Consolas,monospace">WATCHER_SOCKET_PATH_LIMIT_BYTES</tspan>. Counts are bytes.</text>
</svg>
