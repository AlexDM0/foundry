<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A marker keeps a frame from being sent twice</title>
  <desc>The Overseer checks the marker and liveness, then sends hello and the frames in one write and hangs up. The Watcher checks the secret and acts, and the Overseer writes the marker only once the send connected. An Overseer dying anywhere from the frame to the marker sends it again after a restart.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="430" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A marker keeps a frame from being sent twice</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Only an Overseer dying between the send and the marker can repeat it</text>
  <rect x="40" y="184" width="600" height="172" rx="6" fill="#F1EFE8" fill-opacity="0.7"/>
  <rect x="55" y="84" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="107.04" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <path d="M130,120 L130,190" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M130,212 L130,366" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <rect x="275" y="84" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350.0" y="107.04" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <path d="M350,120 L350,366" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <rect x="485" y="84" width="150" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560.0" y="107.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job folder</text>
  <path d="M560,120 L560,366" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <rect x="45" y="132" width="170" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="153.32" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Marker absent, Watcher live?</text>
  <text x="50" y="203" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start">Overseer dies in this span: the frame goes again</text>
  <path d="M130,230 L273,230" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="200" y="223" font-size="11" fill="#73726c" text-anchor="middle">hello + frames, hang up</text>
  <rect x="275" y="214" width="150" height="32" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350.0" y="234.32" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Count line, check secret</text>
  <path d="M350,246 L350,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="275" y="264" width="150" height="32" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350.0" y="284.32" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Act on each frame</text>
  <path d="M425,280 L500,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="462" y="273" font-size="11" fill="#73726c" text-anchor="middle">appends</text>
  <rect x="502" y="264" width="116" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560.0" y="284.32" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">client entry</text>
  <rect x="45" y="304" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="323.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">sendFrames answers true</text>
  <text x="130.0" y="339.0" font-size="11" fill="#185FA5" text-anchor="middle">connected, not applied</text>
  <path d="M215,326 L500,326" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="440" y="319" font-size="11" fill="#73726c" text-anchor="middle">writes</text>
  <rect x="502" y="310" width="116" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560.0" y="330.32" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">&lt;marker&gt;</text>
  <text x="40" y="390" font-size="12" fill="#73726c" text-anchor="start">A send that never connected writes no marker, so a later Pass tries again while the Watcher is live.</text>
  <text x="40" y="410" font-size="12" fill="#73726c" text-anchor="start">A frame the Watcher refused or dropped still counts as connected, so a true is no proof it acted.</text>
</svg>
