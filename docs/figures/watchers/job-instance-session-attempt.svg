  <text x="265.0" y="336" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">instance 1</text>
  <text x="265.0" y="354" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">events-1.ndjson</text>
  <rect x="350" y="312" width="150" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="425.0" y="336" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">instance 2</text>
  <text x="425.0" y="354" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">events-2.ndjson</text>
  <rect x="515" y="312" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="580.0" y="336" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">instance 1</text>
  <text x="580.0" y="354" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">events-1.ndjson</text>
  <rect x="660" y="312" width="130" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="725.0" y="336" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">instance 1</text>
  <text x="725.0" y="354" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">events-1.ndjson</text>
  <rect x="815" y="312" width="145" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="887.5" y="336" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">instance 1</text>
  <text x="887.5" y="354" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">events-1.ndjson</text>
  <text x="40" y="400" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Cursor</text>
  <text x="40" y="418" font-size="13" fill="#73726c" text-anchor="start">(instance, sequence)</text>
  <rect x="190" y="378" width="150" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="265.0" y="399.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">(1, 0 to last)</text>
  <rect x="350" y="378" width="150" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="425.0" y="399.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">(2, 0 to last)</text>
  <rect x="515" y="378" width="130" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580.0" y="399.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">(1, 0 to last)</text>
  <rect x="660" y="378" width="130" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="725.0" y="399.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">(1, 0 to last)</text>
  <rect x="815" y="378" width="145" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="887.5" y="399.68" font-size="13" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">(1, 0 to last)</text>
  <path d="M345,310 L345,430" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M440,270 L440,286 L725,286 L725,274" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="640" y="302" font-size="13" fill="#993C1D" text-anchor="end"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">--resume</tspan>: J3 carries on J1's session</text>
  <text x="345" y="448" font-size="13" fill="#5F5E5A" text-anchor="middle">Watcher lost:</text>
  <text x="345" y="466" font-size="13" fill="#5F5E5A" text-anchor="middle">job resumes,</text>
  <text x="345" y="484" font-size="13" fill="#5F5E5A" text-anchor="middle">instance + 1</text>
  <path d="M652,184 L652,278" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M652,294 L652,430" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="652" y="448" font-size="13" fill="#5F5E5A" text-anchor="middle">review sends back:</text>
  <text x="652" y="466" font-size="13" fill="#5F5E5A" text-anchor="middle">a later job, the</text>
  <text x="652" y="484" font-size="13" fill="#5F5E5A" text-anchor="middle">same session</text>
  <path d="M802,136 L802,430" fill="none" stroke="#a3a196" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="802" y="448" font-size="13" fill="#5F5E5A" text-anchor="middle">failed pass:</text>
  <text x="802" y="466" font-size="13" fill="#5F5E5A" text-anchor="middle">fresh session,</text>
  <text x="802" y="484" font-size="13" fill="#5F5E5A" text-anchor="middle">same worktree</text>
  <text x="40" y="544" font-size="13" fill="#73726c" text-anchor="start">A review job stores its round in the attempt field, so the attempt row reads for build jobs. Ticket and job ids are examples.</text>
</svg>
