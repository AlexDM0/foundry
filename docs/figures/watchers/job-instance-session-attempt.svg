<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="574" viewBox="0 0 1000 574" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A session can outlive its job; an instance never does</title>
  <desc>For ticket 003, attempt 1 holds job J1 with Watcher instances 1 and 2 under one session, each with its own event log and cursor. Review job J2 sends the work back, and job J3 resumes the session of J1 with --resume on its own instance 1. A failed pass starts attempt 2, where job J4 opens a fresh session on the same worktree.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="572" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A session can outlive its job; an instance never does</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A worktree outlives its attempts, an attempt its jobs, a job its Watcher instances; a session can span jobs</text>
  <text x="40" y="114" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Worktree</text>
  <rect x="190" y="92" width="770" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="113.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">ticket-003, the same folder and branch throughout</text>
  <text x="40" y="160" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Attempt</text>
  <rect x="190" y="138" width="600" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="490.0" y="159.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">attempt 1</text>
  <rect x="815" y="138" width="145" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="887.5" y="159.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">attempt 2</text>
  <text x="40" y="209" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Job</text>
  <rect x="190" y="186" width="310" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="345.0" y="208.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">J1 build</text>
  <rect x="515" y="186" width="130" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="580.0" y="208.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">J2 review</text>
  <rect x="660" y="186" width="130" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="725.0" y="208.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">J3 build</text>
  <rect x="815" y="186" width="145" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="887.5" y="208.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">J4 build</text>
  <text x="40" y="257" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Session</text>
  <rect x="190" y="234" width="310" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="345.0" y="256.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">session of J1</text>
  <rect x="515" y="234" width="130" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="580.0" y="256.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">session of J2</text>
  <rect x="660" y="234" width="130" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="725.0" y="256.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">session of J1</text>
  <rect x="815" y="234" width="145" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="887.5" y="256.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">session of J4</text>
  <text x="40" y="344" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Watcher instance</text>
