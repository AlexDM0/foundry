<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A permission prompt is denied with no Overseer in the loop</title>
  <desc>Every stdout line is logged with origin agent first. A can_use_tool line then matches a rule, so the Watcher logs the reply with origin watcher and writes the denial to stdin, and the agent continues; the permission request and the reply are both logged. The question tool matches no rule, so nothing is written and the agent waits. Only then does the Overseer matter, reading the log on a later Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="550" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A permission prompt is denied with no Overseer in the loop</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Every line is logged first; only a question waits, because the rule leaves it out</text>

  <rect x="40" y="84" width="120" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="100" y="107" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent</text>
  <rect x="200" y="84" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="107" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <rect x="360" y="84" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="420" y="107" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Event log</text>
  <rect x="520" y="84" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="580" y="107" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <path d="M100,120 L100,500" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M260,120 L260,500" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M420,120 L420,500" fill="none" stroke="#ddd9cc" stroke-width="1.2"/>
  <path d="M580,120 L580,500" fill="none" stroke="#ddd9cc" stroke-width="1.2" stroke-dasharray="5 4"/>

  <rect x="40" y="136" width="120" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="100" y="158" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#712B13" text-anchor="middle">can_use_tool</text>
  <path d="M160,154 L198,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="179" y="147" font-size="11" fill="#73726c" text-anchor="middle">stdout</text>
  <rect x="200" y="136" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="158" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Logs the line</text>
  <path d="M320,154 L358,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="360" y="136" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="420" y="158" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">origin agent</text>
  <path d="M260,172 L260,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="200" y="192" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="214" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">A rule matches</text>
  <path d="M260,228 L260,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="200" y="248" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="270" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Logs the reply</text>
  <path d="M320,266 L358,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="360" y="248" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="420" y="270" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">origin watcher</text>
  <path d="M480,266 L518,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="499" y="259" font-size="11" fill="#73726c" text-anchor="middle">reads</text>
  <rect x="520" y="248" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="580" y="264" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Reads both</text>
  <text x="580" y="278" font-size="11" fill="#185FA5" text-anchor="middle">on a later Pass</text>
  <path d="M260,284 L260,302" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="200" y="304" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="326" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Writes the denial</text>
  <path d="M200,322 L162,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="181" y="315" font-size="11" fill="#73726c" text-anchor="middle">stdin</text>
  <rect x="40" y="304" width="120" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="100" y="326" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">Agent continues</text>

  <path d="M40,360 L640,360" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>

  <rect x="40" y="380" width="120" height="36" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="100" y="402" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">The question tool</text>
  <path d="M160,398 L198,398" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="179" y="391" font-size="11" fill="#73726c" text-anchor="middle">stdout</text>
  <rect x="200" y="380" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="402" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Logs the line</text>
  <path d="M320,398 L358,398" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="360" y="380" width="120" height="36" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="420" y="402" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">origin agent</text>
  <path d="M480,398 L518,398" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="499" y="391" font-size="11" fill="#73726c" text-anchor="middle">reads</text>
  <rect x="520" y="380" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="580" y="402" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">On a later Pass</text>
  <path d="M260,416 L260,438" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="200" y="440" width="120" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="462" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">No rule matches</text>
  <text x="260" y="479" font-size="12" fill="#185FA5" text-anchor="middle">writes nothing</text>
  <path d="M100,416 L100,438" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="440" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="100" y="462" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">Agent waits</text>
  <text x="100" y="479" font-size="12" fill="#854F0B" text-anchor="middle">for the Overseer</text>

  <text x="40" y="528" font-size="12" fill="#73726c" text-anchor="start">The Claude adapter's one rule is <tspan font-family="ui-monospace,Menlo,Consolas,monospace">DENY_EVERY_PERMISSION_BUT_A_QUESTION</tspan>.</text>
</svg>
