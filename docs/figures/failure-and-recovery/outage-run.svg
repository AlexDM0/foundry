<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only crashes on different tickets in a row reach an outage</title>
  <desc>A strip of log records left to right with the run length under each. A crash on ticket 003 gives a run of 1. A second crash on 003 stays at 1, because the same ticket restarts the run. A verified job ending gives 0. A crash on 003 gives 1, and a crash on 007 reaches CONSECUTIVE_DEAD_AGENTS_BEFORE_STOPPING, so the Overseer is paused and an outage decision opens.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="318" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only crashes on different tickets in a row reach an outage</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Log records, oldest first, with the run outageIsDue counts under each.</text>
  <rect x="40" y="96" width="132" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="106.0" y="123.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Crash</text>
  <text x="106.0" y="140.0" font-size="12" fill="#A32D2D" text-anchor="middle">#003</text>
  <path d="M172,126 L190,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="176" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="106.0" y="203.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">run 1</text>
  <text x="106.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">run starts</text>
  <rect x="192" y="96" width="132" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="258.0" y="123.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Crash</text>
  <text x="258.0" y="140.0" font-size="12" fill="#A32D2D" text-anchor="middle">#003</text>
  <path d="M324,126 L342,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="192" y="176" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="258.0" y="203.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">run 1</text>
  <text x="258.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">same ticket: restarts</text>
  <rect x="344" y="96" width="132" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="410.0" y="123.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Job verified</text>
  <text x="410.0" y="140.0" font-size="12" fill="#3B6D11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">built</text>
  <path d="M476,126 L494,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="344" y="176" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="410.0" y="203.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">run 0</text>
  <text x="410.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">clears the run</text>
  <rect x="496" y="96" width="132" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="562.0" y="123.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Crash</text>
  <text x="562.0" y="140.0" font-size="12" fill="#A32D2D" text-anchor="middle">#003</text>
  <path d="M628,126 L646,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="496" y="176" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="562.0" y="203.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">run 1</text>
  <text x="562.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">run starts</text>
  <rect x="648" y="96" width="132" height="60" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="714.0" y="123.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Crash</text>
  <text x="714.0" y="140.0" font-size="12" fill="#A32D2D" text-anchor="middle">#007</text>
  <rect x="648" y="176" width="132" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="714.0" y="203.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">run 2</text>
  <text x="714.0" y="220.0" font-size="12" fill="#5F5E5A" text-anchor="middle">different ticket</text>
  <path d="M780,126 L798,126" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="800" y="96" width="140" height="60" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="870.0" y="123.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Overseer paused</text>
  <text x="870.0" y="140.0" font-size="12" fill="#854F0B" text-anchor="middle">outage decision</text>
  <text x="870.0" y="212" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">run reaches the bound</text>
  <text x="40" y="274" font-size="13" fill="#73726c">A crash on the same ticket as the one before never adds up. A crash on a ticketless job is skipped.</text>
  <text x="40" y="294" font-size="13" fill="#73726c">The bound is <tspan font-family="ui-monospace,Menlo,Consolas,monospace">CONSECUTIVE_DEAD_AGENTS_BEFORE_STOPPING</tspan> (2).</text>
</svg>
