<svg xmlns="http://www.w3.org/2000/svg" width="680" height="314" viewBox="0 0 680 314" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Events are played before the death is judged</title>
  <desc>Two runs of one job whose Watcher is lost. With a result in the log, playing the events moves the job to in-customs, so no branch of the second stage matches and Customs settles it. With no result, the job is still running when the end is settled, so branch 5 interrupts it.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="312" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Events are played before the death is judged</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">One Watcher lost, two logs. The first stage decides what the second can match.</text>
  <text x="135.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Log, Watcher lost</text>
  <text x="310.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">1. Play events</text>
  <text x="450.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">2. Settle the end</text>
  <text x="585.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Job</text>
  <path d="M240,86 L240,300" stroke="#CFE2F6" stroke-width="1.6" fill="none"/>
  <path d="M380,86 L380,300" stroke="#CFE2F6" stroke-width="1.6" fill="none"/>
  <rect x="40" y="134" width="66" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="73.0" y="160.7" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">started</text>
  <rect x="112" y="134" width="32" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="128.0" y="160.7" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">…</text>
  <rect x="150" y="134" width="62" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="181.0" y="160.7" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">result</text>
  <text x="40" y="120" font-size="12" fill="#5F5E5A" text-anchor="start">A report in the log</text>
  <rect x="250" y="124" width="120" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="310.0" y="153.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs</text>
  <text x="310.0" y="169.0" font-size="12" fill="#185FA5" text-anchor="middle">the result moved it</text>
  <rect x="390" y="124" width="120" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="450.0" y="153.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">No branch</text>
  <text x="450.0" y="169.0" font-size="12" fill="#185FA5" text-anchor="middle">job not running</text>
  <rect x="530" y="124" width="110" height="64" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="585.0" y="153.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Customs</text>
  <text x="585.0" y="169.0" font-size="12" fill="#3B6D11" text-anchor="middle">settles the report</text>
  <path d="M212,156.0 L248,156.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M370,156.0 L388,156.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,156.0 L528,156.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="232" width="66" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="73.0" y="258.7" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">started</text>
  <rect x="112" y="232" width="32" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="128.0" y="258.7" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">…</text>
  <text x="40" y="218" font-size="12" fill="#5F5E5A" text-anchor="start">No report in the log</text>
  <rect x="250" y="222" width="120" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="310.0" y="251.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <text x="310.0" y="267.0" font-size="12" fill="#185FA5" text-anchor="middle">no event moved it</text>
  <rect x="390" y="222" width="120" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="450.0" y="251.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Branch 5</text>
  <text x="450.0" y="267.0" font-size="12" fill="#185FA5" text-anchor="middle">gone, no result</text>
  <rect x="530" y="222" width="110" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="585.0" y="251.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">interrupted</text>
  <text x="585.0" y="267.0" font-size="12" fill="#854F0B" text-anchor="middle">a resume follows</text>
  <path d="M144,254.0 L248,254.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M370,254.0 L388,254.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,254.0 L528,254.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
