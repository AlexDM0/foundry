<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One board’s refusal stops new work on every board until the reset</title>
  <desc>Time runs down across four lanes: a session of board A, board A&#x27;s Overseer, the machine-wide marker, board B&#x27;s Overseer. The session meets a top-level refusal. Board A&#x27;s lock hold, where its usage hold starts, interrupts the job with cause usage-limit, then writes the marker, then sends the stop frame. Board B reads the marker at its next Pass and starts no new tickets and no resume; its running sessions go on. Both Overseers set a timer for resetsAt, a clock exception. At the reset both run a forced Pass: board A resumes by id and board B launches again.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="508" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One board’s refusal stops new work on every board until the reset</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The marker goes out before the stop frames. The reset is the vendor’s time, so a timer waits for it.</text>
  <rect x="40" y="84" width="124" height="34" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="102.0" y="105.68" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Session on board A</text>
  <path d="M102,118 L102,486" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <rect x="204.0" y="84" width="128" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="268.0" y="105.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer A</text>
  <path d="M268,118 L268,486" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <rect x="360.0" y="84" width="128" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="424.0" y="105.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Marker</text>
  <path d="M424,118 L424,486" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <rect x="508.0" y="84" width="128" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="572.0" y="105.68" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer B</text>
  <path d="M572,118 L572,486" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M196,124 H340 V296 H500 V240 H640 V412 H40 V296 H196 Z" fill="#FAEEDA" opacity="0.5"/>
  <text x="52" y="318" font-size="12" fill="#854F0B" text-anchor="start">Usage hold: no new tickets, no resume, no Assistant boot</text>
  <rect x="44" y="132" width="116" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="102.0" y="151.2" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Refusal</text>
  <text x="102.0" y="167.3" font-size="12" fill="#993C1D" text-anchor="middle">top-level only</text>
  <path d="M160,154 L206,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="208" y="132" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="268.0" y="151.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Lock hold</text>
  <text x="268.0" y="167.3" font-size="12" fill="#185FA5" text-anchor="middle">interrupted</text>
  <rect x="366" y="190" width="116" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="424.0" y="209.2" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">resetsAt</text>
  <text x="424.0" y="225.3" font-size="12" fill="#5F5E5A" text-anchor="middle">written first</text>
  <path d="M268,176 L268,212 L364,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="278" y="204" font-size="11" fill="#73726c" text-anchor="start">1. marker</text>
  <path d="M254,176 L254,262 L162,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="244" y="254" font-size="11" fill="#73726c" text-anchor="end">2. stop frame</text>
  <rect x="44" y="240" width="116" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="102.0" y="259.2" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Stopped</text>
  <text x="102.0" y="275.3" font-size="12" fill="#993C1D" text-anchor="middle">by its Watcher</text>
  <rect x="514" y="250" width="116" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="572.0" y="269.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Next Pass reads it</text>
  <text x="572.0" y="285.3" font-size="12" fill="#185FA5" text-anchor="middle">running jobs go on</text>
  <path d="M482,224 L560,224 L560,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="514" y="332" width="116" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="572.0" y="351.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Timer set</text>
  <text x="572.0" y="367.3" font-size="12" fill="#185FA5" text-anchor="middle">for resetsAt</text>
  <path d="M572,294 L572,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="208" y="332" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="268.0" y="351.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Timer set</text>
  <text x="268.0" y="367.3" font-size="12" fill="#185FA5" text-anchor="middle">for resetsAt</text>
  <path d="M268,376 L268,426" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M572,376 L572,426" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="276" y="402" font-size="11" fill="#73726c" text-anchor="start">at the reset</text>
  <text x="580" y="402" font-size="11" fill="#73726c" text-anchor="start">at the reset</text>
  <rect x="208" y="428" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="268.0" y="447.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Forced Pass</text>
  <text x="268.0" y="463.3" font-size="12" fill="#185FA5" text-anchor="middle">resumes by id</text>
  <rect x="514" y="428" width="116" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="572.0" y="447.2" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Forced Pass</text>
  <text x="572.0" y="463.3" font-size="12" fill="#185FA5" text-anchor="middle">launches again</text>
  <path d="M206,450 L162,450" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="44" y="428" width="116" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="102.0" y="447.2" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Resumed</text>
  <text x="102.0" y="463.3" font-size="12" fill="#993C1D" text-anchor="middle">never counted</text>
</svg>
