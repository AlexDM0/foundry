<svg xmlns="http://www.w3.org/2000/svg" width="680" height="496" viewBox="0 0 680 496" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A lost Watcher gets one cause, and only crashes count</title>
  <desc>A Watcher reads as lost. If a cause is already stored in watcher-n.lost-cause it is read back. Otherwise a recorded boot that differs from this boot gives reboot, with nothing signalled and nothing counted. A recorded child group that a SIGKILL reaches gives watcher-lost. Anything else gives agent-crashed. Only the last two count. The answer is stored once, so an Overseer dying after the kill reads the same cause.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="494" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A lost Watcher gets one cause, and only crashes count</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Regrouping.settleLostWatcher settles it once. A second reading returns the stored answer.</text>
  <rect x="70" y="88" width="230" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="115.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Watcher reads as lost</text>
  <path d="M185.0,132 L185.0,156" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="70" y="158" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="185.0" y="183.6" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">A cause is stored?</text>
  <text x="185.0" y="199.8" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-&lt;n&gt;.lost-cause</text>
  <path d="M300,186 L390,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="346.0" y="180" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="392" y="162" width="214" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="499.0" y="183.6" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Read it back</text>
  <text x="499.0" y="199.8" font-size="12" fill="#5F5E5A" text-anchor="middle">same answer, no signal</text>
  <path d="M185.0,214 L185.0,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="195.0" y="232" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="70" y="242" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="185.0" y="267.6" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Recorded boot differs?</text>
  <text x="185.0" y="283.8" font-size="12" fill="#185FA5" text-anchor="middle">the machine restarted</text>
  <path d="M300,270 L390,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="346.0" y="264" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="392" y="244" width="214" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="499.0" y="267.6" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reboot</text>
  <text x="499.0" y="283.8" font-size="12" fill="#3B6D11" text-anchor="middle">nothing signalled, never counts</text>
  <path d="M185.0,298 L185.0,324" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="195.0" y="316" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="70" y="326" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="185.0" y="351.6" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Child group signalled?</text>
  <text x="185.0" y="367.8" font-size="12" fill="#185FA5" text-anchor="middle">SIGKILL to the recorded group</text>
  <path d="M300,354 L390,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="346.0" y="348" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="392" y="328" width="214" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="499.0" y="351.6" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-lost</text>
  <text x="499.0" y="367.8" font-size="12" fill="#A32D2D" text-anchor="middle">agent killed first, counts</text>
  <rect x="70" y="408" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="185.0" y="431.6" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-crashed</text>
  <text x="185.0" y="447.8" font-size="12" fill="#A32D2D" text-anchor="middle">nothing left to kill, counts</text>
  <path d="M185.0,382 L185.0,406" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="195.0" y="398" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="392" y="408" width="214" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="499.0" y="431.6" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Stored once</text>
  <text x="499.0" y="447.8" font-size="12" fill="#5F5E5A" text-anchor="middle">written after the kill</text>
  <path d="M300,434 L390,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M579.0,380 L579.0,406" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M620,270 L620,434 L608,434" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M606,270 L620,270" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
</svg>
