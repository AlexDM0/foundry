<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Almost everything survives a death</title>
  <desc>Five things can die: the agent, its Watcher, the Overseer, the machine, or a lock holder. Against each: the agent session, the Watcher, the Overseer, the board, in-flight work and whether it counts as a crash. The board survives every row. In-flight work survives except a gate or install whose process Watcher is lost, by a kill or a reboot, and a lock hold either completes or never happened. Only a session's agent or Watcher death counts as a crash; a lost gate or install Watcher does not.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="518" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Almost everything survives a death</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Green survives. Amber comes back through a resume, a re-run or a start. Red is lost. In the last column, red counts as a crash.</text>
  <text x="256.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Agent session</text>
  <text x="384.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Watcher</text>
  <text x="512.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer</text>
  <text x="640.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Board</text>
  <text x="768.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">In-flight work</text>
  <text x="896.0" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Counts as a crash?</text>
  <rect x="40" y="114" width="146" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="113.0" y="146.1" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Agent</text>
  <text x="113.0" y="163.2" font-size="13" fill="#5F5E5A" text-anchor="middle">process exits</text>
  <rect x="196" y="114" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="256.0" y="153.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">resumes by id</text>
  <rect x="324" y="114" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="384.0" y="145.7" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">records the end</text>
  <text x="384.0" y="162.7" font-size="13" fill="#854F0B" text-anchor="middle">then next instance</text>
  <rect x="452" y="114" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="512.0" y="153.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">keeps driving</text>
  <rect x="580" y="114" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="640.0" y="153.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">intact</text>
  <rect x="708" y="114" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="768.0" y="153.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">worktree stays</text>
  <rect x="836" y="114" width="120" height="70" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="896.0" y="145.7" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">yes</text>
  <text x="896.0" y="162.7" font-size="13" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-crashed</text>
  <rect x="40" y="192" width="146" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="113.0" y="224.1" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Watcher</text>
  <text x="113.0" y="241.2" font-size="13" fill="#5F5E5A" text-anchor="middle">killed, agent alive</text>
  <rect x="196" y="192" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="256.0" y="223.7" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">group killed,</text>
  <text x="256.0" y="240.7" font-size="13" fill="#854F0B" text-anchor="middle">then resumed</text>
  <rect x="324" y="192" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="384.0" y="231.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">next instance</text>
  <rect x="452" y="192" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="512.0" y="231.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">keeps driving</text>
  <rect x="580" y="192" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="640.0" y="231.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">intact</text>
  <rect x="708" y="192" width="120" height="70" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="768.0" y="223.7" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">gate or install lost</text>
  <text x="768.0" y="240.7" font-size="13" fill="#A32D2D" text-anchor="middle">session work stays</text>
  <rect x="836" y="192" width="120" height="70" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="896.0" y="214.7" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">yes for a</text>
  <text x="896.0" y="231.7" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">session Watcher</text>
  <text x="896.0" y="248.7" font-size="13" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-lost</text>
  <rect x="40" y="270" width="146" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="113.0" y="302.1" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Overseer</text>
  <text x="113.0" y="319.2" font-size="13" fill="#5F5E5A" text-anchor="middle">kill or crash</text>
  <rect x="196" y="270" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="256.0" y="309.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">keeps working</text>
  <rect x="324" y="270" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="384.0" y="309.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">keeps logging</text>
  <rect x="452" y="270" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="512.0" y="309.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">needs a start</text>
  <rect x="580" y="270" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="640.0" y="309.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">intact</text>
  <rect x="708" y="270" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="768.0" y="301.7" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">merge gate</text>
  <text x="768.0" y="318.7" font-size="13" fill="#854F0B" text-anchor="middle">runs again</text>
  <rect x="836" y="270" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="896.0" y="309.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">no</text>
  <rect x="40" y="348" width="146" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="113.0" y="380.1" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Machine</text>
  <text x="113.0" y="397.2" font-size="13" fill="#5F5E5A" text-anchor="middle">reboot</text>
  <rect x="196" y="348" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="256.0" y="387.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">resumes by id</text>
  <rect x="324" y="348" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="384.0" y="387.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">next instance</text>
  <rect x="452" y="348" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="512.0" y="387.68" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">needs a start</text>
  <rect x="580" y="348" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="640.0" y="387.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">intact</text>
  <rect x="708" y="348" width="120" height="70" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="768.0" y="379.7" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">gate or install lost</text>
  <text x="768.0" y="396.7" font-size="13" fill="#A32D2D" text-anchor="middle">session work stays</text>
  <rect x="836" y="348" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="896.0" y="379.7" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">no</text>
  <text x="896.0" y="396.7" font-size="13" fill="#3B6D11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reboot</text>
  <rect x="40" y="426" width="146" height="70" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="113.0" y="458.1" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Lock holder</text>
  <text x="113.0" y="475.2" font-size="13" fill="#5F5E5A" text-anchor="middle">dies in a lock hold</text>
  <rect x="196" y="426" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="256.0" y="465.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">not touched</text>
  <rect x="324" y="426" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="384.0" y="465.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">not touched</text>
  <rect x="452" y="426" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="512.0" y="457.7" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">survives unless</text>
  <text x="512.0" y="474.7" font-size="13" fill="#3B6D11" text-anchor="middle">it held the lock</text>
  <rect x="580" y="426" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="640.0" y="457.7" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">journal replays</text>
  <text x="640.0" y="474.7" font-size="13" fill="#854F0B" text-anchor="middle">if it was written</text>
  <rect x="708" y="426" width="120" height="70" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="768.0" y="457.7" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">completes or</text>
  <text x="768.0" y="474.7" font-size="13" fill="#854F0B" text-anchor="middle">never happened</text>
  <rect x="836" y="426" width="120" height="70" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="896.0" y="465.68" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">no</text>
</svg>
