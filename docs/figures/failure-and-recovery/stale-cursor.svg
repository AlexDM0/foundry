<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A restart is an ordinary Pass with a stale cursor</title>
  <desc>A strip of one job&#x27;s event log with sequences 1 to 9. The stored cursor stands at 4 when the Overseer dies. While nobody drives, the Watcher appends 5 to 9. The next Overseer&#x27;s ordinary Pass reads every entry past the cursor, applies them in one lock hold and moves the cursor to 9 in that same lock hold.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A restart is an ordinary Pass with a stale cursor</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The Watcher keeps its log while nobody drives. Nothing replays specially.</text>
  <rect x="303" y="106" width="324" height="118" rx="6" fill="#FAEEDA" opacity="0.5"/>
  <text x="310" y="124" font-size="12" fill="#854F0B" text-anchor="start">Overseer down: nobody drives</text>
  <rect x="52" y="150" width="58" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="81.0" y="177.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">1</text>
  <rect x="116" y="150" width="58" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="145.0" y="177.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">2</text>
  <rect x="180" y="150" width="58" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="209.0" y="177.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">3</text>
  <rect x="244" y="150" width="58" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="273.0" y="177.04" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">4</text>
  <rect x="308" y="150" width="58" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="337.0" y="177.04" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">5</text>
  <rect x="372" y="150" width="58" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="401.0" y="177.04" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">6</text>
  <rect x="436" y="150" width="58" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="465.0" y="177.04" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">7</text>
  <rect x="500" y="150" width="58" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="529.0" y="177.04" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">8</text>
  <rect x="564" y="150" width="58" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="593.0" y="177.04" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">9</text>
  <text x="52" y="210" font-size="12" fill="#5F5E5A" text-anchor="start">applied, in progress.json</text>
  <text x="310" y="210" font-size="12" fill="#993C1D" text-anchor="start">written by the Watcher, not yet applied</text>
  <path d="M273.0,132 L273.0,147" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="187.0" y="98" width="100" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237.0" y="119.68" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">cursor at 4</text>
  <rect x="120" y="254" width="440" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="277.6" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Next Pass: observe past the cursor, apply in one lock hold</text>
  <text x="340.0" y="293.8" font-size="12" fill="#185FA5" text-anchor="middle">the cursor moves to 9 in that lock hold</text>
  <path d="M495.0,222 L495.0,251" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
