<svg xmlns="http://www.w3.org/2000/svg" width="680" height="414" viewBox="0 0 680 414" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A reboot costs a resume only where a session was running</title>
  <desc>A fan-out from one root: the boot identity differs, so every Watcher is lost with cause reboot. A running job is interrupted and resumed by id. A waiting-for-answer job is interrupted until answered, then resumed. A preparing job whose install was running ends stopped with a setup-failed incident. A gating job whose gate was running ends stopped with a gate-cannot-run incident. A launching job whose session never started stays launching.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="412" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">A reboot costs a resume only where a session was running</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The job's state at the reboot decides. No branch adds to a crash count.</text>
  <rect x="40" y="197.0" width="150" height="88" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115.0" y="238.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Boot differs</text>
  <text x="115.0" y="254.0" font-size="12" fill="#185FA5" text-anchor="middle">every Watcher lost</text>
  <text x="115" y="273.0" font-size="12" fill="#185FA5" text-anchor="middle">cause reboot</text>
  <path d="M190,241.0 L214,241.0" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M214,117.0 L214,365.0" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M214,117.0 L232,117.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="234" y="92" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="316.0" y="114.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <text x="316.0" y="130.0" font-size="12" fill="#5F5E5A" text-anchor="middle">session up</text>
  <path d="M398,117.0 L438,117.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="440" y="92" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="540.0" y="114.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Interrupted, then resumed</text>
  <text x="540.0" y="130.0" font-size="12" fill="#854F0B" text-anchor="middle">by session id</text>
  <path d="M214,179.0 L232,179.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="234" y="154" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="316.0" y="176.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">waiting-for-answer</text>
  <text x="316.0" y="192.0" font-size="12" fill="#5F5E5A" text-anchor="middle">session on a question</text>
  <path d="M398,179.0 L438,179.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="440" y="154" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="540.0" y="176.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Interrupted until answered</text>
  <text x="540.0" y="192.0" font-size="12" fill="#854F0B" text-anchor="middle">then resumed with the answer</text>
  <path d="M214,241.0 L232,241.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="234" y="216" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="316.0" y="238.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">preparing</text>
  <text x="316.0" y="254.0" font-size="12" fill="#5F5E5A" text-anchor="middle">install running</text>
  <path d="M398,241.0 L438,241.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="440" y="216" width="200" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="540.0" y="238.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Ended stopped</text>
  <text x="540.0" y="254.0" font-size="12" fill="#A32D2D" text-anchor="middle">setup-failed incident</text>
  <path d="M214,303.0 L232,303.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="234" y="278" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="316.0" y="300.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <text x="316.0" y="316.0" font-size="12" fill="#5F5E5A" text-anchor="middle">gate running</text>
  <path d="M398,303.0 L438,303.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="440" y="278" width="200" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="540.0" y="300.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">Ended stopped</text>
  <text x="540.0" y="316.0" font-size="12" fill="#A32D2D" text-anchor="middle">gate-cannot-run incident</text>
  <path d="M214,365.0 L232,365.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="234" y="340" width="164" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="316.0" y="362.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <text x="316.0" y="378.0" font-size="12" fill="#5F5E5A" text-anchor="middle">claimed, never started</text>
  <path d="M398,365.0 L438,365.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="440" y="340" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="540.0" y="362.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">Stays launching</text>
  <text x="540.0" y="378.0" font-size="12" fill="#854F0B" text-anchor="middle">no branch moves it</text>
</svg>
