<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A ticket meets its deciders in this order</title>
  <desc>A ticket passes six stations left to right, shown with its main deciders: Launch with ticketIsHeld and freeSlotsOf, Report with clearCustoms, Gate with gateOutcomeOf, Review with settleReviewPass and nextRoundVerdictOf, Airlock with mergeCandidatesOf and claimAirlock, and Landing with landOnTarget. Four more deciders answer at any step: Playbook.nextStepsOf, livenessOf, Baton.acquire and Bouncer.verdictOf.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="354" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="22" font-weight="500" fill="#3d3d3a">A ticket meets its deciders in this order</text>
  <text x="40" y="68" font-size="15" fill="#73726c">The main deciders; four more answer at any step</text>

  <path d="M171,152 L186,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M319,152 L334,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M467,152 L482,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M645,152 L660,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M813,152 L828,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="92" width="130" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="105" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Launch</text>
  <text x="105" y="136" font-size="13" fill="#185FA5" text-anchor="middle">May it start?</text>
  <text x="105" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticketIsHeld</text>
  <text x="105" y="182" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">freeSlotsOf</text>
  <rect x="188" y="92" width="130" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="253" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Report</text>
  <text x="253" y="136" font-size="13" fill="#185FA5" text-anchor="middle">Clears Customs?</text>
  <text x="253" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">clearCustoms</text>
  <rect x="336" y="92" width="130" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="401" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Gate</text>
  <text x="401" y="136" font-size="13" fill="#185FA5" text-anchor="middle">Did it pass?</text>
  <text x="401" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gateOutcomeOf</text>
  <rect x="484" y="92" width="160" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="564" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Review</text>
  <text x="564" y="136" font-size="13" fill="#185FA5" text-anchor="middle">What follows?</text>
  <text x="564" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">settleReviewPass</text>
  <text x="564" y="182" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">nextRoundVerdictOf</text>
  <rect x="662" y="92" width="150" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="737" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
  <text x="737" y="136" font-size="13" fill="#185FA5" text-anchor="middle">Who lands next?</text>
  <text x="737" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mergeCandidatesOf</text>
  <text x="737" y="182" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">claimAirlock</text>
  <rect x="830" y="92" width="130" height="120" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="895" y="118" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Landing</text>
  <text x="895" y="136" font-size="13" fill="#185FA5" text-anchor="middle">May it land?</text>
  <text x="895" y="164" font-size="13" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">landOnTarget</text>

  <text x="40" y="250" font-size="14" fill="#73726c">At any step</text>
  <rect x="40.0" y="264" width="216.5" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="148.25" y="291" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">What runs next?</text>
  <text x="148.25" y="313" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Playbook.nextStepsOf</text>
  <rect x="274.5" y="264" width="216.5" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="382.75" y="291" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Is a Watcher alive?</text>
  <text x="382.75" y="313" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">livenessOf</text>
  <rect x="509.0" y="264" width="216.5" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="617.25" y="291" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">Who holds the Baton?</text>
  <text x="617.25" y="313" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Baton.acquire</text>
  <rect x="743.5" y="264" width="216.5" height="68" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="851.75" y="291" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">May this verb run?</text>
  <text x="851.75" y="313" font-size="13" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Bouncer.verdictOf</text>
</svg>
