<svg xmlns="http://www.w3.org/2000/svg" width="680" height="454" viewBox="0 0 680 454" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A restart clears only what is counted in memory</title>
  <desc>Log records, the stored board and the Watcher's event log survive a restart, so counts such as FAILED_PASSES_BEFORE_PARKING, JOB_RESUMES_BEFORE_FRESH and BUILDER_API_CALL_BUDGET carry on. Memory alone is cleared: QUIET_JOB_SWEEPS, REPLAY_BUFFER_EVENTS and ROUNDS_PER_SWEEP start again. Schedules, timers and constants count nothing.</desc>
  <rect x="1" y="1" width="678" height="452" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A restart clears only what is counted in memory</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Where a count is read from decides whether it survives</text>
  <text x="40" y="100" font-size="13" font-weight="500" fill="#27500A">Survives a restart</text>
  <rect x="40" y="110" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="56" y="134" font-size="14" font-weight="500" fill="#444441">Log</text>
  <text x="56" y="152" font-size="12" fill="#5F5E5A">log records</text>
  <text x="180" y="143" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">FAILED_PASSES_BEFORE_PARKING</text>
  <text x="410" y="143" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">REPLACED_JOBS_BEFORE_JOB_LOST</text>
  <rect x="40" y="174" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="56" y="198" font-size="14" font-weight="500" fill="#444441">Stored</text>
  <text x="56" y="216" font-size="12" fill="#5F5E5A">progress.json, tickets</text>
  <text x="180" y="207" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">JOB_RESUMES_BEFORE_FRESH</text>
  <text x="410" y="207" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">WORKER_FILINGS_PER_JOB</text>
  <rect x="40" y="238" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="56" y="262" font-size="14" font-weight="500" fill="#444441">Event log</text>
  <text x="56" y="280" font-size="12" fill="#5F5E5A">the Watcher's file</text>
  <text x="180" y="271" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">BUILDER_API_CALL_BUDGET</text>
  <text x="410" y="271" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">ASSISTANT_TURN_CALL_BUDGET</text>
  <text x="40" y="322" font-size="13" font-weight="500" fill="#0C447C">Cleared by a restart</text>
  <rect x="40" y="332" width="600" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="356" font-size="14" font-weight="500" fill="#0C447C">Memory</text>
  <text x="56" y="374" font-size="12" fill="#185FA5">the running process</text>
  <text x="180" y="365" font-size="12" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">QUIET_JOB_SWEEPS</text>
  <text x="310" y="365" font-size="12" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">REPLAY_BUFFER_EVENTS</text>
  <text x="470" y="365" font-size="12" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">ROUNDS_PER_SWEEP</text>
  <rect x="40" y="400" width="600" height="32" rx="8" fill="#FAF9F5" stroke="#E1DDD0" stroke-dasharray="5 4"/>
  <text x="340" y="421" font-size="12" fill="#5F5E5A" text-anchor="middle">Count nothing: Schedule, Timer, Constant</text>
</svg>
