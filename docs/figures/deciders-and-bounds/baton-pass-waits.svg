<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The caller's wait is the sum of the three waits inside it</title>
  <desc>BATON_PASS_OUTCOME_TRIES, 150 seconds, is what oversee restart and update wait. Inside it, in order: BATON_PASS_READY_TRIES, 30 seconds, the old Overseer waits for ready and on failure keeps driving; BATON_PASS_RELEASE_TRIES, 60 seconds, the successor waits for released and on failure the Baton is taken back; BATON_PASS_RELEASE_TRIES, 60 seconds, the old Overseer waits for serving and on failure takes the Baton back. BATON_PASS_REBIND_TRIES, 10 seconds, runs only on the way back and sits outside the sum.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="446" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The caller's wait is the sum of the three waits inside it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each wait at its limit, to scale; the way-back wait sits outside the sum</text>

  <g transform="translate(-10,0)">
  <rect x="50" y="92" width="540" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="320" y="116" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_OUTCOME_TRIES</text>
  <text x="320" y="134" font-size="12" fill="#185FA5" text-anchor="middle">150 s: oversee restart and update wait for the outcome</text>
  <rect x="50" y="164" width="108" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="104" y="197" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">30 s</text>
  <text x="170" y="186" font-size="12" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_READY_TRIES</text>
  <text x="170" y="204" font-size="12" fill="#73726c">Old Overseer waits for ready; fails: keeps driving</text>
  <rect x="158" y="232" width="216" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="266" y="256" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_RELEASE_TRIES</text>
  <text x="266" y="274" font-size="12" fill="#185FA5" text-anchor="middle">60 s for released</text>
  <text x="386" y="255" font-size="12" fill="#73726c">Successor waits</text>
  <text x="386" y="273" font-size="12" fill="#73726c">Fails: Baton taken back</text>
  <rect x="374" y="300" width="216" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="482" y="324" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_RELEASE_TRIES</text>
  <text x="482" y="342" font-size="12" fill="#185FA5" text-anchor="middle">60 s for serving</text>
  <text x="362" y="323" font-size="12" fill="#73726c" text-anchor="end">Old Overseer waits</text>
  <text x="362" y="341" font-size="12" fill="#73726c" text-anchor="end">Fails: Baton taken back</text>
  <rect x="590" y="368" width="36" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="5 4"/>
  <text x="608" y="401" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">10 s</text>
  <text x="578" y="391" font-size="12" fill="#0C447C" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">BATON_PASS_REBIND_TRIES</text>
  <text x="578" y="409" font-size="12" fill="#73726c" text-anchor="end">Only on the way back; fails: no Overseer on the board</text>
  </g>
</svg>
