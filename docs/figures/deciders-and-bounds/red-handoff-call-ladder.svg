<svg xmlns="http://www.w3.org/2000/svg" width="680" height="464" viewBox="0 0 680 464" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Red handoffs alone spend at most 240 builder calls</title>
  <desc>A builder's first attempt has 150 calls plus 10 of grace, and a red handoff resumes the same session with 30 plus 10, twice, so a third red parks the ticket after at most 240 calls. A report that clears leaves for review or the Airlock. A wound-down report, or a first attempt still silent at the limit, opens out-of-calls and ends the job; a silent resume counts as red.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="462" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Red handoffs alone spend at most 240 builder calls</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each red handoff resumes the same session; a third red parks the ticket</text>

  <path d="M140,148 L140,178" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="168" font-size="11" fill="#73726c">red handoff</text>
  <path d="M140,236 L140,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="256" font-size="11" fill="#73726c">red handoff</text>
  <path d="M140,324 L140,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="150" y="344" font-size="11" fill="#73726c">red, no resume left</text>

  <path d="M240,120 L300,120" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M240,208 L300,208" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M240,296 L300,296" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,120 L300,296" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,150 L428,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="142" font-size="11" fill="#73726c" text-anchor="middle">report clears, gates pass</text>
  <path d="M300,266 L428,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="308" y="244" font-size="11" fill="#73726c">wound-down, or</text>
  <text x="308" y="258" font-size="11" fill="#73726c">first attempt silent</text>

  <rect x="40" y="92" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="140" y="116" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">First attempt</text>
  <text x="140" y="134" font-size="12" fill="#993C1D" text-anchor="middle">150 calls + 10 grace</text>
  <rect x="40" y="180" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="140" y="204" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Resume 1</text>
  <text x="140" y="222" font-size="12" fill="#993C1D" text-anchor="middle">30 calls + 10 grace</text>
  <rect x="40" y="268" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="140" y="292" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Resume 2</text>
  <text x="140" y="310" font-size="12" fill="#993C1D" text-anchor="middle">30 calls + 10 grace</text>
  <rect x="40" y="356" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="140" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Ticket parks</text>
  <text x="140" y="398" font-size="12" fill="#854F0B" text-anchor="middle">waits for User</text>
  <rect x="430" y="122" width="210" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="535" y="146" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Job leaves the ladder</text>
  <text x="535" y="164" font-size="12" fill="#3B6D11" text-anchor="middle">on to review or Airlock</text>
  <rect x="430" y="238" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="535" y="262" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">out-of-calls</text>
  <text x="535" y="280" font-size="12" fill="#854F0B" text-anchor="middle">incident; the job ends</text>

  <text x="40" y="446" font-size="13" fill="#73726c">Most calls: 150 + 10 + 2 × (30 + 10) = 240</text>
</svg>
