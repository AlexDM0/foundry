<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A wind-down's result puts the count one ahead of the chats</title>
  <desc>Chats 1 and 2 each get a result, so the count reads 1 then 2. The wind-down line has no chat number, but its result counts, so the count reads 3 while the newest chat is 2. Chat 3 is sent with the count already at 3, so it is closed on sending and its incident I5 defaults with cause turn-closed. The count stays one ahead, so every later chat closes the same way.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="268" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A wind-down's result puts the count one ahead of the chats</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The line has no number, but its result counts. Time runs left to right.</text>
  <text x="40" y="117" font-size="13" font-weight="500" fill="#3d3d3a">Written</text>
  <text x="40" y="181" font-size="13" font-weight="500" fill="#3d3d3a">Result count</text>
  <rect x="130" y="92" width="110" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="185.0" y="117.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">chat 1</text>
  <rect x="260" y="92" width="110" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="315.0" y="117.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">chat 2</text>
  <rect x="390" y="92" width="110" height="40" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="445.0" y="108.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">wind-down line</text>
  <text x="445.0" y="126.0" font-size="12" fill="#185FA5" text-anchor="middle">no chat number</text>
  <rect x="520" y="92" width="110" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="108.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">chat 3</text>
  <text x="575.0" y="126.0" font-size="12" fill="#5F5E5A" text-anchor="middle">delivers I5</text>
  <rect x="130" y="160" width="110" height="32" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="181.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">1</text>
  <rect x="260" y="160" width="110" height="32" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="315.0" y="181.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">2</text>
  <rect x="390" y="160" width="110" height="32" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="445.0" y="181.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">3</text>
  <rect x="520" y="160" width="110" height="32" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575.0" y="181.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">3</text>
  <path d="M185,132 L185,157" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M315,132 L315,157" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M445,132 L445,157" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="630" y="210" font-size="11" fill="#185FA5" text-anchor="end">count already 3: closed on sending</text>
  <text x="630" y="225" font-size="11" fill="#185FA5" text-anchor="end">I5 defaults, cause turn-closed</text>
  <text x="40" y="250" font-size="11" fill="#73726c" text-anchor="start">Every later chat closes the same way: the count stays one ahead.</text>
</svg>
