<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Board changes go through the Bouncer; only a question goes round it</title>
  <desc>The Overseer sends incidents to the Assistant session and User's request starts a product-owner session. Each session writes only its session folder and its Hatch folder. Each files a board change as a request in its Hatch folder, which the Bouncer admits by role: incident moves for the Assistant, filing work for the product owner. Every other command that changes the board is refused. Only the product owner may also ask User, which opens a decision.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Board changes go through the Bouncer; only a question goes round it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One serves the Overseer, one serves User. Neither holds a ticket or a launch slot.</text>
  <rect x="170" y="88" width="170" height="176" rx="12" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="40" y="100" width="108" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="94.0" y="126.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Incident</text>
  <text x="94.0" y="144.0" font-size="12" fill="#185FA5" text-anchor="middle">from the Overseer</text>
  <rect x="40" y="192" width="108" height="60" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="94.0" y="218.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Request</text>
  <text x="94.0" y="236.0" font-size="12" fill="#854F0B" text-anchor="middle">from User</text>
  <rect x="180" y="100" width="150" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="255.0" y="126.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Assistant</text>
  <text x="255.0" y="144.0" font-size="12" fill="#993C1D" text-anchor="middle">disposable, no network</text>
  <rect x="180" y="192" width="150" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="255.0" y="218.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Product owner</text>
  <text x="255.0" y="236.0" font-size="12" fill="#993C1D" text-anchor="middle">a conversation with User</text>
  <rect x="424" y="100" width="62" height="152" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="455.0" y="172.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch</text>
  <text x="455.0" y="190.0" font-size="12" fill="#5F5E5A" text-anchor="middle">folder</text>
  <rect x="508" y="100" width="70" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="543.0" y="172.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer</text>
  <text x="543.0" y="190.0" font-size="12" fill="#185FA5" text-anchor="middle">by role</text>
  <rect x="594" y="146" width="46" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="617.0" y="181.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <rect x="180" y="298" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="255.0" y="322.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Session folder</text>
  <text x="255.0" y="340.0" font-size="12" fill="#5F5E5A" text-anchor="middle">all else it writes</text>
  <rect x="424" y="298" width="216" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="532.0" y="322.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused</text>
  <text x="532.0" y="340.0" font-size="12" fill="#A32D2D" text-anchor="middle">every other change</text>
  <path d="M148,130 L177,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M148,222 L177,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M330,130 L421,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="377" y="122" font-size="11" fill="#73726c" text-anchor="middle">incident moves</text>
  <path d="M330,222 L421,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="377" y="214" font-size="11" fill="#73726c" text-anchor="middle">filing work</text>
  <path d="M486,176 L505,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M578,176 L591,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M543,252 L543,295" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M255,264 L255,295" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="298" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="105.0" y="322.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Asks User</text>
  <text x="105.0" y="340.0" font-size="12" fill="#854F0B" text-anchor="middle">a decision</text>
  <path d="M205,252 L205,282 L105,282 L105,295" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="150" y="277" font-size="11" fill="#73726c" text-anchor="middle">product owner only</text>
</svg>
