<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The product owner files; only User readies what it filed</title>
  <desc>User makes a request and the Overseer launches a product-owner session. The session researches in a filing draft and files draft tickets, which the Bouncer admits. A ticket ready from the session, should it try, is refused. The session runs intake close, which in the same lock hold submits every complete draft ticket the intake filed: with ticket review on, the default, each goes to ready-for-review; an incomplete one stays a draft. User reviews them and runs ticket ready, with or without a running Overseer, which moves each named ticket to pending; the others stay in review until User readies them.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="578" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The product owner files; only User readies what it filed</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One intake, time running down. The red row is an attempt the Bouncer refuses.</text>

  <text x="102" y="100" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">User</text>
  <text x="264" y="100" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Product owner</text>
  <text x="426" y="100" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Code</text>
  <text x="578" y="100" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <path d="M178,108 L178,560 M345,108 L345,560 M507,108 L507,560" fill="none" stroke="#ECE7DC" stroke-width="1.2"/>

  <rect x="40" y="116" width="124" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="102" y="140" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Asks for work</text>
  <text x="102" y="158" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#854F0B" text-anchor="middle">intake -- text</text>

  <rect x="354" y="116" width="144" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="426" y="140" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer launches</text>
  <text x="426" y="158" font-size="12" fill="#185FA5" text-anchor="middle">session, no launch slot</text>

  <rect x="192" y="196" width="144" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="264" y="220" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Files draft tickets</text>
  <text x="264" y="238" font-size="12" fill="#993C1D" text-anchor="middle">from a filing draft</text>

  <rect x="354" y="196" width="144" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="426" y="220" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer admits</text>
  <text x="426" y="238" font-size="12" fill="#185FA5" text-anchor="middle">stamps filedByJob</text>

  <rect x="516" y="196" width="124" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="578" y="220" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Draft tickets</text>
  <text x="578" y="238" font-size="12" fill="#5F5E5A" text-anchor="middle">status draft</text>

  <rect x="192" y="276" width="144" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="264" y="300" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">If it tries to ready</text>
  <text x="264" y="318" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#993C1D" text-anchor="middle">ticket ready</text>

  <rect x="354" y="276" width="144" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="426" y="300" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Bouncer refuses</text>
  <text x="426" y="318" font-size="12" fill="#A32D2D" text-anchor="middle">not for this role</text>

  <rect x="192" y="356" width="144" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="264" y="380" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Closes intake</text>
  <text x="264" y="398" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#993C1D" text-anchor="middle">intake close</text>

  <rect x="354" y="356" width="144" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="426" y="380" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Close submits</text>
  <text x="426" y="398" font-size="12" fill="#185FA5" text-anchor="middle">each complete draft</text>

  <rect x="516" y="356" width="124" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="578" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Tickets</text>
  <text x="578" y="398" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#854F0B" text-anchor="middle">ready-for-review</text>

  <rect x="40" y="436" width="124" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="102" y="460" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Reviews them</text>
  <text x="102" y="478" font-size="12" fill="#854F0B" text-anchor="middle">with ticket ready</text>

  <rect x="354" y="436" width="144" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="426" y="460" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">ticket ready moves</text>
  <text x="426" y="478" font-size="12" fill="#185FA5" text-anchor="middle">each named ticket</text>

  <rect x="516" y="436" width="124" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="578" y="460" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ready tickets</text>
  <text x="578" y="478" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#5F5E5A" text-anchor="middle">pending</text>

  <path d="M164,144 L351,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M426,172 L426,184 L264,184 L264,193" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M336,224 L351,224" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M498,224 L513,224" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M336,304 L351,304" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M336,384 L351,384" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M498,384 L513,384" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M578,412 L578,424 L102,424 L102,433" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M164,464 L351,464" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="456" font-size="11" fill="#73726c" text-anchor="middle">ready</text>
  <path d="M498,464 L513,464" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M102,492 L102,532 L513,532" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="524" font-size="11" fill="#73726c" text-anchor="middle">not yet</text>
  <rect x="516" y="504" width="124" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="578" y="528" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Stay in review</text>
  <text x="578" y="546" font-size="12" fill="#5F5E5A" text-anchor="middle">User can ready later</text>
</svg>
