<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The board outlives every Assistant session</title>
  <desc>Session J7 takes three numbered chats. The first result closes chat 1; the second closes chat 2 and incident I2, left open, defaults with cause turn-closed. Chat 3 reaches its call budget, so the Overseer writes the interrupt line, its open incident defaults with cause turn-budget, and the session goes on. Past the context limit the idle session has its input closed. Fresh session J9 goes down mid-turn, so it is ended and I4 is withdrawn. Fresh session J11 receives I4 again in its chat 1. The Assistant keeps no memory that matters, because every first message comes from the board.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="418" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The board outlives every Assistant session</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The n-th result closes chat n. Time runs left to right, then down.</text>

  <text x="40" y="100" font-size="13" font-weight="500" fill="#3d3d3a">Session J7</text>
  <path d="M170,132 L212,132" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M322,132 L364,132" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M516,132 L556,132" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="191" y="124" font-size="11" fill="#73726c" text-anchor="middle">idle</text>
  <text x="343" y="124" font-size="11" fill="#73726c" text-anchor="middle">idle</text>
  <text x="536" y="124" font-size="11" fill="#73726c" text-anchor="middle">idle</text>

  <rect x="60" y="112" width="110" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="115" y="130" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">chat 1</text>
  <text x="115" y="145" font-size="11" fill="#993C1D" text-anchor="middle">settles I1</text>
  <rect x="212" y="112" width="110" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="267" y="130" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">chat 2</text>
  <text x="267" y="145" font-size="11" fill="#993C1D" text-anchor="middle">leaves I2 open</text>
  <rect x="364" y="112" width="152" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="440" y="130" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">chat 3</text>
  <text x="440" y="145" font-size="11" fill="#993C1D" text-anchor="middle">reaches its call budget</text>
  <rect x="556" y="112" width="84" height="40" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="598" y="130" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">input closed</text>
  <text x="598" y="145" font-size="11" fill="#185FA5" text-anchor="middle">context limit</text>

  <text x="170" y="170" font-size="11" fill="#185FA5" text-anchor="end">result 1</text>
  <text x="212" y="170" font-size="11" fill="#185FA5">result 2: I2 defaults</text>
  <text x="212" y="185" font-size="11" fill="#185FA5">cause turn-closed</text>
  <text x="364" y="170" font-size="11" fill="#185FA5">interrupt line sent: I3 defaults</text>
  <text x="364" y="185" font-size="11" fill="#185FA5">cause turn-budget</text>
  <text x="598" y="170" font-size="11" fill="#185FA5" text-anchor="middle">ends closed</text>
  <path d="M598,176 L598,204 L90,204 L90,258 L107,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="520" y="198" font-size="11" fill="#73726c" text-anchor="middle">fresh boot</text>

  <text x="110" y="226" font-size="13" font-weight="500" fill="#3d3d3a">Session J9, booted fresh</text>
  <text x="386" y="226" font-size="13" font-weight="500" fill="#3d3d3a">Session J11, booted fresh</text>

  <rect x="110" y="238" width="126" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="173" y="256" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">chat 1</text>
  <text x="173" y="271" font-size="11" fill="#993C1D" text-anchor="middle">delivered I4</text>
  <rect x="236" y="238" width="74" height="40" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="273" y="263" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle">down</text>
  <path d="M310,258 L383,258" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="347" y="250" font-size="11" fill="#73726c" text-anchor="middle">fresh boot</text>
  <rect x="386" y="238" width="126" height="40" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="449" y="256" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">chat 1</text>
  <text x="449" y="271" font-size="11" fill="#993C1D" text-anchor="middle">delivered I4 again</text>
  <path d="M512,258 L640,258" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="576" y="250" font-size="11" fill="#73726c" text-anchor="middle">idle</text>

  <text x="236" y="296" font-size="11" fill="#A32D2D">ended; I4 withdrawn</text>
  <text x="522" y="276" font-size="11" fill="#185FA5">result 1 closes chat 1</text>

  <rect x="40" y="340" width="600" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="365" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">The board</text>
  <text x="340" y="384" font-size="12" fill="#5F5E5A" text-anchor="middle">open incidents, tickets and the log, untouched by a session ending</text>

  <path d="M70,340 L70,155" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M173,340 L173,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M449,340 L449,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="459" y="316" font-size="11" fill="#73726c">each chat 1 reads the board</text>
</svg>
