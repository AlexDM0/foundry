<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A turn's close is never seen before its move</title>
  <desc>Two runs of one Pass. The Assistant writes a move, then a result. The Pass reads the result count, reads the Hatch folders, then in the lock hold applies the moves and closes the turn. If the result came before the count read, the move came earlier still, so it is applied first and the close finds the incident settled. If the result comes after the count read, this Pass leaves the turn open and the next Pass closes it.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A turn's close is never seen before its move</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One Pass reads the result count first, then the Hatch folders. Time runs left to right.</text>
  <text x="40" y="98" font-size="13" font-weight="500" fill="#3d3d3a">The Assistant's result comes before the count read</text>
  <rect x="416" y="154" width="224" height="72" rx="8" fill="#E1DDD0" fill-opacity="0.55"/>
  <text x="528" y="238" font-size="11" fill="#73726c" text-anchor="middle">lock hold</text>
  <rect x="40" y="110" width="96" height="36" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="88.0" y="133.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">move queued</text>
  <rect x="142" y="110" width="54" height="36" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="169.0" y="133.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">result</text>
  <rect x="200" y="162" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="248.0" y="186.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read results</text>
  <text x="248.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">sees the result</text>
  <rect x="311" y="162" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="359.0" y="186.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read Hatch</text>
  <text x="359.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">sees the move</text>
  <rect x="424" y="162" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="472.0" y="186.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Apply moves</text>
  <text x="472.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">settles incident</text>
  <rect x="535" y="162" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="583.0" y="186.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Close turn</text>
  <text x="583.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">finds it settled</text>
  <path d="M296,190 L308,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M407,190 L421,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M520,190 L532,190" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="262" font-size="13" font-weight="500" fill="#3d3d3a">The Assistant's result comes after the count read</text>
  <rect x="416" y="318" width="224" height="72" rx="8" fill="#E1DDD0" fill-opacity="0.55"/>
  <text x="528" y="402" font-size="11" fill="#73726c" text-anchor="middle">lock hold</text>
  <rect x="40" y="274" width="96" height="36" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="88.0" y="297.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">move queued</text>
  <rect x="332" y="274" width="54" height="36" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="359.0" y="297.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">result</text>
  <rect x="200" y="326" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="248.0" y="350.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read results</text>
  <text x="248.0" y="368.0" font-size="12" fill="#185FA5" text-anchor="middle">sees no result</text>
  <rect x="311" y="326" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="359.0" y="350.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read Hatch</text>
  <text x="359.0" y="368.0" font-size="12" fill="#185FA5" text-anchor="middle">sees the move</text>
  <rect x="424" y="326" width="96" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="472.0" y="350.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Apply moves</text>
  <text x="472.0" y="368.0" font-size="12" fill="#185FA5" text-anchor="middle">settles incident</text>
  <rect x="535" y="326" width="96" height="56" rx="8" fill="#F1EFE8" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <text x="583.0" y="350.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Turn open</text>
  <text x="583.0" y="368.0" font-size="12" fill="#5F5E5A" text-anchor="middle">next Pass closes</text>
  <path d="M296,354 L308,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M407,354 L421,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M520,354 L532,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
