<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A finding builds only after the ticket that found it lands</title>
  <desc>A worker files a low ticket through its Hatch and the Bouncer admits it with the job's tickets as its finders. The finding waits for its finders in dependsOn and joins the first finder's group. An incomplete finding stays a draft ticket. With ticket review off a complete finding is pending and builds once each finder is reviewed or delivered. With ticket review on it is ready-for-review, and User readies it to pending. When a finder is abandoned the finding drops that dependency, and an unstarted one moves to ready-for-review.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="578" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A finding builds only after the ticket that found it lands</text>
  <text x="40" y="68" font-size="13" fill="#73726c">It waits for its finder and follows the ticket review switch.</text>
  <rect x="220" y="88" width="176" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="308.0" y="112.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Worker files a finding</text>
  <text x="308.0" y="130.0" font-size="12" fill="#993C1D" text-anchor="middle">low ticket, through its Hatch</text>
  <rect x="220" y="176" width="176" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="308.0" y="200.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer admits it</text>
  <text x="308.0" y="218.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">finderTicketIds</text>
  <rect x="220" y="264" width="176" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="308.0" y="288.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Waits on its finder</text>
  <text x="308.0" y="306.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#5F5E5A" text-anchor="middle">dependsOn, finder's group</text>
  <rect x="40" y="264" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="100.0" y="288.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Draft ticket</text>
  <text x="100.0" y="306.0" font-size="12" fill="#5F5E5A" text-anchor="middle">incomplete</text>
  <rect x="40" y="378" width="176" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="128.0" y="402.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Waits to build</text>
  <text x="128.0" y="420.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#5F5E5A" text-anchor="middle">pending</text>
  <rect x="464" y="378" width="176" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="552.0" y="402.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User decides</text>
  <text x="552.0" y="420.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#854F0B" text-anchor="middle">ready-for-review</text>
  <rect x="40" y="480" width="176" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="128.0" y="504.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Builds</text>
  <text x="128.0" y="522.0" font-size="12" fill="#3B6D11" text-anchor="middle">against the finder's code</text>
  <rect x="464" y="480" width="176" height="56" rx="8" fill="#FCEBEB" stroke="#F4CFCF"/>
  <text x="552.0" y="504.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Finder abandoned</text>
  <text x="552.0" y="522.0" font-size="12" fill="#A32D2D" text-anchor="middle">the dependency is dropped</text>
  <path d="M308,144 L308,173" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M308,232 L308,261" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,292 L163,292" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M268,320 L268,348 L128,348 L128,375" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="366" font-size="11" fill="#73726c" text-anchor="start">review switch off</text>
  <path d="M348,320 L348,348 L552,348 L552,375" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="542" y="366" font-size="11" fill="#73726c" text-anchor="end">review switch on</text>
  <path d="M464,406 L219,406" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="398" font-size="11" fill="#73726c" text-anchor="middle">User readies</text>
  <path d="M128,434 L128,477" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="452" font-size="11" fill="#73726c" text-anchor="start">each finder reviewed</text>
  <text x="138" y="466" font-size="11" fill="#73726c" text-anchor="start">or delivered</text>
  <path d="M552,480 L552,437" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="542" y="452" font-size="11" fill="#73726c" text-anchor="end">an unstarted finding</text>
  <text x="542" y="466" font-size="11" fill="#73726c" text-anchor="end">moves here</text>
  <text x="40" y="562" font-size="11" fill="#73726c">A finding already started keeps going; it only stops waiting on the abandoned finder.</text>
</svg>
