<svg xmlns="http://www.w3.org/2000/svg" width="680" height="378" viewBox="0 0 680 378" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One intake spans jobs, and each decision offers only what is new</title>
  <desc>One intake across three runs. J4 files #101 and #102 and closes, and ready-drafts lists both. A job message reopens the same job J4 on a new Watcher instance and records offeredTicketIds #101 and #102. J4 files #103, goes over the crash bound and ends replaced. J6, whose parentJobId is J4, files #104 and closes, and ready-drafts lists only #103 and #104.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="376" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One intake spans jobs, and each decision offers only what is new</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs left to right. Each ready-drafts reads the whole chain of jobs.</text>
  <rect x="40" y="92" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="123.0" y="116.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">J4, launched</text>
  <text x="123.0" y="134.0" font-size="12" fill="#993C1D" text-anchor="middle">files, closes</text>
  <rect x="256" y="92" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="339.0" y="116.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">J4, reopened</text>
  <text x="339.0" y="134.0" font-size="12" fill="#993C1D" text-anchor="middle">files, ends replaced</text>
  <rect x="472" y="92" width="166" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="555.0" y="116.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">J6, parent J4</text>
  <text x="555.0" y="134.0" font-size="12" fill="#993C1D" text-anchor="middle">files, closes</text>
  <path d="M206,120 L253,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="231" y="94" font-size="11" fill="#73726c" text-anchor="middle">job</text>
  <text x="231" y="107" font-size="11" fill="#73726c" text-anchor="middle">message</text>
  <path d="M422,120 L469,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="447" y="94" font-size="11" fill="#73726c" text-anchor="middle">past the</text>
  <text x="447" y="107" font-size="11" fill="#73726c" text-anchor="middle">bound</text>
  <rect x="40" y="184" width="166" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="123.0" y="211.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">#101 #102</text>
  <rect x="256" y="184" width="166" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="339.0" y="211.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">#103</text>
  <rect x="472" y="184" width="166" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="555.0" y="211.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">#104</text>
  <path d="M123,148 L123,181" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M339,148 L339,181" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M555,148 L555,181" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="133" y="170" font-size="11" fill="#73726c" text-anchor="start">draft tickets</text>
  <rect x="40" y="284" width="166" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="123.0" y="308.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#633806" text-anchor="middle">ready-drafts</text>
  <text x="123.0" y="326.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#854F0B" text-anchor="middle">#101 #102</text>
  <rect x="362" y="284" width="276" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="500.0" y="308.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#633806" text-anchor="middle">ready-drafts</text>
  <text x="500.0" y="326.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#854F0B" text-anchor="middle">#103 #104</text>
  <rect x="226" y="284" width="116" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="284.0" y="308.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">offered</text>
  <text x="284.0" y="326.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#5F5E5A" text-anchor="middle">#101 #102</text>
  <path d="M123,228 L123,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M390,228 L390,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M555,228 L555,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M231,120 L231,281" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="239" y="256" font-size="11" fill="#73726c" text-anchor="start">records</text>
  <path d="M342,312 L359,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
</svg>
