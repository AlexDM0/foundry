<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A crashed intake climbs from resume to refresh</title>
  <desc>An interrupted product owner resumes by session id once any open question is answered, and each crash counts one. If the vendor refuses the resume, the job ends replaced with cause resume-failed, nothing is submitted and the draft tickets stay in the Drafts lane. Another crash past JOB_RESUMES_BEFORE_FRESH ends the resuming. With a question open the job waits in awaiting-answer and refreshes once answered; with none, a fresh job naming it as parentJobId takes the intake over.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="538" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A crashed intake climbs from resume to refresh</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Only a refused resume ends it.</text>
  <rect x="130" y="88" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="250.0" y="112.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Interrupted</text>
  <text x="250.0" y="130.0" font-size="12" fill="#5F5E5A" text-anchor="middle">job state, any cause</text>
  <rect x="130" y="184" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="250.0" y="208.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Resume by session id</text>
  <text x="250.0" y="226.0" font-size="12" fill="#185FA5" text-anchor="middle">same conversation goes on</text>
  <rect x="440" y="184" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="540.0" y="208.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Vendor refuses</text>
  <text x="540.0" y="226.0" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#A32D2D" text-anchor="middle">replaced, resume-failed</text>
  <rect x="440" y="272" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540.0" y="296.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Intake ends</text>
  <text x="540.0" y="314.0" font-size="12" fill="#5F5E5A" text-anchor="middle">nothing is submitted</text>
  <rect x="130" y="368" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="250.0" y="392.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Question open?</text>
  <text x="250.0" y="410.0" font-size="12" fill="#185FA5" text-anchor="middle">never resumed again</text>
  <rect x="440" y="368" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="540.0" y="392.0" font-size="12" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#633806" text-anchor="middle">awaiting-answer</text>
  <text x="540.0" y="410.0" font-size="12" fill="#854F0B" text-anchor="middle">no session, waits for User</text>
  <rect x="130" y="464" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="250.0" y="488.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Refresh the intake</text>
  <text x="250.0" y="506.0" font-size="12" fill="#185FA5" text-anchor="middle">fresh job names its parentJobId</text>
  <path d="M250,144 L250,181" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="166" font-size="11" fill="#73726c" text-anchor="start">once any open question is answered</text>
  <path d="M130,212 L100,212 L100,116 L127,116" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="94" y="160" font-size="11" fill="#73726c" text-anchor="end">a crash</text>
  <text x="94" y="174" font-size="11" fill="#73726c" text-anchor="end">counts one</text>
  <path d="M370,212 L437,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="403" y="204" font-size="11" fill="#73726c" text-anchor="middle">refused</text>
  <path d="M540,240 L540,269" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="540" y="346" font-size="11" fill="#73726c" text-anchor="middle">draft tickets stay in the Drafts lane</text>
  <path d="M250,240 L250,365" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="296" font-size="11" fill="#73726c" text-anchor="start">another crash past</text>
  <text x="260" y="310" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#73726c" text-anchor="start">JOB_RESUMES_BEFORE_FRESH</text>
  <path d="M370,396 L437,396" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="403" y="388" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M250,424 L250,461" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="446" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <path d="M540,424 L540,492 L373,492" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="455" y="486" font-size="11" fill="#73726c" text-anchor="middle">once answered</text>
</svg>
