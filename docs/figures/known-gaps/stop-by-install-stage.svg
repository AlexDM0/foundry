<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Terminal and Bridge Stop come back at different stages</title>
  <desc>A grid of two Stop surfaces against three stages of an install change. Before update, a terminal job stop is refused and the Bridge's Stop gets 423. After update, if the Baton pass failed or was not taken, the terminal works and the Bridge still gets 423. After a Baton pass both work.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="288" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Terminal and Bridge Stop come back at different stages</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each cell is what a Stop gets at that stage of an install change</text>
  <text x="226.0" y="106" font-size="12" fill="#3d3d3a" text-anchor="middle">Before <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">update</tspan></text>
  <text x="392.0" y="98" font-size="12" fill="#3d3d3a" text-anchor="middle">After <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">update</tspan>,</text>
  <text x="392.0" y="114" font-size="12" fill="#3d3d3a" text-anchor="middle">Baton pass failed</text>
  <text x="558.0" y="98" font-size="12" fill="#3d3d3a" text-anchor="middle">After a</text>
  <text x="558.0" y="114" font-size="12" fill="#3d3d3a" text-anchor="middle">Baton pass</text>
  <text x="40" y="160" font-size="13" fill="#3d3d3a">Terminal</text>
  <text x="40" y="178" font-size="12" fill="#73726c"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">job stop &lt;J&gt;</tspan></text>
  <rect x="146" y="126" width="160" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="226.0" y="153.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused</text>
  <text x="226.0" y="171.0" font-size="12" fill="#A32D2D" text-anchor="middle">install version differs</text>
  <rect x="312" y="126" width="160" height="64" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="392.0" y="163.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Works</text>
  <rect x="478" y="126" width="160" height="64" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="558.0" y="163.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Works</text>
  <text x="40" y="236" font-size="13" fill="#3d3d3a">Bridge</text>
  <text x="40" y="254" font-size="12" fill="#73726c">Stop button</text>
  <rect x="146" y="202" width="160" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="226.0" y="229.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">423</text>
  <text x="226.0" y="247.0" font-size="12" fill="#A32D2D" text-anchor="middle">a click raises the banner</text>
  <rect x="312" y="202" width="160" height="64" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="392.0" y="229.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">423</text>
  <text x="392.0" y="247.0" font-size="12" fill="#A32D2D" text-anchor="middle">a click raises the banner</text>
  <rect x="478" y="202" width="160" height="64" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="558.0" y="239.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Works</text>
</svg>
