<svg xmlns="http://www.w3.org/2000/svg" width="680" height="382" viewBox="0 0 680 382" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One log line's entries share a cursor, so following keeps only the first</title>
  <desc>One log line with cursor 4.17 maps to an assistant-turn and two tool-call entries, all stamped 4.17. In a history batch all three get through the filter together and are kept, which gives duplicate React keys. In message delivery they arrive one at a time, so receivedCursors keeps the first and drops the other two.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="380" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One log line's entries share a cursor, so following keeps only the first</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The client drops a cursor it has received</text>
  <rect x="40" y="190" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="92.0" y="214.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Log line</text>
  <text x="92.0" y="232.0" font-size="12" fill="#5F5E5A" text-anchor="middle">cursor <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">4.17</tspan></text>
  <rect x="190" y="148" width="132" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="256.0" y="173.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">assistant-turn</tspan></text>
  <path d="M144,218 L168,218 L168,168 L188,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="196" width="132" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="256.0" y="221.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">tool-call</tspan></text>
  <path d="M144,218 L168,218 L168,216 L188,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="190" y="244" width="132" height="40" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="256.0" y="269.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">tool-call</tspan></text>
  <path d="M144,218 L168,218 L168,264 L188,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="256" y="136" font-size="11" fill="#73726c" text-anchor="middle">each stamped <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">4.17</tspan></text>
  <text x="392" y="100" font-size="12" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">history</tspan> batch</text>
  <text x="392" y="250" font-size="12" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">message</tspan>, one at a time</text>
  <rect x="392" y="108" width="132" height="30" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="458.0" y="128.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">assistant-turn</tspan></text>
  <rect x="392" y="258" width="132" height="30" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="458.0" y="278.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">assistant-turn</tspan></text>
  <rect x="392" y="144" width="132" height="30" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="458.0" y="164.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">tool-call</tspan></text>
  <rect x="392" y="294" width="132" height="30" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
