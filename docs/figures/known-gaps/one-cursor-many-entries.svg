  <path d="M402,309.0 L514,309.0" stroke="#A32D2D" stroke-width="1.6"/>
  <rect x="392" y="180" width="132" height="30" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="458.0" y="200.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">tool-call</tspan></text>
  <rect x="392" y="330" width="132" height="30" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="458.0" y="350.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">tool-call</tspan></text>
  <path d="M402,345.0 L514,345.0" stroke="#A32D2D" stroke-width="1.6"/>
  <rect x="388" y="104" width="140" height="110" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <rect x="388" y="254" width="140" height="110" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <path d="M322,168 L340,168" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M322,216 L340,216" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M322,264 L340,264" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M340,159 L340,309" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M340,159 L386,159" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,309 L386,309" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="534" y="127" font-size="11" fill="#3B6D11">All three kept</text>
  <text x="534" y="163" font-size="11" fill="#73726c">Keys repeat in</text>
  <text x="534" y="177" font-size="11" fill="#73726c">React lists</text>
  <text x="534" y="277" font-size="11" fill="#3B6D11">First kept</text>
  <text x="534" y="331" font-size="11" fill="#A32D2D">Dropped by</text>
  <text x="534" y="345" font-size="11" fill="#A32D2D"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">receivedCursors</tspan></text>
</svg>
