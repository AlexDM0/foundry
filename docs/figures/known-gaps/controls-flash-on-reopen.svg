<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every reopen enables the controls until that attempt errors</title>
  <desc>A timeline of the stream state and the controls. While the state is down the controls are disabled. REOPEN_DELAY_MILLISECONDS later the client reopens the stream and the state goes connecting, which BridgeApp does not count as down, so the controls are enabled and a click fails. The attempt's error event sets down again, and the cycle repeats.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="278" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every reopen enables the controls until that attempt errors</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Once the browser gives up on the stream, this cycle repeats</text>
  <text x="40" y="98" font-size="11" fill="#73726c">Stream state</text>
  <text x="40" y="172" font-size="11" fill="#73726c">Controls</text>
  <rect x="40" y="104" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="133.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">down</tspan></text>
  <rect x="40" y="178" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115.0" y="207.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Disabled</text>
  <rect x="194" y="104" width="90" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="239.0" y="133.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">connecting</tspan></text>
  <rect x="194" y="178" width="90" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="239.0" y="197.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Enabled</text>
  <text x="239.0" y="215.0" font-size="12" fill="#A32D2D" text-anchor="middle">a click fails</text>
  <rect x="288" y="104" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="363.0" y="133.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">down</tspan></text>
  <rect x="288" y="178" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="363.0" y="207.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Disabled</text>
  <rect x="442" y="104" width="90" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="487.0" y="133.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">connecting</tspan></text>
  <rect x="442" y="178" width="90" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="487.0" y="197.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Enabled</text>
  <text x="487.0" y="215.0" font-size="12" fill="#A32D2D" text-anchor="middle">a click fails</text>
  <rect x="536" y="104" width="104" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="588.0" y="133.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">down</tspan></text>
  <rect x="536" y="178" width="104" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="588.0" y="207.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Disabled</text>
  <path d="M40,244 L638,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="262" font-size="11" fill="#73726c">time</text>
  <text x="363" y="262" font-size="12" fill="#73726c" text-anchor="middle">reopens after <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">REOPEN_DELAY_MILLISECONDS</tspan></text>
</svg>
