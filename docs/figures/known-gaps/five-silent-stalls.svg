<svg xmlns="http://www.w3.org/2000/svg" width="680" height="562" viewBox="0 0 680 562" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The symptom says which of the five stalls it is</title>
  <desc>A ladder from one root, nothing is moving. If an Airlock stays in phase gating and agents print queued, a merged-tree gate is stalling the Pass: kill the gate process. If the ticket holds parked and its decision is closed, run ticket unhold. If the ticket is in-review with a job awaiting-answer and its waiver is answered, the answer did nothing: the route depends on whether User granted or refused. If a job is stuck launching, or a quiet-job incident is open on a job with an empty transcript, its session never started: run oversee restart, and job stop if it stays stuck. If open incidents stay undelivered and resetsAt is past, delete the usage marker.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="560" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The symptom says which of the five stalls it is</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Read down until one holds; each leaf gives the way out</text>
  <rect x="40" y="88" width="290" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="185.0" y="115.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Nothing is moving</text>
  <path d="M185,132 L185,158" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="160" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="183.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Airlock phase stays <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">gating</tspan></text>
  <text x="185.0" y="201.0" font-size="12" fill="#5F5E5A" text-anchor="middle">in <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">merges</tspan>; agents print <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">queued</tspan></text>
  <path d="M330,188 L418,188" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="374" y="182" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="420" y="160" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="183.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Merged-tree gate stall</text>
  <text x="530.0" y="201.0" font-size="12" fill="#A32D2D" text-anchor="middle">kill the gate process</text>
  <path d="M185,216 L185,242" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="194" y="233" font-size="11" fill="#73726c">no</text>
  <rect x="40" y="244" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="267.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket holds <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">parked:&lt;cause&gt;</tspan></text>
  <text x="185.0" y="285.0" font-size="12" fill="#5F5E5A" text-anchor="middle">its decision is closed</text>
  <path d="M330,272 L418,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="374" y="266" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="420" y="244" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="267.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Parked answer ignored</text>
  <text x="530.0" y="285.0" font-size="12" fill="#A32D2D" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">ticket unhold &lt;id&gt;</tspan></text>
  <path d="M185,300 L185,326" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="194" y="317" font-size="11" fill="#73726c">no</text>
  <rect x="40" y="328" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="351.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">in-review</tspan>, job <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">awaiting-answer</tspan></text>
  <text x="185.0" y="369.0" font-size="12" fill="#5F5E5A" text-anchor="middle">its waiver is answered</text>
  <path d="M330,356 L418,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="374" y="350" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="420" y="328" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="351.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Waiver answer ignored</text>
  <text x="530.0" y="369.0" font-size="12" fill="#A32D2D" text-anchor="middle">grant or refuse: see its entry</text>
  <path d="M185,384 L185,410" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="194" y="401" font-size="11" fill="#73726c">no</text>
  <rect x="40" y="412" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="435.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job stuck <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">launching</tspan></text>
  <text x="185.0" y="453.0" font-size="12" fill="#5F5E5A" text-anchor="middle">or <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">quiet-job</tspan>, empty transcript</text>
  <path d="M330,440 L418,440" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="374" y="434" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="420" y="412" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="435.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Session never started</text>
  <text x="530.0" y="453.0" font-size="12" fill="#A32D2D" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">oversee restart</tspan>, then <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">job stop</tspan></text>
  <path d="M185,468 L185,494" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="194" y="485" font-size="11" fill="#73726c">no</text>
  <rect x="40" y="496" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185.0" y="519.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Open incidents stay undelivered</text>
  <text x="185.0" y="537.0" font-size="12" fill="#5F5E5A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">resetsAt</tspan> is past</text>
  <path d="M330,524 L418,524" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="374" y="518" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="420" y="496" width="220" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="530.0" y="519.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Stale usage marker</text>
  <text x="530.0" y="537.0" font-size="12" fill="#A32D2D" text-anchor="middle">delete <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">usage-limit.json</tspan></text>
</svg>
