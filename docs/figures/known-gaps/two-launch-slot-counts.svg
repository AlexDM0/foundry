<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>status and the Playbook count different sets</title>
  <desc>Two overlapping regions. agentsInFlightOf, which status and the Next line use, counts in-progress rows. freeSlotsOf, which the Playbook uses, counts live build and review jobs. A running build or review is in both. An in-progress row with no job, from task add --start, is counted by status alone. A build job still launching, whose row has not moved, is counted by the Playbook alone.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="278" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">status and the Playbook count different sets</text>
  <text x="40" y="68" font-size="13" fill="#73726c">So the Next line can be wrong in either direction</text>
  <rect x="40" y="110" width="370" height="150" rx="16" fill="#F1EFE8" fill-opacity="0.8" stroke="#E1DDD0"/>
  <rect x="270" y="110" width="370" height="150" rx="16" fill="#E6F1FB" fill-opacity="0.65" stroke="#CFE2F6"/>
  <text x="40" y="100" font-size="12" fill="#444441"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">agentsInFlightOf</tspan>: in-progress rows</text>
  <text x="640" y="100" font-size="12" fill="#0C447C" text-anchor="end"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">freeSlotsOf</tspan>: live build and review jobs</text>
  <text x="155" y="180" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Row with no job</text>
  <text x="155" y="199" font-size="12" fill="#5F5E5A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">task add --start</tspan></text>
  <text x="340" y="180" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Running job</text>
  <text x="340" y="199" font-size="12" fill="#185FA5" text-anchor="middle">build or review</text>
  <text x="525" y="180" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Job, row not started</text>
  <text x="525" y="199" font-size="12" fill="#185FA5" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">launching</tspan> build</text>
</svg>
