<svg xmlns="http://www.w3.org/2000/svg" width="680" height="366" viewBox="0 0 680 366" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One merged-tree gate leaves the board with nobody driving</title>
  <desc>A Pass reads, takes its main lock hold, runs its effects, then awaits airlocks.sweep, which awaits the prepare steps, the wait for a gate slot and the gate, with no timeout. While that runs nobody drives. An API write lands in the store during the span and goes no further. Hatch requests, Watcher events and answers wait at the right edge of the span, and all of them reach one later Pass.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="364" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One merged-tree gate leaves the board with nobody driving</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One Pass, time left to right; the shaded span has no timeout</text>
  <rect x="280" y="84" width="276" height="264" rx="8" fill="#EEECE4"/>
  <text x="418" y="100" font-size="11" fill="#5F5E5A" text-anchor="middle">nobody drives; no timeout</text>
  <rect x="40" y="120" width="64" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="72.0" y="153.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Read</text>
  <rect x="120" y="120" width="64" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="152.0" y="153.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Hold</text>
  <rect x="200" y="120" width="64" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="232.0" y="153.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Effects</text>
  <rect x="290" y="110" width="256" height="76" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="418.0" y="143.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">airlocks.sweep</tspan></text>
  <text x="418.0" y="161.0" font-size="12" fill="#185FA5" text-anchor="middle">awaits prepare, gate slot and gate</text>
  <rect x="576" y="120" width="64" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="608.0" y="143.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass</text>
  <text x="608.0" y="161.0" font-size="12" fill="#185FA5" text-anchor="middle">one later</text>
  <path d="M104,148 L118,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M184,148 L198,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M264,148 L288,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M546,148 L574,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="292" y="216" width="112" height="46" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="348.0" y="244.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">API write</text>
  <rect x="292" y="292" width="112" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="348.0" y="310.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Store</text>
  <text x="348.0" y="328.0" font-size="12" fill="#5F5E5A" text-anchor="middle">written, unread</text>
  <path d="M348,262 L348,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="357" y="281" font-size="11" fill="#73726c">lands here</text>
  <text x="424" y="212" font-size="11" fill="#73726c">Waiting at the end</text>
  <rect x="420" y="218" width="128" height="118" rx="10" fill="none" stroke="#bfbdb0" stroke-width="1.2"/>
  <rect x="426" y="224" width="116" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="484.0" y="245.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Hatch requests</text>
  <rect x="426" y="260" width="116" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="484.0" y="281.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Watcher events</text>
  <rect x="426" y="296" width="116" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="484.0" y="317.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Answers</text>
  <path d="M548,277 L608,277 L608,178" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="566" y="292" font-size="11" fill="#73726c">all at once</text>
</svg>
