<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The ruling picks the route, and only a grant edits the ticket</title>
  <desc>Two lanes from User's ruling on a waiver. Grant: ticket edit --force writes each A&lt;n&gt;. Waived line, User answers, runs job fresh, and a fresh review runs. Refuse: User answers first, then runs job stop, moves the ticket to in-progress and unholds it, and a build launches.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="288" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The ruling picks the route, and only a grant edits the ticket</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Nothing acts on the answer, so User does these steps</text>
  <rect x="40" y="146" width="96" height="76" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="88.0" y="179.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
  <text x="88.0" y="197.0" font-size="12" fill="#854F0B" text-anchor="middle">rules</text>
  <text x="160" y="100" font-size="12" fill="#3d3d3a">Grant</text>
  <text x="160" y="216" font-size="12" fill="#3d3d3a">Refuse</text>
  <rect x="160" y="108" width="146" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="233.0" y="131.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">ticket edit --force</tspan></text>
  <text x="233.0" y="149.0" font-size="12" fill="#854F0B" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">A&lt;n&gt;. Waived: ...</tspan></text>
  <rect x="328" y="108" width="70" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="363.0" y="141.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Answer</text>
  <rect x="420" y="108" width="104" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="472.0" y="141.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">job fresh &lt;J&gt;</tspan></text>
  <rect x="546" y="108" width="94" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="593.0" y="141.0" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">Fresh review</text>
  <path d="M306,136 L326,136" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M398,136 L418,136" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M524,136 L544,136" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="224" width="70" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="195.0" y="257.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Answer</text>
  <rect x="253" y="224" width="96" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="301.0" y="257.0" font-size="13" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">job stop &lt;J&gt;</tspan></text>
  <rect x="372" y="224" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="447.0" y="247.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">To <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">in-progress</tspan></text>
  <text x="447.0" y="265.0" font-size="12" fill="#854F0B" text-anchor="middle">then <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">ticket unhold</tspan></text>
  <rect x="546" y="224" width="94" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="593.0" y="247.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Build</text>
  <text x="593.0" y="265.0" font-size="12" fill="#185FA5" text-anchor="middle">launches</text>
  <path d="M230,252 L251,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M349,252 L370,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M522,252 L544,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M136,170 L148,170 L148,136 L158,136" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M136,198 L148,198 L148,252 L158,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
