<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The normal landing bypasses the findings hook</title>
  <desc>Three by-hand routes, ticket deliver --by-hand, ticket status delivered and an abandon, go through Board.moveTicket to afterTicketSettled, which opens the findings-delivered incident. The normal route, an Airlock landing, goes through landOnTheBoard to Board.releaseTickets, which moves the tickets itself and reaches no hook, so no incident opens and the findings sit unseen.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The normal landing bypasses the findings hook</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Only a move through <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">Board.moveTicket</tspan> reaches <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">afterTicketSettled</tspan></text>
  <text x="40" y="96" font-size="11" fill="#73726c">By hand, or abandoned</text>
  <rect x="40" y="104" width="140" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="110.0" y="125.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">deliver --by-hand</tspan></text>
  <rect x="40" y="144" width="140" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="110.0" y="165.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">status delivered</tspan></text>
  <rect x="40" y="184" width="140" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="110.0" y="205.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">abandon</text>
  <rect x="208" y="132" width="126" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="271.0" y="165.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">Board.moveTicket</tspan></text>
  <rect x="360" y="132" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="430.0" y="165.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">afterTicketSettled</tspan></text>
  <rect x="526" y="132" width="114" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="583.0" y="165.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Incident opens</text>
  <path d="M180,120 L194,120 L194,160" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M180,200 L194,200 L194,160" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M180,160 L206,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M334,160 L358,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M500,160 L524,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M40,226 L640,226" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="246" font-size="11" fill="#73726c">The normal route, on the main line</text>
  <rect x="40" y="254" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="110.0" y="287.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock landing</text>
  <rect x="208" y="254" width="126" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="271.0" y="287.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">landOnTheBoard</tspan></text>
  <rect x="360" y="254" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="430.0" y="287.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Board.releaseTickets</tspan></text>
  <rect x="526" y="254" width="114" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="583.0" y="277.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">No hook</text>
  <text x="583.0" y="295.0" font-size="12" fill="#A32D2D" text-anchor="middle">findings sit unseen</text>
  <path d="M180,282 L206,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M334,282 L358,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M500,282 L524,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
