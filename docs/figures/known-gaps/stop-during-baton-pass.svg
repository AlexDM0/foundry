<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A stop that arrives mid-hand-over is answered but ignored</title>
  <desc>User runs oversee restart, so the old Overseer sets handingOver and a successor starts. User then runs oversee stop: the old Overseer drops it while the API still answers 200, and the CLI polls the Baton generation. In baton-passed the successor drives generation n+1 and the CLI prints Stopped. In taken-back the old Overseer drives generation n+2 and the CLI prints Stopped. Only in kept-driving does the generation stay at n, and the CLI refuses overseer-still-live.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="554" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A stop that arrives mid-hand-over is answered but ignored</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs down; the CLI ends its wait on any change of generation</text>
  <text x="113.0" y="98" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">User CLI</text>
  <text x="285.0" y="98" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Old Overseer</text>
  <text x="445.0" y="98" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Successor</text>
  <text x="585.0" y="98" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Baton file</text>
  <rect x="40" y="110" width="146" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="113.0" y="140.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">oversee restart</tspan></text>
  <rect x="214" y="110" width="142" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="285.0" y="140.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Sets <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">handingOver</tspan></text>
  <rect x="384" y="110" width="122" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="445.0" y="140.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Starts</text>
  <path d="M186,135 L212,135" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M356,135 L382,135" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="176" width="146" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="113.0" y="206.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">oversee stop</tspan></text>
  <rect x="214" y="176" width="142" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="285.0" y="197.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Drops the stop</text>
  <text x="285.0" y="215.0" font-size="12" fill="#A32D2D" text-anchor="middle">still answers 200</text>
  <path d="M186,201 L212,201" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="242" width="146" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="113.0" y="272.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Polls the generation</text>
  <rect x="530" y="242" width="110" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585.0" y="272.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Generation n</text>
  <path d="M530,267 L188,267" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="358" y="261" font-size="11" fill="#73726c">read until it changes</text>
  <path d="M40,312 L640,312" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="334" font-size="12" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">baton-passed</tspan>: the successor serves</text>
  <text x="640" y="334" font-size="11" fill="#A32D2D" text-anchor="end">false: an Overseer still drives</text>
  <rect x="40" y="342" width="146" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="113.0" y="370.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Prints Stopped</text>
  <rect x="384" y="342" width="122" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="445.0" y="370.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Drives</text>
  <rect x="530" y="342" width="110" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585.0" y="361.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Generation n+1</text>
  <text x="585.0" y="379.0" font-size="12" fill="#5F5E5A" text-anchor="middle">moved</text>
  <text x="40" y="408" font-size="12" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">taken-back</tspan>: the successor failed after the release</text>
  <text x="640" y="408" font-size="11" fill="#A32D2D" text-anchor="end">false: an Overseer still drives</text>
  <rect x="40" y="416" width="146" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="113.0" y="444.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Prints Stopped</text>
  <rect x="214" y="416" width="142" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="285.0" y="444.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Drives again</text>
  <rect x="530" y="416" width="110" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585.0" y="435.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Generation n+2</text>
  <text x="585.0" y="453.0" font-size="12" fill="#5F5E5A" text-anchor="middle">moved</text>
  <text x="40" y="482" font-size="12" fill="#3d3d3a"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">kept-driving</tspan>: the successor failed before the release</text>
  <rect x="40" y="490" width="146" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="113.0" y="509.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refuses</text>
  <text x="113.0" y="527.0" font-size="12" fill="#A32D2D" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">overseer-still-live</tspan></text>
  <rect x="214" y="490" width="142" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="285.0" y="518.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Keeps driving</text>
  <rect x="530" y="490" width="110" height="46" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="585.0" y="509.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Generation n</text>
  <text x="585.0" y="527.0" font-size="12" fill="#5F5E5A" text-anchor="middle">unchanged</text>
</svg>
