<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A ticket has a row unless it stays off the chart</title>
  <desc>Three states have no row: draft at any priority, abandoned and never started, and low pending and never started, where never started means started is null, which a reopen clears. ticket ready gives a draft a row; ticket reopen gives an abandoned ticket one unless it is low, which leads to low pending; a raised priority or a start gives a low pending ticket one; ticket link or task add --ticket gives any rowless ticket one. ticket abandon moves a draft ticket to abandoned. task remove takes a row away: a ticket in one of the three states returns to it, and any other ticket waits for its next move or a raised priority, unless that move lands it in the left panel.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="474" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A ticket has a row unless it stays off the chart</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Three rowless states stay off it. An edge is the trigger that moves a ticket.</text>
  <rect x="40" y="84" width="230" height="274" rx="12" fill="#F7F5EE" stroke="#E1DDD0"/>
  <text x="155" y="104" font-size="13" fill="#5F5E5A" text-anchor="middle">No row</text>
  <rect x="56" y="114" width="198" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="155.0" y="134.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">draft</text>
  <text x="155.0" y="153.0" font-size="12" fill="#5F5E5A" text-anchor="middle">any priority</text>
  <rect x="56" y="200" width="198" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="155.0" y="220.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">abandoned</text>
  <text x="155.0" y="239.0" font-size="12" fill="#5F5E5A" text-anchor="middle">never started</text>
  <rect x="56" y="286" width="198" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="155.0" y="306.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">low, pending</text>
  <text x="155.0" y="325.0" font-size="12" fill="#5F5E5A" text-anchor="middle">never started</text>
  <rect x="440" y="114" width="200" height="224" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540.0" y="220.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Has a row</text>
  <text x="540.0" y="239.0" font-size="12" fill="#5F5E5A" text-anchor="middle">every other ticket</text>
  <rect x="440" y="392" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="540.0" y="412.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Rowless until its next move</text>
  <text x="540.0" y="431.0" font-size="12" fill="#5F5E5A" text-anchor="middle">any other ticket</text>
  <path d="M100,166 L100,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="108" y="186" font-size="11" fill="#73726c" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">ticket abandon</text>
  <path d="M100,252 L100,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="108" y="272" font-size="11" fill="#73726c" text-anchor="start">ticket reopen, if low</text>
  <path d="M254,140 L436,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345" y="132" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket ready</text>
  <path d="M254,226 L436,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345" y="218" font-size="11" fill="#73726c" text-anchor="middle">ticket reopen, if not low</text>
  <path d="M254,312 L436,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="345" y="304" font-size="11" fill="#73726c" text-anchor="middle">priority raised, or it starts</text>
  <path d="M440,264 L274,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="355" y="256" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">task remove</text>
  <text x="355" y="278" font-size="11" fill="#73726c" text-anchor="middle">if its state is in this panel</text>
  <path d="M458,338 L458,388" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="368" font-size="11" fill="#73726c" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">task remove</text>
  <path d="M488,392 L488,342" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="496" y="354" font-size="11" fill="#73726c" text-anchor="start">next move or raised</text>
  <text x="496" y="368" font-size="11" fill="#73726c" text-anchor="start">priority, unless it lands</text>
  <text x="496" y="382" font-size="11" fill="#73726c" text-anchor="start">in the left panel</text>
  <text x="40" y="400" font-size="12" fill="#5F5E5A" text-anchor="start">ticketStaysOffTheChart decides the left panel.</text>
  <text x="40" y="418" font-size="12" fill="#5F5E5A" text-anchor="start">Never started means started is null; a reopen clears it.</text>
  <text x="40" y="436" font-size="12" fill="#5F5E5A" text-anchor="start">ticket link or task add --ticket gives any rowless</text>
  <text x="40" y="454" font-size="12" fill="#5F5E5A" text-anchor="start">ticket a row. A row once given is kept.</text>
</svg>
