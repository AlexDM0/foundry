<svg xmlns="http://www.w3.org/2000/svg" width="680" height="284" viewBox="0 0 680 284" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One lock hold commits the board files and the log together</title>
  <desc>A shaded band marks one lock hold. Inside it sit the board files, which are progress.json, the tickets, epics, filing drafts and pipeline.json, and the log, log.jsonl. Job folders sit outside the band, so they are not part of that transaction.</desc>
  <rect x="1" y="1" width="678" height="282" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">One lock hold commits the board files and the log together</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Three stores, one transaction. Job folders stay outside it.</text>

  <rect x="40" y="88" width="388" height="176" rx="12" fill="#F1EDE0" stroke="#E1DDD0"/>
  <text x="56" y="110" font-size="12" fill="#5F5E5A">one lock hold, <tspan font-family="ui-monospace,Menlo,Consolas,monospace">writeTracker</tspan></text>

  <rect x="56" y="122" width="196" height="128" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="154" y="144" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board files</text>
  <g font-size="12" fill="#5F5E5A" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="72" y="166">progress.json</text>
    <text x="72" y="183">tickets/</text>
    <text x="72" y="200">epics/</text>
    <text x="72" y="217">filing-cabinet/</text>
    <text x="72" y="234">pipeline.json</text>
  </g>

  <rect x="268" y="122" width="144" height="128" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="144" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Log</text>
  <text x="340" y="166" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">log.jsonl</text>
  <text x="340" y="184" font-size="12" fill="#5F5E5A" text-anchor="middle">every event</text>

  <rect x="456" y="122" width="184" height="128" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="548" y="144" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job folders</text>
  <text x="548" y="166" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">jobs/&lt;J&gt;/</text>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="548" y="184">launch inputs</text>
    <text x="548" y="201">Watcher records, event logs</text>
    <text x="548" y="218">gate verdicts</text>
  </g>
</svg>
