<svg xmlns="http://www.w3.org/2000/svg" width="680" height="328" viewBox="0 0 680 328" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A ticket move reaches both records, a task move is refused</title>
  <desc>A ticket move goes through applyTicketMove and changes the ticket file and its own row in one step. A plain task move on an owned row is refused ticket-owned-row. A pause, a resume or a forced task move reaches the row alone.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="326" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A ticket move reaches both records, a task move is refused</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Only a pause, a resume or --force moves an owned row alone.</text>
  <rect x="40" y="100" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="122.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">A ticket move</text>
  <text x="135.0" y="141.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">applyTicketMove</text>
  <rect x="40" y="176" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="198.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">A plain task move</text>
  <text x="135.0" y="217.0" font-size="12" fill="#185FA5" text-anchor="middle">on an owned row</text>
  <rect x="40" y="252" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="135.0" y="274.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pause, resume, --force</text>
  <text x="135.0" y="293.0" font-size="12" fill="#185FA5" text-anchor="middle">a task move on an owned row</text>
  <rect x="258" y="176" width="130" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="323.0" y="198.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused</text>
  <text x="323.0" y="217.0" font-size="12" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket-owned-row</text>
  <rect x="450" y="100" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="545.0" y="122.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Ticket file</text>
  <text x="545.0" y="141.0" font-size="12" fill="#5F5E5A" text-anchor="middle">status</text>
  <rect x="450" y="252" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="545.0" y="274.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Own row</text>
  <text x="545.0" y="293.0" font-size="12" fill="#5F5E5A" text-anchor="middle">status</text>
  <path d="M230,128 L446,128" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M410,128 L410,266 L446,266" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M230,204 L254,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M230,290 L446,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="320" y="120" font-size="11" fill="#73726c" text-anchor="middle">both, in one step</text>
  <text x="320" y="282" font-size="11" fill="#73726c" text-anchor="middle">the row alone</text>
  <text x="545" y="190" font-size="12" fill="#5F5E5A" text-anchor="middle">Moved together, except</text>
  <text x="545" y="208" font-size="12" fill="#5F5E5A" text-anchor="middle">where the row moves alone</text>
</svg>
