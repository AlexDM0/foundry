  <text x="438" y="339" font-size="14" font-weight="500" fill="#633806">Other lines: anyone</text>
  <text x="438" y="358" font-size="12" fill="#854F0B">Unknown keys, comments and</text>
  <text x="438" y="374" font-size="12" fill="#854F0B">blanks kept below known keys</text>
  <path d="M404,402 L404,418" stroke="#185FA5" stroke-width="2.4" fill="none"/>
  <path d="M404,412 L424,412" stroke="#185FA5" stroke-width="1.2" fill="none"/>
  <rect x="424" y="398" width="216" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="438" y="419" font-size="14" font-weight="500" fill="#0C447C">Heading: code</text>
  <text x="438" y="438" font-size="12" fill="#185FA5">A retitle rewrites it, if unchanged</text>
  <path d="M404,442 L404,540" stroke="#993C1D" stroke-width="2.4" fill="none"/>
  <path d="M404,490 L424,490" stroke="#993C1D" stroke-width="1.2" fill="none"/>
  <rect x="424" y="456" width="216" height="72" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="438" y="477" font-size="14" font-weight="500" fill="#712B13">Filed sections: the filer</text>
  <text x="438" y="496" font-size="12" fill="#993C1D">A person or an agent. Code</text>
  <text x="438" y="512" font-size="12" fill="#993C1D">reads Acceptance and Brief</text>
  <path d="M404,544 L404,560" stroke="#185FA5" stroke-width="2.4" fill="none"/>
  <path d="M404,552 L424,552" stroke="#185FA5" stroke-width="1.2" fill="none"/>
  <rect x="424" y="536" width="216" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="438" y="557" font-size="14" font-weight="500" fill="#0C447C">A2 Waived line: code</text>
  <text x="438" y="576" font-size="12" fill="#185FA5">From an approved waiver</text>
  <path d="M404,576 L404,612" stroke="#993C1D" stroke-width="2.4" fill="none"/>
  <path d="M404,604 L424,604" stroke="#993C1D" stroke-width="1.2" fill="none"/>
  <rect x="424" y="594" width="216" height="34" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="438" y="616" font-size="14" font-weight="500" fill="#712B13">Brief: the filer</text>
  <path d="M404,624 L404,764" stroke="#185FA5" stroke-width="2.4" fill="none"/>
  <path d="M404,690 L424,690" stroke="#185FA5" stroke-width="1.2" fill="none"/>
  <rect x="424" y="654" width="216" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="438" y="675" font-size="14" font-weight="500" fill="#0C447C">Result sections: code</text>
  <text x="438" y="694" font-size="12" fill="#185FA5">Handoff replaced, Review and</text>
  <text x="438" y="710" font-size="12" fill="#185FA5">Questions added at the end</text>
</svg>
