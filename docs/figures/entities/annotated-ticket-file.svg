<svg xmlns="http://www.w3.org/2000/svg" width="680" height="796" viewBox="0 0 680 796" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A ticket file has three authors, kept apart by every rewrite</title>
  <desc>A synthetic ticket file with its parts marked by author. Code owns the known frontmatter keys, the generated heading, a waived Acceptance line and the Handoff, Review and Questions sections. Unknown keys and comments are kept below the known keys. The Report, Wanted, Acceptance and Brief sections belong to whoever files the ticket, a person or an agent. A hand edit to any of this survives a move.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="794" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A ticket file has three authors, kept apart by every rewrite</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Every line code does not own is written back, so a hand edit survives.</text>
  <rect x="40" y="86" width="350" height="690" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#444441">
    <text x="54" y="108" xml:space="preserve">---</text>
    <text x="54" y="126" xml:space="preserve">id: "003"</text>
    <text x="54" y="144" xml:space="preserve">title: "Double-click a role to edit it"</text>
    <text x="54" y="162" xml:space="preserve">type: "ticket"</text>
    <text x="54" y="180" xml:space="preserve">status: "in-review"</text>
    <text x="54" y="198" xml:space="preserve">filed: "2026-09-18T20:11:03+02:00"</text>
    <text x="54" y="216" xml:space="preserve">updated: "2026-09-19T10:02:41+02:00"</text>
    <text x="54" y="234" xml:space="preserve">started: "2026-09-19T09:12:00+02:00"</text>
    <text x="54" y="252" xml:space="preserve">finished: "2026-09-19T10:02:41+02:00"</text>
    <text x="54" y="270" xml:space="preserve">delivered: null</text>
    <text x="54" y="288" xml:space="preserve">abandonedAt: null</text>
    <text x="54" y="306" xml:space="preserve">group: "role-editor"</text>
    <text x="54" y="324" xml:space="preserve">claimedBodyHash: "5f1d3c9a0b7e2468"</text>
    <text x="54" y="342" xml:space="preserve">task: 17</text>
    <text x="54" y="360" xml:space="preserve"># see the design notes</text>
    <text x="54" y="378" xml:space="preserve">owner: Alex Example</text>
    <text x="54" y="396" xml:space="preserve">---</text>
    <text x="54" y="414" xml:space="preserve"># 003 — Double-click a role to edit it</text>
    <text x="54" y="452" xml:space="preserve">## Report</text>
    <text x="54" y="470" xml:space="preserve">Editing a role needs a menu.</text>
    <text x="54" y="494" xml:space="preserve">## Wanted</text>
    <text x="54" y="518" xml:space="preserve">## Acceptance</text>
    <text x="54" y="536" xml:space="preserve">A1. Double-click opens the editor.</text>
    <text x="54" y="554" xml:space="preserve">A2. Waived: covered by #002.</text>
    <text x="54" y="586" xml:space="preserve">## Brief</text>
    <text x="54" y="604" xml:space="preserve">Reuse the role table component.</text>
    <text x="54" y="634" xml:space="preserve">## Handoff</text>
    <text x="54" y="652" xml:space="preserve">Touched the role table component.</text>
    <text x="54" y="678" xml:space="preserve">## Review 1</text>
    <text x="54" y="696" xml:space="preserve">- A1 holds — probed in the browser.</text>
    <text x="54" y="722" xml:space="preserve">## Questions</text>
    <text x="54" y="740" xml:space="preserve">- Which export format?</text>
    <text x="54" y="758" xml:space="preserve">  Answer (E2): CSV</text>
  </g>
  <path d="M404,98 L404,346" stroke="#185FA5" stroke-width="2.4" fill="none"/>
  <path d="M404,222 L424,222" stroke="#185FA5" stroke-width="1.2" fill="none"/>
  <rect x="424" y="170" width="216" height="104" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="438" y="191" font-size="14" font-weight="500" fill="#0C447C">Known keys: code</text>
  <text x="438" y="210" font-size="12" fill="#185FA5">Rewritten in a fixed order when</text>
  <text x="438" y="226" font-size="12" fill="#185FA5">a known key changes. A body</text>
  <text x="438" y="242" font-size="12" fill="#185FA5">edit or rename keeps the block</text>
  <text x="438" y="258" font-size="12" fill="#185FA5">as stored.</text>
  <path d="M404,350 L404,382" stroke="#854F0B" stroke-width="2.4" fill="none"/>
