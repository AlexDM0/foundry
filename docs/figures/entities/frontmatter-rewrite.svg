<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A known-key change moves other lines below the known keys</title>
  <desc>Three frontmatter blocks. The hand-edited original has an owner key and a comment between known keys. After a body edit the block is byte-identical. After a transition the known keys come first in fixed order, with the owner key and the comment kept below them.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="352" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A known-key change moves other lines below the known keys</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Nothing is lost. A body edit leaves the frontmatter byte-identical.</text>
  <text x="40" y="104" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Hand-edited</text>
  <text x="40" y="122" font-size="12" fill="#5F5E5A" text-anchor="start">known keys and others mixed</text>
  <rect x="40" y="134" width="180" height="176" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="156" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">---</text>
  <text x="52" y="178" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">id: "003"</text>
  <rect x="46" y="186" width="168" height="19" rx="3" fill="#FAEEDA"/>
  <text x="52" y="200" font-size="12" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">owner: Alex Example</text>
  <rect x="46" y="208" width="168" height="19" rx="3" fill="#FAEEDA"/>
  <text x="52" y="222" font-size="12" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve"># see the notes</text>
  <text x="52" y="244" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">status: "pending"</text>
  <text x="52" y="266" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">updated: "09-18…"</text>
  <text x="52" y="288" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">---</text>
