  <rect x="250" y="134" width="180" height="176" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="262" y="156" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">---</text>
