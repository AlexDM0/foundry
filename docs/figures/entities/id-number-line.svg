<svg xmlns="http://www.w3.org/2000/svg" width="680" height="282" viewBox="0 0 680 282" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>An id's place against its counter says closed or unknown</title>
  <desc>A strip of job ids J1 to J7 with nextJobId at 6. J4 is on jobs and is live. J1, J2, J3 and J5 are missing from the board and below the counter, so a use is refused job-finished. J6 and J7 are at or above the counter, were never handed out, and are refused unknown-job. Decisions and incidents follow the same rule; a closed filing draft is unknown-draft.</desc>
  <rect x="1" y="1" width="678" height="280" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">An id's place against its counter says closed or unknown</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Every id below the counter was handed out once, so a missing one is closed.</text>

  <text x="334" y="100" font-size="12" fill="#185FA5" text-anchor="middle">on <tspan font-family="ui-monospace,Menlo,Consolas,monospace">jobs[]</tspan>, live</text>
  <text x="464" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">nextJobId: 6</text>
  <path d="M464,108 L464,172" stroke="#73726c" stroke-width="1.6" fill="none"/>

  <rect x="44" y="116" width="76" height="48" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="82" y="145" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J1</text>
  <rect x="128" y="116" width="76" height="48" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="166" y="145" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J2</text>
  <rect x="212" y="116" width="76" height="48" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="250" y="145" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J3</text>
  <rect x="296" y="116" width="76" height="48" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="334" y="145" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J4</text>
  <rect x="380" y="116" width="76" height="48" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="418" y="145" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J5</text>
  <rect x="472" y="116" width="76" height="48" rx="6" fill="none" stroke="#bfbdb0" stroke-dasharray="5 4"/>
  <text x="510" y="145" font-size="14" font-weight="500" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J6</text>
  <rect x="556" y="116" width="76" height="48" rx="6" fill="none" stroke="#bfbdb0" stroke-dasharray="5 4"/>
  <text x="594" y="145" font-size="14" font-weight="500" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">J7</text>
  <path d="M44,174 L288,174 M380,174 L456,174" stroke="#bfbdb0" stroke-width="1.6" fill="none"/>
  <text x="250" y="192" font-size="12" fill="#A32D2D" text-anchor="middle">missing from the board: closed, refused <tspan font-family="ui-monospace,Menlo,Consolas,monospace">job-finished</tspan></text>
  <path d="M472,174 L632,174" stroke="#bfbdb0" stroke-width="1.6" fill="none"/>
  <text x="552" y="192" font-size="12" fill="#A32D2D" text-anchor="middle">never handed out</text>
  <text x="552" y="208" font-size="12" fill="#A32D2D" text-anchor="middle">refused <tspan font-family="ui-monospace,Menlo,Consolas,monospace">unknown-job</tspan></text>
  <text x="40" y="242" font-size="12" fill="#5F5E5A">Decisions and incidents follow the same rule against their own counters.</text>
  <text x="40" y="260" font-size="12" fill="#5F5E5A">A filing draft does not: a closed <tspan font-family="ui-monospace,Menlo,Consolas,monospace">D&lt;n&gt;</tspan> is refused <tspan font-family="ui-monospace,Menlo,Consolas,monospace">unknown-draft</tspan>.</text>
</svg>
