<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A closed record leaves the board and only log records remain</title>
  <desc>Three lanes for job J4, decision E2 and incident I1. Each sits on progress.json until the lock hold that closes it, shown as a shaded band, and after it only its log records remain in log.jsonl. Separately, a later use of the id is refused because it is below its counter and not on the board: job-finished, decision-already-answered or incident-closed. The one link from the log is a message to a closed product owner, which reads job-launched and brings that job back.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="444" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A closed record leaves the board and only log records remain</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Each leaves in the lock hold that closes it. Its counter refuses a later use of its id.</text>
  <text x="40" y="100" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">on progress.json</text>
  <text x="204" y="100" font-size="11" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">in log.jsonl</text>
  <rect x="432" y="84" width="208" height="326" rx="12" fill="#F7F5EE" stroke="#E1DDD0"/>
  <text x="536" y="102" font-size="12" fill="#A32D2D" text-anchor="middle">a later use of the id</text>
  <text x="536" y="118" font-size="11" fill="#A32D2D" text-anchor="middle">below its counter, not on the board</text>
  <rect x="158" y="88" width="36" height="322" rx="6" fill="#F1EDE0" stroke="#E1DDD0"/>
  <text x="176" y="428" font-size="11" fill="#73726c" text-anchor="middle">the lock hold that closes it</text>
  <rect x="40" y="128" width="110" height="104" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="95" y="174.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job J4</text>
  <text x="95" y="193.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">jobs[]</text>
  <path d="M150,180 L200,180" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="204" y="128" width="138" height="104" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="273" y="175" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-launched</text>
  <text x="273" y="193" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-ended</text>
  <rect x="442" y="128" width="188" height="42" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="536" y="154.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-finished</text>
  <rect x="442" y="178" width="188" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="536" y="194" font-size="12" fill="#0C447C" text-anchor="middle">A message to a closed</text>
  <text x="536" y="209" font-size="12" fill="#0C447C" text-anchor="middle">product owner reopens it</text>
  <text x="536" y="225" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">reopenEndedJob</text>
  <path d="M342,206 L438,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="387" y="184" font-size="11" fill="#73726c" text-anchor="middle">reads</text>
  <text x="387" y="198" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job-launched</text>
  <rect x="40" y="244" width="110" height="72" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="95" y="274.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Decision E2</text>
  <text x="95" y="293.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">decisions[]</text>
  <path d="M150,280 L200,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="204" y="244" width="138" height="72" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="273" y="266" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">decision-opened</text>
  <text x="273" y="284" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">decision-answered</text>
  <text x="273" y="302" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">or -withdrawn</text>
  <rect x="442" y="258" width="188" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="536" y="285.0" font-size="11" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">decision-already-answered</text>
  <rect x="40" y="328" width="110" height="72" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="95" y="358.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Incident I1</text>
  <text x="95" y="377.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incidents[]</text>
  <path d="M150,364 L200,364" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="204" y="328" width="138" height="72" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="273" y="350" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incident-opened</text>
  <text x="273" y="368" font-size="12" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incident-handled</text>
  <text x="273" y="386" font-size="12" fill="#444441" text-anchor="middle">or another closing kind</text>
  <rect x="442" y="342" width="188" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="536" y="369.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">incident-closed</text>
</svg>
