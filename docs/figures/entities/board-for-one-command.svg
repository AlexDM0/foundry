<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Board lives for one invocation and hands back what changed</title>
  <desc>Stored files are read into a BoardInput. The Board holds them in BoardRecords and its rule modules change the records in place, with no input or output of its own. The change lists in BoardRecords are the write-set, which the caller writes to the files. A refusal throws and nothing is written.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A Board lives for one invocation and hands back what changed</text>
  <text x="40" y="66" font-size="13" fill="#73726c">The model does no input or output. Its caller reads the files and writes them.</text>

  <path d="M160,160 L236,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="198" y="152" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BoardInput</text>
  <path d="M444,160 L500,160" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="472" y="152" font-size="11" fill="#73726c" text-anchor="middle">write-set</text>
  <path d="M340,226 L340,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="349" y="248" font-size="11" fill="#73726c">a rule refuses</text>

  <rect x="40" y="96" width="120" height="130" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="100" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Stored files</text>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="100" y="144">progress, tickets</text>
    <text x="100" y="162">epics, filing drafts</text>
    <text x="100" y="180">log, pipeline</text>
  </g>

  <rect x="240" y="96" width="200" height="130" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="120" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Board</text>
  <g font-size="12" fill="#185FA5" text-anchor="middle">
    <text x="340" y="144" font-family="ui-monospace,Menlo,Consolas,monospace">BoardRecords</text>
    <text x="340" y="162">rule modules behind it</text>
    <text x="340" y="180">change records in place</text>
    <text x="340" y="198">log through a Logger</text>
  </g>

  <rect x="504" y="96" width="136" height="130" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="572" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Lock hold writes</text>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="572" y="144">progress</text>
    <text x="572" y="162">changed files</text>
    <text x="572" y="180">new log records</text>
  </g>

  <rect x="235" y="264" width="210" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="340" y="284" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">BoardRefusal</text>
  <text x="340" y="301" font-size="12" fill="#A32D2D" text-anchor="middle">nothing is written</text>
</svg>
