<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Add a test at the lowest tier that can prove the claim</title>
  <desc>Horizontal bars to scale, one per tier, drawn from a common left edge with tests and spec files at commit 70ce56de. From the bottom up: static guards 158 tests in 13 files, pure logic 2,024 in 176, mutants and seeds 118 in 2, scratch disk 768 in 85, in-process commands 551 in 49, spawned processes 255 in 22, DOM specs 123 in 17, headless Chrome 1 in 1, and a manual smoke that is no spec. An axis rising on the left says a higher tier costs more and proves more of the real system, so a test goes at the lowest tier that can prove the claim.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="498" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Add a test at the lowest tier that can prove the claim</text>
  <text x="40" y="68" font-size="13" fill="#73726c">tests to scale at 70ce56de; each spec file counts once, at the highest tier it uses</text>

  <!-- axis -->
  <path d="M48,478 L48,106" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text transform="translate(44,290) rotate(-90)" font-size="11" fill="#73726c" text-anchor="middle" y="-4">costs more, proves more of the real system</text>

  <text x="64" y="98" font-size="12" font-weight="500" fill="#73726c">Tier, and when a test belongs there</text>
  <text x="300" y="98" font-size="12" font-weight="500" fill="#73726c">Tests, to scale</text>
  <path d="M300,104 L300,482" fill="none" stroke="#ECE7DC" stroke-width="1"/>

  <!-- rows: height 41, scale 190 / 2024 -->
  <g font-size="14" font-weight="500" fill="#633806">
    <text x="64" y="120">Manual smoke</text>
  </g>
  <text x="64" y="137" font-size="12" fill="#854F0B">A real claude session must act</text>
  <text x="308" y="130" font-size="12" fill="#854F0B">no spec, a script</text>

  <g font-size="14" font-weight="500" fill="#0C447C">
    <text x="64" y="161">Headless Chrome</text>
    <text x="64" y="202">DOM specs</text>
    <text x="64" y="243">Spawned processes</text>
    <text x="64" y="284">In-process commands</text>
    <text x="64" y="325">Scratch disk</text>
    <text x="64" y="366">Mutants and seeds</text>
    <text x="64" y="407">Pure logic</text>
    <text x="64" y="448">Static guards</text>
  </g>
  <g font-size="12" fill="#185FA5">
    <text x="64" y="178">The real Bridge, a real browser</text>
    <text x="64" y="219">A component renders or reacts</text>
    <text x="64" y="260">A real process, exit or crash</text>
    <text x="64" y="301">A whole command, frozen clock</text>
    <text x="64" y="342">Real files or real git</text>
    <text x="64" y="383">A Playbook rule or invariant</text>
    <text x="64" y="424">A model, util or decider, no disk</text>
    <text x="64" y="465">A rule about the tree itself</text>
  </g>

  <!-- bars -->
  <g fill="#CFE2F6" stroke="#AECDEC">
    <rect x="300" y="154" width="2" height="24" rx="1"/>
    <rect x="300" y="195" width="11.5" height="24" rx="2"/>
    <rect x="300" y="236" width="24" height="24" rx="3"/>
    <rect x="300" y="277" width="51.7" height="24" rx="3"/>
    <rect x="300" y="318" width="72.1" height="24" rx="3"/>
    <rect x="300" y="359" width="11.1" height="24" rx="2"/>
    <rect x="300" y="400" width="190" height="24" rx="3"/>
    <rect x="300" y="441" width="14.8" height="24" rx="2"/>
  </g>
  <g font-size="12" fill="#0C447C">
    <text x="308" y="171">1 test, 1 file</text>
    <text x="318" y="212">123 tests, 17 files</text>
    <text x="330" y="253">255 tests, 22 files</text>
    <text x="358" y="294">551 tests, 49 files</text>
    <text x="378" y="335">768 tests, 85 files</text>
    <text x="318" y="376">118 tests, 2 files</text>
    <text x="496" y="417">2,024 tests, 176 files</text>
    <text x="321" y="458">158 tests, 13 files</text>
  </g>
</svg>
