<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each guarded door forbids, refuses or replaces the reach</title>
  <desc>Live data sits at the centre of three bands, sorted by when each lock acts. Outermost, before the run, a lint rule or guard forbids the code: changing directory, the real process context, a board's real port, and setting the root override in-process. In the middle, the helper refuses before the command runs: a command's directory, discovery walking up, and the root override's value. Innermost, the context or the child replaces the real thing with scratch: the real home, the monitor registry, a real agent session and a worktree's placement. Each door a helper controls is locked before the centre.</desc>
  <rect x="1" y="1" width="678" height="442" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Each guarded door forbids, refuses or replaces the reach</text>
  <text x="40" y="68" font-size="13" fill="#73726c">each band is when its locks act; each chip is a door and its lock</text>

  <!-- outer band: forbidden -->
  <rect x="40" y="84" width="600" height="344" rx="12" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="52" y="104" font-size="12" font-weight="500" fill="#0C447C">Before the run: a lint rule or guard forbids the code</text>
  <g fill="#FAF9F5" stroke="#CFE2F6">
    <rect x="50" y="112" width="130" height="48" rx="6"/>
    <rect x="186" y="112" width="155" height="48" rx="6"/>
    <rect x="347" y="112" width="122" height="48" rx="6"/>
    <rect x="475" y="112" width="155" height="48" rx="6"/>
  </g>
  <g font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">
    <text x="115" y="131">Changing directory</text>
    <text x="263.5" y="131">Real process context</text>
    <text x="408" y="131">A board's real port</text>
    <text x="552.5" y="131">Override set in-process</text>
  </g>
  <g font-size="11" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="115" y="149">process.chdir</text>
    <text x="263.5" y="149">createProcessContext</text>
    <text x="408" y="149">--port 0</text>
    <text x="552.5" y="149">CONFINED_REACHES</text>
  </g>

  <!-- middle band: refused -->
  <rect x="50" y="170" width="580" height="248" rx="10" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="62" y="190" font-size="12" font-weight="500" fill="#791F1F">At the helper: refused before the command runs</text>
  <g fill="#FAF9F5" stroke="#F3D2D2">
    <rect x="60" y="198" width="176" height="48" rx="6"/>
    <rect x="244" y="198" width="196" height="48" rx="6"/>
    <rect x="448" y="198" width="172" height="48" rx="6"/>
  </g>
  <g font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle">
    <text x="148" y="217">A command's directory</text>
    <text x="342" y="217">Discovery walking up</text>
    <text x="534" y="217">The root override's value</text>
  </g>
  <g font-size="11" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="148" y="235">requireTrackerIsolation</text>
    <text x="342" y="235">trackerIsolationVerdictFor</text>
    <text x="534" y="235">ROOT_OVERRIDE_VARIABLES</text>
  </g>

  <!-- inner band: replaced -->
  <rect x="60" y="256" width="560" height="152" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="72" y="276" font-size="12" font-weight="500" fill="#27500A">In the context or child: replaced by scratch</text>
  <g fill="#FAF9F5" stroke="#D3E6BC">
    <rect x="70" y="284" width="172" height="52" rx="6"/>
    <rect x="70" y="344" width="172" height="52" rx="6"/>
    <rect x="438" y="284" width="172" height="52" rx="6"/>
    <rect x="438" y="344" width="172" height="52" rx="6"/>
  </g>
  <g font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">
    <text x="156" y="305">The real home</text>
    <text x="156" y="365">The monitor registry</text>
    <text x="524" y="305">A real agent session</text>
    <text x="524" y="365">A worktree's placement</text>
  </g>
  <g font-size="11" fill="#3B6D11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="156" y="323">HOME, spec-home</text>
    <text x="156" y="383">temporaryDirectories</text>
    <text x="524" y="323">trap, fake adapter</text>
    <text x="524" y="383">addWorktree</text>
  </g>

  <!-- centre -->
  <rect x="254" y="284" width="172" height="112" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="312" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Live data</text>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="340" y="332">real tracker, real home</text>
    <text x="340" y="350">real board port</text>
    <text x="340" y="368">real claude session</text>
  </g>
</svg>
