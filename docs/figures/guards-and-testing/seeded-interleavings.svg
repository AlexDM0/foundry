<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each seed replays one random history through the real Playbook</title>
  <desc>For each of SEEDS seeds, a LifecycleWorld runs TURNS_PER_SEED turns. Each turn follows the Playbook on one in-memory Board, checks the invariants, then lets a fake agent or User act at random, and loops. A violation leaves the loop listed under its seed, which replays exactly. A second row reruns the same world on a mutated policy, and its test passes only when violations are above zero, which proves the world notices a broken policy.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="416" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Each seed replays one random history through the real Playbook</text>
  <text x="40" y="68" font-size="13" fill="#73726c" font-family="ui-monospace,Menlo,Consolas,monospace">Playbook.interleavings.spec.ts</text>

  <!-- seed band -->
  <rect x="40" y="84" width="600" height="212" rx="12" fill="none" stroke="#E1DDD0" stroke-width="1.5"/>
  <text x="54" y="105" font-size="12" font-weight="500" fill="#5F5E5A">for each of SEEDS seeds: new LifecycleWorld(seed + 1)</text>
  <rect x="54" y="116" width="572" height="120" rx="10" fill="none" stroke="#E1DDD0"/>
  <text x="68" y="131" font-size="12" font-weight="500" fill="#5F5E5A">for each of TURNS_PER_SEED turns</text>

  <path d="M242,178 L262,178" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,178 L450,178" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- loop back -->
  <path d="M532,150 L532,142 L155,142 L155,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="400" y="136" font-size="11" fill="#73726c" text-anchor="middle">next turn</text>
  <!-- violation exit -->
  <path d="M347,206 L347,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="357" y="224" font-size="11" fill="#73726c">any violation</text>

  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="68" y="150" width="174" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="155" y="174" fill="#0C447C">Follow the Playbook</text>
    <rect x="264" y="150" width="166" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="347" y="174" fill="#0C447C">Check invariants</text>
    <rect x="452" y="150" width="160" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
    <text x="532" y="174" fill="#712B13">Fake agent acts</text>
    <rect x="54" y="248" width="572" height="36" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="340" y="271" fill="#791F1F">A violation is listed under its seed, which replays exactly</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="155" y="193" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">followPlaybook</text>
    <text x="347" y="193" fill="#185FA5">on one in-memory Board</text>
    <text x="532" y="193" fill="#993C1D">or User, at random</text>
  </g>

  <!-- mutated row -->
  <text x="40" y="324" font-size="12" font-weight="500" fill="#73726c">The same world on a broken policy</text>
  <path d="M270,366 L300,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="40" y="336" width="230" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="155" y="361" fill="#0C447C">Mutated policy, same world</text>
    <rect x="302" y="336" width="338" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="471" y="361" fill="#27500A">Violations above zero: the world notices</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="155" y="380" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">mutatedModuleOf</text>
    <text x="471" y="380" fill="#3B6D11">zero would fail the test</text>
  </g>
</svg>
