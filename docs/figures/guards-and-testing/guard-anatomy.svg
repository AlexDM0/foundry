<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A guard proves it can fail before green counts</title>
  <desc>Three parts of src/ImportDirection.spec.ts come before its real assertion. A floor proves the scan read the tree, ruling out green on nothing. Planted violations prove each form is still named, ruling out a blind finder. An exact-both-ways check fails on an unused allowance, ruling out a stale exception. Only after all three does an empty violation list mean the tree obeys.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="430" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A guard proves it can fail before green counts</text>
  <text x="40" y="68" font-size="13" fill="#73726c" font-family="ui-monospace,Menlo,Consolas,monospace">src/ImportDirection.spec.ts</text>

  <text x="60" y="100" font-size="12" font-weight="500" fill="#73726c">What the spec does</text>
  <text x="426" y="100" font-size="12" font-weight="500" fill="#73726c">The false green it rules out</text>

  <!-- rules-out connectors -->
  <path d="M348,143 L422,143" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="384" y="136" font-size="11" fill="#73726c" text-anchor="middle">rules out</text>
  <path d="M348,221 L422,221" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="384" y="214" font-size="11" fill="#73726c" text-anchor="middle">rules out</text>
  <path d="M348,299 L422,299" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="384" y="292" font-size="11" fill="#73726c" text-anchor="middle">rules out</text>

  <!-- bracket over the three rows, then on to the tree -->
  <path d="M56,112 L46,112 L46,330 L56,330" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M46,330 L46,386 L58,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="60" y="350" font-size="11" fill="#73726c">only then</text>

  <!-- floor -->
  <rect x="60" y="112" width="288" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="74" y="137" font-size="14" font-weight="500" fill="#0C447C">Floor: the scan read the tree</text>
  <text x="74" y="157" font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">repository edges &gt;= 1500</text>
  <rect x="424" y="112" width="216" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="438" y="137" font-size="14" font-weight="500" fill="#791F1F">Green on nothing</text>
  <text x="438" y="157" font-size="12" fill="#A32D2D">a renamed folder scans empty</text>

  <!-- planted -->
  <rect x="60" y="190" width="288" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="74" y="215" font-size="14" font-weight="500" fill="#0C447C">Planted: each form is still named</text>
  <text x="74" y="235" font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">graphWithPlantedFiles</text>
  <rect x="424" y="190" width="216" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="438" y="215" font-size="14" font-weight="500" fill="#791F1F">A blind finder</text>
  <text x="438" y="235" font-size="12" fill="#A32D2D">it reports nothing, always</text>

  <!-- exact -->
  <rect x="60" y="268" width="288" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="74" y="293" font-size="14" font-weight="500" fill="#0C447C">Exact both ways: no unused allowance</text>
  <text x="74" y="313" font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">unusedAllowancesOf</text>
  <rect x="424" y="268" width="216" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="438" y="293" font-size="14" font-weight="500" fill="#791F1F">A stale exception</text>
  <text x="438" y="313" font-size="12" fill="#A32D2D">a hole nothing needs stays open</text>

  <!-- tree -->
  <rect x="60" y="360" width="288" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="74" y="382" font-size="14" font-weight="500" fill="#27500A">The tree: every violation list is empty</text>
  <text x="74" y="400" font-size="12" fill="#3B6D11">an empty list is a real finding</text>
</svg>
