<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A bare claude under the run is a stub that fails the test</title>
  <desc>The bunfig preload ClaudeLaunchGuard writes a recording stub and puts its folder first on the run's PATH. Two separate routes then pass the trap to a child. CliProcess builds a spawned binary's environment in childEnvironmentOf, with the trap first and the fake-agent switches last, so the binary picks the fake adapter. The spawn wrap fills in the current environment only for a spawn with no env, so that child has the trap and no fake switch. If either child runs the bare name claude, the stub appends to attempts.log and exits at TRAPPED_EXIT_CODE (97), and the afterEach hook reads the log and throws, failing that test.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="532" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A bare claude under the run is a stub that fails the test</text>
  <text x="40" y="68" font-size="13" fill="#73726c">time runs down; two routes hand a child the trap</text>

  <!-- lanes -->
  <rect x="40" y="86" width="196" height="432" rx="10" fill="none" stroke="#ECE7DC"/>
  <rect x="242" y="86" width="196" height="432" rx="10" fill="none" stroke="#ECE7DC"/>
  <rect x="444" y="86" width="196" height="432" rx="10" fill="none" stroke="#ECE7DC"/>
  <text x="138" y="108" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Test run</text>
  <text x="340" y="108" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Spawned child</text>
  <text x="542" y="108" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Trap folder</text>

  <!-- connectors -->
  <path d="M226,146 L450,146" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="139" font-size="11" fill="#73726c" text-anchor="middle">writes the stub</text>
  <path d="M144,174 L144,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M144,250 L144,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- rail from the trap to the wrap, round CliProcess -->
  <path d="M62,223 L50,223 L50,392 L60,392" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M226,308 L250,308" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,336 L340,362" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="350" y="353" font-size="11" fill="#73726c">if it still does</text>
  <path d="M226,392 L250,392" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M430,392 L450,392" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M542,420 L542,436" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M450,466 L228,466" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="459" font-size="11" fill="#73726c" text-anchor="middle">read after each test</text>

  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="62" y="118" width="164" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="144" y="142" fill="#0C447C">Preload the guard</text>
    <rect x="62" y="196" width="164" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="144" y="219" fill="#0C447C">Trap leads PATH</text>
    <rect x="62" y="272" width="164" height="72" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="144" y="293" fill="#0C447C">CliProcess</text>
    <rect x="62" y="364" width="164" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="144" y="388" fill="#0C447C">Spawn wrap</text>
    <rect x="252" y="280" width="176" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="340" y="304" fill="#27500A">Fake adapter chosen</text>
    <rect x="252" y="364" width="176" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
    <text x="340" y="388" fill="#712B13">Something runs claude</text>
    <rect x="454" y="118" width="176" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="542" y="142" fill="#444441">Stub claude</text>
    <rect x="454" y="364" width="176" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="542" y="388" fill="#444441">Stub records, exits</text>
    <rect x="454" y="438" width="176" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="542" y="462" fill="#444441">attempts.log</text>
    <rect x="62" y="438" width="164" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="144" y="462" fill="#791F1F">The test fails</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="144" y="161" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">bunfig.toml</text>
    <text x="144" y="237" fill="#185FA5">run's own PATH, first</text>
    <text x="144" y="311" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">childEnvironmentOf</text>
    <text x="144" y="329" fill="#185FA5">trap, fake switch last</text>
    <text x="144" y="406" fill="#185FA5">a spawn with no env</text>
    <text x="340" y="323" fill="#3B6D11">no vendor reached</text>
    <text x="340" y="407" fill="#993C1D">bare name, trap on PATH</text>
    <text x="542" y="161" fill="#5F5E5A">records, never starts</text>
    <text x="542" y="407" fill="#5F5E5A" font-family="ui-monospace,Menlo,Consolas,monospace">TRAPPED_EXIT_CODE</text>
    <text x="542" y="481" fill="#5F5E5A">one line per attempt</text>
    <text x="144" y="481" fill="#A32D2D">afterEach throws</text>
  </g>
</svg>
