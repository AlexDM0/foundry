<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Playbook rule counts only once its claim fails on a mutant</title>
  <desc>Each claim runs as two independent tests. Test one runs the claim on the Playbook as written: it must hold, or the test fails. Test two builds the mutant, whose text must occur exactly once or the build throws, and runs the claim on it: the claim must fail, and if it still holds the test fails because the claim pins nothing. A rule is watched failing only when both tracks end well.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="410" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A Playbook rule counts only once its claim fails on a mutant</text>
  <text x="40" y="68" font-size="13" fill="#73726c">each claim names the one line that decides it, and runs as two tests</text>

  <!-- claim to tracks -->
  <path d="M290,132 L290,146 L110,146 L110,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M390,132 L390,146 L420,146 L420,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="140" font-size="11" fill="#73726c" text-anchor="middle">test one</text>
  <text x="432" y="156" font-size="11" fill="#73726c">test two</text>

  <!-- left track -->
  <path d="M180,194 L240,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="211" y="187" font-size="11" fill="#73726c" text-anchor="middle">fails</text>
  <path d="M110,222 L110,338" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="120" y="284" font-size="11" fill="#73726c">holds</text>

  <!-- right track -->
  <path d="M490,194 L550,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="520" y="187" font-size="11" fill="#73726c" text-anchor="middle">not once</text>
  <path d="M420,222 L420,250" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430" y="240" font-size="11" fill="#73726c">once</text>
  <path d="M490,280 L550,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="520" y="273" font-size="11" fill="#73726c" text-anchor="middle">still holds</text>
  <path d="M420,308 L420,338" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430" y="327" font-size="11" fill="#73726c">fails</text>

  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="265" y="88" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="340" y="115" fill="#0C447C">One claim</text>
    <rect x="40" y="166" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="110" y="190" fill="#0C447C">Claim on source</text>
    <rect x="242" y="166" width="88" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="286" y="190" fill="#791F1F">Test fails</text>
    <rect x="350" y="166" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="420" y="190" fill="#0C447C">Build the mutant</text>
    <rect x="552" y="166" width="88" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="596" y="190" fill="#791F1F">Build throws</text>
    <rect x="350" y="252" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="420" y="276" fill="#0C447C">Claim on mutant</text>
    <rect x="552" y="252" width="88" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="596" y="276" fill="#791F1F">Test fails</text>
    <rect x="40" y="340" width="450" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="265" y="362" fill="#27500A">Rule watched failing</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="110" y="208" fill="#185FA5">Playbook as written</text>
    <text x="286" y="208" fill="#A32D2D">rule is wrong</text>
    <text x="420" y="208" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">mutantPluginFor</text>
    <text x="596" y="208" fill="#A32D2D">zero or many</text>
    <text x="420" y="294" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">mutatedModuleOf</text>
    <text x="596" y="294" fill="#A32D2D">pins nothing</text>
    <text x="265" y="380" fill="#3B6D11">both tests pass</text>
  </g>
</svg>
