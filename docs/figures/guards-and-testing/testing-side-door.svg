<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>src/testing/ is a side door, open only to named importers</title>
  <desc>A thin strip shows the layers lib, shared, adapters, services and features. A src/lib/ spec importing src/shared/ directly is refused by LAYER_REACH. The permitted route runs from that spec past TESTING_FOLDER_IMPORTERS, which admits it to src/testing/ToolGuard.ts, and that helper may import src/shared/Environment.ts because src/testing/ reaches every source layer, never a feature.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="338" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">src/testing/ is a side door, open only to named importers</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a src/lib/ spec needs a tool check, which reads a switch in src/shared/</text>

  <!-- layers -->
  <g font-size="13" font-weight="500" fill="#444441" text-anchor="middle">
    <rect x="40" y="86" width="112" height="36" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="96" y="109">lib</text>
    <rect x="162" y="86" width="112" height="36" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="218" y="109">shared</text>
    <rect x="284" y="86" width="112" height="36" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="340" y="109">adapters</text>
    <rect x="406" y="86" width="112" height="36" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="462" y="109">services</text>
    <rect x="528" y="86" width="112" height="36" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="584" y="109">features</text>
  </g>

  <!-- direct route, refused -->
  <path d="M115,248 L115,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="166" width="170" height="46" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="125" y="186" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Direct import refused</text>
  <text x="125" y="203" font-size="12" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">LAYER_REACH</text>

  <!-- side door route -->
  <path d="M190,276 L210,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M402,276 L458,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430" y="269" font-size="11" fill="#73726c" text-anchor="middle">admits</text>
  <path d="M550,248 L550,150 L250,150 L250,124" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="260" y="143" font-size="11" fill="#73726c">src/testing/ reaches every source layer, never a feature</text>

  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="40" y="250" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="115" y="274" fill="#0C447C">A src/lib/ spec</text>
    <rect x="212" y="250" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="307" y="274" fill="#0C447C">The gate</text>
    <rect x="460" y="250" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="550" y="274" fill="#0C447C">A helper in src/testing/</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="115" y="292" fill="#185FA5">needs a tool check</text>
    <text x="307" y="292" fill="#185FA5" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">TESTING_FOLDER_IMPORTERS</text>
    <text x="550" y="292" fill="#185FA5" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">ToolGuard.ts</text>
  </g>
</svg>
