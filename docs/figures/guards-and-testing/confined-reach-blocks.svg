<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A site sheds only its own reach, because the last matching block wins</title>
  <desc>Two blocks of eslint.config.js bind the same rule ids. Block one, confinedReachRules(null), matches every TypeScript file and forbids process.env, process.cwd and homedir. Block two, confinedReachRules(site), matches only cli/CommandContext.ts and lists process.env alone. An ordinary file such as cli/tickets/TicketCommand.ts matches only block one and ends with all three forbidden. cli/CommandContext.ts matches both, the later block wins, and it ends with process.cwd and homedir allowed while process.env stays forbidden.</desc>
  <rect x="1" y="1" width="678" height="366" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A site sheds only its own reach, because the last matching block wins</text>
  <text x="40" y="68" font-size="13" fill="#73726c">three of the reaches; each block binds the same rule ids</text>

  <g font-size="12" font-weight="500" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="352" y="96">process.env</text>
    <text x="466" y="96">process.cwd</text>
    <text x="580" y="96">homedir</text>
  </g>

  <text x="40" y="118" font-size="12" font-weight="500" fill="#73726c">Blocks, in config order</text>
  <g font-size="14" font-weight="500" fill="#0C447C">
    <rect x="40" y="126" width="256" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="150">Block one: every file</text>
    <rect x="40" y="190" width="256" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="52" y="214">Block two: one site</text>
  </g>
  <g font-size="12" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="52" y="169">confinedReachRules(null)</text>
    <text x="52" y="233">confinedReachRules(site)</text>
  </g>

  <text x="40" y="270" font-size="12" font-weight="500" fill="#73726c">What a file ends with</text>
  <g font-size="12" font-weight="500" fill="#444441">
    <rect x="40" y="278" width="256" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <rect x="40" y="314" width="256" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  </g>
  <g font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="52" y="297">cli/tickets/TicketCommand.ts</text>
    <text x="52" y="333">cli/CommandContext.ts</text>
  </g>

  <!-- cells: block rows -->
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="126" width="106" height="56" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="353" y="158" fill="#791F1F">forbidden</text>
    <rect x="412" y="126" width="110" height="56" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="467" y="158" fill="#791F1F">forbidden</text>
    <rect x="528" y="126" width="112" height="56" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="584" y="158" fill="#791F1F">forbidden</text>

    <rect x="300" y="190" width="106" height="56" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="353" y="222" fill="#791F1F">forbidden</text>
    <rect x="412" y="190" width="110" height="56" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="467" y="222" fill="#5F5E5A">not listed</text>
    <rect x="528" y="190" width="112" height="56" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
    <text x="584" y="222" fill="#5F5E5A">not listed</text>

    <rect x="300" y="278" width="106" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="353" y="297" fill="#791F1F">forbidden</text>
    <rect x="412" y="278" width="110" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="467" y="297" fill="#791F1F">forbidden</text>
    <rect x="528" y="278" width="112" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="584" y="297" fill="#791F1F">forbidden</text>

    <rect x="300" y="314" width="106" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
    <text x="353" y="333" fill="#791F1F">forbidden</text>
    <rect x="412" y="314" width="110" height="30" rx="6" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="467" y="333" fill="#27500A">allowed here</text>
    <rect x="528" y="314" width="112" height="30" rx="6" fill="#EAF3DE" stroke="#D3E6BC"/>
    <text x="584" y="333" fill="#27500A">allowed here</text>
  </g>
</svg>
