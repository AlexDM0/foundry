<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Both routes to a command end at the same scripted fake agent</title>
  <desc>A spec reaches a command in-process through runCommandLine with the captured context, which always carries fakeAgentAdapter, or by spawning the binary through CliProcess, where agentAdapterOfThisProcess picks fakeAgentAdapter under FAKE_AGENT_VARIABLE. Both reach FakeAgentChild playing a scenario file. CLAUDE_CODE_ADAPTER is the branch that is unreachable under test, because CliProcess always sets the switch. Only the spawned route can show the shebang, the exit status, a child's environment or a command running beside another.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="464" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Both routes to a command end at the same scripted fake agent</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the spawned route costs a process, so use it for what only it shows</text>

  <!-- lanes -->
  <rect x="40" y="86" width="112" height="306" rx="10" fill="none" stroke="#ECE7DC"/>
  <rect x="158" y="86" width="256" height="306" rx="10" fill="none" stroke="#ECE7DC"/>
  <rect x="420" y="86" width="220" height="306" rx="10" fill="none" stroke="#ECE7DC"/>
  <text x="96" y="106" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Spec</text>
  <text x="286" y="106" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Route to the command</text>
  <text x="530" y="106" font-size="12" font-weight="500" fill="#73726c" text-anchor="middle">Agent</text>

  <!-- connectors -->
  <path d="M142,144 L164,144" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M142,236 L164,236" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M286,264 L286,286" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M408,144 L530,144 L530,194" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="470" y="137" font-size="11" fill="#73726c" text-anchor="middle">always</text>
  <path d="M408,314 L426,314 L426,222 L432,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M530,250 L530,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,342 L340,366 L432,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="332" y="360" font-size="11" fill="#73726c" text-anchor="end">unreachable under test</text>

  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect x="50" y="116" width="92" height="148" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="96" y="195" fill="#0C447C">A spec</text>
    <rect x="166" y="116" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="286" y="140" fill="#0C447C">In-process</text>
    <rect x="166" y="208" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="286" y="232" fill="#0C447C">Spawned binary</text>
    <rect x="166" y="288" width="240" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="286" y="311" fill="#0C447C">Picks an adapter</text>
    <rect x="434" y="194" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
    <text x="532" y="218" fill="#0C447C">Fake adapter</text>
    <rect x="434" y="274" width="196" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
    <text x="532" y="298" fill="#712B13">Fake session</text>
  </g>
  <rect x="434" y="344" width="196" height="40" rx="8" fill="#F1EFE8" stroke="#BFBDB0" stroke-dasharray="4 3"/>
  <text x="532" y="369" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE_CODE_ADAPTER</text>
  <g font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="286" y="159" fill="#185FA5">runCommandLine + context</text>
    <text x="286" y="251" fill="#185FA5">cli/testing/CliProcess.ts</text>
    <text x="286" y="330" fill="#185FA5">agentAdapterOfThisProcess</text>
    <text x="532" y="237" fill="#185FA5">fakeAgentAdapter</text>
    <text x="532" y="317" fill="#993C1D">FakeAgentChild</text>
  </g>

  <text x="40" y="420" font-size="12" font-weight="500" fill="#73726c">Only the spawned route shows</text>
  <text x="40" y="440" font-size="12" fill="#73726c">the shebang, the exit status, a child's environment, a command running beside another</text>
</svg>
