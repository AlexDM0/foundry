<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Trouble goes one of three ways, by who must act</title>
  <desc>What code cannot settle alone fans out to three audiences. A decision belongs to User and waits until answered. An incident belongs to the Assistant and always ends, by a move or by its default. A notice is only shown and nobody answers it. An incident can escalate to a decision, and no decision ever becomes an incident.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="352" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">Trouble goes one of three ways, by who must act</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Only one arrow joins them, and it points at User.</text>

  <rect x="250" y="86" width="200" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="350" y="108" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer finds trouble</text>
  <text x="350" y="125" font-size="12" fill="#185FA5" text-anchor="middle">code cannot settle it alone</text>

  <path d="M290,136 L290,152 L120,152 L120,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M350,136 L350,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M410,136 L410,152 L560,152 L560,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="186" width="160" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="120" y="212" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Decision</text>
  <text x="120" y="231" font-size="12" fill="#854F0B" text-anchor="middle">User's, and it waits</text>
  <rect x="270" y="186" width="160" height="62" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="350" y="212" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Incident</text>
  <text x="350" y="231" font-size="12" fill="#993C1D" text-anchor="middle">the Assistant's, and it ends</text>
  <rect x="480" y="186" width="160" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560" y="212" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Notice</text>
  <text x="560" y="231" font-size="12" fill="#5F5E5A" text-anchor="middle">shown, nobody answers</text>

  <path d="M270,217 L202,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="210" font-size="11" fill="#73726c" text-anchor="middle">escalates</text>

  <path d="M120,248 L120,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M350,248 L350,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M560,248 L560,274" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="276" width="160" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="120" y="302" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">First answer wins</text>
  <text x="120" y="321" font-size="12" fill="#5F5E5A" text-anchor="middle">however long it takes</text>
  <rect x="270" y="276" width="160" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="350" y="302" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">A move, or its default</text>
  <text x="350" y="321" font-size="12" fill="#5F5E5A" text-anchor="middle">never hangs on an agent</text>
  <rect x="480" y="276" width="160" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="560" y="302" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Never stored</text>
  <text x="560" y="321" font-size="12" fill="#5F5E5A" text-anchor="middle">derived every Pass</text>
</svg>
