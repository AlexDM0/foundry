<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A dead Overseer costs time, never an agent</title>
  <desc>Time runs left to right. Overseer generation 1 dies and, after a gap in which nobody drives, generation 2 starts. The Watcher and the agent run unbroken across the gap while the event log keeps filling. The stored cursor stands still during the gap, then catches up in the first Pass of generation 2.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="362" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A dead Overseer costs time, never an agent</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Time runs to the right. In the shaded span nobody drives.</text>

  <rect x="310" y="82" width="130" height="262" fill="#F1EFE8" fill-opacity="0.75"/>
  <text x="375" y="100" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">nobody drives</text>

  <text x="40" y="133" font-size="13" font-weight="500" fill="#0C447C">Overseer</text>
  <rect x="130" y="114" width="180" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220" y="134" font-size="12" fill="#185FA5" text-anchor="middle">generation 1</text>
  <rect x="440" y="114" width="200" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="540" y="134" font-size="12" fill="#185FA5" text-anchor="middle">generation 2</text>
  <text x="310" y="108" font-size="11" fill="#A32D2D" text-anchor="middle">dies</text>
  <path d="M304,120 L316,138 M316,120 L304,138" fill="none" stroke="#A32D2D" stroke-width="2"/>

  <text x="40" y="177" font-size="13" font-weight="500" fill="#0C447C">Watcher</text>
  <rect x="130" y="158" width="510" height="30" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="385" y="178" font-size="12" fill="#185FA5" text-anchor="middle">one Watcher instance, unbroken</text>

  <text x="40" y="221" font-size="13" font-weight="500" fill="#712B13">Agent</text>
  <rect x="130" y="202" width="510" height="30" rx="6" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="385" y="222" font-size="12" fill="#993C1D" text-anchor="middle">the same session keeps working</text>

  <text x="40" y="265" font-size="13" font-weight="500" fill="#444441">Event log</text>
  <rect x="130" y="246" width="510" height="30" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <path d="M150,252 v18 M172,252 v18 M196,252 v18 M214,252 v18 M240,252 v18 M262,252 v18 M288,252 v18 M322,252 v18 M344,252 v18 M366,252 v18 M384,252 v18 M408,252 v18 M428,252 v18 M462,252 v18 M488,252 v18 M516,252 v18 M548,252 v18 M580,252 v18 M612,252 v18" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>

  <text x="40" y="309" font-size="13" font-weight="500" fill="#444441">Cursor</text>
  <path d="M130,336 L172,336 L172,328 L214,328 L214,320 L262,320 L262,312 L448,312 L448,296 L516,296 L516,290 L580,290 L580,284 L640,284" fill="none" stroke="#444441" stroke-width="1.8"/>
  <text x="375" y="330" font-size="11" fill="#73726c" text-anchor="middle">stands still</text>
  <text x="458" y="316" font-size="11" fill="#73726c">first Pass catches up</text>
</svg>
