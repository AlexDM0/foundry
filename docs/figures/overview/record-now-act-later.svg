<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A verb records now and a Pass acts later</title>
  <desc>Time runs down. With the Overseer up, a terminal verb records the fact on the board in a lock hold and nudges the Overseer, and the next Pass reads the fact and acts on it. With the Overseer down, it has no lifeline until it starts: the verb records the same fact and nobody drives while it waits. The first Pass after the Overseer starts reads it and acts.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A verb records now and a Pass acts later</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Time runs down. The board is the only thing the two sides share.</text>
  <rect x="40" y="82" width="290" height="270" rx="12" fill="none" stroke="#E1DDD0"/>
  <text x="185" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer up</text>
  <path d="M88,136 L88,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="46" y="112" width="84" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="88" y="129" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Terminal</text>
  <path d="M185,136 L185,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="143" y="112" width="84" height="26" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="185" y="129" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <path d="M282,136 L282,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="240" y="112" width="84" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="282" y="129" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <path d="M88,158 L183,158" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="136.5" y="151" font-size="11" fill="#73726c" text-anchor="middle">records the fact</text>
  <path d="M88,196 L280,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="136.5" y="189" font-size="11" fill="#73726c" text-anchor="middle">nudges</text>
  <path d="M185,292 L280,292" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="233.5" y="285" font-size="11" fill="#73726c" text-anchor="middle">Pass reads it</text>
  <rect x="240" y="304" width="84" height="30" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="282" y="323" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Pass acts</text>
  <rect x="350" y="82" width="290" height="270" rx="12" fill="none" stroke="#E1DDD0"/>
  <text x="495" y="102" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Overseer down</text>
  <rect x="351" y="172" width="288" height="62" fill="#F1EFE8" fill-opacity="0.75"/>
  <path d="M398,136 L398,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="356" y="112" width="84" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="398" y="129" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Terminal</text>
  <path d="M495,136 L495,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="453" y="112" width="84" height="26" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="495" y="129" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <path d="M592,272 L592,338" fill="none" stroke="#E1DDD0" stroke-width="1.2"/>
  <rect x="550" y="112" width="84" height="26" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="592" y="129" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">Overseer</text>
  <text x="495" y="199" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">nobody drives</text>
  <text x="495" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle">the fact waits on the board</text>
  <path d="M398,158 L493,158" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="446.5" y="151" font-size="11" fill="#73726c" text-anchor="middle">records the fact</text>
  <rect x="550" y="242" width="84" height="30" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="592" y="261" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Starts</text>
  <path d="M495,292 L590,292" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="543.5" y="285" font-size="11" fill="#73726c" text-anchor="middle">Pass reads it</text>
  <rect x="550" y="304" width="84" height="30" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="592" y="323" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Pass acts</text>
</svg>
