<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three stores carry the board across a restart</title>
  <desc>The board says what is decided now and lives in progress.json and the ticket files. The log says what happened and is read back for retry and failure limits. Both commit together in one lock hold, log last. The job folder says how far a step got and is written by the Watcher and the Overseer outside the journal. The Pass reads all three, so the same inputs give the same steps.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="398" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">Three stores carry the board across a restart</text>
  <text x="40" y="66" font-size="13" fill="#73726c">The shaded band commits as one lock hold.</text>
  <rect x="40" y="84" width="410" height="212" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#CFE2F6"/>
  <text x="245" y="284" font-size="12" font-weight="500" fill="#185FA5" text-anchor="middle">one lock hold, journaled, log written last</text>
  <rect x="52" y="96" width="184" height="168" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="144" y="124" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <text x="144" y="144" font-size="12" fill="#5F5E5A" text-anchor="middle">what is decided now</text>
  <text x="144" y="178" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">progress.json</text>
  <text x="144" y="196" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">tickets/</text>
  <text x="144" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">written by verbs and</text>
  <text x="144" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle">the Overseer</text>
  <rect x="254" y="96" width="184" height="168" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="346" y="124" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Log</text>
  <text x="346" y="144" font-size="12" fill="#5F5E5A" text-anchor="middle">what happened</text>
  <text x="346" y="178" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">log.jsonl</text>
  <text x="346" y="196" font-size="12" fill="#5F5E5A" text-anchor="middle">read back for retry limits</text>
  <text x="346" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">written in the same</text>
  <text x="346" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle">lock hold as the board</text>
  <rect x="462" y="96" width="178" height="168" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="551" y="124" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job folder</text>
  <text x="551" y="144" font-size="12" fill="#5F5E5A" text-anchor="middle">how far a step got</text>
  <text x="551" y="178" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">jobs/&lt;job&gt;/</text>
  <text x="551" y="196" font-size="12" fill="#5F5E5A" text-anchor="middle">event logs, markers</text>
  <text x="551" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">written by Watcher and</text>
  <text x="551" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle">Overseer, outside the journal</text>
  <path d="M144,296 L144,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <path d="M346,296 L346,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <path d="M551,264 L551,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="560" y="306" font-size="11" fill="#73726c" text-anchor="start">read every Pass</text>
  <rect x="40" y="332" width="600" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340" y="361" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass and Playbook: same inputs in, same steps out</text>
</svg>
