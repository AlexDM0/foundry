<svg xmlns="http://www.w3.org/2000/svg" width="680" height="358" viewBox="0 0 680 358" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Half of the twelve names are code inside the Overseer</title>
  <desc>The Overseer is one process, and the Pass, Playbook, Customs, Airlock, Bouncer and Regrouping are code inside it. A Watcher is a process of its own, and the Assistant is an agent session running under one. The Bridge is a page in the browser. The Baton is a numbered record and the Hatch is a request folder.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="356" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">Half of the twelve names are code inside the Overseer</text>
  <text x="40" y="66" font-size="13" fill="#73726c">What each name is and where it runs, not who calls whom.</text>
  <rect x="40" y="86" width="384" height="176" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#CFE2F6"/>
  <text x="232" y="110" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="232" y="127" font-size="12" fill="#185FA5" text-anchor="middle">one process per board</text>
  <rect x="54" y="142" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="112" y="171" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass</text>
  <rect x="174" y="142" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="232" y="171" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Playbook</text>
  <rect x="294" y="142" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="352" y="171" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <rect x="54" y="198" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="112" y="227" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
  <rect x="174" y="198" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="232" y="227" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer</text>
  <rect x="294" y="198" width="116" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="352" y="227" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Regrouping</text>
  <rect x="440" y="86" width="200" height="176" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#CFE2F6"/>
  <text x="540" y="110" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <text x="540" y="127" font-size="12" fill="#185FA5" text-anchor="middle">a process of its own</text>
  <rect x="456" y="142" width="168" height="102" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="540" y="182" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Assistant</text>
  <text x="540" y="200" font-size="12" fill="#993C1D" text-anchor="middle">an agent session</text>
  <text x="540" y="216" font-size="12" fill="#993C1D" text-anchor="middle">under a Watcher</text>
  <rect x="40" y="280" width="189" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="134.5" y="305.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bridge</text>
  <text x="134.5" y="323.5" font-size="12" fill="#185FA5" text-anchor="middle">a page in the browser</text>
  <rect x="245" y="280" width="189" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="339.5" y="305.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Baton</text>
  <text x="339.5" y="323.5" font-size="12" fill="#5F5E5A" text-anchor="middle">a numbered record</text>
  <rect x="450" y="280" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="545" y="305.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch</text>
  <text x="545" y="323.5" font-size="12" fill="#5F5E5A" text-anchor="middle">a request folder</text>
</svg>
