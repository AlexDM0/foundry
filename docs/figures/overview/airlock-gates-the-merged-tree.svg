<svg xmlns="http://www.w3.org/2000/svg" width="680" height="278" viewBox="0 0 680 278" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A target only ever moves to a tree that passed its gates</title>
  <desc>The Airlock merges the target's tip into the ticket's branch and gates that merged tree. If the gates go red, nothing lands. If they pass, the Airlock compares the target's tip with the tip it merged, inside one lock hold. If the tip has not moved the target fast-forwards and the ticket has landed. If it moved, nothing lands and the ticket stays unmerged.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="276" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A target only ever moves to a tree that passed its gates</text>
  <text x="40" y="66" font-size="13" fill="#73726c">One Airlock per target, one ticket at a time. The shaded band is one lock hold.</text>
  <rect x="344" y="82" width="296" height="98" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#CFE2F6"/>
  <text x="630" y="172" font-size="12" font-weight="500" fill="#185FA5" text-anchor="end">one lock hold</text>
  <path d="M164,122 L188,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M314,122 L350,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M474,122 L504,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="329" y="113" font-size="11" fill="#73726c" text-anchor="middle">green</text>
  <text x="489" y="113" font-size="11" fill="#73726c" text-anchor="middle">same</text>
  <path d="M252,150 L252,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="261" y="180" font-size="11" fill="#73726c" text-anchor="start">red</text>
  <path d="M412,150 L412,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="421" y="172" font-size="11" fill="#73726c" text-anchor="start">moved</text>
  <rect x="40" y="94" width="124" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="102" y="119.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge target in</text>
  <text x="102" y="137.5" font-size="12" fill="#185FA5" text-anchor="middle">on ticket branch</text>
  <rect x="190" y="94" width="124" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="252" y="119.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Gate the result</text>
  <text x="252" y="137.5" font-size="12" fill="#185FA5" text-anchor="middle">the merged tree</text>
  <rect x="352" y="94" width="122" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="413" y="119.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Compare the tip</text>
  <text x="413" y="137.5" font-size="12" fill="#185FA5" text-anchor="middle">still the merged one?</text>
  <rect x="506" y="94" width="124" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="568" y="119.5" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Landed</text>
  <text x="568" y="137.5" font-size="12" fill="#3B6D11" text-anchor="middle">fast-forward</text>
  <rect x="190" y="206" width="284" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="332" y="229.5" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Nothing lands</text>
  <text x="332" y="247.5" font-size="12" fill="#A32D2D" text-anchor="middle">the ticket stays unmerged</text>
</svg>
