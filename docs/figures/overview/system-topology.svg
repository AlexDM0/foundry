<svg xmlns="http://www.w3.org/2000/svg" width="680" height="532" viewBox="0 0 680 532" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One driver, and no agent is its child</title>
  <desc>User works through terminal verbs, which record directly in the data folder, and through the Bridge, which sends commands to the one Overseer of the board and receives live state back. The Overseer reads and writes the data folder, lands on git and spawns a detached Watcher per agent session or gate step. Each Watcher runs one agent or gate and reports only through its event log in the data folder, so the Watcher and its child outlive the Overseer. The Overseer also takes shared limits from the monitor folder, and the agent commits on its worktree.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="530" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">One driver, and no agent is its child</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Solid arrows act. Dashed arrows only report.</text>
  <rect x="478" y="214" width="162" height="210" rx="12" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="632" y="234" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end">Outlives the Overseer</text>
  <text x="490" y="404" font-size="11" fill="#73726c" text-anchor="start">one Watcher per agent</text>
  <text x="490" y="417" font-size="11" fill="#73726c" text-anchor="start">session or gate step</text>
  <path d="M115,174 L115,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M115,226 L115,250" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,122 L248,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="219" y="102" font-size="11" fill="#73726c" text-anchor="middle">records</text>
  <text x="219" y="115" font-size="11" fill="#73726c" text-anchor="middle">a fact</text>
  <path d="M190,268 L248,268" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="219" y="261" font-size="11" fill="#73726c" text-anchor="middle">commands</text>
  <path d="M250,292 L192,292" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="219" y="306" font-size="11" fill="#73726c" text-anchor="middle">live state</text>
  <path d="M325,246 L325,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="334" y="205" font-size="11" fill="#73726c" text-anchor="start">reads, then</text>
  <text x="334" y="218" font-size="11" fill="#73726c" text-anchor="start">writes in a lock hold</text>
  <path d="M400,290 L492,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="440" y="252" font-size="11" fill="#73726c" text-anchor="middle">spawns, then</text>
  <text x="440" y="265" font-size="11" fill="#73726c" text-anchor="middle">sends input</text>
  <text x="440" y="278" font-size="11" fill="#73726c" text-anchor="middle">and stop</text>
  <path d="M504,250 L504,122 L402,122" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="454" y="115" font-size="11" fill="#73726c" text-anchor="middle">event log</text>
  <path d="M560,310 L560,334" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="568" y="326" font-size="11" fill="#73726c" text-anchor="start">runs one child</text>
  <path d="M615,386 L615,454" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="607" y="442" font-size="11" fill="#73726c" text-anchor="end">commits on a worktree</text>
  <path d="M370,314 L370,454" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="362" y="390" font-size="11" fill="#73726c" text-anchor="end">lands</text>
  <path d="M280,314 L280,484 L192,484" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="477" font-size="11" fill="#73726c" text-anchor="middle">shared limits</text>
  <rect x="40" y="94" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="117" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Terminal verbs</text>
  <text x="115" y="136" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#185FA5" text-anchor="middle">forge</text>
  <rect x="40" y="176" width="150" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="115" y="206" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
  <rect x="40" y="252" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="115" y="277.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bridge</text>
  <text x="115" y="295.5" font-size="12" fill="#185FA5" text-anchor="middle">in the browser</text>
  <rect x="250" y="88" width="150" height="80" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="325" y="117" font-size="14" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">&lt;data&gt;</text>
  <text x="325" y="135" font-size="12" fill="#5F5E5A" text-anchor="middle">board, log,</text>
  <text x="325" y="151" font-size="12" fill="#5F5E5A" text-anchor="middle">job folders</text>
  <rect x="250" y="248" width="150" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="325" y="277.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="325" y="295.5" font-size="12" fill="#185FA5" text-anchor="middle">one per board</text>
  <rect x="494" y="252" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="560" y="277.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <text x="560" y="295.5" font-size="12" fill="#185FA5" text-anchor="middle">detached</text>
  <rect x="494" y="336" width="132" height="50" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="560" y="358.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent session</text>
  <text x="560" y="376.5" font-size="12" fill="#993C1D" text-anchor="middle">or a gate process</text>
  <rect x="40" y="456" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="115" y="481.5" font-size="14" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#444441" text-anchor="middle">&lt;monitor&gt;</text>
  <text x="115" y="499.5" font-size="12" fill="#5F5E5A" text-anchor="middle">files, not a process</text>
  <rect x="330" y="456" width="310" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="485" y="481.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">git</text>
  <text x="485" y="499.5" font-size="12" fill="#5F5E5A" text-anchor="middle">main line, ticket worktrees</text>
</svg>
