<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A report is a claim: only code reaches the board</title>
  <desc>An agent session in its worktree leaves commits, a report and Hatch requests on the untrusted side of a line. Customs reads the commits and the report against git and the ticket, and gates run on the worktree. The Pass takes their verdict and the Playbook's next steps and writes status, Handoff and Review text to the board in one lock hold. A Hatch request reaches the board only if the Bouncer admits it. No path from the agent reaches the board directly.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" font-weight="500" fill="#3d3d3a">A report is a claim: only code reaches the board</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Everything crossing the line is read as evidence or judged as a request.</text>
  <path d="M304,84 L304,444" fill="none" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="294" y="98" font-size="11" fill="#993C1D" text-anchor="end">untrusted</text>
  <text x="314" y="98" font-size="11" fill="#185FA5" text-anchor="start">decides</text>
  <path d="M126,148 L154,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M126,232 L154,232" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M126,386 L154,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M266,148 L366,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="336" y="140" font-size="11" fill="#73726c" text-anchor="middle">read</text>
  <path d="M266,232 L366,232" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="336" y="224" font-size="11" fill="#73726c" text-anchor="middle">read</text>
  <path d="M266,386 L366,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="336" y="378" font-size="11" fill="#73726c" text-anchor="middle">judged</text>
  <rect x="40" y="120" width="86" height="294" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="83" y="256" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent</text>
  <text x="83" y="275" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">session</text>
  <text x="83" y="294" font-size="12" fill="#993C1D" text-anchor="middle">in its</text>
  <text x="83" y="309" font-size="12" fill="#993C1D" text-anchor="middle">worktree</text>
  <rect x="156" y="120" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="211" y="145.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Commits</text>
  <text x="211" y="163.5" font-size="12" fill="#5F5E5A" text-anchor="middle">on its branch</text>
  <rect x="156" y="204" width="110" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="211" y="229.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Report</text>
  <text x="211" y="247.5" font-size="12" fill="#993C1D" text-anchor="middle">a claim</text>
  <rect x="156" y="358" width="110" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="211" y="383.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Hatch request</text>
  <text x="211" y="401.5" font-size="12" fill="#993C1D" text-anchor="middle">a filing, a move</text>
  <rect x="368" y="120" width="122" height="140" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="429" y="170.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <text x="429" y="188.5" font-size="12" fill="#185FA5" text-anchor="middle">checks the claim</text>
  <text x="429" y="204.5" font-size="12" fill="#185FA5" text-anchor="middle">against git and</text>
  <text x="429" y="220.5" font-size="12" fill="#185FA5" text-anchor="middle">the ticket</text>
  <rect x="520" y="120" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="580" y="145.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Gates</text>
  <text x="580" y="163.5" font-size="12" fill="#185FA5" text-anchor="middle">on the worktree</text>
  <rect x="520" y="218" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="580" y="243.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">The Pass</text>
  <text x="580" y="261.5" font-size="12" fill="#185FA5" text-anchor="middle">one lock hold</text>
  <rect x="368" y="282" width="122" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="429" y="305.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Playbook</text>
  <text x="429" y="323.5" font-size="12" fill="#185FA5" text-anchor="middle">picks next steps</text>
  <rect x="368" y="358" width="122" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="429" y="383.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Bouncer</text>
  <text x="429" y="401.5" font-size="12" fill="#185FA5" text-anchor="middle">admits by role</text>
  <rect x="520" y="356" width="120" height="60" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580" y="383.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board</text>
  <text x="580" y="401.5" font-size="12" fill="#5F5E5A" text-anchor="middle">no agent writes it</text>
  <path d="M490,148 L518,148" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M580,176 L580,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="588" y="200" font-size="11" fill="#73726c" text-anchor="start">verdict</text>
  <path d="M490,308 L504,308 L504,246 L518,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="497" y="276" font-size="11" fill="#73726c" text-anchor="end">next steps</text>
  <path d="M532,274 L532,354" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="540" y="298" font-size="11" fill="#73726c" text-anchor="start">status,</text>
  <text x="540" y="312" font-size="11" fill="#73726c" text-anchor="start">Handoff and</text>
  <text x="540" y="326" font-size="11" fill="#73726c" text-anchor="start">Review text</text>
  <path d="M490,386 L518,386" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
