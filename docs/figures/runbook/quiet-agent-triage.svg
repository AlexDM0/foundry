<svg xmlns="http://www.w3.org/2000/svg" width="680" height="712" viewBox="0 0 680 712" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A live Watcher says nothing about the agent</title>
<desc>Flow for a job that looks stuck. Waiting on an answer: answer it. State interrupted: wait for the resume on the next Pass, unless a board hold applies. Any other state but running, namely launching, preparing, in-customs, stopping, gating, merging or landing: the Overseer is moving the job. Running with an event log that moved lately: wait. Running and silent, which fits a long tool call or a hang: a quiet-job incident opens at the QUIET_JOB_SWEEPS bound and only asks. Send job message, which costs one turn. With no reply, choose job fresh or job stop.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="710" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A live Watcher says nothing about the agent</text>
<text x="40" y="68" font-size="13" fill="#73726c">running means the Watcher is alive; a hung agent shows only as silence</text>
<rect x="40" y="86" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="175.0" y="111.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Waiting on an answer?</text>
<text x="175.0" y="129.0" font-size="12" fill="#185FA5" text-anchor="middle">waiting-for-answer, awaiting-answer</text>
<rect x="370" y="78" width="270" height="72" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="505.0" y="102.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Answer it</text>
<text x="505.0" y="120.5" font-size="12" fill="#854F0B" text-anchor="middle">decide, or incident answer</text>
<text x="505.0" y="137.5" font-size="12" fill="#854F0B" text-anchor="middle">a waiver also needs job fresh</text>
<rect x="40" y="186" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="175.0" y="211.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">State interrupted?</text>
<text x="175.0" y="229.0" font-size="12" fill="#185FA5" text-anchor="middle">a lost Watcher lands here next Pass</text>
<rect x="370" y="182" width="270" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="505.0" y="202.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Wait for the resume</text>
<text x="505.0" y="220.5" font-size="12" fill="#5F5E5A" text-anchor="middle">next Pass, unless a board hold</text>
<text x="505.0" y="237.5" font-size="12" fill="#5F5E5A" text-anchor="middle">crashes spend resumes</text>
<rect x="40" y="286" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="175.0" y="311.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">State running?</text>
<text x="175.0" y="329.0" font-size="12" fill="#185FA5" text-anchor="middle">any other state: not the agent</text>
<rect x="370" y="266" width="270" height="96" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="505.0" y="294.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">The Overseer is moving it</text>
<text x="505.0" y="312.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launching, preparing,</text>
<text x="505.0" y="329.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs, stopping: wait</text>
<text x="505.0" y="346.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gating, merging, landing: recipes</text>
<rect x="40" y="386" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="175.0" y="411.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Event log moved lately?</text>
<text x="175.0" y="429.0" font-size="12" fill="#185FA5" text-anchor="middle">last .at; bound QUIET_JOB_SWEEPS</text>
<rect x="370" y="386" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="505.0" y="411.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Wait</text>
<text x="505.0" y="429.0" font-size="12" fill="#5F5E5A" text-anchor="middle">it is working, however slowly</text>
<rect x="40" y="480" width="270" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="175.0" y="505.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Silent under a live Watcher</text>
<text x="175.0" y="523.0" font-size="12" fill="#993C1D" text-anchor="middle">long tool call, or hung</text>
<text x="370" y="503" font-size="12" fill="#73726c" text-anchor="start">at the bound a quiet-job incident opens;</text>
<text x="370" y="520" font-size="12" fill="#73726c" text-anchor="start">it only asks, it stops nothing</text>
<rect x="65" y="574" width="220" height="72" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="175.0" y="598.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job message</text>
<text x="175.0" y="616.5" font-size="12" fill="#854F0B" text-anchor="middle">costs one turn</text>
<text x="175.0" y="633.5" font-size="12" fill="#854F0B" text-anchor="middle">session and work kept</text>
<rect x="370" y="556" width="270" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="505.0" y="575.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job fresh</text>
<text x="505.0" y="593.5" font-size="12" fill="#854F0B" text-anchor="middle">try again: new job id</text>
<text x="505.0" y="610.5" font-size="12" fill="#854F0B" text-anchor="middle">session lost, worktree kept</text>
<rect x="370" y="630" width="270" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="505.0" y="649.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job stop</text>
<text x="505.0" y="667.5" font-size="12" fill="#854F0B" text-anchor="middle">give up for now: ticket held</text>
<text x="505.0" y="684.5" font-size="12" fill="#854F0B" text-anchor="middle">session lost, worktree kept</text>
<path d="M310,114 L368,114" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="340.0" y="108" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M310,214 L368,214" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="340.0" y="208" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M310,314 L368,314" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="340.0" y="308" font-size="11" fill="#73726c" text-anchor="middle">no</text>
<path d="M310,414 L368,414" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="340.0" y="408" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M175.0,142 L175.0,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="184.0" y="167.0" font-size="11" fill="#73726c" text-anchor="start">no</text>
<path d="M175.0,242 L175.0,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="184.0" y="267.0" font-size="11" fill="#73726c" text-anchor="start">no</text>
<path d="M175.0,342 L175.0,384" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="184.0" y="367.0" font-size="11" fill="#73726c" text-anchor="start">yes</text>
<path d="M175.0,442 L175.0,478" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="184.0" y="464.0" font-size="11" fill="#73726c" text-anchor="start">no</text>
<path d="M175.0,536 L175.0,572" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M285,610 L340,610" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M340,587 L340,661" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M340,587 L368,587" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M340,661 L368,661" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="312" y="591" font-size="11" fill="#73726c" text-anchor="middle">no reply:</text>
<text x="312" y="604" font-size="11" fill="#73726c" text-anchor="middle">choose</text>
</svg>
