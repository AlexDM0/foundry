<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Choose by what must end and what must stay held</title>
<desc>Six controls, least to undo first. job fresh ends one session now, holds nothing, and the next attempt launches by itself. oversee pause ends nothing and stops new work until oversee resume. oversee stop ends only the Overseer while sessions run on, until oversee --detach. job wind-down ends one session once it has reported and holds its ticket until ticket unhold. job stop ends one session now and holds its ticket until ticket unhold. job stop --all ends every build, review and intake session, pauses the board and holds each ticket, until oversee resume and ticket unhold on each.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="998" height="498" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Choose by what must end and what must stay held</text>
<text x="40" y="68" font-size="13" fill="#73726c">read down: the further down, the more you have to undo</text>
<text x="40" y="96" font-size="13" font-weight="500" fill="#73726c" text-anchor="start">Control</text>
<text x="252" y="96" font-size="13" font-weight="500" fill="#73726c" text-anchor="start">What ends</text>
<text x="534" y="96" font-size="13" font-weight="500" fill="#73726c" text-anchor="start">The ticket</text>
<text x="762" y="96" font-size="13" font-weight="500" fill="#73726c" text-anchor="start">What brings it back</text>
<rect x="40" y="110" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="142" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job fresh &lt;J&gt;</text>
<rect x="252" y="110" width="270" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="387.0" y="133.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">One session</text>
<text x="387.0" y="150.5" font-size="13" fill="#993C1D" text-anchor="middle">now: job ends replaced</text>
<rect x="534" y="110" width="216" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="642.0" y="142.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Not held</text>
<text x="762" y="142" font-size="13" fill="#444441" text-anchor="start">Nothing: next attempt launches</text>
<rect x="40" y="172" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="204" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee pause</text>
<rect x="252" y="172" width="270" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="387.0" y="195.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Nothing</text>
<text x="387.0" y="212.5" font-size="13" fill="#5F5E5A" text-anchor="middle">running jobs go on; no new work</text>
<rect x="534" y="172" width="216" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="642.0" y="204.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Not held</text>
<text x="762" y="204" font-size="13" fill="#444441" text-anchor="start">oversee resume</text>
<rect x="40" y="234" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="266" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee stop</text>
<rect x="252" y="234" width="270" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="387.0" y="257.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">The Overseer</text>
<text x="387.0" y="274.5" font-size="13" fill="#185FA5" text-anchor="middle">sessions run on, undriven</text>
<rect x="534" y="234" width="216" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="642.0" y="266.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Not held</text>
<text x="762" y="266" font-size="13" fill="#444441" text-anchor="start">oversee --detach</text>
<rect x="40" y="296" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="328" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job wind-down &lt;J&gt;</text>
<rect x="252" y="296" width="270" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="387.0" y="319.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">One session</text>
<text x="387.0" y="336.5" font-size="13" fill="#993C1D" text-anchor="middle">when it has reported</text>
<rect x="534" y="296" width="216" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="642.0" y="319.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Held</text>
<text x="642.0" y="336.5" font-size="13" fill="#854F0B" text-anchor="middle">wound down by User (J&lt;n&gt;)</text>
<text x="762" y="328" font-size="13" fill="#444441" text-anchor="start">ticket unhold</text>
<rect x="40" y="358" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="390" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job stop &lt;J&gt;</text>
<rect x="252" y="358" width="270" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="387.0" y="381.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">One session</text>
<text x="387.0" y="398.5" font-size="13" fill="#993C1D" text-anchor="middle">now: input closed, then signals</text>
<rect x="534" y="358" width="216" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="642.0" y="381.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Held</text>
<text x="642.0" y="398.5" font-size="13" fill="#854F0B" text-anchor="middle">stopped by User (J&lt;n&gt;)</text>
<text x="762" y="380" font-size="13" fill="#444441" text-anchor="start">ticket unhold;</text>
<text x="762" y="398" font-size="13" fill="#444441" text-anchor="start">next attempt, same worktree</text>
<rect x="40" y="420" width="200" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="140" y="452" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job stop --all</text>
<rect x="252" y="420" width="270" height="54" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="387.0" y="443.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Every build, review, intake</text>
<text x="387.0" y="460.5" font-size="13" fill="#993C1D" text-anchor="middle">board paused as well</text>
<rect x="534" y="420" width="216" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="642.0" y="443.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Each held</text>
<text x="642.0" y="460.5" font-size="13" fill="#854F0B" text-anchor="middle">stopped by User (J&lt;n&gt;)</text>
<text x="762" y="452" font-size="13" fill="#444441" text-anchor="start">oversee resume, ticket unhold each</text>
</svg>
