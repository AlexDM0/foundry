<svg xmlns="http://www.w3.org/2000/svg" width="680" height="642" viewBox="0 0 680 642" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Check the board first, then the ticket, then capacity</title>
<desc>Thirteen checks in three groups, each pointing to the section that fixes it. Board-wide: Overseer up, not paused, pipeline set, no usage limit, install unchanged, no outage. The ticket: not a draft ticket, no hold or merge mark, no waiver, ended job&#x27;s question or incident naming it, branch and target clean, dependencies settled. Capacity: a launch slot is free and the ticket ranks within the free launch slots. Each rung names what confirms it; no command shows the launch order. Passing all thirteen means the ticket launches on the next Pass.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="640" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Check the board first, then the ticket, then capacity</text>
<text x="40" y="68" font-size="13" fill="#73726c">stop at the first rung that fails; the rest cannot help until it clears</text>
<rect x="40" y="86" width="600" height="178" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="56" y="106" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Board-wide: one of these stops every ticket</text>
<text x="624" y="106" font-size="12" fill="#185FA5" text-anchor="end">see: Nothing launches at all</text>
<path d="M56,116 L624,116" fill="none" stroke="#CFE2F6"/>
<text x="56" y="133" font-size="14" fill="#0C447C" text-anchor="start">Overseer up?</text>
<text x="624" y="133" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">oversee status</text>
<path d="M56,140 L624,140" fill="none" stroke="#CFE2F6"/>
<text x="56" y="157" font-size="14" fill="#0C447C" text-anchor="start">Not paused?</text>
<text x="624" y="157" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">oversee status</text>
<path d="M56,164 L624,164" fill="none" stroke="#CFE2F6"/>
<text x="56" y="181" font-size="14" fill="#0C447C" text-anchor="start">Pipeline set?</text>
<text x="624" y="181" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">gate list</text>
<path d="M56,188 L624,188" fill="none" stroke="#CFE2F6"/>
<text x="56" y="205" font-size="14" fill="#0C447C" text-anchor="start">No usage limit?</text>
<text x="624" y="205" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">usage-limit.json</text>
<path d="M56,212 L624,212" fill="none" stroke="#CFE2F6"/>
<text x="56" y="229" font-size="14" fill="#0C447C" text-anchor="start">Install unchanged?</text>
<text x="624" y="229" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">oversee status</text>
<path d="M56,236 L624,236" fill="none" stroke="#CFE2F6"/>
<text x="56" y="253" font-size="14" fill="#0C447C" text-anchor="start">No outage?</text>
<text x="624" y="253" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">decisions</text>
<path d="M340,264 L340,278" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="280" width="600" height="168" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="56" y="300" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">The ticket: one of these stops this ticket</text>
<text x="624" y="300" font-size="12" fill="#185FA5" text-anchor="end">see: One ticket will not start</text>
<path d="M56,310 L624,310" fill="none" stroke="#CFE2F6"/>
<text x="56" y="327" font-size="14" fill="#0C447C" text-anchor="start">Not a draft ticket?</text>
<text x="624" y="327" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">ticket show</text>
<path d="M56,334 L624,334" fill="none" stroke="#CFE2F6"/>
<text x="56" y="351" font-size="14" fill="#0C447C" text-anchor="start">No hold or merge mark?</text>
<text x="624" y="351" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">ticket show, merges</text>
<path d="M56,358 L624,358" fill="none" stroke="#CFE2F6"/>
<text x="56" y="375" font-size="14" fill="#0C447C" text-anchor="start">No blocking decision or incident?</text>
<text x="56" y="390" font-size="12" fill="#185FA5" text-anchor="start">waiver, ended job&#x27;s question, any incident</text>
<text x="624" y="375" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">decisions, incidents</text>
<path d="M56,396 L624,396" fill="none" stroke="#CFE2F6"/>
<text x="56" y="413" font-size="14" fill="#0C447C" text-anchor="start">Branch and target clean?</text>
<text x="624" y="413" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">decisions, oversee status</text>
<path d="M56,420 L624,420" fill="none" stroke="#CFE2F6"/>
<text x="56" y="437" font-size="14" fill="#0C447C" text-anchor="start">Dependencies settled?</text>
<text x="624" y="437" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">ticket show</text>
<path d="M340,448 L340,462" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="464" width="600" height="96" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="56" y="484" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start">Capacity: nothing is wrong with the ticket</text>
<text x="624" y="484" font-size="12" fill="#185FA5" text-anchor="end">see: One ticket will not start</text>
<path d="M56,494 L624,494" fill="none" stroke="#CFE2F6"/>
<text x="56" y="511" font-size="14" fill="#0C447C" text-anchor="start">Launch slot free?</text>
<text x="624" y="511" font-size="12" fill="#185FA5" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">jobs, concurrency</text>
<path d="M56,518 L624,518" fill="none" stroke="#CFE2F6"/>
<text x="56" y="535" font-size="14" fill="#0C447C" text-anchor="start">Within the free launch slots?</text>
<text x="56" y="550" font-size="12" fill="#185FA5" text-anchor="start">priority, phase, readiness</text>
<text x="624" y="535" font-size="12" fill="#185FA5" text-anchor="end">no command shows the order</text>
<path d="M340,560 L340,574" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="576" width="280" height="46" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
<text x="340.0" y="596.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">The ticket launches</text>
<text x="340.0" y="614.0" font-size="12" fill="#3B6D11" text-anchor="middle">on the next Pass</text>
</svg>
