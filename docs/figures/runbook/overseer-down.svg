<svg xmlns="http://www.w3.org/2000/svg" width="680" height="518" viewBox="0 0 680 518" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>With the Overseer down, only driving stops</title>
<desc>With the Overseer down nobody drives, yet agents and Watchers keep running and permission prompts are still denied. Hatch requests, results, questions and commands such as decide, job stop and ticket hold wait, recorded. The Pass and the Bridge are absent. oversee --detach starts the Overseer, which reads everything that waited.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="516" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">With the Overseer down, only driving stops</text>
<text x="40" y="68" font-size="13" fill="#73726c">sessions run on and commands record; the next start acts on what waited</text>
<rect x="40" y="88" width="600" height="306" rx="6" fill="#E1DDD0" fill-opacity="0.55"/>
<text x="340" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle">nobody drives</text>
<text x="144" y="136" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Keeps running</text>
<text x="340" y="136" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Waits for the next start</text>
<text x="536" y="136" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Absent until then</text>
<rect x="52" y="150" width="184" height="66" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="144.0" y="180.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agents</text>
<text x="144.0" y="198.0" font-size="12" fill="#993C1D" text-anchor="middle">prompts still denied</text>
<rect x="52" y="228" width="184" height="66" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="144.0" y="258.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watchers</text>
<text x="144.0" y="276.0" font-size="12" fill="#185FA5" text-anchor="middle">logging, standing replies</text>
<rect x="248" y="150" width="184" height="66" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="340.0" y="180.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Hatch requests</text>
<text x="340.0" y="198.0" font-size="12" fill="#5F5E5A" text-anchor="middle">queued in their folder</text>
<rect x="248" y="228" width="184" height="66" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="340.0" y="258.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Results, questions</text>
<text x="340.0" y="276.0" font-size="12" fill="#5F5E5A" text-anchor="middle">in the event logs</text>
<rect x="248" y="306" width="184" height="76" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="340.0" y="332.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Your commands</text>
<text x="340.0" y="350.5" font-size="12" fill="#854F0B" text-anchor="middle">decide, job stop, ticket hold</text>
<text x="340.0" y="367.5" font-size="12" fill="#854F0B" text-anchor="middle">recorded at once</text>
<rect x="444" y="150" width="184" height="66" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-dasharray="5 4"/>
<text x="536.0" y="180.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Pass</text>
<text x="536.0" y="198.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no launch, no landing</text>
<rect x="444" y="228" width="184" height="66" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-dasharray="5 4"/>
<text x="536.0" y="258.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Bridge</text>
<text x="536.0" y="276.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no server behind it</text>
<path d="M248,398 L248,406 L432,406 L432,398" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M340,444 L340,409" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="350" y="430" font-size="11" fill="#73726c" text-anchor="start">reads all of it</text>
<rect x="248" y="446" width="184" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="340.0" y="469.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee --detach</text>
<text x="340.0" y="487.0" font-size="12" fill="#854F0B" text-anchor="middle">starts the Overseer</text>
</svg>
