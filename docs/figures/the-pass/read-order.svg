<svg xmlns="http://www.w3.org/2000/svg" width="680" height="578" viewBox="0 0 680 578" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Read events first, so a result never outruns its request</title>
  <desc>A session writes its Hatch request, then its closing result event. In the wrong order the Overseer reads the Hatch folders first, finds them empty, and then reads the result, so a result arrives ahead of its request and the hold moves the job on before that request applies. In the built order the Overseer reads events first and folders second, so it finds the request, and a result in hand always has its request on disk. The hold then applies requests first and events after.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="576" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Read events first, so a result never outruns its request</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The same timing twice: only the order of the two reads changes.</text>
  <rect x="55.0" y="88" width="110" height="34" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="110.0" y="110.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Session</text>
  <rect x="200.0" y="88" width="140" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="270.0" y="110.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer observe</text>
  <rect x="375.0" y="88" width="110" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="430.0" y="110.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Hatch folder</text>
  <rect x="515.0" y="88" width="110" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="570.0" y="110.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">event log</text>
  <text x="40" y="148" font-size="12" fill="#791F1F" text-anchor="start" font-weight="500">Not built: folders, then events</text>
  <path d="M110,156 L110,284" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M270,156 L270,284" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M430,156 L430,284" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M570,156 L570,284" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M428,176 L273,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="350" y="170" font-size="11" fill="#73726c" text-anchor="middle">folders: empty</text>
  <path d="M110,208 L428,208" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="202" font-size="11" fill="#73726c" text-anchor="middle">writes request</text>
  <path d="M110,240 L568,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="234" font-size="11" fill="#73726c" text-anchor="middle">writes <tspan font-family="ui-monospace,Menlo,Consolas,monospace">result</tspan></text>
  <path d="M568,272 L273,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="350" y="266" font-size="11" fill="#73726c" text-anchor="middle">events: result</text>
  <rect x="150" y="296" width="380" height="42" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="340.0" y="314.0" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">A result ahead of its request</text>
  <text x="340.0" y="331.0" font-size="12" fill="#A32D2D" text-anchor="middle">the job moves to in-customs before its request applies</text>
  <text x="40" y="366" font-size="12" fill="#0C447C" text-anchor="start" font-weight="500">As built: events, then folders</text>
  <path d="M110,374 L110,502" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M270,374 L270,502" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M430,374 L430,502" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M570,374 L570,502" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M568,394 L273,394" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="350" y="388" font-size="11" fill="#73726c" text-anchor="middle">events: none yet</text>
  <path d="M110,426 L428,426" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="420" font-size="11" fill="#73726c" text-anchor="middle">writes request</text>
  <path d="M110,458 L568,458" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="190" y="452" font-size="11" fill="#73726c" text-anchor="middle">writes <tspan font-family="ui-monospace,Menlo,Consolas,monospace">result</tspan></text>
  <path d="M428,490 L273,490" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="350" y="484" font-size="11" fill="#73726c" text-anchor="middle">folders: request</text>
  <rect x="150" y="514" width="380" height="42" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="532.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">No result ahead of its request</text>
  <text x="340.0" y="549.0" font-size="12" fill="#185FA5" text-anchor="middle">the hold applies requests first, then events</text>
</svg>
