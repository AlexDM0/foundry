<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Many wakes, one Pass at a time</title>
  <desc>File events arriving close together keep restarting the debounce timer and produce one wake. Wakes during a running Pass collapse into exactly one more Pass. The writes of a Pass and a sweep are wakes too; when nothing observed changed, the fingerprint ends that Pass before the lock.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="314" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Many wakes, one Pass at a time</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Wakes ask for a Pass. The fingerprint decides whether an unforced Pass does anything.</text>
  <text x="40" y="116" font-size="12" fill="#5F5E5A" text-anchor="start">file events</text>
  <path d="M112,112 L640,112" stroke="#E1DDD0" stroke-width="1.2" fill="none"/>
  <text x="40" y="176" font-size="12" fill="#5F5E5A" text-anchor="start">wakes</text>
  <path d="M112,172 L640,172" stroke="#E1DDD0" stroke-width="1.2" fill="none"/>
  <text x="40" y="244" font-size="12" fill="#5F5E5A" text-anchor="start">Passes</text>
  <path d="M112,240 L640,240" stroke="#E1DDD0" stroke-width="1.2" fill="none"/>
  <path d="M128,103 L128,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M140,103 L140,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M149,103 L149,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M163,103 L163,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M172,103 L172,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M500,103 L500,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M508,103 L508,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M516,103 L516,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M262,103 L262,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M290,103 L290,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <path d="M318,103 L318,121" stroke="#5F5E5A" stroke-width="1.6"/>
  <text x="150" y="96" font-size="11" fill="#73726c" text-anchor="middle">a burst</text>
  <text x="290" y="96" font-size="11" fill="#73726c" text-anchor="middle">during Pass 1</text>
  <text x="508" y="96" font-size="11" fill="#73726c" text-anchor="middle">its own writes</text>
  <path d="M172,121 L190,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="192" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="180" y="194" font-size="11" fill="#73726c" text-anchor="end">debounced</text>
  <circle cx="270" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <path d="M262,121 L269,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="298" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <path d="M290,121 L297,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="326" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <path d="M318,121 L325,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M192,179 L208,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="198" y="222" width="158" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="277.0" y="245.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass 1</text>
  <rect x="362" y="222" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="422.0" y="245.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Pass 2</text>
  <path d="M326,179 L372,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="362" y="196" font-size="11" fill="#73726c" text-anchor="start">one more, however many</text>
  <circle cx="530" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <path d="M516,121 L526,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="606" cy="172" r="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="606" y="158" font-size="11" fill="#73726c" text-anchor="middle">sweep</text>
  <rect x="496" y="222" width="68" height="36" rx="8" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <text x="530" y="244" font-size="12" fill="#5F5E5A" text-anchor="middle">skipped</text>
  <rect x="572" y="222" width="68" height="36" rx="8" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <text x="606" y="244" font-size="12" fill="#5F5E5A" text-anchor="middle">skipped</text>
  <path d="M530,179 L530,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M606,179 L606,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="296" font-size="12" fill="#73726c" text-anchor="start">A steady stream of events under the debounce gap never fires; the sweep has no debounce, so it still does.</text>
</svg>
