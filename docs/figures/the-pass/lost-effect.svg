<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The board still asks for a Watcher, so the next Overseer spawns it</title>
  <desc>Overseer 1 commits a job in state running with Watcher instance 1 to progress.json, then dies before spawning the Watcher. During the gap nobody drives. Overseer 2 reads the job from progress.json and finds no Watcher record in the job folder, so the instance is unclaimed. The query jobsNeedingAWatcher takes the answer from both stores and spawns the same instance, whose exclusive claim in the job folder lets exactly one Watcher run.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="528" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The board still asks for a Watcher, so the next Overseer spawns it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Overseer 1 dies between the hold and the spawn. Nothing is recorded as lost.</text>
  <rect x="48" y="88" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="100.0" y="110.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer 1</text>
  <rect x="168" y="88" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220.0" y="110.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer 2</text>
  <rect x="288" y="88" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="110.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watcher</text>
  <rect x="408" y="88" width="104" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="460.0" y="110.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">progress.json</text>
  <rect x="528" y="88" width="104" height="34" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580.0" y="110.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">job folder</text>
  <path d="M100,122 L100,172" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M460,122 L460,226" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M580,122 L580,226" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M460,270 L460,348" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M580,270 L580,470" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M220,270 L220,356" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M220,396 L220,424" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M340,424 L340,474" stroke="#E1DDD0" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M100,150 L458,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="280" y="144" font-size="11" fill="#73726c" text-anchor="middle">hold commits: job running, instance 1</text>
  <circle cx="100" cy="150" r="4" fill="#185FA5"/>
  <rect x="44" y="172" width="112" height="40" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="100.0" y="189.0" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle">dies before</text>
  <text x="100.0" y="206.0" font-size="12" fill="#A32D2D" text-anchor="middle">the spawn</text>
  <rect x="40" y="226" width="600" height="44" rx="6" fill="#E1DDD0" fill-opacity="0.55"/>
  <text x="340" y="252" font-size="12" fill="#5F5E5A" text-anchor="middle">nobody drives; the board still says running</text>
  <path d="M458,300 L223,300" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="340" y="294" font-size="11" fill="#73726c" text-anchor="middle">job running, instance 1</text>
  <path d="M578,338 L223,338" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="340" y="332" font-size="11" fill="#73726c" text-anchor="middle">no Watcher record: unclaimed</text>
  <rect x="140" y="356" width="160" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220.0" y="373.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">jobsNeedingAWatcher</text>
  <text x="220.0" y="390.0" font-size="12" fill="#185FA5" text-anchor="middle">same query, same answer</text>
  <path d="M220,424 L337,424" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="278" y="418" font-size="11" fill="#73726c" text-anchor="middle">spawn instance 1</text>
  <path d="M340,456 L578,456" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="460" y="450" font-size="11" fill="#73726c" text-anchor="middle">exclusive claim: writes the record</text>
  <rect x="270" y="474" width="140" height="36" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="340.0" y="497.0" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">one Watcher runs</text>
</svg>
