<svg xmlns="http://www.w3.org/2000/svg" width="680" height="388" viewBox="0 0 680 388" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Decide inside the lock, act outside it</title>
  <desc>One Pass runs left to right: observe without the lock, stop if the fingerprint is unchanged and the Pass is unforced, change the tracker in one main lock hold, check the Baton, run effects, then settle. A band beneath shows the lock states: the main lock hold commits before any effect runs, and the Airlock sweep then takes short holds of its own.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="386" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Decide inside the lock, act outside it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One Pass, left to right. Only a hold changes the board: the main one, then the Airlock sweep's short ones.</text>
  <rect x="40" y="92" width="92" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="86.0" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Observe</text>
  <text x="50" y="138" font-size="11" fill="#185FA5" text-anchor="start">Watcher events</text>
  <text x="50" y="154" font-size="11" fill="#185FA5" text-anchor="start">Hatch folders</text>
  <text x="50" y="170" font-size="11" fill="#185FA5" text-anchor="start">target tips</text>
  <text x="50" y="186" font-size="11" fill="#185FA5" text-anchor="start">build jobs</text>
  <text x="50" y="202" font-size="11" fill="#185FA5" text-anchor="start">usage marker</text>
  <rect x="147" y="92" width="206" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="250.0" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Main hold</text>
  <text x="157" y="138" font-size="11" fill="#185FA5" text-anchor="start">Hatch requests</text>
  <text x="157" y="154" font-size="11" fill="#185FA5" text-anchor="start">Watcher events, cursor moved</text>
  <text x="157" y="170" font-size="11" fill="#185FA5" text-anchor="start">build observations (git, Customs)</text>
  <text x="157" y="186" font-size="11" fill="#185FA5" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">followPlaybook</text>
  <text x="157" y="202" font-size="11" fill="#185FA5" text-anchor="start">deliveries decided</text>
  <text x="157" y="218" font-size="11" fill="#185FA5" text-anchor="start">token credit</text>
  <rect x="368" y="92" width="62" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="399.0" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Baton</text>
  <text x="399.0" y="138" font-size="11" fill="#185FA5" text-anchor="middle">newest</text>
  <text x="399.0" y="154" font-size="11" fill="#185FA5" text-anchor="middle">generation?</text>
  <rect x="445" y="92" width="108" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="499.0" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Effects</text>
  <text x="455" y="138" font-size="11" fill="#185FA5" text-anchor="start">replies, frames</text>
  <text x="455" y="154" font-size="11" fill="#185FA5" text-anchor="start">worktrees</text>
  <text x="455" y="170" font-size="11" fill="#185FA5" text-anchor="start">Watcher spawns</text>
  <text x="455" y="186" font-size="11" fill="#185FA5" text-anchor="start">answers</text>
  <text x="455" y="202" font-size="11" fill="#185FA5" text-anchor="start">Airlock sweep</text>
  <text x="455" y="218" font-size="11" fill="#185FA5" text-anchor="start">reap</text>
  <rect x="568" y="92" width="72" height="152" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="604.0" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Settle</text>
  <text x="604.0" y="138" font-size="11" fill="#185FA5" text-anchor="middle">state</text>
  <text x="604.0" y="154" font-size="11" fill="#185FA5" text-anchor="middle">notices</text>
  <text x="604.0" y="170" font-size="11" fill="#185FA5" text-anchor="middle">re-observe</text>
  <path d="M353,168.0 L366,168.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,168.0 L443,168.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M553,168.0 L566,168.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M86,244 L86,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="272" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="100" y="288" font-size="11" fill="#0C447C" text-anchor="middle">fingerprint</text>
  <text x="100" y="301" font-size="11" fill="#185FA5" text-anchor="middle">same, unforced: stop</text>
  <path d="M160,290 L200,290 L200,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="208" y="294" font-size="11" fill="#73726c" text-anchor="start">changed or forced</text>
  <path d="M399,244 L399,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="358" y="272" width="82" height="36" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="399" y="288" font-size="11" fill="#791F1F" text-anchor="middle">overtaken:</text>
  <text x="399" y="301" font-size="11" fill="#A32D2D" text-anchor="middle">stop, no effect</text>
  <rect x="40" y="326" width="92" height="30" rx="6" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <rect x="147" y="326" width="206" height="30" rx="6" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="368" y="326" width="272" height="30" rx="6" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <text x="86" y="345" font-size="11" fill="#5F5E5A" text-anchor="middle">no lock</text>
  <text x="250" y="345" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">lock held: the main hold</text>
  <text x="406" y="345" font-size="11" fill="#5F5E5A" text-anchor="middle">no lock</text>
  <rect x="445" y="330" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="475" y="330" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="505" y="330" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="533" y="330" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <text x="499" y="372" font-size="11" fill="#5F5E5A" text-anchor="middle">Airlock sweep: short holds of its own</text>
</svg>
