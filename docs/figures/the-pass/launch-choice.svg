<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Priority orders the queue; free launch slots cut it</title>
  <desc>Six tickets pass through three stages. A ticket on hold and a ticket with a job drop out first. The remaining four are ordered by priority, then phase, readiness and id. Two free launch slots take the first two; the other two launch on a later Pass and block nothing. An interrupted job keeps its launch slot.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Priority orders the queue; free launch slots cut it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Limit 3, one interrupted job keeping its launch slot, so two free. Example values.</text>
  <text x="40" y="104" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">On the board</text>
  <text x="254" y="104" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Candidates, in order</text>
  <text x="468" y="104" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Two free launch slots</text>
  <rect x="40" y="116" width="172" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="141" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#004</text>
  <text x="92" y="141" font-size="11" fill="#5F5E5A" text-anchor="start">high, pending</text>
  <rect x="40" y="164" width="172" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="189" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#003</text>
  <text x="92" y="189" font-size="11" fill="#5F5E5A" text-anchor="start">normal, pending</text>
  <rect x="40" y="212" width="172" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="237" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#008</text>
  <text x="92" y="237" font-size="11" fill="#5F5E5A" text-anchor="start">normal, in-review</text>
  <rect x="40" y="260" width="172" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="285" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#005</text>
  <text x="92" y="285" font-size="11" fill="#5F5E5A" text-anchor="start">low, in-review</text>
  <rect x="40" y="308" width="172" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="52" y="333" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#006</text>
  <text x="92" y="333" font-size="11" fill="#854F0B" text-anchor="start">normal, on hold</text>
  <rect x="40" y="356" width="172" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="52" y="381" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#007</text>
  <text x="92" y="373" font-size="11" fill="#5F5E5A" text-anchor="start">normal, in-progress</text>
  <text x="92" y="388" font-size="11" fill="#5F5E5A" text-anchor="start">job interrupted</text>
  <rect x="254" y="116" width="172" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="266" y="141" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#004</text>
  <text x="306" y="141" font-size="11" fill="#185FA5" text-anchor="start">high, build</text>
  <rect x="254" y="164" width="172" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="266" y="189" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#008</text>
  <text x="306" y="189" font-size="11" fill="#185FA5" text-anchor="start">normal, review</text>
  <rect x="254" y="212" width="172" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="266" y="237" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#003</text>
  <text x="306" y="237" font-size="11" fill="#185FA5" text-anchor="start">normal, build</text>
  <rect x="254" y="260" width="172" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="266" y="285" font-size="13" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#005</text>
  <text x="306" y="285" font-size="11" fill="#185FA5" text-anchor="start">low, review</text>
  <path d="M426,136 L466,136" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="468" y="116" width="172" height="40" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="480" y="141" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#004</text>
  <text x="520" y="141" font-size="11" fill="#3B6D11" text-anchor="start">launches now</text>
  <path d="M426,184 L466,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="468" y="164" width="172" height="40" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="480" y="189" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">#008</text>
  <text x="520" y="189" font-size="11" fill="#3B6D11" text-anchor="start">launches now</text>
  <path d="M240,110 L240,300" stroke="#E1DDD0" stroke-width="1.2" stroke-dasharray="2 4" fill="none"/>
  <text x="468" y="232" font-size="12" fill="#5F5E5A" text-anchor="start">#003 and #005 wait for a</text>
  <text x="468" y="249" font-size="12" fill="#5F5E5A" text-anchor="start">later Pass. Nothing is</text>
  <text x="468" y="266" font-size="12" fill="#5F5E5A" text-anchor="start">blocked: a low ticket</text>
  <text x="468" y="283" font-size="12" fill="#5F5E5A" text-anchor="start">takes any free one.</text>
  <path d="M216,308 L222,308 L222,396 L216,396" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M222,334 L250,334" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="258" y="330" font-size="12" fill="#5F5E5A" text-anchor="start">filtered out: a ticket hold, or a job already</text>
  <text x="258" y="346" font-size="12" fill="#5F5E5A" text-anchor="start">on the ticket</text>
</svg>
