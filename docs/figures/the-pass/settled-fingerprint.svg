<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A Pass stores the fingerprint of the world after its own writes</title>
  <desc>The effects of a Pass write files, then the Pass observes again. With no unread events it stores that hash, so the wake from its own writes matches and is skipped. With unread events it stores null, so the next wake runs. Either way, if a job awaits a Pass or the Airlock sweep launched a job this Pass never saw, the next Pass is forced and queued at once. Otherwise the Pass ends and the next wake decides.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="514" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A Pass stores the fingerprint of the world after its own writes</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The end of runOnePass: what is stored, and what the next wake finds.</text>
  <rect x="40" y="92" width="210" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145.0" y="113.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Effects write</text>
  <text x="145.0" y="130.0" font-size="12" fill="#185FA5" text-anchor="middle">tracker and job folders</text>
  <path d="M145,140 L145,164" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="166" width="210" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145.0" y="187.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Observe again</text>
  <text x="145.0" y="204.0" font-size="12" fill="#185FA5" text-anchor="middle">the settling observation</text>
  <path d="M145,214 L145,250" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="252" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145.0" y="275.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Events still unread?</text>
  <text x="145.0" y="292.0" font-size="12" fill="#185FA5" text-anchor="middle">a Watcher logged meanwhile</text>
  <path d="M250,270 L398,246" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="320" y="246" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <path d="M250,286 L398,312" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="320" y="314" font-size="11" fill="#73726c" text-anchor="middle">no</text>
  <rect x="400" y="222" width="240" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="520.0" y="244.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">lastFingerprint = null</text>
  <text x="520.0" y="261.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the next wake runs</text>
  <rect x="400" y="288" width="240" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="520.0" y="310.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">lastFingerprint = hash</text>
  <text x="520.0" y="327.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the self-wake is skipped</text>
  <path d="M145,304 L145,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="154" y="340" font-size="11" fill="#73726c" text-anchor="start">either way</text>
  <rect x="40" y="368" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="145.0" y="391.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">A job awaits a Pass?</text>
  <text x="145.0" y="408.0" font-size="12" fill="#185FA5" text-anchor="middle">or the Airlock sweep launched one</text>
  <path d="M250,394 L398,394" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="324" y="388" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <rect x="400" y="368" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="391.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Forced, queued at once</text>
  <text x="520.0" y="408.0" font-size="12" fill="#185FA5" text-anchor="middle">no wake needed</text>
  <path d="M145,420 L145,444" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="154" y="436" font-size="11" fill="#73726c" text-anchor="start">no</text>
  <rect x="40" y="446" width="210" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="145.0" y="468.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">The Pass ends</text>
  <text x="145.0" y="485.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the next wake decides</text>
</svg>
