<svg xmlns="http://www.w3.org/2000/svg" width="680" height="336" viewBox="0 0 680 336" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A job advances one hold at a time</title>
  <desc>Three Passes left to right, each a hold above its effects. In Pass 1 the hold puts the job at launching and no effect follows, and the settling observation forces Pass 2. In Pass 2 the hold moves it to preparing and the effects create the worktree and the install Watcher. That Watcher's exit wakes a later Pass N, whose hold moves the job to running and whose effects spawn the session Watcher. Each Pass reads what the last effect left.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="334" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A job advances one hold at a time</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each Pass reads what the last effect left. The shaded band holds the lock.</text>

  <text x="134" y="96" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Pass 1</text>
  <text x="336" y="96" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Pass 2</text>
  <text x="538" y="96" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Pass N</text>

  <rect x="40" y="106" width="600" height="84" rx="8" fill="#E1DDD0" fill-opacity="0.55"/>
  <text x="50" y="122" font-size="11" fill="#5F5E5A" text-anchor="start">hold</text>
  <text x="50" y="222" font-size="11" fill="#5F5E5A" text-anchor="start">effects</text>

  <rect x="52" y="128" width="164" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="134" y="150" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <text x="134" y="168" font-size="12" fill="#185FA5" text-anchor="middle">Playbook: launch-build</text>
  <rect x="254" y="128" width="164" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="336" y="150" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">preparing</text>
  <text x="336" y="168" font-size="12" fill="#185FA5" text-anchor="middle">a launching job observed</text>
  <rect x="456" y="128" width="164" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="538" y="150" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <text x="538" y="168" font-size="12" fill="#185FA5" text-anchor="middle">setup observed installed</text>

  <path d="M134,180 L134,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M336,180 L336,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M538,180 L538,226" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="52" y="228" width="164" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="134" y="250" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">No effect</text>
  <text x="134" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">no worktree yet</text>
  <rect x="254" y="228" width="164" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="336" y="250" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Worktree</text>
  <text x="336" y="268" font-size="12" fill="#185FA5" text-anchor="middle">and the install Watcher</text>
  <rect x="456" y="228" width="164" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="538" y="250" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Session Watcher</text>
  <text x="538" y="268" font-size="12" fill="#185FA5" text-anchor="middle">spawned for the job</text>

  <path d="M134,280 L134,296 L235,296 L235,154 L252,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="134" y="316" font-size="11" fill="#73726c" text-anchor="start">forced: the job awaits a Pass</text>
  <path d="M336,280 L336,296 L437,296 L437,154 L454,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="336" y="316" font-size="11" fill="#73726c" text-anchor="start">file wake: the install Watcher exits</text>
</svg>
