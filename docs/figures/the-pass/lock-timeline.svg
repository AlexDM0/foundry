<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Observe holds no lock, so the main hold trusts the Board it reads</title>
  <desc>A Pass observes without the lock while a verb holds the lock and writes, so a write between the start of the verb hold and the opening of the main hold can be missing from the observation. The verb sends its nudge after it releases the lock, which wakes one more Pass. When the main hold opens it reads the Board again and trusts that: events of a job whose Watcher instance moved are dropped, and a request already logged is skipped. Effects run with the lock free, and the Airlock sweep among them takes short holds.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="320" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Observe holds no lock, so the main hold trusts the Board it reads</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Time runs left to right. A shaded span holds the lock.</text>
  <text x="40" y="132" font-size="12" fill="#5F5E5A" text-anchor="start">verb</text>
  <text x="40" y="202" font-size="12" fill="#5F5E5A" text-anchor="start">Pass</text>
  <text x="40" y="272" font-size="12" fill="#5F5E5A" text-anchor="start">lock</text>
  <rect x="170" y="108" width="110" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="225.0" y="125.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">verb hold</text>
  <text x="225.0" y="142.0" font-size="12" fill="#185FA5" text-anchor="middle">writes</text>
  <path d="M280,128 L290,128 L290,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="298" y="132" font-size="11" fill="#73726c" text-anchor="start">nudge, after release: asks for one more Pass</text>
  <circle cx="290" cy="197" r="4" fill="#185FA5"/>
  <text x="298" y="170" font-size="11" fill="#73726c" text-anchor="start">wake</text>
  <rect x="100" y="178" width="150" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175.0" y="195.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">observe</text>
  <text x="175.0" y="212.0" font-size="12" fill="#185FA5" text-anchor="middle">reads, no lock</text>
  <rect x="300" y="178" width="130" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="365.0" y="195.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">main hold</text>
  <text x="365.0" y="212.0" font-size="12" fill="#185FA5" text-anchor="middle">reads the Board again</text>
  <rect x="445" y="178" width="195" height="40" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="542.5" y="195.0" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">effects</text>
  <text x="542.5" y="212.0" font-size="12" fill="#185FA5" text-anchor="middle">spawns, frames, Airlock sweep</text>
  <path d="M170,224 L170,229 L300,229 L300,224" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="235" y="243" font-size="11" fill="#73726c" text-anchor="middle">a write here can miss the observation</text>
  <rect x="100" y="254" width="540" height="30" rx="6" fill="#FAF9F5" stroke="#bfbdb0" stroke-dasharray="4 3"/>
  <rect x="170" y="254" width="110" height="30" rx="4" fill="#E1DDD0" stroke="#bfbdb0"/>
  <text x="225" y="273" font-size="11" fill="#444441" text-anchor="middle">held by the verb</text>
  <rect x="300" y="254" width="130" height="30" rx="4" fill="#E1DDD0" stroke="#bfbdb0"/>
  <text x="365" y="273" font-size="11" fill="#444441" text-anchor="middle">held by the Pass</text>
  <rect x="520" y="258" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="550" y="258" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="580" y="258" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <rect x="610" y="258" width="20" height="22" rx="3" fill="#E1DDD0" stroke="#bfbdb0"/>
  <text x="575" y="300" font-size="11" fill="#73726c" text-anchor="middle">Airlock sweep: short holds</text>
</svg>
