<svg xmlns="http://www.w3.org/2000/svg" width="680" height="642" viewBox="0 0 680 642" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Pausing alone does not stop a resume</title>
  <desc>The Playbook derives steps in fixed order: outage, missing pipeline decision, withdrawal of a retired pipeline-proposal decision, resumes and replacements, Assistant boot, parking and job-lost, merge queue and launches, then incident defaults. Five columns show which board-wide blocks stop each step; resumesAreHeld spans the first four and newWorkIsHeld all five. Paused stops only the outage check and new work, so it does not stop a resume on its own; withdrawing, parking, replacing and incident defaults run under every block.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="640" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Pausing alone does not stop a resume</text>
  <text x="40" y="68" font-size="13" fill="#73726c">nextStepsOf, top to bottom. An amber dot means that condition blocks the step.</text>
  <text x="506" y="92" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">newWorkIsHeld</text>
  <path d="M372,106 L372,98 L640,98 L640,132" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="478" y="116" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">resumesAreHeld</text>
  <path d="M372,130 L372,122 L586,122 L586,130" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="392" y="146" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">usage</text>
  <text x="392" y="159" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">limit</text>
  <text x="450" y="146" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">install</text>
  <text x="450" y="159" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">change</text>
  <text x="508" y="146" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">no</text>
  <text x="508" y="159" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">pipeline</text>
  <text x="566" y="158" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">outage</text>
  <rect x="596" y="136" width="44" height="448" rx="8" fill="#FAEEDA" fill-opacity="0.45" stroke="#F2DDB0"/>
  <text x="618" y="158" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">paused</text>
  <rect x="40" y="170" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="192" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">1</text>
  <text x="72" y="185" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">pause-overseer, outage decision</text>
  <text x="72" y="199" font-size="11" fill="#185FA5" text-anchor="start">outage is due</text>
  <circle cx="618" cy="188" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <rect x="40" y="216" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="238" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">2</text>
  <text x="72" y="231" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set decision</text>
  <text x="72" y="245" font-size="11" fill="#185FA5" text-anchor="start">no pipeline, decision not open</text>
  <rect x="40" y="262" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="284" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">3</text>
  <text x="72" y="277" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">withdraw-retired-decision</text>
  <text x="72" y="291" font-size="11" fill="#185FA5" text-anchor="start">an open pipeline-proposal decision</text>
  <rect x="40" y="308" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="330" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">4</text>
  <text x="72" y="323" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">resume-job</text>
  <text x="72" y="337" font-size="11" fill="#185FA5" text-anchor="start">interrupted, under the bound</text>
  <circle cx="392" cy="326" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="450" cy="326" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="508" cy="326" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="566" cy="326" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="618" cy="326" r="7" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <rect x="40" y="354" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="376" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">5</text>
  <text x="72" y="369" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">replace-job, park, refresh-intake</text>
  <text x="72" y="383" font-size="11" fill="#185FA5" text-anchor="start">past a bound; also await-answer</text>
  <rect x="40" y="400" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="422" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">6</text>
  <text x="72" y="415" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">boot-assistant</text>
  <text x="72" y="429" font-size="11" fill="#185FA5" text-anchor="start">no Assistant on the board</text>
  <circle cx="392" cy="418" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="450" cy="418" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <rect x="40" y="446" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="468" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">7</text>
  <text x="72" y="461" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">park, open job-lost</text>
  <text x="72" y="475" font-size="11" fill="#185FA5" text-anchor="start">ticket without a job</text>
  <rect x="40" y="492" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="514" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">8</text>
  <text x="72" y="507" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">queue-merge, launches</text>
  <text x="72" y="521" font-size="11" fill="#185FA5" text-anchor="start">launch-review, launch-build, to free launch slots</text>
  <circle cx="392" cy="510" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="450" cy="510" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="508" cy="510" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="566" cy="510" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <circle cx="618" cy="510" r="7" fill="#E9B44C" stroke="#854F0B" stroke-width="1"/>
  <rect x="40" y="538" width="324" height="36" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="56" y="560" font-size="13" font-weight="500" fill="#185FA5" text-anchor="middle">9</text>
  <text x="72" y="553" font-size="12" font-weight="500" fill="#0C447C" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">default-incident</text>
  <text x="72" y="567" font-size="11" fill="#185FA5" text-anchor="start">turn closed or none can boot</text>
  <text x="40" y="596" font-size="12" fill="#73726c" text-anchor="start">A ticket hold, an open question and an agent-configuration hit block further, per job or ticket.</text>
  <text x="40" y="614" font-size="12" fill="#73726c" text-anchor="start">Steps 4 and 5 run as one loop, job by job. The green ring: paused does not stop a resume.</text>
</svg>
