<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Most coordination files end soon; job records never do</title>
<desc>A ladder of spans, shortest at the top. One lock hold: hold-journal.json. One Watcher: its socket, unless the Watcher is killed. Until a later gate takes it over: a gate slot. One filing draft: its file. One Airlock: a refresh-group checkout. Until clear: the rows and the contents of log.jsonl. Until clear --all: tickets and epics. No end: job folders, ticket worktrees, Hatch folders and overseer.log.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="464" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Most coordination files end soon; job records never do</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">Bars show the order of spans, not measured time</text>
<text x="40" y="105" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">One lock hold</text>
<rect x="196" y="94" width="60" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="124" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">hold-journal.json</text>
<text x="40" y="151" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">One Watcher</text>
<rect x="196" y="140" width="100" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="170" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watchers/&lt;hash&gt;.sock</text>
<text x="370" y="170" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">unless the Watcher is killed</text>
<text x="40" y="197" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Until a later gate</text>
<rect x="196" y="186" width="140" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="216" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-slots/slot-&lt;k&gt;</text>
<text x="370" y="216" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">a merge gate's ends with that gate</text>
<text x="40" y="243" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">One filing draft</text>
<rect x="196" y="232" width="180" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="262" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">filing-cabinet/D&lt;n&gt;.json</text>
<text x="40" y="289" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">One Airlock</text>
<rect x="196" y="278" width="225" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="308" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">refresh-group-&lt;name&gt;/</text>
<text x="40" y="335" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Until clear</text>
<rect x="196" y="324" width="285" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="354" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">rows, and the contents of log.jsonl</text>
<text x="40" y="381" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Until clear --all</text>
<rect x="196" y="370" width="350" height="12" rx="3" fill="#E1DDD0" stroke="none"/>
<text x="196" y="400" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">tickets/  epics/</text>
<text x="40" y="427" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">No end</text>
<rect x="196" y="416" width="432" height="12" fill="#E1DDD0" stroke="none"/>
<path d="M628,422 L635,422" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="196" y="446" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">jobs/&lt;J&gt;/  ticket worktrees  hatch/&lt;J&gt;/  overseer.log</text>
</svg>
