<svg xmlns="http://www.w3.org/2000/svg" width="680" height="709" viewBox="0 0 680 709" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A job folder reads top to bottom, one instance at a time</title>
<desc>One job folder in the order files appear across a build: the install step, launch inputs, Watcher records and the event log, delivery markers, gate folders and verdicts, and red-handoff files after a red gate or a Customs refusal. Two dashed paths return to launch as instance n+1 with its own numbered set: a session interrupted while it runs, and a red handoff, which resumes the same session. A passed gate never returns. Every n is a Watcher instance, and g is a gate's position.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="707" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">A job folder reads top to bottom, one instance at a time</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">&lt;data&gt;/jobs/&lt;J&gt;/ across one build; n is the Watcher instance, g the gate's position</text>
<text x="40" y="110" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Prepare</text>
<text x="40" y="128" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Overseer, then</text>
<text x="40" y="144" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">process Watcher</text>
<rect x="170" y="88" width="290" height="58" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="184" y="112" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">install/</text>
<text x="184" y="131" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">worktree-failure.txt</text>
<text x="474" y="110" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">With an install line;</text>
<text x="474" y="127" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">the .txt if git failed</text>
<text x="40" y="184" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Launch</text>
<text x="40" y="202" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Overseer writes</text>
<rect x="170" y="162" width="290" height="134" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="184" y="186" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">start.json</text>
<text x="184" y="205" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">first-message-1.txt</text>
<text x="184" y="224" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">settings.json  agents.json  mcp.json</text>
<text x="184" y="243" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">role.md  report.schema.json</text>
<text x="184" y="262" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">launch-&lt;n&gt;.json</text>
<text x="184" y="281" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">instructions-&lt;n&gt;.json</text>
<text x="474" y="184" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">start.json: once, per job.</text>
<text x="474" y="201" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">first-message: instance 1</text>
<text x="40" y="334" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Session runs</text>
<text x="40" y="352" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Watcher writes</text>
<rect x="170" y="312" width="290" height="77" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="184" y="336" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-&lt;n&gt;.log</text>
<text x="184" y="355" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-&lt;n&gt;.json</text>
<text x="184" y="374" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">events-&lt;n&gt;.ndjson</text>
<text x="474" y="334" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">The report is a line</text>
<text x="474" y="351" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">in the event log</text>
<text x="40" y="427" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Delivery</text>
<text x="40" y="445" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Overseer writes</text>
<rect x="170" y="405" width="290" height="115" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="184" y="429" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">first-message-1.sent</text>
<text x="184" y="448" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">resume-message-&lt;n&gt;.sent</text>
<text x="184" y="467" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">answer-&lt;digest&gt;.delivered</text>
<text x="184" y="486" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">wind-down-sent  input-closed</text>
<text x="184" y="505" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">stop-sent</text>
<text x="474" y="427" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">A marker stops a</text>
<text x="474" y="444" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">second send. A resumed</text>
<text x="474" y="461" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">instance gets resume-</text>
<text x="474" y="478" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">message-&lt;n&gt;.sent</text>
<text x="40" y="558" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Gates</text>
<text x="40" y="576" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Process Watchers,</text>
<text x="40" y="592" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">then Overseer</text>
<rect x="170" y="536" width="290" height="77" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="184" y="560" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-prepare/  gate-&lt;g&gt;/</text>
<text x="184" y="579" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-&lt;g&gt;-verdict.json</text>
<text x="184" y="598" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate.log</text>
<text x="474" y="558" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">g is the gate's position;</text>
<text x="474" y="575" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">instance 2 adds -&lt;n&gt;</text>
<text x="40" y="651" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Red handoff</text>
<text x="40" y="669" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">Overseer writes</text>
<rect x="170" y="629" width="290" height="58" rx="10" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="184" y="653" font-size="12" font-weight="400" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-failure.md</text>
<text x="184" y="672" font-size="12" font-weight="400" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">red-handoff.json</text>
<text x="474" y="651" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">After a red gate or</text>
<text x="474" y="668" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">Customs refusal</text>
<text x="474" y="266" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">Any resume: instance n+1</text>
<path d="M460,376 L634,376" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="474" y="370" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">interrupted</text>
<path d="M460,674 L634,674 L634,282 L463,282" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="474" y="689" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">red, same session</text>
</svg>
