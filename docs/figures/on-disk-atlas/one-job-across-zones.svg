<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>One job leaves traces in five places, and the key changes by zone</title>
<desc>Job J leaves traces in five places, found by job id, ticket id, a hash, or a path slug. Its record is in the data folder under the job id, its code in the ticket worktree under the ticket id, its working folder and Hatch files in the worktrees folder under the job id, its socket in the monitor folder under a hash of tracker, job and instance, and its transcripts in the vendor folder under a slug of the working directory, read only. The socket stays if the Watcher is killed.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="446" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">One job leaves traces in five places, and the key changes by zone</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">The label on each line is what finds that path</text>
<rect x="300" y="92" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="314" y="115" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/jobs/&lt;J&gt;/</text>
<text x="314" y="133" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">The record of the job</text>
<rect x="300" y="162" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="314" y="185" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;worktrees&gt;/ticket-&lt;id&gt;/</text>
<text x="314" y="203" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">The code; every job of the ticket</text>
<rect x="300" y="232" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="314" y="255" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;worktrees&gt;/sessions/&lt;J&gt;/  hatch/&lt;J&gt;/</text>
<text x="314" y="273" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">No-worktree folder; Hatch files</text>
<rect x="300" y="302" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="314" y="325" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;monitor&gt;/watchers/&lt;hash&gt;.sock</text>
<text x="314" y="343" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Stays if the Watcher is killed</text>
<rect x="300" y="372" width="340" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-dasharray="5 4"/>
<text x="314" y="395" font-size="12" font-weight="500" fill="#712B13" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.claude/projects/&lt;slug&gt;/</text>
<text x="314" y="413" font-size="12" font-weight="400" fill="#993C1D" text-anchor="start">Vendor transcripts, read only</text>
<rect x="40" y="232.0" width="76" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="78" y="265.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Job J</text>
<path d="M116,260.0 L134,260.0" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M134,120.0 L134,400.0" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M134,120.0 L297,120.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="144" y="114.0" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">job id</text>
<path d="M134,190.0 L297,190.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="144" y="184.0" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">ticket id</text>
<path d="M134,260.0 L297,260.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="144" y="254.0" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">job id</text>
<path d="M134,330.0 L297,330.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="144" y="324.0" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">hash of tracker, job, instance</text>
<path d="M134,400.0 L297,400.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="144" y="394.0" font-size="11" font-weight="400" fill="#73726c" text-anchor="start">slug of working directory</text>
</svg>
