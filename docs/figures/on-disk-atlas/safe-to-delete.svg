<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>May a file be deleted by hand? Most may not</title>
<desc>Four classes of file, by whether a person may delete it. Yes: progress.html, overseer.log and projects.json. update restores: session-instructions.md, reference.md, briefs/defaults/ and the skills. With a condition: Baton pass files, merge gate profiles, old Watcher bundles, the usage marker and the job folders of delivered tickets. Never: progress.json, log.jsonl, pipeline.json, tickets, epics, hold-journal.json and baton files.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="998" height="460" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">May a file be deleted by hand? Most may not</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">The main files of each class; the path tables give every condition</text>
<rect x="40" y="88" width="215" height="352" rx="12" fill="#EAF3DE" stroke="#D3E6BC"/>
<text x="56" y="116" font-size="16" font-weight="500" fill="#27500A" text-anchor="start">Yes</text>
<text x="56" y="136" font-size="13" font-weight="400" fill="#3B6D11" text-anchor="start">The board runs on without it</text>
<text x="56" y="168" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">progress.html</text>
<text x="56" y="186" font-size="13" font-weight="400" fill="#3B6D11" text-anchor="start">a stub, rewritten</text>
<text x="56" y="214" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">overseer.log</text>
<text x="56" y="232" font-size="13" font-weight="400" fill="#3B6D11" text-anchor="start">lines for people</text>
<text x="56" y="260" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">projects.json</text>
<text x="56" y="278" font-size="13" font-weight="400" fill="#3B6D11" text-anchor="start">re-added; its Overseer pointer</text>
<text x="56" y="296" font-size="13" font-weight="400" fill="#3B6D11" text-anchor="start">returns at the next start</text>
<rect x="270" y="88" width="215" height="352" rx="12" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="286" y="116" font-size="16" font-weight="500" fill="#444441" text-anchor="start">update restores</text>
<text x="286" y="136" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Installed files</text>
<text x="286" y="168" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">session-instructions.md</text>
<text x="286" y="186" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">the session hook prints it</text>
<text x="286" y="214" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">reference.md</text>
<text x="286" y="232" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">for agents</text>
<text x="286" y="260" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">briefs/defaults/</text>
<text x="286" y="278" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">a missing file stops a launch</text>
<text x="286" y="306" font-size="13" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/skills/</text>
<text x="286" y="324" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">a file User added stays</text>
<rect x="500" y="88" width="230" height="352" rx="12" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="516" y="116" font-size="16" font-weight="500" fill="#633806" text-anchor="start">With a condition</text>
<text x="516" y="136" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">Check it first</text>
<text x="516" y="168" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">baton-pass-&lt;n&gt;.json</text>
<text x="516" y="186" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">no Baton pass runs</text>
<text x="516" y="214" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">merge-gate-profiles/</text>
<text x="516" y="232" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">no merge gate runs</text>
<text x="516" y="260" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-&lt;codeVersion&gt;.js</text>
<text x="516" y="278" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">not the live code version</text>
<text x="516" y="306" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">usage-limit.json</text>
<text x="516" y="324" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">resetsAt has passed</text>
<text x="516" y="352" font-size="13" font-weight="500" fill="#633806" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">jobs/&lt;J&gt;/</text>
<text x="516" y="370" font-size="13" font-weight="400" fill="#854F0B" text-anchor="start">the ticket is delivered</text>
<rect x="745" y="88" width="215" height="352" rx="12" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="761" y="116" font-size="16" font-weight="500" fill="#791F1F" text-anchor="start">Never</text>
<text x="761" y="136" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">Records and proofs</text>
<text x="761" y="168" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">progress.json</text>
<text x="761" y="186" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">the board itself</text>
<text x="761" y="214" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">log.jsonl</text>
<text x="761" y="232" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">the Board reads it as input</text>
<text x="761" y="260" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json</text>
<text x="761" y="278" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">the gates</text>
<text x="761" y="306" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">tickets/  epics/</text>
<text x="761" y="324" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">the work</text>
<text x="761" y="352" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">hold-journal.json</text>
<text x="761" y="370" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">the only redo record</text>
<text x="761" y="398" font-size="13" font-weight="500" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">baton-&lt;n&gt;.json</text>
<text x="761" y="416" font-size="13" font-weight="400" fill="#A32D2D" text-anchor="start">which Overseer is in charge</text>
</svg>
