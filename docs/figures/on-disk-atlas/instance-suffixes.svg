<svg xmlns="http://www.w3.org/2000/svg" width="680" height="402" viewBox="0 0 680 402" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>No suffix does not mean shared</title>
<desc>Five families, with instance 1 and instance 2 side by side. launch-1.json and launch-2.json are always numbered. These three markers read stop-sent and then stop-sent-2. A gate folder reads gate-1/ and then gate-1-2/. start.json has no suffix and both instances share it. settings.json and role.md also have no suffix, but instance 2 replaces them, so no suffix does not mean shared.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="400" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">No suffix does not mean shared</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">One example of each family, side by side</text>
<text x="345.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Instance 1</text>
<text x="545.0" y="100" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">Instance 2</text>
<text x="40" y="133" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Always numbered</text>
<text x="40" y="150" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">launch, watcher, events, .sent files</text>
<rect x="250" y="114" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="345.0" y="141" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launch-1.json</text>
<rect x="450" y="114" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="545.0" y="141" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">launch-2.json</text>
<text x="40" y="189" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Numbered from instance 2</text>
<text x="40" y="206" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">wind-down, input-closed, stop</text>
<rect x="250" y="170" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="345.0" y="197" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop-sent</text>
<rect x="450" y="170" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="545.0" y="197" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stop-sent-2</text>
<text x="40" y="245" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Gate folder</text>
<text x="40" y="262" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">gate 1; from instance 2, gate-1-2/</text>
<rect x="250" y="226" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="345.0" y="253" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1/</text>
<rect x="450" y="226" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="545.0" y="253" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1-2/</text>
<text x="40" y="301" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Shared</text>
<text x="40" y="318" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">one file, written once</text>
<rect x="250" y="282" width="390" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="445.0" y="309" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">start.json</text>
<text x="40" y="357" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Overwritten</text>
<text x="40" y="374" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">latest instance only</text>
<rect x="250" y="338" width="390" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="445.0" y="357" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">settings.json  role.md</text>
<text x="445.0" y="374" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">instance 2 replaces them</text>
</svg>
