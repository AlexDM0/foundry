ace,Menlo,Consolas,monospace">.claude/</text><text x="474" y="166" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Installed, one repository</text><text x="474" y="190" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">skills/&lt;skill&gt;/</text><text x="474" y="208" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">settings.local.json</text><rect x="40" y="358" width="600" height="176" rx="12" fill="none" stroke="#E1DDD0" stroke-width="1.2"/><text x="56" y="382" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Home folder</text><text x="136" y="382" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">outside every repository</text><rect x="56" y="392" width="170" height="128" rx="10" fill="#F1EFE8" stroke="#E1DDD0"/><text x="70" y="416" font-size="14" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;monitor&gt;/</text><text x="70" y="434" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">The whole machine</text><text x="70" y="458" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">projects.json</text><text x="70" y="476" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">usage-limit.json</text><text x="70" y="494" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-slots/</text><text x="70" y="512" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watchers/*.sock</text><rect x="238" y="392" width="232" height="128" rx="10" fill="#FAECE7" stroke="#F3D2C5" stroke-dasharray="5 4"/><text x="252" y="416" font-size="14" font-