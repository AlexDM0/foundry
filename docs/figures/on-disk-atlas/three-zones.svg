<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A job's record is in &lt;data&gt;, its code in &lt;worktrees&gt;</title>
<desc>Files live in two places. Inside the repository: the data folder for one board, shared by every worktree, with one folder per job; the worktrees folder with the code agents change and each job's Hatch files; and the installed .claude items. In the home folder: the monitor folder for the whole machine, the optional login item, and the vendor transcripts, which this system reads and never writes. Each zone has one scope, a board, a repository or the machine: a job's record is in the data folder, not the worktrees folder.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
