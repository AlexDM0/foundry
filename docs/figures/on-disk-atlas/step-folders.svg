<svg xmlns="http://www.w3.org/2000/svg" width="680" height="459" viewBox="0 0 680 459" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A step's run is inside its folder, its verdict beside it</title>
<desc>The folder install/ holds a step run and has no verdict file. The folders gate-prepare/ and gate-1/ each hold a step run, with their verdict as a file beside the folder, not inside it. Expanded, gate-1/ holds launch-1.json, watcher-1.json, events-1.ndjson, watcher-1.log and process-sandbox.sb. gate.log exists once per job and holds the newest failed gate-prepare or gate; a failed install writes none. gate-failure.md exists once per job and holds the newest red gate or Customs refusal.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="457" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">A step's run is inside its folder, its verdict beside it</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">One job at instance 1; from instance 2 each gate name adds -&lt;n&gt;</text>
<text x="40" y="98" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;/jobs/&lt;J&gt;/</text>
<text x="400" y="98" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="start">Beside the folder</text>
<rect x="60" y="114" width="270" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="74" y="139" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">install/</text>
<text x="400" y="139" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">No verdict file, no gate.log</text>
<rect x="60" y="166" width="270" height="40" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="74" y="191" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-prepare/</text>
<path d="M330,186 L396,186" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<text x="400" y="191" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-prepare-verdict.json</text>
<rect x="60" y="218" width="270" height="141" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="74" y="243" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1/</text>
<text x="90" y="266" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">launch-1.json</text>
<text x="90" y="285" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-1.json</text>
<text x="90" y="304" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">events-1.ndjson</text>
<text x="90" y="323" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">watcher-1.log</text>
<text x="90" y="342" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">process-sandbox.sb</text>
<path d="M330,238 L396,238" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<text x="400" y="243" font-size="12" font-weight="400" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-1-verdict.json</text>
<rect x="60" y="377" width="270" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="74" y="402" font-size="12" font-weight="400" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate.log</text>
<text x="74" y="422" font-size="12" font-weight="400" fill="#791F1F" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gate-failure.md</text>
<text x="400" y="402" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">Newest failed gate-prepare or gate</text>
<text x="400" y="422" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">Newest red gate or Customs refusal</text>
</svg>
