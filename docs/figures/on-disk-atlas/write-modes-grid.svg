<svg xmlns="http://www.w3.org/2000/svg" width="680" height="358" viewBox="0 0 680 358" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Two questions place every write mode</title>
<desc>A grid of two questions. Columns ask whether one caller wins or every caller writes; rows ask whether a reader sees whole files or can see a partial file. createFileAtomically wins and shows whole files. writeFileAtomically writes for every caller and shows whole files. writeFileSync with flag wx wins but can be read mid-write. Plain write and append write for every caller and can be read partial, so each reader catches a failed parse or only tests for existence.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="356" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a" text-anchor="start">Two questions place every write mode</text>
<text x="40" y="68" font-size="13" font-weight="400" fill="#73726c" text-anchor="start">Each cell is one call, with what uses it</text>
<rect x="196" y="92" width="216" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="304.0" y="114" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">One caller wins</text>
<rect x="424" y="92" width="216" height="34" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="532.0" y="114" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Every caller writes</text>
<text x="40" y="181.0" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Reader sees</text>
<text x="40" y="199.0" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">whole files</text>
<rect x="196" y="138" width="216" height="94" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="210" y="164" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">createFileAtomically</text>
<text x="210" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Baton generations, lock</text>
<text x="210" y="204" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">generations, the first write</text>
<text x="210" y="222" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">of watcher-&lt;n&gt;.json</text>
<rect x="424" y="138" width="216" height="94" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="438" y="164" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">writeFileAtomically</text>
<text x="438" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">The stores, instruction</text>
<text x="438" y="204" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">files, Baton pass reports</text>
<text x="40" y="287.0" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="start">Reader can see</text>
<text x="40" y="305.0" font-size="12" font-weight="400" fill="#73726c" text-anchor="start">a partial file</text>
<rect x="196" y="244" width="216" height="94" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="210" y="270" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">writeFileSync, flag wx</text>
<text x="210" y="292" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Gate slots, repair patches</text>
<rect x="424" y="244" width="216" height="94" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="438" y="270" font-size="12" font-weight="500" fill="#444441" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Plain write and append</text>
<text x="438" y="292" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Markers, step verdicts,</text>
<text x="438" y="310" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">event logs</text>
</svg>
