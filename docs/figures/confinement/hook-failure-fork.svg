<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The guard fails closed once it starts, and open if it cannot</title>
  <desc>From a launched hook command, a program that starts and admits prints nothing and the call goes on. A program that starts and meets any failure prints a deny and exits 0, so the call is refused. A command that cannot start lets the call through, leaving Bash the sandbox and WebFetch the classifier.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The guard fails closed once it starts, and open if it cannot</text>
  <text x="40" y="68" font-size="13" fill="#73726c">what one Bash or WebFetch call meets, by what became of the hook</text>

  <rect x="40" y="154" width="130" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="105" y="182" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Hook launched</text>
  <text x="105" y="200" font-size="12" fill="#185FA5" text-anchor="middle">before the call</text>

  <rect x="230" y="92" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="315" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Starts, admits</text>
  <text x="315" y="134" font-size="12" fill="#185FA5" text-anchor="middle">prints nothing</text>
  <rect x="230" y="158" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="315" y="182" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Starts, anything fails</text>
  <text x="315" y="200" font-size="12" fill="#185FA5" text-anchor="middle">prints deny, exits 0</text>
  <rect x="230" y="224" width="170" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="315" y="248" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Cannot start</text>
  <text x="315" y="266" font-size="12" fill="#993C1D" text-anchor="middle">not found on PATH</text>

  <path d="M170,172 L200,172 L200,120 L228,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,186 L228,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,200 L200,200 L200,252 L228,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M400,120 L448,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M400,186 L448,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M400,252 L448,252" fill="none" stroke="#D85A30" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="450" y="92" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="545" y="116" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Call goes on</text>
  <text x="545" y="134" font-size="12" fill="#5F5E5A" text-anchor="middle">to the next layer</text>
  <rect x="450" y="158" width="190" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="545" y="191" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused</text>
  <rect x="450" y="224" width="190" height="56" rx="8" fill="#F5C4B3" stroke="#D85A30" stroke-width="1.5"/>
  <text x="545" y="248" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Bash has the sandbox;</text>
  <text x="545" y="266" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">WebFetch, the classifier</text>
</svg>
