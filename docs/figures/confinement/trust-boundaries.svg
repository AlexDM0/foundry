<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Untrusted text crosses at named places, all but one checked by code</title>
  <desc>An agent session and a gate process sit on the untrusted side, the Overseer in the middle, and the Bridge and User on the right. The agent crosses by the Hatch, its branch, its report and the event log, each checked by code, and by a pipeline agent's proposal, which runs as the Overseer, twice, unchecked. Agent HTML reaches the Bridge only through srcdoc, and the Bridge reaches the Overseer through the guarded API.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Untrusted text crosses at named places, all but one checked by code</text>
  <text x="40" y="68" font-size="13" fill="#73726c">nothing on the left can reach the right except through the middle</text>

  <text x="110" y="100" font-size="12" fill="#73726c" text-anchor="middle">untrusted</text>
  <text x="362" y="100" font-size="12" fill="#73726c" text-anchor="middle">decides</text>
  <text x="570" y="100" font-size="12" fill="#73726c" text-anchor="middle">shows and answers</text>
  <path d="M180,92 L180,536" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <path d="M498,92 L498,536" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 5"/>

  <rect x="40" y="116" width="130" height="288" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="105" y="254" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent session</text>
  <text x="105" y="273" font-size="12" fill="#993C1D" text-anchor="middle">in its sandbox</text>

  <rect x="40" y="444" width="130" height="72" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="105" y="474" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Gate process</text>
  <text x="105" y="493" font-size="12" fill="#993C1D" text-anchor="middle">in Seatbelt</text>

  <rect x="300" y="116" width="124" height="400" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="362" y="310" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
  <text x="362" y="329" font-size="12" fill="#185FA5" text-anchor="middle">decides from code</text>

  <path d="M170,152 L298,152" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="132" font-size="11" fill="#73726c" text-anchor="middle">Hatch</text>
  <text x="238" y="145" font-size="11" fill="#73726c" text-anchor="middle">Bouncer checks</text>
  <path d="M170,208 L298,208" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="188" font-size="11" fill="#73726c" text-anchor="middle">branch: Customs</text>
  <text x="240" y="201" font-size="11" fill="#73726c" text-anchor="middle">reads, Airlock lands</text>
  <path d="M170,264 L298,264" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="244" font-size="11" fill="#73726c" text-anchor="middle">report: a claim</text>
  <text x="238" y="257" font-size="11" fill="#73726c" text-anchor="middle">compared with git</text>
  <path d="M170,320 L298,320" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="300" font-size="11" fill="#73726c" text-anchor="middle">event log</text>
  <text x="238" y="313" font-size="11" fill="#73726c" text-anchor="middle">mapped, not obeyed</text>
  <path d="M170,376 L298,376" fill="none" stroke="#D85A30" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="343" font-size="11" fill="#993C1D" text-anchor="middle">proposal: runs as</text>
  <text x="240" y="356" font-size="11" fill="#993C1D" text-anchor="middle">the Overseer, twice,</text>
  <text x="240" y="369" font-size="11" fill="#993C1D" text-anchor="middle">unchecked</text>
  <path d="M170,480 L298,480" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="238" y="460" font-size="11" fill="#73726c" text-anchor="middle">exit code, tree diff</text>
  <text x="238" y="473" font-size="11" fill="#73726c" text-anchor="middle">gate output as text</text>

  <rect x="510" y="116" width="130" height="200" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="575" y="212" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Bridge</text>
  <text x="575" y="231" font-size="12" fill="#5F5E5A" text-anchor="middle">in a browser</text>

  <path d="M424,170 L508,170" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="461" y="150" font-size="11" fill="#73726c" text-anchor="middle">agent HTML:</text>
  <text x="461" y="163" font-size="11" fill="#73726c" text-anchor="middle">srcdoc only</text>
  <path d="M508,270 L426,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="461" y="250" font-size="11" fill="#73726c" text-anchor="middle">API</text>
  <text x="461" y="263" font-size="11" fill="#73726c" text-anchor="middle">guarded</text>

  <rect x="510" y="444" width="130" height="72" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="575" y="485" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">User</text>
  <path d="M575,444 L575,318" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="566" y="378" font-size="11" fill="#73726c" text-anchor="end">reads,</text>
  <text x="566" y="391" font-size="11" fill="#73726c" text-anchor="end">answers</text>
</svg>
