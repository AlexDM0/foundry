<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each layer holds one thing, and Customs assumes one leaked</title>
  <desc>An agent session sits inside five nested layers: removed tools, the guard hook, permission rules, the standing reply and the Claude sandbox. Edit, Write, Read and WebFetch leave through a gap in the sandbox ring, so only the inner rings hold them. After the session Customs reads git and the log, assuming a layer leaked.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="568" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Each layer holds one thing; Customs assumes one leaked</text>
  <text x="40" y="68" font-size="13" fill="#73726c">from what the session cannot call to what Bash cannot do</text>

  <rect x="40" y="88" width="600" height="340" rx="12" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="58" y="112" font-size="14" font-weight="500" fill="#0C447C">Claude sandbox</text>
  <text x="622" y="112" font-size="12" fill="#185FA5" text-anchor="end">what Bash and its children may write, read, reach</text>

  <rect x="58" y="124" width="564" height="290" rx="11" fill="#F4F9FE" stroke="#CFE2F6"/>
  <text x="76" y="148" font-size="14" font-weight="500" fill="#0C447C">Standing reply</text>
  <text x="604" y="148" font-size="12" fill="#185FA5" text-anchor="end">any permission prompt but a question: denied at once</text>

  <rect x="76" y="160" width="528" height="240" rx="10" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="94" y="184" font-size="14" font-weight="500" fill="#0C447C">Permission rules</text>
  <text x="586" y="184" font-size="12" fill="#185FA5" text-anchor="end">what Edit, Write, Read and git verbs may touch</text>

  <rect x="94" y="196" width="492" height="190" rx="9" fill="#F4F9FE" stroke="#9FC5EA" stroke-dasharray="6 4"/>
  <text x="112" y="220" font-size="14" font-weight="500" fill="#0C447C">Guard hook</text>
  <text x="568" y="220" font-size="12" fill="#185FA5" text-anchor="end">only with a network list: a domain off it</text>

  <rect x="112" y="232" width="456" height="140" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130" y="256" font-size="14" font-weight="500" fill="#0C447C">Removed tools</text>
  <text x="550" y="256" font-size="12" fill="#185FA5" text-anchor="end">what the session cannot call at all</text>

  <rect x="130" y="274" width="260" height="84" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="260" y="308" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Agent session</text>
  <text x="260" y="328" font-size="12" fill="#993C1D" text-anchor="middle">its text and its repository: hostile</text>

  <rect x="400" y="425" width="60" height="6" fill="#FAF9F5"/>
  <path d="M390,316 L430,316 L430,468" fill="none" stroke="#D85A30" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="442" y="446" font-size="11" fill="#993C1D">Edit, Write, Read, WebFetch skip this ring</text>

  <path d="M200,428 L200,466" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="210" y="452" font-size="11" fill="#73726c">session ended, report in hand</text>

  <rect x="40" y="468" width="320" height="60" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-dasharray="6 4"/>
  <text x="200" y="493" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Customs</text>
  <text x="200" y="512" font-size="12" fill="#185FA5" text-anchor="middle">reads git and the log, believing nothing it was told</text>

  <rect x="380" y="470" width="260" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="510" y="494" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">No sandbox on this path</text>
  <text x="510" y="512" font-size="12" fill="#993C1D" text-anchor="middle">held by the inner rings</text>

  <text x="340" y="556" font-size="12" fill="#73726c" text-anchor="middle">Customs alone runs after the fact, and only for builders, reviewers and onboarders.</text>
</svg>
