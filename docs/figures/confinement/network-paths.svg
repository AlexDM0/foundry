<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Two doors and a granting classifier: one rule, four guards</title>
  <desc>A Bash call passes the guard hook, which reads only a requested allowed_domains field, then the sandbox proxy with a strict allow list, and reaches a listed domain. A WebFetch call meets removed tools when the list is empty, then the guard hook on the URL's host, then an allow rule, and fetches a listed domain. The allow rule only grants and the classifier fetched off-list domains, so the hook must deny first.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Two doors and a granting classifier: one rule, four guards</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a builder or reviewer; with an empty list WebFetch is removed and no hook runs</text>

  <rect x="40" y="92" width="96" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="88" y="116" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Bash call</text>
  <text x="88" y="134" font-size="12" fill="#993C1D" text-anchor="middle">any command</text>
  <rect x="280" y="92" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Guard hook</text>
  <text x="335" y="134" font-size="11" fill="#185FA5" text-anchor="middle">allowed_domains</text>
  <rect x="432" y="92" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="487" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Sandbox proxy</text>
  <text x="487" y="134" font-size="12" fill="#185FA5" text-anchor="middle">strictAllowlist</text>
  <rect x="570" y="92" width="70" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="605" y="116" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Reaches</text>
  <text x="605" y="134" font-size="12" fill="#3B6D11" text-anchor="middle">listed</text>

  <path d="M136,120 L278,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M390,120 L430,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="410" y="112" font-size="11" fill="#73726c" text-anchor="middle">silent</text>
  <path d="M542,120 L568,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M335,148 L335,172" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M487,148 L487,172" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="280" y="174" width="110" height="36" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="335" y="197" font-size="12" fill="#791F1F" text-anchor="middle">asked off list</text>
  <rect x="432" y="174" width="110" height="36" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="487" y="197" font-size="12" fill="#791F1F" text-anchor="middle">connection refused</text>
  <text x="40" y="190" font-size="12" fill="#73726c">A plain curl asks nothing:</text>
  <text x="40" y="206" font-size="12" fill="#73726c">the hook stays silent.</text>

  <rect x="40" y="248" width="96" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="88" y="272" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">WebFetch</text>
  <text x="88" y="290" font-size="12" fill="#993C1D" text-anchor="middle">a URL</text>
  <rect x="164" y="248" width="88" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="208" y="272" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">Removed</text>
  <text x="208" y="290" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">tools</text>
  <rect x="280" y="248" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="335" y="272" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Guard hook</text>
  <text x="335" y="290" font-size="12" fill="#185FA5" text-anchor="middle">the URL's host</text>
  <rect x="432" y="248" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="487" y="272" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Allow rule</text>
  <text x="487" y="290" font-size="12" fill="#185FA5" text-anchor="middle">no sandbox here</text>
  <rect x="570" y="248" width="70" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="605" y="272" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Fetches</text>
  <text x="605" y="290" font-size="12" fill="#3B6D11" text-anchor="middle">listed</text>

  <path d="M136,276 L162,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M252,276 L278,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M390,276 L430,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="410" y="268" font-size="11" fill="#73726c" text-anchor="middle">silent</text>
  <path d="M542,276 L568,276" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M208,304 L208,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M335,304 L335,328" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="150" y="330" width="116" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="208" y="352" font-size="12" fill="#791F1F" text-anchor="middle">empty list:</text>
  <text x="208" y="368" font-size="12" fill="#791F1F" text-anchor="middle">tool removed</text>
  <rect x="280" y="330" width="110" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="335" y="360" font-size="12" fill="#791F1F" text-anchor="middle">off the list: denied</text>
  <path d="M487,304 L487,330" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <rect x="412" y="332" width="228" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="526" y="353" font-size="12" fill="#5F5E5A" text-anchor="middle">An allow rule only grants. The</text>
  <text x="526" y="369" font-size="12" fill="#5F5E5A" text-anchor="middle">classifier fetched off-list domains,</text>
  <text x="526" y="385" font-size="12" fill="#5F5E5A" text-anchor="middle">so the hook must deny first.</text>
</svg>
