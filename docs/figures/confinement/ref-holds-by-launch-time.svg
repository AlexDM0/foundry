<svg xmlns="http://www.w3.org/2000/svg" width="680" height="436" viewBox="0 0 680 436" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The deny list and V14 overlap, except on another job's later branch</title>
  <desc>A grid of ref kinds against the launch deny list and Customs check V14. The main line, group refs and other tickets' branches at launch are denied, and every other ref but a job's is found moved by V14. Only another job's branch created after launch is on no list and exempt from V14, so neither holds it.</desc>
  <rect x="1" y="1" width="678" height="434" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The deny list and V14 overlap, except on another job's later branch</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a builder or reviewer: who holds a ref, by whose it is and when it appeared</text>
  <g font-size="12" text-anchor="middle">
  <text x="350" y="100" font-weight="500" fill="#3d3d3a">Deny list</text>
  <text x="470" y="100" font-weight="500" fill="#3d3d3a">V14</text>
  <text x="590" y="100" font-weight="500" fill="#3d3d3a">Held?</text>
  </g>
  <text x="40" y="135" font-size="13" font-weight="500" fill="#3d3d3a">Main line, group-* at launch</text>
  <rect x="290" y="112" width="110" height="36" rx="5" fill="#FCEBEB" stroke="#F3D2D2" stroke-width="1"/>
  <text x="345" y="135" font-size="12" fill="#791F1F" text-anchor="middle">denied</text>
  <rect x="410" y="112" width="110" height="36" rx="5" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="465" y="135" font-size="12" fill="#0C447C" text-anchor="middle">finds a move</text>
  <rect x="530" y="112" width="110" height="36" rx="5" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="585" y="135" font-size="12" fill="#27500A" text-anchor="middle">held</text>
  <text x="40" y="175" font-size="13" font-weight="500" fill="#3d3d3a">Tags, remotes, other refs at launch</text>
  <rect x="290" y="152" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="345" y="175" font-size="12" fill="#5F5E5A" text-anchor="middle">no rule</text>
  <rect x="410" y="152" width="110" height="36" rx="5" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="465" y="175" font-size="12" fill="#0C447C" text-anchor="middle">finds a move</text>
  <rect x="530" y="152" width="110" height="36" rx="5" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="585" y="175" font-size="12" fill="#27500A" text-anchor="middle">afterwards</text>
  <text x="40" y="215" font-size="13" font-weight="500" fill="#3d3d3a">group-* created after launch</text>
  <rect x="290" y="192" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="345" y="215" font-size="12" fill="#5F5E5A" text-anchor="middle">no rule</text>
  <rect x="410" y="192" width="110" height="36" rx="5" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="465" y="215" font-size="12" fill="#0C447C" text-anchor="middle">finds a move</text>
  <rect x="530" y="192" width="110" height="36" rx="5" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="585" y="215" font-size="12" fill="#27500A" text-anchor="middle">afterwards</text>
  <text x="40" y="255" font-size="13" font-weight="500" fill="#3d3d3a">Any ref created after launch</text>
  <rect x="290" y="232" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="345" y="255" font-size="12" fill="#5F5E5A" text-anchor="middle">no rule</text>
  <rect x="410" y="232" width="110" height="36" rx="5" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="465" y="255" font-size="12" fill="#0C447C" text-anchor="middle">finds a move</text>
  <rect x="530" y="232" width="110" height="36" rx="5" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="585" y="255" font-size="12" fill="#27500A" text-anchor="middle">afterwards</text>
  <text x="40" y="295" font-size="13" font-weight="500" fill="#3d3d3a">Its own branch</text>
  <rect x="290" y="272" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="345" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle">its to move</text>
  <rect x="410" y="272" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="465" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle">exempt</text>
  <rect x="530" y="272" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="585" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle">not needed</text>
  <text x="40" y="335" font-size="13" font-weight="500" fill="#3d3d3a">Another job's branch at launch</text>
  <rect x="290" y="312" width="110" height="36" rx="5" fill="#FCEBEB" stroke="#F3D2D2" stroke-width="1"/>
  <text x="345" y="335" font-size="12" fill="#791F1F" text-anchor="middle">denied</text>
  <rect x="410" y="312" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="465" y="335" font-size="12" fill="#5F5E5A" text-anchor="middle">exempt</text>
  <rect x="530" y="312" width="110" height="36" rx="5" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="585" y="335" font-size="12" fill="#27500A" text-anchor="middle">held</text>
  <text x="40" y="375" font-size="13" font-weight="500" fill="#3d3d3a">Another job's branch, later</text>
  <rect x="290" y="352" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="345" y="375" font-size="12" fill="#5F5E5A" text-anchor="middle">no rule</text>
  <rect x="410" y="352" width="110" height="36" rx="5" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="465" y="375" font-size="12" fill="#5F5E5A" text-anchor="middle">exempt</text>
  <rect x="530" y="352" width="110" height="36" rx="5" fill="#F5C4B3" stroke="#D85A30" stroke-width="1.5"/>
  <text x="585" y="375" font-size="12" fill="#712B13" text-anchor="middle">neither</text>
  <text x="40" y="412" font-size="12" fill="#73726c">Merge agents have no V14. A pipeline agent's V14 exempts nothing.</text>
</svg>
