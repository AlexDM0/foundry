<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Bash writes three regions; the shared .git has named holes</title>
  <desc>A builder's Bash writes its worktree except .claude, its Hatch folder and gates' writes folders, and the shared .git. Inside the shared .git, objects, its own branch and any ref no deny names stay open, while packed-refs, main-line, group and other ticket refs and other admin folders are denied. The data and monitor folders sit outside and are denied.</desc>
  <rect x="1" y="1" width="678" height="430" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Bash writes three regions; the shared .git has named holes</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a builder or reviewer; red is denied to Bash and to Edit and Write alike</text>

  <rect x="40" y="88" width="250" height="128" rx="10" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="56" y="112" font-size="14" font-weight="500" fill="#27500A">Its worktree</text>
  <text x="56" y="130" font-size="12" fill="#3B6D11">every file of the branch</text>
  <rect x="56" y="148" width="218" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="165" y="178" font-size="12" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/</text>

  <rect x="40" y="228" width="250" height="76" rx="10" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="56" y="252" font-size="14" font-weight="500" fill="#27500A">Named on allowWrite</text>
  <text x="56" y="272" font-size="12" fill="#3B6D11">its own Hatch folder</text>
  <text x="56" y="289" font-size="12" fill="#3B6D11">gates' writes folders</text>

  <rect x="306" y="88" width="334" height="216" rx="10" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="322" y="112" font-size="14" font-weight="500" fill="#27500A">The shared .git</text>
  <text x="322" y="130" font-size="12" fill="#3B6D11">of a linked worktree</text>

  <text x="322" y="154" font-size="12" font-weight="500" fill="#27500A">open</text>
  <rect x="322" y="162" width="146" height="30" rx="6" fill="#F7FBF1" stroke="#D3E6BC"/>
  <text x="395" y="181" font-size="12" fill="#27500A" text-anchor="middle">objects</text>
  <rect x="322" y="198" width="146" height="30" rx="6" fill="#F7FBF1" stroke="#D3E6BC"/>
  <text x="395" y="217" font-size="12" fill="#27500A" text-anchor="middle">own branch's ref</text>
  <rect x="322" y="234" width="146" height="30" rx="6" fill="#F7FBF1" stroke="#D3E6BC"/>
  <text x="395" y="253" font-size="12" fill="#27500A" text-anchor="middle">own admin folder</text>
  <rect x="322" y="270" width="146" height="30" rx="6" fill="#F7FBF1" stroke="#D3E6BC"/>
  <text x="395" y="289" font-size="12" fill="#27500A" text-anchor="middle">refs no deny names</text>

  <text x="480" y="154" font-size="12" font-weight="500" fill="#791F1F">holes</text>
  <rect x="480" y="162" width="146" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="553" y="181" font-size="12" fill="#791F1F" text-anchor="middle">packed-refs</text>
  <rect x="480" y="198" width="146" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="553" y="217" font-size="12" fill="#791F1F" text-anchor="middle">main line, group-*</text>
  <rect x="480" y="234" width="146" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="553" y="253" font-size="12" fill="#791F1F" text-anchor="middle">other ticket-* refs</text>
  <rect x="480" y="270" width="146" height="30" rx="6" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="553" y="289" font-size="12" fill="#791F1F" text-anchor="middle">other admin folders</text>

  <rect x="40" y="320" width="295" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="187" y="350" font-size="13" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;  &lt;monitor&gt;</text>
  <rect x="345" y="320" width="295" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="492" y="342" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">&lt;common&gt;/config</text>
  <text x="492" y="360" font-size="12" fill="#993C1D" text-anchor="middle">Bash refused, Edit wrote it (scratch run)</text>
  <text x="40" y="402" font-size="12" fill="#73726c">Any other path: Bash meets the sandbox's write limit, and Edit and Write meet no rule.</text>
</svg>
