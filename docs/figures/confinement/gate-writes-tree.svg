<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A gate writes only inside the cache, and the bin in each ancestor stays shut</title>
  <desc>A folder tree for a gate's writes folder ~/.bun/install/cache. Each ancestor's own bin folder is denied, from the home folder down to ~/.bun/install. The cache is writable, and so is a bin inside it, about which the rule claims nothing.</desc>
  <rect x="1" y="1" width="678" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A gate writes inside the cache; every bin up to it stays shut</text>
  <text x="40" y="68" font-size="13" fill="#73726c">a gate whose writes folder is ~/.bun/install/cache: a bin in each ancestor, up to /, is denied</text>

  <g font-family="ui-monospace,Menlo,Consolas,monospace">
  <path d="M130,132 L130,152 M130,196 L130,216 M130,260 L130,280" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M220,110 L340,110 M220,174 L340,174 M220,238 L340,238" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M130,324 L130,366 L198,366" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M220,302 L340,302" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>

  <rect x="40" y="88" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130" y="115" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">~</text>
  <rect x="40" y="152" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130" y="179" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">~/.bun</text>
  <rect x="40" y="216" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130" y="243" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">~/.bun/install</text>
  <rect x="40" y="280" width="180" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="130" y="307" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">~/.bun/install/cache</text>

  <rect x="340" y="88" width="300" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="490" y="115" font-size="13" fill="#791F1F" text-anchor="middle">~/bin</text>
  <rect x="340" y="152" width="300" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="490" y="179" font-size="13" fill="#791F1F" text-anchor="middle">~/.bun/bin</text>
  <rect x="340" y="216" width="300" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="490" y="243" font-size="13" fill="#791F1F" text-anchor="middle">~/.bun/install/bin</text>
  <rect x="340" y="280" width="300" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="490" y="307" font-size="13" fill="#27500A" text-anchor="middle">~/.bun/install/cache/*</text>
  <rect x="200" y="344" width="440" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="420" y="371" font-size="13" fill="#712B13" text-anchor="middle">cache/bin: writable, no claim made</text>
  </g>

  <text x="40" y="412" font-size="12" fill="#73726c">~/.bun/bin as a writes folder is refused at gate add and dropped at each profile build (bin-folder).</text>
</svg>
