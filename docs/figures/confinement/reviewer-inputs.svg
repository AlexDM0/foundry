<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A reviewer's brief never comes from its branch, except CLAUDE.md</title>
  <desc>A reviewer session reads its default constitution and role brief from the data folder, and any file the pipeline names from the main line. The branch reaches it only through lines stopped at Customs checks V11 and V13. One dashed line, the root CLAUDE.md, still reaches the session, and the review prompt says to judge it.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="398" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A reviewer's brief never comes from its branch, except CLAUDE.md</text>
  <text x="40" y="68" font-size="13" fill="#73726c">solid: read by code; stopped: refused by a check; dashed: loaded by the vendor</text>

  <rect x="40" y="96" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">&lt;data&gt;</text>
  <text x="125" y="138" font-size="12" fill="#5F5E5A" text-anchor="middle">default briefs</text>
  <rect x="40" y="168" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="125" y="192" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Main line</text>
  <text x="125" y="210" font-size="12" fill="#5F5E5A" text-anchor="middle">named instruction files</text>

  <rect x="470" y="96" width="170" height="128" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="555" y="154" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Reviewer session</text>
  <text x="555" y="173" font-size="12" fill="#993C1D" text-anchor="middle">in the branch's worktree</text>

  <path d="M210,124 L468,124" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M210,196 L468,196" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="116" font-size="11" fill="#73726c" text-anchor="middle">defaults: constitution, role brief</text>
  <text x="340" y="188" font-size="11" fill="#73726c" text-anchor="middle">files the pipeline names, via git show</text>

  <rect x="40" y="264" width="170" height="100" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="125" y="310" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">The branch</text>
  <text x="125" y="329" font-size="12" fill="#993C1D" text-anchor="middle">written by its builder</text>

  <path d="M210,284 L308,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M210,330 L308,330" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="258" y="276" font-size="11" fill="#73726c" text-anchor="middle">instruction files</text>
  <text x="258" y="322" font-size="11" fill="#73726c" text-anchor="middle">.claude/, .mcp.json</text>
  <rect x="310" y="264" width="128" height="38" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="374" y="288" font-size="12" fill="#791F1F" text-anchor="middle">V11 refuses</text>
  <rect x="310" y="312" width="128" height="38" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="374" y="336" font-size="12" fill="#791F1F" text-anchor="middle">V13 stops the launch</text>

  <path d="M125,264 L125,244 L555,244 L555,226" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="340" y="236" font-size="11" fill="#993C1D" text-anchor="middle">root CLAUDE.md: the prompt says judge it</text>

</svg>
