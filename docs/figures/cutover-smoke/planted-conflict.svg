<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Two branches from one tip force a resolved, freshly gated landing</title><desc>Git graph of two ticket branches leaving one target tip, each adding its line at the end of palette.txt, with each build&#x27;s gate logging a gate-ran record. The first landing moves the target to a tree already gated, so it adds no run. The second conflicts, the Airlock agent's commit keeps both lines, and that resolved tree gets the third gate-ran before it lands, the third of MINIMUM_PASSED_GATE_RUNS. Both landings fast-forward.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="410" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Two branches from one tip force a resolved, freshly gated landing</text>
<text x="40" y="68" font-size="13" fill="#73726c">The tickets may land in either order, so the lanes say first and second.</text>
<text x="40" y="146" font-size="12" fill="#444441" text-anchor="start">target</text>
<text x="40" y="236" font-size="12" fill="#444441" text-anchor="start">first branch</text>
<text x="40" y="326" font-size="12" fill="#444441" text-anchor="start">second branch</text>
<path d="M150,142 L369,142" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M391,142 L563,142" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M150,142 L290,227" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M150,142 L244,313" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M307,225 L373,151" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M260,322 L466,322" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M386,152 L472,311" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M486,312 L574,153" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="150" cy="142" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<circle cx="300" cy="232" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<circle cx="250" cy="322" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<circle cx="380" cy="142" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
<circle cx="478" cy="322" r="11" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
<circle cx="582" cy="142" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
<text x="150" y="124" font-size="11" fill="#73726c" text-anchor="middle">one tip</text>
<text x="380" y="106" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">first landing</text>
<text x="380" y="122" font-size="11" fill="#3B6D11" text-anchor="middle">tree already gated, no further run</text>
<text x="582" y="106" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">second landing</text>
<text x="582" y="122" font-size="11" fill="#3B6D11" text-anchor="middle">resolved tree</text>
<text x="318" y="236" font-size="11" fill="#73726c" text-anchor="start">adds its line</text>
<text x="150" y="326" font-size="11" fill="#73726c" text-anchor="start">adds its line</text>
<text x="272" y="314" font-size="11" fill="#73726c">conflict in <tspan font-family="ui-monospace,Menlo,Consolas,monospace">palette.txt</tspan></text>
<text x="496" y="326" font-size="11" fill="#712B13" text-anchor="start">Airlock agent's commit</text>
<text x="496" y="340" font-size="11" fill="#712B13" text-anchor="start">keeps both lines</text>
<rect x="256" y="248" width="88" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="300.0" y="266.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-ran 1</text>
<rect x="206" y="338" width="88" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="250.0" y="356.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-ran 2</text>
<rect x="434" y="348" width="88" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="478.0" y="366.0" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gate-ran 3</text>
<text x="478" y="392" font-size="11" fill="#73726c" text-anchor="middle">third of <tspan font-family="ui-monospace,Menlo,Consolas,monospace">MINIMUM_PASSED_GATE_RUNS</tspan></text>
</svg>
