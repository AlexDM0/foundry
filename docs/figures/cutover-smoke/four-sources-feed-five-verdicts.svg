<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Item 2's verdict rests on what the script observed live</title><desc>Four sources feed five verdict functions. What the script saw around the kill, which no file stores, feeds item 2. The board log feeds items 1, 3, 4 and 5; the SSE events received and the stream gaps, which no file stores either, feed item 5 as well. All five verdicts join at one check: exit 0 only when verdicts.length is 5 and every one passed, and exit 1 otherwise.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="442" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Item 2's verdict rests on what the script observed live</text>
<text x="40" y="68" font-size="13" fill="#73726c">The board log rechecks items 1, 3 and 4; item 5 also needs the stream gaps the script held.</text>

<rect x="40" y="92" width="150" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="115" y="112" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">What the script saw</text>
<text x="115" y="130" font-size="12" fill="#854F0B" text-anchor="middle">not stored</text>
<rect x="40" y="204" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="115" y="224" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Board log</text>
<text x="115" y="242" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">log.jsonl</text>
<rect x="40" y="316" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="115" y="336" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">SSE events</text>
<text x="115" y="354" font-size="12" fill="#5F5E5A" text-anchor="middle">as received</text>

<rect x="250" y="92" width="166" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="112" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Item 2</text>
<text x="333" y="130" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">regroupingVerdictOf</text>
<rect x="250" y="148" width="166" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="168" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Item 1</text>
<text x="333" y="186" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">deliveryVerdictOf</text>
<rect x="250" y="204" width="166" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="224" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Item 3</text>
<text x="333" y="242" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">conflictVerdictOf</text>
<rect x="250" y="260" width="166" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="280" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Item 4</text>
<text x="333" y="298" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">questionVerdictOf</text>
<rect x="250" y="316" width="166" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="333" y="336" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Item 5</text>
<text x="333" y="354" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">eventVerdictOf</text>

<rect x="40" y="376" width="150" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="115" y="396" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Stream gaps</text>
<text x="115" y="414" font-size="12" fill="#854F0B" text-anchor="middle">not stored</text>

