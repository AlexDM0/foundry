<rect x="466" y="92" width="174" height="48" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
<text x="553" y="121" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Exit 0</text>
<rect x="466" y="316" width="174" height="48" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="553" y="345" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Exit 1</text>
