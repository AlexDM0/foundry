<path d="M190,400 L226,400 L226,356 L243,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="466" y="202" width="174" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
