<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="892" viewBox="0 0 1000 892" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Every mechanism one run meets is judged by a numbered item</title><desc>Swimlane of one smoke run, time running down, with a right column naming the item that judges each row. The main path readies two tickets, then builds, reviews and merges them to two deliveries, with a planted question answered by the script or settled through the Assistant and a planted conflict settled by the Airlock agent. At the first poll that sees a build running, the script kills the Overseer and restarts it; both builds keep running, and item 2 watches the first one seen on one Watcher instance.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="998" height="890" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every mechanism one run meets is judged by a numbered item</text>
<text x="40" y="68" font-size="13" fill="#73726c">The kill comes at the first poll that sees a build running, usually before any question is answered. Either ticket may land first.</text>
