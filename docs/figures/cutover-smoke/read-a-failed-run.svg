<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Find how the run ended before reading a failed item</title><desc>Decision tree from the run log&#x27;s tail. In order: no item 1 to 5 lines means the script threw before the tickets were ready, a line starting The smoke stopped with item lines means it threw during the drive and item 2 is forced to fail, a line saying a decision only User may take names the kind that stopped it, and Timed out after means the deadline passed. The last three still print item lines, and those are symptoms. Only a run that went on to the end has item lines to read directly: too few passed gate runs means read item 3 first, and any other FAIL is looked up in the table below.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="582" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Find how the run ended before reading a failed item</text>
<text x="40" y="68" font-size="13" fill="#73726c">An early ending is the cause; any item lines under it are symptoms.</text>
<rect x="40" y="88" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="185.0" y="119.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Read the run log&#x27;s tail</text>
<path d="M185,140 L185,155" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="162" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="185.0" y="184.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">No item 1 to 5 lines?</text>
<text x="185.0" y="202.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the run log ends FAILED</text>
<rect x="410" y="162" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="525.0" y="184.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Threw before tickets ready</text>
<text x="525.0" y="202.0" font-size="12" fill="#A32D2D" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">The smoke stopped:</text>
<path d="M330,188.0 L403,188.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370" y="181.0" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M185,214 L185,229" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="193" y="229" font-size="11" fill="#73726c" text-anchor="start">no</text>
<rect x="40" y="236" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="185.0" y="258.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">The smoke stopped:</text>
<text x="185.0" y="276.0" font-size="12" fill="#5F5E5A" text-anchor="middle">with item lines below it</text>
<rect x="410" y="236" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="525.0" y="258.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Threw during the drive</text>
<text x="525.0" y="276.0" font-size="12" fill="#A32D2D" text-anchor="middle">item 2 is forced to fail</text>
<path d="M330,262.0 L403,262.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370" y="255.0" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M185,288 L185,303" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="193" y="303" font-size="11" fill="#73726c" text-anchor="start">no</text>
<rect x="40" y="310" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="185.0" y="332.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">A decision only User may take</text>
<text x="185.0" y="350.0" font-size="12" fill="#5F5E5A" text-anchor="middle">names a decision kind</text>
<rect x="410" y="310" width="230" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="525.0" y="332.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Read the kind it names</text>
<text x="525.0" y="350.0" font-size="12" fill="#854F0B" text-anchor="middle">it is the cause</text>
<path d="M330,336.0 L403,336.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370" y="329.0" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M185,362 L185,377" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="193" y="377" font-size="11" fill="#73726c" text-anchor="start">no</text>
<rect x="40" y="384" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="185.0" y="406.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Timed out after</text>
<text x="185.0" y="424.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the deadline passed</text>
<rect x="410" y="384" width="230" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="525.0" y="406.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Read the last ticket line</text>
<text x="525.0" y="424.0" font-size="12" fill="#A32D2D" text-anchor="middle">what stopped moving</text>
<path d="M330,410.0 L403,410.0" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370" y="403.0" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
<path d="M185,436 L185,465" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="193" y="453" font-size="11" fill="#73726c" text-anchor="start">no: ran on to the end</text>
<rect x="40" y="472" width="600" height="92" rx="10" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
<text x="56" y="492" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Then read the items</text>
<rect x="56" y="500" width="276" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="194" y="522" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Too few passed gate runs</text>
<text x="194" y="540" font-size="12" fill="#A32D2D" text-anchor="middle">read item 3 first</text>
<rect x="348" y="500" width="276" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
<text x="486" y="522" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Any other FAIL</text>
<text x="486" y="540" font-size="12" fill="#A32D2D" text-anchor="middle">look it up below</text>
</svg>
