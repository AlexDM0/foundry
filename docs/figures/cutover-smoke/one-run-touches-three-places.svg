<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A run keeps the board in scratch and only evidence leaves it</title><desc>Three places. The checkout under test supplies the script and agent-progress.ts. The scratch root holds a bin folder with the shim and the repository with its data folder, where the Overseer, the Watchers and the sessions run. Sessions reach the checkout's entry point through the shim, while the script spawns each verb directly with the repository as working directory. The main checkout receives only the evidence folder: the script writes the run log and events there and keepBoardLog copies the board's logs.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="442" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A run keeps the board in scratch and only evidence leaves it</text>
<text x="40" y="68" font-size="13" fill="#73726c">The checkout under test supplies the program; nothing tracked in it changes.</text>

<rect x="40" y="88" width="170" height="214" rx="10" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
<text x="54" y="108" font-size="12" font-weight="500" fill="#444441">Checkout under test</text>
<rect x="54" y="118" width="142" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="125" y="138" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">agent-progress.ts</text>
<text x="125" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle">the program</text>
<rect x="54" y="238" width="142" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="125" y="258" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CutoverSmoke.ts</text>
<text x="125" y="276" font-size="12" fill="#854F0B" text-anchor="middle">the script, as User</text>
<path d="M125,238 L125,173" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="133" y="198" font-size="11" fill="#73726c">spawns</text>
<text x="133" y="212" font-size="11" fill="#73726c">each verb</text>

<rect x="280" y="88" width="360" height="214" rx="10" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
<text x="294" y="108" font-size="12" font-weight="500" fill="#444441">Scratch root, under the temporary folder</text>
<rect x="294" y="118" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="369" y="137" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">bin/</text>
<text x="369" y="153" font-size="12" fill="#5F5E5A" text-anchor="middle">the shim</text>
<rect x="294" y="176" width="332" height="114" rx="8" fill="#F1EFE8" fill-opacity="0.5" stroke="#E1DDD0"/>
<text x="306" y="196" font-size="12" font-weight="500" fill="#444441"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">repository/</tspan>, the board in <tspan font-family="ui-monospace,Menlo,Consolas,monospace">&lt;data&gt;</tspan></text>
<rect x="306" y="212" width="92" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="352" y="249" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer</text>
<rect x="418" y="212" width="86" height="64" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
<text x="461" y="249" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Watchers</text>
<rect x="524" y="212" width="90" height="64" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
<text x="569" y="249" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Sessions</text>
<path d="M398,244 L411,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M504,244 L517,244" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>

<path d="M569,212 L569,140 L451,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="508" y="132" font-size="11" fill="#73726c" text-anchor="middle">verbs, first on PATH</text>
<path d="M294,140 L203,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="245" y="132" font-size="11" fill="#73726c" text-anchor="middle">runs</text>
<path d="M196,262 L287,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="245" y="254" font-size="11" fill="#73726c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cwd</text>

<rect x="40" y="340" width="600" height="84" rx="10" fill="none" stroke="#E1DDD0" stroke-width="1.4"/>
<text x="54" y="360" font-size="12" font-weight="500" fill="#444441">Main checkout</text>
<rect x="210" y="356" width="330" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="375" y="378" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/.evidence/cutover-smoke/</text>
<text x="375" y="396" font-size="12" fill="#5F5E5A" text-anchor="middle">what outlasts the scratch board</text>
<path d="M160,286 L160,384 L203,384" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="168" y="322" font-size="11" fill="#73726c">run log, events</text>
<path d="M460,290 L460,349" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="468" y="322" font-size="11" fill="#73726c"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">keepBoardLog</tspan> copies logs</text>
</svg>
