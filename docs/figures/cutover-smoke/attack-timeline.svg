<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Item 2 reads the Watcher after each gap item 5 skips</title><desc>Strip of the attack, time running right. Kill -9 opens a first stream gap, during which oversee --detach runs, and the gap closes when the stream reopens. A settle wait follows and the script takes a first reading of the Watcher. Oversee restart opens a second gap, which also closes when the stream reopens, then a second settle wait and a second reading. No decision is answered anywhere in the strip.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
<rect x="1" y="1" width="678" height="366" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
<text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Item 2 reads the Watcher after each gap item 5 skips</text>
<text x="40" y="68" font-size="13" fill="#73726c">Time runs right, not to scale.</text>
<rect x="76" y="156" width="130" height="56" fill="#E1DDD0"/>
<text x="141" y="174" font-size="11" fill="#444441" text-anchor="middle">stream gap</text>
<text x="141" y="188" font-size="11" fill="#444441" text-anchor="middle">item 5 skips</text>
<text x="141" y="203" font-size="11" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee --detach</text>
<rect x="350" y="156" width="118" height="56" fill="#E1DDD0"/>
<text x="409" y="181" font-size="11" fill="#444441" text-anchor="middle">stream gap</text>
<text x="409" y="196" font-size="11" fill="#444441" text-anchor="middle">item 5 skips</text>
<rect x="206" y="156" width="112" height="56" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="262" y="188" font-size="12" fill="#444441" text-anchor="middle">settle wait 1</text>
<rect x="468" y="156" width="124" height="56" fill="#F1EFE8" stroke="#E1DDD0"/>
<text x="530" y="188" font-size="12" fill="#444441" text-anchor="middle">settle wait 2</text>
<path d="M318,184 L350,184" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
<path d="M592,184 L640,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="92" width="72" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="76" y="117" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">kill -9</text>
<rect x="148" y="92" width="116" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="206" y="117" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">stream reopens</text>
<rect x="286" y="92" width="128" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="350" y="117" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee restart</text>
<rect x="424" y="92" width="116" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="482" y="117" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">stream reopens</text>
<path d="M76,132 L76,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M206,132 L206,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M350,132 L350,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M468,132 L468,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M334,191 L334,236" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M608,191 L608,236" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="334" cy="184" r="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/><circle cx="608" cy="184" r="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<rect x="244" y="236" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="334" y="256" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">First reading</text>
<text x="334" y="274" font-size="12" fill="#854F0B" text-anchor="middle">Watcher alive, one instance</text>
<rect x="506" y="236" width="134" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="573" y="256" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Second reading</text>
<text x="573" y="274" font-size="12" fill="#854F0B" text-anchor="middle">the same two facts</text>
<rect x="76" y="298" width="564" height="24" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
<text x="358" y="314" font-size="12" fill="#633806" text-anchor="middle">no decision answered</text>
<text x="40" y="346" font-size="11" fill="#73726c">wait 1 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">SETTLE_AFTER_REGROUPING_MILLISECONDS</tspan></text>
<text x="344" y="346" font-size="11" fill="#73726c">wait 2 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">SETTLE_AFTER_RESTART_MILLISECONDS</tspan></text>
</svg>
