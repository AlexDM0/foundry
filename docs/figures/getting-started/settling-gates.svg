<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Answer checks-not-set last: a pipeline must be stored first</title>
  <desc>The checks-not-set decision is open. Three routes store a pipeline: accept the pipeline agent's proposal, gate add with gate prepare, or gate none. Each reaches the same state: the pipeline is stored and work stops waiting on gates. The decision stays open until you answer it with any text, which closes it. The exit: answering while no pipeline is stored makes the next Pass reopen the decision, and a fresh pipeline agent follows unless the board is paused or held.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="568" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Answer <tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan> last: a pipeline must be stored first</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Three routes reach one store. The decision outlives all of them.</text>
  <path d="M130,156 L130,293" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M130,272 L340,272 L340,293" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M130,272 L550,272 L550,293" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M535,156 L535,183" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M130,352 L130,393" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,352 L340,393" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M550,352 L550,393" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M145,452 L145,489" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M250,516 L427,516" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M250,116 L427,116" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,140 L253,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="108" font-size="11" fill="#73726c" text-anchor="middle">answered, no pipeline stored</text>
  <text x="340" y="154" font-size="11" fill="#73726c" text-anchor="middle">open again</text>
  <rect x="40" y="100" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="145.0" y="124" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan> open</text>
  <text x="145.0" y="142" font-size="12" fill="#854F0B" text-anchor="middle">opened by the Overseer</text>
  <rect x="430" y="100" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="535.0" y="124" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Next Pass reopens it</text>
  <text x="535.0" y="142" font-size="12" fill="#185FA5" text-anchor="middle">before any launch</text>
  <rect x="430" y="186" width="210" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="535.0" y="210" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Fresh pipeline agent</text>
  <text x="535.0" y="228" font-size="12" fill="#993C1D" text-anchor="middle">unless paused or held</text>
  <rect x="40" y="296" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="130.0" y="320" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Accept the proposal</text>
  <text x="130.0" y="338" font-size="12" fill="#854F0B" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-proposal</tspan></text>
  <rect x="250" y="296" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="340.0" y="320" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">gate add</tspan></text>
  <text x="340.0" y="338" font-size="12" fill="#854F0B" text-anchor="middle">with <tspan font-family="ui-monospace,Menlo,Consolas,monospace">gate prepare</tspan></text>
  <rect x="460" y="296" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="550.0" y="320" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">gate none</tspan></text>
  <text x="550.0" y="338" font-size="12" fill="#854F0B" text-anchor="middle">no gates, on purpose</text>
  <rect x="40" y="396" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="340.0" y="420" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Pipeline stored</text>
  <text x="340.0" y="438" font-size="12" fill="#5F5E5A" text-anchor="middle">work stops waiting on gates</text>
  <rect x="40" y="492" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="145.0" y="516" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan> still open</text>
  <text x="145.0" y="534" font-size="12" fill="#854F0B" text-anchor="middle">holds nothing now</text>
  <rect x="430" y="492" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="535.0" y="516" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Decision closed</text>
  <text x="535.0" y="534" font-size="12" fill="#5F5E5A" text-anchor="middle">gone from Questions</text>
  <text x="340" y="508" font-size="11" fill="#73726c" text-anchor="middle">answer with any text</text>
</svg>
