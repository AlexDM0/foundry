<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only an Apply withdraws checks-not-set</title>
  <desc>The checks-not-set decision is open on a new board. Two routes store a pipeline. pipeline setup runs the setup with the pipeline agent through billing, research, constitution, design and Apply. The gate verbs, gate add with gate prepare or gate none, store prepare steps and gates at once. Both reach a stored pipeline. After an Apply, checks-not-set is withdrawn by the Apply itself. After a gate command it stays open until you answer it with any text. The exit: an answer while no pipeline is stored makes the next Pass open it again.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Only an Apply withdraws <tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan></text>
  <text x="40" y="68" font-size="13" fill="#73726c">Two routes store a pipeline; after the gate commands, you answer the question.</text>
  <path d="M250,116 L427,116" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,140 L253,140" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="108" font-size="11" fill="#73726c" text-anchor="middle">answered, no pipeline stored</text>
  <text x="340" y="154" font-size="11" fill="#73726c" text-anchor="middle">open again</text>
  <path d="M145,156 L145,233" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M200,156 L200,196 L510,196 L510,233" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,292 L170,341" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,292 L510,341" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,400 L170,453" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="178" y="431" font-size="11" fill="#73726c" text-anchor="start">after an Apply</text>
  <path d="M510,400 L510,453" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="518" y="431" font-size="11" fill="#73726c" text-anchor="start">after a gate command</text>
  <rect x="40" y="100" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="145" y="124" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan> open</text>
  <text x="145" y="142" font-size="12" fill="#854F0B" text-anchor="middle">opened by the Overseer</text>
  <rect x="430" y="100" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="535" y="124" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Next Pass opens it</text>
  <text x="535" y="142" font-size="12" fill="#185FA5" text-anchor="middle">before any launch</text>
  <rect x="40" y="236" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="260" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">pipeline setup</tspan>, then Apply</text>
  <text x="170" y="278" font-size="12" fill="#854F0B" text-anchor="middle">designed with the pipeline agent</text>
  <rect x="380" y="236" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="510" y="260" font-size="14" font-weight="500" fill="#633806" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">gate add</tspan>, <tspan font-family="ui-monospace,Menlo,Consolas,monospace">gate none</tspan></text>
  <text x="510" y="278" font-size="12" fill="#854F0B" text-anchor="middle">by hand, at once</text>
  <rect x="40" y="344" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="340" y="368" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Pipeline stored</text>
  <text x="340" y="386" font-size="12" fill="#5F5E5A" text-anchor="middle"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json</tspan>; work may start</text>
  <rect x="40" y="456" width="260" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="170" y="480" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Withdrawn</text>
  <text x="170" y="498" font-size="12" fill="#3B6D11" text-anchor="middle">by the Apply itself</text>
  <rect x="380" y="456" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="510" y="480" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Stays open</text>
  <text x="510" y="498" font-size="12" fill="#854F0B" text-anchor="middle">answer it with any text</text>
</svg>
