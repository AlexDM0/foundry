<svg xmlns="http://www.w3.org/2000/svg" width="680" height="612" viewBox="0 0 680 612" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>init leaves one file for git: .gitignore</title>
  <desc>A repository after init. Your code and CLAUDE.md stay yours. init and update add entries to .gitignore and the settings hook, and own both skills, the briefs, the reference and version.json. init, update and the Overseer write the stub. init alone creates progress.json, the log and the tickets folder, which every mutating command and the Overseer then write. The pipeline, overseer and jobs folders and the worktrees folder appear at runtime. Only .gitignore is new in git; everything else is ignored or kept out.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="610" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">init leaves one file for git: .gitignore</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Row colour is who writes it. The right column is what git does with it.</text>
  <rect x="40" y="88" width="16" height="16" rx="4" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="62" y="101" font-size="12" fill="#854F0B">By hand</text>
  <rect x="121" y="88" width="16" height="16" rx="4" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="143" y="101" font-size="12" fill="#5F5E5A"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">init</tspan> creates, runtime writes</text>
  <rect x="312" y="88" width="16" height="16" rx="4" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="334" y="101" font-size="12" fill="#185FA5"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">init</tspan> and <tspan font-family="ui-monospace,Menlo,Consolas,monospace">update</tspan></text>
  <rect x="462" y="88" width="16" height="16" rx="4" fill="#FAF9F5" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="484" y="101" font-size="12" fill="#185FA5">Appears at runtime</text>
  <text x="50" y="156" font-size="12.5" font-weight="500" fill="#3d3d3a" font-family="ui-monospace,Menlo,Consolas,monospace">example-storefront/</text>
  <rect x="60" y="168" width="440" height="25" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="70" y="185" font-size="12.5" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">src/ and the rest of your code</text>
  <text x="512" y="185" font-size="12" fill="#3d3d3a">tracked</text>
  <rect x="60" y="198" width="440" height="25" rx="6" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="70" y="215" font-size="12.5" fill="#633806" font-family="ui-monospace,Menlo,Consolas,monospace">CLAUDE.md</text>
  <text x="512" y="215" font-size="12" fill="#3d3d3a">tracked</text>
  <rect x="60" y="228" width="440" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="70" y="245" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">.gitignore</text>
  <text x="490" y="245" font-size="11" fill="#185FA5" text-anchor="end">entries added</text>
  <text x="512" y="245" font-size="12" fill="#3d3d3a">tracked: commit it</text>
  <rect x="60" y="258" width="440" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="70" y="275" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/settings.local.json</text>
  <text x="490" y="275" font-size="11" fill="#185FA5" text-anchor="end">entries added</text>
  <text x="512" y="275" font-size="12" fill="#73726c">keep out of git</text>
  <rect x="60" y="288" width="440" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="70" y="305" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/skills/agent-po-v2/</text>
  <text x="512" y="305" font-size="12" fill="#73726c">ignored</text>
  <rect x="60" y="318" width="440" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="70" y="335" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">.claude/skills/agent-progress-orchestrate-v2/</text>
  <text x="512" y="335" font-size="12" fill="#73726c">ignored</text>
  <text x="70" y="366" font-size="12.5" font-weight="500" fill="#3d3d3a" font-family="ui-monospace,Menlo,Consolas,monospace">.agent-progress-v2/</text>
  <text x="512" y="365" font-size="12" fill="#73726c">ignored</text>
  <rect x="80" y="378" width="420" height="25" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="90" y="395" font-size="12.5" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">progress.json  log.jsonl  tickets/</text>
  <rect x="80" y="408" width="420" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="90" y="425" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">progress.html</text>
  <text x="490" y="425" font-size="11" fill="#185FA5" text-anchor="end">the Overseer rewrites it too</text>
  <rect x="80" y="438" width="420" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="90" y="455" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">session-instructions.md  reference.md</text>
  <rect x="80" y="468" width="420" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="90" y="485" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">briefs/defaults/</text>
  <rect x="80" y="498" width="420" height="25" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="90" y="515" font-size="12.5" fill="#0C447C" font-family="ui-monospace,Menlo,Consolas,monospace">version.json</text>
  <rect x="80" y="528" width="420" height="25" rx="6" fill="#FAF9F5" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="90" y="545" font-size="12.5" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline.json  overseer/  jobs/</text>
  <rect x="60" y="558" width="440" height="25" rx="6" fill="#FAF9F5" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="70" y="575" font-size="12.5" fill="#185FA5" font-family="ui-monospace,Menlo,Consolas,monospace">.agent-progress-v2-worktrees/</text>
  <text x="512" y="575" font-size="12" fill="#73726c">ignored</text>
</svg>
