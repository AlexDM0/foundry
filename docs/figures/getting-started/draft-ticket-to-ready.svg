<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A body gap refuses at two doors and hides at the third</title>
  <desc>Three doors lead a draft ticket on: the filer's submit, intake close or ticket submit, the Ready button on the ticket form, and ticket ready. All three apply one readiness check: numbered Acceptance and a non-blank Brief. With no gap the Ready button and ticket ready make the ticket pending, and a submit puts it in ready-for-review while ticket review is on. With a gap the Ready button and ticket ready refuse it by name, while a submit leaves it a draft ticket in the Drafts group.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="422" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A body gap refuses at two doors and hides at the third</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A draft ticket a submit left in Drafts has a gap, even with no refusal.</text>
  <path d="M130,156 L130,197" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,156 L340,197" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M550,156 L550,197" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M130,256 L130,341" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,256 L340,341" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M550,256 L550,341" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="100" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="130" y="124" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">intake close</text>
  <text x="130" y="142" font-size="12" fill="#854F0B" text-anchor="middle">or ticket submit</text>
  <rect x="250" y="100" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="340" y="124" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Ready button</text>
  <text x="340" y="142" font-size="12" fill="#854F0B" text-anchor="middle">on the ticket form</text>
  <rect x="460" y="100" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="550" y="124" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket ready</text>
  <text x="550" y="142" font-size="12" fill="#854F0B" text-anchor="middle">from a terminal</text>
  <rect x="40" y="200" width="600" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340" y="224" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Readiness check of the ticket body</text>
  <text x="340" y="242" font-size="12" fill="#185FA5" text-anchor="middle">numbered Acceptance, non-blank Brief</text>
  <text x="138" y="294" font-size="11" fill="#73726c">gap, at</text>
  <text x="138" y="308" font-size="11" fill="#73726c">a submit</text>
  <text x="348" y="294" font-size="11" fill="#73726c">gap, at either</text>
  <text x="348" y="308" font-size="11" fill="#73726c">other door</text>
  <text x="558" y="302" font-size="11" fill="#73726c">no gap</text>
  <rect x="40" y="344" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="130" y="368" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Left a draft ticket</text>
  <text x="130" y="386" font-size="12" fill="#854F0B" text-anchor="middle">stays in Drafts</text>
  <rect x="250" y="344" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#F3D2D2" stroke-width="1"/>
  <text x="340" y="368" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">Refused by name</text>
  <text x="340" y="386" font-size="12" fill="#A32D2D" text-anchor="middle">the refusal says which gap</text>
  <rect x="460" y="344" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550" y="368" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Status <tspan font-family="ui-monospace,Menlo,Consolas,monospace">pending</tspan></text>
  <text x="550" y="386" font-size="12" fill="#5F5E5A" text-anchor="middle">after a submit: ready-for-review</text>
</svg>
