<svg xmlns="http://www.w3.org/2000/svg" width="680" height="986" viewBox="0 0 680 986" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A few commands, then Apply decides when work starts</title>
  <desc>The path from clone to first merged ticket. You run setup.sh, init and open, and the Overseer serves the Bridge paused with checks-not-set open. You start the pipeline setup, and the pipeline agent researches the repository, drafts the constitution and proposes the pipeline, asking its questions. You answer, edit and continue each step, then apply with resume. The Airlock commits CONSTITUTION.md to the main line, and the pipeline is stored and the board resumed. You describe the work in Intake, a product owner session files draft tickets, you ready them, and the Overseer builds, gates and merges each ticket. The path ends on the main line.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="984" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A few commands, then Apply decides when work starts</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A new board is paused; the Apply of its pipeline is what resumes it.</text>
  <text x="170" y="104" font-size="12" font-weight="500" fill="#854F0B" text-anchor="middle">You</text>
  <text x="510" y="104" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="middle">The system</text>
  <path d="M170,180 L170,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M170,276 L170,313" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M300,344 L377,344" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,372 L510,392 L170,392 L170,409" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M300,440 L377,440" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,468 L510,488 L170,488 L170,505" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="481" font-size="11" fill="#73726c" text-anchor="middle">questions, a draft</text>
  <path d="M170,564 L170,601" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M300,632 L377,632" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,660 L510,680 L170,680 L170,697" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="340" y="673" font-size="11" fill="#73726c" text-anchor="middle">board resumed</text>
  <path d="M300,728 L377,728" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,756 L510,776 L170,776 L170,793" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M300,824 L377,824" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M510,852 L510,889" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="124" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="148" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">./setup.sh</text>
  <text x="170" y="166" font-size="12" fill="#854F0B" text-anchor="middle">once per machine</text>
  <rect x="40" y="220" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="244" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">init</text>
  <text x="170" y="262" font-size="12" fill="#854F0B" text-anchor="middle">then commit <tspan font-family="ui-monospace,Menlo,Consolas,monospace">.gitignore</tspan></text>
  <rect x="40" y="316" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="340" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">open</text>
  <text x="170" y="358" font-size="12" fill="#854F0B" text-anchor="middle">starts the Overseer</text>
  <rect x="380" y="316" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="510" y="340" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer serves, paused</text>
  <text x="510" y="358" font-size="12" fill="#185FA5" text-anchor="middle">opens <tspan font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</tspan></text>
  <rect x="40" y="412" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="436" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline setup</text>
  <text x="170" y="454" font-size="12" fill="#854F0B" text-anchor="middle">choose who pays</text>
  <rect x="380" y="412" width="260" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="510" y="436" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Pipeline agent</text>
  <text x="510" y="454" font-size="12" fill="#993C1D" text-anchor="middle">researches, drafts, proposes</text>
  <rect x="40" y="508" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="532" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Continue each step</text>
  <text x="170" y="550" font-size="12" fill="#854F0B" text-anchor="middle">answer, edit the draft</text>
  <rect x="40" y="604" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="170" y="628" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Apply, with Resume</text>
  <text x="170" y="646" font-size="12" fill="#854F0B" text-anchor="middle">nothing builds before</text>
  <rect x="380" y="604" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="510" y="628" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock commits the constitution</text>
  <text x="510" y="646" font-size="12" fill="#185FA5" text-anchor="middle">then the pipeline is stored</text>
  <rect x="40" y="700" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="724" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Describe the work</text>
  <text x="170" y="742" font-size="12" fill="#854F0B" text-anchor="middle">Intake tab</text>
  <rect x="380" y="700" width="260" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="510" y="724" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Product owner files drafts</text>
  <text x="510" y="742" font-size="12" fill="#993C1D" text-anchor="middle">draft tickets, then it closes</text>
  <rect x="40" y="796" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="170" y="820" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Ready the draft tickets</text>
  <text x="170" y="838" font-size="12" fill="#854F0B" text-anchor="middle">one by one, or <tspan font-family="ui-monospace,Menlo,Consolas,monospace">ticket ready</tspan></text>
  <rect x="380" y="796" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="510" y="820" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Overseer drives the ticket</text>
  <text x="510" y="838" font-size="12" fill="#185FA5" text-anchor="middle">build, gates, review, Airlock</text>
  <rect x="380" y="892" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="510" y="916" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">On the main line</text>
  <text x="510" y="934" font-size="12" fill="#5F5E5A" text-anchor="middle">done means merged</text>
</svg>
