<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="848" viewBox="0 0 1000 848" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>No session moves a build job</title>
  <desc>Swimlane of one build job from launching to the ticket in review. The Overseer records the job, moves a pending ticket in-progress, adds the worktree, runs the install Watcher, spawns the session Watcher and sends the first message. The builder commits and closes with a result, which the Overseer reads from the event log. In that same lock hold Customs checks the report and the branch. The Overseer then closes the input, runs gate Watchers, writes the Handoff and ends the job built. This is the path with no failure, and the agent moves nothing.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="846" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">No session moves a build job</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The builder works and reports. The Overseer makes each move, in a Pass</text>
  <text x="255" y="96" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Overseer</text>
  <text x="490" y="96" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Watcher</text>
  <text x="705" y="96" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">builder</text>
  <text x="895" y="96" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">git</text>
  <text x="40" y="96" font-size="13" fill="#73726c" text-anchor="start">job state</text>
  <path d="M40,104 L960,104" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="145" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">launching</text>
  <path d="M40,176 L960,176" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="217" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">preparing</text>
  <path d="M40,392 L960,392" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="433" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <path d="M40,608 L960,608" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="649" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs</text>
  <path d="M40,680 L960,680" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="721" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gating</text>
  <path d="M40,752 L960,752" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="793" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">ended</text>
  <rect x="160" y="112" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="136.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Record the job</text>
  <text x="255.0" y="154.0" font-size="13" fill="#185FA5" text-anchor="middle">launch-build step</text>
  <path d="M255,168 L255,182" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="184" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="208.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Ticket in-progress</text>
  <text x="255.0" y="226.0" font-size="13" fill="#185FA5" text-anchor="middle">if it was pending</text>
  <path d="M255,240 L255,254" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="256" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
