  <path d="M255,312 L255,326" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="830" y="256" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
