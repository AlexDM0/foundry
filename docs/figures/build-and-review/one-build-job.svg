  <rect x="830" y="616" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="895.0" y="640.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">Reads the branch</text>
  <text x="895.0" y="658.0" font-size="13" fill="#5F5E5A" text-anchor="middle">HEAD, range, refs</text>
  <path d="M830,644 L353,644" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="160" y="688" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="712.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Close input, run gates</text>
  <text x="255.0" y="730.0" font-size="13" fill="#185FA5" text-anchor="middle">one step per Pass</text>
  <path d="M255,744 L255,758" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="410" y="688" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="712.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Gate Watchers</text>
  <text x="490.0" y="730.0" font-size="13" fill="#185FA5" text-anchor="middle">gate-prepare, gate-1…</text>
