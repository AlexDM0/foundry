  <text x="895.0" y="298.0" font-size="13" fill="#5F5E5A" text-anchor="middle">branch and worktree</text>
  <path d="M350,284 L828,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="328" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
