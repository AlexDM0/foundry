  <path d="M410,726 L353,726" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="160" y="760" width="190" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
