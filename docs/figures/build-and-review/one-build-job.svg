  <rect x="410" y="328" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="352.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Install Watcher</text>
  <text x="490.0" y="370.0" font-size="13" fill="#185FA5" text-anchor="middle">prepare steps joined</text>
  <path d="M350,348 L408,348" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M410,366 L353,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="160" y="400" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
