  <rect x="160" y="616" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="640.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Customs</text>
  <text x="255.0" y="658.0" font-size="13" fill="#185FA5" text-anchor="middle">report, branch; same lock hold</text>
