  <path d="M255,456 L255,470" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="410" y="400" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
