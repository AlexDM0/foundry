  <rect x="410" y="544" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="568.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Logs every event</text>
  <text x="490.0" y="586.0" font-size="13" fill="#185FA5" text-anchor="middle">to its event log</text>
  <rect x="630" y="544" width="150" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="705.0" y="568.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Closing result</text>
  <text x="705.0" y="586.0" font-size="13" fill="#993C1D" text-anchor="middle">the structured report</text>
