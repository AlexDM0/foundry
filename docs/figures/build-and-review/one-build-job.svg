  <rect x="630" y="400" width="150" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="705.0" y="424.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Builder session</text>
  <text x="705.0" y="442.0" font-size="13" fill="#993C1D" text-anchor="middle">confined by a profile</text>
  <path d="M350,428 L408,428" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M570,428 L628,428" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="472" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="496.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Send first message</text>
  <text x="255.0" y="514.0" font-size="13" fill="#185FA5" text-anchor="middle">once Watcher answers</text>
  <path d="M255,528 L255,542" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="410" y="472" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="490.0" y="496.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Forwards the line</text>
  <text x="490.0" y="514.0" font-size="13" fill="#185FA5" text-anchor="middle">to session stdin</text>
  <rect x="630" y="472" width="150" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="705.0" y="496.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Works and commits</text>
  <text x="705.0" y="514.0" font-size="13" fill="#993C1D" text-anchor="middle">in its own worktree</text>
  <rect x="830" y="472" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="895.0" y="496.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">Commits</text>
  <text x="895.0" y="514.0" font-size="13" fill="#5F5E5A" text-anchor="middle">on ticket-&lt;id&gt;</text>
