<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Code picks the review&#x27;s move; no report does</title>
  <desc>Fan-out from settleReviewPass to four moves tested in order. A claim that does not hold takes move fixer, the job ends does-not-hold and the ticket goes in-progress for the builder or a fresh attempt. A granted round takes fresh-reviewer, the job ends round-granted and the ticket stays in review. Waiver proposals take move waiver, the job goes awaiting-answer. Otherwise merge-queued, the job ends reviewed and the ticket queues to land.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="428" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">Code picks the review&#x27;s move; no report does</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The reviewer reports claims and findings. The first row that matches wins</text>
  <rect x="40" y="206" width="180" height="84" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="244.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">settleReviewPass</text>
  <text x="130.0" y="262.0" font-size="13" fill="#185FA5" text-anchor="middle">claims, diff, log</text>
  <text x="290" y="104" font-size="13" fill="#5F5E5A" text-anchor="start">move, when</text>
  <text x="580" y="104" font-size="13" fill="#5F5E5A" text-anchor="start">job</text>
  <text x="760" y="104" font-size="13" fill="#5F5E5A" text-anchor="start">ticket next</text>
  <rect x="290" y="116" width="240" height="62" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="410.0" y="143.0" font-size="15" fill="#791F1F" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="500">fixer</text>
  <text x="410.0" y="161.0" font-size="13" fill="#A32D2D" text-anchor="middle">a claim does-not-hold</text>
  <rect x="580" y="116" width="150" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="655.0" y="152.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">does-not-hold</text>
  <rect x="760" y="116" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="143.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">in-progress</text>
  <text x="860.0" y="161.0" font-size="13" fill="#5F5E5A" text-anchor="middle">builder, or fresh attempt</text>
  <path d="M530,147 L578,147" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M730,147 L758,147" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,248 C255,248 255,147 288,147" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="290" y="192" width="240" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="410.0" y="219.0" font-size="15" fill="#444441" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="500">fresh-reviewer</text>
  <text x="410.0" y="237.0" font-size="13" fill="#5F5E5A" text-anchor="middle">round verdict granted</text>
  <rect x="580" y="192" width="150" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="655.0" y="228.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">round-granted</text>
  <rect x="760" y="192" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="219.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">in-review</text>
  <text x="860.0" y="237.0" font-size="13" fill="#5F5E5A" text-anchor="middle">next round launches</text>
  <path d="M530,223 L578,223" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M730,223 L758,223" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,248 C255,248 255,223 288,223" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="290" y="268" width="240" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="410.0" y="295.0" font-size="15" fill="#633806" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="500">waiver</text>
  <text x="410.0" y="313.0" font-size="13" fill="#854F0B" text-anchor="middle">claims waiver-proposed</text>
  <rect x="580" y="268" width="150" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="655.0" y="304.0" font-size="15" fill="#633806" text-anchor="middle" font-weight="500">awaiting-answer</text>
  <rect x="760" y="268" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="295.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">in-review, held</text>
  <text x="860.0" y="313.0" font-size="13" fill="#5F5E5A" text-anchor="middle">waiver decision</text>
  <path d="M530,299 L578,299" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M730,299 L758,299" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,248 C255,248 255,299 288,299" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="290" y="344" width="240" height="62" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="410.0" y="371.0" font-size="15" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="500">merge-queued</text>
  <text x="410.0" y="389.0" font-size="13" fill="#3B6D11" text-anchor="middle">otherwise</text>
  <rect x="580" y="344" width="150" height="62" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="655.0" y="380.0" font-size="15" fill="#27500A" text-anchor="middle" font-weight="500">reviewed</text>
  <rect x="760" y="344" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="860.0" y="371.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">in-review, queued</text>
  <text x="860.0" y="389.0" font-size="13" fill="#5F5E5A" text-anchor="middle">waits for its Airlock</text>
  <path d="M530,375 L578,375" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M730,375 L758,375" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,248 C255,248 255,375 288,375" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
