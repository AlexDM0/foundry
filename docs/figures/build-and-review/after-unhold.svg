<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Unhold clears the failed passes; ticket status picks the next job</title>
  <desc>Fork from ticket unhold, which clears the failed passes. An in-progress ticket takes attempt + 1 with a fresh session and a handoff cycle of its own. An in-progress ticket whose newest build was replaced on a red keeps the same attempt. An in-review ticket relaunches its review at the same round.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">Unhold clears the failed passes; ticket status picks the next job</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">ticket unhold is the way back from park</text>
  <rect x="40" y="150" width="150" height="76" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="115.0" y="184" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">ticket unhold</text>
  <text x="115.0" y="202" font-size="12" fill="#854F0B" text-anchor="middle">clears failed passes</text>
  <rect x="230" y="92" width="206" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="333.0" y="125" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">in-progress</text>
  <rect x="474" y="92" width="166" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="557.0" y="116" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">Build, attempt + 1</text>
  <text x="557.0" y="134" font-size="12" fill="#185FA5" text-anchor="middle">fresh session, own cycle</text>
  <path d="M190,188 C210,188 208,120 228,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M436,120 L472,120" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="158" width="206" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="333.0" y="182" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">in-progress</text>
  <text x="333.0" y="200" font-size="11" fill="#5F5E5A" text-anchor="middle">newest build replaced on a red</text>
  <rect x="474" y="158" width="166" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="557.0" y="182" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">Build, same attempt</text>
  <text x="557.0" y="200" font-size="12" fill="#185FA5" text-anchor="middle">its cycle carries on</text>
  <path d="M190,188 C210,188 208,186 228,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M436,186 L472,186" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="230" y="224" width="206" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="333.0" y="257" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">in-review</text>
  <rect x="474" y="224" width="166" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="557.0" y="248" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">Review, same round</text>
  <text x="557.0" y="266" font-size="12" fill="#185FA5" text-anchor="middle">its cycle carries on</text>
  <path d="M190,188 C210,188 208,252 228,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M436,252 L472,252" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
