<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A handoff cycle outlives its jobs but not its attempt</title>
  <desc>Timeline of ticket 003. J1, a build of attempt 1, goes red and is resumed once, then the vendor refuses a resume and it ends replaced. J2 takes over at the same attempt and ends built. Review J3 sends it back, the second count. J4 resumes the J2 session. Review J5 sends it back, the third count, past the bound, so the ticket parks. A bar under all of them marks one cycle. After ticket unhold, J6 runs attempt 2 with a session and a cycle of its own.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="370" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">A handoff cycle outlives its jobs but not its attempt</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">One ticket with RED_HANDOFF_RESUMES_BEFORE_PARKING (2). Every +1 lands on the same count</text>
  <text x="40" y="136" font-size="13" fill="#5F5E5A" text-anchor="start">Builder</text>
  <text x="40" y="220" font-size="13" fill="#5F5E5A" text-anchor="start">Reviewer</text>
  <text x="40" y="300" font-size="13" fill="#5F5E5A" text-anchor="start">Cycle</text>
  <path d="M40,176 L960,176" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <path d="M40,256 L960,256" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <rect x="130" y="100" width="104" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="182.0" y="126.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J1</text>
  <text x="182.0" y="144.0" font-size="13" fill="#993C1D" text-anchor="middle">replaced</text>
  <rect x="250" y="100" width="104" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="302.0" y="126.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J2</text>
  <text x="302.0" y="144.0" font-size="13" fill="#993C1D" text-anchor="middle">built</text>
  <rect x="370" y="186" width="104" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="422.0" y="212.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J3</text>
  <text x="422.0" y="230.0" font-size="13" fill="#993C1D" text-anchor="middle">does-not-hold</text>
  <rect x="490" y="100" width="104" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="542.0" y="126.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J4</text>
  <text x="542.0" y="144.0" font-size="13" fill="#993C1D" text-anchor="middle">built</text>
  <rect x="610" y="186" width="104" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="662.0" y="212.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J5</text>
  <text x="662.0" y="230.0" font-size="13" fill="#993C1D" text-anchor="middle">does-not-hold</text>
  <rect x="730" y="186" width="104" height="60" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="782.0" y="212.0" font-size="15" fill="#633806" text-anchor="middle" font-weight="500">Parked</text>
  <text x="782.0" y="230.0" font-size="13" fill="#854F0B" text-anchor="middle">past the bound</text>
  <rect x="850" y="100" width="110" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="905.0" y="126.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J6</text>
  <text x="905.0" y="144.0" font-size="13" fill="#993C1D" text-anchor="middle">its own session</text>
  <path d="M234,130 L248,130" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M354,130 L422,130 L422,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M474,216 L542,216 L542,162" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M594,130 L662,130 L662,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M714,216 L728,216" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M834,216 L905,216 L905,162" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="843" y="236" font-size="13" fill="#73726c" text-anchor="start">ticket unhold</text>
  <text x="182" y="270" font-size="13" fill="#73726c" text-anchor="middle">+1 red resume</text>
  <text x="422" y="270" font-size="13" fill="#73726c" text-anchor="middle">+1 sent back</text>
  <text x="662" y="270" font-size="13" fill="#73726c" text-anchor="middle">+1 sent back</text>
  <rect x="130" y="280" width="704" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="482" y="300" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">one handoff cycle: build, #003, attempt 1</text>
  <rect x="850" y="280" width="110" height="30" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="905" y="300" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">attempt 2</text>
  <text x="130" y="336" font-size="13" fill="#73726c" text-anchor="start">J2 keeps the attempt because J1 was replaced on a red. J4 resumes the J2 session.</text>
</svg>
