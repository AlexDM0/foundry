<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A red and a review both give two resumes: a review counts first</title>
  <desc>Two strips against a shared count from 0 to 3, with RED_HANDOFF_RESUMES_BEFORE_PARKING (2) marked at count 2. A red reads the count before anything adds to it: it resumes at 0 and 1 and parks at 2. A review that does not hold raises the count first: it resumes the builder at 1 and 2 and parks at 3. Both allow two resumes.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="320" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">A red and a review both give two resumes: a review counts first</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">What each test reads, with RED_HANDOFF_RESUMES_BEFORE_PARKING (2)</text>
  <text x="40" y="126" font-size="14" fill="#444441" text-anchor="start" font-weight="500">A red</text>
  <text x="40" y="144" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">count &gt;= bound</text>
  <text x="40" y="212" font-size="14" fill="#444441" text-anchor="start" font-weight="500">A review</text>
  <text x="40" y="230" font-size="12" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">count &gt; bound</text>
  <rect x="190" y="100" width="86" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="233.0" y="127" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Resume</text>
  <text x="233.0" y="145" font-size="12" fill="#185FA5" text-anchor="middle">first red</text>
  <path d="M276,131 L298,131" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="300" y="100" width="86" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="343.0" y="127" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Resume</text>
  <text x="343.0" y="145" font-size="12" fill="#185FA5" text-anchor="middle">second red</text>
  <path d="M386,131 L408,131" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="410" y="100" width="86" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="453.0" y="127" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Park</text>
  <text x="453.0" y="145" font-size="12" fill="#854F0B" text-anchor="middle">third red</text>
  <rect x="300" y="186" width="86" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="343.0" y="213" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Resume</text>
  <text x="343.0" y="231" font-size="12" fill="#185FA5" text-anchor="middle">first back</text>
  <path d="M386,217 L408,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="410" y="186" width="86" height="62" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="453.0" y="213" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Resume</text>
  <text x="453.0" y="231" font-size="12" fill="#185FA5" text-anchor="middle">second back</text>
  <path d="M496,217 L518,217" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="520" y="186" width="86" height="62" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="563.0" y="213" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Park</text>
  <text x="563.0" y="231" font-size="12" fill="#854F0B" text-anchor="middle">third back</text>
  <path d="M233.0,270 L563.0,270" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="40" y="274" font-size="12" fill="#73726c" text-anchor="start">count the test reads</text>
  <path d="M233.0,265 L233.0,275" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="233.0" y="291" font-size="13" fill="#444441" text-anchor="middle">0</text>
  <path d="M343.0,265 L343.0,275" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="343.0" y="291" font-size="13" fill="#444441" text-anchor="middle">1</text>
  <path d="M453.0,265 L453.0,275" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="453.0" y="291" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">2</text>
  <path d="M563.0,265 L563.0,275" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <text x="563.0" y="291" font-size="13" fill="#444441" text-anchor="middle">3</text>
  <text x="453.0" y="307" font-size="12" fill="#73726c" text-anchor="middle">the bound</text>
</svg>
