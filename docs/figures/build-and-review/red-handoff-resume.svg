<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A red resumes the same session with the failure written down</title>
  <desc>Swimlane of one red handoff. A gate or Customs check V3, V4 or V15 goes red. The Overseer writes gate-failure.md and red-handoff.json in the job folder and interrupts the job, cause handoff-red. While resumes are left it moves the job back to running on Watcher instance n + 1, and the same session resumes on the short call budget and reads the note. Its closing result goes through Customs and gates again in instance-suffixed folders. When the resumes are spent the ticket parks instead.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="560" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">A red resumes the same session with the failure written down</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">The session reads the note, not the gate. The Overseer makes every move</text>
  <text x="255" y="96" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Overseer</text>
  <text x="480" y="96" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Watcher</text>
  <text x="695" y="96" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">session</text>
  <text x="895" y="96" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">job folder</text>
  <text x="40" y="96" font-size="13" fill="#73726c" text-anchor="start">job state</text>
  <path d="M40,104 L960,104" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="136" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gating, or</text>
  <text x="40" y="154" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs</text>
  <path d="M40,176 L960,176" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="253" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">interrupted</text>
  <path d="M40,320 L960,320" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="397" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">running</text>
  <path d="M40,464 L960,464" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="40" y="498" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">in-customs,</text>
  <text x="40" y="516" font-size="13" fill="#5F5E5A" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">then gating</text>
  <rect x="160" y="112" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="136.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Finds a red</text>
  <text x="255.0" y="154.0" font-size="13" fill="#185FA5" text-anchor="middle">a gate, or V3, V4, V15</text>
  <path d="M255,168 L255,182" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="184" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="208.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Write the failure down</text>
  <text x="255.0" y="226.0" font-size="13" fill="#185FA5" text-anchor="middle">before it interrupts</text>
  <rect x="830" y="184" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="895.0" y="208.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500">gate-failure.md</text>
  <text x="895.0" y="226.0" font-size="13" fill="#5F5E5A" text-anchor="middle">red-handoff.json</text>
  <path d="M350,212 L828,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M255,240 L255,254" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="256" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="280.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Interrupt the job</text>
  <text x="255.0" y="298.0" font-size="13" fill="#185FA5" text-anchor="middle">cause handoff-red</text>
  <rect x="500" y="256" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="595.0" y="280.0" font-size="15" fill="#633806" text-anchor="middle" font-weight="500">Park the ticket</text>
  <text x="595.0" y="298.0" font-size="13" fill="#854F0B" text-anchor="middle">the job ends failed</text>
  <path d="M350,284 L498,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="424" y="278" font-size="13" fill="#73726c" text-anchor="middle">resumes spent</text>
  <path d="M255,312 L255,326" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="328" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="352.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Back to running</text>
  <text x="255.0" y="370.0" font-size="13" fill="#185FA5" text-anchor="middle">resume-job, instance + 1</text>
  <rect x="400" y="328" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="480.0" y="352.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Instance n + 1</text>
  <text x="480.0" y="370.0" font-size="13" fill="#185FA5" text-anchor="middle">same session id</text>
  <rect x="610" y="328" width="170" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="695.0" y="352.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Session resumes</text>
  <text x="695.0" y="370.0" font-size="13" fill="#993C1D" text-anchor="middle">on the short budget</text>
  <path d="M350,356 L398,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M560,356 L608,356" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M255,384 L255,398" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="400" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="424.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Send the resume line</text>
  <text x="255.0" y="442.0" font-size="13" fill="#185FA5" text-anchor="middle">filled from the facts</text>
  <rect x="400" y="400" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="480.0" y="424.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Forwards the line</text>
  <text x="480.0" y="442.0" font-size="13" fill="#185FA5" text-anchor="middle">to session stdin</text>
  <rect x="610" y="400" width="170" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="695.0" y="424.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Reads the note</text>
  <text x="695.0" y="442.0" font-size="13" fill="#993C1D" text-anchor="middle">fixes, commits, reports</text>
  <path d="M350,428 L398,428" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M560,428 L608,428" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M895,240 L895,428 L783,428" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <path d="M255,456 L255,472" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="160" y="474" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="255.0" y="498.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Customs, then gates</text>
  <text x="255.0" y="516.0" font-size="13" fill="#185FA5" text-anchor="middle">instance-suffixed folders</text>
  <rect x="400" y="474" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="480.0" y="498.0" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="500">Logs the result</text>
  <text x="480.0" y="516.0" font-size="13" fill="#185FA5" text-anchor="middle">to its event log</text>
  <rect x="610" y="474" width="170" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="695.0" y="498.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">Closing result</text>
  <text x="695.0" y="516.0" font-size="13" fill="#993C1D" text-anchor="middle">the structured report</text>
  <path d="M610,502 L563,502" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M400,502 L353,502" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
