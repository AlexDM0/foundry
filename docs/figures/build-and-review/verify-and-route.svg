<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Each failure goes to its owner</title>
  <desc>Decision ladder from a closing result. An invalid report ends the job failed. Outcome blocked or wound-down opens an incident for the Assistant, and cannot-build ends failed. Customs refusals V3, V4 and V15 start a red handoff to the same session; V13 opens a decision for User and ends failed; any other refusal ends failed. Each failed job enters the failed-pass track: a fresh attempt, then park. A verified job goes to gating.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="588" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">Each failure goes to its owner</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">A closing result, read in order: report, outcome, Customs. The first match routes the job</text>
  <rect x="40" y="92" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="130.0" y="119.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Closing result</text>
  <rect x="40" y="170" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="194.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Report valid?</text>
  <text x="130.0" y="212.0" font-size="12" fill="#185FA5" text-anchor="middle">V1, head reported</text>
  <rect x="40" y="282" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="306.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Report outcome?</text>
  <text x="130.0" y="324.0" font-size="12" fill="#185FA5" text-anchor="middle">reviewers have none</text>
  <rect x="40" y="424" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="448.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Customs</text>
  <text x="130.0" y="466.0" font-size="12" fill="#185FA5" text-anchor="middle">checks of the role</text>
  <rect x="40" y="520" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="130.0" y="540.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">gating</text>
  <text x="130.0" y="558.0" font-size="12" fill="#185FA5" text-anchor="middle">the gates run next</text>
  <path d="M130,136 L130,168" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M130,226 L130,280" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="256" font-size="11" fill="#73726c" text-anchor="start">valid</text>
  <path d="M130,338 L130,422" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="384" font-size="11" fill="#73726c" text-anchor="start">built, or a reviewer</text>
  <path d="M130,480 L130,518" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="503" font-size="11" fill="#73726c" text-anchor="start">verified</text>
  <rect x="400" y="170" width="240" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="520.0" y="191.0" font-size="14" fill="#791F1F" text-anchor="middle" font-weight="500">Ended failed</text>
  <text x="520.0" y="209.0" font-size="12" fill="#A32D2D" text-anchor="middle">next: fresh attempt, or park</text>
  <rect x="400" y="234" width="240" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="520.0" y="255.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Incident blocked</text>
  <text x="520.0" y="273.0" font-size="12" fill="#854F0B" text-anchor="middle">the Assistant acts next</text>
  <rect x="400" y="290" width="240" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="520.0" y="311.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Incident out-of-calls</text>
  <text x="520.0" y="329.0" font-size="12" fill="#854F0B" text-anchor="middle">the Assistant acts next</text>
  <rect x="400" y="346" width="240" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="520.0" y="367.0" font-size="14" fill="#791F1F" text-anchor="middle" font-weight="500">Ended failed</text>
  <text x="520.0" y="385.0" font-size="12" fill="#A32D2D" text-anchor="middle">next: fresh attempt, or park</text>
  <rect x="400" y="402" width="240" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="520.0" y="423.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Red handoff</text>
  <text x="520.0" y="441.0" font-size="12" fill="#185FA5" text-anchor="middle">the same session resumes</text>
  <rect x="400" y="458" width="240" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="520.0" y="479.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Decision, ended failed</text>
  <text x="520.0" y="497.0" font-size="12" fill="#854F0B" text-anchor="middle">User answers first</text>
  <rect x="400" y="514" width="240" height="50" rx="8" fill="#FCEBEB" stroke="#F3D2D2"/>
  <text x="520.0" y="535.0" font-size="14" fill="#791F1F" text-anchor="middle" font-weight="500">Ended failed</text>
  <text x="520.0" y="553.0" font-size="12" fill="#A32D2D" text-anchor="middle">next: fresh attempt, or park</text>
  <path d="M220,198 L398,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="310" y="192" font-size="11" fill="#73726c" text-anchor="middle">refused: no-report, and others</text>
  <path d="M220,310 L300,310" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M220,452 L300,452" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M300,310 L300,259 L398,259" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="253" font-size="11" fill="#73726c" text-anchor="middle">blocked</text>
  <path d="M300,310 L300,315 L398,315" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="309" font-size="11" fill="#73726c" text-anchor="middle">wound-down</text>
  <path d="M300,310 L300,371 L398,371" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="365" font-size="11" fill="#73726c" text-anchor="middle">cannot-build</text>
  <path d="M300,452 L300,427 L398,427" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="421" font-size="11" fill="#73726c" text-anchor="middle">V3, V4, V15</text>
  <path d="M300,452 L300,483 L398,483" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="477" font-size="11" fill="#73726c" text-anchor="middle">V13</text>
  <path d="M300,452 L300,539 L398,539" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="350" y="533" font-size="11" fill="#73726c" text-anchor="middle">V7, any other</text>
</svg>
