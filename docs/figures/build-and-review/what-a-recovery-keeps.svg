<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A recovery gives up more as it climbs, never the worktree</title>
  <desc>Matrix of six recoveries against job, session, Watcher instance, attempt, handoff cycle and worktree. A red resume and a crash resume keep everything but the Watcher instance. A builder sent back by a review keeps the session, attempt and cycle under a new job. A replacement on a red keeps the attempt and cycle with a new session. A replacement on a crash and a fresh attempt keep only the worktree.</desc>
