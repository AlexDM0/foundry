  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">A recovery gives up more as it climbs, never the worktree</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">What the next session inherits from the last</text>
  <text x="238.5" y="108" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">Job</text>
  <text x="311.5" y="108" font-size="13" fill="#444441" text-anchor="middle" font-weight="500">Session</text>
