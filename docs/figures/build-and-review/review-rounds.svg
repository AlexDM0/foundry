<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A round is earned by rework and restarts when the builder returns</title>
  <desc>One ticket across five jobs. J1 builds. Review J2, round 1, reworks past REWORK_ROUND_THRESHOLD_LINES and is granted round 2. Review J3, round 2, reports a claim that does not hold, so the ticket goes back. J4 resumes the builder session and the ticket re-enters review. Review J5 starts again at round 1, reports no failed claim and stays under the threshold, so the ticket queues for its Airlock.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="998" height="350" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" text-anchor="start" font-weight="500">A round is earned by rework and restarts when the builder returns</text>
  <text x="40" y="68" font-size="13" fill="#73726c" text-anchor="start">One ticket. A granted round adds one; ticket-finished starts the count again</text>
  <text x="40" y="134" font-size="13" fill="#5F5E5A" text-anchor="start">What it did</text>
  <text x="40" y="214" font-size="13" fill="#5F5E5A" text-anchor="start">Reviewer</text>
  <text x="40" y="298" font-size="13" fill="#5F5E5A" text-anchor="start">Builder</text>
  <path d="M40,166 L960,166" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <path d="M40,250 L960,250" stroke="#ECE7DC" stroke-width="1" fill="none"/>
  <text x="338.0" y="126" font-size="13" fill="#5F5E5A" text-anchor="middle">reworked past</text>
  <text x="338.0" y="144" font-size="13" fill="#5F5E5A" text-anchor="middle">the threshold</text>
  <text x="482.0" y="126" font-size="13" fill="#5F5E5A" text-anchor="middle">a claim</text>
  <text x="482.0" y="144" font-size="13" fill="#5F5E5A" text-anchor="middle">does-not-hold</text>
  <text x="770.0" y="126" font-size="13" fill="#5F5E5A" text-anchor="middle">no failed claim,</text>
  <text x="770.0" y="144" font-size="13" fill="#5F5E5A" text-anchor="middle">under the threshold</text>
  <rect x="130" y="264" width="128" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="194.0" y="290" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J1</text>
  <text x="194.0" y="308" font-size="13" fill="#993C1D" text-anchor="middle">built</text>
  <rect x="274" y="178" width="128" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="338.0" y="204" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J2, round 1</text>
  <text x="338.0" y="222" font-size="13" fill="#993C1D" text-anchor="middle">round-granted</text>
  <rect x="418" y="178" width="128" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="482.0" y="204" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J3, round 2</text>
  <text x="482.0" y="222" font-size="13" fill="#993C1D" text-anchor="middle">does-not-hold</text>
  <rect x="562" y="264" width="128" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="626.0" y="290" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J4</text>
  <text x="626.0" y="308" font-size="12" fill="#993C1D" text-anchor="middle">same builder session</text>
  <rect x="706" y="178" width="128" height="60" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="770.0" y="204" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500">J5, round 1</text>
  <text x="770.0" y="222" font-size="13" fill="#993C1D" text-anchor="middle">reviewed</text>
  <rect x="850" y="178" width="110" height="60" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="905.0" y="204" font-size="15" fill="#27500A" text-anchor="middle" font-weight="500">Queued</text>
  <text x="905.0" y="222" font-size="12" fill="#3B6D11" text-anchor="middle">for its Airlock</text>
  <path d="M258,294 L338.0,294 L338.0,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M402,208 L416,208" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M546,208 L626.0,208 L626.0,262" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M690,294 L770.0,294 L770.0,240" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M834,208 L848,208" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="778.0" y="276" font-size="12" fill="#73726c" text-anchor="start">ticket-finished: count restarts</text>
</svg>
