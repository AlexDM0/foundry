<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Open decisions and incidents block only the steps marked</title>
  <desc>A grid of eight open items against five steps. Only outage reaches the whole board: it holds every launch and resume, merge queueing, and the Airlock claim while the board is paused. Every other row stalls one ticket or one job, so an unanswered decision costs only its marked cells.</desc>
