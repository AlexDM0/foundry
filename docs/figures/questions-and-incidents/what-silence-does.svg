<svg xmlns="http://www.w3.org/2000/svg" width="680" height="576" viewBox="0 0 680 576" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>If nobody acts, every kind falls to one of five ends</title>
  <desc>Twelve incident kinds grouped by what their default does. Question kinds and quiet-job ask User, blocked, job-lost and merge-gate-failed park the ticket, and findings-delivered goes to triage; out-of-calls and resume-failed get a fresh agent; setup-failed, gate-cannot-run and resolution-over-threshold only close. The three kinds marked once park on their next default, so a retry cannot loop.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="574" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">If nobody acts, every kind falls to one of five ends</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Each incident kind on the left, its default end on the right</text>
  <rect x="40" y="88" width="240" height="82" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="54" y="111.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">system-question</text>
  <text x="54" y="133.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">malformed-ticket</text>
  <text x="54" y="155.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">quiet-job</text>
  <rect x="370" y="101.0" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="480.0" y="125.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">User is asked</text>
  <text x="480.0" y="143.0" font-size="12" fill="#854F0B" text-anchor="middle">a decision opens</text>
  <path d="M280 129.0 L364 129.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="184" width="240" height="82" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="54" y="207.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">blocked</text>
  <text x="54" y="229.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">job-lost</text>
  <text x="54" y="251.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">merge-gate-failed</text>
  <rect x="370" y="197.0" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="480.0" y="221.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Ticket parked</text>
  <text x="480.0" y="239.0" font-size="12" fill="#854F0B" text-anchor="middle">a parked decision for User</text>
  <path d="M280 225.0 L364 225.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="280" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="54" y="316.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">findings-delivered</text>
  <rect x="370" y="284.0" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="480.0" y="308.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">User triages</text>
  <text x="480.0" y="326.0" font-size="12" fill="#854F0B" text-anchor="middle">Low-priority triage</text>
  <path d="M280 312.0 L364 312.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="358" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="54" y="383.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">out-of-calls</text>
  <rect x="222" y="370.0" width="46" height="17" rx="4" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="245" y="383.0" font-size="11" fill="#185FA5" text-anchor="middle">once</text>
  <text x="54" y="405.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">resume-failed</text>
  <rect x="370" y="362.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="480.0" y="386.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Fresh agent</text>
  <text x="480.0" y="404.0" font-size="12" fill="#185FA5" text-anchor="middle">asked, or at next launch</text>
  <path d="M280 390.0 L364 390.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="436" width="240" height="82" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="54" y="459.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">setup-failed</text>
  <rect x="222" y="446.0" width="46" height="17" rx="4" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="245" y="459.0" font-size="11" fill="#185FA5" text-anchor="middle">once</text>
  <text x="54" y="481.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">gate-cannot-run</text>
  <rect x="222" y="468.0" width="46" height="17" rx="4" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="245" y="481.0" font-size="11" fill="#185FA5" text-anchor="middle">once</text>
  <text x="54" y="503.0" font-size="12" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">resolution-over-threshold</text>
  <rect x="370" y="449.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="480.0" y="473.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Only closes</text>
  <text x="480.0" y="491.0" font-size="12" fill="#185FA5" text-anchor="middle">next launch or Airlock step</text>
  <path d="M280 477.0 L364 477.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M590 390.0 L618 390.0 L618 225.0 L596 225.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <path d="M590 477.0 L618 477.0 L618 390.0" stroke="#bfbdb0" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="40" y="540" font-size="11" fill="#73726c">once: taken once per ticket. The next default of that kind parks instead, along the dashed line.</text>
  <text x="40" y="556" font-size="11" fill="#73726c">A question incident an Airlock opened carries no questions, so its default only closes.</text>
</svg>
