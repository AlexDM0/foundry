<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only a decision is meant to wait for a person</title>
  <desc>An agent raises an incident or a decision. Code raises all three: incident, decision and notice. An incident closes by a move or its default, can become a decision through an escalation, a park or a quiet-job default, and its default raises a notice. No path leads from a decision back to an incident.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="450" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">Only a decision is meant to wait for a person</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Who raises trouble, who takes it, and how it drains</text>
  <rect x="72" y="150" width="100" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="122.0" y="174.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Agent</text>
  <text x="122.0" y="192.0" font-size="12" fill="#993C1D" text-anchor="middle">asks</text>
  <rect x="72" y="300" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="122.0" y="324.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Code</text>
  <text x="122.0" y="342.0" font-size="12" fill="#185FA5" text-anchor="middle">finds trouble</text>
  <rect x="250" y="96" width="180" height="64" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340.0" y="124.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Incident</text>
  <text x="340.0" y="142.0" font-size="12" fill="#993C1D" text-anchor="middle">goes to the Assistant</text>
  <rect x="250" y="224" width="180" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="340.0" y="252.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Decision</text>
  <text x="340.0" y="270.0" font-size="12" fill="#854F0B" text-anchor="middle">waits for User</text>
  <rect x="250" y="352" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340.0" y="376.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Notice</text>
  <text x="340.0" y="394.0" font-size="12" fill="#5F5E5A" text-anchor="middle">derived, read only</text>
  <rect x="520" y="96" width="120" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580.0" y="124.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Closed</text>
  <text x="580.0" y="142.0" font-size="12" fill="#5F5E5A" text-anchor="middle">no person needed</text>
  <path d="M172 165 L215 165 L215 128 L244 128" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M172 192 L215 192 L215 244 L244 244" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M72 328 L50 328 L50 110 L244 110" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M172 318 L232 318 L232 268 L244 268" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M172 342 L215 342 L215 380 L244 380" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M340 160 L340 218" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="186" font-size="11" fill="#73726c">escalate, park,</text>
  <text x="350" y="200" font-size="11" fill="#73726c">or quiet-job default</text>
  <path d="M430 118 L514 118" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="472" y="110" font-size="11" fill="#73726c" text-anchor="middle">move or default</text>
  <path d="M430 146 L470 146 L470 380 L436 380" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="480" y="256" font-size="11" fill="#73726c" font-family="ui-monospace,Menlo,Consolas,monospace">incident-defaulted</text>
  <text x="480" y="272" font-size="11" fill="#73726c">raises this notice</text>
</svg>
