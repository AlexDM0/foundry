<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three answers run code; seven more release something</title>
  <desc>Thirteen decision kinds in three columns. The answer runs code for agent-question, ready-drafts and pipeline-proposal. Seven are read while open, so closing them frees something, and outage, checks-not-set, waiver and landing-refused need a further command too. Answering parked, leftover-worktree or target-moved moves nothing.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="538" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">Three answers run code; seven more release something</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Amber cards leave User a step the answer does not take</text>
  <text x="40" y="100" font-size="14" fill="#0C447C" font-weight="500">Answer runs code</text>
  <text x="225" y="100" font-size="14" fill="#444441" font-weight="500">Read while open</text>
  <text x="465" y="100" font-size="14" fill="#444441" font-weight="500">Answer moves nothing</text>
  <rect x="40" y="114" width="175" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="52" y="134" font-size="12" fill="#0C447C" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">agent-question</text>
  <text x="52" y="152" font-size="12" fill="#185FA5">reaches the session</text>
  <rect x="40" y="172" width="175" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="52" y="192" font-size="12" fill="#0C447C" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">ready-drafts</text>
  <text x="52" y="210" font-size="12" fill="#185FA5">readies the named drafts</text>
  <rect x="40" y="230" width="175" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="52" y="250" font-size="12" fill="#0C447C" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-proposal</text>
  <text x="52" y="268" font-size="12" fill="#185FA5">Accept writes the gates</text>
  <rect x="225" y="114" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237" y="134" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">branch-touches-agent-config</text>
  <text x="237" y="152" font-size="12" fill="#5F5E5A">any answer frees the ticket</text>
  <rect x="225" y="172" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237" y="192" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">quiet-job</text>
  <text x="237" y="210" font-size="12" fill="#5F5E5A">frees a held resume</text>
  <rect x="225" y="230" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="250" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merge-refused</text>
  <text x="237" y="268" font-size="12" fill="#854F0B">User first: repair the cause</text>
  <rect x="225" y="288" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="308" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">outage</text>
  <text x="237" y="326" font-size="12" fill="#854F0B">User also: oversee resume</text>
  <rect x="225" y="346" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="366" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</text>
  <text x="237" y="384" font-size="12" fill="#854F0B">opens again until a pipeline is set</text>
  <rect x="225" y="404" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="424" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">waiver</text>
  <text x="237" y="442" font-size="12" fill="#854F0B">User also: job fresh</text>
  <rect x="225" y="462" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="482" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">landing-refused</text>
  <text x="237" y="500" font-size="12" fill="#854F0B">User also: repair, ticket unhold</text>
  <rect x="465" y="114" width="175" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="134" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">parked</text>
  <text x="477" y="152" font-size="12" fill="#854F0B">User: ticket unhold</text>
  <rect x="465" y="172" width="175" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="192" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">leftover-worktree</text>
  <text x="477" y="210" font-size="12" fill="#854F0B">User: remove folder</text>
  <rect x="465" y="230" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="477" y="250" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">target-moved</text>
  <text x="477" y="268" font-size="12" fill="#5F5E5A">not opened as built</text>
</svg>
