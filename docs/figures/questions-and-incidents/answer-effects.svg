<svg xmlns="http://www.w3.org/2000/svg" width="680" height="724" viewBox="0 0 680 724" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One answer runs code; ten more release something</title>
  <desc>Sixteen decision kinds in three columns. The answer runs code only for agent-question. Ten are read while open, so closing them frees something, and merge-refused, outage, checks-not-set, waiver, landing-refused, forced-stop-refused and api-authentication-failed leave User a further step. Answering parked, leftover-worktree, api-key-not-set or target-moved moves nothing, and a retired pipeline-proposal is withdrawn at the next Pass.</desc>
  <rect x="1" y="1" width="678" height="722" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">One answer runs code; ten more release something</text>
  <text x="40" y="66" font-size="13" fill="#73726c">Amber cards leave User a step the answer does not take</text>
  <text x="40" y="100" font-size="14" fill="#0C447C" font-weight="500">Answer runs code</text>
  <rect x="40" y="114" width="175" height="50" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="52" y="134" font-size="12" fill="#0C447C" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">agent-question</text>
  <text x="52" y="152" font-size="12" fill="#185FA5">reaches the session</text>
  <text x="225" y="100" font-size="14" fill="#444441" font-weight="500">Read while open</text>
  <rect x="225" y="114" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237" y="134" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">branch-touches-agent-config</text>
  <text x="237" y="152" font-size="12" fill="#5F5E5A">any answer frees the ticket</text>
  <rect x="225" y="172" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237" y="192" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">quiet-job</text>
  <text x="237" y="210" font-size="12" fill="#5F5E5A">frees a held resume</text>
  <rect x="225" y="230" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="237" y="250" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">budget-reached</text>
  <text x="237" y="268" font-size="12" fill="#5F5E5A">frees its tickets or the Assistant</text>
  <rect x="225" y="288" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="308" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">merge-refused</text>
  <text x="237" y="326" font-size="12" fill="#854F0B">User first: repair the cause</text>
  <rect x="225" y="346" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="366" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">outage</text>
  <text x="237" y="384" font-size="12" fill="#854F0B">User also: oversee resume</text>
  <rect x="225" y="404" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="424" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">checks-not-set</text>
  <text x="237" y="442" font-size="12" fill="#854F0B">an Apply withdraws it</text>
  <rect x="225" y="462" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="482" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">waiver</text>
  <text x="237" y="500" font-size="12" fill="#854F0B">User also: job fresh</text>
  <rect x="225" y="520" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="540" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">landing-refused</text>
  <text x="237" y="558" font-size="12" fill="#854F0B">User also: repair, ticket unhold</text>
  <rect x="225" y="578" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="598" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">forced-stop-refused</text>
  <text x="237" y="616" font-size="12" fill="#854F0B">User first: end the process tree</text>
  <rect x="225" y="636" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="237" y="656" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">api-authentication-failed</text>
  <text x="237" y="674" font-size="12" fill="#854F0B">User first: fix the API key</text>
  <text x="465" y="100" font-size="14" fill="#444441" font-weight="500">Answer moves nothing</text>
  <rect x="465" y="114" width="175" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="134" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">parked</text>
  <text x="477" y="152" font-size="12" fill="#854F0B">User: ticket unhold</text>
  <rect x="465" y="172" width="175" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="192" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">leftover-worktree</text>
  <text x="477" y="210" font-size="12" fill="#854F0B">User: remove folder</text>
  <rect x="465" y="230" width="175" height="50" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="477" y="250" font-size="12" fill="#633806" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">api-key-not-set</text>
  <text x="477" y="268" font-size="12" fill="#854F0B">User: set the key</text>
  <rect x="465" y="288" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="477" y="308" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">target-moved</text>
  <text x="477" y="326" font-size="12" fill="#5F5E5A">not opened as built</text>
  <rect x="465" y="346" width="175" height="50" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="477" y="366" font-size="12" fill="#444441" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">pipeline-proposal</text>
  <text x="477" y="384" font-size="12" fill="#5F5E5A">retired: withdrawn</text>
</svg>
