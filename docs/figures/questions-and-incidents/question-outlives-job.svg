<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A replaced job's question waits on the ticket for User</title>
  <desc>A build or review job ends replaced with a question open. The decision's jobId becomes null and the ticket takes the hold awaiting answer, and nobody drives until User answers. The answer goes under the ticket's Questions section, the hold lifts, and the Overseer launches a fresh job whose agent reads it; a stopped or parked job keeps its own hold, so ticket unhold is needed too.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="568" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">A replaced job's question waits on the ticket for User</text>
  <text x="40" y="66" font-size="13" fill="#73726c">No agent starts until the answer is written</text>
  <text x="115" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">User</text>
  <path d="M115 110 L115 530" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="265" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Overseer</text>
  <path d="M265 110 L265 530" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="415" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Ticket file</text>
  <path d="M415 110 L415 530" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="565" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Agent</text>
  <path d="M565 110 L565 530" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <rect x="40" y="306" width="600" height="86" rx="8" fill="#FBF3E4" stroke="#FBF3E4"/>
  <text x="340" y="342" font-size="12" fill="#854F0B" text-anchor="middle">Nobody drives: Playbook.ticketIsHeld reads the open question,</text>
  <text x="340" y="360" font-size="12" fill="#854F0B" text-anchor="middle">and the hold stays until User answers</text>
  <rect x="495" y="118" width="140" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="565.0" y="142.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Job ends</text>
  <text x="565.0" y="160.0" font-size="12" fill="#993C1D" text-anchor="middle">replaced</text>
  <rect x="195" y="178" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="265.0" y="202.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Decision rebound</text>
  <text x="265.0" y="220.0" font-size="12" fill="#185FA5" text-anchor="middle">jobId becomes null</text>
  <rect x="345" y="238" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="415.0" y="262.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Hold written</text>
  <text x="415.0" y="280.0" font-size="12" fill="#5F5E5A" text-anchor="middle">awaiting answer (E&lt;n&gt;)</text>
  <path d="M495 146 L265 146 L265 172" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M335 206 L415 206 L415 232" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="45" y="402" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="115.0" y="426.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Answers</text>
  <text x="115.0" y="444.0" font-size="12" fill="#854F0B" text-anchor="middle">decision E&lt;n&gt;</text>
  <path d="M185 430 L339 430" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="345" y="402" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="415.0" y="426.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">## Questions</text>
  <text x="415.0" y="444.0" font-size="12" fill="#5F5E5A" text-anchor="middle">answer added, hold lifted</text>
  <rect x="195" y="470" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="265.0" y="494.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Launches</text>
  <text x="265.0" y="512.0" font-size="12" fill="#185FA5" text-anchor="middle">a fresh job</text>
  <path d="M415 458 L415 498 L341 498" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="495" y="470" width="140" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="565.0" y="494.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Fresh agent</text>
  <text x="565.0" y="512.0" font-size="12" fill="#993C1D" text-anchor="middle">reads the answer</text>
  <path d="M335 512 L489 512" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="340" y="552" font-size="11" fill="#73726c" text-anchor="middle">A stopped or parked job keeps its own hold: the answer lands, and ticket unhold starts the next job.</text>
</svg>
