<svg xmlns="http://www.w3.org/2000/svg" width="680" height="414" viewBox="0 0 680 414" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Only an unmoved cursor counts, and silence keeps asking</title>
  <desc>A strip of sweeps for one running job, each showing the count, where an event moves the cursor and resets it. When the count reaches QUIET_JOB_SWEEPS the job is due: a quiet-job incident opens, its default opens a decision for User, and the due sweep restarts the count. A job still silent comes due again and opens another incident and decision, none while one is open.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="412" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">Only an unmoved cursor counts, and silence keeps asking</text>
  <text x="40" y="66" font-size="13" fill="#73726c">One running job across its sweeps</text>
  <rect x="40.0" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="65.0" y="155" font-size="13" fill="#444441" text-anchor="middle">0</text>
  <rect x="101.1" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="126.1" y="155" font-size="13" fill="#444441" text-anchor="middle">1</text>
  <rect x="162.2" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="187.2" y="155" font-size="13" fill="#444441" text-anchor="middle">2</text>
  <rect x="223.3" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="248.3" y="155" font-size="13" fill="#444441" text-anchor="middle">0</text>
  <rect x="284.4" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="309.4" y="155" font-size="13" fill="#444441" text-anchor="middle">1</text>
  <rect x="345.6" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="370.6" y="155" font-size="13" fill="#444441" text-anchor="middle">…</text>
  <rect x="406.7" y="130" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="431.7" y="155" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">due</text>
  <rect x="467.8" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="492.8" y="155" font-size="13" fill="#444441" text-anchor="middle">1</text>
  <rect x="528.9" y="130" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="553.9" y="155" font-size="13" fill="#444441" text-anchor="middle">…</text>
  <rect x="590.0" y="130" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="615.0" y="155" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">due</text>
  <text x="248.3" y="104" font-size="11" fill="#993C1D" text-anchor="middle">an event: the cursor moved</text>
  <path d="M248.3 110 L248.3 124" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M431.7 170 L431.7 214" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="316.7" y="218" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="401.7" y="242.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">quiet-job incident</text>
  <text x="401.7" y="260.0" font-size="12" fill="#185FA5" text-anchor="middle">goes to the Assistant</text>
  <path d="M401.7 274 L401.7 304" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="316.7" y="308" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="401.7" y="332.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">quiet-job decision</text>
  <text x="401.7" y="350.0" font-size="12" fill="#854F0B" text-anchor="middle">the default asks User</text>
  <path d="M615.0 170 L615.0 214" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="504" y="218" width="136" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="572.0" y="242.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Another incident</text>
  <text x="572.0" y="260.0" font-size="12" fill="#185FA5" text-anchor="middle">if the first closed</text>
  <path d="M572 274 L572 304" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="504" y="308" width="136" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="572.0" y="332.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Another decision</text>
  <text x="572.0" y="350.0" font-size="12" fill="#854F0B" text-anchor="middle">the default again</text>
  <text x="40" y="392" font-size="11" fill="#73726c">Each cell is one sweep and shows the count. due means QUIET_JOB_SWEEPS sweeps with nothing new.</text>
</svg>
