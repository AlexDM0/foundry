<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>An answer is a write first and a delivery later</title>
  <desc>A session asks, its Watcher logs the event, and the Overseer records the decision and moves the job to waiting-for-answer. User's answer is a tracker write that moves the job back to running and needs no Overseer. The next Pass sends the line, the Watcher takes it, the Overseer writes the marker and the tool call returns; a Watcher not listening writes no marker and is tried again next Pass.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="568" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="44" font-size="18" fill="#3d3d3a" font-weight="500">An answer is a write first and a delivery later</text>
  <text x="40" y="66" font-size="13" fill="#73726c">One agent question on a live job, time running down</text>
  <text x="100" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">User</text>
  <path d="M100 110 L100 386" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="220" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Overseer</text>
  <path d="M220 110 L220 550" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="340" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Watcher</text>
  <path d="M340 110 L340 550" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="460" y="100" font-size="14" fill="#5F5E5A" text-anchor="middle" font-weight="500">Session</text>
  <path d="M460 110 L460 550" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <text x="580" y="100" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="500">progress.json</text>
  <path d="M580 110 L580 550" stroke="#E1DDD0" stroke-width="1" fill="none"/>
  <rect x="40" y="292" width="600" height="96" rx="8" fill="#FBF3E4" stroke="#FBF3E4"/>
  <text x="50" y="310" font-size="12" fill="#854F0B">Overseer may be down</text>
  <rect x="404.0" y="118" width="112" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="460.0" y="140.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Asks</text>
  <text x="460.0" y="158.0" font-size="12" fill="#993C1D" text-anchor="middle">a tool call opens</text>
  <path d="M404.0 144 L402.0 144" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="284.0" y="118" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="140.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Logs it</text>
  <text x="340.0" y="158.0" font-size="12" fill="#185FA5" text-anchor="middle">an event</text>
  <path d="M284.0 144 L282.0 144" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="164.0" y="118" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220.0" y="140.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Next Pass</text>
  <text x="220.0" y="158.0" font-size="12" fill="#185FA5" text-anchor="middle">opens the decision</text>
  <path d="M220 170 L220 214 L518.0 214" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="345" y="208" font-size="11" fill="#73726c" text-anchor="middle">open decision, job waits</text>
  <rect x="524.0" y="188" width="112" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580.0" y="210.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Job waits</text>
  <text x="580.0" y="228.0" font-size="12" fill="#5F5E5A" text-anchor="middle">for an answer</text>
  <rect x="44.0" y="316" width="112" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="100.0" y="338.0" font-size="14" fill="#633806" text-anchor="middle" font-weight="500">Answers</text>
  <text x="100.0" y="356.0" font-size="12" fill="#854F0B" text-anchor="middle">decide E&lt;n&gt;</text>
  <path d="M156.0 342 L518.0 342" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="345" y="336" font-size="11" fill="#73726c" text-anchor="middle">an ordinary tracker write</text>
  <rect x="524.0" y="316" width="112" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="580.0" y="338.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500">Job runs</text>
  <text x="580.0" y="356.0" font-size="12" fill="#5F5E5A" text-anchor="middle">answer recorded</text>
  <rect x="164.0" y="404" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220.0" y="426.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Next Pass</text>
  <text x="220.0" y="444.0" font-size="12" fill="#185FA5" text-anchor="middle">sends the line</text>
  <path d="M276.0 430 L278.0 430" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="284.0" y="404" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="340.0" y="435.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Takes the line</text>
  <path d="M396.0 430 L398.0 430" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="404.0" y="404" width="112" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="460.0" y="426.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500">Tool call</text>
  <text x="460.0" y="444.0" font-size="12" fill="#993C1D" text-anchor="middle">returns</text>
  <rect x="164.0" y="492" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="220.0" y="514.0" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="500">Writes marker</text>
  <text x="220.0" y="532.0" font-size="12" fill="#185FA5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">.delivered</text>
  <path d="M220 456 L220 486" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="228" y="476" font-size="11" fill="#73726c">Watcher took it</text>
  <path d="M164.0 416 L136 416 L136 444 L158.0 444" stroke="#bfbdb0" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <text x="40" y="410" font-size="11" fill="#73726c">Watcher not</text>
  <text x="40" y="424" font-size="11" fill="#73726c">listening:</text>
  <text x="40" y="438" font-size="11" fill="#73726c">no marker,</text>
  <text x="40" y="452" font-size="11" fill="#73726c">tried next Pass</text>
</svg>
