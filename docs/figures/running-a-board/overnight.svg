<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Agents outlive a stopped Overseer; the next start settles what ended</title>
  <desc>In the evening an Overseer drives the board and oversee stop ends it. A shaded span follows where nobody drives, while an agent keeps running under its Watcher and ends inside the span. oversee --detach starts the next Overseer, which settles the ended job. The stored state then decides: paused starts no ticket, running launches at the first Pass.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="354" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Agents outlive a stopped Overseer; the next start settles what ended</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One night, left to right. In the shaded span nobody drives.</text>
  <rect x="230" y="92" width="200" height="136" rx="6" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="330" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle">nobody drives</text>
  <text x="40" y="118" font-size="12" fill="#0C447C" font-weight="500">Overseer</text>
  <rect x="40" y="124" width="190" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <rect x="430" y="124" width="210" height="26" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="135" y="141" font-size="12" fill="#185FA5" text-anchor="middle">drives the board</text>
  <text x="535" y="141" font-size="12" fill="#185FA5" text-anchor="middle">settles what ended, drives</text>
  <text x="40" y="180" font-size="12" fill="#712B13" font-weight="500">Agent, under its Watcher</text>
  <rect x="40" y="186" width="320" height="26" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="135" y="203" font-size="12" fill="#993C1D" text-anchor="middle">runs</text>
  <text x="295" y="203" font-size="12" fill="#993C1D" text-anchor="middle">keeps running</text>
  <text x="366" y="203" font-size="12" fill="#993C1D">ends</text>
  <path d="M230,92 L230,250" fill="none" stroke="#9b9a90" stroke-width="1"/>
  <path d="M430,92 L430,250" fill="none" stroke="#9b9a90" stroke-width="1"/>
  <text x="230" y="266" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee stop</text>
  <text x="430" y="266" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">oversee --detach</text>
  <path d="M430,274 L430,284" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M430,284 L535,284 L535,296" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M430,284 L300,284 L300,296" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="640" y="279" font-size="11" fill="#73726c" text-anchor="end">the stored state decides</text>
  <rect x="190" y="298" width="220" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="300.0" y="317.0" font-size="13" fill="#633806" font-weight="500" text-anchor="middle">stored paused</text>
  <text x="300.0" y="334.0" font-size="12" fill="#854F0B" text-anchor="middle">no ticket starts</text>
  <rect x="430" y="298" width="210" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="535.0" y="317.0" font-size="13" fill="#0C447C" font-weight="500" text-anchor="middle">stored running</text>
  <text x="535.0" y="334.0" font-size="12" fill="#185FA5" text-anchor="middle">launches at the first Pass</text>
</svg>
