<svg xmlns="http://www.w3.org/2000/svg" width="680" height="406" viewBox="0 0 680 406" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Pick the smallest stop that does the job</title>
  <desc>A decision tree from the question what must stop. One ticket with no agent on it: Hold keeps it from launching, Park does the same and opens a question to you. One running job: Wind down lets it wrap up and holds the ticket, Stop ends it now and holds the ticket, Fresh agent starts the next attempt on the same worktree. The whole board: Pause lets running agents carry on, job stop --all --wind-down also winds them down and holds their tickets.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="404" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Pick the smallest stop that does the job</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Every leaf names its consequence. Amber is your question, blue is what the Overseer then does.</text>
  <rect x="240" y="88" width="200" height="40" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="340.0" y="113.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">What must stop?</text>
  <path d="M340,128 L340,142" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M135,142 L545,142" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <path d="M135,142 L135,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,142 L340,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M545,142 L545,154" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="156" width="190" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="135.0" y="177.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">One ticket</text>
  <text x="135.0" y="194.0" font-size="12" fill="#854F0B" text-anchor="middle">no agent on it</text>
  <rect x="245" y="156" width="190" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="340.0" y="185.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">One running job</text>
  <rect x="450" y="156" width="190" height="48" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="545.0" y="185.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">The whole board</text>
  <path d="M135,204 L135,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="224" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="135.0" y="244.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Hold</text>
  <text x="135.0" y="261.0" font-size="12" fill="#185FA5" text-anchor="middle">keeps it from launching</text>
  <path d="M135,270 L135,281" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="40" y="282" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="135.0" y="302.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Park</text>
  <text x="135.0" y="319.0" font-size="12" fill="#185FA5" text-anchor="middle">same, and asks you</text>
  <path d="M340,204 L340,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="245" y="224" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340.0" y="244.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Wind down</text>
  <text x="340.0" y="261.0" font-size="12" fill="#185FA5" text-anchor="middle">wraps up; ticket held</text>
  <path d="M340,270 L340,281" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="245" y="282" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340.0" y="302.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Stop</text>
  <text x="340.0" y="319.0" font-size="12" fill="#185FA5" text-anchor="middle">ends now; ticket held</text>
  <path d="M340,328 L340,339" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="245" y="340" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340.0" y="360.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Fresh agent</text>
  <text x="340.0" y="377.0" font-size="12" fill="#185FA5" text-anchor="middle">next attempt, same worktree</text>
  <path d="M545,204 L545,222" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="450" y="224" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="545.0" y="244.0" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Pause</text>
  <text x="545.0" y="261.0" font-size="12" fill="#185FA5" text-anchor="middle">running agents carry on</text>
  <path d="M545,270 L545,281" fill="none" stroke="#bfbdb0" stroke-width="1.6"/>
  <rect x="450" y="282" width="190" height="46" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="545.0" y="302.0" font-size="11" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">job stop --all --wind-down</text>
  <text x="545.0" y="319.0" font-size="12" fill="#185FA5" text-anchor="middle">agents wrap up; tickets held</text>
</svg>
