<svg xmlns="http://www.w3.org/2000/svg" width="680" height="272" viewBox="0 0 680 272" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Three doors, one draft ticket, one gate</title>
  <desc>Intake, a Claude Code session and ticket add all end at a draft ticket. You press Ready, and the Overseer checks for a numbered Acceptance and a Brief. A ticket that passes reaches the Ready lane. One that fails is refused, and the refusal says what is missing.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="270" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">Three doors, one draft ticket, one gate</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Nothing builds until a ticket passes the readiness check.</text>
  <rect x="40" y="88" width="134" height="46" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="107.0" y="116.0" font-size="12" fill="#633806" font-weight="500" text-anchor="middle">Intake</text>
  <rect x="40" y="146" width="134" height="46" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="107.0" y="174.0" font-size="12" fill="#633806" font-weight="500" text-anchor="middle">Claude Code session</text>
  <rect x="40" y="204" width="134" height="46" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="107.0" y="232.0" font-size="12" fill="#633806" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ticket add</text>
  <rect x="202" y="134" width="96" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="250.0" y="166.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">draft ticket</text>
  <path d="M174,111 C188,111 186,150 200,150" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M174,169 L200,162" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M174,227 C188,227 186,176 200,176" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="326" y="134" width="96" height="54" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="374.0" y="157.0" font-size="13" fill="#633806" font-weight="500" text-anchor="middle">You press</text>
  <text x="374.0" y="174.0" font-size="13" fill="#633806" font-weight="500" text-anchor="middle">Ready</text>
  <path d="M298,161 L324,161" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="450" y="134" width="96" height="54" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="498.0" y="158.0" font-size="13" fill="#0C447C" font-weight="500" text-anchor="middle">Checks it</text>
  <text x="498.0" y="175.0" font-size="11" fill="#185FA5" text-anchor="middle">Acceptance, Brief</text>
  <path d="M422,161 L448,161" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="574" y="134" width="66" height="54" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="607.0" y="166.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">Ready</text>
  <path d="M546,161 L572,161" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M498,188 L498,212" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="506" y="204" font-size="11" fill="#73726c">fails</text>
  <rect x="420" y="214" width="156" height="44" rx="8" fill="#FCEBEB" stroke="#F3D2D2" stroke-width="1"/>
  <text x="498.0" y="233.0" font-size="13" fill="#791F1F" font-weight="500" text-anchor="middle">Refused</text>
  <text x="498.0" y="250.0" font-size="12" fill="#A32D2D" text-anchor="middle">says what is missing</text>
</svg>
