<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The merge queue view gives the landing order and why it waits</title>
  <desc>A schematic of the merge queue view. The order rule sits at the top: five keys, or User's Merge presses when merge approval is on. Under the target main come who holds the Airlock and in which phase, why landings wait, the candidates in landing order with priority and forecast, and git's predicted conflicts between candidates.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="468" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">The merge queue view gives the landing order and why it waits</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A schematic of one target with synthetic tickets. Lines link to their tickets.</text>
  <rect x="40" y="88" width="600" height="216" rx="10" fill="#FFFFFF" stroke="#E1DDD0" stroke-width="1"/>
  <text x="84" y="112" font-size="12" fill="#5F5E5A">Ordered by priority, clean before conflicting, fewest conflicts caused,</text>
  <text x="84" y="128" font-size="12" fill="#5F5E5A">readiness, then ticket id.</text>
  <circle cx="62" cy="116" r="9" fill="#3d3d3a"/>
  <text x="62" y="120" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">1</text>
  <text x="84" y="158" font-size="14" font-weight="500" fill="#3d3d3a" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
  <text x="84" y="182" font-size="12" fill="#3d3d3a">J7 for #003 holds the Airlock: gating</text>
  <circle cx="62" cy="178" r="9" fill="#3d3d3a"/>
  <text x="62" y="182" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">2</text>
  <text x="84" y="206" font-size="12" fill="#854F0B">landings wait: the main checkout's changes to README.md block the fast-forward</text>
  <circle cx="62" cy="202" r="9" fill="#3d3d3a"/>
  <text x="62" y="206" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">3</text>
  <text x="84" y="232" font-size="12" fill="#3d3d3a">#005 high · clean</text>
  <text x="84" y="250" font-size="12" fill="#3d3d3a">#006 normal · conflicts in src/cart.ts · would conflict with 1 clean candidate</text>
  <circle cx="62" cy="241" r="9" fill="#3d3d3a"/>
  <text x="62" y="245" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">4</text>
  <text x="84" y="284" font-size="12" fill="#5F5E5A">#005 and #006 conflict with each other</text>
  <circle cx="62" cy="280" r="9" fill="#3d3d3a"/>
  <text x="62" y="284" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">5</text>
  <circle cx="49" cy="336" r="9" fill="#3d3d3a"/>
  <text x="49" y="340" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">1</text>
  <text x="66" y="332" font-size="13" font-weight="500" fill="#3d3d3a">The order rule</text>
  <text x="66" y="347" font-size="12" fill="#73726c">five keys, or Merge presses with approval on</text>
  <circle cx="359" cy="336" r="9" fill="#3d3d3a"/>
  <text x="359" y="340" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">2</text>
  <text x="376" y="332" font-size="13" font-weight="500" fill="#3d3d3a">The holder</text>
  <text x="376" y="347" font-size="12" fill="#73726c">or "Airlock free"; phase in plain words</text>
  <circle cx="49" cy="380" r="9" fill="#3d3d3a"/>
  <text x="49" y="384" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">3</text>
  <text x="66" y="376" font-size="13" font-weight="500" fill="#3d3d3a">Why landings wait</text>
  <text x="66" y="391" font-size="12" fill="#73726c">only while something blocks them</text>
  <circle cx="359" cy="380" r="9" fill="#3d3d3a"/>
  <text x="359" y="384" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">4</text>
  <text x="376" y="376" font-size="13" font-weight="500" fill="#3d3d3a">Candidates in landing order</text>
  <text x="376" y="391" font-size="12" fill="#73726c">priority, forecast, harm to others</text>
  <circle cx="49" cy="424" r="9" fill="#3d3d3a"/>
  <text x="49" y="428" font-size="11" font-weight="500" fill="#FAF9F5" text-anchor="middle">5</text>
  <text x="66" y="420" font-size="13" font-weight="500" fill="#3d3d3a">Predicted conflicts</text>
  <text x="66" y="435" font-size="12" fill="#73726c">git's view of each pair</text>
</svg>
