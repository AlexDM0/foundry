<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A decision card asks, offers options and takes one answer</title>
  <desc>A schematic of a decision card. Its head gives the id, then kind, ticket, job and the role that asked. The question sits in a fieldset under a short header, with options lettered a and b. A free text box follows on a decision of one question, then the Answer button. A refusal appears beside the button, word for word.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="558" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A decision card asks, offers options and takes one answer</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A schematic of an open question with a synthetic ticket.</text>
  <rect x="40" y="88" width="600" height="312" rx="10" fill="#FFFFFF" stroke="#E1DDD0" stroke-width="1"/>
  <text x="84" y="114" font-size="14" fill="#3d3d3a" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">E12</text>
  <text x="84" y="134" font-size="12" fill="#5F5E5A">agent-question · ticket 003 · job J4 · asked by builder</text>
  <circle cx="62" cy="126" r="9" fill="#3d3d3a"/>
  <text x="62" y="130" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">1</text>
  <rect x="84" y="152" width="530" height="104" rx="6" fill="#FFFFFF" stroke="#E1DDD0" stroke-width="1"/>
  <rect x="96" y="144" width="62" height="16" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="100" y="156" font-size="12" fill="#3d3d3a" font-weight="500">Edit mode</text>
  <text x="100" y="180" font-size="13" fill="#3d3d3a">Double-click a role to edit it: in place, or in a dialog?</text>
  <circle cx="62" cy="216" r="9" fill="#3d3d3a"/>
  <text x="62" y="220" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">2</text>
  <circle cx="107" cy="206" r="5" fill="none" stroke="#73726c" stroke-width="1.2"/>
  <text x="120" y="210" font-size="12" fill="#3d3d3a">a. In place</text>
  <circle cx="107" cy="230" r="5" fill="none" stroke="#73726c" stroke-width="1.2"/>
  <text x="120" y="234" font-size="12" fill="#3d3d3a">b. In a dialog</text>
  <rect x="84" y="268" width="530" height="48" rx="6" fill="#FAF9F5" stroke="#E1DDD0" stroke-width="1"/>
  <circle cx="62" cy="292" r="9" fill="#3d3d3a"/>
  <text x="62" y="296" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">3</text>
  <text x="96" y="288" font-size="12" fill="#73726c">free text</text>
  <rect x="84" y="332" width="70" height="30" rx="6" fill="#FAF9F5" stroke="#73726c" stroke-width="1"/>
  <text x="119" y="352" font-size="12" fill="#3d3d3a" font-weight="500" text-anchor="middle">Answer</text>
  <circle cx="62" cy="347" r="9" fill="#3d3d3a"/>
  <text x="62" y="351" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">4</text>
  <text x="164" y="344" font-size="12" fill="#A32D2D">Decision E12 is already settled, and the first answer wins.</text>
  <text x="164" y="360" font-size="12" fill="#A32D2D">Nothing was written.</text>
  <circle cx="530" cy="352" r="9" fill="#3d3d3a"/>
  <text x="530" y="356" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">5</text>
  <circle cx="49" cy="430" r="9" fill="#3d3d3a"/>
  <text x="49" y="434" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">1</text>
  <text x="66" y="426" font-size="13" fill="#3d3d3a" font-weight="500">Who asks, about what</text>
  <text x="66" y="441" font-size="12" fill="#73726c">kind, ticket, job, asking role; escalation</text>
  <circle cx="359" cy="430" r="9" fill="#3d3d3a"/>
  <text x="359" y="434" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">2</text>
  <text x="376" y="426" font-size="13" fill="#3d3d3a" font-weight="500">Header and options</text>
  <text x="376" y="441" font-size="12" fill="#73726c">pick one, or tick several if allowed</text>
  <circle cx="49" cy="474" r="9" fill="#3d3d3a"/>
  <text x="49" y="478" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">3</text>
  <text x="66" y="470" font-size="13" fill="#3d3d3a" font-weight="500">Free text</text>
  <text x="66" y="485" font-size="12" fill="#73726c">only on a one-question decision</text>
  <circle cx="359" cy="474" r="9" fill="#3d3d3a"/>
  <text x="359" y="478" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">4</text>
  <text x="376" y="470" font-size="13" fill="#3d3d3a" font-weight="500">Answer</text>
  <text x="376" y="485" font-size="12" fill="#73726c">enabled once the form is complete</text>
  <circle cx="49" cy="518" r="9" fill="#3d3d3a"/>
  <text x="49" y="522" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">5</text>
  <text x="66" y="514" font-size="13" fill="#3d3d3a" font-weight="500">A refusal</text>
  <text x="66" y="529" font-size="12" fill="#73726c">the first answer wins; a later one reads this</text>
</svg>
