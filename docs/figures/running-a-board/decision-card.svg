<svg xmlns="http://www.w3.org/2000/svg" width="680" height="684" viewBox="0 0 680 684" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A decision card asks, offers options and takes one answer</title>
  <desc>A schematic of a decision card. Its head gives the id, then kind, ticket, job and the role that asked. The question sits in a fieldset under a short header, with options lettered a and b. Under each option, when the asking agent noted them, come what it touches, its trade-off and its effect on the Acceptance. A free text box follows on a decision of one question, then the Answer button. A refusal appears beside the button, word for word.</desc>
  <rect x="1" y="1" width="678" height="682" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A decision card asks, offers options and takes one answer</text>
  <text x="40" y="68" font-size="13" fill="#73726c">A schematic of an open question with a synthetic ticket.</text>
  <rect x="40" y="88" width="600" height="426" rx="10" fill="#FFFFFF" stroke="#E1DDD0" stroke-width="1"/>
  <text x="84" y="114" font-size="14" fill="#3d3d3a" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">E12</text>
  <text x="84" y="134" font-size="12" fill="#5F5E5A">agent-question · ticket 003 · job J4 · asked by builder</text>
  <circle cx="62" cy="126" r="9" fill="#3d3d3a"/>
  <text x="62" y="130" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">1</text>
  <rect x="84" y="152" width="530" height="218" rx="6" fill="#FFFFFF" stroke="#E1DDD0" stroke-width="1"/>
  <rect x="96" y="144" width="62" height="16" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="100" y="156" font-size="12" fill="#3d3d3a" font-weight="500">Edit mode</text>
  <text x="100" y="180" font-size="13" fill="#3d3d3a">Double-click a role to edit it: in place, or in a dialog?</text>
  <circle cx="62" cy="206" r="9" fill="#3d3d3a"/>
  <text x="62" y="210" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">2</text>
  <circle cx="107" cy="202" r="5" fill="none" stroke="#73726c" stroke-width="1.2"/>
  <text x="120" y="206" font-size="12" fill="#3d3d3a">a. In place</text>
  <text x="120" y="226" font-size="11" fill="#73726c">Touches</text>
  <rect x="196" y="214" width="159" height="17" rx="4" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="202" y="226" font-size="11" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">src/roles/RoleRow.tsx</text>
  <text x="120" y="244" font-size="11" fill="#73726c">Trade-off</text>
  <text x="196" y="244" font-size="11" fill="#3d3d3a">Quick; no room for a long note.</text>
  <text x="120" y="262" font-size="11" fill="#73726c">Acceptance</text>
  <text x="196" y="262" font-size="11" fill="#3d3d3a">A3 holds as written.</text>
  <circle cx="62" cy="244" r="9" fill="#3d3d3a"/>
  <text x="62" y="248" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">6</text>
  <circle cx="107" cy="284" r="5" fill="none" stroke="#73726c" stroke-width="1.2"/>
  <text x="120" y="288" font-size="12" fill="#3d3d3a">b. In a dialog</text>
  <text x="120" y="308" font-size="11" fill="#73726c">Touches</text>
  <rect x="196" y="296" width="180" height="17" rx="4" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="202" y="308" font-size="11" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">src/roles/RoleDialog.tsx</text>
  <rect x="382" y="296" width="159" height="17" rx="4" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="388" y="308" font-size="11" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">src/roles/RoleRow.tsx</text>
  <text x="120" y="326" font-size="11" fill="#73726c">Trade-off</text>
  <text x="196" y="326" font-size="11" fill="#3d3d3a">Room for notes; one more click.</text>
  <text x="120" y="344" font-size="11" fill="#73726c">Acceptance</text>
  <text x="196" y="344" font-size="11" fill="#3d3d3a">A3 changes: the dialog saves on its own button.</text>
  <rect x="84" y="382" width="530" height="48" rx="6" fill="#FAF9F5" stroke="#E1DDD0" stroke-width="1"/>
  <circle cx="62" cy="406" r="9" fill="#3d3d3a"/>
  <text x="62" y="410" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">3</text>
  <text x="96" y="402" font-size="12" fill="#73726c">free text</text>
  <rect x="84" y="446" width="70" height="30" rx="6" fill="#FAF9F5" stroke="#73726c" stroke-width="1"/>
  <text x="119" y="466" font-size="12" fill="#3d3d3a" font-weight="500" text-anchor="middle">Answer</text>
  <circle cx="62" cy="461" r="9" fill="#3d3d3a"/>
  <text x="62" y="465" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">4</text>
  <text x="164" y="458" font-size="12" fill="#A32D2D">Decision E12 is already settled, and the first answer wins.</text>
  <text x="164" y="474" font-size="12" fill="#A32D2D">Nothing was written.</text>
  <circle cx="530" cy="466" r="9" fill="#3d3d3a"/>
  <text x="530" y="470" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">5</text>
  <circle cx="49" cy="556" r="9" fill="#3d3d3a"/>
  <text x="49" y="560" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">1</text>
  <text x="66" y="552" font-size="13" fill="#3d3d3a" font-weight="500">Who asks, about what</text>
  <text x="66" y="567" font-size="12" fill="#73726c">kind, ticket, job, asking role; escalation</text>
  <circle cx="359" cy="556" r="9" fill="#3d3d3a"/>
  <text x="359" y="560" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">2</text>
  <text x="376" y="552" font-size="13" fill="#3d3d3a" font-weight="500">Header and options</text>
  <text x="376" y="567" font-size="12" fill="#73726c">pick one, or tick several if allowed</text>
  <circle cx="49" cy="600" r="9" fill="#3d3d3a"/>
  <text x="49" y="604" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">3</text>
  <text x="66" y="596" font-size="13" fill="#3d3d3a" font-weight="500">Free text</text>
  <text x="66" y="611" font-size="12" fill="#73726c">only on a one-question decision</text>
  <circle cx="359" cy="600" r="9" fill="#3d3d3a"/>
  <text x="359" y="604" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">4</text>
  <text x="376" y="596" font-size="13" fill="#3d3d3a" font-weight="500">Answer</text>
  <text x="376" y="611" font-size="12" fill="#73726c">enabled once the form is complete</text>
  <circle cx="49" cy="644" r="9" fill="#3d3d3a"/>
  <text x="49" y="648" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">5</text>
  <text x="66" y="640" font-size="13" fill="#3d3d3a" font-weight="500">A refusal</text>
  <text x="66" y="655" font-size="12" fill="#73726c">the first answer wins; a later one reads this</text>
  <circle cx="359" cy="644" r="9" fill="#3d3d3a"/>
  <text x="359" y="648" font-size="11" fill="#FAF9F5" font-weight="500" text-anchor="middle">6</text>
  <text x="376" y="640" font-size="13" fill="#3d3d3a" font-weight="500">What an option does</text>
  <text x="376" y="655" font-size="12" fill="#73726c">touches, trade-off, Acceptance, when noted</text>
</svg>
