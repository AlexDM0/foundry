<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Every ticket link lands on the Tickets tab</title>
  <desc>Seven tabs. Kanban links to its merge-queue view, whose lines link to a ticket. Progress links to a ticket from a chart row, a wave, an epic card and the finished list. All land on the detail panel at #tickets/&lt;id&gt; on the Tickets tab, inside its table view. Agents, Questions, Assistant and Intake link to no ticket.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="418" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Every ticket link lands on the Tickets tab</text>
  <text x="40" y="68" font-size="13" fill="#73726c">The detail panel exists only there, so following a ticket link changes tab.</text>
  <rect x="40" y="100" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="130.0" y="125.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Kanban</text>
  <text x="130.0" y="141.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#kanban</text>
  <rect x="40" y="206" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="130.0" y="231.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Merge queue view</text>
  <text x="130.0" y="247.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#kanban/merge-queue</text>
  <rect x="40" y="312" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="130.0" y="337.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Progress</text>
  <text x="130.0" y="353.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#progress</text>
  <path d="M130,156 L130,204" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="138" y="184" font-size="11" fill="#73726c">link above the lanes</text>
  <text x="130" y="279" font-size="11" fill="#73726c" text-anchor="middle">a queue line opens a ticket</text>
  <text x="130" y="385" font-size="11" fill="#73726c" text-anchor="middle">row label, wave ticket,</text>
  <text x="130" y="400" font-size="11" fill="#73726c" text-anchor="middle">epic card, finished list</text>
  <rect x="280" y="130" width="170" height="238" rx="12" fill="#F1EFE8" stroke="#73726c" stroke-width="2"/>
  <text x="365" y="154" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Tickets</text>
  <text x="365" y="172" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#tickets</text>
  <rect x="296" y="188" width="138" height="48" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="365.0" y="209.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">table</text>
  <text x="365.0" y="225.0" font-size="12" fill="#5F5E5A" text-anchor="middle">a row opens it</text>
  <rect x="296" y="274" width="138" height="62" rx="8" fill="#FAF9F5" stroke="#73726c" stroke-width="1"/>
  <text x="365" y="300" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Detail panel</text>
  <text x="365" y="318" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#tickets/&lt;id&gt;</text>
  <path d="M365,236 L365,272" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,234 C252,234 258,296 294,300" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,340 C250,340 262,318 294,316" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="365" y="385" font-size="11" fill="#73726c" text-anchor="middle">waiting-on links stay here</text>
  <rect x="498" y="100" width="142" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="569.0" y="125.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Agents</text>
  <text x="569.0" y="141.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#agents/&lt;job&gt;</text>
  <rect x="498" y="172" width="142" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="569.0" y="191.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Questions</text>
  <text x="569.0" y="207.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#questions</text>
  <rect x="498" y="232" width="142" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="569.0" y="251.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Assistant</text>
  <text x="569.0" y="267.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#assistant</text>
  <rect x="498" y="292" width="142" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="569.0" y="311.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Intake</text>
  <text x="569.0" y="327.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">#intake</text>
  <text x="569" y="353" font-size="11" fill="#73726c" text-anchor="middle">Own panels or none;</text>
  <text x="569" y="368" font-size="11" fill="#73726c" text-anchor="middle">no ticket links.</text>
</svg>
