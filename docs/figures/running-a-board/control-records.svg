<svg xmlns="http://www.w3.org/2000/svg" width="680" height="462" viewBox="0 0 680 462" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A control records a request; the Overseer acts on it</title>
  <desc>User clicks a control in the Bridge, which posts a control command to the Overseer. The Overseer checks and applies it to the stored board in one write. A refusal goes back and is shown beside the control, with nothing written. On success the fact is stored and the Overseer wakes a Pass, which reads the board and acts, launching or stopping work. The Bridge changes only when the next board update arrives on the event stream. Stop Overseer and Restart go to the Overseer itself and record nothing.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="460" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">A control records a request; the Overseer acts on it</text>
  <text x="40" y="68" font-size="13" fill="#73726c">One click, from the person to the stored board and back through the event stream.</text>
  <text x="128" y="98" font-size="13" fill="#633806" font-weight="500" text-anchor="middle">User, in the Bridge</text>
  <text x="340" y="98" font-size="13" fill="#0C447C" font-weight="500" text-anchor="middle">Overseer</text>
  <text x="558" y="98" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">Stored board</text>
  <path d="M228,86 L228,404" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
  <path d="M452,86 L452,404" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
  <rect x="40" y="112" width="176" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="128.0" y="135.0" font-size="13" fill="#633806" font-weight="500" text-anchor="middle">Clicks a control</text>
  <text x="128.0" y="152.0" font-size="12" fill="#854F0B" text-anchor="middle">Pause, Hold, Answer…</text>
  <rect x="252" y="112" width="176" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340.0" y="135.0" font-size="13" fill="#0C447C" font-weight="500" text-anchor="middle">Checks the command</text>
  <text x="340.0" y="152.0" font-size="12" fill="#185FA5" text-anchor="middle">under the tracker lock</text>
  <rect x="476" y="112" width="164" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="558.0" y="135.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">Fact stored</text>
  <text x="558.0" y="152.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the page shows it later</text>
  <path d="M216,138 L250,138" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M428,138 L474,138" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="194" width="176" height="52" rx="8" fill="#FCEBEB" stroke="#F3D2D2" stroke-width="1"/>
  <text x="128.0" y="217.0" font-size="13" fill="#791F1F" font-weight="500" text-anchor="middle">Refusal, word for word</text>
  <text x="128.0" y="234.0" font-size="12" fill="#A32D2D" text-anchor="middle">beside it; nothing written</text>
  <path d="M300,164 C300,190 260,220 218,220" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="306" y="200" font-size="11" fill="#73726c">refused</text>
  <rect x="252" y="258" width="176" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="340.0" y="281.0" font-size="13" fill="#0C447C" font-weight="500" text-anchor="middle">A Pass wakes</text>
  <text x="340.0" y="298.0" font-size="12" fill="#185FA5" text-anchor="middle">reads the board, acts</text>
  <path d="M400,164 L400,256" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="408" y="212" font-size="11" fill="#73726c">applied</text>
  <rect x="476" y="258" width="164" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="558.0" y="281.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">Effects recorded</text>
  <text x="558.0" y="298.0" font-size="12" fill="#5F5E5A" text-anchor="middle">jobs, moves, decisions</text>
  <path d="M428,284 L474,284" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="340" width="176" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="128.0" y="363.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">Bridge updates</text>
  <text x="128.0" y="380.0" font-size="12" fill="#5F5E5A" text-anchor="middle">the next board update</text>
  <path d="M340,310 C340,350 280,366 218,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="348" y="352" font-size="11" fill="#73726c">event stream</text>
  <text x="40" y="440" font-size="12" fill="#73726c">Stop Overseer and Restart skip this path: they go to the Overseer itself and record nothing.</text>
</svg>
