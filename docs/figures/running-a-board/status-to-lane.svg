<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A lane is a reading of stored facts, never a stored place</title>
  <desc>Eight stored cases map to seven Kanban lanes. draft to Drafts, pending to Ready, in-progress to Building, in-review to In review. An in-review ticket with the merge-queue mark jumps to Merge queue, because the mark beats the status. reviewed also sits in Merge queue. delivered to Done, abandoned to Abandoned. The pill column on the right is a separate reading of the same facts: Draft, To do, In progress, Awaiting review, Reviewing with its review bar open until it lands, Awaiting merge, Done and Abandoned.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="538" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A lane is a reading of stored facts, never a stored place</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Lane and pill are read from the stored facts separately; neither comes from the other.</text>
  <text x="40" y="98" font-size="13" font-weight="500" fill="#3d3d3a">Stored</text>
  <text x="280" y="98" font-size="13" font-weight="500" fill="#3d3d3a">Kanban lane</text>
  <text x="460" y="98" font-size="13" font-weight="500" fill="#3d3d3a">Pill on Tickets and the chart</text>
  <path d="M444,88 L444,526" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
  <rect x="40" y="110" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="137" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">draft</text>
  <rect x="280" y="110" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="137.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Drafts</text>
  <rect x="460" y="110" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="137.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Draft</text>
  <path d="M190,132 L278,132" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="162" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="189" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">pending</text>
  <rect x="280" y="162" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="189.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Ready</text>
  <rect x="460" y="162" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="181.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">To do</text>
  <text x="550.0" y="197.0" font-size="12" fill="#5F5E5A" text-anchor="middle">Waiting on the chart</text>
  <path d="M190,184 L278,184" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="214" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="241" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">in-progress</text>
  <rect x="280" y="214" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="241.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Building</text>
  <rect x="460" y="214" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="233.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">In progress</text>
  <text x="550.0" y="249.0" font-size="12" fill="#5F5E5A" text-anchor="middle">Paused if its row is</text>
  <path d="M190,236 L278,236" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="266" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="293" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <rect x="280" y="266" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="293.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">In review</text>
  <rect x="460" y="266" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="285.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Awaiting review</text>
  <text x="550.0" y="301.0" font-size="12" fill="#5F5E5A" text-anchor="middle">Reviewing while a review runs</text>
  <path d="M190,288 L278,288" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="318" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="337" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">in-review</text>
  <text x="52" y="353" font-size="12" fill="#5F5E5A">+ merge-queue mark</text>
  <rect x="460" y="318" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="337.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Reviewing</text>
  <text x="550.0" y="353.0" font-size="12" fill="#5F5E5A" text-anchor="middle">bar open until it lands</text>
  <path d="M190,340 L278,340" fill="none" stroke="#73726c" stroke-width="2.2" marker-end="url(#ah)"/>
  <rect x="40" y="370" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="397" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">reviewed</text>
  <rect x="460" y="370" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="397.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Awaiting merge</text>
  <path d="M190,392 L278,392" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="422" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="449" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">delivered</text>
  <rect x="280" y="422" width="140" height="44" rx="8" fill="#EAF3DE" stroke="#D3E6BC" stroke-width="1"/>
  <text x="350.0" y="449.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Done</text>
  <rect x="460" y="422" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="449.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Done</text>
  <path d="M190,444 L278,444" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="40" y="474" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="52" y="501" font-size="13" font-weight="500" fill="#444441" font-family="ui-monospace,Menlo,Consolas,monospace">abandoned</text>
  <rect x="280" y="474" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="501.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Abandoned</text>
  <rect x="460" y="474" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="550.0" y="501.0" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">Abandoned</text>
  <path d="M190,496 L278,496" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="280" y="318" width="140" height="96" rx="8" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="350.0" y="371.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Merge queue</text>
  <text x="234" y="322" font-size="11" fill="#3d3d3a" text-anchor="middle">mark beats status</text>
</svg>
