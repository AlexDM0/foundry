<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>You file and ready; the Overseer does the rest unless it asks</title>
  <desc>You file work on Intake and ready it on Kanban. The Overseer then launches AI agents that build and review the ticket, merges the result without being asked, and the ticket reaches Done. A dashed path drops to Questions only when an answer is needed, and the answer resumes the work. The header runs along the top as the thing you watch throughout.</desc>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/></marker></defs>
  <rect x="1" y="1" width="678" height="350" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">You file and ready; the Overseer does the rest unless it asks</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Left to right, one ticket. Amber is you, blue is the Overseer, coral the agents it launches.</text>
  <rect x="40" y="88" width="600" height="32" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="340.0" y="109.0" font-size="13" fill="#444441" font-weight="500" text-anchor="middle">The header: state, counts, notices</text>
  <rect x="232" y="150" width="296" height="96" rx="12" fill="#E6F1FB" stroke="#CFE2F6" stroke-width="1"/>
  <text x="380" y="170" font-size="12" fill="#185FA5" text-anchor="middle">The Overseer, unasked</text>
  <rect x="40" y="166" width="80" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="80.0" y="195.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">Intake</text>
  <text x="80.0" y="212.0" font-size="12" fill="#854F0B" text-anchor="middle">file</text>
  <rect x="140" y="166" width="80" height="64" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="180.0" y="195.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">Kanban</text>
  <text x="180.0" y="212.0" font-size="12" fill="#854F0B" text-anchor="middle">Ready</text>
  <rect x="244" y="184" width="84" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="286" y="211" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">Build</text>
  <rect x="338" y="184" width="84" height="44" rx="8" fill="#FAECE7" stroke="#F3D2C5" stroke-width="1"/>
  <text x="380" y="211" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle">Review</text>
  <rect x="432" y="184" width="84" height="44" rx="8" fill="#FAF9F5" stroke="#CFE2F6" stroke-width="1"/>
  <text x="474" y="211" font-size="14" fill="#0C447C" font-weight="500" text-anchor="middle">Merge</text>
  <path d="M328,206 L336,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M422,206 L430,206" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="556" y="166" width="84" height="64" rx="8" fill="#F1EFE8" stroke="#E1DDD0" stroke-width="1"/>
  <text x="598.0" y="203.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle">Done</text>
  <path d="M120,198 L138,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M220,198 L230,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M528,198 L554,198" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M350,246 L350,290" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="342" y="272" font-size="11" fill="#73726c" text-anchor="end">only when an answer is needed</text>
  <path d="M410,290 L410,248" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="418" y="272" font-size="11" fill="#73726c">answer resumes it</text>
  <rect x="290" y="292" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#F2DDB0" stroke-width="1"/>
  <text x="380.0" y="311.0" font-size="14" fill="#633806" font-weight="500" text-anchor="middle">Questions</text>
  <text x="380.0" y="328.0" font-size="12" fill="#854F0B" text-anchor="middle">answer</text>
</svg>
