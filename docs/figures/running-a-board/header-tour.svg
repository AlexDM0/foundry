<svg xmlns="http://www.w3.org/2000/svg" width="680" height="732" viewBox="0 0 680 732" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A missing header control does not apply at this moment</title>
  <desc>The Bridge header unfolded, with thirteen numbered callouts. Above it sit the banners, one banner per warning or notice, and the incident line. The title row holds the state with usage and the new-code line over the board name, Pause or Resume, Restart and Stop Overseer, then the statistics and the Waiting on User pill. Below it come the activity strip, one chip per job in a launch slot, and the tabs with their counts and the theme. Pause, Resume and Stop are offered unless the Overseer is handing over or down, Restart only with the new-code line. The banners, the warnings and notices, the incident line, the new-code line, Restart and the flag for tickets with no job come and go.</desc>
