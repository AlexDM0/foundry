<svg xmlns="http://www.w3.org/2000/svg" width="680" height="636" viewBox="0 0 680 636" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>A missing header control does not apply at this moment</title>
  <desc>The Bridge header in rows with eleven numbered callouts. A banner sits above it. Rows hold the board name and state, Pause or Resume, Restart and Stop Overseer, the new-code line, concurrency and usage, six statistics, tabs and theme, and warnings and notices. Pause, Resume and Stop are offered unless the Overseer is handing over or down, Restart only with the new-code line, Set only once the typed limit differs. The banner, the new-code line, and warnings and notices come and go.</desc>
