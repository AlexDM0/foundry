  <text x="40" y="46" font-size="18" fill="#3d3d3a" font-weight="500">The waves show what must finish first, and the red path sets the pace</text>
  <text x="40" y="68" font-size="13" fill="#73726c">Each ticket waits on something in the column to its left. Synthetic tickets.</text>
