<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The waves show what must finish first, and the red path sets the pace</title>
  <desc>A Done column, then Now, Wave 2 and Wave 3. Ticket 002 is running with a green outline and three tickets waiting on it. Ticket 004 sits alone in Wave 2 inside a red box, one at a time, so it is the bottleneck. A heavy red path runs 002, 004, 005 and sets the pace; thin gray lines are waits-on links; a dashed line shows work built on a finished ticket. Column heads carry the side-by-side count, the launch slot squares and an ETA estimate.</desc>
